<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Frog Hop</title>
<meta name="theme-color" content="#2f9e8f">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="description" content="Frog Hop: hop the frog along the number line by tens and ones to catch the flies. Grade 2 adding and subtracting on the number line in English.">
<link href="/fonts/fonts.css" rel="stylesheet">
<style>
:root{--ink:#1f3b3a;--muted:#5d7f7c;--brand:#2f9e8f;--bg:#eaf7f3;--line:#6b4a2b}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:Nunito,ui-rounded,"Trebuchet MS",Arial,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.wrap{max-width:560px;margin:0 auto;padding:10px 12px 20px;position:relative}
.top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.tbtn{background:#fff;border:1px solid #cde9e2;border-radius:13px;padding:8px 12px;color:var(--ink);text-decoration:none;font:inherit;font-weight:900;cursor:pointer}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.hud div{background:#fff;border-radius:14px;text-align:center;padding:4px;box-shadow:0 3px 0 #cde9e2}
.hud small{display:block;font-weight:800;color:var(--muted);font-size:.7rem}.hud b{font-family:Fredoka,sans-serif;font-size:1.35rem}
/* the pond: sky, water, the number line (a log) with the frog on it */
.stage{position:relative;height:max(290px,calc(100vh - 440px));border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#bfe8ff 0 34%,#5cc4b4 34% 100%);box-shadow:inset 0 -6px 0 rgba(0,0,0,.08)}
.decor{position:absolute;font-size:1.9rem;line-height:1;pointer-events:none}
.petBox{position:absolute;left:10px;top:8px;display:flex;align-items:flex-start;gap:6px;z-index:3;max-width:75%}
.pet{width:58px;height:58px;flex:none;display:flex;align-items:center;justify-content:center;font-size:2.4rem}.pet.cheer{animation:bob .5s 2}
@keyframes bob{50%{transform:translateY(-10px)}}
.bub{background:#fff;border-radius:14px;padding:6px 9px;font-weight:900;font-size:.8rem;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.lineBox{position:absolute;left:0;right:0;bottom:0;height:190px;overflow:hidden}
.strip{position:absolute;left:0;top:0;bottom:0;transition:transform .38s ease}
.log{position:absolute;bottom:46px;height:12px;border-radius:6px;background:linear-gradient(180deg,#9a6b3d,#6b4a2b)}
.tk{position:absolute;bottom:46px;width:2px;margin-left:-1px;height:8px;background:var(--line);transform:translateY(100%)}
.tk.m5{height:13px}.tk.m10{height:19px;width:3px;margin-left:-1.5px}
.lb{position:absolute;bottom:12px;transform:translateX(-50%);font-family:Fredoka,sans-serif;font-weight:700;font-size:.85rem;color:#123}
.lb.m10{font-size:1.05rem}
.arcs{position:absolute;left:0;bottom:58px;overflow:visible;pointer-events:none}
.arcs text{font-family:Fredoka,sans-serif;font-weight:700;font-size:15px}
.frog{position:absolute;bottom:52px;width:62px;margin-left:-31px;line-height:0;transition:left .38s ease;z-index:3}
.frog span{display:block;transform-origin:50% 100%}.frog svg{width:100%;height:auto;display:block;overflow:visible}.frog.hop span{animation:hop .38s ease}
@keyframes hop{50%{transform:translateY(-46px) scale(1.08)}}
.frog.splash span{animation:shake .4s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.frog .mO,.frog.open .mC{display:none}.frog.open .mO{display:inline}
.frog .pu{transition:transform .15s}.frog.look .pu{transform:translateY(-3px)}
.frog.chew span{animation:chew .55s ease}@keyframes chew{25%{transform:scale(1.1,.9)}50%{transform:scale(.95,1.06)}75%{transform:scale(1.06,.95)}}
.frog.chew .ck{opacity:1}.frog .ck{opacity:.55;transition:opacity .2s}
/* the tongue shoots up from the frog's mouth to the fly, and brings it back */
.tongue{position:absolute;width:9px;margin-left:-4.5px;height:0;border-radius:5px;background:#ff5d86;z-index:2;transition:height .17s ease-out}
.tongue:after{content:"";position:absolute;left:-4px;top:-6px;width:17px;height:13px;border-radius:50%;background:#ff5d86}
.tongue.off{display:none}
.fly{position:absolute;width:42px;margin-left:-21px;line-height:0;z-index:2;transition:bottom .25s ease-in,opacity .3s,transform .2s}
.fly svg{width:100%;height:auto;display:block;animation:buzz 1.1s ease-in-out infinite}
.fly .wg{transform-origin:50% 100%;animation:flap .12s linear infinite alternate}@keyframes flap{to{transform:scaleY(.55)}}
@keyframes buzz{50%{transform:translateY(-5px) rotate(6deg)}}
.fly.caught svg,.fly.caught .wg{animation:none}.fly.caught{transform:scale(.6)}.fly.gone{opacity:0}
.fly.away{bottom:400px!important;opacity:0;transition:bottom .9s ease-in,opacity .9s}
.fly.in{opacity:0;transform:translateY(-60px)}
.pin{position:absolute;bottom:58px;width:2px;margin-left:-1px;background:repeating-linear-gradient(180deg,#123 0 4px,transparent 4px 8px);opacity:.35}
.here{position:absolute;bottom:20px;transform:translateX(-50%);background:#ffe36e;border-radius:9px;padding:0 6px;font-family:Fredoka,sans-serif;font-weight:700;font-size:1rem;transition:left .38s ease;z-index:1}
.task{background:#fff;border-radius:18px;padding:9px 12px;margin-top:8px;text-align:center;font-weight:900;font-size:1.15rem;box-shadow:0 3px 0 #cde9e2}
.task .cn{display:block;font-size:.8rem;color:var(--muted);font-weight:800;margin-top:2px}.task b{font-family:Fredoka,sans-serif;font-size:1.35em;color:#1a7f72}
.pad{display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;gap:7px;margin-top:8px;align-items:stretch}
.hb{border:0;border-radius:16px;padding:12px 4px;font-family:Fredoka,sans-serif;font-weight:700;font-size:1.45rem;cursor:pointer;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.hb:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.hb.plus{background:#2fae6a}.hb.minus{background:#e0685a}.hb.big.plus{background:#1f8a52}.hb.big.minus{background:#c24f42}
.count{background:#fff;border-radius:16px;text-align:center;padding:4px 8px;box-shadow:0 3px 0 #cde9e2;min-width:62px}.count small{display:block;font-weight:800;color:var(--muted);font-size:.65rem}.count b{font-family:Fredoka,sans-serif;font-size:1.4rem}
.row2{display:grid;grid-template-columns:1fr 2fr;gap:7px;margin-top:7px}
.undo{border:0;border-radius:16px;background:#fff;font:inherit;font-weight:900;font-size:.95rem;white-space:nowrap;color:var(--ink);box-shadow:0 4px 0 #cde9e2;cursor:pointer;padding:10px}
.catch{border:0;border-radius:16px;background:#f5b301;color:#3b2a00;font:inherit;font-weight:900;font-size:1.2rem;box-shadow:0 5px 0 #b88a00;cursor:pointer;padding:10px}
.choices{display:none;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.choices button{border:0;border-radius:16px;background:#fff;font-family:Fredoka,sans-serif;font-weight:700;font-size:1.7rem;padding:12px 4px;box-shadow:0 5px 0 #cde9e2;cursor:pointer;color:var(--ink)}
.choices button.bad{background:#ffd6d0;animation:shake .4s}
.glow{animation:glow 1s ease-in-out infinite;outline:4px solid #ffe36e;outline-offset:2px}@keyframes glow{50%{transform:scale(.94)}}
.float{position:absolute;font-family:Fredoka,sans-serif;font-weight:700;font-size:1.5rem;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);pointer-events:none;animation:up 1.1s forwards;z-index:5}@keyframes up{to{transform:translateY(-50px);opacity:0}}
.over{position:absolute;inset:0;background:rgba(18,59,56,.84);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:16px;z-index:10;border-radius:0}
.over h2{font-family:Fredoka,sans-serif;margin:0 0 6px;font-size:1.9rem}.over p{margin:4px 0;font-weight:800}
.go{border:0;border-radius:999px;padding:13px 28px;font:inherit;font-weight:900;font-size:1.15rem;background:#f5b301;color:#3b2a00;box-shadow:0 5px 0 #b88a00;cursor:pointer;margin-top:12px}
.how{background:#fff;color:var(--ink);border-radius:16px;padding:10px 12px;font-weight:800;font-size:.92rem;text-align:left;margin-top:8px;max-width:380px}.how div{margin:4px 0}
.shop{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;max-width:380px;margin-top:10px}
.shop button{border:0;border-radius:14px;background:#fff;padding:6px 2px;font:inherit;font-weight:900;font-size:.75rem;color:var(--ink);cursor:pointer}.shop button i{display:block;font-style:normal;font-size:1.8rem}
.shop button.own{background:#d6f5e6}.shop button:disabled{opacity:.45;cursor:default}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:20}
/* fitted to the window (fit.js): the pond stretches to fill the screen */
.wrap.fitted{max-width:none;display:flex;flex-direction:column;overflow:hidden}
.wrap.fitted .stage{flex:1;height:auto;min-height:250px}
.wrap.fitted .lineBox{height:230px}.wrap.fitted .frog{width:78px;margin-left:-39px}.wrap.fitted .fly{width:52px;margin-left:-26px}.wrap.fitted .arcs text{font-size:20px}
.wrap.fitted .decor{font-size:2.6rem}.wrap.fitted .pet{width:76px;height:76px}.wrap.fitted .bub{font-size:.95rem}
@media(min-width:900px){.wrap.fitted .top,.wrap.fitted .hud,.wrap.fitted .bottom{width:100%;max-width:820px;margin-left:auto;margin-right:auto}.wrap.fitted .stage{width:100%}}
@media(max-height:620px){.stage{height:260px}.lineBox{height:170px}}
</style>
</head><body>
<script src="../pet-art.js?v=20261015b"></script><script src="../sightwords-prizes.js?v=20261104a"></script><script src="../game-prizes.js?v=20261128c"></script><script src="pet.js?v=20261128a"></script><script src="../game-progress.js?v=20261127a"></script><script src="fit.js?v=20261129b"></script><script src="levels.js?v=20261130a"></script>
<div class="wrap" id="wrap">
  <div class="top"><a class="tbtn" href="../index.html" id="home">← Home</a><b style="font-family:Fredoka,sans-serif;font-size:1.3rem">🐸 Frog Hop</b><span><button class="tbtn" type="button" id="helpBtn" aria-label="How to play">?</button> <button class="tbtn" type="button" id="soundBtn">🔔</button></span></div>
  <div class="hud"><div><small>Flies 虫子</small><b id="flies">0/8</b></div><div><small>Level 关</small><b id="day">1</b></div><div><small>Coins 金币</small><b id="coins">0</b></div></div>
  <div class="stage" id="stage">
    <div id="decor"></div>
    <div class="petBox"><div class="pet" id="pet"></div><div class="bub" id="bub">Let's hop! 一起跳吧！</div></div>
    <div class="lineBox" id="lineBox"><div class="strip" id="strip"></div></div>
  </div>
  <div class="bottom">
    <div class="task" id="task"></div>
    <div class="pad" id="pad">
      <button type="button" class="hb minus big" data-h="-10">−10</button><button type="button" class="hb minus" data-h="-1">−1</button>
      <div class="count"><small>Hops 跳了</small><b id="hops">0</b></div>
      <button type="button" class="hb plus" data-h="1">+1</button><button type="button" class="hb plus big" data-h="10">+10</button>
    </div>
    <div class="row2" id="row2"><button type="button" class="undo" id="undo">↩ Undo 撤回</button><button type="button" class="catch" id="catch">👅 Catch! 吃虫</button></div>
    <div class="choices" id="choices"></div>
  </div>
</div>
<canvas id="fx"></canvas>
<script>
(function(){
  "use strict";
  // Frog Hop (Grade 2, Unit 4: addition and subtraction on the number line). The frog sits on a number line and a fly hides on it.
  // The child hops the frog by tens and ones (later hundreds and tens) to where the fly is, then catches it:
  //   add    "The fly is at 34 + 25": hop there (the fly is hidden until the frog catches it on the right number)
  //   sub    "The fly is at 62 − 27"
  //   gap    the fly is shown at 72; hop to it, then say how far the frog hopped (47 + ? = 72)
  //   where  only the tens are labelled; what number is the fly on?
  // Fewest hops (using 30 − 1 for 29, say) and right the first time wins a golden fly. 8 flies a level; 6 or more opens the next level (any level opened can be played again).
  // The coins buy things for the pond. Level 2 adds subtracting, level 3 the gap and where-is-it flies, level 4 numbers to 1,000 (hops of 100 and 10).
  // Inside a level: the first flies are easy, a miss makes the next one easier, a run of right answers brings bigger jumps.
  var $=function(id){ return document.getElementById(id); };
  var STORE="frogHop.v1", S={day:1,coins:0,pond:{},tut:0,sound:true};
  try{ var s0=JSON.parse(localStorage.getItem(STORE)); if(s0) for(var k in s0) S[k]=s0[k]; }catch(e){}
  function save(){ try{ localStorage.setItem(STORE,JSON.stringify(S)); }catch(e){} }
  var GOAL=8, D=null, Q=null, busy=false, lastMiss=false, L=S.day;   // L: the level being played (S.day: the highest level opened)
  function rnd(n){ return Math.floor(Math.random()*n); }
  // ---------- sound ----------
  var actx=null;
  function tone(fs,len,type){ if(!S.sound) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); fs.forEach(function(f,i){ var t=actx.currentTime+i*len*.7, o=actx.createOscillator(), g=actx.createGain(); o.type=type||"triangle"; o.frequency.value=f; g.gain.setValueAtTime(.13,t); g.gain.exponentialRampToValueAtTime(.001,t+len); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+len+.02); }); }catch(e){} }
  $("soundBtn").onclick=function(){ S.sound=!S.sound; $("soundBtn").textContent=S.sound?"🔔":"🔕"; save(); };
  $("soundBtn").textContent=S.sound?"🔔":"🔕";
  try{ if(window.self!==window.top) $("home").style.visibility="hidden"; }catch(e){}
  // ---------- the pet ----------
  var pet=window.MathPet?MathPet.get():null;
  $("pet").innerHTML=pet?MathPet.pic(pet,"happy",76):"🐣";
  function say(t){ $("bub").innerHTML=t; var p=$("pet"); p.classList.remove("cheer"); void p.offsetWidth; p.classList.add("cheer"); }
  // ---------- the pond's things, bought with coins ----------
  var DECOR=[{id:"lotus",e:"🪷",n:"Lotus",p:6,x:"62%",y:"27%"},{id:"duck",e:"🦆",n:"Duck",p:10,x:"78%",y:"25%"},{id:"turtle",e:"🐢",n:"Turtle",p:14,x:"46%",y:"27%"},{id:"fish",e:"🐟",n:"Fish",p:18,x:"92%",y:"28%"},
    {id:"butterfly",e:"🦋",n:"Butterfly",p:22,x:"70%",y:"8%"},{id:"tree",e:"🌳",n:"Tree",p:26,x:"88%",y:"6%"},{id:"rainbow",e:"🌈",n:"Rainbow",p:32,x:"52%",y:"5%"},{id:"swan",e:"🦢",n:"Swan",p:40,x:"30%",y:"25%"}];
  function drawDecor(){
    $("decor").innerHTML='<span class="decor" style="left:84%;top:10%">☀️</span><span class="decor" style="left:36%;top:12%;opacity:.85">☁️</span>'+
      DECOR.filter(function(d){ return S.pond[d.id]; }).map(function(d){ return '<span class="decor" style="left:'+d.x+';top:'+d.y+'">'+d.e+'</span>'; }).join("");
  }
  // ---------- a fly (a question) ----------
  function opt(d){ d=Math.abs(d); var t=Math.floor(d/10), o=d%10; return Math.min(t+o, o?t+1+(10-o):t); }   // fewest hops of 10 and 1 for a distance d
  function gen(){
    var types=["add"]; if(L>=2) types.push("sub"); if(L>=3) types.push("gap","where");
    if(L>=2&&D.n<3) types=["add","sub"];
    var easy=lastMiss||D.n<3, hard=!easy&&D.streak>=3;
    var t=types[rnd(types.length)], step=(L>=4&&!easy&&Math.random()<.45)?10:1, a, d;
    var q={type:t,step:step,hops:0,tries:0,path:[]};
    if(t==="add"){ d=easy?11+rnd(12):hard?25+rnd(22):11+rnd(36); a=3+rnd(Math.min(55,96-d)); q.start=a; q.target=a+d; }
    else if(t==="sub"){ d=easy?11+rnd(12):hard?25+rnd(22):11+rnd(36); a=d+3+rnd(96-d-3); q.start=a; q.target=a-d; }
    else if(t==="gap"){ d=12+rnd(easy?14:30); a=3+rnd(96-d-3); q.start=a; q.target=a+d; }
    else { do{ q.target=12+rnd(80); }while(q.target%10===0); q.start=Math.floor(q.target/10)*10-10+rnd(5); if(q.target-q.start<6) q.start-=5; }
    if(!S.tut&&D.first&&L===1){ q={type:"add",step:1,hops:0,tries:0,path:[],start:20,target:32,tut:true}; }
    q.pos=q.start; return q;
  }
  function num(v){ return v*Q.step; }
  // the frog: a closed smile (mC) or an open mouth (mO); the pupils look up (pu); pink cheeks (ck)
  var FROG='<svg viewBox="0 0 100 84"><ellipse cx="18" cy="76" rx="16" ry="7" fill="#3f9e3d" stroke="#245f25" stroke-width="3"/><ellipse cx="82" cy="76" rx="16" ry="7" fill="#3f9e3d" stroke="#245f25" stroke-width="3"/>'+
    '<ellipse cx="50" cy="56" rx="40" ry="25" fill="#5cc25a" stroke="#245f25" stroke-width="3"/><ellipse cx="50" cy="66" rx="24" ry="12" fill="#c9f0a8"/>'+
    '<circle cx="29" cy="27" r="15" fill="#5cc25a" stroke="#245f25" stroke-width="3"/><circle cx="71" cy="27" r="15" fill="#5cc25a" stroke="#245f25" stroke-width="3"/>'+
    '<circle cx="29" cy="26" r="9.5" fill="#fff"/><circle cx="71" cy="26" r="9.5" fill="#fff"/><g class="pu"><circle cx="30" cy="27" r="5" fill="#1d2b22"/><circle cx="70" cy="27" r="5" fill="#1d2b22"/><circle cx="31.5" cy="25" r="1.6" fill="#fff"/><circle cx="71.5" cy="25" r="1.6" fill="#fff"/></g>'+
    '<ellipse class="ck" cx="20" cy="54" rx="6" ry="4" fill="#ff8fa3"/><ellipse class="ck" cx="80" cy="54" rx="6" ry="4" fill="#ff8fa3"/>'+
    '<path class="mC" d="M33 49Q50 61 67 49" fill="none" stroke="#245f25" stroke-width="3.2" stroke-linecap="round"/>'+
    '<g class="mO"><ellipse cx="50" cy="51" rx="15" ry="11" fill="#7a1733" stroke="#245f25" stroke-width="3"/><ellipse cx="50" cy="56" rx="9" ry="4.5" fill="#ff5d86"/></g></svg>';
  var FLY='<svg viewBox="0 0 44 36"><g class="wg"><ellipse cx="14" cy="9" rx="9" ry="7" fill="rgba(200,235,255,.85)" stroke="#6aa6c8" stroke-width="1.5"/><ellipse cx="30" cy="9" rx="9" ry="7" fill="rgba(200,235,255,.85)" stroke="#6aa6c8" stroke-width="1.5"/></g>'+
    '<ellipse cx="22" cy="22" rx="11" ry="9" fill="#3b3f4a"/><path d="M14 21h16M15 26h14" stroke="#5c6270" stroke-width="2"/><circle cx="14" cy="18" r="5" fill="#d6394e"/><circle cx="30" cy="18" r="5" fill="#d6394e"/><circle cx="15" cy="17" r="1.6" fill="#fff"/><circle cx="31" cy="17" r="1.6" fill="#fff"/></svg>';
  function fitted(){ return $("wrap").classList.contains("fitted"); }
  function flyB(){ return fitted()?190:150; }     // how high the fly hovers
  function mouthB(){ return fitted()?80:72; }     // how high the frog's mouth is
  // ---------- drawing the number line ----------
  var U=30, M=40;   // pixels for one step, and the margin at each end
  function X(v){ return M+v*U; }
  function drawLine(){
    var box=$("lineBox"), w=box.clientWidth||360;
    U=Math.max(18,Math.min(46,Math.round(w/22)));
    if(Q.type==="gap"||Q.type==="where") U=Math.max(10,Math.min(U,Math.floor((w-120)/Math.max(1,Math.abs(Q.target-Q.start)))));   // the frog and the fly both fit on the screen
    var all=U>=30, five=U>=16, h='<div class="log" style="left:'+(M-14)+'px;width:'+(100*U+28)+'px"></div>';
    for(var v=0;v<=100;v++){
      var m=v%10===0?" m10":v%5===0?" m5":"";
      h+='<i class="tk'+m+'" style="left:'+X(v)+'px"></i>';
      var lab=Q.type==="where"||!five?v%10===0:(all||v%5===0);
      if(lab) h+='<span class="lb'+m+'" style="left:'+X(v)+'px">'+(v*Q.step)+'</span>';
    }
    h+='<svg class="arcs" id="arcs" width="'+(X(100)+M)+'" height="120" viewBox="0 -120 '+(X(100)+M)+' 120" style="height:120px"></svg>';
    h+='<div class="tongue off" id="tongue"></div><div class="frog" id="frog" style="left:'+X(Q.pos)+'px"><span>'+FROG+'</span></div>';
    if(Q.type==="gap"||Q.type==="where") h+='<i class="pin" id="pin" style="left:'+X(Q.target)+'px;height:'+(flyB()-58)+'px"></i><div class="fly" id="fly" style="left:'+X(Q.target)+'px;bottom:'+flyB()+'px">'+FLY+'</div>';
    $("strip").style.width=(X(100)+M)+"px"; $("strip").innerHTML=h;
    drawArcs(); camera(true);
  }
  function drawArcs(){
    var s="";
    Q.path.forEach(function(p){
      var x1=X(p[0]), x2=X(p[1]), mx=(x1+x2)/2, hh=Math.min(70,14+Math.abs(x2-x1)*.22), up=p[1]>p[0], c=up?"#1f8a52":"#c24f42";
      s+='<path d="M'+x1+' 0 Q'+mx+' '+(-hh*2)+' '+x2+' 0" fill="none" stroke="'+c+'" stroke-width="3" stroke-dasharray="'+(up?"0":"0")+'"/><text x="'+mx+'" y="'+(-hh-6)+'" text-anchor="middle" fill="'+c+'">'+(up?"+":"−")+Math.abs(p[1]-p[0])*Q.step+'</text>';
    });

  function camera(now){

      var gap=Q.target-Q.pos, room=(w-140)/U;

    var st=$("strip"); if(now){ st.style.transition="none"; } st.style.transform="translateX("+tx+"px)"; if(now){ void st.offsetWidth; st.style.transition=""; }
  }
  // ---------- the task card and the buttons ----------
  function drawTask(){
    var t=Q.type, a=num(Q.start), d=Math.abs(num(Q.target-Q.start)), h;
    if(t==="add") h='The fly is at <b>'+a+' + '+d+'</b>. Hop there and catch it!<span class="cn">青蛙在 '+a+'，虫子在 '+a+' + '+d+' 的地方。跳过去吃掉它！</span>';
    else if(t==="sub") h='The fly is at <b>'+a+' − '+d+'</b>. Hop there and catch it!<span class="cn">青蛙在 '+a+'，虫子在 '+a+' − '+d+' 的地方。跳过去吃掉它！</span>';

  // gap: how far did the frog hop?
  function askGap(){

    say("You reached the fly! How far was that? 跳到啦！一共跳了多远？");
    showChoices();
  }
  function showChoices(){
    var right=Q.type==="gap"?Q.target-Q.start:Q.target, opts=[right], c=[right+1,right-1,right+10,right-10,right+2];
    c.forEach(function(v){ if(opts.length<3&&v>0&&v<100&&opts.indexOf(v)<0&&!(Q.type==="where"&&v%10===0)) opts.push(v); });
    opts.sort(function(){ return Math.random()-.5; });

      if(Q.tries>=2) return reveal();
      say(Q.type==="gap"?"Add up the hops again. 再把每一跳加一加。":"Count on from the ten before it. 从前面的整十数往后数。");
    }; });
  }
  // where: the right number makes the frog hop there (tens, then ones) and catch the fly
  function hopTo(){
    busy=true; Q.done=true; $("choices").style.display="none";
    var seq=[], p=Q.pos; while(Q.target-p>=10){ seq.push(10); p+=10; } while(p<Q.target){ seq.push(1); p++; }
    var i=0; (function next(){
      if(i>=seq.length){ busy=false; Q.done=false; return win(); }

    })();
  }
  // the fly (buzzing in first when it was hidden); the frog looks up, opens its mouth, the tongue shoots up, grabs the fly and pulls it in; chew, gulp
  function showFly(){
    var fl=$("fly");
    if(!fl){ $("strip").insertAdjacentHTML("beforeend",'<div class="fly in" id="fly" style="left:'+X(Q.target)+'px;bottom:'+flyB()+'px">'+FLY+'</div>'); fl=$("fly"); void fl.offsetWidth; fl.classList.remove("in"); return 380; }
    return 0;
  }
  function tongue(to,cb){   // shoot the tongue up to the height "to" (from the frog's mouth), then pull it back
    var f=$("frog"), t=$("tongue"), mb=mouthB();
    f.classList.add("look","open"); t.style.left=f.style.left; t.style.bottom=mb+"px"; t.style.height="0"; t.classList.remove("off"); void t.offsetWidth;

  }
  function eatFly(){
    var wait=showFly();
    setTimeout(function(){
      var fl=$("fly"), pin=$("pin"), fb=flyB();
      tongue(fb+20,function(mb){ if(pin) pin.style.display="none"; fl.classList.add("caught"); fl.style.bottom=(mb-10)+"px"; });
      setTimeout(function(){ fl.classList.add("gone"); var f=$("frog"); f.classList.remove("chew"); void f.offsetWidth; f.classList.add("chew"); tone([300,180],.12,"sine"); },680);
    },wait+80);
  }

    setTimeout(function(){ var fl=$("fly"), pin=$("pin"); if(pin) pin.style.display="none"; fl.classList.add("away"); },wait+500);
  }
  function win(){
    Q.done=true; busy=true; eatFly();
    var hopQ=Q.type!=="where", gold=hopQ&&!Q.tries&&Q.hops<=opt(Q.target-Q.start), coins=3+(gold?2:0);
    D.caught++; D.streak++; if(gold) D.gold++; D.coins+=coins; S.coins+=coins; lastMiss=false; save();

  function hud(){ $("flies").textContent=D.caught+"/"+GOAL; $("day").textContent=L; $("coins").textContent=S.coins; }

      var own=S.pond[d.id]; return '<button type="button" data-id="'+d.id+'" class="'+(own?"own":"")+'"'+(!own&&S.coins<d.p?" disabled":"")+'><i>'+d.e+'</i>'+(own?"✓":d.p+" 🪙")+'</button>'; }).join("")+'</div>';
