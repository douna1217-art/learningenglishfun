<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shape Sorter</title>
<meta name="theme-color" content="#2f7fc8">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="description" content="Shape Sorter: find the quadrilaterals, name squares, rectangles, rhombuses and trapezoids, count right angles and solve shape riddles. Grade 3 math in English.">
<link href="/fonts/fonts.css" rel="stylesheet">
</head><body>
<script src="../game-progress.js?v=20261127a"></script><script src="fit.js?v=20261129b"></script><script src="engine.js"></script>
<script>
(function(){
  "use strict";
  var M=MathGame, pickOne=M.pickOne, rnd=M.rnd;
  function Q(kind,d){ d.kind=kind; d.key=kind+"|"+JSON.stringify(d); return d; }
  function fromKey(k){ var i=k.indexOf("|"); var d=JSON.parse(k.slice(i+1)); d.key=k; return d; }

  // ---------- the shapes ----------
  // corners in a 120 x 120 box; rt: the corners that are right angles
  var SH={
    square:{n:"square",sides:4,pts:[[22,22],[98,22],[98,98],[22,98]],rt:[0,1,2,3],eq:true},
    rectangle:{n:"rectangle",sides:4,pts:[[8,32],[112,32],[112,88],[8,88]],rt:[0,1,2,3],eq:false},
    rhombus:{n:"rhombus",sides:4,pts:[[60,8],[104,60],[60,112],[16,60]],rt:[],eq:true},
    parallelogram:{n:"parallelogram",sides:4,pts:[[36,30],[112,30],[84,92],[8,92]],rt:[],eq:false},
    trapezoid:{n:"trapezoid",sides:4,pts:[[38,30],[82,30],[112,92],[8,92]],rt:[],eq:false},
    righttrap:{n:"trapezoid",sides:4,pts:[[18,28],[78,28],[110,92],[18,92]],rt:[0,3],eq:false},
    quad:{n:"quadrilateral",sides:4,pts:[[14,26],[96,14],[110,92],[30,106]],rt:[],eq:false},
    triangle:{n:"triangle",sides:3,pts:[[60,12],[110,102],[10,102]],rt:[],eq:false},
    pentagon:{n:"pentagon",sides:5,pts:poly(5),rt:[],eq:true},
    hexagon:{n:"hexagon",sides:6,pts:poly(6),rt:[],eq:true},
    circle:{n:"circle",sides:0,pts:[],rt:[],eq:false}
  };
  function poly(n){ var a=[]; for(var i=0;i<n;i++){ var t=-Math.PI/2+i*2*Math.PI/n; a.push([60+50*Math.cos(t),62+50*Math.sin(t)]); } return a; }
  var QUADS=["square","rectangle","rhombus","parallelogram","trapezoid","righttrap","quad"], NOTQ=["triangle","pentagon","hexagon","circle"];
  var COLS=["#5fb7d4","#f5b301","#7cc47f","#e8916d","#a493d6","#ff8fb1"];
  function shapeSvg(id,size,col,marks){
    var s=SH[id], c=col||COLS[0], h='<svg viewBox="0 0 120 120" width="'+size+'" height="'+size+'" style="display:block;margin:auto">';
    if(id==="circle") h+='<circle cx="60" cy="60" r="48" fill="'+c+'" stroke="#1f3a5a" stroke-width="4"/>';
    else h+='<polygon points="'+s.pts.map(function(p){ return p[0].toFixed(1)+","+p[1].toFixed(1); }).join(" ")+'" fill="'+c+'" stroke="#1f3a5a" stroke-width="4" stroke-linejoin="round"/>';
    if(marks) s.rt.forEach(function(i){ var p=s.pts[i], a=s.pts[(i+1)%s.pts.length], b=s.pts[(i+s.pts.length-1)%s.pts.length];
      var u=[(a[0]-p[0]),(a[1]-p[1])], v=[(b[0]-p[0]),(b[1]-p[1])], lu=Math.hypot(u[0],u[1]), lv=Math.hypot(v[0],v[1]); u=[u[0]/lu*11,u[1]/lu*11]; v=[v[0]/lv*11,v[1]/lv*11];
      h+='<path d="M'+(p[0]+u[0])+" "+(p[1]+u[1])+" L"+(p[0]+u[0]+v[0])+" "+(p[1]+u[1]+v[1])+" L"+(p[0]+v[0])+" "+(p[1]+v[1])+'" fill="none" stroke="#c0392b" stroke-width="3"/>'; });
    return h+'</svg>';
  }

  // ---------- the questions ----------
  var NAMES=["square","rectangle","rhombus","trapezoid","parallelogram"];
  function quadQ(){ var not=Math.random()<.4, pick; if(not){ pick=M.shuffle(QUADS.slice()).slice(0,3).concat([pickOne(NOTQ)]); } else { pick=M.shuffle(NOTQ.slice()).slice(0,3).concat([pickOne(QUADS)]); }
    return Q("quad",{s:M.shuffle(pick),not:not?1:0,c:rnd(6)}); }
  function nameQ(){ return Q("name",{s:pickOne(["square","rectangle","rhombus","trapezoid","righttrap","parallelogram"]),c:rnd(6)}); }
  function rightQ(){ return Q("right",{s:pickOne(["square","rectangle","rhombus","trapezoid","righttrap","parallelogram","triangle"]),c:rnd(6)}); }
  function equalQ(){ return Q("equal",{s:pickOne(["square","rectangle","rhombus","trapezoid","parallelogram","rectangle","square","rhombus"]),c:rnd(6)}); }
  var FACTS=[["A square is a rectangle.",1,"A rectangle has 4 right angles. A square has 4 right angles too, so a square is a special rectangle."],
    ["Every rectangle is a square.",0,"A square needs 4 equal sides. Many rectangles have 2 long sides and 2 short sides, so they are not squares."],
    ["A square is a rhombus.",1,"A rhombus has 4 equal sides. A square has 4 equal sides too, so a square is a special rhombus."],
    ["A rhombus always has 4 right angles.",0,"A rhombus has 4 equal sides, but its corners are usually not square corners. Only a square is both."],
    ["A rectangle has 4 right angles.",1,"Yes: every corner of a rectangle is a square corner (a right angle)."],
    ["A trapezoid has 4 right angles.",0,"A trapezoid has one pair of sides that go the same way. It cannot have 4 right angles."],
    ["All quadrilaterals have 4 sides.",1,"Quad means four: every quadrilateral has 4 sides and 4 corners."],
    ["A triangle is a quadrilateral.",0,"A triangle has only 3 sides. A quadrilateral needs 4."],
    ["A rhombus has 4 equal sides.",1,"Yes: all 4 sides of a rhombus are the same length."],
    ["Some rectangles are squares.",1,"A rectangle with 4 equal sides is a square, so some rectangles are squares."],
    ["A pentagon is a quadrilateral.",0,"A pentagon has 5 sides. A quadrilateral has exactly 4."],
    ["A square has 4 equal sides and 4 right angles.",1,"Yes: that is exactly what makes a square."]];
  function truthQ(){ return Q("truth",{f:rnd(FACTS.length)}); }
  var RIDDLES=[["I have 4 sides. All my sides are the same length. All my corners are right angles.","square"],
    ["I have 4 sides. All my sides are the same length, but I have no right angles.","rhombus"],
    ["I have 4 right angles. Two of my sides are long and two are short.","rectangle"],
    ["I have 4 sides. Only one pair of my sides goes the same way.","trapezoid"],
    ["I have 4 sides. My opposite sides go the same way and are the same length, but I have no right angles and my sides are not all equal.","parallelogram"],
    ["I have only 3 sides and 3 corners. I am not a quadrilateral.","triangle"],
    ["I am a quadrilateral that is also a rectangle and also a rhombus.","square"]];
  function riddleQ(){ return Q("riddle",{r:rnd(RIDDLES.length)}); }
  // ---------- hands-on play: sorting into baskets, a pegboard, tapping corners ----------
  var board=null;   // the pegboard of the question on the screen
  function esortQ(){ var eq=M.shuffle(["square","rhombus"]), no=M.shuffle(["rectangle","trapezoid","parallelogram","quad"]), k=1+rnd(3);
    return Q("esort",{s:M.shuffle(eq.slice(0,Math.min(k,2)).concat(no.slice(0,4-Math.min(k,2)))),c:rnd(6)}); }
  // which basket a shape belongs in: 0 = the left one
  function basketOf(q,id){ return q.kind==="quad" ? (SH[id].sides===4?0:1) : (SH[id].eq?0:1); }
  function sortGame(q,ui){
    var B=q.kind==="quad"?[["Quadrilateral","四边形 · 4 sides"],["Not a quadrilateral","不是四边形"]]:[["All 4 sides equal","四条边都相等"],["Not all equal","边不都相等"]];
    ui.task(q.kind==="quad"?"Drag each shape into the right basket. <small>把每个图形拖进正确的篮子</small>":"Are all the sides the same length? Sort the shapes! <small>四条边一样长吗？分一分</small>");
    var h='<div class="tray">'+q.s.map(function(id,i){ return '<div class="piece" data-i="'+i+'" tabindex="0" role="button" aria-label="'+SH[id].n+'">'+shapeSvg(id,70,COLS[(i+q.c)%6])+'</div>'; }).join("")+'</div><div class="baskets">'+
      B.map(function(b,i){ return '<div class="basket" data-b="'+i+'"><b>'+b[0]+'</b><small>'+b[1]+'</small><div class="in"></div></div>'; }).join("")+'</div>';
    var f=ui.stage(h), left=q.s.length, sel=null;
    function drop(p,b){
      if(ui.locked()) return;
      var id=q.s[+p.dataset.i];
      if(basketOf(q,id)!==b){ p.classList.add("bad"); f.querySelectorAll(".basket")[b].querySelector(".in").appendChild(p); p.style.transform=""; ui.answer("x:"+id); return; }
      p.classList.remove("sel"); p.classList.add("done"); p.style.transform=""; f.querySelectorAll(".basket")[b].querySelector(".in").appendChild(p); blip(700,.12);
      if(--left===0) ui.answer("ok");
    }
    [].forEach.call(f.querySelectorAll(".piece"),function(p){
      drag(p,function(x,y){ var el=hit(p,x,y,".basket"); if(el) drop(p,+el.dataset.b); else p.style.transform=""; });
      p.addEventListener("click",function(){ if(p.classList.contains("done")||ui.locked()) return; if(sel) sel.classList.remove("sel"); sel=p; p.classList.add("sel"); });
    });
    [].forEach.call(f.querySelectorAll(".basket"),function(b){ b.addEventListener("click",function(){ if(sel&&!sel.classList.contains("done")){ var p=sel; sel=null; drop(p,+b.dataset.b); } }); });
  }
  // follow a finger (or the mouse); end(x, y) where it was let go. A tap without moving is left to the click handler.
  function drag(el,end){
    var sx=0,sy=0,on=false,moved=false;
    el.addEventListener("pointerdown",function(e){ if(el.classList.contains("done")) return; on=true; moved=false; sx=e.clientX; sy=e.clientY; try{ el.setPointerCapture(e.pointerId); }catch(_){} });
    el.addEventListener("pointermove",function(e){ if(!on) return; var dx=e.clientX-sx, dy=e.clientY-sy; if(!moved&&Math.abs(dx)+Math.abs(dy)<8) return; moved=true; el.classList.add("lift"); el.style.transform="translate("+dx+"px,"+dy+"px) scale(1.1)"; });
    function up(e){ if(!on) return; on=false; el.classList.remove("lift"); if(moved){ end(e.clientX,e.clientY); } }
    el.addEventListener("pointerup",up); el.addEventListener("pointercancel",function(){ on=false; el.classList.remove("lift"); el.style.transform=""; });
  }
  function hit(el,x,y,sel){ el.style.visibility="hidden"; var t=document.elementFromPoint(x,y); el.style.visibility=""; return t&&t.closest?t.closest(sel):null; }

  // the pegboard: 4 pegs on a 7 x 7 grid joined by a rubber band
  var GRID=6, STEP=36, PAD=22;
  function sub(a,b){ return [a[0]-b[0],a[1]-b[1]]; }
  function cross(a,b){ return a[0]*b[1]-a[1]*b[0]; }
  function dot(a,b){ return a[0]*b[0]+a[1]*b[1]; }
  function crosses(a,b,c,d){ var d1=cross(sub(b,a),sub(c,a)),d2=cross(sub(b,a),sub(d,a)),d3=cross(sub(d,c),sub(a,c)),d4=cross(sub(d,c),sub(b,c)); return d1*d2<0&&d3*d4<0; }
  // what the band makes: {ok:false, why} when it is not a proper 4-sided shape, else its right angles, equal sides and parallel sides
  function measure(P){
    for(var i=0;i<4;i++) for(var j=i+1;j<4;j++) if(P[i][0]===P[j][0]&&P[i][1]===P[j][1]) return {ok:false,why:"Two pegs are on the same dot."};
    var v=[0,1,2,3].map(function(i){ return sub(P[(i+1)%4],P[i]); });
    for(i=0;i<4;i++) if(cross(v[(i+3)%4],v[i])===0) return {ok:false,why:"Three pegs are in a straight line: that makes only 3 sides."};
    if(crosses(P[0],P[1],P[2],P[3])||crosses(P[1],P[2],P[3],P[0])) return {ok:false,why:"The band crosses itself. Move a peg so it makes one shape."};
    var len=v.map(function(x){ return dot(x,x); }), rt=[0,1,2,3].filter(function(i){ return dot(v[(i+3)%4],v[i])===0; }),
      par=(cross(v[0],v[2])===0?1:0)+(cross(v[1],v[3])===0?1:0), eq=len[0]===len[1]&&len[1]===len[2]&&len[2]===len[3];
    return {ok:true,rt:rt,eq:eq,par:par,len:len};
  }
  // the most exact name of what was built
  function nameOf(m){ if(m.rt.length===4) return m.eq?"square":"rectangle"; if(m.eq) return "rhombus"; if(m.par===2) return "parallelogram"; if(m.par===1) return "trapezoid"; return "quadrilateral"; }
  // does it count as the shape asked for? (a square is also a rectangle, a rhombus and a parallelogram)
  function fits(m,want){ var n=nameOf(m); if(want==="quadrilateral") return true; if(want==="rectangle") return m.rt.length===4; if(want==="rhombus") return m.eq; if(want==="parallelogram") return m.par===2; return n===want; }
  function buildGame(q,ui){
    var want=SH[q.s].n, c=COLS[q.c||0];
    ui.task("Build a <b>"+want+"</b> on the pegboard! <small>在钉板上拉出一个"+({square:"正方形",rectangle:"长方形",rhombus:"菱形",trapezoid:"梯形",parallelogram:"平行四边形"}[want]||"四边形")+"</small>");
    var f=ui.stage('<div class="geo"><svg viewBox="0 0 260 260" id="geoSvg"></svg></div><div class="geoMsg" id="geoMsg">Drag the 4 pegs. 拖动 4 个钉子</div><button type="button" class="go" id="geoGo">Check ✓ <small>检查</small></button>');
    var svg=f.querySelector("#geoSvg"), pegs=[[1,1],[5,2],[4,5],[2,4]], drag=-1;
    board={pegs:pegs,reveal:function(){ draw(true); }};
    function xy(p){ return [PAD+p[0]*STEP,PAD+p[1]*STEP]; }
    function draw(marks){
      var h="";
      for(var y=0;y<=GRID;y++) for(var x=0;x<=GRID;x++) h+='<circle cx="'+(PAD+x*STEP)+'" cy="'+(PAD+y*STEP)+'" r="3.5" fill="#9bb3cc"/>';
      h+='<polygon points="'+pegs.map(function(p){ return xy(p).join(","); }).join(" ")+'" fill="'+c+'" fill-opacity=".55" stroke="#1f3a5a" stroke-width="5" stroke-linejoin="round"/>';
      if(marks){ var m=measure(pegs); if(m.ok) m.rt.forEach(function(i){ var p=xy(pegs[i]), a=xy(pegs[(i+1)%4]), b=xy(pegs[(i+3)%4]), u=sub(a,p), w=sub(b,p), lu=Math.hypot(u[0],u[1]), lw=Math.hypot(w[0],w[1]);
        u=[u[0]/lu*26,u[1]/lu*26]; w=[w[0]/lw*26,w[1]/lw*26]; h+='<path d="M'+(p[0]+u[0])+' '+(p[1]+u[1])+' L'+(p[0]+u[0]+w[0])+' '+(p[1]+u[1]+w[1])+' L'+(p[0]+w[0])+' '+(p[1]+w[1])+'" fill="none" stroke="#c0392b" stroke-width="3"/>'; }); }
      pegs.forEach(function(p,i){ var a=xy(p); h+='<circle class="peg" data-i="'+i+'" cx="'+a[0]+'" cy="'+a[1]+'" r="14" fill="#fff" stroke="#2f7fc8" stroke-width="5"/>'; });
      svg.innerHTML=h;
    }
    function toGrid(e){ var r=svg.getBoundingClientRect(), s=260/r.width; return [Math.max(0,Math.min(GRID,Math.round(((e.clientX-r.left)*s-PAD)/STEP))),Math.max(0,Math.min(GRID,Math.round(((e.clientY-r.top)*s-PAD)/STEP)))]; }
    svg.addEventListener("pointerdown",function(e){ if(ui.locked()) return; var t=e.target; if(!t.classList||!t.classList.contains("peg")){ // a tap on the board: the nearest peg jumps there
        var g=toGrid(e), best=-1, bd=1e9; pegs.forEach(function(p,i){ var d=Math.pow(p[0]-g[0],2)+Math.pow(p[1]-g[1],2); if(d<bd){ bd=d; best=i; } }); drag=best; }
      else drag=+t.getAttribute("data-i");
      try{ svg.setPointerCapture(e.pointerId); }catch(_){} move(e); e.preventDefault(); });
    function move(e){ if(drag<0) return; var g=toGrid(e); if(g[0]!==pegs[drag][0]||g[1]!==pegs[drag][1]){ pegs[drag]=g; draw(false); blip(420,.05); } }
    svg.addEventListener("pointermove",move);
    svg.addEventListener("pointerup",function(){ drag=-1; }); svg.addEventListener("pointercancel",function(){ drag=-1; });
    f.querySelector("#geoGo").onclick=function(){
      if(ui.locked()) return;
      var m=measure(pegs), msg=f.querySelector("#geoMsg");
      if(!m.ok){ msg.textContent=m.why; msg.className="geoMsg warn"; return; }   // not a 4-sided shape yet: fix it, no heart lost
      ui.answer(fits(m,want)?"ok":"x:"+nameOf(m));
    };
    draw(false);
  }
  function cornerGame(q,ui){
    ui.task("Tap every <b>right angle</b> (square corner). Then press Done. <small>点出所有直角，再按完成</small>");
    var s=SH[q.s], c=COLS[q.c||0], k=1.9, on={};
    var f=ui.stage('<div class="geo"><svg viewBox="-6 -6 240 240" id="cnSvg"></svg></div><button type="button" class="go" id="cnGo">Done ✓ <small>完成</small></button>');
    var svg=f.querySelector("#cnSvg");
    function P(i){ return [s.pts[i][0]*k,s.pts[i][1]*k]; }
    board={reveal:function(){ on={}; s.rt.forEach(function(i){ on[i]=1; }); draw(); f.querySelector("#cnGo").disabled=true; }};
    function draw(){
      var n=s.pts.length, h='<polygon points="'+s.pts.map(function(p){ return (p[0]*k)+","+(p[1]*k); }).join(" ")+'" fill="'+c+'" stroke="#1f3a5a" stroke-width="6" stroke-linejoin="round"/>';
      for(var i=0;i<n;i++){ var p=P(i);
        if(on[i]){ var a=P((i+1)%n), b=P((i+n-1)%n), u=sub(a,p), w=sub(b,p), lu=Math.hypot(u[0],u[1]), lw=Math.hypot(w[0],w[1]); u=[u[0]/lu*20,u[1]/lu*20]; w=[w[0]/lw*20,w[1]/lw*20];
          h+='<path d="M'+(p[0]+u[0])+' '+(p[1]+u[1])+' L'+(p[0]+u[0]+w[0])+' '+(p[1]+u[1]+w[1])+' L'+(p[0]+w[0])+' '+(p[1]+w[1])+'" fill="rgba(255,255,255,.6)" stroke="#c0392b" stroke-width="4"/>'; }
        h+='<circle class="cn'+(on[i]?" on":"")+'" data-i="'+i+'" cx="'+p[0]+'" cy="'+p[1]+'" r="20" fill="'+(on[i]?"rgba(192,57,43,.18)":"rgba(255,255,255,.01)")+'" stroke="'+(on[i]?"#c0392b":"#9bb3cc")+'" stroke-width="3" stroke-dasharray="'+(on[i]?"":"5 4")+'"/>'; }
      svg.innerHTML=h;
    }
    svg.addEventListener("click",function(e){ if(ui.locked()) return; var t=e.target; if(t.classList&&t.classList.contains("cn")){ var i=+t.getAttribute("data-i"); if(on[i]) delete on[i]; else on[i]=1; blip(420,.05); draw(); } });
    f.querySelector("#cnGo").onclick=function(){ if(ui.locked()) return; var got=Object.keys(on).map(Number).sort(), want=s.rt.slice().sort();
      ui.answer(got.join(",")===want.join(",")?"ok":"x:"+got.length); };
    draw();
  }
  var actx=null;
  function blip(fr,len){ if(!M.sound||!M.sound()) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); var t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
    o.type="sine"; o.frequency.value=fr; g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+len); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+len+.02); }catch(e){} }

  var LEVELS=[
    {id:"s1",n:"Four Sides?",ic:"4️⃣",gen:quadQ},
    {id:"s2",n:"Build That Shape",ic:"📌",gen:nameQ},
    {id:"s3",n:"Right Angles",ic:"📐",gen:rightQ},
    {id:"s4",n:"Equal Sides",ic:"📏",gen:esortQ},
    {id:"s5",n:"True or False?",ic:"✅",gen:truthQ},
    {id:"s6",n:"Shape Riddles",ic:"🕵️",gen:riddleQ}
  ];

  // ---------- answers ----------
  // hands-on questions are right when the child did it ("ok"); a wrong try comes back as "x:..." (the shape put in the wrong basket,
  // the shape that was built, how many corners were tapped)
  var HANDS={quad:1,esort:1,name:1,right:1};
  function right(q){
    if(HANDS[q.kind]) return "ok";
    if(q.kind==="quad"){ for(var i=0;i<4;i++){ var isQ=SH[q.s[i]].sides===4; if(q.not?!isQ:isQ) return String(i); } }
    if(q.kind==="name") return SH[q.s].n;
    if(q.kind==="right") return String(SH[q.s].rt.length);
    if(q.kind==="equal") return SH[q.s].eq?"yes":"no";
    if(q.kind==="truth") return FACTS[q.f][1]?"true":"false";
    return RIDDLES[q.r][1];
  }
  var DEF={square:"4 equal sides and 4 right angles.",rectangle:"4 right angles. The sides across from each other are equal: 2 long and 2 short.",
    rhombus:"4 equal sides, but no right angles. It looks like a pushed-over square.",parallelogram:"the sides across from each other are equal and go the same way, but there are no right angles.",
    trapezoid:"only one pair of sides that go the same way (the top and the bottom).",triangle:"3 sides and 3 corners.",quadrilateral:"4 sides and 4 corners."};
  function render(q,ui){
    var c=COLS[q.c||0]; board=null;
    if(q.kind==="quad"||q.kind==="esort") return sortGame(q,ui);
    if(q.kind==="name") return buildGame(q,ui);
    if(q.kind==="right") return cornerGame(q,ui);
    if(q.kind==="equal"){
      ui.task("Are <b>all 4 sides</b> of this "+SH[q.s].n+" the same length?");
      ui.stage('<div style="margin:6px 0">'+shapeSvg(q.s,170,c)+'</div>');
      ui.choices([{html:"Yes",val:"yes"},{html:"No",val:"no"}]);
    }else if(q.kind==="truth"){
      ui.task("True or false?");
      ui.stage('<div style="text-align:center;font-weight:900;font-size:1.35rem;line-height:1.45;margin:16px 8px">"'+FACTS[q.f][0]+'"</div>');
      ui.choices([{html:"True ✓",val:"true"},{html:"False ✗",val:"false"}]);
    }else{
      ui.task("Shape riddle: <b>What am I?</b>");

      var r=RIDDLES[q.r][1], also2={square:["rectangle","rhombus","parallelogram"],rectangle:["parallelogram"],rhombus:["parallelogram"]}[r]||[],
        pool=["square","rectangle","rhombus","trapezoid","parallelogram","triangle","pentagon"], opts2=[r].concat(M.shuffle(pool.filter(function(n){ return n!==r&&(also2.indexOf(n)<0||r!=="square"); })).slice(0,3));
      var idOf={square:"square",rectangle:"rectangle",rhombus:"rhombus",trapezoid:"trapezoid",parallelogram:"parallelogram",triangle:"triangle",pentagon:"pentagon"};
      ui.choices(M.shuffle(opts2).map(function(n,i){ return {html:shapeSvg(idOf[n],54,COLS[i])+"<small>"+n+"</small>",val:n}; }));

  function after(q,ok,val){

  function explain(q){
    var r=right(q);

  function teach(q,given){
    var r=right(q), steps, cn, pic="";
    var gv=givenOf(given);
    if(q.kind==="quad"){
      steps=["A <b>quadrilateral</b> has <b>4 sides</b> and <b>4 corners</b>. (\"Quad\" means four.)"];
      if(SH[gv]) steps.push("The <b>"+SH[gv].n+"</b> has "+(SH[gv].sides?SH[gv].sides+" sides":"no straight sides")+", so it goes in <b>"+(SH[gv].sides===4?"Quadrilateral":"Not a quadrilateral")+"</b>.");
      steps.push("Count the sides of every shape: 4 sides → Quadrilateral.");
      cn="四边形：有 4 条边、4 个角。三角形、五边形、六边形和圆都不是四边形。";
    }else if(q.kind==="esort"){
      var wrongId=SH[gv];
      steps=["Look at the 4 sides of each shape. Are they all the same length?"];
      if(wrongId) steps.push("A <b>"+wrongId.n+"</b> has "+DEF[wrongId.n==="quadrilateral"?"quadrilateral":wrongId.n]+(wrongId.eq?" All 4 sides are equal.":" Its sides are not all equal."));
      steps.push("Squares and rhombuses have 4 equal sides. Rectangles, trapezoids and parallelograms usually don't.");
      cn="正方形和菱形的 4 条边都相等；长方形、梯形和平行四边形一般不是。";
    }else if(q.kind==="name"){
      var w=SH[q.s].n;
      pic='<div class="pic">'+shapeSvg(q.s,110,COLS[q.c||0],true)+'</div>';
      steps=["A <b>"+w+"</b> has "+DEF[w]];
      if(gv&&gv!==w&&DEF[gv]) steps.push("You built a <b>"+gv+"</b>: it has "+DEF[gv]);
      steps.push(w==="rectangle"||w==="square"?"Check every corner: each one must be a square corner (the red marks).":w==="rhombus"?"Count the dots along each side: all 4 sides must be the same length.":w==="trapezoid"?"Make the top and the bottom go the same way, but not the other two sides.":"Make the sides across from each other go the same way.");
      cn="正方形：4 边相等、4 个直角；长方形：4 个直角；菱形：4 边相等、没有直角；梯形：只有一组对边平行。";
    }else if(q.kind==="right"){
      var n=SH[q.s].rt.length;
      pic='<div class="pic">'+shapeSvg(q.s,110,COLS[q.c||0],true)+'</div>';
      steps=["A <b>right angle</b> is a square corner, like the corner of a book or a piece of paper.","Check every corner of the "+SH[q.s].n+". The square corners are marked in red."+(gv!==""&&+gv!==n?" You tapped "+gv+".":""),
             n?"There "+(n===1?"is ":"are ")+"<b>"+n+"</b> right "+(n===1?"angle":"angles")+".":"None of the corners is a square corner: <b>0</b> right angles."];
      cn="直角就是“方方正正”的角，像书本的角。可以用一张纸的角去比一比。";
    }else if(q.kind==="equal"){
      steps=["A <b>"+SH[q.s].n+"</b> has "+DEF[SH[q.s].n],SH[q.s].eq?"So <b>yes</b>: all 4 sides are the same length.":"So <b>no</b>: its sides are not all the same length."];
      cn="正方形和菱形的 4 条边都相等；长方形、梯形和平行四边形不是。";
    }else if(q.kind==="truth"){
      var f=FACTS[q.f]; steps=["The sentence: \""+f[0]+"\"","It is <b>"+(f[1]?"true":"false")+"</b>. "+f[2]];
      cn="正方形是特殊的长方形，也是特殊的菱形；但不是每个长方形都是正方形。";
    }else{
      var rd=RIDDLES[q.r];
      steps=["Read every clue: \""+rd[0]+"\"","A <b>"+rd[1]+"</b> has "+(DEF[rd[1]]||"")+" It matches every clue.","So I am a <b>"+rd[1]+"</b>!"];
      if(given&&given!==rd[1]&&DEF[given]) steps.splice(2,0,"A "+given+" has "+DEF[given]+" That does not match every clue.");
      cn="一条一条读线索，找出每一条都符合的图形。";
    }
    return {steps:steps,cn:cn,pic:pic};
  }
  function miss(q){

    if(q.kind==="right") return SH[q.s].n+": "+SH[q.s].rt.length+" right angles";

    return r;
  }
