<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fraction Frog</title>
<meta name="theme-color" content="#2f8f6a">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="description" content="Fraction Frog: jump to the right place on the number line. Fractions in English for Grade 3: halves to eighths, past one, the same spot, which is bigger.">
<link href="/fonts/fonts.css" rel="stylesheet">
<style>
/* Layout: pond map (ponds to play, shop) -> jumping screen (number line, question, answers) -> end of the pond */
:root{--ink:#1f3a30;--muted:#5f7a6f;--line:#d6e9df;--brand:#2f8f6a;--brand-dark:#1f6a4d;--bg:#eef8f2;--card:#fff;
--good:#2f9e5b;--bad:#e0554f;--gold:#f5b301;--water:#bfe6f2;--shadow:0 14px 34px rgba(31,58,48,.13)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,ui-rounded,"Trebuchet MS",Arial,sans-serif;min-height:100vh}
h1,h2,h3{font-family:Fredoka,ui-rounded,"Trebuchet MS",Arial,sans-serif}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid #3a7bd5;outline-offset:2px}
[hidden]{display:none!important}
.top{max-width:920px;margin:auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.home,.tbtn{background:#fff;border:1px solid var(--line);border-radius:13px;padding:9px 13px;font-weight:900;text-decoration:none;color:var(--ink)}
.wallet{display:flex;gap:8px;align-items:center}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:900;white-space:nowrap}
.wrap{max-width:920px;margin:auto;padding:0 16px 48px}

/* a fraction written the school way */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;font-family:Fredoka,sans-serif;font-weight:700;margin:0 .08em}
.fr b{display:block;padding:0 .12em}
.fr b:first-child{border-bottom:.09em solid currentColor;padding-bottom:.06em}
.fr b:last-child{padding-top:.06em}

/* ===== map ===== */
.hero{position:relative;border-radius:28px;padding:22px 18px 18px;color:#fff;text-align:center;box-shadow:var(--shadow);overflow:hidden;
  background:radial-gradient(ellipse at 50% 120%,#7fd0e6 0 45%,transparent 46%),linear-gradient(180deg,#43b07f,#7fd09f)}
.hero h1{margin:0;font-size:clamp(1.9rem,7vw,3rem);text-shadow:0 3px 0 rgba(0,0,0,.18)}
.hero p{margin:4px 0 0;font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.hero .me{font-size:3.6rem;line-height:1;margin-top:6px;position:relative;display:inline-block}
.hat{position:absolute;left:50%;top:-.78em;transform:translateX(-50%);font-size:.55em}
.friends{font-size:1.8rem;letter-spacing:6px;min-height:1.2em}
.progress{display:inline-block;margin-top:8px;background:rgba(255,255,255,.92);border-radius:999px;padding:6px 14px;font-weight:900;color:var(--ink)}
.ponds{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.pond{position:relative;border:0;border-radius:22px;padding:12px 6px 10px;background:#fff;box-shadow:0 6px 0 #cfe6da,var(--shadow);text-align:center;transition:transform .15s}
.pond:hover{transform:translateY(-4px)}
.pond:active{transform:translateY(2px)}
.pond .ic{font-size:1.7rem;line-height:1.25;display:block;min-height:1.3em}
.pond .tag{font-family:Fredoka,sans-serif;font-weight:700;font-size:1.05rem;display:block;line-height:1.15}
.pond .name{display:block;font-size:.74rem;font-weight:800;color:var(--muted)}
.pond .stars{font-size:.95rem;letter-spacing:.05em;min-height:1.3em}
.pond.gold{box-shadow:0 6px 0 #e0b200,0 0 0 3px var(--gold),var(--shadow)}
.pond.wide{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:14px;padding:14px}
.pond.wide .txt{text-align:left}
.pond.boss{background:linear-gradient(135deg,#1f6a8a,#3fa7c9);color:#fff;box-shadow:0 6px 0 #154b63,var(--shadow)}
.pond.boss .name{color:#dff4fb}
.pond.boss.locked{filter:grayscale(.85);opacity:.75;cursor:not-allowed}
.pond.practice{background:#fff7e3}
.pond.practice:disabled{opacity:.6;cursor:default;transform:none}
.panel{margin-top:22px;background:#fff;border-radius:20px;padding:4px 18px;box-shadow:var(--shadow)}
.panel summary{cursor:pointer;font-weight:900;padding:12px 0}
.panel summary small{color:var(--muted);font-weight:800}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;padding-bottom:16px}
.item{border:2px solid var(--line);border-radius:16px;background:#fff;padding:10px 6px;text-align:center;font-weight:900}
.item .e{font-size:2rem;display:block}
.item .n{display:block;font-size:.85rem}
.item .p{display:block;font-size:.82rem;color:var(--muted);margin-top:2px}
.item.own{border-color:var(--good);background:#effaf2}
.item.own .p{color:var(--good)}
.item.on{box-shadow:0 0 0 3px var(--gold)}
.item:disabled{opacity:.55;cursor:default}
.skills{width:100%;border-collapse:collapse;margin-bottom:14px;font-weight:800;font-size:.9rem}
.skills td{padding:7px 4px;border-top:1px solid var(--line)}
.skills td:last-child{text-align:right;white-space:nowrap}
.meter{display:inline-block;width:90px;height:10px;border-radius:9px;background:#eef3f0;overflow:hidden;vertical-align:middle;margin-left:6px}
.meter i{display:block;height:100%;background:var(--good)}

/* ===== jumping ===== */
.bar-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hearts{font-size:1.4rem;letter-spacing:.06em;font-weight:900}
.hearts .lost{filter:grayscale(1);opacity:.3}
.stage{position:relative;margin-top:12px;border-radius:26px;box-shadow:var(--shadow);overflow:hidden;
  background:linear-gradient(180deg,#d9f3e6 0 30%,var(--water) 30%);padding:12px 14px 16px}
.task{font-weight:900;font-size:1.1rem;text-align:center;min-height:1.6em;line-height:1.4}
.task .fr{font-size:1.5em}
.nl{position:relative;height:118px;margin:4px 14px 0}
.nl.small{height:96px}
.nl .axis{position:absolute;left:0;right:0;top:70px;height:5px;border-radius:3px;background:#2e5a4a}
.nl.small .axis{top:56px}
.tick{position:absolute;top:56px;width:34px;height:34px;margin-left:-17px;border:0;border-radius:50%;background:transparent;padding:0}
.nl.small .tick{top:42px}
.tick:before{content:"";position:absolute;left:50%;top:7px;width:3px;height:20px;margin-left:-1.5px;background:#2e5a4a;border-radius:2px}
.tick.whole:before{height:28px;top:3px;width:4px;margin-left:-2px}
.tick.pick{cursor:pointer}
.tick.pick:hover:after,.tick.pick:focus-visible:after{content:"";position:absolute;inset:3px;border-radius:50%;background:rgba(47,143,106,.25)}
.tick.right:after{content:"";position:absolute;inset:2px;border-radius:50%;background:rgba(47,158,91,.45)}
.tick.wrong:after{content:"";position:absolute;inset:2px;border-radius:50%;background:rgba(224,85,79,.45)}
.lbl{position:absolute;top:92px;transform:translateX(-50%);font-family:Fredoka,sans-serif;font-weight:700;font-size:1rem}
.nl.small .lbl{top:78px}
.lbl .fr{font-size:.85rem}
.frog{position:absolute;top:8px;font-size:2.6rem;line-height:1;transform:translateX(-50%);transition:left .55s ease-in-out;z-index:2;pointer-events:none}
.nl.small .frog{top:0;font-size:2.2rem}
.frog .hat{font-size:.6em;top:-.42em}
.frog.jump{animation:jump .55s ease-in-out}
.frog.splash{animation:splash .6s}
.frog.b{filter:hue-rotate(160deg)}
.fly{position:absolute;font-size:1.3rem;top:6px;transform:translateX(-50%);animation:buzz 1s ease-in-out infinite}
.vs{display:flex;justify-content:center;gap:16px;margin:10px 0 2px}
.words{font-weight:900;color:var(--muted);font-size:1.1rem;min-height:1.5em;text-align:center;margin-top:8px}
.msg{text-align:center;font-weight:900;min-height:1.6em;font-size:1.1rem;margin-top:2px}
.msg.good{color:var(--good)}.msg.bad{color:var(--bad)}.msg.combo{color:#e07b00}
.msg.pop{animation:pop .35s}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.choices.two{grid-template-columns:1fr 1fr}
.choice{border:0;border-radius:22px;padding:12px 6px;font-family:Fredoka,sans-serif;font-size:1.9rem;font-weight:700;color:var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.13);transition:transform .06s;min-height:84px}
.choice .fr{font-size:1.15em}
.choice small{display:block;font-size:.8rem;font-family:Nunito,sans-serif;font-weight:900;margin-top:4px}
.choice:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.13)}
.choice:nth-child(1){background:#d9f3c4}.choice:nth-child(2){background:#c7ecf7}.choice:nth-child(3){background:#ffe7a8}.choice:nth-child(4){background:#ffd1e3}
.choice.right{background:var(--good)!important;color:#fff}
.choice.wrong{background:var(--bad)!important;color:#fff;animation:shake .35s}
.choice:disabled{cursor:default}
.hint{text-align:center;color:var(--muted);font-weight:800;font-size:.9rem;margin-top:8px}

/* ===== end of the pond ===== */
.result{background:#fff;border-radius:28px;padding:26px 18px;text-align:center;box-shadow:var(--shadow);margin-top:8px}
.result .big{font-size:5.5rem;line-height:1.1;display:inline-block;animation:pop .6s}
.result h2{margin:6px 0;font-size:1.8rem}
.result .stars{font-size:2.6rem;letter-spacing:.1em}
.result p{color:var(--muted);font-weight:800;margin:6px 0}
.reward{display:inline-block;background:#fff6d6;border-radius:999px;padding:8px 16px;font-weight:900;margin:8px 0}
.mistakes{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.mistakes span{background:#fdeeee;color:#9b2c2c;border-radius:12px;padding:7px 11px;font-weight:900}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.btn{border:0;border-radius:16px;padding:14px 22px;font-weight:900;font-size:1.05rem;background:var(--brand);color:#fff;box-shadow:0 5px 0 var(--brand-dark)}
.btn.light{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

@keyframes jump{0%{margin-top:0}45%{margin-top:-46px}100%{margin-top:0}}
@keyframes splash{0%{transform:translateX(-50%)}30%{transform:translateX(-50%) translateY(18px) scale(.9);opacity:.5}100%{transform:translateX(-50%)}}
@keyframes buzz{0%,100%{margin-top:0}50%{margin-top:-6px}}
/* the explanation after a wrong answer: it stays until the child taps "Got it" */
.teach{margin-top:12px;background:#fff;border:3px solid #ffd166;border-radius:20px;padding:12px 14px 14px;box-shadow:0 10px 24px rgba(0,0,0,.1);animation:pop .3s}
.teach h3{margin:0 0 8px;font-size:1.15rem}
.teach h3 small{font-family:Nunito,sans-serif;font-size:.85rem;color:#7a7a7a;font-weight:800}
.teach ol{margin:0;padding-left:1.4em;font-weight:800;line-height:1.55}
.teach li{margin:3px 0}
.teach .cn{margin-top:8px;padding:8px 10px;border-radius:12px;background:#fff8e1;font-weight:800;font-size:.95rem;line-height:1.5}
.teach .pic{text-align:center;margin:2px 0 8px;line-height:1.1}
.teach .pic .grp{display:inline-block;margin:3px 5px;padding:4px 6px;border-radius:12px;background:#f2f5fb;vertical-align:middle}
.teach .ok{display:block;width:100%;margin-top:12px;border:0;border-radius:14px;padding:13px;font-weight:900;font-size:1.1rem;color:#fff;background:#3a7bd5;box-shadow:0 4px 0 #2a5ea8}
.teach .ok small{font-weight:800;opacity:.9}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media(max-width:620px){.ponds{gap:8px}.pond .tag{font-size:.92rem}.pond .name{font-size:.66rem}.choice{font-size:1.6rem;min-height:76px}.nl{margin:4px 8px 0}.tick{width:28px;height:30px;margin-left:-14px}}
</style></head>
<body>
<div class="top">
  <a class="home" id="homeLink" href="../index.html">← Home</a>
  <div class="wallet">
    <span class="chip" id="coinChip">🪰 <span id="coinTotal">0</span></span>
    <button class="tbtn" type="button" id="soundBtn">🔔 Sound on</button>
  </div>
</div>
<div class="wrap">

<!-- ===== MAP ===== -->
<section id="map">
  <div class="hero">
    <h1>🪷 Fraction Frog</h1>
    <p>Jump to the right place on the number line!</p>
    <div class="me" id="heroFrog">🐸</div>
    <div class="friends" id="friends"></div>
    <div class="progress" id="progress"></div>
  </div>
  <div class="ponds" id="ponds"></div>
  <details class="panel" open>
    <summary>🛍️ Frog shop: flies buy hats and pond friends <small>用苍蝇换帽子和池塘朋友</small></summary>
    <div class="shop" id="shop"></div>
  </details>
  <details class="panel">
    <summary>📋 For parents: what is going well <small>给家长看：掌握情况</small></summary>
    <table class="skills" id="skills"></table>
  </details>
</section>

<!-- ===== JUMPING ===== -->
<section id="play" hidden>
  <div class="bar-top">
    <button class="tbtn" type="button" id="quitBtn">✕ Leave the pond</button>
    <span class="hearts" id="hearts"></span>
    <span class="chip">🪰 +<span id="pCoins">0</span></span>
  </div>
  <div class="stage" id="stage">
    <div class="task" id="task"></div>
    <div id="lines"></div>
  </div>
  <div class="words" id="words"></div>
  <div class="msg" id="msg"></div>
  <div class="choices" id="choices"></div>
  <div class="teach" id="teach" hidden></div>
  <div class="hint" id="hint"></div>
</section>

<!-- ===== END OF THE POND ===== -->
<section id="result" hidden>
  <div class="result">
    <div class="big" id="rBig"></div>
    <h2 id="rTitle"></h2>
    <div class="stars" id="rStars"></div>
    <div class="reward" id="rReward"></div>
    <p id="rSub"></p>
    <div id="rMissBox">
      <p>Practice these again:</p>
      <div class="mistakes" id="rMiss"></div>
    </div>
    <div class="row">
      <button class="btn" type="button" id="againBtn">Play again</button>
      <button class="btn light" type="button" id="mapBtn">Back to the ponds</button>
    </div>
  </div>
</section>
</div>
<canvas id="confetti"></canvas>

<script>
(function(){
  "use strict";
  // ---------- fractions in words: "three fourths", "one half" ----------
  var NUM=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen"];
  var DEN={1:["whole","wholes"],2:["half","halves"],3:["third","thirds"],4:["fourth","fourths"],6:["sixth","sixths"],8:["eighth","eighths"]};
  function frWords(p,q){ return NUM[p]+" "+DEN[q][p===1?0:1]; }
  function frHtml(p,q){ return '<span class="fr"><b>'+p+'</b><b>'+q+'</b></span>'; }
  function frText(p,q){ return p+"/"+q; }
  function same(a,b,c,d){ return a*d===b*c; }
  function rnd(n){ return Math.floor(Math.random()*n); }
  function pickOne(a){ return a[rnd(a.length)]; }
  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=rnd(i+1),t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

  // ---------- the questions ----------
  // place: tap where p/q is on a line from 0 to W;  name: the frog sits somewhere, which fraction is it?
  // equiv: which fraction is at the same spot as a/b?  cmp: which frog jumps farther, a/b or c/d?
  function placeQ(p,q,W){ return {kind:"place",key:"place|"+p+"|"+q+"|"+W,p:p,q:q,W:W}; }
  function nameQ(p,q,W){ return {kind:"name",key:"name|"+p+"|"+q+"|"+W,p:p,q:q,W:W}; }
  function equivQ(a,b,c,d){ return {kind:"equiv",key:"equiv|"+a+"|"+b+"|"+c+"|"+d,a:a,b:b,c:c,d:d}; }
  function cmpQ(a,b,c,d){ return {kind:"cmp",key:"cmp|"+a+"|"+b+"|"+c+"|"+d,a:a,b:b,c:c,d:d}; }
  function fromKey(k){
    var s=k.split("|"), n=s.slice(1).map(Number);
    if(s[0]==="place") return placeQ(n[0],n[1],n[2]);
    if(s[0]==="name") return nameQ(n[0],n[1],n[2]);
    if(s[0]==="equiv") return equivQ(n[0],n[1],n[2],n[3]);
    return cmpQ(n[0],n[1],n[2],n[3]);
  }
  function lineQ(dens,W,withWholes){
    var q=pickOne(dens), p;
    do{ p=1+rnd(q*W-1+(withWholes?1:0)); }while(!withWholes&&p%q===0);
    return Math.random()<.55?placeQ(p,q,W):nameQ(p,q,W);
  }
  var EQUIVS=[[1,2,2,4],[1,2,3,6],[1,2,4,8],[2,4,4,8],[1,3,2,6],[2,3,4,6],[1,4,2,8],[3,4,6,8],[2,2,4,4],[3,3,6,6],[1,1,4,4],[1,1,2,2],[1,1,3,3],[1,1,8,8],[2,1,4,2],[2,1,6,3],[2,1,8,4],[3,2,6,4]];
  function equivGen(){ var e=pickOne(EQUIVS); return Math.random()<.5?equivQ(e[0],e[1],e[2],e[3]):equivQ(e[2],e[3],e[0],e[1]); }
  function cmpGen(){
    var dens=[2,3,4,6,8], a,b,c,d;
    if(Math.random()<.5){ b=d=pickOne([3,4,6,8]); a=1+rnd(b-1); do{ c=1+rnd(b-1); }while(c===a); }   // the same bottom number
    else{ a=c=1+rnd(3); do{ b=pickOne(dens); d=pickOne(dens); }while(b===d||a>=b||a>=d); }            // the same top number
    return cmpQ(a,b,c,d);
  }
  var PONDS=[
    {id:"p1",e:"½ ¼",n:"Halves & Fourths",gen:function(){ return lineQ([2,4],1,false); }},
    {id:"p2",e:"⅓ ⅙",n:"Thirds & Sixths",gen:function(){ return lineQ([3,6],1,false); }},
    {id:"p3",e:"⅛",n:"Eighths",gen:function(){ return lineQ([8,8,4,2],1,false); }},
    {id:"p4",e:"1 2",n:"Past One",gen:function(){ return lineQ([2,3,4],2,true); }},
    {id:"p5",e:"= =",n:"The Same Spot",gen:equivGen},
    {id:"p6",e:"< >",n:"Farther Jump",gen:cmpGen}
  ];
  var BOSS={id:"boss",e:"🌊",n:"Big Pond",gen:function(){ return pickOne(PONDS).gen(); }};
  var PRACTICE={id:"practice",e:"🪷",n:"Practice Pond"};
  var BOSS_NEED=3;
  var SHOP=[
    {id:"bow",t:"hat",e:"🎀",n:"Bow",p:10},{id:"cap",t:"hat",e:"🧢",n:"Cap",p:20},{id:"glasses",t:"hat",e:"🕶️",n:"Sunglasses",p:25},
    {id:"tophat",t:"hat",e:"🎩",n:"Top hat",p:35},{id:"crown",t:"hat",e:"👑",n:"Crown",p:60},
    {id:"duck",t:"friend",e:"🦆",n:"Duck",p:15},{id:"turtle",t:"friend",e:"🐢",n:"Turtle",p:25},{id:"fish",t:"friend",e:"🐟",n:"Fish",p:30},
    {id:"snail",t:"friend",e:"🐌",n:"Snail",p:35},{id:"butterfly",t:"friend",e:"🦋",n:"Butterfly",p:45},{id:"swan",t:"friend",e:"🦢",n:"Swan",p:70}
  ];
  var KIND_NAME={place:"Find the place on the number line",name:"Name the fraction",equiv:"Equal fractions (the same spot)",cmp:"Compare fractions"};

  // ---------- saved progress (this browser only) ----------
  var STORE="fracFrog.v1";
  var data={facts:{},ponds:{},kinds:{},coins:0,owned:{},hat:"",sound:true};
  try{
    var raw=localStorage.getItem(STORE);
    if(raw){ var d0=JSON.parse(raw);
      if(d0&&typeof d0==="object"){ ["facts","ponds","kinds","owned"].forEach(function(k){ if(d0[k]&&typeof d0[k]==="object") data[k]=d0[k]; });
        if(typeof d0.coins==="number") data.coins=d0.coins; if(typeof d0.hat==="string") data.hat=d0.hat; if(typeof d0.sound==="boolean") data.sound=d0.sound; } }
  }catch(e){}
  function save(){ try{ localStorage.setItem(STORE,JSON.stringify(data)); }catch(e){} }
  function fact(k){ return data.facts[k]||(data.facts[k]={ok:0,miss:0}); }
  function mastered(k){ var f=data.facts[k]; return f&&f.ok>=2&&f.ok-f.miss*2>=1; }
  function missList(){ return Object.keys(data.facts).filter(function(k){ return data.facts[k].miss>0&&!mastered(k); }); }
  function starsOf(id){ return (data.ponds[id]&&data.ponds[id].stars)||0; }
  function playedCount(){ return PONDS.filter(function(P){ return starsOf(P.id)>0; }).length; }

  // ---------- sound effects (no voice) ----------
  var actx=null;
  function tone(notes,type,len){
    if(!data.sound) return;
    try{

    var cv=$("confetti"),ctx=cv.getContext("2d"); cv.width=innerWidth; cv.height=innerHeight;
    var cols=["#f5b301","#2f9e5b","#3fa7c9","#e86a9c","#7cc47f"],ps=[];
    for(var i=0;i<150;i++) ps.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6.28,c:cols[i%5],s:6+Math.random()*6});
    var t0=performance.now();
    (function loop(t){
      ctx.clearRect(0,0,cv.width,cv.height);
      ps.forEach(function(p){ p.x+=p.vx; p.y+=p.vy; p.r+=.1; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); });
      if(t-t0<3000) requestAnimationFrame(loop); else ctx.clearRect(0,0,cv.width,cv.height);
    })(t0);
  }

})();
