<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Garden Builder</title>
<meta name="theme-color" content="#5a9e3a">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="description" content="Garden Builder: count squares, plant flower beds, build fences. Area and perimeter in English for Grade 3.">
<link href="/fonts/fonts.css" rel="stylesheet">
<style>
/* Layout: garden map (plots to play, garden shop) -> building screen (grid, question, answers) -> end of the day */
:root{--ink:#2c3a1f;--muted:#66745a;--line:#dfe8d2;--brand:#5a9e3a;--brand-dark:#3e7426;--bg:#f2f7ea;--card:#fff;
--good:#2f9e5b;--bad:#e0554f;--gold:#f5b301;--soil:#b9895a;--soil2:#a67748;--shadow:0 14px 34px rgba(44,58,31,.13)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,ui-rounded,"Trebuchet MS",Arial,sans-serif;min-height:100vh}
h1,h2,h3{font-family:Fredoka,ui-rounded,"Trebuchet MS",Arial,sans-serif}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid #3a7bd5;outline-offset:2px}
[hidden]{display:none!important}
.top{max-width:920px;margin:auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.home,.tbtn{background:#fff;border:1px solid var(--line);border-radius:13px;padding:9px 13px;font-weight:900;text-decoration:none;color:var(--ink)}
.wallet{display:flex;gap:8px;align-items:center}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:900;white-space:nowrap}
.wrap{max-width:920px;margin:auto;padding:0 16px 48px}
/* on a big screen (a tablet or a computer) the whole game is drawn larger */
@media(min-width:760px) and (min-height:720px){.wrap{zoom:1.15}}@media(min-width:1000px) and (min-height:860px){.wrap{zoom:1.3}}@media(min-width:1300px) and (min-height:1000px){.wrap{zoom:1.45}}

/* ===== map ===== */
.hero{position:relative;border-radius:28px;padding:20px 14px 16px;color:#fff;text-align:center;box-shadow:var(--shadow);overflow:hidden;
  background:linear-gradient(180deg,#8fd0f2 0 38%,#7bc35a 38%)}
.hero h1{margin:0;font-size:clamp(1.9rem,7vw,3rem);text-shadow:0 3px 0 rgba(0,0,0,.2)}
.hero p{margin:4px 0 0;font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.mygarden{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;max-width:420px;margin:12px auto 4px;padding:6px;background:#8a5f36;border-radius:12px}
.mygarden span{aspect-ratio:1;background:var(--soil);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:clamp(1rem,4.5vw,1.6rem)}
.progress{display:inline-block;margin-top:8px;background:rgba(255,255,255,.92);border-radius:999px;padding:6px 14px;font-weight:900;color:var(--ink)}
.plots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.plot{position:relative;border:0;border-radius:22px;padding:12px 6px 10px;background:#fff;box-shadow:0 6px 0 #d6e3c6,var(--shadow);text-align:center;transition:transform .15s}
.plot:hover{transform:translateY(-4px)}
.plot:active{transform:translateY(2px)}
.plot .ic{font-size:2rem;line-height:1.2;display:block}
.plot .tag{font-family:Fredoka,sans-serif;font-weight:700;font-size:1.02rem;display:block;line-height:1.15}
.plot .stars{font-size:.95rem;letter-spacing:.05em;min-height:1.3em}
.plot.gold{box-shadow:0 6px 0 #e0b200,0 0 0 3px var(--gold),var(--shadow)}
.plot.wide{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:14px;padding:14px}
.plot.wide .txt{text-align:left}
.plot .name{display:block;font-size:.76rem;font-weight:800;color:var(--muted)}
.plot.boss{background:linear-gradient(135deg,#8a5a1e,#d3922f);color:#fff;box-shadow:0 6px 0 #5e3c12,var(--shadow)}
.plot.boss .name{color:#fff0d6}
.plot.boss.locked{filter:grayscale(.85);opacity:.75;cursor:not-allowed}
.plot.practice{background:#fff7e3}
.plot.practice:disabled{opacity:.6;cursor:default;transform:none}
.panel{margin-top:22px;background:#fff;border-radius:20px;padding:4px 18px;box-shadow:var(--shadow)}
.panel summary{cursor:pointer;font-weight:900;padding:12px 0}
.panel summary small{color:var(--muted);font-weight:800}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;padding-bottom:16px}
.item{border:2px solid var(--line);border-radius:16px;background:#fff;padding:10px 6px;text-align:center;font-weight:900}
.item .e{font-size:2rem;display:block}
.item .n{display:block;font-size:.85rem}
.item .p{display:block;font-size:.82rem;color:var(--muted);margin-top:2px}
.item.own{border-color:var(--good);background:#effaf2}
.item.own .p{color:var(--good)}
.item:disabled{opacity:.55;cursor:default}
.skills{width:100%;border-collapse:collapse;margin-bottom:14px;font-weight:800;font-size:.9rem}
.skills td{padding:7px 4px;border-top:1px solid var(--line)}
.skills td:last-child{text-align:right;white-space:nowrap}
.meter{display:inline-block;width:90px;height:10px;border-radius:9px;background:#eef3e6;overflow:hidden;vertical-align:middle;margin-left:6px}
.meter i{display:block;height:100%;background:var(--good)}

/* ===== building ===== */
.bar-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hearts{font-size:1.4rem;letter-spacing:.06em;font-weight:900}
.hearts .lost{filter:grayscale(1);opacity:.3}
.stage{position:relative;margin-top:12px;border-radius:26px;box-shadow:var(--shadow);overflow:hidden;background:linear-gradient(180deg,#e6f4d8,#f7fbf1);padding:12px 12px 14px}
.task{background:#fff;border-radius:14px;padding:9px 12px;font-weight:900;font-size:1.08rem;text-align:center;line-height:1.4;box-shadow:0 3px 0 rgba(0,0,0,.06)}
.task b{color:var(--brand-dark)}
.grid{display:grid;gap:3px;margin:12px auto 0;padding:5px;background:#8a5f36;border-radius:10px;touch-action:manipulation}
.cell{aspect-ratio:1;border:0;border-radius:4px;background:var(--soil);padding:0;display:flex;align-items:center;justify-content:center;font-size:clamp(.9rem,4.6vw,1.6rem);line-height:1}
.cell.bed{background:#6db34a}
.cell.pick{cursor:pointer}
.cell.pick:hover{background:var(--soil2)}
.cell.pick.bed:hover{background:#5ea53d}
.cell.cut{background:#7c9a63;opacity:.35}
.cell.flash{animation:pop .4s}
.counter{text-align:center;font-weight:900;margin-top:8px;font-size:1.05rem}
.rect{position:relative;left:30px;margin:40px auto 10px;background:repeating-linear-gradient(45deg,#7cc35a 0 10px,#6db34a 10px 20px);border:4px solid #3e7426;border-radius:4px}
.rect.fence{border:6px dashed #8a5f36;background:#cfe8b8}
.hcount{text-align:center;font-weight:900;color:var(--ink);margin:8px 0 0}.hrow{display:flex;justify-content:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.hbtn{border:0;border-radius:999px;padding:10px 16px;font:inherit;font-weight:900;background:#fff;box-shadow:0 4px 0 #cfe0c4;cursor:pointer;color:var(--ink)}.hbtn.big{background:#6db34a;color:#fff;box-shadow:0 4px 0 #3e7426}.hbtn:disabled{opacity:.5}
.hgo{display:block;margin:10px auto 0;border:0;border-radius:999px;padding:12px 26px;font:inherit;font-weight:900;font-size:1.1rem;background:var(--good,#2f9e5b);color:#fff;box-shadow:0 4px 0 #1f7041;cursor:pointer}.hgo small{font-weight:800;opacity:.85}.hgo:disabled{opacity:.45}
.cell.counted{background:#6db34a;color:#fff;font-family:Fredoka,sans-serif;font-weight:700}
.rect.rows{background:#e9d3b5}.rowsIn{position:absolute;inset:0;display:grid;align-content:start}.rowsIn .fl{display:flex;align-items:center;justify-content:center;aspect-ratio:1;font-size:.85rem;background:#7cc35a;outline:1px solid #6aa84b}.rowsIn .fl.fresh{animation:sprout .35s ease-out}
@keyframes sprout{from{transform:scale(.3)}to{transform:none}}
.fenceBox{display:flex;justify-content:center;margin-top:8px}.fenceBox svg{display:block;touch-action:manipulation}
.edge{cursor:pointer}.edge line{stroke:rgba(0,0,0,0);stroke-width:7;stroke-linecap:round}.edge:hover line{stroke:rgba(138,95,54,.3)}.edge.on line{stroke:#8a5f36;stroke-dasharray:none}.edge.bad line{stroke:#e0475b;stroke-dasharray:none}
.cutl{stroke:#c0392b;stroke-width:6;stroke-dasharray:8 6;pointer-events:none}.cuthit{cursor:pointer}.dim{font-family:Fredoka,sans-serif;font-weight:700;font-size:15px;fill:#1f3a1a;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:4px}
.wh2{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px}.wh2 .wh{display:flex;flex-direction:column;align-items:center;background:#fff;border-radius:14px;box-shadow:0 3px 0 #cfe0c4}
.wh2 .wh b{font-family:Fredoka,sans-serif;font-size:2rem;line-height:1.1}.wh2 .wh button{border:0;background:none;color:#3e7426;font-size:1.1rem;padding:2px 16px;cursor:pointer}.wh2 .u{font-weight:900;color:var(--muted)}
.jobRow{display:flex;justify-content:center;min-height:60px;margin-top:6px}.job{background:#fff;border:3px solid #8a5f36;border-radius:16px;padding:10px 14px;font-weight:900;max-width:320px;text-align:center;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.job.lift{box-shadow:0 10px 18px rgba(0,0,0,.2);position:relative;z-index:5}.job.sel{border-color:#f5b301;box-shadow:0 0 0 4px #ffe9a8}.job.done{font-size:.85rem;margin-top:6px;cursor:default}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.zone{min-height:150px;border-radius:20px;border:3px solid #cfe0c4;background:#f1f8ec;padding:10px;text-align:center;cursor:pointer}.zone:nth-child(2){background:#f8efe4;border-color:#e4cfb2}
.zone .big{font-size:2rem;display:block}.zone b{display:block;font-size:1.1rem}.zone small{display:block;font-weight:800;color:var(--muted);font-size:.78rem}.zone.good{border-color:#2f9e5b;background:#e3f6e8}.zone.faded{opacity:.5}
.task small{display:block;font-size:.8rem;opacity:.7;font-weight:800;margin-top:2px}
.rect .side{position:absolute;font-family:Fredoka,sans-serif;font-weight:700;font-size:1.05rem;white-space:nowrap;color:var(--ink)}
.rect .top{left:50%;top:-12px;transform:translate(-50%,-100%)}
.rect .left{top:50%;left:-14px;transform:translate(-100%,-50%)}
.which{font-size:3.4rem;text-align:center;margin-top:8px}
.setbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.setbtns button{border:0;border-radius:14px;padding:12px 4px;font-weight:900;font-size:1.05rem;background:#fff;box-shadow:0 4px 0 #d6e3c6}
.setbtns .go{background:var(--good);color:#fff;box-shadow:0 4px 0 #1f7041}
.setbtns button:disabled{opacity:.5}
.words{font-weight:900;color:var(--muted);font-size:1.08rem;min-height:1.5em;text-align:center;margin-top:8px}
.msg{text-align:center;font-weight:900;min-height:1.6em;font-size:1.1rem;margin-top:2px}
.msg.good{color:var(--good)}.msg.bad{color:var(--bad)}.msg.combo{color:#e07b00}
.msg.pop{animation:pop .35s}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.choice{border:0;border-radius:22px;padding:14px 6px;font-family:Fredoka,sans-serif;font-size:1.9rem;font-weight:700;color:var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.13);transition:transform .06s}
.choice small{display:block;font-size:.85rem;font-family:Nunito,sans-serif;font-weight:900}
.choice:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.13)}
.choice:nth-child(1){background:#d6efc4}.choice:nth-child(2){background:#ffe7a8}.choice:nth-child(3){background:#cfe7ff}.choice:nth-child(4){background:#ffd1e3}
.choice.right{background:var(--good)!important;color:#fff}
.choice.wrong{background:var(--bad)!important;color:#fff;animation:shake .35s}
.choice:disabled{cursor:default}
.hint{text-align:center;color:var(--muted);font-weight:800;font-size:.9rem;margin-top:8px}

/* ===== end of the day ===== */
.result{background:#fff;border-radius:28px;padding:26px 18px;text-align:center;box-shadow:var(--shadow);margin-top:8px}
.result .big{font-size:5.5rem;line-height:1.1;display:inline-block;animation:pop .6s}
.result h2{margin:6px 0;font-size:1.8rem}
.result .stars{font-size:2.6rem;letter-spacing:.1em}
.result p{color:var(--muted);font-weight:800;margin:6px 0}
.reward{display:inline-block;background:#fff6d6;border-radius:999px;padding:8px 16px;font-weight:900;margin:8px 0}
.mistakes{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.mistakes span{background:#fdeeee;color:#9b2c2c;border-radius:12px;padding:7px 11px;font-weight:900}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.btn{border:0;border-radius:16px;padding:14px 22px;font-weight:900;font-size:1.05rem;background:var(--brand);color:#fff;box-shadow:0 5px 0 var(--brand-dark)}
.btn.light{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

/* the explanation after a wrong answer: it stays until the child taps "Got it" */
.teach{margin-top:12px;background:#fff;border:3px solid #ffd166;border-radius:20px;padding:12px 14px 14px;box-shadow:0 10px 24px rgba(0,0,0,.1);animation:pop .3s}
.teach h3{margin:0 0 8px;font-size:1.15rem}
.teach h3 small{font-family:Nunito,sans-serif;font-size:.85rem;color:#7a7a7a;font-weight:800}
.teach ol{margin:0;padding-left:1.4em;font-weight:800;line-height:1.55}
.teach li{margin:3px 0}
.teach .cn{margin-top:8px;padding:8px 10px;border-radius:12px;background:#fff8e1;font-weight:800;font-size:.95rem;line-height:1.5}
.teach .pic{text-align:center;margin:2px 0 8px;line-height:1.1}
.teach .pic .grp{display:inline-block;margin:3px 5px;padding:4px 6px;border-radius:12px;background:#f2f5fb;vertical-align:middle}
.teach .ok{display:block;width:100%;margin-top:12px;border:0;border-radius:14px;padding:13px;font-weight:900;font-size:1.1rem;color:#fff;background:#3a7bd5;box-shadow:0 4px 0 #2a5ea8}
.teach .ok small{font-weight:800;opacity:.9}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media(max-width:620px){.plots{gap:8px}.plot .tag{font-size:.9rem}.choice{font-size:1.6rem}}
</style><script src="../game-progress.js?v=20261127a"></script><script src="adapt.js?v=20261127a"></script>
</head>
<body>
<div class="top">
  <a class="home" id="homeLink" href="../index.html">← Home</a>
  <div class="wallet">
    <span class="chip" id="coinChip">🌰 <span id="coinTotal">0</span></span>
    <button class="tbtn" type="button" id="soundBtn">🔔 Sound on</button>
  </div>
</div>
<div class="wrap">

<!-- ===== MAP ===== -->
<section id="map">
  <div class="hero">
    <h1>🌻 Garden Builder</h1>
    <p>Count the squares, plant the beds, build the fences!</p>
    <div class="mygarden" id="myGarden"></div>
    <div class="progress" id="progress"></div>
  </div>
  <div class="plots" id="plots"></div>
  <details class="panel" open>
    <summary>🛍️ Garden shop: seeds buy plants and friends <small>用种子装扮你的花园</small></summary>
    <div class="shop" id="shop"></div>
  </details>
  <details class="panel">
    <summary>📋 For parents: what is going well <small>给家长看：掌握情况</small></summary>
    <table class="skills" id="skills"></table>
  </details>
</section>

<!-- ===== BUILDING ===== -->
<section id="play" hidden>
  <div class="bar-top">
    <button class="tbtn" type="button" id="quitBtn">✕ Leave the garden</button>
    <span class="hearts" id="hearts"></span>
    <span class="chip">🌰 +<span id="pCoins">0</span></span>
  </div>
  <div class="stage" id="stage">
    <div class="task" id="task"></div>
    <div id="field"></div>
    <div class="counter" id="counter"></div>
    <div class="setbtns" id="setbtns" hidden>
      <button type="button" id="clearBtn">↺ Start again</button><button type="button" class="go" id="goBtn">✓ Done!</button>
    </div>
  </div>
  <div class="words" id="words"></div>
  <div class="msg" id="msg"></div>
  <div class="choices" id="choices"></div>
  <div class="teach" id="teach" hidden></div>
  <div class="hint" id="hint"></div>
</section>

<!-- ===== END OF THE DAY ===== -->
<section id="result" hidden>
  <div class="result">
    <div class="big" id="rBig"></div>
    <h2 id="rTitle"></h2>
    <div class="stars" id="rStars"></div>
    <div class="reward" id="rReward"></div>
    <p id="rSub"></p>
    <div id="rMissBox">
      <p>Practice these again:</p>
      <div class="mistakes" id="rMiss"></div>
    </div>
    <div class="row">
      <button class="btn" type="button" id="againBtn">Play again</button>
      <button class="btn light" type="button" id="mapBtn">Back to the garden</button>
    </div>
  </div>
</section>
</div>
<canvas id="confetti"></canvas>

<script>
(function(){
  "use strict";
  function rnd(n){ return Math.floor(Math.random()*n); }
  function between(a,b){ return a+rnd(b-a+1); }
  function pickOne(a){ return a[rnd(a.length)]; }
  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=rnd(i+1),t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  var ONES=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
  var TENS=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
  function inWords(n){ if(n<20) return ONES[n]; var t=TENS[Math.floor(n/10)], o=n%10; return o?t+"-"+ONES[o]:t; }
  function units(n,sq){ return n+" "+(sq?"square ":"")+"unit"+(n===1?"":"s"); }

  // ---------- the questions ----------
  // count: how many squares does the bed cover?  plant: plant a bed of n squares  rect: plant a w by h rectangle
  // area: a w by h bed (sides given), the area?  perim: the fence around a w by h bed?  L: an L-shaped bed, the area?
  // which: a sentence; does it need the area or the perimeter?
  var FLOWERS=["🌷","🌻","🌼","🌸","🥕","🥬","🍓","🌽"];
  var JOBS=[
    ["put a fence around the garden","p"],["put a rug on the whole floor","a"],["put a frame around a picture","p"],["plant grass on the whole yard","a"],
    ["put tape around the edge of a table","p"],["paint the whole wall","a"],["walk all the way around the park","p"],["cover the top of a box with paper","a"],
    ["hang lights around a window","p"],["put tiles on the kitchen floor","a"],["put a ribbon around the edge of a card","p"],["cover a table with a tablecloth","a"],
    ["build a wall around the castle","p"],["plant flowers in every square of the bed","a"],["put a border around the bulletin board","p"],["cover the floor of the tent with a mat","a"]
  ];
  var NAMES=["Mia","Leo","Ava","Sam","Zoe","Ben","Lily","Max","Ella","Noah","Grandpa","Grandma"];
  function Q(kind,a,b,c,d){ var q={kind:kind,a:a||0,b:b||0,c:c||0,d:d||0}; q.key=[kind,q.a,q.b,q.c,q.d].join("|"); return q; }
  function fromKey(k){ var s=k.split("|"); return Q(s[0],+s[1],+s[2],+s[3],+s[4]); }
  function rectQ(kind,maxW,maxH){ return Q(kind,between(2,maxW),between(2,maxH)); }
  function lQ(){ var W=between(4,8), H=between(3,6), cw=between(1,W-2), ch=between(1,H-1); return Q("L",W,H,cw,ch); }
  function whichQ(){ return Q("which",rnd(JOBS.length),rnd(NAMES.length)); }
  var PLOTS=[
    {id:"g1",e:"🔢",n:"Count the Squares",gen:function(){ return rectQ("count",6,5); }},
    {id:"g2",e:"🌱",n:"Plant a Garden",gen:function(){ return Q("plant",between(5,16)); }},
    {id:"g3",e:"✖️",n:"Rows Times Columns",gen:function(){ return Math.random()<.4?rectQ("rect",5,4):rectQ("area",9,7); }},
    {id:"g4",e:"🚧",n:"Fence It In",gen:function(){ return rectQ("perim",9,7); }},
    {id:"g5",e:"📐",n:"L-Shaped Gardens",gen:lQ},
    {id:"g6",e:"🤔",n:"Area or Perimeter?",gen:function(){ var r=Math.random(); return r<.5?whichQ():r<.75?rectQ("area",10,8):rectQ("perim",10,8); }}
  ];
  var BOSS={id:"boss",n:"Big Farm",gen:function(){ return pickOne(PLOTS).gen(); }};
  var PRACTICE={id:"practice",n:"Practice Patch"};
  var BOSS_NEED=3;
  var SHOP=[

        '<line class="cutl" x1="'+P+'" y1="'+(P+q.d*s)+'" x2="'+(P+cx*s)+'" y2="'+(P+q.d*s)+'"/><rect class="cuthit" data-c="h" x="'+P+'" y="'+(P+q.d*s-12)+'" width="'+(cx*s)+'" height="24" fill="rgba(0,0,0,0)"/>'; }
      else{ var a1,a2; if(cut==="v"){ a1=[cx,q.b]; a2=[q.c,q.b-q.d]; } else { a1=[cx,q.d]; a2=[q.a,q.b-q.d]; }
        var c1=cut==="v"?[P+cx*s/2,P+q.b*s/2]:[P+cx*s/2,P+q.d*s/2], c2=cut==="v"?[P+cx*s+q.c*s/2,P+q.d*s+(q.b-q.d)*s/2]:[P+q.a*s/2,P+q.d*s+(q.b-q.d)*s/2];
        h+='<text x="'+c1[0]+'" y="'+(c1[1]+6)+'" class="dim">'+a1[0]+' × '+a1[1]+'</text><text x="'+c2[0]+'" y="'+(c2[1]+6)+'" class="dim">'+a2[0]+' × '+a2[1]+'</text>'; }
      return h+'</svg>';
    }
    fd.innerHTML='<div class="fenceBox" id="lBox">'+svg()+'</div><div id="lAsk" hidden><div class="hcount">Add the two areas: 两块面积加起来</div>'+wheel2("lW")+'</div>'+doneBtn("That's the area ✓","这就是面积");
    $("hgo").disabled=true;
    var get=null;
    $("lBox").addEventListener("click",function(e){ if(!G||G.locked||cut) return; var c=e.target.getAttribute&&e.target.getAttribute("data-c"); if(!c) return;
      cut=c; SFX.plant(); $("lBox").innerHTML=svg(); $("lAsk").hidden=false; $("hgo").disabled=false; get=wireWheel($("lW")); });
    $("hgo").onclick=function(){ if(get) answer(String(get()),null); };
    $("hint").textContent="Each rectangle: length × width. Then add the two areas.";
  }
  // area or perimeter: drag the job card to "inside" or "around"
  function whichGame(q,fd){
    var job=JOBS[q.a], who=NAMES[q.b];
    $("task").innerHTML=who+" wants to <b>"+job[0]+"</b>. Drag the job to the right box! <small>把任务卡拖到对的格子</small>";
    fd.innerHTML='<div class="jobRow"><div class="job" id="job" tabindex="0" role="button">📝 '+job[0]+'</div></div><div class="zones"><div class="zone" data-v="a"><span class="big">🟩</span><b>Area</b><small>the space inside 里面有多大</small></div>'+
      '<div class="zone" data-v="p"><span class="big">🚧</span><b>Perimeter</b><small>the distance around 外面一圈多长</small></div></div>';
    var el=$("job"), sel=false;
    function put(z){ if(!G||G.locked) return; el.style.transform=""; z.appendChild(el); el.classList.add("done"); answer(z.dataset.v,null); }
    var sx=0,sy=0,on=false,moved=false;
    el.addEventListener("pointerdown",function(e){ if(!G||G.locked) return; on=true; moved=false; sx=e.clientX; sy=e.clientY; try{ el.setPointerCapture(e.pointerId); }catch(x){} });
    el.addEventListener("pointermove",function(e){ if(!on) return; var dx=e.clientX-sx, dy=e.clientY-sy; if(!moved&&Math.abs(dx)+Math.abs(dy)<8) return; moved=true; el.classList.add("lift"); el.style.transform="translate("+dx+"px,"+dy+"px)"; });
    el.addEventListener("pointerup",function(e){ if(!on) return; on=false; el.classList.remove("lift"); if(!moved){ sel=true; el.classList.add("sel"); return; }
      el.style.visibility="hidden"; var t=document.elementFromPoint(e.clientX,e.clientY); el.style.visibility=""; var z=t&&t.closest?t.closest(".zone"):null; if(z) put(z); else el.style.transform=""; });
    [].forEach.call(fd.querySelectorAll(".zone"),function(z){ z.addEventListener("click",function(){ if(sel) put(z); }); });
    $("words").textContent="Does "+(who.indexOf("Grand")===0?"they":who)+" need the area or the perimeter?";
  }
  function rightAnswer(q){
    if(q.kind==="count"||q.kind==="area") return String(q.a*q.b);
    if(q.kind==="plant") return String(q.a);
    if(q.kind==="rect") return Math.min(q.a,q.b)+"x"+Math.max(q.a,q.b);
    if(q.kind==="perim") return String(2*(q.a+q.b));
    if(q.kind==="L") return String(q.a*q.b-q.c*q.d);
    return JOBS[q.a][1];
  }
  function explain(q){
    if(q.kind==="count"||q.kind==="area") return q.b+" rows of "+q.a+" = "+q.a+" × "+q.b+" = "+units(q.a*q.b,true)+".";
    if(q.kind==="plant") return "Any shape of "+q.a+" squares has an area of "+units(q.a,true)+".";
    if(q.kind==="rect") return q.b+" rows of "+q.a+" squares: "+q.a+" × "+q.b+" = "+units(q.a*q.b,true)+".";
    if(q.kind==="perim") return q.a+" + "+q.b+" + "+q.a+" + "+q.b+" = "+units(2*(q.a+q.b))+" of fence.";
    if(q.kind==="L") return q.a+" × "+q.b+" = "+(q.a*q.b)+", take away the empty corner "+q.c+" × "+q.d+" = "+(q.c*q.d)+": "+units(q.a*q.b-q.c*q.d,true)+".";
    var j=JOBS[q.a]; return "To "+j[0]+" you need the "+(j[1]==="p"?"perimeter: the distance around.":"area: the space inside.");
  }
  // ---------- the explanation after a wrong answer ----------
  function teachShow(t,cont){
    var el=$("teach");
    el.innerHTML='<h3>💡 Let\'s see why <small>看看为什么</small></h3>'+(t.pic||"")+'<ol><li>'+t.steps.join("</li><li>")+'</li></ol>'+
      (t.cn?'<div class="cn">'+t.cn+'</div>':"")+'<button type="button" class="ok" id="teachOk">Got it! Next ➜ <small>明白了</small></button>';
    el.hidden=false;
    $("teachOk").onclick=function(){ el.hidden=true; cont(); };
    setTimeout(function(){ try{ el.scrollIntoView({behavior:"smooth",block:"nearest"}); $("teachOk").focus({preventScroll:true}); }catch(e){} },400);
  }
  function dotRows(rows,per,color){
    var h='<div class="pic" style="font-size:'+(per>6||rows>6?".85rem":"1.15rem")+';color:'+(color||"#3a7bd5")+'">';
    for(var r=0;r<rows;r++){ h+="●".repeat(per)+(r<rows-1?"<br>":""); }
    return h+"</div>";
  }
  function countBy(step,upto){ var a=[]; for(var v=step;v<=upto;v+=step) a.push(v); return a.join(", "); }
  function teachArea(q,val){
    var a=q.a, b=q.b, steps, cn, pic="";
    if(q.kind==="count"||q.kind==="area"){
      if(q.kind==="area") pic=dotRows(b,a,"#5a9e3a").replace(/●/g,"■");
      steps=[(q.kind==="area"?"Inside this bed fit ":"The bed has ")+"<b>"+b+" rows</b>, with <b>"+a+" squares</b> in each row.",
             "Count by "+a+"s: "+countBy(a,a*b)+". Or multiply: "+a+" × "+b+" = "+(a*b)+".",
             "So the area is <b>"+units(a*b,true)+"</b>."];
      if(q.kind==="area") steps.push("("+(2*(a+b))+" would be the fence around it: that is the perimeter, not the area.)");
      cn="面积 = 里面有多少个小方格。长方形的面积 = 长 × 宽（每行个数 × 行数）。";
    }else if(q.kind==="plant"){
      steps=["Area means <b>how many squares</b> you plant.","You needed exactly <b>"+a+"</b> squares, and you planted "+val+".","Any shape is fine. Just count as you plant: 1, 2, 3 … "+a+". (The picture above shows one way.)"];
      cn="面积 = 种了多少个方格。形状不限，数准就行。";
    }else if(q.kind==="rect"){
      steps=["A rectangle "+a+" squares long with "+b+" rows: make <b>"+b+" rows</b>, each with <b>"+a+" squares</b>, all touching, with straight sides.",
             "That is "+a+" × "+b+" = <b>"+(a*b)+" squares</b> in all.","The picture above shows one way to plant it."];
      cn="长方形：一共 "+b+" 行，每行 "+a+" 个，排整齐，没有空缺。";
    }else if(q.kind==="perim"){
      steps=["The fence goes <b>all the way around</b>: 4 sides.","Sides across from each other are the same length: "+a+", "+b+", "+a+", "+b+".",
             "Add them: "+a+" + "+b+" + "+a+" + "+b+" = <b>"+units(2*(a+b))+"</b>.","("+(a*b)+" would be the area inside, not the fence.)"];
      cn="周长 = 外面一圈的长度：把四条边都加起来。不要相乘，相乘算的是面积。";
    }else if(q.kind==="L"){
      var bot=a*(b-q.d), topA=(a-q.c)*q.d;
      steps=["Split the L into <b>two rectangles</b>.","The bottom part: "+a+" squares long, "+(b-q.d)+" "+(b-q.d===1?"row":"rows")+": "+a+" × "+(b-q.d)+" = "+bot+".",
             "The top part: "+(a-q.c)+" squares long, "+q.d+" "+(q.d===1?"row":"rows")+": "+(a-q.c)+" × "+q.d+" = "+topA+".",
             "Add them: "+bot+" + "+topA+" = <b>"+units(bot+topA,true)+"</b>.",
             "(Or: the whole box "+a+" × "+b+" = "+(a*b)+", minus the empty corner "+q.c+" × "+q.d+" = "+(q.c*q.d)+".)"];
      cn="把 L 形切成两个长方形，分别算面积，再加起来。";
    }else{
      var j=JOBS[q.a], per=j[1]==="p";
      steps=["<b>Area</b> = the space <b>inside</b>: you cover it, fill it, paint it or plant it.",
             "<b>Perimeter</b> = the distance <b>around</b> the edge: a fence, a frame, a border, a ribbon.",
             "To "+j[0]+", you go "+(per?"<b>around the edge</b>":"<b>over the whole inside</b>")+", so you need the <b>"+(per?"perimeter":"area")+"</b>."];
      cn="面积 = 里面铺满有多大；周长 = 外面围一圈有多长。";
    }
    return {steps:steps,cn:cn,pic:pic};
  }

  function say(text,cls){ var m=$("msg"); m.className="msg "+cls; void m.offsetWidth; m.textContent=text; m.classList.add("pop"); }
  function later(fn,ms){ clearTimeout(pending); pending=setTimeout(fn,ms); }
  function answer(val,btn){
    if(!G||G.locked) return; G.locked=true;
    var q=G.q, right=rightAnswer(q), ok=String(val)===right, f=fact(q.key), ms=Date.now()-G.t0;
    var ks=data.kinds[q.kind]||(data.kinds[q.kind]={ok:0,miss:0});
    [].forEach.call(document.querySelectorAll(".choice"),function(x){ x.disabled=true; if(x.dataset.v===right) x.classList.add("right"); });
    [].forEach.call(document.querySelectorAll("#setbtns button, #grid .cell"),function(b){ b.disabled=true; });
    if(!ok&&btn) btn.classList.add("wrong");
    var hg=$("hgo"); if(hg) hg.disabled=true;
    [].forEach.call(document.querySelectorAll("#field .hbtn"),function(b){ b.disabled=true; });
    if(q.kind==="which") [].forEach.call(document.querySelectorAll("#field .zone"),function(z){ z.classList.add(z.dataset.v===right?"good":"faded"); });
    if(q.kind==="perim"&&!ok) [].forEach.call(document.querySelectorAll("#field .edge"),function(e){ var k=e.getAttribute("data-k"), t=k.charAt(0), xy=k.slice(1).split("_");
      var o=t==="h"?(+xy[1]===0||+xy[1]===q.b):(+xy[0]===0||+xy[0]===q.a); e.classList.toggle("on",o); e.classList.toggle("bad",!o&&e.classList.contains("on")); });
    if(!ok&&(q.kind==="plant"||q.kind==="rect")){
      // show one right way to do it
      var w=q.kind==="rect"?q.a:Math.min(q.a,8), h=q.kind==="rect"?q.b:Math.ceil(q.a/8);
      $("field").innerHTML=gridHtml(8,5,function(x,y){ return q.kind==="rect"?(x<w&&y<h):(y*8+x<q.a); },{icon:G.icon});
      $("counter").textContent="One way to do it:";
    }
    $("words").textContent=explain(q);
    $("hint").textContent="";
    G.left--;
    if(ok){
      f.ok++; ks.ok++; G.correct++; G.streak++; G.best=Math.max(G.best,G.streak);
      var fast=ms<((q.kind==="plant"||q.kind==="rect")?20000:8000), gain=fast?2:1; var extra=Adapt.right(G); G.coins+=gain+extra; $("pCoins").textContent=G.coins;
      if(fast) SFX.fast(); else SFX.grow();
      if(extra) say("⚡ Challenge solved! +"+extra+" coins!","combo");
      else if(G.streak>=3) say("🔥 "+G.streak+" jobs done in a row!","combo");
      else say(fast?"⚡ Speedy gardener! Two seeds!":pickOne(["Great job!","Your garden grows!","You got it!","Lovely work!"]),"good");
    }else{
      var free=Adapt.wrong(G); G.streak=0;   // a missed challenge costs no heart and is not practised later
      if(!free){ f.miss++; ks.miss++; G.miss[q.key]=q; G.again.push(q.key); }
      SFX.oops();
      if(G.hearts!==Infinity&&!free) G.hearts--;
      say(q.kind==="plant"?"Count again: you planted "+val+".":q.kind==="rect"?"Not quite that rectangle.":q.kind==="count"?"You counted "+val+": some squares were missed.":q.kind==="area"?"That makes "+val+" squares: count the rows on the side.":
          q.kind==="perim"?"Not quite: the fence must go all the way around, only on the outside. Look at the brown fence.":q.kind==="L"?"Not quite: "+val+". Find each rectangle's area, then add.":"Not this box: look again at the job.","bad");
    }
    save(); renderHearts();
    var cont=G.hearts<=0?function(){ finish(false); }:G.left<=0?function(){ SFX.win(); finish(true); }:next;
    if(ok) later(cont,1800); else teachShow(teachArea(q,val),cont);
  }
  function missText(q){
    if(q.kind==="count"||q.kind==="area"||q.kind==="rect") return q.a+" × "+q.b+" = "+(q.a*q.b);
    if(q.kind==="plant") return "plant "+q.a+" squares";
    if(q.kind==="perim") return "fence "+q.a+" + "+q.b+" + "+q.a+" + "+q.b+" = "+(2*(q.a+q.b));
    if(q.kind==="L") return "L: "+(q.a*q.b)+" − "+(q.c*q.d)+" = "+(q.a*q.b-q.c*q.d);
    return JOBS[q.a][0]+": "+(JOBS[q.a][1]==="p"?"perimeter":"area");
  }
  function finish(won){
    clearTimeout(pending);
    var P=G.P, stars=0, bonus=0;
    if(won){
      if(P===PRACTICE) bonus=5;
      else{ stars=G.hearts; if(stars>starsOf(P.id)) data.plots[P.id]={stars:stars}; bonus=stars*5; }
    }
    data.coins+=G.coins+bonus; save();
    if(window.GameProgress) GameProgress.report({game:GID,level:G.P.id,name:G.P.n,practice:G.P===PRACTICE,won:!!won,stars:stars,correct:G.correct,total:G.total!=null?G.total-G.left:G.correct+Object.keys(G.miss).length,best:G.best});
    $("rBig").textContent=won?(P===PRACTICE?"🪴":"🌻"):"🌧️";
    $("rTitle").textContent=won?(P===PRACTICE?"Practice done!":"Garden finished: "+P.n+(/[?!]$/.test(P.n)?"":"!")):"The garden needs more work. Try again!";
    $("rStars").textContent=(won&&P!==PRACTICE)?starText(stars):"";
    $("rReward").textContent="🌰 +"+(G.coins+bonus)+(bonus?" (bonus +"+bonus+")":"");
    $("rSub").textContent=G.correct+" jobs done · best streak "+G.best+(won&&P!==PRACTICE&&stars<3?" · Keep all your hearts to get 3 stars":"");
    var miss=Object.keys(G.miss);
    $("rMissBox").hidden=!miss.length;
    $("rMiss").innerHTML=miss.map(function(k){ return "<span>"+missText(G.miss[k])+"</span>"; }).join("");
    show("result");
    if(won) confetti(); else SFX.lose();
  }
  function quit(){ clearTimeout(pending); renderMap(); show("map"); }
  $("quitBtn").onclick=function(){ G=null; quit(); };
  $("mapBtn").onclick=quit;
  $("againBtn").onclick=function(){ var P=G.P; if(P===PRACTICE&&!missList().length){ quit(); return; } start(P); };
  document.addEventListener("keydown",function(e){
    if($("play").hidden) return;
    var i="1234".indexOf(e.key); if(i<0) return;
    var b=document.querySelectorAll(".choice")[i]; if(b&&!b.disabled) b.click();
  });

  // ---------- confetti ----------
  function confetti(){
    if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var cv=$("confetti"),ctx=cv.getContext("2d"); cv.width=innerWidth; cv.height=innerHeight;
    var cols=["#f5b301","#2f9e5b","#e86a9c","#5a9e3a","#3aa3c4"],ps=[];
    for(var i=0;i<150;i++) ps.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6.28,c:cols[i%5],s:6+Math.random()*6});
    var t0=performance.now();
    (function loop(t){
      ctx.clearRect(0,0,cv.width,cv.height);
      ps.forEach(function(p){ p.x+=p.vx; p.y+=p.vy; p.r+=.1; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); });
      if(t-t0<3000) requestAnimationFrame(loop); else ctx.clearRect(0,0,cv.width,cv.height);
    })(t0);
  }

  // inside the site's reader window the reader's own close button takes the child back to the shelf
  var framed=true; try{ framed=window.self!==window.top; }catch(e){}
  if(framed) $("homeLink").style.visibility="hidden";

  // for the tests: the question makers, without playing
  window.__garden={gen:function(i){ return (i==="boss"?BOSS:PLOTS[i]).gen(); },rightAnswer:rightAnswer,numChoices:numChoices,jobs:JOBS,cur:function(){ return G&&G.q; }};

  renderSound(); renderMap();
})();
</script>
</body></html>
