<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Party Bakery</title>

<style>
:root{--ink:#2b2a3f;--muted:#6f6a86;--bg:#fff6ec}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:Nunito,ui-rounded,"Trebuchet MS",Arial,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.wrap{max-width:560px;margin:0 auto;padding:10px 12px 20px;position:relative}
.top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.tbtn{background:#fff;border:1px solid #f3dcc4;border-radius:13px;padding:8px 12px;color:var(--ink);text-decoration:none;font:inherit;font-weight:900;cursor:pointer}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.hud div{background:#fff;border-radius:14px;text-align:center;padding:4px;box-shadow:0 3px 0 #f3dcc4}
.hud small{display:block;font-weight:800;color:var(--muted);font-size:.7rem}.hud b{font-family:Fredoka,sans-serif;font-size:1.35rem}
.stage{position:relative;height:max(440px,calc(100vh - 380px));border-radius:22px;overflow:hidden;display:flex;flex-direction:column;background:#fff;box-shadow:0 4px 0 #f3dcc4;touch-action:none}
/* the shop counter: the customers come here */
.shop{position:relative;height:112px;flex:none;background:linear-gradient(180deg,#ffe3ec 0 62%,#c98a4b 62% 70%,#a8703a 70%);overflow:hidden}
.awn{position:absolute;left:0;right:0;top:0;height:16px;background:repeating-linear-gradient(90deg,#e0457b 0 22px,#fff 22px 44px);border-radius:0 0 10px 10px}
.decor{position:absolute;top:22px;font-size:1.4rem;line-height:1;pointer-events:none}
.helper{position:absolute;left:8px;top:22px;display:flex;align-items:flex-start;gap:5px;z-index:4;max-width:55%}
.pet{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;font-size:2rem}.pet.cheer{animation:bob .5s 2}@keyframes bob{50%{transform:translateY(-8px)}}
.bub{background:#fff;border-radius:12px;padding:4px 8px;font-weight:900;font-size:.72rem;line-height:1.2;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.critter{position:absolute;bottom:38px;width:56px;margin-left:-28px;line-height:0;z-index:3;transition:left 1s linear}
.critter svg{width:100%;height:auto;overflow:visible}.critter b{display:block;animation:idle 1.6s ease-in-out infinite}.critter.walk b{animation:walk .3s ease-in-out infinite}
@keyframes idle{50%{transform:translateY(-3px)}}@keyframes walk{50%{transform:translateY(-7px) rotate(5deg)}}
.order{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:2px;background:#fff;border:2px solid #f0c26a;border-radius:10px;padding:2px 7px;font-size:.72rem;font-weight:900;white-space:nowrap;line-height:1.3}
.heart{position:absolute;font-size:1.2rem;z-index:9;pointer-events:none;animation:heart 1.1s ease-out forwards}@keyframes heart{to{transform:translateY(-40px) scale(1.4);opacity:0}}
/* the work table */
.table{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#fffaf2 0 14px,#fff3e3 14px 28px)}
#work{touch-action:none;overflow:visible}
#work .peg{cursor:pointer}#work .hit{fill:transparent;cursor:pointer}
#work .tick{cursor:pointer}
#work.bake .cookie{animation:bake 1s ease-in-out}@keyframes bake{30%{filter:brightness(1.4)}60%{transform:scale(1.06)}}
.oven{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:5rem;animation:ovn .9s ease-in-out;pointer-events:none;z-index:5}@keyframes ovn{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}40%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}
.task{background:#fff;border-radius:18px;padding:9px 12px;margin-top:8px;text-align:center;font-weight:900;font-size:1.06rem;box-shadow:0 3px 0 #f3dcc4}
.task .cn{display:block;font-size:.8rem;color:var(--muted);font-weight:800;margin-top:2px}.task b{font-family:Fredoka,sans-serif;font-size:1.2em;color:#c2306a}
.btns{display:grid;grid-template-columns:1fr 1fr 2fr;gap:8px;margin-top:8px}
.btns button{border:0;border-radius:16px;background:#fff;font:inherit;font-weight:900;font-size:1.05rem;padding:11px 4px;box-shadow:0 5px 0 #f3dcc4;cursor:pointer;color:var(--ink)}
.btns button.main{background:#f5b301;color:#3b2a00;box-shadow:0 5px 0 #b88a00;font-size:1.15rem}
.btns.pick{grid-template-columns:repeat(2,1fr)}.btns.pick3{grid-template-columns:repeat(3,1fr)}.btns.pick4{grid-template-columns:repeat(4,1fr)}
.btns button.bad{background:#ffd6d0;animation:shake .4s}.btns button svg{display:block;margin:0 auto;width:100%;max-width:90px;height:auto}
.ans{display:none;grid-template-columns:auto 1fr;gap:8px;margin-top:8px}
.show{background:#fff;border-radius:16px;box-shadow:0 3px 0 #f3dcc4;min-width:86px;display:flex;align-items:center;justify-content:center;padding:4px 10px;font-family:Fredoka,sans-serif;font-size:2rem}.show.blank{color:#ecd8c2}
.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.k{border:0;border-radius:12px;background:#fff;font-family:Fredoka,sans-serif;font-weight:700;font-size:1.35rem;padding:7px 0;box-shadow:0 4px 0 #f3dcc4;cursor:pointer;color:var(--ink)}.k.ok{background:#f5b301;color:#3b2a00;box-shadow:0 4px 0 #b88a00;font-size:1.1rem}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}.shake{animation:shake .4s}
.glow{animation:glow 1s ease-in-out infinite}@keyframes glow{50%{opacity:.35}}
.float{position:absolute;font-family:Fredoka,sans-serif;font-weight:700;font-size:1.5rem;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);pointer-events:none;animation:up 1.1s forwards;z-index:9}@keyframes up{to{transform:translateY(-50px);opacity:0}}
.fly{position:absolute;z-index:8;pointer-events:none;transition:left .5s ease-in,top .5s ease-in,transform .5s}
.over{position:absolute;inset:0;background:rgba(80,30,20,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:16px;z-index:10}
.over h2{font-family:Fredoka,sans-serif;margin:0 0 6px;font-size:1.9rem}.over p{margin:4px 0;font-weight:800}
.go{border:0;border-radius:999px;padding:13px 28px;font:inherit;font-weight:900;font-size:1.15rem;background:#f5b301;color:#3b2a00;box-shadow:0 5px 0 #b88a00;cursor:pointer;margin-top:12px}
.how{background:#fff;color:var(--ink);border-radius:16px;padding:10px 12px;font-weight:800;font-size:.9rem;text-align:left;margin-top:8px;max-width:420px}.how div{margin:4px 0}
.shopg{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;max-width:380px;margin-top:10px}
.shopg button{border:0;border-radius:14px;background:#fff;padding:6px 2px;font:inherit;font-weight:900;font-size:.75rem;color:var(--ink);cursor:pointer}.shopg button i{display:block;font-style:normal;font-size:1.8rem}
.shopg button.own{background:#d6f5e6}.shopg button:disabled{opacity:.45;cursor:default}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:20}
.wrap.fitted{max-width:none;display:flex;flex-direction:column;overflow:hidden}
.wrap.fitted .stage{flex:1;height:auto;min-height:330px}
.wrap.fitted .shop{height:132px}.wrap.fitted .critter{width:70px;margin-left:-35px}.wrap.fitted .pet{width:60px;height:60px}.wrap.fitted .bub{font-size:.9rem}.wrap.fitted .order{font-size:.9rem}.wrap.fitted .decor{font-size:1.9rem}
@media(min-width:900px){.wrap.fitted .top,.wrap.fitted .hud,.wrap.fitted .bottom{width:100%;max-width:820px;margin-left:auto;margin-right:auto}.wrap.fitted .keys{grid-template-columns:repeat(12,1fr)}}
</style>

<div class="wrap" id="wrap">
  <div class="top"><a class="tbtn" href="../index.html" id="home">← Home</a><b style="font-family:Fredoka,sans-serif;font-size:1.25rem">🧁 Party Bakery</b><span><button class="tbtn" type="button" id="helpBtn" aria-label="How to play">?</button> <button class="tbtn" type="button" id="soundBtn">🔔</button></span></div>

    <div class="shop" id="shop"><div class="awn"></div><div id="decor"></div>
      <div class="helper"><div class="pet" id="pet"></div><div class="bub" id="bub">Welcome to the bakery! 欢迎来烘焙坊！</div></div>
      <div id="actor"></div></div>

  </div>

<script>
(function(){
  "use strict";
  // Party Bakery (Grade 2, Unit 6: geometry). Animals order party treats; 6 orders a level, 5 done (in two tries) opens the next.
  //   level 1  shape cookies on a peg board: "a cookie with 5 sides" - tap pegs to stretch the dough band, back to the first peg to close;
  //            corners are counted (pegs in a straight line are not corners); then it is baked
  //   level 2  name it and count: how many sides? how many angles? which shape is it? how many faces does a cube have?
  //   level 3  brownie trays: tap the marks on the edges to cut rows and columns of same-size squares, then count the brownies
  //   level 4  share a pizza or a cake: tap the marks on the edge to cut it into 2, 3 or 4 equal shares; then name a piece (half, third, fourth)
  //   level 5+ all of these, and "which one is cut into equal shares?"
  // Inside a level the first orders are easier, a miss makes the next one easier, a run of right answers brings harder ones.
  var $=function(id){ return document.getElementById(id); };
  var STORE="partyBakery.v1", S={day:1,coins:0,deco:{},tut:0,sound:true};
  try{ var s0=JSON.parse(localStorage.getItem(STORE)); if(s0) for(var k in s0) S[k]=s0[k]; }catch(e){}
  function save(){ try{ localStorage.setItem(STORE,JSON.stringify(S)); }catch(e){} }
  var L=S.day, D=null, Q=null, busy=false, val="", GOAL=6;
  function rnd(n){ return Math.floor(Math.random()*n); }
  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=rnd(i+1), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  var actx=null;
  function tone(fs,len,type){ if(!S.sound) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); fs.forEach(function(f,i){ var t=actx.currentTime+i*len*.7, o=actx.createOscillator(), g=actx.createGain(); o.type=type||"triangle"; o.frequency.value=f; g.gain.setValueAtTime(.13,t); g.gain.exponentialRampToValueAtTime(.001,t+len); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+len+.02); }); }catch(e){} }
  $("soundBtn").onclick=function(){ S.sound=!S.sound; $("soundBtn").textContent=S.sound?"🔔":"🔕"; save(); };
  $("soundBtn").textContent=S.sound?"🔔":"🔕";
  try{ if(window.self!==window.top) $("home").style.visibility="hidden"; }catch(e){}
  var pet=window.MathPet?MathPet.get():null;
  $("pet").innerHTML=pet?MathPet.pic(pet,"happy",60):"🐣";
  function say(t){ $("bub").innerHTML=t; var p=$("pet"); p.classList.remove("cheer"); void p.offsetWidth; p.classList.add("cheer"); }
  function Z(){ return parseFloat($("wrap").style.zoom)||1; }
  var DECO=[{id:"balloon",e:"🎈",p:5},{id:"gift",e:"🎁",p:8},{id:"cake",e:"🎂",p:12},{id:"ribbon",e:"🎀",p:16},{id:"party",e:"🎉",p:22},{id:"lantern",e:"🏮",p:28},{id:"crown",e:"👑",p:36},{id:"star",e:"🌟",p:45}];
  function drawDeco(){ $("decor").innerHTML=DECO.filter(function(d){ return S.deco[d.id]; }).map(function(d,i){ return '<span class="decor" style="right:'+(4+i*8)+'%">'+d.e+'</span>'; }).join(""); }
  var NAMES={3:["triangle","三角形"],4:["quadrilateral","四边形"],5:["pentagon","五边形"],6:["hexagon","六边形"]};
  // ---------- the work area: one svg, its size fits the table ----------
  function sizeWork(vw,vh){ var t=$("table"), w=t.clientWidth-16, h=t.clientHeight-12, s=Math.min(w/vw,h/vh); var sv=$("work"); sv.setAttribute("viewBox","0 0 "+vw+" "+vh); sv.setAttribute("width",Math.max(60,vw*s)); sv.setAttribute("height",Math.max(60,vh*s)); }
  function svgPt(e){ var sv=$("work"), r=sv.getBoundingClientRect(), vb=sv.viewBox.baseVal; return {x:(e.clientX-r.left)/r.width*vb.width, y:(e.clientY-r.top)/r.height*vb.height}; }
  // ---------- level 1: the peg board ----------
  var G=5, GS=60, GP=30;   // 5 x 5 pegs, 60 apart, 30 from the edge
  function pegXY(i){ return [GP+(i%G)*GS, GP+Math.floor(i/G)*GS]; }
  function corners(path){   // the corners of a closed path of peg numbers: pegs on a straight line are not corners
    var pts=path.map(pegXY), n=pts.length, out=[];
    for(var i=0;i<n;i++){ var a=pts[(i+n-1)%n], b=pts[i], c=pts[(i+1)%n]; if((b[0]-a[0])*(c[1]-b[1])-(b[1]-a[1])*(c[0]-b[0])!==0) out.push(b); }
    return out;
  }
  function crosses(pts){   // do any two sides that don't meet at a corner cross?
    var n=pts.length; function cr(p,q,r){ return (q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0]); }
    for(var i=0;i<n;i++) for(var j=i+1;j<n;j++){ if(j===i+1||(i===0&&j===n-1)) continue; var a=pts[i], b=pts[(i+1)%n], c=pts[j], d=pts[(j+1)%n];
      var d1=cr(c,d,a), d2=cr(c,d,b), d3=cr(a,b,c), d4=cr(a,b,d); if(((d1>0&&d2<0)||(d1<0&&d2>0))&&((d3>0&&d4<0)||(d3<0&&d4>0))) return true; }
    return false;
  }
  function area(pts){ var s=0; for(var i=0;i<pts.length;i++){ var a=pts[i], b=pts[(i+1)%pts.length]; s+=a[0]*b[1]-b[0]*a[1]; } return Math.abs(s)/2; }
  function drawBoard(){
    var vw=GP*2+(G-1)*GS, h='<rect x="4" y="4" width="'+(vw-8)+'" height="'+(vw-8)+'" rx="18" fill="#e9c891" stroke="#b5874b" stroke-width="4"/>';
    var pts=Q.path.map(pegXY);
    if(Q.closed) h+='<polygon class="cookie" points="'+pts.map(function(p){ return p.join(","); }).join(" ")+'" fill="'+(Q.baked?"#d9954a":"#f6d9a4")+'" stroke="#8a5a2b" stroke-width="5" stroke-linejoin="round"/>';
    else if(pts.length) h+='<polyline points="'+pts.map(function(p){ return p.join(","); }).join(" ")+'" fill="none" stroke="#e0457b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>';
    if(Q.baked) corners(Q.path).forEach(function(c){ h+='<circle cx="'+c[0]+'" cy="'+c[1]+'" r="6" fill="#ff4f8a"/>'; });
    for(var i=0;i<G*G;i++){ var p=pegXY(i), on=Q.path.indexOf(i), first=on===0&&!Q.closed&&Q.path.length>2;
      h+='<circle class="peg" cx="'+p[0]+'" cy="'+p[1]+'" r="'+(on>=0?9:7)+'" fill="'+(first?"#ffd84a":on>=0?"#e0457b":"#7a5230")+'"'+(first?' class="peg glow"':'')+'/><circle class="hit" data-peg="'+i+'" cx="'+p[0]+'" cy="'+p[1]+'" r="24"/>'; }
    $("work").innerHTML=h; sizeWork(vw,vw);
  }
  function tapPeg(i){
    if(busy||Q.closed) return;
    var at=Q.path.indexOf(i);
    if(at===0&&Q.path.length>=3){ Q.closed=true; tone([660,880],.07); drawBoard(); say("Closed! Tap <b>Bake</b>. 围好了！点“烤”。"); return; }
    if(at>=0){ tone([200],.05); return; }
    Q.path.push(i); tone([500+Q.path.length*40],.04); drawBoard();
    if(Q.path.length===1) say("Now the next corner… and back to the first peg to close! 再点下一个角，最后回到第一颗钉子！");
  }
  $("work").addEventListener("click",function(e){
    var t=e.target; if(!Q||busy) return;
    if(t.dataset&&t.dataset.peg!=null) return tapPeg(+t.dataset.peg);
    if(t.dataset&&t.dataset.cut!=null) return tapCut(t.dataset.cut);
  });
  function bake(){
    if(busy) return;
    if(!Q.closed){ say("Close the shape: tap the first peg again! 回到第一颗钉子把形状围起来！"); return; }
    var pts=Q.path.map(pegXY), c=corners(Q.path);
    if(crosses(pts)||area(pts)===0||c.length<3){ Q.tries++; tone([200,150],.12,"sawtooth"); say("The sides cross! A cookie can't have crossing sides. Start over. 边交叉了，重新围一个！"); Q.path=[]; Q.closed=false; drawBoard(); return checkMiss(); }
    if(c.length!==Q.n){ Q.tries++; tone([200,150],.12,"sawtooth"); Q.baked=true; drawBoard(); say("That cookie has "+c.length+" sides. We need "+Q.n+"! 这个有 "+c.length+" 条边，要 "+Q.n+" 条！");
      setTimeout(function(){ if(Q.t==="board"&&!Q.fixedDone){ Q.path=[]; Q.closed=false; Q.baked=false; drawBoard(); } },1400); return checkMiss(); }
    Q.baked=true; busy=true; $("table").insertAdjacentHTML("beforeend",'<div class="oven" id="oven">♨️</div>'); setTimeout(function(){ var o=$("oven"); if(o) o.remove(); },900);
    tone([300,400,500],.12,"sine"); var sv=$("work"); sv.classList.remove("bake"); void sv.offsetWidth; sv.classList.add("bake");
    setTimeout(function(){ drawBoard(); say(c.length+" sides, "+c.length+" angles: a "+NAMES[c.length][0]+"! "+c.length+" 条边、"+c.length+" 个角："+NAMES[c.length][1]+"！"); setTimeout(function(){ done(true); },1300); },700);
  }
  function checkMiss(){ if(Q.tries>=2){ busy=true; Q.fixedDone=true; Q.path=Q.example; Q.closed=true; Q.baked=true; setTimeout(function(){ drawBoard(); say("Like this: "+Q.n+" sides! 像这样："+Q.n+" 条边！"); setTimeout(function(){ done(false); },1800); },900); } }
  var EXAMPLES={3:[0,4,22],4:[5,8,23,20],5:[2,9,23,21,5],6:[1,3,14,23,21,10]};
  // ---------- level 2: name and count ----------
  var SHAPES=[[3,[2,20,24]],[3,[0,4,20]],[3,[1,23,10]],[4,[6,8,18,16]],[4,[5,9,24,20]],[4,[1,3,19,15]],[4,[2,14,22,10]],[5,[2,14,24,20,10]],[5,[2,9,18,16,5]],[6,[1,3,14,23,21,10]],[6,[2,8,18,22,16,6]]];
  function drawShape(path,fill){ var pts=path.map(pegXY), vw=GP*2+(G-1)*GS; return '<polygon points="'+pts.map(function(p){ return p.join(","); }).join(" ")+'" fill="'+(fill||"#d9954a")+'" stroke="#8a5a2b" stroke-width="5" stroke-linejoin="round"/>'; }
  function drawCube(){ return '<g stroke="#8a5a2b" stroke-width="5" stroke-linejoin="round"><polygon points="80,110 180,110 180,210 80,210" fill="#f6c77d"/><polygon points="80,110 130,70 230,70 180,110" fill="#ffe0a8"/><polygon points="180,110 230,70 230,170 180,210" fill="#d9954a"/></g>'; }
  // ---------- level 3: the brownie tray ----------
  var TU=60, TP=34;
  function drawTray(){
    var vw=TP*2+Q.c*TU, vh=TP*2+Q.r*TU, h='<rect x="'+(TP-8)+'" y="'+(TP-8)+'" width="'+(Q.c*TU+16)+'" height="'+(Q.r*TU+16)+'" rx="10" fill="#b0b8c4"/><rect x="'+TP+'" y="'+TP+'" width="'+(Q.c*TU)+'" height="'+(Q.r*TU)+'" fill="#7a4a2a"/>';
    for(var i=0;i<Q.c*Q.r;i++){ var x=TP+(i%Q.c)*TU, y=TP+Math.floor(i/Q.c)*TU; h+='<circle cx="'+(x+18+(i*7)%24)+'" cy="'+(y+16+(i*11)%28)+'" r="3" fill="#5a3418"/>'; }
    for(var c=1;c<Q.c;c++){ var x2=TP+c*TU, on=Q.cuts["c"+c]; if(on) h+='<line x1="'+x2+'" y1="'+TP+'" x2="'+x2+'" y2="'+(TP+Q.r*TU)+'" stroke="#fff3e3" stroke-width="5"/>';

    return '<p style="margin-top:10px">🎉 Party shop 派对商店 · 🪙 '+S.coins+'</p><div class="shopg" id="shopg">'+DECO.map(function(d){
      var own=S.deco[d.id]; return '<button type="button" data-id="'+d.id+'" class="'+(own?"own":"")+'"'+(!own&&S.coins<d.p?" disabled":"")+'><i>'+d.e+'</i>'+(own?"✓":d.p+" 🪙")+'</button>'; }).join("")+'</div>';
  }
  function wireShop(){
    [].forEach.call(document.querySelectorAll("#shopg button"),function(b){ b.onclick=function(){
      var d=DECO.filter(function(x){ return x.id===b.dataset.id; })[0]; if(!d||S.deco[d.id]||S.coins<d.p) return;
      S.coins-=d.p; S.deco[d.id]=1; save(); drawDeco(); $("coins").textContent=S.coins; tone([660,880,1100],.08);
      $("shopg").outerHTML=shopHtml().replace(/^<p[^>]*>.*?<\/p>/,""); wireShop();
    }; });
  }
  function levelPick(){ return window.LevelPick?LevelPick.html("shapes2",S.day,L):""; }
  function playLabel(){ return S.day>1||L>1?"Level "+L+" ▶ 开始第 "+L+" 关":"Play! 开始"; }
  function wirePick(){ if(window.LevelPick) LevelPick.wire(function(n){ L=n; $("day").textContent=L; var b=$("play")||$("nextDay"); if(b) b.textContent=playLabel(); }); }
  function over(html){ closeOver(); var o=document.createElement("div"); o.className="over"; o.id="over"; o.innerHTML=html; $("wrap").appendChild(o); }
  function closeOver(){ var o=$("over"); if(o) o.remove(); }
  var HOW='<div class="how"><div>🍪 Shape cookies: tap pegs to stretch the dough, then the first peg again to close it. Bake!</div><div>🔢 Count sides and angles, and name the shape.</div><div>🟫 Brownies: tap the marks on the edges to cut rows and columns.</div><div>🍕 Share pizzas and cakes in equal pieces: halves, thirds, fourths.</div><div style="color:var(--muted)">点钉子围出形状再烤成饼干；数边和角、说出形状名称；点边上的记号把布朗尼切成几行几列；把披萨和蛋糕平均分成 2、3、4 份。</div></div>';
  function intro(){ over('<h2>🧁 Party Bakery</h2><p>Shapes &amp; Equal Shares Practice 图形和平均分</p>'+HOW+levelPick()+'<button type="button" class="go" id="play">'+playLabel()+'</button>'); wirePick(); $("play").onclick=startLevel; }
  $("helpBtn").onclick=function(){ var o=document.createElement("div"); o.className="over"; o.innerHTML='<h2>❓ How to play</h2>'+HOW+'<button type="button" class="go">Got it! 明白了</button>'; $("wrap").appendChild(o); o.querySelector(".go").onclick=function(){ o.remove(); }; };
  var cv=$("fx"), cx=cv.getContext("2d"), parts=[], anim=0;
  function burst(x,y){ cv.width=innerWidth; cv.height=innerHeight; for(var i=0;i<16;i++) parts.push({x:x,y:y,vx:(Math.random()-.5)*7,vy:-Math.random()*6-1,l:32,c:["#f5b301","#ff7a8a","#7cc47f","#4aa3ff","#a46bff"][i%5]}); if(!anim) anim=requestAnimationFrame(fx); }
  function fx(){ cx.clearRect(0,0,cv.width,cv.height); parts=parts.filter(function(p){ p.x+=p.vx; p.y+=p.vy; p.vy+=.3; p.l--; cx.fillStyle=p.c; cx.fillRect(p.x,p.y,6,6); return p.l>0; }); anim=parts.length?requestAnimationFrame(fx):0; if(!anim) cx.clearRect(0,0,cv.width,cv.height); }
  if(window.FitScreen) FitScreen($("wrap"),{wide:[1000,680],narrow:[520,900],max:1.7});
  // the panel below changes size (buttons, keypad): the work area is sized again
  function resize(){ if(!Q) return; if(Q.t==="board") drawBoard(); else if(Q.t==="tray") drawTray(); else if(Q.t==="share") drawShare(); else { var sv=$("work"), vb=sv.viewBox.baseVal; if(vb&&vb.width) sizeWork(vb.width,vb.height); } }
  var rt=0; window.addEventListener("resize",function(){ clearTimeout(rt); rt=setTimeout(resize,150); });
  new MutationObserver(function(){ requestAnimationFrame(function(){ if(Q){ var sv=$("work"), vb=sv.viewBox.baseVal; if(vb&&vb.width) sizeWork(vb.width,vb.height); } }); }).observe($("wrap").querySelector(".bottom"),{childList:true,subtree:true,attributes:true,attributeFilter:["style","class"]});
  drawDeco(); hud(); $("task").innerHTML="🧁 Welcome to the Party Bakery! 欢迎来派对烘焙坊！";
  window.__bake={q:function(){ return Q; },d:function(){ return D; },s:function(){ return S; },start:startLevel,peg:pegXY};
  intro();
})();
</script>
