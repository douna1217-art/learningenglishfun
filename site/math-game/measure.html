<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Potion Lab</title>
<meta name="theme-color" content="#6a4fc4">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="description" content="Potion Lab: hold to pour, stop right on the line! Brew potions in liters, grams and kilograms to cure Sparky the little dragon. Grade 3 measuring in English.">
<link href="/fonts/fonts.css" rel="stylesheet">
</head><body>
<script src="engine.js"></script>
<script>
(function(){
  "use strict";
  var M=MathGame, between=M.between, pickOne=M.pickOne, rnd=M.rnd;
  function Q(kind,d){ d.kind=kind; d.key=kind+"|"+JSON.stringify(d); return d; }
  function fromKey(k){ var i=k.indexOf("|"); var d=JSON.parse(k.slice(i+1)); d.key=k; return d; }
  var POTIONS=[["#58c858","green"],["#4aa8ff","blue"],["#b678ff","purple"],["#ff7fa8","pink"],["#ffa83c","orange"]];
  var SANDS=[["⭐","star sugar","#ffd84a"],["🌙","moon sand","#c9c3ff"],["🌸","flower dust","#ffb3cf"],["❄️","snow salt","#d8f0ff"]];
  var LIGHT=[["📎","paper clip"],["🍇","grape"],["✏️","pencil"],["🪙","coin"],["🪶","feather"],["🖍️","crayon"],["🍓","strawberry"],["🔑","key"],["🧷","safety pin"],["🍬","candy"]];
  var HEAVY=[["🐕","dog"],["🚲","bicycle"],["🍉","watermelon"],["🧒","child"],["🎃","pumpkin"],["🪑","chair"],["📺","TV"],["🧳","suitcase"],["🐑","sheep"],["🛢️","barrel of oil"]];
  var EST=[["🐈","a cat",4,"kg"],["🍎","an apple",200,"g"],["📎","a paper clip",1,"g"],["📕","a big dictionary",1,"kg"],["🐕","a big dog",30,"kg"],["🚲","a bike",15,"kg"],
           ["✏️","a pencil",5,"g"],["🍉","a watermelon",5,"kg"],["🧴","a big water bottle",1,"L"],["🪣","a bucket of water",10,"L"],["🛁","a full bathtub",200,"L"],["🐠","a small fish tank",20,"L"]];

  // ---------- the questions ----------
  // pour: fill the beaker to t liters (the line to aim at is shown only after the answer: finding it is the point)   add: a liters of one colour, then b of another (stop at a+b)
  // sub: the beaker has s liters, pour out b                       scale: pour onto the scale until t g / kg     batch: n spells of p kg each
  function pour1(){ return Q("pour",{cap:6,lab:1,t:between(1,5),c:rnd(5)}); }
  function pour2(){ var t; do{ t=between(1,9); }while(t%2===0&&Math.random()<.75); return Q("pour",{cap:10,lab:2,t:t,c:rnd(5)}); }
  function add(){ var a=between(1,5), b=between(1,9-a); var c=rnd(5), d; do{ d=rnd(5); }while(d===c); return Q("add",{cap:10,lab:2,a:a,b:b,c:c,d:d}); }
  function sub(){ var s=between(5,10), b=between(1,s-1); return Q("sub",{cap:10,lab:2,s:s,b:b,c:rnd(5)}); }
  function scale(){ if(Math.random()<.5) return Q("scale",{u:"g",cap:1000,st:100,t:100*between(1,9),i:rnd(4)}); return Q("scale",{u:"kg",cap:10,st:1,t:between(1,9),i:rnd(4)}); }
  function batch(){ var p=between(2,5), n=between(2,Math.min(4,Math.floor(18/p))); return Q("batch",{u:"kg",cap:20,st:1,p:p,n:n,t:p*n,i:rnd(4)}); }
  function unit(){ return Q("unit",{h:Math.random()<.5?1:0,o:rnd(10)}); }
  function est(){ return Q("est",{i:rnd(EST.length)}); }
  var LEVELS=[
    {id:"p1",n:"First Drops",ic:"💧",gen:pour1},   // every line has its number
    {id:"p2",n:"Hidden Lines",ic:"🧪",gen:pour2},
    {id:"p3",n:"Two-Part Recipes",ic:"🌈",gen:add},
    {id:"p4",n:"Pour It Out",ic:"🫗",gen:sub},
    {id:"p5",n:"Weigh It",ic:"⚖️",gen:scale},
    {id:"p6",n:"Big Batches",ic:"🍯",gen:batch},
    {id:"p7",n:"Grams or Kilograms?",ic:"🪶",gen:unit},
    {id:"p8",n:"Good Guess",ic:"🤔",gen:est}
  ];
  var POURING={pour:1,add:1,sub:1,scale:1,batch:1};

  // ---------- drawing ----------
  function beakerSvg(cap,lab,layers,gold,marks){
    // layers: [[liters, colour]] from the bottom; gold: the line that was the goal (drawn only after an answer)
    var H=210, top=30, bot=top+H, s='<svg viewBox="0 0 230 260" style="width:100%;max-width:250px;display:block;margin:0 auto">', y=bot;
    layers.forEach(function(L){ if(L[0]<=0) return; var h=L[0]/cap*H, y2=Math.max(top-16,y-h);
      s+='<rect x="62" y="'+y2.toFixed(1)+'" width="96" height="'+(y-y2).toFixed(1)+'" fill="'+L[1]+'" opacity=".9"/>'; y=y2; });
    if(y<bot) s+='<ellipse cx="110" cy="'+y.toFixed(1)+'" rx="48" ry="4" fill="#fff" opacity=".45"/>';
    s+='<path d="M60 '+(top-18)+' L60 '+(bot-8)+' Q60 '+bot+' 68 '+bot+' L152 '+bot+' Q160 '+bot+' 160 '+(bot-8)+' L160 '+(top-18)+'" fill="none" stroke="#3a2c6b" stroke-width="5" stroke-linejoin="round"/>';
    for(var v=1;v<=cap;v++){ var yy=bot-v/cap*H, l=v%lab===0;
      s+='<line x1="'+(l?120:134)+'" y1="'+yy+'" x2="160" y2="'+yy+'" stroke="#3a2c6b" stroke-width="'+(l?3:2)+'"/>';
      if(l) s+='<text x="168" y="'+(yy+6)+'" font-family="Fredoka,sans-serif" font-weight="700" font-size="17" fill="#3a2c6b">'+v+'</text>'; }
    if(gold!=null){ var gy=bot-gold/cap*H; s+='<line x1="40" y1="'+gy+'" x2="160" y2="'+gy+'" stroke="#f5b301" stroke-width="3" stroke-dasharray="7 5"/><text x="36" y="'+(gy+5)+'" text-anchor="end" font-size="15">🎯</text>'; }
    (marks||[]).forEach(function(m){ var my=bot-m[0]/cap*H; s+='<text x="'+m[2]+'" y="'+(my+5)+'" text-anchor="end" font-weight="900" font-size="13" fill="'+m[3]+'">'+m[1]+'</text>'; });
    s+='<text x="168" y="'+(bot+20)+'" font-size="13" font-weight="800" fill="#6a5a9a">liters</text></svg>';
    return s;
  }
  function scaleSvg(q,v,showTarget){
    var W=300, x0=30, n=q.cap/q.st, lab=2, s=1, sand=SANDS[q.i];   // a number on every second mark
    var pile=Math.min(1,v/q.cap), h='<div style="text-align:center;height:74px;display:flex;align-items:flex-end;justify-content:center">'+
      '<div style="width:'+(40+120*pile)+'px;height:'+(8+56*pile)+'px;border-radius:50% 50% 8px 8px;background:'+sand[2]+';box-shadow:inset 0 -6px 0 rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;font-size:'+(14+20*pile)+'px">'+(v>0?sand[0]:"")+'</div></div>'+
      '<div style="height:10px;max-width:220px;margin:0 auto;background:#8a7ac4;border-radius:6px"></div>';
    var svg='<svg viewBox="0 0 360 100" style="width:100%;max-width:440px;display:block;margin:6px auto 0"><rect x="'+(x0-10)+'" y="16" width="'+(W+20)+'" height="54" rx="10" fill="#f4efff" stroke="#3a2c6b" stroke-width="3"/>';
    for(var i=0;i<=n;i++){ var x=x0+i*W/n, l=i%(lab*s)===0;
      svg+='<line x1="'+x+'" y1="18" x2="'+x+'" y2="'+(l?44:34)+'" stroke="#3a2c6b" stroke-width="'+(l?3:2)+'"/>';
      if(l) svg+='<text x="'+x+'" y="62" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="700" font-size="'+(q.cap>=1000?12:13)+'" fill="#3a2c6b">'+(i*q.st)+'</text>'; }
    if(showTarget){ var tx=x0+q.t/q.cap*W; svg+='<line x1="'+tx+'" y1="10" x2="'+tx+'" y2="76" stroke="#2f9e5b" stroke-width="3" stroke-dasharray="5 4"/>'; }
    var px=x0+Math.min(v,q.cap*1.04)/q.cap*W;
    svg+='<path d="M'+px+' 18 L'+(px-9)+' 3 L'+(px+9)+' 3 Z" fill="#e0554f"/><line x1="'+px+'" y1="16" x2="'+px+'" y2="50" stroke="#e0554f" stroke-width="3"/>';
    svg+='<text x="180" y="92" text-anchor="middle" font-size="13" font-weight="800" fill="#6a5a9a">'+(q.u==="kg"?"kilograms (kg)":"grams (g)")+'</text></svg>';
    return h+svg;
  }

  // ---------- sounds: glugs that rise with the level, a ding (and a buzz on a phone) at every line passed ----------
  var actx=null, lastGlug=0;
  function ac(){ if(!M.sound||!M.sound()) return null; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); }catch(e){ actx=null; } return actx; }
  function blip(f,len,type,vol){
    var a=ac(); if(!a) return;
    try{ var o=a.createOscillator(), g=a.createGain(), t=a.currentTime; o.type=type||"sine"; o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*1.35,t+len);
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol||.12,t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+len); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+len+.02); }catch(e){}
  }
  function glug(frac,dir){ var now=performance.now(); if(now-lastGlug<110) return; lastGlug=now; blip((dir>0?260:420)+520*Math.max(0,Math.min(1,frac))+Math.random()*40,.09,"sine",.09); }
  function ding(){ blip(1320,.12,"triangle",.1); try{ if(navigator.vibrate) navigator.vibrate(12); }catch(e){} }

  // ---------- Sparky says the order (the browser's English voice) ----------
  var voice=null;
  function pickVoice(){
    try{ var vs=speechSynthesis.getVoices().filter(function(v){ return /^en(-|_|$)/i.test(v.lang); });
      voice=vs.filter(function(v){ return /en-US/i.test(v.lang)&&/female|samantha|google us|aria|jenny/i.test(v.name); })[0]||vs.filter(function(v){ return /en-US/i.test(v.lang); })[0]||vs[0]||null; }catch(e){}
  }
  try{ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }catch(e){}
  function speak(text){
    if(!M.sound||!M.sound()) return;
    try{ speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(text); u.lang="en-US"; if(voice) u.voice=voice; u.rate=.92; u.pitch=1.25; speechSynthesis.speak(u); }catch(e){}
  }
  function order(q){
    var L=function(n){ return n+" "+(n===1?"liter":"liters"); };
    if(q.kind==="pour") return "Please make me "+L(q.t)+" of "+POTIONS[q.c][1]+" potion!";
    if(q.kind==="add") return "First "+L(q.a)+" of "+POTIONS[q.c][1]+", then "+L(q.b)+" of "+POTIONS[q.d][1]+", please!";
    if(q.kind==="sub") return "The beaker has "+L(q.s)+". Please pour out "+L(q.b)+"!";
    if(q.kind==="scale") return "Please put "+q.t+" "+(q.u==="g"?"grams":(q.t===1?"kilogram":"kilograms"))+" of "+SANDS[q.i][1]+" on the scale!";
    if(q.kind==="batch") return "One spell needs "+q.p+" kilograms of "+SANDS[q.i][1]+". Please make "+q.n+" spells!";
    if(q.kind==="unit") return "Grams or kilograms? How would you measure a "+(q.h?HEAVY[q.o][1]:LIGHT[q.o][1])+"?";
    return "About how "+(EST[q.i][3]==="L"?"much water does "+EST[q.i][1]+" hold":"heavy is "+EST[q.i][1])+"?";
  }

  // ---------- what a good potion does to Sparky, and the potion book ----------
  var EFFECTS=[["Flying","🪽","I can fly!","fly"],["Fire-Sneeze","🔥","Ah… ah… ACHOO! 🔥","sneeze"],["Bubble","🫧","Bubbles everywhere!","bubbles"],["Sparkle","✨","I'm all sparkly!","sparkle"],
               ["Tiny","🔍","Whoa, I'm tiny!","tiny"],["Color","🎨","I changed color!","color"],["Singing","🎵","La la laaa! 🎵","sing"],["Giant","🦖","I'm a BIG dragon!","giant"]];
  var NAMED=[["Lime",[150,215,80]],["Mint",[120,220,170]],["Teal",[60,170,170]],["Sky",[110,180,255]],["Lavender",[170,150,230]],["Violet",[160,100,230]],["Rose",[255,120,170]],
             ["Coral",[255,140,110]],["Peach",[255,180,120]],["Gold",[240,190,60]],["Leaf",[90,200,90]],["Ocean",[70,150,255]],["Grape",[180,110,255]],["Bubblegum",[255,130,175]],["Tangerine",[255,165,60]]];
  var BOOK="potionBook.v1", book={};
  try{ book=JSON.parse(localStorage.getItem(BOOK))||{}; }catch(e){ book={}; }
  function rgbOf(c){ if(c.charAt(0)==="#") return [parseInt(c.substr(1,2),16),parseInt(c.substr(3,2),16),parseInt(c.substr(5,2),16)]; var m=c.match(/\d+/g); return [+m[0],+m[1],+m[2]]; }
  function colorName(c){ var x=rgbOf(c), best=null, bd=1e9; NAMED.forEach(function(n){ var d=Math.pow(n[1][0]-x[0],2)+Math.pow(n[1][1]-x[1],2)+Math.pow(n[1][2]-x[2],2); if(d<bd){ bd=d; best=n[0]; } }); return best; }
  function potionOf(q){
    // the same recipe always makes the same potion, so the book can be filled
    var col=q.kind==="add"?mix(POTIONS[q.c][0],POTIONS[q.d][0]):q.kind==="scale"||q.kind==="batch"?SANDS[q.i][2]:POTIONS[q.c][0];
    var seed=q.kind==="add"?q.c*5+q.d:q.kind==="scale"||q.kind==="batch"?20+q.i:q.c;
    var e=EFFECTS[(seed*3+(q.kind==="sub"?5:0)+(q.kind==="batch"?2:0))%EFFECTS.length], name=colorName(col)+" "+e[0]+" Potion";
    var recipe=q.kind==="pour"?q.t+" L "+POTIONS[q.c][1]:q.kind==="add"?q.a+" L "+POTIONS[q.c][1]+" + "+q.b+" L "+POTIONS[q.d][1]:q.kind==="sub"?q.s+" L − "+q.b+" L "+POTIONS[q.c][1]:q.kind==="scale"?q.t+" "+q.u+" "+SANDS[q.i][1]:q.n+" × "+q.p+" kg "+SANDS[q.i][1];
    return {id:name,name:name,col:col,e:e,recipe:recipe};
  }
  function bookHtml(){
    var ids=Object.keys(book);
    if(!ids.length) return '<div style="color:var(--muted);font-weight:800">No potions yet. Make a perfect potion to add its card! 还没有药水，做出一瓶完美的药水就能收集它的卡片。</div>';
    return '<div style="font-weight:900;margin-bottom:8px">'+ids.length+' potions collected 已收集 '+ids.length+' 种药水</div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px">'+
      ids.map(function(id){ var b=book[id]; return '<div style="border:2px solid var(--line);border-radius:14px;padding:8px;text-align:center"><div style="width:44px;height:44px;margin:0 auto 4px;border-radius:50% 50% 40% 40%;background:'+b.col+';display:flex;align-items:center;justify-content:center;font-size:1.4rem;box-shadow:inset 0 -5px 0 rgba(0,0,0,.12)">'+b.e+'</div><b style="font-size:.85rem;display:block;line-height:1.2">'+b.name+'</b><small style="color:var(--muted);font-weight:800;font-size:.75rem">'+b.recipe+'</small></div>'; }).join("")+"</div>";
  }

  // ---------- the pouring ----------
  var P=null, raf=0;
  function tol(q){ return q.kind==="scale"&&q.u==="g"?25:0.25; }
  function goal(q){ return q.kind==="pour"?q.t:q.kind==="add"?(P&&P.phase===1?q.a:q.a+q.b):q.kind==="sub"?q.s-q.b:q.t; }
  function draw(){
    var q=P.q, box=document.getElementById("vessel"); if(!box) return;
    if(q.kind==="scale"||q.kind==="batch") box.innerHTML=scaleSvg(q,P.v,false);
    else{
      var layers=q.kind==="add"?[[Math.min(P.v,P.v1==null?P.v:P.v1),POTIONS[q.c][0]],[P.v1==null?0:P.v-P.v1,POTIONS[q.d][0]]]:[[P.v,POTIONS[q.c][0]]];
      box.innerHTML=beakerSvg(q.cap,q.lab,layers,null);
    }
    var st=document.getElementById("stream"); if(st) st.style.opacity=P.holding&&P.dir>0?1:0;
    var mb=document.getElementById("minusBtn"), pb=document.getElementById("plusBtn");
    if(mb&&!P.done) mb.disabled=!(P.v>lowest()+.001);
    if(pb&&!P.done) pb.disabled=!(P.v<highest()-.001);
  }
  // how far the child may go back: not below the first colour of a two-part recipe, not above the start when pouring out
  function lowest(){ return P.q.kind==="add"&&P.phase===2?P.v1:0; }
  function highest(){ return P.q.kind==="sub"?P.q.s:Infinity; }

  function stopPour(){ if(P) P.holding=false; cancelAnimationFrame(raf); var st=document.getElementById("stream"); if(st) st.style.opacity=0; }
  // dir +1: more in the beaker / on the scale (the + end of the button), -1: less (the − end)
  function startPour(dir){
    if(!P||P.done||P.holding) return;
    var q=P.q; dir=dir<0?-1:1;
    P.holding=true; P.held=0; P.dir=dir; var last=performance.now();
    var rate=q.kind==="scale"&&q.u==="g"?240:q.cap>=20?2.6:q.cap>=10?1.5:1.1;
    (function loop(t){
      if(!P||!P.holding) return;
      var dt=Math.min(.05,(t-last)/1000); last=t; P.held+=dt;
      // slow at first, so a quick tap adds only a drop
      var before=P.v;
      P.v=Math.min(highest(),Math.max(lowest(),P.v+dir*rate*dt*Math.min(1,.45+P.held/.8)));
      var mark=q.kind==="scale"&&q.u==="g"?100:1;
      if(Math.floor(before/mark+1e-9)!==Math.floor(P.v/mark+1e-9)) ding();
      if(P.v!==before) glug(P.v/q.cap,dir);
      draw();
      var cap=q.cap;
      if(dir>0&&P.v>cap*1.02){ P.v=cap*1.03; stopPour(); overflow(); return; }
      document.getElementById("serveBtn").disabled=false;
      raf=requestAnimationFrame(loop);
    })(last);
  }
  function overflow(){
    var b=document.getElementById("vessel"); P.done=true;
    b.insertAdjacentHTML("beforeend",'<div class="foam">🫧🫧🫧<br>🫧🫧🫧🫧</div>');
    P.ui.answer("overflow");
  }
  function serve(){
    if(!P||P.done) return; stopPour(); var q=P.q;
    if(q.kind==="add"&&P.phase===1){
      if(Math.abs(P.v-q.a)>tol(q)){ P.done=true; P.ui.answer("phase1:"+P.v.toFixed(2)); return; }
      P.phase=2; P.v1=P.v; P.v=P.v1;
      var mid=document.getElementById("midIc"); if(mid) mid.style.background=POTIONS[q.d][0];
      document.getElementById("serveBtn").textContent="✓ Serve";
      document.getElementById("stream").style.background=POTIONS[q.d][0];
      P.ui.hint("Now add the "+POTIONS[q.d][1]+" potion. Stop at the line for "+(q.a+q.b)+" liters!");
      P.ui.words("Good! Now "+q.a+" + "+q.b+": stop at "+(q.a+q.b)+" liters.");
      draw(); return;
    }
    P.done=true;
    P.ui.answer(Math.abs(P.v-goal(q))<=tol(q)?"ok":"v:"+P.v.toFixed(2));
  }
  // keyboard: Space or ↑ / + for more, ↓ / − for less
  function keyDir(e){ return (e.code==="Space"||e.key==="ArrowUp"||e.key==="+"||e.key==="=")?1:(e.key==="ArrowDown"||e.key==="-")?-1:0; }
  document.addEventListener("keydown",function(e){ var d=keyDir(e); if(d&&P&&!P.done&&document.getElementById("plusBtn")){ e.preventDefault(); if(!e.repeat) startPour(d); } });
  document.addEventListener("keyup",function(e){ if(keyDir(e)&&P) stopPour(); });

  function dragon(ui,happy,fx){
    var r=ui.round(), dots="", got=r.correct+(happy?1:0);   // (the right answer just given is not counted yet)
    for(var i=0;i<r.total;i++) dots+=i<got?"💚":"🤍";
    var say=happy?(fx?fx.e[2]:"Ahh, much better!"):(P&&P.q?order(P.q):"Hic! Hic!");
    return '<div class="dragon"><span class="dr'+(happy?" happy fx-"+(fx?fx.e[3]:""):"")+'" style="'+(happy&&fx&&fx.e[3]==="color"?"filter:drop-shadow(0 0 6px "+fx.col+") hue-rotate(140deg)":"")+'">'+(happy?"🐲":"🐉")+
      (happy&&fx?'<span class="fxe">'+fx.e[1]+'</span>':"")+'</span><span class="bubble">'+(happy?"":"Hic! ")+say+'</span>'+
      (happy?"":'<button type="button" class="say" id="sayBtn" aria-label="Say it again">🔊</button>')+'<div class="cure">Sparky feels better: '+dots+'</div></div>';
  }

  // ---------- one question on the screen ----------
  function render(q,ui){
    stopPour(); P=null;
    if(POURING[q.kind]){
      P={q:q,ui:ui,v:q.kind==="sub"?q.s:0,phase:q.kind==="add"?1:0,v1:null,done:false,holding:false};
      var col=q.kind==="scale"||q.kind==="batch"?SANDS[q.i][2]:POTIONS[q.c][0], what;
      if(q.kind==="pour") what="Pour exactly <b>"+q.t+" "+(q.t===1?"liter":"liters")+"</b> of "+POTIONS[q.c][1]+" potion into the beaker.";
      else if(q.kind==="add") what="Recipe: <b>"+q.a+" L</b> of "+POTIONS[q.c][1]+", then <b>"+q.b+" L</b> of "+POTIONS[q.d][1]+".";
      else if(q.kind==="sub") what="The beaker has <b>"+q.s+" liters</b>. Pour out exactly <b>"+q.b+" "+(q.b===1?"liter":"liters")+"</b>.";
      else if(q.kind==="scale") what="Put exactly <b>"+q.t+" "+(q.u==="g"?"grams":(q.t===1?"kilogram":"kilograms"))+"</b> of "+SANDS[q.i][1]+" on the scale.";

        '<span class="mid" id="midIc" style="background:'+col+'">'+(q.kind==="scale"||q.kind==="batch"?"🥄":"🧪")+'</span>'+
        '<button type="button" class="rk plus" id="plusBtn" aria-label="more">+<small>'+(q.kind==="scale"||q.kind==="batch"?"add":"pour in")+'</small></button></div>'+

  function right(q){
    if(POURING[q.kind]) return "ok";

    var e=EST[q.i]; return e[2]+e[3];

  function unitWord(q,n){ var u=q.kind==="scale"||q.kind==="batch"?q.u:"L"; return u==="kg"?(n===1?"kilogram":"kilograms"):u==="g"?"grams":(n===1?"liter":"liters"); }
  function amount(q,v){

    var step=q.kind==="scale"&&q.u==="g"?100:1, n=Math.round(v/step)*step;
    if(Math.abs(v-n)<=tol(q)) return "at about "+n+" "+unitWord(q,n);

  }
  function after(q,ok,given){

        var lab=document.querySelector(".lab"); if(lab) lab.insertAdjacentHTML("afterend",'<div class="newcard"><span style="background:'+pot.col+'">'+pot.e[1]+'</span><div><i>🆕 New card for your Potion Book!</i><b>'+pot.name+'</b><small>'+pot.recipe+'</small></div></div>'); }

      if(ok&&q.kind==="add") layers=[[P.v,mix(POTIONS[q.c][0],POTIONS[q.d][0])]];
      box.innerHTML=beakerSvg(q.cap,q.lab,layers,q.kind==="add"&&given.indexOf("phase1")===0?q.a:g);

  function explain(q){

  function teach(q,given){
    var steps=[], cn;

      if(q.kind==="pour") steps.push("The recipe needs <b>"+q.t+" "+unitWord(q,q.t)+"</b>.");

      if(q.kind==="batch") steps.push(q.n+" spells × "+q.p+" kg each: "+q.n+" × "+q.p+" = <b>"+q.t+" kg</b>. So stop when the pointer is at <b>"+q.t+"</b>.");

      }else{
        var labl=Math.floor(g/q.lab)*q.lab;

      }
      if(given==="overflow") steps.push("You kept pouring until it spilled over the top. Let go of the button sooner!");

      return {steps:steps,cn:cn};

    if(q.kind==="unit"){
      var ob=q.h?HEAVY[q.o]:LIGHT[q.o];
      return {steps:["<b>Grams (g)</b> are for light things. A paper clip is about 1 gram.","<b>Kilograms (kg)</b> are for heavy things. A big dictionary is about 1 kilogram. 1 kilogram = 1,000 grams.",
                     "A "+ob[1]+" is <b>"+(q.h?"heavy":"light")+"</b>, so use <b>"+(q.h?"kilograms":"grams")+"</b>."],
              cn:"克（g）量轻的东西，比如回形针约 1 克；千克（kg）量重的东西，比如一本大词典约 1 千克。1 千克 = 1000 克。"};
    }
    var e=EST[q.i];
    return {steps:["Use things you know: a paper clip ≈ 1 g, an apple ≈ 200 g, a big dictionary ≈ 1 kg, a third grader ≈ 30 kg.","For water: a big water bottle ≈ 1 L, a bucket ≈ 10 L, a bathtub ≈ 200 L.",
                   e[1].charAt(0).toUpperCase()+e[1].slice(1)+" is about <b>"+e[2]+" "+(e[3]==="kg"?"kilograms":e[3]==="g"?"grams":"liters")+"</b>."],
            cn:"估一估：用熟悉的东西作比较。回形针约 1 克，苹果约 200 克，大词典约 1 千克；大水瓶约 1 升，水桶约 10 升。"};
