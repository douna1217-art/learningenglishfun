<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bundle Farm</title>
<meta name="theme-color" content="#2f8a4a">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="description" content="Bundle Farm: bundle straws in tens, load carts with tens and ones, compare two-digit numbers, and untie a bundle to make a number another way. Grade 1 numbers to 99.">
<link href="/fonts/fonts.css" rel="stylesheet">
<style>
/* the field, the straws, the bundler, the cart */
.straw{position:absolute;width:var(--w,9px);height:var(--h,60px);margin:calc(var(--h,60px) / -2) 0 0 calc(var(--w,9px) / -2);border-radius:5px;background:linear-gradient(90deg,#e8b83a,#ffe27a 45%,#d9a52a);border:1.5px solid #a8791a;z-index:3;transition:left .45s ease,top .45s ease,transform .45s;cursor:pointer}
.straw.loose:hover{filter:brightness(1.1)}
.bundle{position:absolute;width:var(--bw,30px);height:var(--h,60px);margin:calc(var(--h,60px) / -2) 0 0 calc(var(--bw,30px) / -2);z-index:3;transition:left .6s ease,top .6s ease,transform .5s;cursor:pointer}
.bundle svg{width:100%;height:100%;overflow:visible}
.bundle.untie{animation:untie .5s}@keyframes untie{50%{transform:scale(1.25) rotate(-8deg)}}
.zone{position:absolute;border-radius:14px;z-index:1}
.cart{background:#c98a4b;border:4px solid #8a5a2b;box-shadow:inset 0 -8px 0 rgba(0,0,0,.12)}
.cart .wh{position:absolute;bottom:-22px;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle,#ddd 0 22%,#5a3a1a 24%);border:3px solid #3a2410}
.part{position:absolute;top:6px;bottom:6px;border-radius:10px;background:rgba(255,248,225,.55)}
.plab{position:absolute;top:-24px;left:50%;transform:translateX(-50%);background:#fff;border-radius:9px;padding:0 8px;font-weight:900;font-size:.8rem;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.plab b{font-family:Fredoka,sans-serif;font-size:1.1rem;color:#2f8a4a}
.bundler{background:rgba(255,255,255,.55);border:3px dashed transparent;border:3px solid #c98a4b}
.bundler .slots{position:absolute;inset:6px;display:flex;gap:2px}.bundler .slots i{flex:1;border-radius:4px;background:rgba(201,138,75,.18)}
.bundler .blab{position:absolute;top:-24px;left:50%;transform:translateX(-50%);background:#fff;border-radius:9px;padding:0 8px;font-weight:900;font-size:.8rem;white-space:nowrap}
.rope{position:absolute;height:10px;margin-top:-5px;background:#e0302a;border-radius:5px;z-index:5;transform-origin:50% 50%;animation:rope .5s ease-out}@keyframes rope{from{transform:scaleX(0)}}
.src{position:absolute;border-radius:16px;background:#fff8e1;border:3px solid #c98a4b;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;z-index:2;box-shadow:0 5px 0 #a8791a}
.src:active{transform:translateY(3px)}.src b{font-family:Fredoka,sans-serif;font-size:1.3rem}.src small{font-weight:900;font-size:.7rem;color:var(--muted)}
.num{position:absolute;transform:translateX(-50%);font-family:Fredoka,sans-serif;font-weight:700;font-size:2rem;background:#fff;border-radius:12px;padding:0 12px;z-index:4;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.croc{position:absolute;transform:translate(-50%,-50%);font-family:Fredoka,sans-serif;font-weight:700;font-size:3.6rem;color:#2f8a4a;z-index:5;animation:chomp .5s 2}@keyframes chomp{50%{transform:translate(-50%,-50%) scale(1.3)}}
.hand{position:absolute;font-size:2.1rem;z-index:9;pointer-events:none;animation:tap 1s ease-in-out infinite}@keyframes tap{50%{transform:translateY(10px)}}
.wrap.fitted .plab,.wrap.fitted .bundler .blab{font-size:1rem}
</style>
</head><body>
<script src="../pet-art.js?v=20261015b"></script><script src="../sightwords-prizes.js?v=20261104a"></script><script src="../game-prizes.js?v=20261128c"></script><script src="pet.js?v=20261128a"></script><script src="../game-progress.js?v=20261127a"></script><script src="fit.js?v=20261129b"></script><script src="levels.js?v=20261130a"></script><script src="g1kit.js?v=20261201a"></script>
<script>
(function(){
  "use strict";
  // Bundle Farm (Grade 1, Unit 4: numbers to 99). 6 carts a level, 5 right opens the next; any level opened can be played again.
  //   count   loose straws on the field: tap each one into the bundler; at 10 a red band ties them and the bundle rolls onto the cart's
  //           tens; when the field is empty the rest go to the ones. How many straws? (a tens-and-ones pad)
  //   make    "Load 47 straws!": tap the stack of bundles (10) and the pile of straws (1), then Done
  //   compare two carts: 42 ? 39 - pick >, < or =; the sign chomps towards the bigger number
  //   untie   the cart has 3 tens 4 ones: tap a bundle to untie it (10 straws spill into the ones): how many tens? how many ones now?
  //   level 1 count (to 40), level 2 make, level 3 compare, level 4 untie, level 5 all of them (to 99)
  var $=function(id){ return document.getElementById(id); };
  var Q=null, W=0, H=0, G={};
  var K=G1Kit({
    id:"bundle", store:"bundleFarm.v1", title:"🌾 Bundle Farm", name:"Bundle Farm", sub:"Tens &amp; Ones Practice 十位和个位",
    score:["Carts","车"], goal:6, need:5,
    colors:{bg:"#f6f9e8",line:"#dfe8b8",accent:"#2f8a4a",stage:"linear-gradient(180deg,#bfe6ff 0 14%,#b9e08a 14%,#a6d478)"},
    how:'<div>🌾 Tap loose straws: they go into the bundler. 10 straws = 1 bundle (one ten)!</div><div>🛒 Load carts with bundles (10) and straws (1).</div><div>🐊 Compare: pick &gt;, &lt; or =.</div><div>✂️ Untie a bundle: 1 ten becomes 10 ones.</div><div style="color:var(--muted)">点麦秆放进捆扎框，满 10 根捆成一捆（一个十）；用捆（10）和根（1）装车；比大小选 &gt; &lt; =；拆开一捆，一个十变成十个一。</div>',
    shop:[{id:"hen",e:"🐔",p:5,x:"88%",y:"58%"},{id:"sun",e:"🌻",p:8,x:"4%",y:"16%"},{id:"sheep",e:"🐑",p:12,x:"78%",y:"16%"},{id:"barn",e:"🏡",p:16,x:"90%",y:"14%"},{id:"tractor",e:"🚜",p:22,x:"62%",y:"15%"},{id:"cow",e:"🐄",p:28,x:"48%",y:"15%"},{id:"scare",e:"🌽",p:36,x:"34%",y:"16%"},{id:"rainbow",e:"🌈",p:45,x:"18%",y:"2%"}],
    shopName:"Farm shop 农场商店", welcome:"🌾 Welcome to Bundle Farm! 欢迎来麦秆农场！", hello:"10 straws make a bundle! 10 根捆成一捆！",
    round:round, resize:function(){ if(Q) draw(); }
  });
  // ---------- drawings ----------
  function bundleSvg(){ var s='<svg viewBox="0 0 30 60" preserveAspectRatio="none">'; for(var i=0;i<5;i++) s+='<rect x="'+(1+i*5.6)+'" y="1" width="5.2" height="58" rx="2.5" fill="'+(i%2?"#f5cf4a":"#e8b83a")+'" stroke="#a8791a" stroke-width="1"/>'; return s+'<rect x="0" y="26" width="30" height="8" rx="3" fill="#e0302a"/></svg>'; }
  // ---------- the layout ----------
  function geom(){
    var st=$("stage"); W=st.clientWidth; H=st.clientHeight;
    var sh=Math.max(46,Math.min(88,H*.17));
    G={sh:sh, sw:Math.max(7,sh*.14), bw:Math.max(20,sh*.42),
      cart:{x:W*.06,y:H*.2,w:W*.88,h:sh*1.45},
      pile:{x:W*.04,y:H*.6,w:W*.5,h:H*.34}, bund:{x:W*.6,y:H*.64,w:W*.36,h:sh*1.15}};
    G.tens={x:G.cart.x+10,y:G.cart.y+6,w:G.cart.w*.58-14,h:G.cart.h-12}; G.ones={x:G.cart.x+G.cart.w*.58+4,y:G.cart.y+6,w:G.cart.w*.42-14,h:G.cart.h-12};
  }
  function tenPos(i){ var step=Math.min(G.bw*1.12,G.tens.w/9.3); return [G.tens.x+step*(i+.6),G.tens.y+G.tens.h/2]; }
  function TO(t,mid,o){ return t+(t===1?' ten':' tens')+mid+o+(o===1?' one':' ones'); }
  // the loose straws fill rows that fit inside the ones part of the cart (a narrow phone cart gets more, shorter rows)
  function onePos(i){ var step=G.sw*1.6, per=Math.max(1,Math.floor((G.ones.w-G.sw)/step)), n=Math.max(Q?Q.o:0,i+1), rows=Math.max(1,Math.ceil(n/per)),
      rowH=(G.ones.h-12)/rows, row=Math.floor(i/per), col=i%per, hh=Math.min(G.sh,rowH*.86);
    return [G.ones.x+step*(col+.7),G.ones.y+6+rowH*(row+.5),hh]; }
  function bundPos(i){ var step=G.bund.w/10.6; return [G.bund.x+step*(i+.8),G.bund.y+G.bund.h/2]; }
  // ---------- drawing the state (the round's numbers: Q.t tens and Q.o ones on the cart, Q.pile loose straws, Q.inb in the bundler) ----------
  function draw(){
    geom(); var h="", sc=$("scene"), c=G.cart;
    if(Q.k==="compare"){ drawCompare(); return; }
    h+='<div class="zone cart" style="left:'+c.x+'px;top:'+c.y+'px;width:'+c.w+'px;height:'+c.h+'px"><i class="wh" style="left:12%"></i><i class="wh" style="right:12%"></i>'+
      '<div class="part" style="left:6px;width:'+(c.w*.58-14)+'px"><span class="plab">tens 十 · <b id="tN">'+(Q.hide?'?':Q.t)+'</b></span></div><div class="part" style="left:'+(c.w*.58+4-0)+'px;width:'+(c.w*.42-14)+'px"><span class="plab">ones 一 · <b id="oN">'+(Q.hide?'?':Q.o)+'</b></span></div></div>';
    for(var i=0;i<Q.t;i++){ var p=tenPos(i); h+='<div class="bundle" data-b="'+i+'" style="--h:'+G.sh+'px;--bw:'+G.bw+'px;left:'+p[0]+'px;top:'+p[1]+'px">'+bundleSvg()+'</div>'; }
    for(var j=0;j<Q.o;j++){ var q=onePos(j); h+='<div class="straw" style="--h:'+q[2]+'px;--w:'+G.sw+'px;left:'+q[0]+'px;top:'+q[1]+'px"></div>'; }
    if(Q.k==="count"){
      var b=G.bund; h+='<div class="zone bundler" style="left:'+b.x+'px;top:'+b.y+'px;width:'+b.w+'px;height:'+b.h+'px"><span class="blab">bundler 捆扎框 · '+Q.inb+' / 10</span><div class="slots">'+'<i></i>'.repeat(10)+'</div></div>';
      for(var k=0;k<Q.inb;k++){ var r=bundPos(k); h+='<div class="straw" style="--h:'+(G.bund.h-16)+'px;--w:'+G.sw+'px;left:'+r[0]+'px;top:'+r[1]+'px"></div>'; }
      Q.spots.forEach(function(s,n){ if(s.gone) return; h+='<div class="straw loose" data-s="'+n+'" style="--h:'+G.sh+'px;--w:'+G.sw+'px;left:'+(G.pile.x+s.x*G.pile.w)+'px;top:'+(G.pile.y+s.y*G.pile.h)+'px;transform:rotate('+s.r+'deg)"></div>'; });
    }
    if(Q.k==="make"){
      var sw=Math.min(130,W*.3), sy=H*.66;
      h+='<div class="src" id="src10" style="left:'+(W*.1)+'px;top:'+sy+'px;width:'+sw+'px;height:'+(G.sh*1.35)+'px"><div style="width:'+G.bw+'px;height:'+(G.sh*.75)+'px">'+bundleSvg()+'</div><b>10</b><small>a bundle 一捆</small></div>';
      h+='<div class="src" id="src1" style="left:'+(W*.9-sw)+'px;top:'+sy+'px;width:'+sw+'px;height:'+(G.sh*1.35)+'px"><div class="straw" style="position:static;margin:0;--h:'+(G.sh*.75)+'px;--w:'+G.sw+'px"></div><b>1</b><small>a straw 一根</small></div>';
    }
    sc.innerHTML=h;
  }
  function drawCompare(){
    var h="", half=W*.44, cy=H*.42, sh=Math.min(G.sh,H*.15);
    [Q.A,Q.B].forEach(function(v,side){ var x0=side?W*.53:W*.03, t=Math.floor(v/10), o=v%10, cw=half;
      h+='<div class="zone cart" style="left:'+x0+'px;top:'+(cy-sh*.75)+'px;width:'+cw+'px;height:'+(sh*1.5)+'px"><i class="wh" style="left:12%"></i><i class="wh" style="right:12%"></i></div>';
      var step=Math.min(sh*.5,cw*.58/Math.max(1,t)); for(var i=0;i<t;i++) h+='<div class="bundle" style="--h:'+sh+'px;--bw:'+(sh*.42)+'px;left:'+(x0+10+step*(i+.6))+'px;top:'+cy+'px">'+bundleSvg()+'</div>';
      for(var j=0;j<o;j++) h+='<div class="straw" style="--h:'+sh+'px;--w:'+Math.max(6,sh*.13)+'px;left:'+(x0+cw*.64+j*(cw*.34/9))+'px;top:'+cy+'px"></div>';
      h+='<div class="num" style="left:'+(x0+cw/2)+'px;top:'+(cy+sh*.95)+'px">'+v+'</div>'; });
    if(Q.sign) h+='<div class="croc" style="left:'+(W*.5)+'px;top:'+(cy+sh*1.3)+'px">'+Q.sign+'</div>';
    $("scene").innerHTML=h;
  }
  // ---------- a round ----------
  function round(){
    var L=K.L, easy=K.easy(), hard=K.hard(), kinds=L===1?["count"]:L===2?["make"]:L===3?["compare"]:L===4?["untie"]:["count","make","compare","untie"];
    if(L===5&&easy) kinds=["make","compare"];
    var k=kinds[K.rnd(kinds.length)], n;
    Q={k:k,tries:0,t:0,o:0,inb:0,pile:0,spots:[]};
    if(k==="count"){ n=easy?12+K.rnd(12):hard?30+K.rnd(16):15+K.rnd(25); Q.n=n; Q.pile=n;
      for(var i=0;i<n;i++) Q.spots.push({x:.05+Math.random()*.9,y:.12+Math.random()*.76,r:K.rnd(70)-35});
      if(K.D.tut&&K.D.n===1){ Q.n=13; Q.pile=13; Q.spots=Q.spots.slice(0,13); }
      K.task('Tap the loose straws to bundle them!<span class="cn">点地上的麦秆，把它们放进捆扎框！</span>');
      K.say(K.D.tut&&K.D.n===1?"Tap a straw! 点一根麦秆！":"10 in the bundler make a bundle! 捆扎框满 10 根就捆起来！"); }
    else if(k==="make"){ n=easy?11+K.rnd(30):L>=5?12+K.rnd(88):11+K.rnd(79); if(n%10===0) n++; Q.n=n;
      K.task('Load <b>'+n+'</b> straws onto the cart!<span class="cn">往车上装 '+n+' 根麦秆！</span>');
      K.btns('<button type="button" id="undo">↩ Undo 撤回</button><span></span><button type="button" class="main" id="ok">✓ Done 装好了</button>');
      $("undo").onclick=function(){ if(K.busy) return; if(Q.last==="o"&&Q.o) Q.o--; else if(Q.last==="t"&&Q.t) Q.t--; else if(Q.o) Q.o--; else if(Q.t) Q.t--; draw(); };
      $("ok").onclick=checkMake; K.say("Bundles for the tens, straws for the ones! 捆是十，根是一！"); }
    else if(k==="compare"){ var a,b; do{ a=easy?11+K.rnd(40):11+K.rnd(88); b=Math.random()<.35?Math.floor(a/10)*10+K.rnd(10):11+K.rnd(88); if(Math.random()<.12) b=a; }while(b<10||(easy&&Math.abs(a-b)<3&&a!==b));
      Q.A=a; Q.B=b; Q.ans=a>b?">":a<b?"<":"=";
      K.task('Which is greater? Pick the sign.<span class="cn">哪个大？选 &gt;、&lt; 或 =</span>');
      var bt=K.btns('<button type="button" class="big" data-v="&gt;">&gt;<br><small style="font-size:.7rem">greater 大于</small></button><button type="button" class="big" data-v="=">=<br><small style="font-size:.7rem">equal 等于</small></button><button type="button" class="big" data-v="&lt;">&lt;<br><small style="font-size:.7rem">less 小于</small></button>');
      [].forEach.call(bt.querySelectorAll("button"),function(x){ x.onclick=function(){ if(!K.busy) pickSign(x.getAttribute("data-v"),x); }; });
      K.say("Compare the tens first! 先比十位！"); }
    else { var t=easy?2+K.rnd(3):2+K.rnd(6), o=K.rnd(easy?5:10); Q.t=t; Q.o=o; Q.n=t*10+o; Q.cut=false;
      K.task('The cart has <b>'+Q.n+'</b>. Tap a bundle to untie it!<span class="cn">车上有 '+Q.n+' 根。点一捆，把它拆开！</span>');
      K.say("1 ten = 10 ones! 一个十等于十个一！"); }
    draw();
    if(K.D.tut&&K.D.n===1&&k==="count") K.later(tutHand,300);
  }
  // ---------- count: straws into the bundler ----------
  $("scene").addEventListener("click",function(e){
    if(K.busy||!Q) return;
    var s=e.target.closest?e.target.closest(".straw.loose"):null, b=e.target.closest?e.target.closest(".bundle"):null, src=e.target.closest?e.target.closest(".src"):null;
    if(s&&Q.k==="count") return toBundler(+s.getAttribute("data-s"),s);
    if(src&&Q.k==="make"){ if(src.id==="src10"){ if(Q.t>=9) return; Q.t++; Q.last="t"; K.tone([440,660],.06); } else { if(Q.o>=9){ K.say("10 straws? Use a bundle! 10 根？用一捆吧！"); return; } Q.o++; Q.last="o"; K.tone([700],.04); } draw(); return; }
    if(b&&Q.k==="untie"&&!Q.cut) return untie(+b.getAttribute("data-b"),b);
  });
  function toBundler(n,el){
    var hd=$("hand"); if(hd) hd.remove();
    if(Q.inb>=10) return;
    Q.spots[n].gone=true; Q.pile--; var p=bundPos(Q.inb); Q.inb++;
    el.classList.remove("loose"); el.style.transform="rotate(0)"; el.style.setProperty("--h",(G.bund.h-16)+"px"); el.style.left=p[0]+"px"; el.style.top=p[1]+"px"; K.tone([500+Q.inb*40],.05);
    var lab=document.querySelector(".blab"); if(lab) lab.textContent="bundler 捆扎框 · "+Q.inb+" / 10";
    if(Q.inb===10){ K.busy=true; K.later(tie,450); return; }
    if(Q.pile===0) { K.busy=true; K.later(restToOnes,500); }
  }
  function tie(){
    var b=G.bund; $("scene").insertAdjacentHTML("beforeend",'<div class="rope" style="left:'+(b.x+4)+'px;top:'+(b.y+b.h/2)+'px;width:'+(b.w-8)+'px"></div>'); K.tone([523,659,784],.07); K.say("10! Tie them up! 10 根！捆起来！");
    K.later(function(){ Q.inb=0; Q.t++; draw(); var el=document.querySelector('.bundle[data-b="'+(Q.t-1)+'"]'); if(el){ el.style.transform="scale(1.3)"; K.later(function(){ el.style.transform=""; },300); } K.tone([392,523],.08);
      if(Q.pile===0) K.later(askCount,500); else K.busy=false; },700);
  }
  function restToOnes(){ Q.o=Q.inb; Q.inb=0; draw(); K.tone([600,700],.06); K.later(askCount,500); }
  function askCount(){
    K.busy=false; K.task('How many straws? '+Q.t+(Q.t===1?' ten':' tens')+' and '+Q.o+(Q.o===1?' one':' ones')+'.<span class="cn">一共几根？'+Q.t+' 个十和 '+Q.o+' 个一。</span>'); K.say("Tens first, then ones! 先说十位，再说个位！");
    K.pad2(function(v){ if(v===Q.n) return good(TO(Q.t," ",Q.o)+" = "+Q.n); Q.tries++; K.tone([200,150],.12,"sawtooth"); K.padBad();
      if(Q.tries>=2){ K.busy=true; K.say("It's "+Q.n+"! 是 "+Q.n+"！"); K.task('<span class="eqbig">'+TO(Q.t,' + ',Q.o)+' = '+Q.n+'</span>'); K.later(function(){ K.done(false); },800); return; }
      K.say("The bundles are the tens, the straws are the ones. 捆数是十位，单根是个位。"); });
  }
  function checkMake(){
    if(K.busy) return; var v=Q.t*10+Q.o;
    if(v===Q.n) return good(Q.n+" = "+TO(Q.t," ",Q.o));
    Q.tries++; K.tone([200,150],.12,"sawtooth");
    if(Q.tries>=2){ K.busy=true; Q.t=Math.floor(Q.n/10); Q.o=Q.n%10; draw(); K.say("Like this: "+Q.t+" bundles and "+Q.o+" straws. 像这样："+Q.t+" 捆和 "+Q.o+" 根。"); K.task('<span class="eqbig">'+Q.n+' = '+TO(Q.t,' ',Q.o)+'</span>'); K.later(function(){ K.done(false); },1500); return; }
    K.say("That's "+v+". The tens digit says how many bundles! 这是 "+v+"。十位上的数就是几捆！");
  }
  function pickSign(v,btn){
    if(v===Q.ans){ Q.sign=v; drawCompare(); return good(Q.A+" "+v+" "+Q.B); }
    Q.tries++; K.bad(btn); K.tone([200,150],.12,"sawtooth");
    if(Q.tries>=2){ K.busy=true; Q.sign=Q.ans; drawCompare(); K.task('<span class="eqbig">'+Q.A+' '+Q.ans+' '+Q.B+'</span>'); K.later(function(){ K.done(false); },1500); return; }
    K.say(Math.floor(Q.A/10)!==Math.floor(Q.B/10)?"Count the bundles: more bundles is greater! 数捆数：捆多的大！":"Same bundles: compare the straws! 捆一样多，比单根！");
  }
  function untie(i,el){
    Q.cut=true; K.busy=true; el.classList.add("untie"); K.tone([784,659,523],.07);
    K.later(function(){ Q.t--; Q.o+=10; Q.hide=true; draw(); K.say("Now 10 more ones! 多了 10 个一！"); K.later(function(){ K.busy=false; askTens(); },500); },500);
  }
  function askTens(){
    K.task('How many <b>tens</b> now?<span class="cn">现在有几个十？</span>');
    K.nums(9,function(v,b){ if(v===Q.t) return askOnes(); Q.tries++; K.bad(b); K.tone([200,150],.12,"sawtooth"); if(Q.tries>=2){ K.say("Count the bundles: "+Q.t+". 数捆：有 "+Q.t+" 捆。"); return askOnes(true); } K.say("Count the bundles. 数一数有几捆。"); });
  }
  function askOnes(){
    K.task('How many <b>ones</b> now?<span class="cn">现在有几个一？</span>');
    K.nums(20,function(v,b){ if(v===Q.o) return good(Q.n+" = "+TO(Q.t," ",Q.o)); Q.tries++; K.bad(b); K.tone([200,150],.12,"sawtooth");
      if(Q.tries>=3){ K.busy=true; K.task('<span class="eqbig">'+Q.n+' = '+TO(Q.t,' ',Q.o)+'</span>'); K.later(function(){ K.done(false); },1500); return; } K.say("Count the loose straws. 数一数单根的麦秆。"); });
  }
  function good(eq){ K.hideAll(); K.task('<span class="eqbig">'+eq+'</span>'); K.say(["Great farming! 种田高手！","Yes! 对啦！","Super! 太棒了！"][K.rnd(3)]); K.done(true,Q.tries); }
  function tutHand(){ var s=document.querySelector(".straw.loose"); if(!s) return; $("scene").insertAdjacentHTML("beforeend",'<div class="hand" id="hand" style="left:'+(parseFloat(s.style.left)-8)+'px;top:'+(parseFloat(s.style.top)+10)+'px">👆</div>'); }
  window.__bundle={q:function(){ return Q; },K:K};
  K.start();
})();
</script>
