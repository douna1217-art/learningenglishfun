<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Number Park</title>
<meta name="theme-color" content="#d1477a">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="description" content="Number Park: round on the roller coaster, add and subtract tickets within 1,000, estimate and solve two-step problems. Grade 3 math in English.">
<link href="/fonts/fonts.css" rel="stylesheet">
</head><body>
<script src="../game-progress.js?v=20261127a"></script><script src="engine.js"></script>
<script>
(function(){
  "use strict";
  var M=MathGame, between=M.between, pickOne=M.pickOne, W=M.inWords;
  function Q(kind,a,b,c){ return {kind:kind,a:a,b:b||0,c:c||0,key:[kind,a,b||0,c||0].join("|")}; }
  function fromKey(k){ var s=k.split("|"); return Q(s[0],+s[1],+s[2],+s[3]); }
  function digits(n){ return [Math.floor(n/100),Math.floor(n/10)%10,n%10]; }

  // ---------- the questions ----------
  function r10(){ var n; do{ n=between(11,989); }while(n%10===0); return Q("r10",n); }
  function r100(){ var n; do{ n=between(101,989); }while(n%100===0); return Q("r100",n); }
  function add(){ var a=between(105,599), b=between(105,Math.min(399,990-a)); return Q("add",a,b); }
  function sub(){ var a=between(310,999), b=between(105,a-60); return Q("sub",a,b); }
  function est(){ var a=between(110,480), b=between(110,480); return Q("est",a,b); }
  var TWO=[
    function(){ var s=between(4,9)*100, x=between(3,20)*10, y=between(3,15)*10; return Q("two",s,x,y); }   // have s, spend x and y
  ];
  function two(){ return TWO[0](); }
  var LEVELS=[
    {id:"c1",n:"Round to Tens",ic:"🎢",gen:r10},
    {id:"c2",n:"Round to Hundreds",ic:"🎡",gen:r100},
    {id:"c3",n:"Add Tickets",ic:"➕",gen:add},
    {id:"c4",n:"Spend Tickets",ic:"➖",gen:sub},
    {id:"c5",n:"Estimate First",ic:"🤔",gen:est},
    {id:"c6",n:"Two-Step Problems",ic:"🧩",gen:two}
  ];

  // ---------- answers ----------
  function round(n,to){ return Math.floor((n+to/2)/to)*to; }
  function ans(q){
    if(q.kind==="r10") return round(q.a,10);
    if(q.kind==="r100") return round(q.a,100);
    if(q.kind==="add") return q.a+q.b;
    if(q.kind==="sub") return q.a-q.b;
    if(q.kind==="est") return round(q.a,100)+round(q.b,100);
    return q.a-q.b-q.c;
  }
  function noCarry(a,b){ var x=digits(a),y=digits(b); return ((x[0]+y[0])%10)*100+((x[1]+y[1])%10)*10+(x[2]+y[2])%10; }
  function flipSub(a,b){ var x=digits(a),y=digits(b); return Math.abs(x[0]-y[0])*100+Math.abs(x[1]-y[1])*10+Math.abs(x[2]-y[2]); }

  // ---------- pictures ----------
  // the coaster: a hill between two round numbers; the car sits at the number and rolls down to the nearer one
  function track(lo,step,pos){   // pos: 0..10 along the hill
    var pts=[], i, x, y;
    for(i=0;i<=40;i++){ x=30+i*7.5; y=140-90*Math.sin(Math.PI*i/40); pts.push(x.toFixed(1)+","+y.toFixed(1)); }
    var s='<svg viewBox="0 0 360 175" style="width:100%;display:block"><polyline points="'+pts.join(" ")+'" fill="none" stroke="#d1477a" stroke-width="6" stroke-linecap="round"/>';
    for(i=0;i<=10;i++){ x=30+i*30; y=140-90*Math.sin(Math.PI*i/10);
      s+='<line x1="'+x+'" y1="'+(y+4)+'" x2="'+x+'" y2="160" stroke="#c9a3b6" stroke-width="2"/>';
      if(i===0||i===10||i===5) s+='<text x="'+x+'" y="173" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="700" font-size="'+(i===5?12:16)+'" fill="'+(i===5?"#9a6a80":"#3a2030")+'">'+(lo+i*step)+(i===5?" (halfway)":"")+'</text>'; }
    s+='</svg>';
    var cx=(30+pos*30)/360*100, cy=(140-90*Math.sin(Math.PI*pos/10))/175*100;
    return '<div style="position:relative;max-width:460px;margin:8px auto 0">'+s+'<span id="car" style="position:absolute;left:'+cx+'%;top:'+cy+'%;transform:translate(-50%,-92%);font-size:2rem;transition:left 1s ease-in,top 1s ease-in">🚃</span></div>';
  }
  function moveCar(pos){ var c=document.getElementById("car"); if(!c) return; c.style.left=((30+pos*30)/360*100)+"%"; c.style.top=((140-90*Math.sin(Math.PI*pos/10))/175*100)+"%"; }
  function column(a,b,op,ans){
    var row=function(sign,n,cls){ return '<div style="display:flex;justify-content:flex-end;gap:10px'+(cls||"")+'"><span style="width:1.1em;text-align:left">'+sign+'</span><span style="letter-spacing:.35em">'+n+'</span></div>'; };
    return '<div style="display:inline-block;margin:10px auto 2px;font-family:\'Courier New\',monospace;font-weight:900;font-size:2rem;line-height:1.2">'+row("",a)+row(op,b)+
      '<div style="border-top:4px solid #3a2030;margin-top:4px;text-align:right;letter-spacing:.35em;min-height:1.2em">'+(ans==null?"?":ans)+'</div></div>';
  }

  // ---------- one question on the screen: everything is done with the hands ----------
  // Rounding: put the car on the hill (tens) and tap the station it will roll to, then watch it roll. Adding and subtracting: spin the
  // digit wheels of the ticket machine (carry marks can be tapped on). Estimating: send both cars to their stations. Two steps: pay
  // the ride and the snack from the wallet, breaking a 100 into tens when needed.
  // right(q) is "ok"; a wrong try comes back as "x:..." with what the child did. ans(q) is the number itself.
  function right(q){ return "ok"; }
  var tick=function(){ M.blip&&M.blip(440,.05); }, pop=function(){ M.blip&&M.blip(720,.1); };
  function goBtn(t,cn,dis){ return '<button type="button" class="go" id="goBtn"'+(dis?" disabled":"")+'>'+t+' <small>'+cn+'</small></button>'; }
  function lockGo(){ [].forEach.call(document.querySelectorAll("#field button"),function(b){ b.disabled=true; }); }
  function carAt(car,pos){ car.style.left=((30+pos*30)/360*100)+"%"; car.style.top=((140-90*Math.sin(Math.PI*pos/10))/175*100)+"%"; }
  // the hill with a station flag at each end
  function hill(lo,step,pos,id,labels){
    return '<div class="hill" id="'+id+'">'+track(lo,step,pos).replace('id="car"','class="car"')+
      '<button type="button" class="flag lo" data-v="'+lo+'">🚩 '+lo+'</button><button type="button" class="flag hi" data-v="'+(lo+step*10)+'">🚩 '+(lo+step*10)+'</button></div>';
  }
  function roll(box,pos,cb){ var car=box.querySelector(".car"), to=pos>=5?10:0; car.style.transition="left 1.1s ease-in,top 1.1s ease-in"; setTimeout(function(){ carAt(car,to); },30); if(cb) setTimeout(cb,1150); }

  function roundGame(q,ui){
    var tens=q.kind==="r10", step=tens?1:10, to=step*10, lo=Math.floor(q.a/to)*to, want=(q.a-lo)/step, pos=tens?0:want, placed=!tens, guess=null;
    ui.task(tens?"Round <b>"+q.a+"</b> to the nearest <b>ten</b>. Put the car at "+q.a+" on the hill, then tap the station it will roll to! <small>把 "+q.a+" 四舍五入到最近的整十：先把小车放到 "+q.a+"，再点它会滑到哪个站</small>"
                :"Round <b>"+q.a+"</b> to the nearest <b>hundred</b>. The car is at "+q.a+": tap the station it will roll to! <small>把 "+q.a+" 四舍五入到最近的整百：点小车会滑到哪个站</small>");
    var f=ui.stage(hill(lo,step,pos,"h1")+'<div class="tip" id="tip">'+(tens?"Drag the car along the track. 拖动小车":"Is "+q.a+" past the halfway mark? 过了一半吗？")+'</div>');
    var box=f.querySelector("#h1"), car=box.querySelector(".car"), on=false;
    if(tens){
      car.classList.add("drag"); car.style.transition="none";
      var setPos=function(e){ var r=box.querySelector("svg").getBoundingClientRect(), x=(e.clientX-r.left)*360/r.width, p=Math.max(0,Math.min(10,Math.round((x-30)/30)));
        if(p!==pos){ pos=p; carAt(car,pos); tick(); } placed=true; };
      box.addEventListener("pointerdown",function(e){ if(ui.locked()||e.target.classList.contains("flag")) return; on=true; try{ box.setPointerCapture(e.pointerId); }catch(x){} setPos(e); e.preventDefault(); });
      box.addEventListener("pointermove",function(e){ if(on) setPos(e); });
      box.addEventListener("pointerup",function(){ on=false; });
    }
    [].forEach.call(box.querySelectorAll(".flag"),function(fl){ fl.onclick=function(){
      if(ui.locked()) return;
      if(tens&&!placed){ f.querySelector("#tip").textContent="First put the car at "+q.a+". 先放小车"; return; }
      guess=+fl.dataset.v; fl.classList.add("pick"); [].forEach.call(box.querySelectorAll(".flag"),function(x){ x.disabled=true; });
      if(tens&&pos!==want){ ui.answer("x:place:"+(lo+pos)); return; }
      roll(box,pos,function(){ ui.answer(guess===round(q.a,to)?"ok":"x:"+guess); });
    }; });
  }
  function wheelRow(){ return '<div class="drow ans"><span class="op"></span>'+[0,1,2].map(function(i){ return '<span class="wh"><button type="button" class="up" data-i="'+i+'">▲</button><b class="wv" data-i="'+i+'">0</b><button type="button" class="dn" data-i="'+i+'">▼</button></span>'; }).join("")+'</div>'; }
  // spin(d, button): ▲ / ▼ on a wheel; true when it was one
  function spin(d,t){ if(t.classList.contains("up")){ d[+t.dataset.i]=(d[+t.dataset.i]+1)%10; return true; } if(t.classList.contains("dn")){ d[+t.dataset.i]=(d[+t.dataset.i]+9)%10; return true; } return false; }
  function showWheels(box,d){ [].forEach.call(box.querySelectorAll(".wv"),function(b){ b.textContent=d[+b.dataset.i]; }); }
  // the ticket machine: three digit wheels (and carry marks for adding)
  function wheels(q,ui){
    var addQ=q.kind==="add", d=[0,0,0], carry=[0,0];
    ui.task(addQ?"A ride costs <b>"+q.a+"</b> tickets and a snack costs <b>"+q.b+"</b>. How many tickets <b>in all</b>? Set the machine! <small>转动数字轮</small>"
                :"You have <b>"+q.a+"</b> tickets and spend <b>"+q.b+"</b>. How many are <b>left</b>? Set the machine! <small>转动数字轮</small>");
    var x=digits(q.a), y=digits(q.b);
    var f=ui.stage('<div class="mach"><div class="mT">🎟️ Ticket machine</div>'+(addQ?'<div class="crow"><span></span>'+[0,1].map(function(i){ return '<button type="button" class="cm" data-c="'+i+'">'+"&nbsp;"+'</button>'; }).join("")+'<span></span></div>':'')+
      '<div class="drow"><span class="op"></span>'+x.map(function(v){ return '<span class="dg">'+v+'</span>'; }).join("")+'</div>'+
      '<div class="drow"><span class="op">'+(addQ?"+":"−")+'</span>'+y.map(function(v){ return '<span class="dg">'+v+'</span>'; }).join("")+'</div>'+
      '<div class="bar"></div>'+wheelRow()+
      '<div class="mH">'+(addQ?"Start with the ones. Tap a little box to carry 1. 从个位算起，满十点小格进 1":"Start with the ones. Not enough? Borrow 1 from the next place. 从个位减起，不够就借 1")+'</div></div>'+goBtn("Print tickets 🎟️","出票"));
    function show(){ showWheels(f,d); [].forEach.call(f.querySelectorAll(".cm"),function(b){ var c=+b.dataset.c; b.innerHTML=carry[c]?"1":"&nbsp;"; b.classList.toggle("on",!!carry[c]); }); }
    f.querySelector(".mach").addEventListener("click",function(e){ if(ui.locked()) return; var t=e.target.closest?e.target.closest("button"):null; if(!t) return;
      if(spin(d,t)) tick();
      else if(t.classList.contains("cm")){ var c=+t.dataset.c; carry[c]=carry[c]?0:1; tick(); }
      show(); });
    f.querySelector("#goBtn").onclick=function(){ if(ui.locked()) return; var n=d[0]*100+d[1]*10+d[2]; ui.answer(n===ans(q)?"ok":"x:"+n); };
    show();
  }
  // estimate: send both cars to their hundreds, then the sum is made from the stations
  function estGame(q,ui){
    var picks={};
    ui.task("<b>About</b> how much is "+q.a+" + "+q.b+"? Round each number to the nearest <b>hundred</b>: tap the station each car rolls to! <small>先把两个数四舍五入到整百</small>");
    var la=Math.floor(q.a/100)*100, lb=Math.floor(q.b/100)*100;
    var f=ui.stage(hill(la,10,(q.a-la)/10,"ea")+hill(lb,10,(q.b-lb)/10,"eb")+'<div class="sum" id="sum">? + ? ≈ ?</div>');
    function upd(){ f.querySelector("#sum").textContent=(picks.ea!=null?picks.ea:"?")+" + "+(picks.eb!=null?picks.eb:"?")+" ≈ "+(picks.ea!=null&&picks.eb!=null?picks.ea+picks.eb:"?"); }
    ["ea","eb"].forEach(function(id){ var box=f.querySelector("#"+id), n=id==="ea"?q.a:q.b, lo=id==="ea"?la:lb;
      [].forEach.call(box.querySelectorAll(".flag"),function(fl){ fl.onclick=function(){ if(ui.locked()||picks[id]!=null) return;
        picks[id]=+fl.dataset.v; fl.classList.add("pick"); [].forEach.call(box.querySelectorAll(".flag"),function(x){ x.disabled=true; }); upd();
        roll(box,(n-lo)/10,function(){ if(picks.ea!=null&&picks.eb!=null&&!ui.locked()) ui.answer(picks.ea+picks.eb===ans(q)?"ok":"x:"+(picks.ea+picks.eb)); }); }; }); });
  }
  // two steps: pay from the wallet (hundreds and tens), break a 100 into ten 10s when needed
  function wallet(q,ui){
    var h=Math.floor(q.a/100), t=(q.a%100)/10, paid=[0,0], stage=0, NEED=[q.b,q.c];
    ui.task("You have <b>"+q.a+"</b> tickets. Pay <b>"+q.b+"</b> for the ride, then <b>"+q.c+"</b> for the snack. How many are left? <small>先付游乐项目，再付零食</small>");
    var f=ui.stage('<div class="wal" id="wal"></div><div class="pay"><div class="box" id="b0">🎢 Ride: <b id="p0">0</b> / '+q.b+'</div><div class="box" id="b1">🍿 Snack: <b id="p1">0</b> / '+q.c+'</div></div>'+
      '<div class="tip" id="tip">Tap a 10 to pay with it. Tap a 100 to break it into ten 10s. 点 10 付款，点 100 换成十张 10</div>'+
      '<div class="mach" id="left" hidden><div class="mT">How many tickets are left? 还剩几张？</div>'+wheelRow()+'</div>'+goBtn("That's what is left ✓","就剩这么多",true)), d=[0,0,0];
    function draw(){
      var s=""; for(var i=0;i<h;i++) s+='<button type="button" class="tk h" data-v="100">100</button>'; for(var j=0;j<t;j++) s+='<button type="button" class="tk t" data-v="10">10</button>';
      f.querySelector("#wal").innerHTML=s||'<span class="empty">empty</span>';
      f.querySelector("#p0").textContent=paid[0]; f.querySelector("#p1").textContent=paid[1];
      f.querySelector("#b0").className="box"+(stage===0?" on":"")+(paid[0]===q.b?" full":""); f.querySelector("#b1").className="box"+(stage===1?" on":"")+(paid[1]===q.c?" full":"");
      f.querySelector("#goBtn").disabled=stage<2;
      if(stage>=2){ f.querySelector("#left").hidden=false; f.querySelector("#tip").textContent="All paid! Now count what is left in the wallet. 付完了！数一数还剩多少"; }
    }
    f.querySelector("#left").addEventListener("click",function(e){ if(ui.locked()) return; var b=e.target.closest?e.target.closest("button"):null; if(b&&spin(d,b)){ tick(); showWheels(f,d); } });
    f.querySelector("#wal").addEventListener("click",function(e){ if(ui.locked()||stage>1) return; var b=e.target.closest?e.target.closest(".tk"):null; if(!b) return;
      if(b.dataset.v==="100"){ h--; t+=10; tick(); }
      else{ t--; paid[stage]+=10; pop(); if(paid[stage]===NEED[stage]) stage++; }
      draw(); });
    f.querySelector("#goBtn").onclick=function(){ if(ui.locked()) return; var n=d[0]*100+d[1]*10+d[2]; ui.answer(n===ans(q)?"ok":"x:"+n); };
    draw();
  }
  function render(q,ui){
    if(q.kind==="r10"||q.kind==="r100") return roundGame(q,ui);
    if(q.kind==="add"||q.kind==="sub") return wheels(q,ui);
    if(q.kind==="est") return estGame(q,ui);
    return wallet(q,ui);
  }
  function after(q,ok){
    lockGo();
    if(q.kind==="add"||q.kind==="sub"){ var m=document.querySelector("#field .mach"); if(m&&!ok) m.insertAdjacentHTML("afterend",'<div style="text-align:center">'+column(q.a,q.b,q.kind==="add"?"+":"−",ans(q))+'</div>'); }
  }
  function explain(q){
    var r=ans(q);
    if(q.kind==="r10"||q.kind==="r100") return q.a+" rounded to the nearest "+(q.kind==="r10"?"ten":"hundred")+" is "+r+".";
    if(q.kind==="add") return q.a+" + "+q.b+" = "+r+".";
    if(q.kind==="sub") return q.a+" − "+q.b+" = "+r+".";
    if(q.kind==="est") return Math.round(q.a/100)*100+" + "+Math.round(q.b/100)*100+" = "+r+", so about "+r+".";
    return q.a+" − "+q.b+" − "+q.c+" = "+r+".";
  }
  function teach(q,given){
    var r=ans(q), x=digits(q.a), y=digits(q.b), steps, cn, pic="", gs=String(given||""), gp=gs.indexOf("x:place:")===0?+gs.slice(8):null;
    given=gs.indexOf("x:")===0&&gp===null?gs.slice(2):"";
    if(q.kind==="r10"||q.kind==="r100"){
      var to=q.kind==="r10"?10:100, lo=Math.floor(q.a/to)*to, d=q.kind==="r10"?x[2]:x[1], place=q.kind==="r10"?"ones":"tens";
      steps=[q.a+" is between <b>"+lo+"</b> and <b>"+(lo+to)+"</b>. Halfway is "+(lo+to/2)+".",
             "Look at the <b>"+place+" digit</b>: "+d+".",
             d>=5?d+" is 5 or more, so the car goes over the hill and rolls to <b>"+(lo+to)+"</b>.":d+" is less than 5, so the car rolls back to <b>"+lo+"</b>.",
             q.a+" rounded to the nearest "+(to===10?"ten":"hundred")+" is <b>"+r+"</b>."];
      if(gp!==null) steps.unshift("You put the car at <b>"+gp+"</b>, but the number is <b>"+q.a+"</b>. Count the marks from "+lo+": "+lo+", "+(lo+1)+", "+(lo+2)+" … one mark for each 1.");
      if(q.kind==="r100"&&+given===round(q.a,10)) steps.push("Careful: "+given+" is the nearest <i>ten</i>. This question asks for the nearest <i>hundred</i>.");
      cn=q.kind==="r10"?"看个位：5 或以上，往上进到下一个整十；比 5 小，退回到这个整十。":"看十位：5 或以上，往上进到下一个整百；比 5 小，退回到这个整百。";
    }else if(q.kind==="add"){
      var c1=x[2]+y[2]>=10?1:0, c2=x[1]+y[1]+c1>=10?1:0;
      steps=["<b>Ones:</b> "+x[2]+" + "+y[2]+" = "+(x[2]+y[2])+(c1?". Write "+((x[2]+y[2])%10)+" and carry 1 ten.":"."),
             "<b>Tens:</b> "+x[1]+" + "+y[1]+(c1?" + 1":"")+" = "+(x[1]+y[1]+c1)+(c2?". Write "+((x[1]+y[1]+c1)%10)+" and carry 1 hundred.":"."),
             "<b>Hundreds:</b> "+x[0]+" + "+y[0]+(c2?" + 1":"")+" = "+(x[0]+y[0]+c2)+".",
             "So "+q.a+" + "+q.b+" = <b>"+r+"</b> tickets."];
      if(+given===noCarry(q.a,q.b)) steps.push("Your answer forgot to carry. When a column makes 10 or more, carry 1 to the next column.");
      pic='<div class="pic">'+column(q.a,q.b,"+",r)+'</div>';
      cn="竖式加法：从个位加起，满十向前一位进 1。";
    }else if(q.kind==="sub"){
      var o=x[2], t=x[1], h=x[0], s1=[], b1=o<y[2], b2;
      if(b1){ s1.push("<b>Ones:</b> "+o+" − "+y[2]+" is too small, so borrow 1 ten: "+(o+10)+" − "+y[2]+" = "+(o+10-y[2])+"."); t-=1; }
      else s1.push("<b>Ones:</b> "+o+" − "+y[2]+" = "+(o-y[2])+".");
      b2=t<y[1];
      if(b2){ s1.push("<b>Tens:</b> "+t+" − "+y[1]+" is too small, so borrow 1 hundred: "+(t+10)+" − "+y[1]+" = "+(t+10-y[1])+"."); h-=1; }
      else s1.push("<b>Tens:</b> "+t+" − "+y[1]+" = "+(t-y[1])+".");
      s1.push("<b>Hundreds:</b> "+h+" − "+y[0]+" = "+(h-y[0])+".");
      s1.push("So "+q.a+" − "+q.b+" = <b>"+r+"</b> tickets left.");
      if(+given===flipSub(q.a,q.b)) s1.push("Your answer took the small digit from the big one in each column. Borrow instead when the top digit is too small.");
      s1.push("Check: "+r+" + "+q.b+" = "+q.a+". ✓");
      steps=s1; pic='<div class="pic">'+column(q.a,q.b,"−",r)+'</div>';
      cn="竖式减法：从个位减起，不够减就向前一位借 1 当 10。最后用加法检查。";
    }else if(q.kind==="est"){
      var ra=round(q.a,100), rb=round(q.b,100);
      steps=[q.a+" rounds to <b>"+ra+"</b>.",q.b+" rounds to <b>"+rb+"</b>.",ra+" + "+rb+" = <b>"+r+"</b>. So the answer is <b>about "+r+"</b>.",
             "(The exact answer is "+(q.a+q.b)+", close to "+r+". Estimating is quick and helps you check.)"];
      cn="估算：先把每个数四舍五入到整百，再相加。";
    }else{
      steps=["<b>Step 1:</b> after the rides: "+q.a+" − "+q.b+" = "+(q.a-q.b)+".","<b>Step 2:</b> after the snacks: "+(q.a-q.b)+" − "+q.c+" = "+r+".",

      cn="两步题：先算第一步，再用第一步的结果算第二步。";
    }

  }
  function miss(q){
    if(q.kind==="r10"||q.kind==="r100") return q.a+" → "+ans(q);
    if(q.kind==="add") return q.a+" + "+q.b+" = "+ans(q);
    if(q.kind==="sub") return q.a+" − "+q.b+" = "+ans(q);
    if(q.kind==="est") return q.a+" + "+q.b+" ≈ "+ans(q);
    return q.a+" − "+q.b+" − "+q.c+" = "+ans(q);
  }

    return "The machine printed "+g+". Check each column!";
  }
