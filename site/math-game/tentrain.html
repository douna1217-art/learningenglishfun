<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ten Frame Train</title>
<meta name="theme-color" content="#d6453a">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="description" content="Ten Frame Train: each train car is a ten frame. Board passengers to make ten, let them off to take away, ride doubles, and fill the fact family house. Grade 1 adding and subtracting within 20.">
<link href="/fonts/fonts.css" rel="stylesheet">
<style>
:root{--ink:#2b2a3f;--muted:#6f6a86;--bg:#f4f1ff}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:Nunito,ui-rounded,"Trebuchet MS",Arial,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.wrap{max-width:560px;margin:0 auto;padding:10px 12px 20px;position:relative}
.top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.tbtn{background:#fff;border:1px solid #dcd6f5;border-radius:13px;padding:8px 12px;color:var(--ink);text-decoration:none;font:inherit;font-weight:900;cursor:pointer}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.hud div{background:#fff;border-radius:14px;text-align:center;padding:4px;box-shadow:0 3px 0 #dcd6f5}
.hud small{display:block;font-weight:800;color:var(--muted);font-size:.7rem}.hud b{font-family:Fredoka,sans-serif;font-size:1.35rem}
/* the station: sky, hills, the track, the platform */
.stage{position:relative;height:max(360px,calc(100vh - 440px));border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#bfe6ff 0 42%,#a6dc8c 42% 60%,#d9c9a8 60%);touch-action:none}
.hill{position:absolute;bottom:40%;width:45%;height:22%;border-radius:50% 50% 0 0;background:#8fd16f}
.track{position:absolute;left:0;right:0;height:8px;background:repeating-linear-gradient(90deg,#7a5230 0 6px,transparent 6px 22px),linear-gradient(180deg,#888 0 2px,transparent 2px 6px,#888 6px 8px);z-index:1}
.platform{position:absolute;left:0;right:0;bottom:0;height:24%;background:repeating-linear-gradient(90deg,#c9b48a 0 50px,#bda57a 50px 52px);border-top:6px solid #ffd84a}
.sign{position:absolute;right:3%;bottom:25%;background:#2f6fc8;color:#fff;border-radius:6px;padding:1px 8px;font-weight:900;font-size:.75rem;z-index:1}
.decor{position:absolute;font-size:1.5rem;line-height:1;pointer-events:none;z-index:1}
.helper{position:absolute;left:8px;top:6px;display:flex;align-items:flex-start;gap:5px;z-index:8;max-width:70%}
.pet{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;font-size:2rem}.pet.cheer{animation:bob .5s 2}@keyframes bob{50%{transform:translateY(-8px)}}
.bub{background:#fff;border-radius:12px;padding:4px 8px;font-weight:900;font-size:.74rem;line-height:1.2;box-shadow:0 3px 0 rgba(0,0,0,.08)}
/* the train: an engine and two cars; each car is a ten frame */
.train{position:absolute;left:0;top:0;z-index:2;transition:transform 1.6s cubic-bezier(.5,0,.8,.4)}
.train.in{transition:transform 1.4s cubic-bezier(.2,.6,.4,1)}
.car{position:absolute;border-radius:10px;background:#ff8a5c;border:4px solid #c2501f;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.car.c2{background:#5cb8ff;border-color:#2f6fc8}.car.full{animation:full .5s 2}@keyframes full{50%{box-shadow:0 0 0 8px #ffe36e}}
.seat{position:absolute;border-radius:8px;background:rgba(255,255,255,.75);border:2px solid rgba(0,0,0,.12)}
.wheel{position:absolute;border-radius:50%;background:radial-gradient(circle,#ddd 0 22%,#333 24% 100%);border:3px solid #222}
.train.go .wheel{animation:spin .4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.engine{position:absolute}.engine svg{width:100%;height:100%;overflow:visible}
.smoke{position:absolute;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.9);z-index:3;pointer-events:none;animation:smoke 1.2s ease-out forwards}@keyframes smoke{to{transform:translate(-30px,-60px) scale(2.4);opacity:0}}
.cnt{position:absolute;top:-24px;left:50%;transform:translateX(-50%);background:#fff;border-radius:9px;padding:0 7px;font-family:Fredoka,sans-serif;font-weight:700;font-size:.95rem;box-shadow:0 2px 0 rgba(0,0,0,.15);white-space:nowrap}
/* passengers */
.ps{position:absolute;display:flex;align-items:center;justify-content:center;line-height:1;z-index:4;cursor:pointer;transition:left .45s cubic-bezier(.3,1.3,.6,1),top .45s cubic-bezier(.3,1.3,.6,1),opacity .4s,transform .3s}
.ps.wait{animation:wait 1.3s ease-in-out infinite}@keyframes wait{50%{transform:translateY(-4px)}}
.ps.off{transition:left 1s ease-in,top .4s,opacity 1s}
.ps.glow{filter:drop-shadow(0 0 5px #ffd84a)}
.ps .n{position:absolute;top:-8px;right:-8px;background:#fff;border-radius:50%;width:20px;height:20px;font-family:Fredoka,sans-serif;font-size:.8rem;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 0 rgba(0,0,0,.2)}
/* the strategy board and the fact family house */
.board{position:absolute;left:50%;top:6%;transform:translateX(-50%);background:#2b4a3a;color:#fff;border:5px solid #8a5a2b;border-radius:10px;padding:4px 14px;font-family:Fredoka,sans-serif;font-size:1.25rem;z-index:7;text-align:center;line-height:1.35;display:none}
.board .s{color:#ffe36e}
.house{position:absolute;left:50%;top:16%;transform:translateX(-50%);width:min(92%,440px);z-index:3}
.roof{position:relative;height:64px;margin:0 -4%;background:#d6453a;clip-path:polygon(50% 0,100% 100%,0 100%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
.roofN{font-family:Fredoka,sans-serif;font-weight:700;font-size:1.35rem;color:#fff;white-space:nowrap}
.walls{background:#fff3d6;border:4px solid #c98a4b;border-top:0;border-radius:0 0 12px 12px;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.door{background:#fff;border:3px solid #e8d0a8;border-radius:10px;padding:6px 2px;text-align:center;font-family:Fredoka,sans-serif;font-weight:700;font-size:1.3rem;cursor:pointer}
.door.on{border-color:#ffb000;box-shadow:0 0 0 3px #ffe36e}.door.ok{background:#d6f5e6;border-color:#2f9e5b}.door .bl{display:inline-block;min-width:1.4em;border-bottom:3px solid #c98a4b;color:#c2306a}
.door.bad{animation:shake .4s}
.house.lit .walls{background:#fff8b0}
/* the bottom */
.task{background:#fff;border-radius:18px;padding:9px 12px;margin-top:8px;text-align:center;font-weight:900;font-size:1.1rem;box-shadow:0 3px 0 #dcd6f5}
.task .cn{display:block;font-size:.8rem;color:var(--muted);font-weight:800;margin-top:2px}.task b{font-family:Fredoka,sans-serif;font-size:1.3em;color:#d6453a}
.nums{display:none;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.nums button{border:0;border-radius:12px;background:#fff;font-family:Fredoka,sans-serif;font-weight:700;font-size:1.4rem;padding:7px 0;box-shadow:0 4px 0 #dcd6f5;cursor:pointer;color:var(--ink)}
.nums button.bad,.tiles button.bad{background:#ffd6d0;animation:shake .4s}
.tiles{display:none;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.tiles button{border:0;border-radius:16px;background:#fff;font-family:Fredoka,sans-serif;font-weight:700;font-size:1.8rem;padding:10px 0;box-shadow:0 5px 0 #dcd6f5;cursor:pointer;color:var(--ink)}
.go2{display:none;width:100%;margin-top:8px;border:0;border-radius:16px;background:#f5b301;color:#3b2a00;font:inherit;font-weight:900;font-size:1.15rem;padding:11px;box-shadow:0 5px 0 #b88a00;cursor:pointer}
.eqbig{font-family:Fredoka,sans-serif;font-size:1.8rem;color:#2f9e5b}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hand{position:absolute;font-size:2.1rem;z-index:9;pointer-events:none;animation:tap 1s ease-in-out infinite}@keyframes tap{50%{transform:translateY(10px)}}
.float{position:absolute;font-family:Fredoka,sans-serif;font-weight:700;font-size:1.5rem;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);pointer-events:none;animation:up 1.1s forwards;z-index:9}@keyframes up{to{transform:translateY(-50px);opacity:0}}
.over{position:absolute;inset:0;background:rgba(40,30,80,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:16px;z-index:10}
.over h2{font-family:Fredoka,sans-serif;margin:0 0 6px;font-size:1.9rem}.over p{margin:4px 0;font-weight:800}
.go{border:0;border-radius:999px;padding:13px 28px;font:inherit;font-weight:900;font-size:1.15rem;background:#f5b301;color:#3b2a00;box-shadow:0 5px 0 #b88a00;cursor:pointer;margin-top:12px}
.how{background:#fff;color:var(--ink);border-radius:16px;padding:10px 12px;font-weight:800;font-size:.92rem;text-align:left;margin-top:8px;max-width:400px}.how div{margin:4px 0}
.shop{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;max-width:380px;margin-top:10px}
.shop button{border:0;border-radius:14px;background:#fff;padding:6px 2px;font:inherit;font-weight:900;font-size:.75rem;color:var(--ink);cursor:pointer}.shop button i{display:block;font-style:normal;font-size:1.8rem}
.shop button.own{background:#d6f5e6}.shop button:disabled{opacity:.45;cursor:default}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:20}
.wrap.fitted{max-width:none;display:flex;flex-direction:column;overflow:hidden}
.wrap.fitted .stage{flex:1;height:auto;min-height:320px}
.wrap.fitted .pet{width:60px;height:60px}.wrap.fitted .bub{font-size:.92rem}.wrap.fitted .board{font-size:1.6rem}.wrap.fitted .door{font-size:1.7rem}
@media(min-width:900px){.wrap.fitted .top,.wrap.fitted .hud,.wrap.fitted .bottom{width:100%;max-width:820px;margin-left:auto;margin-right:auto}.wrap.fitted .nums{grid-template-columns:repeat(11,1fr)}}
</style>
</head><body>
<script src="../pet-art.js?v=20261015b"></script><script src="../sightwords-prizes.js?v=20261104a"></script><script src="../game-prizes.js?v=20261128c"></script><script src="pet.js?v=20261128a"></script><script src="../game-progress.js?v=20261127a"></script><script src="fit.js?v=20261129b"></script><script src="levels.js?v=20261130a"></script>
<div class="wrap" id="wrap">
  <div class="top"><a class="tbtn" href="../index.html" id="home">← Home</a><b style="font-family:Fredoka,sans-serif;font-size:1.25rem">🚂 Ten Frame Train</b><span><button class="tbtn" type="button" id="helpBtn" aria-label="How to play">?</button> <button class="tbtn" type="button" id="soundBtn">🔔</button></span></div>
  <div class="hud"><div><small>Trains 火车</small><b id="score">0/6</b></div><div><small>Level 关</small><b id="day">1</b></div><div><small>Coins 金币</small><b id="coins">0</b></div></div>
  <div class="stage" id="stage">
    <div class="hill" style="left:-8%"></div><div class="hill" style="left:52%;width:55%"></div><div id="decor"></div>
    <div class="track" id="track"></div><div class="platform"></div><div class="sign">🚉 Ten Town</div>
    <div class="train" id="train"></div><div id="people"></div><div id="house"></div>
    <div class="board" id="board"></div>
    <div class="helper"><div class="pet" id="pet"></div><div class="bub" id="bub">All aboard! 上车啦！</div></div>
  </div>
  <div class="bottom">
    <div class="task" id="task"></div>
    <div class="nums" id="nums"></div>
    <div class="tiles" id="tiles"></div>
    <button type="button" class="go2" id="go2">✓ Done! 好了</button>
  </div>
</div>
<canvas id="fx"></canvas>
<script>
(function(){
  "use strict";
  // Ten Frame Train (Grade 1, Unit 3: adding and subtracting within 20). Each train car is a ten frame (2 rows of 5 seats).
  //   add     8 + 5: 8 sit in the first car; tap the 5 on the platform: they fill the first car to 10, then the second car (make a ten);
  //           then 8 + 5 = ?; afterwards the board shows the ten: 8 + 2 = 10, 10 + 3 = 13; the train toots and leaves
  //   sub     13 − 5: tap 5 passengers to get off (the second car first makes a ten: 13 − 3 = 10, 10 − 2 = 8)
  //   double  7 + 7 / 7 + 8: each tap sends the next passenger to the car with fewer: doubles and doubles plus one
  //   missing 9 + ? = 15: board passengers until there are 15, then: how many got on?
  //   family  the fact family house: 8, 5 and 13 on the roof; fill the four doors (8 + 5 = 13, 5 + 8 = 13, 13 − 5 = 8, 13 − 8 = 5)
  //   level 1 add (making ten), level 2 take away (from the teens), level 3 doubles and near doubles, level 4 missing numbers and fact
  //   families, level 5 all of them. 6 trains a level, 5 right opens the next; any level opened can be played again.
  var $=function(id){ return document.getElementById(id); };
  var STORE="tenTrain.v1", S={day:1,coins:0,deco:{},tut:0,sound:true};
  try{ var s0=JSON.parse(localStorage.getItem(STORE)); if(s0) for(var k in s0) S[k]=s0[k]; }catch(e){}
  function save(){ try{ localStorage.setItem(STORE,JSON.stringify(S)); }catch(e){} }
  var L=S.day, D=null, Q=null, busy=false, GOAL=6, timers=[];
  function rnd(n){ return Math.floor(Math.random()*n); }
  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=rnd(i+1), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function later(f,ms){ var t=setTimeout(f,ms); timers.push(t); return t; }
  var actx=null;
  function tone(fs,len,type){ if(!S.sound) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); fs.forEach(function(f,i){ var t=actx.currentTime+i*len*.7, o=actx.createOscillator(), g=actx.createGain(); o.type=type||"triangle"; o.frequency.value=f; g.gain.setValueAtTime(.13,t); g.gain.exponentialRampToValueAtTime(.001,t+len); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+len+.02); }); }catch(e){} }
  function toot(){ tone([392,494],.25,"square"); }
  $("soundBtn").onclick=function(){ S.sound=!S.sound; $("soundBtn").textContent=S.sound?"🔔":"🔕"; save(); };
  $("soundBtn").textContent=S.sound?"🔔":"🔕";
  try{ if(window.self!==window.top) $("home").style.visibility="hidden"; }catch(e){}
  var pet=window.MathPet?MathPet.get():null;
  $("pet").innerHTML=pet?MathPet.pic(pet,"happy",60):"🐣";
  function say(t){ $("bub").innerHTML=t; var p=$("pet"); p.classList.remove("cheer"); void p.offsetWidth; p.classList.add("cheer"); }
  var DECO=[{id:"flower",e:"🌼",p:5,x:"6%",y:"36%"},{id:"tree",e:"🌳",p:8,x:"88%",y:"30%"},{id:"bench",e:"🪑",p:12,x:"70%",y:"82%"},{id:"clock",e:"🕰️",p:16,x:"52%",y:"79%"},{id:"balloon",e:"🎈",p:22,x:"30%",y:"80%"},{id:"house",e:"🏠",p:28,x:"76%",y:"28%"},{id:"rainbow",e:"🌈",p:36,x:"40%",y:"8%"},{id:"castle",e:"🏰",p:45,x:"20%",y:"26%"}];
  function drawDeco(){ $("decor").innerHTML=DECO.filter(function(d){ return S.deco[d.id]; }).map(function(d){ return '<span class="decor" style="left:'+d.x+';top:'+d.y+'">'+d.e+'</span>'; }).join(""); }
  var FACES=["🐻","🐰","🐼","🐱","🐶","🐵","🐯","🐨","🐷","🐸","🦊","🐮"];
  // ---------- the train's measurements ----------
  var G={};
  function geom(){
    var st=$("stage"), w=st.clientWidth, h=st.clientHeight, ew=Math.min(110,w*(w<560?.13:.2)), cw=Math.min(300,(w-ew*1.12-(w<560?24:30))/2), seat=cw/5.7, ch=seat*2.7, ty=h*.56-ch-seat*.5;
    G={w:w,h:h,ew:ew,cw:cw,seat:seat,ch:ch,ty:ty,x0:Math.max(3,(w-ew-cw*2-14)/2),ps:Math.min(52,Math.max(seat*1.3,w/12))};
    $("track").style.top=(ty+ch+seat*.55)+"px";
    return G;
  }
  // seat i (0..19): car 0 then car 1, rows of 5 (a ten frame)
  function seatXY(i){ var c=Math.floor(i/10), j=i%10, cx=G.x0+c*(G.cw+7), x=cx+G.seat*.42+(j%5)*G.seat*1.03+G.seat*.43, y=G.ty+G.seat*.38+Math.floor(j/5)*G.seat*1.05+G.seat*.43; return [x,y]; }
  function platXY(i,n){ var cols=Math.min(n>5?Math.ceil(n/2):5,Math.max(5,Math.floor(G.w*.86/(G.ps*1.05)))), w=G.w*.86, x=G.w*.07+w*((i%cols)+.5)/cols, y=G.h*.87-Math.floor(i/cols)*G.ps*1.02; return [x,y]; }
  function drawTrain(){
    var h="";
    for(var c=0;c<2;c++){ var x=G.x0+c*(G.cw+7);
      h+='<div class="car'+(c?" c2":"")+'" id="car'+c+'" style="left:'+x+'px;top:'+G.ty+'px;width:'+G.cw+'px;height:'+G.ch+'px"><span class="cnt" id="cnt'+c+'"></span></div>';
      for(var i=0;i<10;i++){ var p=seatXY(c*10+i); h+='<div class="seat" style="left:'+(p[0]-G.seat*.45)+'px;top:'+(p[1]-G.seat*.45)+'px;width:'+(G.seat*.9)+'px;height:'+(G.seat*.9)+'px"></div>'; }
      for(var wv=0;wv<2;wv++) h+='<div class="wheel" style="left:'+(x+G.cw*(wv?.72:.12))+'px;top:'+(G.ty+G.ch-G.seat*.2)+'px;width:'+(G.seat*.85)+'px;height:'+(G.seat*.85)+'px"></div>';
    }
    var ex=G.x0+2*(G.cw+7), eh=G.ch*1.25;
    h+='<div class="engine" id="engine" style="left:'+ex+'px;top:'+(G.ty+G.ch-eh)+'px;width:'+G.ew+'px;height:'+eh+'px"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><rect x="4" y="38" width="72" height="50" rx="8" fill="#d6453a" stroke="#8a1f1a" stroke-width="4"/><rect x="8" y="10" width="34" height="34" rx="5" fill="#2f6fc8" stroke="#1f3f7a" stroke-width="4"/><rect x="14" y="16" width="22" height="16" rx="3" fill="#cfefff"/><rect x="56" y="18" width="12" height="22" fill="#444"/><path d="M76 54L98 70L98 88L76 88Z" fill="#ffd84a" stroke="#c99a1c" stroke-width="3"/><circle cx="66" cy="50" r="5" fill="#ffe36e"/></svg></div>';
    h+='<div class="wheel" style="left:'+(ex+G.ew*.1)+'px;top:'+(G.ty+G.ch-G.seat*.35)+'px;width:'+(G.seat)+'px;height:'+(G.seat)+'px"></div><div class="wheel" style="left:'+(ex+G.ew*.55)+'px;top:'+(G.ty+G.ch-G.seat*.35)+'px;width:'+(G.seat)+'px;height:'+(G.seat)+'px"></div>';
    $("train").innerHTML=h;
  }
  // ---------- passengers ----------
  var P=[];   // {el, seat (-1 on the platform), plat}
  function person(face){ var el=document.createElement("div"); el.className="ps"; el.textContent=face; el.style.width=el.style.height=G.seat*.9+"px"; el.style.fontSize=(G.seat*.75)+"px"; el.style.marginLeft=el.style.marginTop=(-G.seat*.45)+"px"; $("people").appendChild(el); return el; }
  // the passengers on the platform wait out of sight until the train has stopped (revealPeople), then walk up
  function addPerson(where,i,n){ var p={el:person(FACES[rnd(FACES.length)]),seat:-1,plat:-1}; P.push(p); if(where==="seat") sitAt(p,i); else standAt(p,i,n); p.el.dataset.i=P.length-1;
    // the ones already on the train ride in with it; the ones on the platform come along after it has stopped
    if(where==="seat"){ $("train").appendChild(p.el); later(function(){ $("people").appendChild(p.el); },1450); }   // inside the train while it rolls in
    else { p.tx=p.el.style.left; p.el.style.left=(G.w+50)+"px"; p.hidden=true; } return p; }
  function revealPeople(done){
    var plat=P.filter(function(p){ return p.seat<0; }), t=0;
    showCounts();
    plat.forEach(function(p,i){ later(function(){ p.hidden=false; p.el.style.left=p.tx; },t+i*110); });
    t+=plat.length*110+500;
    later(function(){ busy=false; if(done) done(); },t);
  }
  function size(p,sz){ p.el.style.width=p.el.style.height=sz*.9+"px"; p.el.style.fontSize=(sz*.75)+"px"; p.el.style.marginLeft=p.el.style.marginTop=(-sz*.45)+"px"; }
  function sitAt(p,i){ p.seat=i; p.plat=-1; var xy=seatXY(i); p.el.className="ps"; size(p,G.seat); p.el.style.left=xy[0]+"px"; p.el.style.top=xy[1]+"px"; }
  function standAt(p,i,n){ p.seat=-1; p.plat=i; p.n=n; var xy=platXY(i,n); p.el.className="ps wait"; size(p,G.ps); p.el.style.left=xy[0]+"px"; p.el.style.top=xy[1]+"px"; }
  function onBoard(){ return P.filter(function(p){ return p.seat>=0; }); }
  function freeSeat(car){ for(var i=(car||0)*10;i<20;i++) if(!P.some(function(p){ return p.seat===i; })) return i; return -1; }
  function counts(){ var a=0,b=0; P.forEach(function(p){ if(p.seat>=0){ if(p.seat<10) a++; else b++; } }); return [a,b]; }
  function showCounts(){ var c=counts(); $("cnt0").textContent=c[0]?c[0]:""; $("cnt1").textContent=c[1]?c[1]:""; $("cnt0").style.display=c[0]?"":"none"; $("cnt1").style.display=c[1]?"":"none"; }
  $("people").addEventListener("click",function(e){ var el=e.target.closest?e.target.closest(".ps"):null; if(!el||busy||!Q||Q.phase!=="act") return; tapPerson(P[+el.dataset.i]); });
  function tapPerson(p){
