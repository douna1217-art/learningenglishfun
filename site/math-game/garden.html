<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Veggie Garden</title>
<meta name="theme-color" content="#5aa83f">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="description" content="Veggie Garden: plant rows and columns of vegetables for the animals, count them with repeated addition, and pair them up to find odd and even numbers. Grade 2 equal groups.">
<link href="/fonts/fonts.css" rel="stylesheet">
<style>
:root{--ink:#2d3a1f;--muted:#6b7a5a;--bg:#f2f8e8;--soil:#9a6a3f;--soil2:#7d5330}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:Nunito,ui-rounded,"Trebuchet MS",Arial,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.wrap{max-width:560px;margin:0 auto;padding:10px 12px 20px;position:relative}
.top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.tbtn{background:#fff;border:1px solid #dbe8c8;border-radius:13px;padding:8px 12px;color:var(--ink);text-decoration:none;font:inherit;font-weight:900;cursor:pointer}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.hud div{background:#fff;border-radius:14px;text-align:center;padding:4px;box-shadow:0 3px 0 #dbe8c8}
.hud small{display:block;font-weight:800;color:var(--muted);font-size:.7rem}.hud b{font-family:Fredoka,sans-serif;font-size:1.35rem}
.stage{position:relative;height:max(360px,calc(100vh - 430px));border-radius:22px;overflow:hidden;display:flex;flex-direction:column;background:#8fd16f;touch-action:none}
.sky{position:relative;height:100px;flex:none;background:linear-gradient(180deg,#a8dcff,#dff2ff);display:flex;align-items:flex-end;justify-content:space-between;padding:0 10px 4px}
.sun{position:absolute;left:46%;top:8px;width:34px;height:34px;border-radius:50%;background:#ffd84a;box-shadow:0 0 0 8px rgba(255,216,74,.3);animation:sun 4s ease-in-out infinite}@keyframes sun{50%{box-shadow:0 0 0 13px rgba(255,216,74,.2)}}
.helper{display:flex;align-items:flex-end;gap:6px;max-width:52%;z-index:2}
.pet{width:50px;height:50px;flex:none;display:flex;align-items:center;justify-content:center;font-size:2.2rem}.pet.cheer{animation:bob .5s 2}@keyframes bob{50%{transform:translateY(-10px)}}
.bub{background:#fff;border-radius:14px;padding:5px 8px;font-weight:900;font-size:.72rem;line-height:1.2;box-shadow:0 3px 0 rgba(0,0,0,.08);margin-bottom:12px}
.cust{display:flex;align-items:flex-end;gap:6px;z-index:2;transition:transform .5s}
.cust.away{transform:translateX(160%)}.cust.come{animation:come .6s ease-out}@keyframes come{from{transform:translateX(160%)}}
.who{font-size:2.6rem;line-height:1;display:inline-block}.who.happy{animation:jump .4s 3}@keyframes jump{50%{transform:translateY(-14px)}}
.order{background:#fffbe6;border:2px solid #e8c96a;border-radius:12px;padding:4px 8px;font-weight:900;font-size:.8rem;text-align:center;margin-bottom:10px;max-width:150px}
.order b{font-family:Fredoka,sans-serif;font-size:1.1rem}
.basket{position:absolute;right:8px;bottom:-6px;font-size:1.6rem}
.decor{position:absolute;font-size:1.4rem;bottom:2px;z-index:1;pointer-events:none}
.field{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#9ad97b,#79bf5a)}
.grid{display:grid;gap:4px;padding:8px;background:var(--soil2);border-radius:14px;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.cell{width:var(--c);height:var(--c);background:repeating-linear-gradient(0deg,var(--soil) 0 6px,#8d5f37 6px 8px);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:calc(var(--c) * .62);line-height:1;position:relative}
.cell.sel{background:#c9935e;box-shadow:inset 0 0 0 3px #ffe36e}.cell.anchor{box-shadow:inset 0 0 0 4px #ffb000}
.cell.ghost{opacity:1}
.pl{display:inline-block;animation:sprout .45s cubic-bezier(.3,1.6,.6,1) both}@keyframes sprout{from{transform:scale(0) translateY(40%)}}
.pl.grow{animation:grow .45s cubic-bezier(.3,1.6,.6,1) both}@keyframes grow{from{transform:scale(.3)}}
.pl.wiggle{animation:wig .4s}@keyframes wig{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.rowlab{position:absolute;left:-26px;font-family:Fredoka,sans-serif;font-weight:700;font-size:.9rem;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.drop{position:absolute;font-size:1rem;z-index:5;pointer-events:none;animation:rain .5s ease-in forwards}@keyframes rain{from{transform:translateY(-30px);opacity:0}to{transform:translateY(10px);opacity:1}}
.can{position:absolute;font-size:2rem;z-index:6;pointer-events:none;transition:left 1s linear}
.fly{position:absolute;z-index:8;pointer-events:none;transition:left .6s ease-in,top .6s ease-in,transform .6s;line-height:1}
/* pairs: veggies lying in the field; tap two and they hop into a pair box */
.veg{position:absolute;font-size:2rem;line-height:1;cursor:pointer;transition:left .4s ease,top .4s ease,transform .2s;z-index:3;transform:translate(-50%,-50%)}
.veg.pick{transform:translate(-50%,-50%) scale(1.3);filter:drop-shadow(0 0 6px #fff)}
.tray{position:absolute;left:8px;right:8px;bottom:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;z-index:2}
.pair{width:74px;height:44px;border-radius:12px;background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.7)}
.task{background:#fff;border-radius:18px;padding:9px 12px;margin-top:8px;text-align:center;font-weight:900;font-size:1.08rem;box-shadow:0 3px 0 #dbe8c8}
.task .cn{display:block;font-size:.8rem;color:var(--muted);font-weight:800;margin-top:2px}.task b{font-family:Fredoka,sans-serif;font-size:1.25em;color:#3d8a26}
.ans{display:none;grid-template-columns:auto 1fr;gap:8px;margin-top:8px;align-items:stretch}
.show{background:#fff;border-radius:16px;box-shadow:0 3px 0 #dbe8c8;min-width:90px;display:flex;align-items:center;justify-content:center;padding:4px 10px;font-family:Fredoka,sans-serif;font-size:2rem}.show.blank{color:#c9d3bd}
.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.k{border:0;border-radius:12px;background:#fff;font-family:Fredoka,sans-serif;font-weight:700;font-size:1.35rem;padding:7px 0;box-shadow:0 4px 0 #dbe8c8;cursor:pointer;color:var(--ink)}
.k.ok{background:#f5b301;color:#3b2a00;box-shadow:0 4px 0 #b88a00;font-size:1.1rem}
.k:active{transform:translateY(3px)}
.tools{display:flex;gap:8px;margin-top:8px}
.tool{flex:1;border:0;border-radius:16px;background:#fff;font:inherit;font-weight:900;font-size:1rem;padding:11px;box-shadow:0 4px 0 #dbe8c8;cursor:pointer;color:var(--ink)}
.tool.main{background:#f5b301;color:#3b2a00;box-shadow:0 5px 0 #b88a00;font-size:1.15rem}
.choices{display:none;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.choices button{border:0;border-radius:16px;background:#fff;font-family:Fredoka,sans-serif;font-weight:700;font-size:1.25rem;padding:12px 4px;box-shadow:0 5px 0 #dbe8c8;cursor:pointer;color:var(--ink)}
.choices.two{grid-template-columns:1fr 1fr}.choices button.bad{background:#ffd6d0;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}.shake{animation:shake .4s}
.glow{animation:glow 1s ease-in-out infinite;outline:4px solid #ffe36e;outline-offset:2px}@keyframes glow{50%{outline-color:#ffb000}}
.hand{position:absolute;font-size:2rem;z-index:9;pointer-events:none;animation:handgo 1.6s ease-in-out infinite}@keyframes handgo{0%,15%{transform:translate(0,0)}70%,100%{transform:translate(var(--dx),var(--dy))}}
.float{position:absolute;font-family:Fredoka,sans-serif;font-weight:700;font-size:1.5rem;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);pointer-events:none;animation:up 1.1s forwards;z-index:9}@keyframes up{to{transform:translateY(-50px);opacity:0}}
.heart{position:absolute;font-size:1.3rem;z-index:9;pointer-events:none;animation:heart 1.2s ease-out forwards}@keyframes heart{to{transform:translateY(-50px) scale(1.4);opacity:0}}
.over{position:absolute;inset:0;background:rgba(36,62,24,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:16px;z-index:10}
.over h2{font-family:Fredoka,sans-serif;margin:0 0 6px;font-size:1.9rem}.over p{margin:4px 0;font-weight:800}
.go{border:0;border-radius:999px;padding:13px 28px;font:inherit;font-weight:900;font-size:1.15rem;background:#f5b301;color:#3b2a00;box-shadow:0 5px 0 #b88a00;cursor:pointer;margin-top:12px}
.how{background:#fff;color:var(--ink);border-radius:16px;padding:10px 12px;font-weight:800;font-size:.92rem;text-align:left;margin-top:8px;max-width:400px}.how div{margin:4px 0}
.shop{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;max-width:380px;margin-top:10px}
.shop button{border:0;border-radius:14px;background:#fff;padding:6px 2px;font:inherit;font-weight:900;font-size:.75rem;color:var(--ink);cursor:pointer}.shop button i{display:block;font-style:normal;font-size:1.8rem}
.shop button.own{background:#d6f5e6}.shop button:disabled{opacity:.45;cursor:default}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:20}
.wrap.fitted{max-width:none;display:flex;flex-direction:column;overflow:hidden}
.wrap.fitted .stage{flex:1;height:auto;min-height:300px}
.wrap.fitted .sky{height:110px}.wrap.fitted .who{font-size:3.3rem}.wrap.fitted .pet{width:66px;height:66px}.wrap.fitted .bub{font-size:.92rem}.wrap.fitted .order{font-size:.95rem;max-width:200px}.wrap.fitted .veg{font-size:2.6rem}.wrap.fitted .decor{font-size:1.9rem}
@media(min-width:900px){.wrap.fitted .top,.wrap.fitted .hud,.wrap.fitted .bottom{width:100%;max-width:820px;margin-left:auto;margin-right:auto}
  .wrap.fitted .ans{grid-template-columns:auto 1fr}.wrap.fitted .keys{grid-template-columns:repeat(12,1fr)}}
</style>
</head><body>
<script src="../pet-art.js?v=20261015b"></script><script src="../sightwords-prizes.js?v=20261104a"></script><script src="../game-prizes.js?v=20261128c"></script><script src="pet.js?v=20261128a"></script><script src="../game-progress.js?v=20261127a"></script><script src="fit.js?v=20261129b"></script><script src="levels.js?v=20261130a"></script>
<div class="wrap" id="wrap">
  <div class="top"><a class="tbtn" href="../index.html" id="home">← Home</a><b style="font-family:Fredoka,sans-serif;font-size:1.25rem">🥕 Veggie Garden</b><span><button class="tbtn" type="button" id="helpBtn" aria-label="How to play">?</button> <button class="tbtn" type="button" id="soundBtn">🔔</button></span></div>
  <div class="hud"><div><small>Orders 订单</small><b id="orders">0/6</b></div><div><small>Level 关</small><b id="day">1</b></div><div><small>Coins 金币</small><b id="coins">0</b></div></div>
  <div class="stage" id="stage">
    <div class="sky" id="sky"><div class="sun"></div><div id="decor"></div>
      <div class="helper"><div class="pet" id="pet"></div><div class="bub" id="bub">Let's grow veggies! 一起种菜吧！</div></div>
      <div class="cust" id="cust"><div class="order" id="order"></div><span class="who" id="who"></span></div>
    </div>
    <div class="field" id="field"></div>
  </div>
  <div class="bottom">
    <div class="task" id="task"></div>
    <div class="tools" id="tools"><button type="button" class="tool" id="clear">↺ Start over 重来</button><button type="button" class="tool main" id="plant">💧 Grow! 浇水</button></div>
    <div class="ans" id="ans"><div class="show blank" id="show">?</div><div class="keys" id="keys"></div></div>
    <div class="choices" id="choices"></div>
  </div>
</div>
<canvas id="fx"></canvas>
<script>
(function(){
  "use strict";
  // Veggie Garden (Grade 2, Unit 8: equal groups). Animals come to the garden with an order.
  //   plant  "3 rows of 4 carrots": drag across the soil from one corner to the other (or tap two corners) to plant a block of
  //          rows and columns; water it and the veggies grow; then "4 + 4 + 4 = ?" (repeated addition) and the animal takes them.
  //   patch  a block is already growing: which addition matches its rows? and how many in all?
  //   pairs  a pile of veggies: tap two at a time to put them in pairs; one left over means odd, none means even.
  // Level 1 plant (up to 4 rows of 4), level 2 adds patch, level 3 adds pairs, level 4 bigger (5 rows, 20 in a pile).
  // Inside a level: the first orders are small, a miss makes the next one small again, a run of right answers brings bigger ones.
  // 6 orders a level; 5 done (in two tries) opens the next level (any level opened can be played again). Coins buy things for the garden.
  var $=function(id){ return document.getElementById(id); };
  var STORE="veggieGarden.v1", S={day:1,coins:0,deco:{},tut:0,sound:true};
  try{ var s0=JSON.parse(localStorage.getItem(STORE)); if(s0) for(var k in s0) S[k]=s0[k]; }catch(e){}
  function save(){ try{ localStorage.setItem(STORE,JSON.stringify(S)); }catch(e){} }
  var GOAL=6, D=null, Q=null, busy=false, val="", R=5, C=6, L=S.day;   // L: the level being played
  function rnd(n){ return Math.floor(Math.random()*n); }
  var actx=null;
  function tone(fs,len,type){ if(!S.sound) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); fs.forEach(function(f,i){ var t=actx.currentTime+i*len*.7, o=actx.createOscillator(), g=actx.createGain(); o.type=type||"triangle"; o.frequency.value=f; g.gain.setValueAtTime(.13,t); g.gain.exponentialRampToValueAtTime(.001,t+len); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+len+.02); }); }catch(e){} }
  $("soundBtn").onclick=function(){ S.sound=!S.sound; $("soundBtn").textContent=S.sound?"🔔":"🔕"; save(); };
  $("soundBtn").textContent=S.sound?"🔔":"🔕";
  try{ if(window.self!==window.top) $("home").style.visibility="hidden"; }catch(e){}
  var pet=window.MathPet?MathPet.get():null;
  $("pet").innerHTML=pet?MathPet.pic(pet,"happy",66):"🐣";
  function say(t){ $("bub").innerHTML=t; var p=$("pet"); p.classList.remove("cheer"); void p.offsetWidth; p.classList.add("cheer"); }
  function Z(){ return parseFloat($("wrap").style.zoom)||1; }
  // ---------- garden things bought with coins (they stand along the bottom of the sky) ----------
  var DECO=[{id:"sunflower",e:"🌻",p:5},{id:"bee",e:"🐝",p:8},{id:"butterfly",e:"🦋",p:12},{id:"hen",e:"🐔",p:16},{id:"pump",e:"🎃",p:20},{id:"tractor",e:"🚜",p:28},{id:"barn",e:"🏡",p:36},{id:"rainbow",e:"🌈",p:45}];
  function drawDeco(){ $("decor").innerHTML=DECO.filter(function(d){ return S.deco[d.id]; }).map(function(d,i){ return '<span class="decor" style="left:'+(30+i*7)+'%">'+d.e+'</span>'; }).join(""); }
  // ---------- an order ----------
  var CUST=[["🐰","🥕"],["🐻","🍓"],["🐷","🌽"],["🐮","🥬"],["🐹","🍅"],["🦊","🍆"],["🐨","🥦"],["🐭","🧀"]];
  function gen(){
    var types=["plant"]; if(L>=2) types.push("patch"); if(L>=3) types.push("pairs","plant");
    var easy=D.n<=2||D.bad, hard=!easy&&D.streak>=3;
    var t=types[rnd(types.length)], big=L>=4&&!easy||hard, cu=CUST[rnd(CUST.length)];
    var q={type:t,who:cu[0],veg:cu[1]==="🧀"?"🌽":cu[1],tries:0};
    if(t==="plant"||t==="patch"){ do{ q.rows=2+rnd(easy?2:big?4:3); q.cols=2+rnd(easy?2:big?5:3); }while(q.rows===q.cols&&Math.random()<.6||q.rows>R||q.cols>C); q.total=q.rows*q.cols; }
    else { q.n=easy?4+rnd(7):(big?6:5)+rnd(big?15:10); q.total=q.n; }
    if(!S.tut&&D.first&&L===1) q={type:"plant",who:"🐰",veg:"🥕",tries:0,rows:2,cols:3,total:6,tut:true};
    return q;
  }
  function plural(){ return {"🥕":"carrots","🍓":"strawberries","🌽":"corn","🥬":"lettuces","🍅":"tomatoes","🍆":"eggplants","🥦":"broccoli"}[Q.veg]||"veggies"; }
  function rep(n,times){ var a=[]; for(var i=0;i<times;i++) a.push(n); return a.join(" + "); }
  // ---------- the garden grid ----------
  var anchor=null, sel=null, planted=null, cellPx=50;
  // the cell size follows the room the field has (it changes when the panel below changes): call fitGrid() after any change
  function fitGrid(){
    var f=$("field"), g=$("grid"); if(!g) return;
    var w=f.clientWidth||340, h=f.clientHeight||260;
    cellPx=Math.max(28,Math.min(84,Math.floor(Math.min((w-40-(C-1)*4)/C,(h-28-(R-1)*4)/R))));
    g.style.setProperty("--c",cellPx+"px"); g.style.gridTemplateColumns="repeat("+C+","+cellPx+"px)";
  }
  function drawGrid(){
    var g='<div class="grid" id="grid">';
    for(var r=0;r<R;r++) for(var c=0;c<C;c++) g+='<div class="cell" data-r="'+r+'" data-c="'+c+'"></div>';
    $("field").innerHTML=g+'</div>';
    fitGrid(); wireGrid();
  }
  function cellAt(x,y){ var el=document.elementFromPoint(x,y); el=el&&el.closest?el.closest(".cell"):null; return el?[+el.dataset.r,+el.dataset.c]:null; }
  function rect(a,b){ return {r0:Math.min(a[0],b[0]),r1:Math.max(a[0],b[0]),c0:Math.min(a[1],b[1]),c1:Math.max(a[1],b[1])}; }
  function paint(rc){
    [].forEach.call(document.querySelectorAll(".cell"),function(el){
      var r=+el.dataset.r, c=+el.dataset.c, on=rc&&r>=rc.r0&&r<=rc.r1&&c>=rc.c0&&c<=rc.c1;
      el.classList.toggle("sel",!!on); el.classList.toggle("anchor",!!(anchor&&!rc&&anchor[0]===r&&anchor[1]===c));
      if(!planted){ if(on&&!el.firstChild) el.innerHTML='<span class="pl">🌱</span>'; else if(!on&&el.firstChild) el.innerHTML=""; }   // only new sprouts pop in
    });
  }
  function wireGrid(){
    var g=$("grid"), down=null, moved=false;
    g.onpointerdown=function(e){ if(busy||planted||Q.type!=="plant") return; var a=cellAt(e.clientX,e.clientY); if(!a) return; e.preventDefault();
      try{ g.setPointerCapture(e.pointerId); }catch(er){}
      var hd=$("hand"); if(hd) hd.remove();
      if(anchor&&!sel){ sel=rect(anchor,a); anchor=null; paint(sel); tone([523,659],.06); down=null; afterPick(); return; }   // tap, tap: two corners
      down=a; moved=false; sel=null; anchor=null; paint(rect(a,a)); tone([440],.04); };
    g.onpointermove=function(e){ if(!down) return; var b=cellAt(e.clientX,e.clientY); if(!b) return; var rc=rect(down,b); if(rc.r1!==rc.r0||rc.c1!==rc.c0) moved=true; sel=rc; paint(rc); };
    g.onpointerup=g.onpointercancel=function(e){ if(!down) return; var b=cellAt(e.clientX,e.clientY)||down;
      if(!moved&&b[0]===down[0]&&b[1]===down[1]){ anchor=down; sel=null; paint(null); down=null; say("Now tap the other corner! 再点另一个角！"); return; }
      sel=rect(down,b); down=null; paint(sel); tone([523,659],.06); afterPick(); };
  }
  function afterPick(){ $("plant").classList.toggle("glow",!!Q.tut); if(Q.tut) say("Count the rows and columns. Then tap <b>Grow!</b> 数一数，再点“浇水”！"); }
  $("clear").onclick=function(){ if(busy||planted) return; sel=null; anchor=null; paint(null); tone([330],.05); };
  // water: check the rows and columns, then the veggies grow
  $("plant").onclick=function(){
    if(busy||planted||!sel) return;
    var rows=sel.r1-sel.r0+1, cols=sel.c1-sel.c0+1;
    $("plant").classList.remove("glow");
    if(rows!==Q.rows||cols!==Q.cols){
      Q.tries++; tone([200,150],.12,"sawtooth"); $("grid").classList.remove("shake"); void $("grid").offsetWidth; $("grid").classList.add("shake");
      var msg=rows===Q.cols&&cols===Q.rows?"That's "+rows+" rows of "+cols+". Rows go across ↔. 这是 "+rows+" 行，每行 "+cols+" 个。行是横着的！":"You made "+rows+" rows of "+cols+". The order is "+Q.rows+" rows of "+Q.cols+". 你种了 "+rows+" 行，每行 "+cols+" 个，再看看订单。";
      say(msg); if(Q.tries>=2){ sel={r0:0,r1:Q.rows-1,c0:0,c1:Q.cols-1}; paint(sel); D.miss++; Q.fixed=true; setTimeout(grow,900); } return;
    }
    grow();
  };
  function grow(){
    busy=true; planted=sel;
    // the watering can passes over, drops fall, and the sprouts grow into veggies one row at a time
    var st=$("stage").getBoundingClientRect(), g=$("grid").getBoundingClientRect(), z=Z();
    var can=document.createElement("div"); can.className="can"; can.textContent="🚿"; can.style.left=((g.left-st.left)/z-30)+"px"; can.style.top=((g.top-st.top)/z-34)+"px"; $("stage").appendChild(can);
    void can.offsetWidth; can.style.left=((g.right-st.left)/z)+"px"; tone([700,760,700,820],.1,"sine");
    for(var i=0;i<8;i++){ (function(i){ setTimeout(function(){ var d=document.createElement("span"); d.className="drop"; d.textContent="💧"; d.style.left=((g.left-st.left)/z+i*(g.width/z)/8)+"px"; d.style.top=((g.top-st.top)/z)+"px"; $("stage").appendChild(d); setTimeout(function(){ d.remove(); },500); },i*110); })(i); }
    setTimeout(function(){ can.remove(); },1100);
