<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Duck Pond</title>
<meta name="theme-color" content="#2fa6c9">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="description" content="Duck Pond: bring ducks into the pond, make them fly away, and sort ducks, frogs and fish into baskets that make a picture graph. Grade 1 adding and subtracting within 10, and data.">
<link href="/fonts/fonts.css" rel="stylesheet">
<style>
:root{--ink:#21384a;--muted:#5f7888;--bg:#e8f7fb}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:Nunito,ui-rounded,"Trebuchet MS",Arial,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.wrap{max-width:560px;margin:0 auto;padding:10px 12px 20px;position:relative}
.top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.tbtn{background:#fff;border:1px solid #cfe9f1;border-radius:13px;padding:8px 12px;color:var(--ink);text-decoration:none;font:inherit;font-weight:900;cursor:pointer}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.hud div{background:#fff;border-radius:14px;text-align:center;padding:4px;box-shadow:0 3px 0 #cfe9f1}
.hud small{display:block;font-weight:800;color:var(--muted);font-size:.7rem}.hud b{font-family:Fredoka,sans-serif;font-size:1.35rem}
/* the scene: sky, grass, the pond, the bank where ducks wait */
.stage{position:relative;height:max(380px,calc(100vh - 400px));border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#bfe8ff 0 16%,#9fdc86 16%,#86cf6c);touch-action:none}
.cloud{position:absolute;top:2%;font-size:1.6rem;opacity:.9;animation:drift 30s linear infinite}@keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(110vw)}}
.pond{position:absolute;left:5%;right:5%;top:20%;bottom:26%;border-radius:50%/40%;background:radial-gradient(ellipse at 50% 40%,#7fd6f0,#3aa9d6 70%,#2f8fc0);box-shadow:inset 0 -8px 0 rgba(0,0,0,.08),0 0 0 6px #7fbf5e}
.pond:before{content:"";position:absolute;left:12%;top:18%;width:22%;height:8%;border-radius:50%;background:rgba(255,255,255,.35);animation:shine 3s ease-in-out infinite}@keyframes shine{50%{transform:translateX(20px);opacity:.6}}
.pond.drop{box-shadow:inset 0 -8px 0 rgba(0,0,0,.08),0 0 0 8px #ffe36e}
.bank{position:absolute;left:4%;right:4%;bottom:3%;height:20%}
.decor{position:absolute;font-size:1.5rem;line-height:1;pointer-events:none;z-index:1}
.helper{position:absolute;left:8px;top:6px;display:flex;align-items:flex-start;gap:5px;z-index:6;max-width:72%}
.pet{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;font-size:2rem}.pet.cheer{animation:bob .5s 2}@keyframes bob{50%{transform:translateY(-8px)}}
.bub{background:#fff;border-radius:12px;padding:4px 8px;font-weight:900;font-size:.76rem;line-height:1.2;box-shadow:0 3px 0 rgba(0,0,0,.08)}
/* the animals */
.an{position:absolute;width:var(--s,54px);margin-left:calc(var(--s,54px) / -2);margin-top:calc(var(--s,54px) / -2);line-height:0;z-index:3;transition:left .45s ease,top .45s ease,transform .3s,opacity .4s;cursor:pointer;touch-action:none}
.an svg{width:100%;height:auto;display:block;overflow:visible}
.an.swim svg{animation:swim 2.4s ease-in-out infinite}@keyframes swim{50%{transform:translateY(-3px) rotate(-3deg)}}
.an.wait svg{animation:wait 1.2s ease-in-out infinite}@keyframes wait{50%{transform:translateY(-4px)}}
.an.drag{transition:none;z-index:9;transform:scale(1.15)}
.an.fly{z-index:9;transition:left 1s ease-in,top 1s ease-in,opacity 1s;pointer-events:none}
/* a grown-up duck takes off: a hop and a splash, the wings beat, it flies up and away in an arc (it is not faded out: it leaves the sky) */
.an.flying{z-index:9;pointer-events:none;transition:none;animation:takeoff 2.3s cubic-bezier(.45,.05,.7,.4) forwards}
.an.flying svg{transform:rotate(-14deg);animation:none}
@keyframes takeoff{0%{transform:translate(0,0)}10%{transform:translate(2px,8px)}22%{transform:translate(10px,-14px)}100%{transform:translate(var(--dx),var(--dy)) scale(.5)}}
.an .fw{display:none}.an.flying .fw{display:inline;transform-origin:32px 29px;transform-box:view-box;animation:beat .2s ease-in-out infinite alternate}
.an.flying .fw.far{animation-delay:-.05s}.an.flying .wg{display:none}
@keyframes beat{from{transform:scaleY(1)}to{transform:scaleY(-.55)}}
.drop{position:absolute;width:6px;height:6px;border-radius:50%;background:#e6f7ff;z-index:8;pointer-events:none;animation:drop .6s ease-out forwards}@keyframes drop{to{transform:translate(var(--x),var(--y));opacity:0}}
.an .num{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);background:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-family:Fredoka,sans-serif;font-weight:700;font-size:1rem;line-height:1;box-shadow:0 2px 0 rgba(0,0,0,.15);animation:pop .3s}
@keyframes pop{from{transform:translate(-50%,-100%) scale(0)}}
.an.no{animation:no .4s}@keyframes no{25%{margin-left:calc(var(--s,54px) / -2 - 6px)}75%{margin-left:calc(var(--s,54px) / -2 + 6px)}}
.ripple{position:absolute;width:20px;height:8px;margin:-4px 0 0 -10px;border:3px solid rgba(255,255,255,.8);border-radius:50%;z-index:2;pointer-events:none;animation:rip .7s ease-out forwards}@keyframes rip{to{transform:scale(4);opacity:0}}
.feather{position:absolute;font-size:1rem;z-index:8;pointer-events:none;animation:fall 1s ease-in forwards}@keyframes fall{to{transform:translate(var(--x),40px) rotate(90deg);opacity:0}}
/* sorting baskets: each one is a column of a picture graph */
.baskets{position:absolute;left:4%;right:4%;top:20%;bottom:26%;display:flex;gap:8px;z-index:2}
.bk{flex:1;background:rgba(255,255,255,.75);border:3px solid #c98a4b;border-radius:14px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.bk .stack{flex:1;display:flex;flex-direction:column-reverse;align-items:center;gap:2px;padding:4px 2px 2px}
.bk .foot{flex:none;display:flex;align-items:center;justify-content:center;gap:4px;background:#f3dcbc;border-top:3px solid #c98a4b;padding:3px 2px}
.bk.glow{box-shadow:0 0 0 5px #ffe36e}.bk .lab{font-family:Fredoka,sans-serif;font-size:.8rem;font-weight:700;color:#7a5230;line-height:1}
.bk .ic{width:var(--g,30px);line-height:0}.bk .ic svg{width:100%;height:auto}.bk .ic.new{animation:land .4s cubic-bezier(.3,1.6,.6,1)}@keyframes land{from{transform:translateY(-30px) scale(.5)}}
.bk .head{width:34px;line-height:0}.wrap.fitted .bk .head{width:44px}.wrap.fitted .bk .lab{font-size:1rem}
/* the bottom: the question, the number buttons */
.task{background:#fff;border-radius:18px;padding:9px 12px;margin-top:8px;text-align:center;font-weight:900;font-size:1.12rem;box-shadow:0 3px 0 #cfe9f1}
.task .cn{display:block;font-size:.82rem;color:var(--muted);font-weight:800;margin-top:2px}.task b{font-family:Fredoka,sans-serif;font-size:1.35em;color:#1f8ab8}
.eq{font-family:Fredoka,sans-serif;font-size:1.8rem;color:#2f9e5b}
.nums{display:none;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
.nums button{border:0;border-radius:14px;background:#fff;font-family:Fredoka,sans-serif;font-weight:700;font-size:1.7rem;padding:8px 0;box-shadow:0 4px 0 #cfe9f1;cursor:pointer;color:var(--ink)}
.nums button.bad{background:#ffd6d0;animation:shake .4s}
.picks{display:none;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.picks button{border:0;border-radius:14px;background:#fff;padding:6px;box-shadow:0 4px 0 #cfe9f1;cursor:pointer;line-height:0}.picks button svg{width:52px;height:auto}.picks button.bad{background:#ffd6d0;animation:shake .4s}
.go2{display:none;width:100%;margin-top:8px;border:0;border-radius:16px;background:#f5b301;color:#3b2a00;font:inherit;font-weight:900;font-size:1.15rem;padding:11px;box-shadow:0 5px 0 #b88a00;cursor:pointer}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hand{position:absolute;font-size:2.2rem;z-index:9;pointer-events:none;transition:left 1s ease-in-out,top 1s ease-in-out}
.float{position:absolute;font-family:Fredoka,sans-serif;font-weight:700;font-size:1.5rem;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);pointer-events:none;animation:up 1.1s forwards;z-index:9}@keyframes up{to{transform:translateY(-50px);opacity:0}}
.over{position:absolute;inset:0;background:rgba(20,60,80,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:16px;z-index:10}
.over h2{font-family:Fredoka,sans-serif;margin:0 0 6px;font-size:1.9rem}.over p{margin:4px 0;font-weight:800}
.go{border:0;border-radius:999px;padding:13px 28px;font:inherit;font-weight:900;font-size:1.15rem;background:#f5b301;color:#3b2a00;box-shadow:0 5px 0 #b88a00;cursor:pointer;margin-top:12px}
.how{background:#fff;color:var(--ink);border-radius:16px;padding:10px 12px;font-weight:800;font-size:.92rem;text-align:left;margin-top:8px;max-width:400px}.how div{margin:4px 0}
.shop{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;max-width:380px;margin-top:10px}
.shop button{border:0;border-radius:14px;background:#fff;padding:6px 2px;font:inherit;font-weight:900;font-size:.75rem;color:var(--ink);cursor:pointer}.shop button i{display:block;font-style:normal;font-size:1.8rem}
.shop button.own{background:#d6f5e6}.shop button:disabled{opacity:.45;cursor:default}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:20}
.wrap.fitted{max-width:none;display:flex;flex-direction:column;overflow:hidden}
.wrap.fitted .stage{flex:1;height:auto;min-height:320px}
.wrap.fitted .pet{width:60px;height:60px}.wrap.fitted .bub{font-size:.95rem}.wrap.fitted .decor{font-size:2rem}
@media(min-width:900px){.wrap.fitted .top,.wrap.fitted .hud,.wrap.fitted .bottom{width:100%;max-width:820px;margin-left:auto;margin-right:auto}.wrap.fitted .nums{grid-template-columns:repeat(11,1fr)}}
</style>
</head><body>
<script src="../pet-art.js?v=20261015b"></script><script src="../sightwords-prizes.js?v=20261104a"></script><script src="../game-prizes.js?v=20261128c"></script><script src="pet.js?v=20261128a"></script><script src="../game-progress.js?v=20261127a"></script><script src="fit.js?v=20261129b"></script><script src="levels.js?v=20261130a"></script>
<div class="wrap" id="wrap">
  <div class="top"><a class="tbtn" href="../index.html" id="home">← Home</a><b style="font-family:Fredoka,sans-serif;font-size:1.25rem">🦆 Duck Pond</b><span><button class="tbtn" type="button" id="helpBtn" aria-label="How to play">?</button> <button class="tbtn" type="button" id="soundBtn">🔔</button></span></div>
  <div class="hud"><div><small>Stars 星星</small><b id="score">0/6</b></div><div><small>Level 关</small><b id="day">1</b></div><div><small>Coins 金币</small><b id="coins">0</b></div></div>
  <div class="stage" id="stage">
    <span class="cloud" style="animation-delay:-6s">☁️</span><span class="cloud" style="animation-delay:-19s;top:6%;font-size:1.2rem">☁️</span>
    <div id="decor"></div>
    <div class="pond" id="pond"></div>
    <div class="bank" id="bank"></div>
    <div id="sortArea"></div>
    <div id="ans"></div>
    <div class="helper"><div class="pet" id="pet"></div><div class="bub" id="bub">Quack quack! 嘎嘎！</div></div>
  </div>
  <div class="bottom">
    <div class="task" id="task"></div>
    <div class="nums" id="nums"></div>
    <div class="picks" id="picks"></div>
    <button type="button" class="go2" id="go2">✓ Done! 好了</button>
  </div>
</div>
<canvas id="fx"></canvas>
<script>
(function(){
  "use strict";
  // Duck Pond (Grade 1, Unit 1: adding and subtracting within 10, and data). 6 stars a level; 5 opens the next; any level opened can be played again.
  //   add      "3 ducks swim. 2 more come!" - drag (or tap) the waiting ducks into the pond (a splash), then: how many now?
  //   sub      "5 ducks. 2 fly away!" - tap 2 ducks: they flap and fly off; then: how many are left?
  //   want     "We want 7 ducks in the pond!" - bring them in (tap one in the pond to send it back), then: how many did you bring?
  //   sort     ducks, frogs and fish on the bank: drag each into its basket; the baskets fill up like a picture graph; then questions
  //            (how many frogs? which has the most? how many more fish than frogs? how many ducks and frogs in all?)
  //   level 1 add (sums to 5 first, then 10), level 2 take away, level 3 add, take away and "we want", level 4 sorting, level 5 everything
  // A wrong answer: "count them one by one". Two: numbers pop up on each animal, one by one, and the answer is said.
  var $=function(id){ return document.getElementById(id); };
  var STORE="duckPond.v1", S={day:1,coins:0,deco:{},tut:0,sound:true};
  try{ var s0=JSON.parse(localStorage.getItem(STORE)); if(s0) for(var k in s0) S[k]=s0[k]; }catch(e){}
  function save(){ try{ localStorage.setItem(STORE,JSON.stringify(S)); }catch(e){} }
  var L=S.day, D=null, Q=null, busy=false, GOAL=6;
  function rnd(n){ return Math.floor(Math.random()*n); }
  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=rnd(i+1), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  var actx=null;
  function tone(fs,len,type){ if(!S.sound) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); fs.forEach(function(f,i){ var t=actx.currentTime+i*len*.7, o=actx.createOscillator(), g=actx.createGain(); o.type=type||"triangle"; o.frequency.value=f; g.gain.setValueAtTime(.13,t); g.gain.exponentialRampToValueAtTime(.001,t+len); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+len+.02); }); }catch(e){} }
  function quack(){ tone([520,440],.07,"square"); }
  $("soundBtn").onclick=function(){ S.sound=!S.sound; $("soundBtn").textContent=S.sound?"🔔":"🔕"; save(); };
  $("soundBtn").textContent=S.sound?"🔔":"🔕";
  try{ if(window.self!==window.top) $("home").style.visibility="hidden"; }catch(e){}
  var pet=window.MathPet?MathPet.get():null;
  $("pet").innerHTML=pet?MathPet.pic(pet,"happy",60):"🐣";
  function say(t){ $("bub").innerHTML=t; var p=$("pet"); p.classList.remove("cheer"); void p.offsetWidth; p.classList.add("cheer"); }
  function Z(){ return parseFloat($("wrap").style.zoom)||1; }
  // ---------- the animals (drawn, facing right) ----------
  var INK='stroke-linejoin="round" stroke-linecap="round"';
  var ART={
    // the grown-up duck (a mallard) flies; the little yellow ducklings can't
    mallard:'<svg viewBox="0 0 70 54"><path d="M9 33Q1 27 6 20Q13 27 16 30Z" fill="#4a4a4a" stroke="#2b2b2b" stroke-width="2" '+INK+'/><ellipse cx="31" cy="36" rx="22" ry="13" fill="#cdbda4" stroke="#6b5a45" stroke-width="2.4"/><ellipse cx="45" cy="36" rx="9" ry="9.5" fill="#8a4a2a" stroke="#5a2e18" stroke-width="2"/>'+
      '<circle cx="50" cy="19" r="10.5" fill="#1f8a4a" stroke="#145c31" stroke-width="2.4"/><path d="M45 13Q49 10 53 12" fill="none" stroke="#5fd18c" stroke-width="2" stroke-linecap="round"/><path d="M42 28Q49 32 57 27" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>'+
      '<path d="M59 17L69 20L59 24Z" fill="#f5c84a" stroke="#c99a1c" stroke-width="1.6" '+INK+'/><circle cx="53" cy="16" r="2.4" fill="#21384a"/><circle cx="53.7" cy="15.3" r=".8" fill="#fff"/>'+
      '<g class="wg"><path d="M17 33Q30 21 43 30Q31 40 17 33Z" fill="#a89478" stroke="#6b5a45" stroke-width="2.2" '+INK+'/><path d="M24 34Q31 30 38 32" fill="none" stroke="#3a6fd8" stroke-width="3" stroke-linecap="round"/></g>'+
      // the wings spread for flying: a far one (darker) and a near one, beating from the shoulder
      '<g class="fw far"><path d="M26 28Q22 6 10 -6Q20 -6 28 2Q32 -8 40 -10Q38 6 38 27Z" fill="#8a7a62" stroke="#5a4a38" stroke-width="2" '+INK+'/></g>'+
      '<g class="fw"><path d="M24 30Q16 8 2 -2Q14 -4 22 4Q24 -6 32 -10Q30 2 32 8Q38 0 44 -2Q38 14 40 29Z" fill="#b8a486" stroke="#6b5a45" stroke-width="2.2" '+INK+'/><path d="M26 22Q32 18 38 20" fill="none" stroke="#3a6fd8" stroke-width="3.2" stroke-linecap="round"/></g></svg>',
    duck:'<svg viewBox="0 0 64 50"><path d="M6 30Q0 22 5 16Q12 23 15 27Z" fill="#ffd84a" stroke="#c99a1c" stroke-width="2.4" '+INK+'/><ellipse cx="27" cy="33" rx="21" ry="13" fill="#ffd84a" stroke="#c99a1c" stroke-width="2.6"/><circle cx="44" cy="17" r="11" fill="#ffd84a" stroke="#c99a1c" stroke-width="2.6"/><path d="M53 15L63 19L53 23Z" fill="#ff9f43" stroke="#d8742a" stroke-width="1.8" '+INK+'/><circle cx="47" cy="14" r="2.6" fill="#21384a"/><circle cx="47.8" cy="13.2" r=".9" fill="#fff"/><path d="M17 31Q28 21 36 32Q27 40 17 31Z" fill="#ffc72c" stroke="#c99a1c" stroke-width="2" '+INK+'/></svg>',
    frog:'<svg viewBox="0 0 64 50"><ellipse cx="14" cy="44" rx="10" ry="4.5" fill="#4aa64a" stroke="#2f6b33" stroke-width="2"/><ellipse cx="50" cy="44" rx="10" ry="4.5" fill="#4aa64a" stroke="#2f6b33" stroke-width="2"/><ellipse cx="32" cy="32" rx="22" ry="15" fill="#6cc35a" stroke="#2f6b33" stroke-width="2.6"/><circle cx="21" cy="15" r="8" fill="#6cc35a" stroke="#2f6b33" stroke-width="2.6"/><circle cx="43" cy="15" r="8" fill="#6cc35a" stroke="#2f6b33" stroke-width="2.6"/><circle cx="21" cy="14" r="4.5" fill="#fff"/><circle cx="43" cy="14" r="4.5" fill="#fff"/><circle cx="22" cy="15" r="2.4" fill="#21384a"/><circle cx="44" cy="15" r="2.4" fill="#21384a"/><path d="M22 34Q32 42 42 34" fill="none" stroke="#2f6b33" stroke-width="2.6" stroke-linecap="round"/><ellipse cx="18" cy="31" rx="3.5" ry="2.2" fill="#ff9fb6"/><ellipse cx="46" cy="31" rx="3.5" ry="2.2" fill="#ff9fb6"/></svg>',
    fish:'<svg viewBox="0 0 64 50"><path d="M4 12L20 25L4 38Z" fill="#ff8a4c" stroke="#c2501f" stroke-width="2.4" '+INK+'/><ellipse cx="36" cy="25" rx="24" ry="15" fill="#ffa25c" stroke="#c2501f" stroke-width="2.6"/><path d="M30 11Q36 3 44 10" fill="#ff8a4c" stroke="#c2501f" stroke-width="2" '+INK+'/><circle cx="48" cy="21" r="3.6" fill="#fff"/><circle cx="49" cy="21" r="2.2" fill="#21384a"/><path d="M28 16Q24 25 28 34M36 14Q32 25 36 36" fill="none" stroke="#e0703a" stroke-width="1.8"/><path d="M54 29Q57 30 58 28" fill="none" stroke="#c2501f" stroke-width="2" stroke-linecap="round"/></svg>'
  };
  var KIND={mallard:["ducks","鸭子"],duck:["ducks","鸭子"],frog:["frogs","青蛙"],fish:["fish","小鱼"]};
  // ---------- pond decorations bought with coins ----------
  var DECO=[{id:"lily",e:"🪷",p:5,x:"12%",y:"70%"},{id:"tulip",e:"🌷",p:8,x:"88%",y:"12%"},{id:"snail",e:"🐌",p:12,x:"4%",y:"16%"},{id:"butterfly",e:"🦋",p:16,x:"60%",y:"4%"},{id:"tree",e:"🌳",p:22,x:"92%",y:"2%"},{id:"rainbow",e:"🌈",p:28,x:"38%",y:"1%"},{id:"swan",e:"🦢",p:36,x:"80%",y:"60%"},{id:"house",e:"🏡",p:45,x:"72%",y:"2%"}];
  function drawDeco(){ $("decor").innerHTML=DECO.filter(function(d){ return S.deco[d.id]; }).map(function(d){ return '<span class="decor" style="left:'+d.x+';top:'+d.y+'">'+d.e+'</span>'; }).join(""); }
  // ---------- places: 10 spots in the pond (two rows of five, easy to count), up to 10 on the bank ----------
  function stageBox(){ var s=$("stage"); return {w:s.clientWidth,h:s.clientHeight}; }
  function pondSpot(i){ var p=$("pond"), x=p.offsetLeft+p.offsetWidth*(.18+.16*(i%5)), y=p.offsetTop+p.offsetHeight*(i<5?.36:.68); return [x,y]; }
  function bankSpot(i,n){ var b=$("bank"), cols=Math.max(5,n), x=b.offsetLeft+b.offsetWidth*((i%cols)+.5)/cols, y=b.offsetTop+b.offsetHeight*.55; return [x,y]; }
  function size(){ var p=$("pond"), st=$("stage"), w=p.offsetWidth||st.clientWidth*.9, h=p.offsetHeight||st.clientHeight*.54;   // the pond is hidden while sorting
    return Math.round(Math.max(38,Math.min(96,w/7,h/2.7))); }
  var A=[];   // the animals on the scene: {el, where:"pond"|"bank"|"gone", spot, kind}
  function addAnimal(kind,where,spot,n){
    var el=document.createElement("div"); el.className="an "+(where==="pond"?"swim":"wait"); el.innerHTML=ART[kind]; el.style.setProperty("--s",size()+"px");
    var p=where==="pond"?pondSpot(spot):bankSpot(spot,n); el.style.left=p[0]+"px"; el.style.top=p[1]+"px";
    el.dataset.i=A.length; $("stage").appendChild(el); var a={el:el,where:where,spot:spot,kind:kind,n:n||10}; A.push(a); wire(a); return a;

  function wirePick(){ if(window.LevelPick) LevelPick.wire(function(n){ L=n; $("day").textContent=L; var b=$("play")||$("nextDay"); if(b) b.textContent=playLabel(); }); }
  function over(html){ closeOver(); var o=document.createElement("div"); o.className="over"; o.id="over"; o.innerHTML=html; $("wrap").appendChild(o); }
  function closeOver(){ var o=$("over"); if(o) o.remove(); }
  var HOW='<div class="how"><div>🦆 Drag (or tap) ducks into the pond, then count them.</div><div>🪶 Tap ducks to make them fly away. How many are left?</div><div>🧺 Sort ducks, frogs and fish into baskets, then answer.</div><div style="color:var(--muted)">把小鸭拖进池塘（或点一下），再数一数；点鸭子让它飞走，还剩几只；把鸭子、青蛙、小鱼放进篮子，再回答问题。</div></div>';
  function intro(){ over('<h2>🦆 Duck Pond</h2><p>Adding, Subtracting &amp; Data 加减法和数据</p>'+HOW+levelPick()+'<button type="button" class="go" id="play">'+playLabel()+'</button>'); wirePick(); $("play").onclick=startLevel; }
  $("helpBtn").onclick=function(){ var o=document.createElement("div"); o.className="over"; o.innerHTML='<h2>❓ How to play</h2>'+HOW+'<button type="button" class="go">Got it! 明白了</button>'; $("wrap").appendChild(o); o.querySelector(".go").onclick=function(){ o.remove(); }; };
  var cv=$("fx"), cx=cv.getContext("2d"), parts=[], anim=0;
  function burst(x,y){ cv.width=innerWidth; cv.height=innerHeight; for(var i=0;i<18;i++) parts.push({x:x,y:y,vx:(Math.random()-.5)*7,vy:-Math.random()*6-1,l:34,c:["#f5b301","#ff7a8a","#7cc47f","#4aa3ff","#a46bff"][i%5]}); if(!anim) anim=requestAnimationFrame(fx); }
  function fx(){ cx.clearRect(0,0,cv.width,cv.height); parts=parts.filter(function(p){ p.x+=p.vx; p.y+=p.vy; p.vy+=.3; p.l--; cx.fillStyle=p.c; cx.fillRect(p.x,p.y,6,6); return p.l>0; }); anim=parts.length?requestAnimationFrame(fx):0; if(!anim) cx.clearRect(0,0,cv.width,cv.height); }
  if(window.FitScreen) FitScreen($("wrap"),{wide:[1000,680],narrow:[520,900],max:1.7});
  // the room changes (the panel below, the window): put every animal back on its spot
  function relayout(){ A.forEach(function(a){ if(a.where==="gone") return; a.el.style.setProperty("--s",(a.small?sortSize(a.n):size())+"px"); var p=a.where==="pond"?pondSpot(a.spot):bankSpot(a.spot,a.n); if(!a.el.classList.contains("drag")){ a.el.style.left=p[0]+"px"; a.el.style.top=p[1]+"px"; } }); }
  var rt=0; window.addEventListener("resize",function(){ clearTimeout(rt); rt=setTimeout(relayout,150); });
  new MutationObserver(function(){ requestAnimationFrame(relayout); }).observe($("wrap").querySelector(".bottom"),{childList:true,subtree:true,attributes:true,attributeFilter:["style"]});
  drawDeco(); hud(); $("task").innerHTML="🦆 Welcome to Duck Pond! 欢迎来小鸭池塘！";
  window.__duck={q:function(){ return Q; },d:function(){ return D; },s:function(){ return S; },a:function(){ return A.map(function(a){ return {where:a.where,spot:a.spot,kind:a.kind}; }); },start:startLevel};
  intro();
})();
