<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>learningenglishfun · Feedback</title>
<style>
:root{--ink:#26372e;--muted:#718077;--line:#dfe8e1;--green:#315f47;--shadow:0 18px 42px rgba(46,66,55,.12)}
*{box-sizing:border-box}body{margin:0;background:#f5f7f4;color:var(--ink);font-family:ui-rounded,"Trebuchet MS",Arial,sans-serif;padding:24px}
.wrap{max-width:820px;margin:0 auto}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 24px}
.card{background:#fff;border-radius:18px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:14px}
.card .msg{font-size:1rem;line-height:1.5;white-space:pre-wrap;margin:0 0 10px}
.card .meta{display:flex;flex-wrap:wrap;gap:10px;font-size:.78rem;color:var(--muted)}
.card .meta span{background:#f1f4f1;border-radius:999px;padding:4px 10px}
.err{background:#fff0ee;color:#b23b34;border-radius:12px;padding:14px;margin-bottom:16px}
.muted{color:var(--muted)}
button{border:0;background:var(--green);color:#fff;border-radius:10px;padding:9px 16px;font-weight:800;cursor:pointer}
input[type=email]{border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:.92rem;width:220px}
form{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border-radius:18px;padding:18px 20px;box-shadow:var(--shadow)}
</style></head>
<body><div class="wrap">
<h1>💬 Feedback</h1>
<p class="sub">Only visible to the site owner (signed in with the right email). Unlisted page — bookmark this URL.</p>
<div id="content">Loading…</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(function(){
  var el = document.getElementById("content");
  var cfg = window.SUPABASE_CONFIG;
  var configured = window.supabase && cfg && cfg.url && cfg.anonKey &&
    cfg.url.indexOf("YOUR-PROJECT")===-1 && cfg.anonKey.indexOf("YOUR-ANON-KEY")===-1;
  if(!configured){
    el.innerHTML = '<div class="err">Supabase 还没配置，没有数据可看。</div>';
    return;
  }
  var sb = window.__lesSupabaseClient || (window.__lesSupabaseClient = window.supabase.createClient(cfg.url, cfg.anonKey));

  function escapeHtml(s){
    return (s||"").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function renderLogin(){
    el.innerHTML =
      '<form id="loginForm">' +
      '<input id="loginEmail" type="email" placeholder="your email" required>' +
      '<button type="submit">Sign in</button>' +
      '<span id="loginMsg" class="muted" style="width:100%;font-size:.82rem"></span>' +
      '</form>';
    document.getElementById("loginForm").addEventListener("submit", async function(e){
      e.preventDefault();
      var email = document.getElementById("loginEmail").value.trim();
      var msg = document.getElementById("loginMsg");
      msg.textContent = "Sending link…";
      var res = await sb.auth.signInWithOtp({ email: email, options: { emailRedirectTo: window.location.href } });
      msg.textContent = res.error ? "Error: " + res.error.message : "Check your email for a sign-in link ✉️";
    });
  }

  async function renderFeedback(session){
    el.innerHTML = 'Loading… <button id="signOut" style="float:right">Sign out</button>';
    document.getElementById("signOut").onclick = function(){ sb.auth.signOut(); };
    var res = await sb.rpc("get_all_feedback");
    if(res.error){
      el.innerHTML = '<div class="err">加载失败：' + escapeHtml(res.error.message) + '</div>';
      return;
    }
    var rows = res.data || [];
    if(!rows.length){
      el.innerHTML = '<p class="muted">No feedback yet.</p><button id="signOut2">Sign out</button>';
      document.getElementById("signOut2").onclick = function(){ sb.auth.signOut(); };
      return;
    }
    el.innerHTML =
      '<div style="text-align:right;margin-bottom:12px"><button id="signOut3">Sign out (' + escapeHtml(session.user.email) + ')</button></div>' +
      rows.map(function(r){
        var when = r.created_at ? new Date(r.created_at).toLocaleString() : "";
        return '<div class="card"><p class="msg">' + escapeHtml(r.message) + '</p>' +
          '<div class="meta">' +
          '<span>🕓 ' + when + '</span>' +
          (r.email ? '<span>✉️ ' + escapeHtml(r.email) + '</span>' : '') +
          (r.page_title ? '<span>📄 ' + escapeHtml(r.page_title) + '</span>' : '') +
          '</div></div>';
      }).join("");
    document.getElementById("signOut3").onclick = function(){ sb.auth.signOut(); };
  }

  sb.auth.onAuthStateChange(function(event, session){
    if(session) renderFeedback(session); else renderLogin();
  });
  document.addEventListener("DOMContentLoaded", async function(){
    var session = (await sb.auth.getSession()).data.session;
    if(session) renderFeedback(session); else renderLogin();
  });
})();
</script>
</body></html>
