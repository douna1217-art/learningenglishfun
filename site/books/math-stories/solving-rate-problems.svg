<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520"><rect x="0" y="0" width="700" height="520" fill="#eef8de" stroke="none" stroke-width="1.5"/><rect x="0" y="379" width="700" height="140" fill="#fff8e6" stroke="none" stroke-width="1.5"/><text x="350" y="120" text-anchor="middle" font-family="'DejaVu Sans Mono',Menlo,monospace" font-size="26" font-weight="800" fill="#2b2f45">$18 for 6 yards of ribbon</text><text x="350" y="172" text-anchor="middle" font-family="'DejaVu Sans Mono',Menlo,monospace" font-size="26" font-weight="800" fill="#2b2f45">$18 ÷ 6 = $3 per yard</text><text x="350" y="224" text-anchor="middle" font-family="'DejaVu Sans Mono',Menlo,monospace" font-size="26" font-weight="800" fill="#2b2f45">15 yards → 15 × $3 = $45</text><text x="350.0" y="437" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="900" fill="#2b2f45">Find the unit rate, then scale to the amount you need</text></svg>