<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520"><rect x="0" y="0" width="700" height="520" fill="#eef8de" stroke="none" stroke-width="1.5"/><rect x="0" y="379" width="700" height="140" fill="#fff8e6" stroke="none" stroke-width="1.5"/><text x="175" y="190" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800" fill="#2b2f45">&quot;add 8 and 2,</text><text x="175" y="220" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="800" fill="#2b2f45">then multiply by 3&quot;</text><text x="525" y="205" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="900" fill="#4a8a3a">3 × (8 + 2)</text><line x1="350" y1="70" x2="350" y2="360" stroke="#cbb8a8" stroke-width="2" stroke-dasharray="6 6"/><text x="350" y="60" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800" fill="#6b6656">words  →  symbols</text><text x="350.0" y="437" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="900" fill="#2b2f45">Say it in words, then write it with symbols</text></svg>