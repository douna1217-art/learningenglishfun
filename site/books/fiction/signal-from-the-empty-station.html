<script>

const pages=[{"type": "cover", "title": "Signal From the Empty Station", "subtitle": "A Repeating Message From an Abandoned Desert Station May Be Warning or Invitation", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/signal-from-the-empty-station-assets/cover.jpg"}, {"text": "1. The Message With No Words\nAt the school field camp, Imani's scanner caught three low pulses and one high pulse every sunset. The pattern came from an abandoned solar station beyond the marked trail.\nLuis called it a distress signal. Dr. Sato noted that no people had worked there for twelve years. A repeated pattern could be a warning, a machine test, or something the listeners had not imagined.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/signal-from-the-empty-station-assets/page1.jpg"}, {"text": "2. Evidence in the Silence\nThey received permission to inspect the site in daylight. Dust covered the control room, yet one battery remained charged. Orange flags around the tower had faded almost white.\nLuis found no footprints. Imani found tortoise tracks beneath a loose cable. The station was empty of people, but not empty of causes.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/signal-from-the-empty-station-assets/page2.jpg"}, {"text": "3. A Pattern That Moved\nAt sunset, the signal began again, but its direction shifted as mirrored dishes turned toward the cooling sky. Imani plotted each pulse with colored stones. The source moved from the tower to the cracked water tank.\nA true broadcast should not wander that way. Luis suggested the dishes were reflecting a signal from somewhere else. They rotated one mirror, and the final pulse disappeared.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/signal-from-the-empty-station-assets/page3.jpg"}, {"text": "4. The Machine That Listened Back\nInside the tank, a sensor measured tiny vibrations. Cooling metal made three slow creaks; a loose cable struck once with a sharper note. The solar system converted those sounds into maintenance pulses.\nThe station was not sending a prepared message. It was translating its own condition. The pattern meant something was changing, but meaning still depended on interpretation.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/signal-from-the-empty-station-assets/page4.jpg"}, {"text": "5. The Warning Hidden in Routine\nDr. Sato found the old system diagram. The high pulse indicated sudden strain, not ordinary cooling. A support beneath the tank had shifted after recent storms.\nThe signal had repeated for weeks because the strain returned every evening. What sounded routine was evidence of a problem precisely because it stayed consistent.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/signal-from-the-empty-station-assets/page5.jpg"}, {"text": "6. A Repair Without Erasing the Clue\nEngineers stabilized the support, but Imani asked them to leave the sensor active. If the pulse vanished, they would know the repair had changed the strain rather than merely hiding the broadcast.\nThat evening, three low pulses remained and the high one did not. Luis admitted he had wanted a dramatic rescue. The quieter explanation had still prevented damage.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/signal-from-the-empty-station-assets/page6.jpg"}, {"text": "7. The Station Was Never Empty\nThe class reopened the site as a listening station. Sensors tracked wind, metal, soil, and water while students compared patterns over time. They placed the orange flags farther from the tortoise path.\nImani no longer called the original pulse a message from nowhere. It came from heat, stress, design, and an animal brushing a cable. The station had seemed empty only when they counted human voices as the only voices worth hearing.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/signal-from-the-empty-station-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What pattern did Imani's scanner detect every sunset?", "choices": ["Three low pulses and one high pulse, coming from an abandoned solar station", "Human voices calling for help", "A single continuous tone with no pattern"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Imani's scanner caught three low pulses and one high pulse every sunset, coming from a solar station that had been abandoned for twelve years."}, {"q": "What did Luis and Imani find at the empty station?", "choices": ["Clear signs that people were still working there", "Nothing at all; the station was completely bare", "No footprints, but tortoise tracks beneath a loose cable, and one still-charged battery"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Luis found no footprints, but Imani found tortoise tracks beneath a loose cable, and one battery remained charged despite the dust."}, {"q": "What did rotating one mirror reveal about the signal?", "choices": ["The dishes were reflecting a signal, since the final pulse disappeared when a mirror moved", "Nothing changed when they rotated the mirror", "The signal came from a person hiding nearby"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "When they rotated one mirror, the final pulse disappeared, confirming Luis's idea that the dishes were reflecting the signal, not broadcasting it directly."}, {"q": "What was actually creating the pulse pattern inside the tank?", "choices": ["A hidden radio transmitter left behind by workers", "Nothing; the pattern was completely random", "A sensor converting cooling metal creaks and a loose cable strike into maintenance pulses"], "answer": 2, "evidencePage": 4, "hint": "Look at page 4.", "explain": "A sensor inside the tank measured tiny vibrations — cooling metal creaks and a cable strike — and converted them into the pulse pattern."}, {"q": "What did the high pulse actually indicate, according to the old system diagram?", "choices": ["Nothing important; it was just background noise", "Sudden strain from a support that had shifted after recent storms, not ordinary cooling", "A message specifically meant for human visitors"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Dr. Sato found that the high pulse indicated sudden strain from a shifted support, not the ordinary cooling sounds the low pulses represented."}], "grammar": [{"q": "'___ the pulse vanished, they would know the repair had changed the strain.' Which word introduces a condition?", "choices": ["If", "Although", "Because"], "answer": 0, "evidencePage": 6, "hint": "This word introduces a condition for what might happen.", "explain": "'If' introduces the condition: whether the pulse vanished would tell them whether the repair worked.", "teach": "<b>If</b> introduces a <b>condition</b> for what might happen.<span class='cn'><b>if</b> 用来引出可能发生的<b>条件</b>。</span>"}, {"q": "'The station was empty of people, ___ not empty of causes.' Which word shows contrast?", "choices": ["but", "so", "and"], "answer": 0, "evidencePage": 2, "hint": "This word shows the second idea is different from what you might expect.", "explain": "'But' shows contrast: no people were there, yet something was still causing the signal.", "teach": "<b>But</b> joins two ideas that are <b>different or surprising together</b>.<span class='cn'><b>but</b>用来连接两个<b>不同或令人意外</b>的想法。</span>"}, {"q": "Which sentence correctly punctuates an introductory phrase?", "choices": ["At, sunset the signal began again, but its direction shifted.", "At sunset the signal, began again, but its direction shifted.", "At sunset, the signal began again, but its direction shifted."], "answer": 2, "evidencePage": 3, "hint": "A comma follows an introductory phrase before the main sentence begins.", "explain": "The comma correctly separates the introductory phrase 'At sunset' from the main sentence.", "teach": "<b>A comma</b> follows an <b>introductory phrase</b> before the main sentence begins.<span class='cn'><b>逗号</b>用在<b>引导性短语</b>之后，主句开始之前。</span>"}], "vocabulary": [{"q": "'Vibrations' means ___.", "choices": ["bright flashes of light", "small, rapid shaking movements", "loud spoken messages"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "A sensor inside the tank measured tiny vibrations — small shaking movements — caused by cooling metal and a loose cable."}, {"q": "'Interpretation' means ___.", "choices": ["a type of solar-powered machine", "a way of understanding or explaining something", "a written record of repairs"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "The pattern meant something was changing, but its full meaning still depended on interpretation — how the listeners understood it."}, {"q": "'Routine' means ___.", "choices": ["a broken or damaged machine", "a regular, repeated pattern of activity", "a sudden, one-time event"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "What sounded routine — a regular repeated pattern — was actually evidence of a real problem, precisely because it stayed so consistent."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};

const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(vibrations|interpretation|routine)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 6 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}
