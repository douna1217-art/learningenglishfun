<script>/*les-speech-shim*/
(function(){var w=window,ok=false,errs=[];
/* Some Android in-app browsers (UC/Quark and other vendor kernels, older WebViews) have no
   speechSynthesis at all. The page script calls it while loading, so it stopped there and the
   story was never drawn (the quiz still worked because its handlers were bound earlier).
   Give such browsers a silent stand-in so the rest of the page runs normally. */
try{ok=typeof w.speechSynthesis==="object"&&w.speechSynthesis!==null}catch(e){}
if(typeof w.SpeechSynthesisUtterance!=="function"&&typeof w.SpeechSynthesisUtterance!=="object"){
w.SpeechSynthesisUtterance=function(t){this.text=t==null?"":String(t);this.lang="";this.rate=1;this.pitch=1;this.volume=1;this.voice=null}}
if(!ok){var gen=0,told=false;
w.speechSynthesis={speaking:false,paused:false,pending:false,
getVoices:function(){return[]},cancel:function(){gen++},pause:function(){},resume:function(){},
addEventListener:function(){},removeEventListener:function(){},
speak:function(u){var g=gen;
if(!told&&typeof w.setStatus==="function"){told=true;try{w.setStatus("This browser can't read aloud, but you can still read and practice. 当前浏览器不支持朗读，仍可阅读和做题。",false)}catch(e){}}
setTimeout(function(){if(g===gen&&u&&u.onstart){try{u.onstart({})}catch(e){}}},0);
setTimeout(function(){if(g===gen&&u&&u.onend){try{u.onend({})}catch(e){}}},Math.max(600,String(u&&u.text||"").length*60))}}}
/* If the story still is not drawn after loading, say why on the page itself, so a screenshot

<script>

const pages=[{"type": "cover", "title": "The Robot Who Asked for Tuesday", "subtitle": "A Library Robot Asks for Two Free Hours, and Rae Learns to Answer the Question He Really Asked", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-robot-who-asked-for-tuesday-assets/cover.jpg"}, {"text": "1. A Space on the Calendar\nIn the library where Rae volunteered, robots could choose their own activities and ask for days away from work. Bram had never asked. He sorted the new books every Tuesday, finding damaged pages and puzzling out labels that even the librarian had trouble reading. His wheels made a soft clicking sound at the turn beside the history shelf. Rae knew that sound as well as she knew the closing bell.\nOne Friday, Bram rolled beside her as she opened the weekly calendar on her tablet. He asked for Tuesday afternoon. Rae was helping Ms. Abel organize the week's schedule, so she opened the list of training courses. There was a repair workshop across town. She was halfway through suggesting it when Bram raised one metal hand. “I didn't ask you to find me more work,” he said.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-robot-who-asked-for-tuesday-assets/page1.jpg"}, {"text": "2. A Very Practical Suggestion\nRae looked up. Bram's little eyes glowed the same calm teal as always. She had thought the workshop sounded interesting. He was good at repairing things, and the course would make him even better. “It might be useful,” she said. “Yes,” Bram replied. “Useful for the library.” He waited while she closed the training page. Rae began to understand that she had answered a different question from the one he had asked.\nMs. Abel came over to check the schedule. She asked how long he needed. “Two hours,” Bram said. “At the community studio.” Rae pictured a laboratory with metal tables and shelves of tools. Then he showed them a paper flyer. Across the front was a photograph of a crooked clay bowl. Rae turned it over, looking for the part about repairing something.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-robot-who-asked-for-tuesday-assets/page2.jpg"}, {"text": "3. The Thing He Wanted to Try\n“Pottery?” she asked. Bram nodded. The class was for beginners. He had never made a pot from a lump of clay. Rae knew that he could measure a circle more accurately than anyone she had met. She offered to help him find a program that would guide his hands. He lowered the flyer. “I want to find out what my hands do without the program,” he said.\nRae imagined him coming back with a perfect bowl while the other beginners struggled. “What if you're already good at it?” she asked. “Then I'll make a bowl.” “And if you're bad at it?” Bram's wheels clicked as he turned toward the returning-book cart. “Then I'll make something else.” He sounded so pleased by both answers that Rae had no idea which result he hoped for.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-robot-who-asked-for-tuesday-assets/page3.jpg"}, {"text": "4. Covering Two Hours\nThe difficult part wasn't the pottery. It was Tuesday's new-book delivery. Rae offered to handle all of it, partly because she wanted to prove the library could spare him. Ms. Abel shook her head. “You have schoolwork too. We'll make a plan that doesn't depend on one person doing everything.” She divided the tasks between herself, Rae's short volunteer shift, and another volunteer who already came on Tuesdays.\nBram showed them where he noted loose pages and how he separated books with unclear labels. Rae had thought sorting meant putting things in alphabetical order. There were decisions hidden inside the task, small ones he usually made without anyone noticing. She wrote down the questions she should bring to Ms. Abel. Bram watched her close the notebook. “Will that do?” he asked. The librarian confirmed that it would.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-robot-who-asked-for-tuesday-assets/page4.jpg"}, {"text": "5. Tuesday Without the Click\nOn Tuesday, the corner beside the history shelf stayed quiet. Rae began with the easy labels, then found a book whose title was almost hidden by an old sticker. She started to call Bram before remembering. Instead, she set it in the tray for questions. Ms. Abel came over between helping visitors. They worked out where it belonged, and the next book was easier.\nThey didn't finish every task before Rae's shift ended. The remaining books stayed safely on the cart for the next volunteer. That bothered her until Ms. Abel pointed to the schedule. They had allowed for exactly that. Nothing needed to be solved by asking Bram to abandon his afternoon. Rae put away her notebook. She wondered whether his first pot was turning out the way he had imagined.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-robot-who-asked-for-tuesday-assets/page5.jpg"}, {"text": "6. Something That Leaned\nBram returned after the class carrying a small wooden board. On it sat a gray clay pot with one side higher than the other. A thumbprint marked the rim. Rae caught herself preparing to suggest a way to straighten it. “May I look?” she asked instead. Bram set the board on the table. The clay was still soft, so she kept her hands beside it. Bram would take it back to the studio to be fired.\n“Did the teacher tell you to make it that shape?” she asked. “No. I pressed too hard here.” He pointed without touching. “Then I liked the way the edge leaned.” Rae studied the crooked rim. She couldn't tell whether it was a mistake or a choice anymore. Bram described how the clay had felt under his fingers. He hadn't mentioned a single measurement. He had already booked another class.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-robot-who-asked-for-tuesday-assets/page6.jpg"}, {"text": "7. The Next Tuesday\nThe following week, the studio returned the finished pot. Its glaze was pale blue, and its rim still leaned. Ms. Abel offered Bram a place on the windowsill for it. Rae nearly filled it with the pencils from the desk. Then she asked whether he wanted them there. “Not yet,” he said. “I want to see the shape for a while.” She left the pencils where they were.\nWhen they checked the next week's calendar, Bram asked for the same two hours. Rae opened the schedule, not the training list. She asked whether he needed any change in the coverage plan. He said no. Later, she noticed sunlight resting inside the empty blue pot. She stood beside it for a moment before returning to the cart. The pot wasn't holding anything the library needed. She was glad it was there.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-robot-who-asked-for-tuesday-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did Bram ask for?", "choices": ["A longer shift on Tuesdays", "A new set of wheels", "Tuesday afternoon off, for two hours"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Bram asked for Tuesday afternoon, and later said he needed two hours."}, {"q": "What did Rae wrongly assume Bram wanted?", "choices": ["A day to rest", "A training course that would make him better at library work", "A new job at the repair workshop"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Rae suggested a repair workshop, but Bram said, “I didn’t ask you to find me more work.”"}, {"q": "What did Bram want to find out in the pottery class?", "choices": ["How to measure a perfect circle", "How to fix broken pots", "What his hands could do without a program"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "He said, “I want to find out what my hands do without the program.”"}, {"q": "How did Ms. Abel cover Bram’s Tuesday tasks?", "choices": ["She asked Rae to do all of them", "She shared them between herself, Rae, and another volunteer", "She left them for Wednesday"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Ms. Abel divided the tasks among herself, Rae’s short shift, and another volunteer, so no one person did everything."}, {"q": "What did Bram like about his first pot?", "choices": ["The way its edge leaned", "That it matched his measurements", "That it was perfectly round"], "answer": 0, "evidencePage": 6, "hint": "Look at page 6.", "explain": "He had pressed too hard, and then he liked the way the edge leaned."}], "grammar": [{"q": "‘Bram would make either a bowl ___ something else.’ Which word completes the pair?", "choices": ["and", "or", "nor"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "The pair that goes with “either” is “or”.", "teach": "<b>Either</b> is paired with <b>or</b> to show a choice between two things, like <b>either a bowl or a cup</b>.<span class='cn'><b>either</b> 和 <b>or</b> 搭配使用，表示在两者中选一个，比如 <b>either a bowl or a cup</b>。</span>"}, {"q": "Which sentence uses a comma correctly after ‘yes’?", "choices": ["Yes. I would like, to look at it.", "Yes I would, like to look at it.", "Yes, I would like to look at it."], "answer": 2, "evidencePage": 6, "hint": "Look at page 6.", "explain": "A comma goes right after the word “yes” at the start of a sentence.", "teach": "Put a comma after <b>yes</b> or <b>no</b> at the start of a sentence, like <b>Yes, I can.</b><span class='cn'>句子开头的 <b>yes</b> 或 <b>no</b> 后面要加逗号，比如 <b>Yes, I can.</b></span>"}, {"q": "‘Bram returned carrying a small wooden board.’ Which meaning of ‘board’ is used?", "choices": ["a group of people who run a company", "a flat piece of wood", "to get on a train"], "answer": 1, "evidencePage": 6, "hint": "Look at page 6.", "explain": "Clay was sitting on the board, so it means a flat piece of wood.", "teach": "Many words have more than one meaning, so use the other words in the sentence, like <b>wooden</b>, to find the right one.<span class='cn'>很多词有不止一个意思，要根据句子里的其他词，比如 <b>wooden</b>（木制的），来判断是哪个意思。</span>"}], "vocabulary": [{"q": "‘Volunteered’ means ___.", "choices": ["offered to work without being paid", "refused to help", "was told to work"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "In the library where Rae volunteered, robots could choose their own activities."}, {"q": "‘Accurately’ means ___.", "choices": ["in a way that is exactly correct", "in a hurry", "in a careless way"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Rae knew that he could measure a circle more accurately than anyone she had met."}, {"q": "‘Glaze’ means ___.", "choices": ["a shiny coating on pottery", "a tool for shaping bowls", "a kind of clay"], "answer": 0, "evidencePage": 7, "hint": "Look at the last page.", "explain": "The studio returned the finished pot, and its glaze was pale blue."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(volunteered|accurately|glaze)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 5 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();setListenActive(null);page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}
function selectAnswer(i){selections[activeTab+"-"+qIndex[activeTab]]=i;renderPanel()}
function showHint(){const item=quizzes[activeTab][qIndex[activeTab]];document.getElementById("feedback").innerHTML=`💡 ${item.hint}`}
function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}var TEACH_ICONS='<svg class="ic i-spk" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.5v5h3.6l4.9 4.5V5L7.6 9.5H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.6 9.2a4 4 0 010 5.6M18.2 6.6a7.6 7.6 0 010 10.8"/></svg><svg class="ic i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></svg><svg class="ic i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 5.3v13.4c0 .8.9 1.3 1.6.8l9.6-6.7c.6-.4.6-1.2 0-1.6L9.8 4.5c-.7-.5-1.6 0-1.6.8z"/></svg>';var _tp=null;function _tpSet(b,st){if(!b)return;b.classList.toggle('is-playing',st==='playing');b.classList.toggle('is-paused',st==='paused');b.setAttribute('aria-pressed',st==='playing'?'true':'false');var z=b.dataset.part==='cn',L=st==='playing'?(z?'\u6682\u505C':'Pause'):st==='paused'?(z?'\u7EE7\u7EED\u64AD\u653E':'Resume'):b.dataset.label;b.setAttribute('aria-label',L);b.title=L;}function stopTeachAudio(){var c=_tp;if(!c)return;_tp=null;try{if(c.audio){c.audio.onended=c.audio.onerror=c.audio.ontimeupdate=null;c.audio.pause();}}catch(e){}if(c.mode==='tts'){try{speechSynthesis.cancel();}catch(e){}}_tpSet(c.btn,'idle');}function _tpFallback(btn){try{var u=new SpeechSynthesisUtterance(btn.dataset.text||'');u.lang=btn.dataset.lang||'en-US';var cur={btn:btn,mode:'tts'};_tp=cur;u.onend=u.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');}};_tpSet(btn,'playing');speechSynthesis.speak(u);}catch(e){}}function playTeachAudio(btn){if(_tp&&_tp.btn===btn){if(_tp.mode==='audio'){var a0=_tp.audio;if(a0.paused){var p0=a0.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}
function returnToQuestion(){(function(){var b=document.getElementById("evidenceBanner");if(b&&b.parentNode)b.parentNode.removeChild(b);})();renderPanel();document.querySelector(".panel").scrollIntoView({behavior:"smooth",block:"start"})}
function nextQuestion(){const list=quizzes[activeTab];if(qIndex[activeTab]<list.length-1){qIndex[activeTab]++;renderPanel();return}completed[activeTab]=true;if(activeTab==="comprehension")activeTab="grammar";else if(activeTab==="grammar")activeTab="vocabulary";else{return showCompletion()}setTabs();renderPanel()}
function showCompletion(){completed.vocabulary=true;setTabs();const correct=Object.keys(selections).filter(k=>{const [tab,idx]=k.split('-');return selections[k]===quizzes[tab][+idx].answer}).length,total=Object.values(quizzes).reduce((a,b)=>a+b.length,0);document.getElementById("stagePill").textContent="Journey Complete";document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">Reading journey complete</div><h2>Wonderful work! 🎉</h2><p class="small">You finished Reading, Grammar, and Vocabulary.</p><div class="score-row"><div class="score-box"><b>${total}</b><br><span>Questions</span></div><div class="score-box"><b>${correct}</b><br><span>Correct now</span></div></div><div class="feedback good">You used evidence, practiced sentence skills, and learned new words.</div><button class="submit" onclick="restartPractice()">Practice Again</button></div>`}
function restartPractice(){activeTab="comprehension";qIndex={comprehension:0,grammar:0,vocabulary:0};selections={};attempts={};completed={comprehension:false,grammar:false,vocabulary:false};setTabs();renderPanel()}
function saveProgress(){try{localStorage.setItem("les-the-robot-who-asked-for-tuesday-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-robot-who-asked-for-tuesday"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-robot-who-asked-for-tuesday",bookTitle:"The Robot Who Asked for Tuesday",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}
function clearHighlight(){document.querySelectorAll(".story-word.reading").forEach(x=>x.classList.remove("reading"))}
let preferredVoice=null;

<script>/*les-button-layout-js*/
