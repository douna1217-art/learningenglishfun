<script>

const pages=[{"type": "cover", "title": "The Gravity Garden", "subtitle": "On the Moon, Even a Familiar Seed Can Teach a New Way to Grow.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-gravity-garden-assets/cover.jpg"}, {"text": "1. Vines That Would Not Climb\nNoor expected the bean vines to wrap neatly around the tower before the Moonbase Garden Festival. Instead, they drifted sideways in pale green loops. Inside the sealed greenhouse, their roots were anchored in moist growth material, but the shoots ignored the tall support Noor had designed.\nShe pushed off the floor too quickly and rose in a slow, low-gravity hop. Dr. Okoye steadied the watering cart and reminded her that lunar gravity was about one-sixth as strong as Earth's. “Your beans are not misbehaving,” the botanist said. “They are responding to this place.” Noor stared at her useless tower.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-gravity-garden-assets/page1.jpg"}, {"text": "2. Looking for Up\nNoor compared the sideways vines with photographs from the Earth greenhouse. There, gravity and light helped shape familiar growth. On the Moon, gravity still existed, but it was weaker. The greenhouse lights also shifted during the day to reach different plant beds.\nShe marked the direction of each shoot at morning, midday, and evening. The newest tips curved toward the brightest light more strongly than they followed the tower. A vine near the wall even bent in a smooth arc when a light panel changed angle. Noor stopped blaming the seeds. Her design had assumed that every plant would find “up” the way she expected.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-gravity-garden-assets/page2.jpg"}, {"text": "3. The Wrong Kind of Straight\nHer first repair was to make the tower taller. The vines still missed it. Her second was to tie every stem tightly, but Dr. Okoye warned that growing stems needed room and gentle support. Noor removed the ties before they caused harm.\nAcross the greenhouse, flexible cucumber guides formed a wide web instead of one straight pole. Noor watched a tendril curl around the nearest strand. The web did not demand one correct direction, but it offered many safe paths. She sketched a bowl-shaped trellis that could meet vines wherever the light led them.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-gravity-garden-assets/page3.jpg"}, {"text": "4. A Trellis for This Place\nUsing lightweight rods and soft plant clips, Noor built a wide spiral bowl. Dr. Okoye checked every connection so no loose piece could float into the greenhouse fans. Together they positioned the trellis beneath the path of the moving lights.\nNoor guided only the longest vines, leaving the growing tips free. Over several days, the shoots reached new strands and began curling around them. The result did not look like the straight green tower in Noor's original drawing. It looked like a bright, living galaxy. More importantly, it worked.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-gravity-garden-assets/page4.jpg"}, {"text": "5. The Light Shift\nTwo days before the festival, a maintenance schedule changed the angle of one light panel. Several vine tips turned toward the new beam. Noor's stomach tightened. Then she noticed that the wide trellis already extended into that area. She moved two soft clips, recorded the change, and watched the plants continue growing.\nHer old tower had one plan, but the new trellis could respond when conditions changed. Noor added a second observation window for festival visitors. She wanted them to see not only the finished garden, but also the measurements, failed tower, and revised design that had made it possible.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-gravity-garden-assets/page5.jpg"}, {"text": "6. Festival Under Glass\nFamilies entered the greenhouse in careful lines. Beyond the thick windows, the Moon's gray ground stretched toward a black sky. Inside, Noor's bean vines looped through the spiral bowl. A visitor asked why the plants had not simply grown straight upward.\nNoor pointed to her time-lapse images. She explained that the story was science fiction because this Moonbase did not exist, but its garden used real ideas: the Moon's weaker gravity, plants' responses to light, and the need for enclosed life-support systems. “The setting changed the problem,” she said, “so the design had to change too.”", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-gravity-garden-assets/page6.jpg"}, {"text": "7. A New Definition of Up\nAfter the festival, Noor harvested the first crisp bean pod with Dr. Okoye. It was smaller than the one pictured on the seed packet, yet it held four firm seeds. Noor saved them for the next trial and wrote a question about whether their vines would follow the same paths.\nShe dismantled the tall tower but kept one straight rod above her desk. It reminded her that a good design on Earth could become the wrong design somewhere else. Outside the window, Earth hung blue and distant. Noor smiled. “Up” was not one line. It depended on where you stood—and where you were willing to look.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-gravity-garden-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did Noor expect the bean vines to do?", "choices": ["Wrap neatly around the tower she designed", "Grow underground", "Stay exactly the same size forever"], "answer": 0, "evidencePage": 1, "hint": "Look at chapter 1.", "explain": "Noor expected the bean vines to wrap neatly around the tower before the festival."}, {"q": "According to Dr. Okoye, why were the beans growing sideways?", "choices": ["The seeds were planted incorrectly", "They were responding to the Moon's weaker gravity and the shifting greenhouse lights", "The greenhouse had no gravity at all"], "answer": 1, "evidencePage": 2, "hint": "Look at chapter 2.", "explain": "Lunar gravity was weaker, and the greenhouse lights also shifted to reach different plant beds."}, {"q": "What did Noor build instead of a straight tower?", "choices": ["An even taller pole", "A completely enclosed box", "A wide spiral bowl trellis with flexible guides"], "answer": 2, "evidencePage": 4, "hint": "Look at chapter 4.", "explain": "Noor built a wide spiral bowl using lightweight rods and soft plant clips."}, {"q": "What happened when the light panel's angle changed before the festival?", "choices": ["Noor moved two soft clips, and the plants continued growing on the trellis", "The whole garden died", "Nothing needed to change at all"], "answer": 0, "evidencePage": 5, "hint": "Look at chapter 5.", "explain": "Noor moved two soft clips, recorded the change, and watched the plants continue growing."}, {"q": "What is the big idea of this story?", "choices": ["Plants always grow the same way no matter where they are", "A good design never needs to change", "On the Moon, even a familiar seed can teach a new way to grow"], "answer": 2, "evidencePage": 7, "hint": "Look at the last chapter.", "explain": "“Up” was not one line—it depended on where you stood."}], "grammar": [{"q": "“The web did not demand one correct direction, ___ it offered many safe paths.” Which word shows contrast?", "choices": ["but", "so", "because"], "answer": 0, "evidencePage": 3, "hint": "This word contrasts not demanding one direction with offering many paths.", "explain": "“But” contrasts the rigid single-direction idea with the flexible web offering many paths.", "teach": "<b>But</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>but</b>(但是)表示两个事实之间的<b>对比</b>。</span>"}, {"q": "“Her old tower had one plan, ___ the new trellis could respond when conditions changed.” Which word shows contrast?", "choices": ["so", "but", "because"], "answer": 1, "evidencePage": 5, "hint": "This word contrasts the rigid old tower with the adaptable new trellis.", "explain": "“But” contrasts the old tower's single fixed plan with the trellis's ability to respond.", "teach": "<b>But</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>but</b>(但是)表示两个事实之间的<b>对比</b>。</span>"}, {"q": "“The setting changed the problem, ___ the design had to change too.” Which word shows the result?", "choices": ["but", "because", "so"], "answer": 2, "evidencePage": 6, "hint": "This word shows what happened as a result.", "explain": "“So” shows the design changing was a result of the setting changing the problem.", "teach": "<b>X, so Y</b> shows Y is a <b>result</b> of X.<span class='cn'><b>so</b>(所以)表示Y是X的<b>结果</b>。</span>"}], "vocabulary": [{"q": "‘Gravity’ means ___.", "choices": ["the force that pulls objects toward the ground or a large body like a moon or planet", "a type of light panel", "a type of greenhouse"], "answer": 0, "evidencePage": 1, "hint": "Look at chapter 1.", "explain": "Lunar gravity was about one-sixth as strong as Earth's."}, {"q": "‘Trellis’ means ___.", "choices": ["a type of seed packet", "a frame that supports climbing plants as they grow", "a type of watering cart"], "answer": 1, "evidencePage": 4, "hint": "Look at chapter 4.", "explain": "Noor built a wide spiral bowl trellis for the bean vines to climb."}, {"q": "‘Design’ means ___.", "choices": ["a random accident with no plan", "a type of gravity", "a plan for how something should be built or made"], "answer": 2, "evidencePage": 3, "hint": "Look at chapter 3.", "explain": "Noor sketched a bowl-shaped trellis design that could meet vines wherever the light led them."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(gravity|trellis|design)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 4 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function saveProgress(){try{localStorage.setItem("les-the-gravity-garden-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-gravity-garden"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-gravity-garden",bookTitle:"The Gravity Garden",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.
