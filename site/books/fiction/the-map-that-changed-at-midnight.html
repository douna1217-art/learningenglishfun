<script>

const pages=[{"type": "cover", "title": "The Map That Changed at Midnight", "subtitle": "The City Moved When Its Mapmaker Stopped Drawing Only the Roads She Understood", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-map-that-changed-at-midnight-assets/cover.jpg"}, {"text": "1. A Map That Refused to Stay Still\nLeena had copied every street in Luma exactly as Master Orin taught her. On the night before her apprentice test, she finished the map, locked the workshop, and waited for the ink to dry.\nAt midnight, silver lines wriggled across the parchment. A bridge slid east. An alley curled like a waking cat. Then a new route appeared through open water where no road had ever been.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-map-that-changed-at-midnight-assets/page1.jpg"}, {"text": "2. The Route Across Water\nLeena followed the new line to the canal and found Tomas tying a paper boat to a post. He delivered medicine and bread to families whose streets were blocked by repairs. The official map showed no useful route to them.\nThe silver path traced Tomas's boat journey beneath three low bridges. Leena had drawn streets as if everyone moved on foot. The map had added a road made of water because her picture of the city was incomplete.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-map-that-changed-at-midnight-assets/page2.jpg"}, {"text": "3. The Staircase That Became a Wall\nFarther on, the map marked the tower stairs as a thick black barrier. Leena insisted stairs were a route. Tomas pointed to a baker waiting below with a wheeled cart and no ramp.\nTo Leena, the staircase climbed like a ribbon. To the baker, it stood like a locked gate. The map was not only changing places; it was changing point of view, revealing how the same stone could invite one traveler and stop another.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-map-that-changed-at-midnight-assets/page3.jpg"}, {"text": "4. The Compass Points to a Voice\nThe moon-shaped compass did not point north. It turned toward a night gardener who crossed courtyards through unlocked gates, then toward a child who knew which covered walkway stayed dry in rain.\nEach person carried a map made from experience. Leena listened and drew their routes in blue. With every addition, the parchment widened at its edges, as though the city had been holding its breath and could finally exhale.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-map-that-changed-at-midnight-assets/page4.jpg"}, {"text": "5. Master Orin's Straight Line\nBack at the workshop, Master Orin saw the crowded map and reached for his straightedge. He said a proper map must be simple. Leena almost erased the winding routes to please him.\nThen the paper boat sailed across the parchment and stopped at the blank district beyond the tower. Leena asked whose simplicity the map protected. Orin lowered the straightedge. He had taught precision, but precision without enough perspectives could preserve an error.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-map-that-changed-at-midnight-assets/page5.jpg"}, {"text": "6. The Test Changes\nInstead of judging Leena's map by neatness alone, Orin walked the city with both apprentices. They tested the water route, measured a possible ramp, and asked residents which paths changed after dark.\nSome silver lines vanished because they were unsafe. Others remained. The map did not accept every suggestion as truth; it invited questions, evidence, and revision. Its magic was not knowing everything. Its magic was refusing to pretend it did.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-map-that-changed-at-midnight-assets/page6.jpg"}, {"text": "7. A City Drawn by Many Hands\nAt the next midnight, the map shifted once more. This time Leena did not chase every moving line. She opened the workshop doors and placed the blue ink where visitors could reach it.\nThe city entered in many voices and left in many routes. Leena's name remained in the corner, but smaller than before. She had become a better mapmaker when she stopped treating the map as proof of what she knew and began using it to discover what she had missed.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-map-that-changed-at-midnight-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What happened to Leena's map at midnight?", "choices": ["Nothing happened; the map stayed the same", "Silver lines moved across the parchment, including a new route through open water", "The map caught fire and burned completely"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "At midnight, silver lines wriggled across the parchment, and a new route appeared through open water where no road had been drawn."}, {"q": "Why had the official map shown no useful route to the families Tomas delivered to?", "choices": ["Tomas refused to tell anyone about his route", "The families did not actually live in the city", "Leena had drawn streets as if everyone moved on foot, leaving out the water route Tomas used"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Leena had drawn every street as if people only traveled on foot, so the map missed the water route Tomas used to deliver medicine and bread."}, {"q": "Why did the map mark the tower stairs as a barrier?", "choices": ["A baker with a wheeled cart and no ramp could not use the stairs, even though Leena could", "The stairs had collapsed and were unsafe for anyone", "Nobody in the city ever used the stairs"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "To Leena the staircase was a route, but to the baker with a wheeled cart it was a blocked wall — the map changed based on point of view."}, {"q": "What did Master Orin almost convince Leena to do?", "choices": ["Give up mapmaking completely", "Erase the winding new routes to make the map simpler", "Add even more silver lines to the map"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Master Orin said a proper map must be simple, and Leena almost erased the winding routes to please him before she asked whose simplicity the map protected."}, {"q": "How did Orin test Leena's expanded map?", "choices": ["He walked the city with both apprentices, testing routes and asking residents questions", "He refused to leave the workshop at all", "He redrew the entire map by himself"], "answer": 0, "evidencePage": 6, "hint": "Look at page 6.", "explain": "Orin walked the city with both apprentices, tested the water route and a possible ramp, and asked residents which paths changed after dark."}], "grammar": [{"q": "Which sentence correctly uses parallel structure?", "choices": ["The map tested the water route, measuring a possible ramp, and asked residents about the paths.", "The map tested the water route, a possible ramp was measured, and asked residents about the paths.", "The map tested the water route, measured a possible ramp, and asked residents about the paths."], "answer": 2, "evidencePage": 6, "hint": "Each item in a list should use the same grammatical form.", "explain": "Each verb phrase follows the same pattern — tested, measured, asked — keeping the sentence parallel.", "teach": "Items in a <b>series</b> should use the <b>same grammatical form</b>, like matching verbs.<span class='cn'>一系列并列的项目应该使用<b>相同的语法形式</b>，比如动词形式要一致。</span>"}, {"q": "'The map had added a road made of water ___ Leena's picture of the city was incomplete.' Which word shows a reason?", "choices": ["unless", "since", "although"], "answer": 1, "evidencePage": 2, "hint": "This word can introduce a reason, similar to 'because.'", "explain": "'Since' introduces the reason the water road appeared — Leena's map had been missing part of the picture.", "teach": "<b>Since</b> can introduce a <b>reason</b>, similar to <b>because</b>.<span class='cn'><b>since</b> 可以引出<b>原因</b>，和 <b>because</b> 类似。</span>"}, {"q": "Which sentence correctly uses a semicolon to join two related complete thoughts?", "choices": ["The staircase climbed like a ribbon to Leena; it stood like a locked gate to the baker.", "The staircase; climbed like a ribbon to Leena it stood like a locked gate to the baker.", "The staircase climbed like a ribbon to Leena, it stood like a locked gate to the baker;"], "answer": 0, "evidencePage": 3, "hint": "A semicolon joins two complete sentences that are closely related.", "explain": "The semicolon correctly joins two related complete thoughts without needing a conjunction.", "teach": "<b>A semicolon</b> joins two <b>closely related complete sentences</b>.<span class='cn'><b>分号</b>连接两个意思相关的<b>完整句子</b>。</span>"}], "vocabulary": [{"q": "'Apprentice' means ___.", "choices": ["a person who repairs old maps", "a customer who buys maps", "a person learning a skill from an expert"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Leena was Master Orin's apprentice, still learning the skill of mapmaking from him."}, {"q": "'Revision' means ___.", "choices": ["a change made to improve something", "a mistake that cannot be fixed", "a version that is never changed"], "answer": 0, "evidencePage": 6, "hint": "Look at page 6.", "explain": "The map invited questions, evidence, and revision — changes made to improve it — instead of staying fixed."}, {"q": "'Perspectives' means ___.", "choices": ["different ways of seeing or understanding something", "straight lines drawn with a ruler", "exact measurements on a map"], "answer": 0, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Precision without enough perspectives — without enough different viewpoints — could preserve an error in the map."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(apprentice|revision|perspectives)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 5 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function saveProgress(){try{localStorage.setItem("les-the-map-that-changed-at-midnight-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-map-that-changed-at-midnight"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-map-that-changed-at-midnight",bookTitle:"The Map That Changed at Midnight",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.
