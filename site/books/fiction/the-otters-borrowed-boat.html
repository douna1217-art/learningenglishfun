 16px;display:flex;align-items:center;gap:14px;box-shadow:0 14px 38px rgba(111,74,182,.24);border:1px solid rgba(255,255,255,.32)}.evidence-banner strong{text-shadow:0 1px 6px rgba(60,35,110,.35)}.evidence-banner span{font-size:.84rem;color:#fff}.evidence-banner button{border:0;border-radius:10px;padding:9px 12px;background:rgba(255,255,255,.92);color:var(--purple);font-weight:950;cursor:pointer}.footer{text-align:center;color:var(--muted);font-size:.8rem;padding:13px}

<script>

const pages=[{"type": "cover", "title": "The Otter’s Borrowed Boat", "subtitle": "A Story About Honesty and Responsible Repair", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-otters-borrowed-boat-assets/cover.jpg"}, {"text": "Ollie needed a boat to carry berries to the marsh picnic. Tessa agreed to lend him her woven-reed skiff. ‘My aunt built it,’ she said. ‘Please bring it back before the evening tide.’ Ollie promised he would.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-otters-borrowed-boat-assets/page1.jpg"}, {"text": "Halfway to the picnic, Ollie spotted a duckling on the wrong side of thick reeds. He looped the boat's rope around a cattail, but his knot was loose. Then he slipped into the water to guide the duckling toward its family.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-otters-borrowed-boat-assets/page2.jpg"}, {"text": "While Ollie helped, the rope slid free. The empty skiff drifted a short distance and caught on a low branch. Several reeds tore along its side. The duckling was safe — but Tessa's boat was damaged.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-otters-borrowed-boat-assets/page3.jpg"}, {"text": "Ollie pulled the skiff ashore and stared at the ragged hole. For one moment, the tall reeds looked like a place to hide it. Then he saw Tessa waiting at the dock. Hiding the boat would only hide the truth for a little while.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-otters-borrowed-boat-assets/page4.jpg"}, {"text": "Ollie returned the boat and told the whole story. Tessa was glad the duckling was safe, but her eyes rested sadly on the torn weave. Ollie did not offer an excuse. ‘I tied a careless knot,’ he said. ‘I will help repair it.’", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-otters-borrowed-boat-assets/page5.jpg"}, {"text": "Tessa chose fresh tule reeds that matched the old ones. She showed Ollie how to weave them over and under. He worked slowly until the side felt strong. Before testing the boat, Ollie tied its rope with a careful double knot.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-otters-borrowed-boat-assets/page6.jpg"}, {"text": "The next evening, Ollie returned the sturdy skiff before the tide changed. He brought berries and waited for Tessa to inspect every repair. At last, she smiled and climbed aboard. The friends paddled to the picnic together — and trust traveled with them.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-otters-borrowed-boat-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did Tessa ask Ollie to do with her boat?", "choices": ["bring it back before the evening tide", "keep it for the whole week", "paint it a new color"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Tessa said, “Please bring it back before the evening tide,” and Ollie promised he would."}, {"q": "Why did Ollie stop and get into the water?", "choices": ["he saw a duckling on the wrong side of thick reeds and wanted to help it", "he wanted to go swimming", "the boat started sinking"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Ollie spotted a duckling on the wrong side of thick reeds and slipped into the water to guide it to its family."}, {"q": "How did Tessa's boat get damaged?", "choices": ["Ollie's knot was loose, so the empty boat drifted and caught on a branch, tearing the reeds", "Ollie dropped a rock on it", "another animal chewed a hole in it"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "The rope slid free because the knot was loose, and the drifting boat caught on a branch and tore."}, {"q": "What did Ollie decide to do instead of hiding the damaged boat?", "choices": ["he returned it and told Tessa the whole story", "he left it in the reeds and walked away", "he asked someone else to explain it for him"], "answer": 0, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Ollie returned the boat and told the whole story instead of hiding the truth."}, {"q": "What is the big idea of this story?", "choices": ["Honesty begins a repair, and taking responsible action completes it", "It's fine to hide a mistake if no one finds out", "Borrowed things never need to be returned"], "answer": 0, "evidencePage": 7, "hint": "Look at the last page.", "explain": "Ollie told the truth and helped repair the boat — honesty began the repair, and responsible action completed it."}], "grammar": [{"q": "“Ollie ___ a careless knot,” he said.” Which is the past tense of ‘tie’?", "choices": ["tied", "tieed", "tie"], "answer": 0, "evidencePage": 5, "hint": "Add -d to a verb that already ends in 'e'.", "explain": "“Tied” (add -d) shows the knot-tying already happened — not “tieed.”", "teach": "For verbs that already end in <b>e</b>, just add <b>-d</b> to show the past: tie → <b>tied</b>. <b>tieed</b> is not a real word, and <b>tie</b> alone is the present-tense form.<span class='cn'>动词以 <b>e</b> 结尾时，过去式只需加 <b>-d</b>：tie→<b>tied</b>(系)。<b>tieed</b> 不是真正的词，<b>tie</b> 是现在式。</span>"}, {"q": "“The duckling was safe — ___ Tessa's boat was damaged.” Which word shows contrast?", "choices": ["but", "and", "so"], "answer": 0, "evidencePage": 3, "hint": "This word connects two very different outcomes.", "explain": "“But” connects two contrasting outcomes — the duckling was safe, but the boat was damaged.", "teach": "<b>But</b> joins two ideas that are <b>different or opposite</b>: safe, <b>but</b> damaged. <b>and</b> joins similar ideas, and <b>so</b> shows a result — neither fits here.<span class='cn'><b>but</b>(但是)连接两个<b>相反</b>的想法：safe, but damaged。<b>and</b>(和)连接相似想法，<b>so</b>(所以)表示结果。</span>"}, {"q": "“He worked ___ until the side felt strong.” Which word tells HOW he worked?", "choices": ["slowly", "worked", "strong"], "answer": 0, "evidencePage": 6, "hint": "This word ends in -ly and describes the action.", "explain": "“Slowly” is an adverb that tells how Ollie worked while repairing the boat.", "teach": "An <b>adverb</b> tells <b>how</b> something is done and often ends in <b>-ly</b>: worked <b>slowly</b>. <b>worked</b> is the action itself (verb), and <b>strong</b> describes the side (adjective).<span class='cn'><b>副词</b>说明<b>怎样</b>做某事，常以 <b>-ly</b> 结尾：slowly(慢慢地)。<b>worked</b> 是动词，<b>strong</b> 是形容词。</span>"}], "vocabulary": [{"q": "A “skiff” is ___.", "choices": ["a small, light boat", "a type of net", "a woven basket"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "A skiff is a small, light boat, like the one Tessa lent Ollie."}, {"q": "“Careless” means ___.", "choices": ["not paying enough attention or care", "very careful and neat", "extremely fast"], "answer": 0, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Careless means not paying enough attention or care, like the loose knot Ollie tied."}, {"q": "To “inspect” means to ___.", "choices": ["look at something closely and carefully", "throw something away", "borrow something"], "answer": 0, "evidencePage": 7, "hint": "Look at the last page.", "explain": "To inspect means to look at something closely and carefully, like Tessa checking the repairs."}]};

let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Reading",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(skiff|careless|inspect|honesty|repair|reeds|trust)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 2 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=a.currentTime/dur;for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(le
