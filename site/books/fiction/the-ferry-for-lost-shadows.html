<script>/*les-speech-shim*/
(function(){var w=window,ok=false,errs=[];
/* Some Android in-app browsers (UC/Quark and other vendor kernels, older WebViews) have no
   speechSynthesis at all. The page script calls it while loading, so it stopped there and the
   story was never drawn (the quiz still worked because its handlers were bound earlier).
   Give such browsers a silent stand-in so the rest of the page runs normally. */
try{ok=typeof w.speechSynthesis==="object"&&w.speechSynthesis!==null}catch(e){}
if(typeof w.SpeechSynthesisUtterance!=="function"&&typeof w.SpeechSynthesisUtterance!=="object"){
w.SpeechSynthesisUtterance=function(t){this.text=t==null?"":String(t);this.lang="";this.rate=1;this.pitch=1;this.volume=1;this.voice=null}}
if(!ok){var gen=0,told=false;
w.speechSynthesis={speaking:false,paused:false,pending:false,
getVoices:function(){return[]},cancel:function(){gen++},pause:function(){},resume:function(){},
addEventListener:function(){},removeEventListener:function(){},
speak:function(u){var g=gen;
if(!told&&typeof w.setStatus==="function"){told=true;try{w.setStatus("This browser can't read aloud, but you can still read and practice. 当前浏览器不支持朗读，仍可阅读和做题。",false)}catch(e){}}
setTimeout(function(){if(g===gen&&u&&u.onstart){try{u.onstart({})}catch(e){}}},0);
setTimeout(function(){if(g===gen&&u&&u.onend){try{u.onend({})}catch(e){}}},Math.max(600,String(u&&u.text||"").length*60))}}}
/* If the story still is not drawn after loading, say why on the page itself, so a screenshot
   from a phone we cannot test on shows the cause. */
w.addEventListener("error",function(e){try{if(errs.length<3)errs.push(String(e&&e.message||e))}catch(x){}});
w.addEventListener("load",function(){try{var v=document.getElementById("pageView");
if(v&&!v.firstChild&&errs.length){var d=document.createElement("div"),s=document.createElement("small");
d.style.cssText="padding:24px;color:#b91c1c;font:15px/1.6 sans-serif";
d.appendChild(document.createTextNode("The story could not be shown in this browser. 此浏览器暂时无法显示故事。"));
d.appendChild(document.createElement("br"));s.textContent=errs.join(" | ");d.appendChild(s);v.appendChild(d)}}catch(x){}});
})();

<script>

const pages=[{"type": "cover", "title": "The Ferry for Lost Shadows", "subtitle": "A Lost Shadow Rides a Green Ferry, and Iris Learns the Difference Between Offering a Home and Choosing One", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-ferry-for-lost-shadows-assets/cover.jpg"}, {"text": "1. The Passenger Without a Ticket\nIn Iris's town, most shadows behaved themselves. They waited under chairs and stretched behind people at sunset. But a few became separated from the things that had made them. Those shadows wandered until the little green ferry came to collect them. Iris had seen it from her aunt's window for years. On the evening Aunt Nora finally took her aboard, she expected something grander than an old boat smelling of rain.\nThe captain checked their tickets. Then she glanced at the deck beside Iris's shoe. A small black diamond lay there, trailing a curved tail with three bows. Iris moved her foot. The shape stayed where it was. It wasn't her shadow, and there was no kite overhead. “That one has ridden with us all week,” said the captain. “It hasn't chosen a landing yet.”", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-ferry-for-lost-shadows-assets/page1.jpg"}, {"text": "2. A Very Reasonable Guess\nIris crouched without touching it. The shadow's tail curled toward her, then flattened again. “Does it want its kite back?” she asked. The captain said some shadows did. Others wanted something different. Iris hardly heard the second part. Across the river stood a toy shop with kites hanging in its window. She knew the owner. She could take the shadow there and have it home before supper.\nAunt Nora asked whether the shadow had agreed. Iris held out one open hand as if inviting a shy cat. The black diamond slid across the deck toward her. “There,” she said. “It wants to come.” The captain opened the gate only after the ferry was secured at the landing. Iris and her aunt walked onto the level pier. The shadow followed along the dry boards, its tail making no sound.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-ferry-for-lost-shadows-assets/page2.jpg"}, {"text": "3. The Window Full of Kites\nThe toy-shop owner let them look through the window after he locked up. There were striped kites, round kites, and one shaped like a fish. Iris pointed out a plain diamond with a ribbon tail. It was almost the same shape as their passenger. The shadow slipped beneath the window, rose along the brickwork, and stopped under the diamond kite. Iris felt the pleasure of a puzzle fitting together.\nThen the shadow folded itself into a narrow line and slid back down. It crossed the sidewalk to Aunt Nora's shoes. Iris tried pointing to the fish kite, but the tail curled tightly away. “Maybe that isn't the question it wants us to answer,” her aunt said. Behind the glass, the kites hung motionless. Iris realized she had never asked whether the shadow wanted to fly again.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-ferry-for-lost-shadows-assets/page3.jpg"}, {"text": "4. An Offer, Not a Plan\nThey sat on a bench in the square. Iris had been so certain that finding another kite would solve everything. Now she felt as if the shadow were waiting for her to stop explaining. Aunt Nora took a bread roll from her shopping bag and divided it. The shadow lay on the stone path between them, looking less like a lost possession than a very quiet passenger.\nIris remembered the bare courtyard wall behind her aunt's house. Every afternoon the sun warmed its bricks. She asked Nora whether she could paint a patch of sky there. Her aunt considered it, then agreed. “You can offer a place,” she said. “You can't decide it is home for someone else.” Iris turned toward the black diamond. “You could look,” she told it. “You wouldn't have to stay.”", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-ferry-for-lost-shadows-assets/page4.jpg"}, {"text": "5. A Sky Made of Paint\nThe shadow followed them through the courtyard gate and settled beside a flowerpot. The next afternoon, Iris fetched the paints Nora used for flowerpots. She made a broad blue rectangle on the lowest part of the wall, where she could reach without a ladder. It wasn't a picture of the old kite's sky. She didn't know what that sky had looked like. She left the middle empty and painted two loose clouds near the corners.\nWhen she stepped back, the black diamond remained on the stone path. Iris nearly added a kite to show it what she meant. Then she put her brush down. The empty space could stay empty if the shadow preferred somewhere else. Nora brought out two chairs. They sat with their feet away from the wet paint and watched the blue begin to dry. For once, Iris had no further instructions to give.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-ferry-for-lost-shadows-assets/page5.jpg"}, {"text": "6. The Choice on the Wall\nAt last the shadow moved. It crossed a seam in the stone path, reached the wall, and climbed as easily as spilled ink running uphill. Iris held her breath. The diamond settled between the two painted clouds. Its tail stretched across the blue and loosened, bow by bow. It looked like a kite, but there was no string holding it in place and no hand pulling from below.\n“Will it stay forever?” Iris whispered. Nora said she didn't know. Perhaps it would travel again when it wanted another view. Iris thought of the captain, who had carried it all week without choosing its landing. She had mistaken that patience for a problem she could solve quickly. On the wall, the shadow lifted one corner. Iris couldn't tell whether it was waving. She waved back anyway.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-ferry-for-lost-shadows-assets/page6.jpg"}, {"text": "7. A Corner That Moved\nThe next afternoon, Iris returned with a small pot of yellow paint. She had thought a sun might make the wall more cheerful. At the gate she stopped. The shadow lay across the blue with its tail resting beside a cloud. It seemed quite content without her improvement. She carried the pot back to the cupboard and brought her book outside instead.\nLater, the green ferry passed the end of the street. Iris heard its bell through the open courtyard gate. The shadow's lowest bow trembled, although the painted clouds stayed still. Perhaps it was remembering. Perhaps it was only listening. Iris read another paragraph before looking up again. The black diamond was still there. This time she didn't need that to mean it would never leave.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-ferry-for-lost-shadows-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What was the little green ferry for?", "choices": ["Carrying people to the toy shop", "Collecting shadows that had separated from the things that made them", "Taking kites across the river"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "A few shadows became separated from their things and wandered until the little green ferry collected them."}, {"q": "What did Iris assume the kite-shaped shadow wanted?", "choices": ["A ride home on the ferry", "A place to sleep", "A kite of its own"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "She asked whether it wanted its kite back and took it across the river toward the toy shop."}, {"q": "What happened at the toy shop window?", "choices": ["The shadow flew away", "The shadow rose under a diamond kite, then slid back down and returned to Aunt Nora", "The shadow tried on every kite"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "It stopped under the diamond kite, then folded itself up and slid back to Aunt Nora’s shoes."}, {"q": "What did Aunt Nora say about offering a home?", "choices": ["You can offer a place, but you cannot decide it is home for someone else", "A shadow must stay where it is put", "Every shadow needs a kite"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "She said, “You can offer a place. You can’t decide it is home for someone else.”"}, {"q": "Where did the shadow settle after Iris painted the wall?", "choices": ["Between the two painted clouds", "Under the bench", "Beside the flowerpot"], "answer": 0, "evidencePage": 6, "hint": "Look at page 6.", "explain": "The diamond settled between the two painted clouds and stretched its tail across the blue."}], "grammar": [{"q": "‘The ferry was secured at the landing.’ Which meaning of ‘landing’ is used?", "choices": ["a place where boats stop to let people on or off", "the act of coming down to the ground", "the floor at the top of a staircase"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "A ferry stops at a landing so people can get on and off.", "teach": "Many words have more than one meaning, so use the other words in the sentence, like <b>ferry</b>, to choose the right one.<span class='cn'>很多词有不止一个意思，要根据句子里的其他词，比如 <b>ferry</b>（渡船），来判断是哪个意思。</span>"}, {"q": "‘It climbed as easily as spilled ink running uphill.’ What does this simile show?", "choices": ["The shadow moved smoothly in a strange, flowing way", "The shadow made a mess", "The shadow was afraid"], "answer": 0, "evidencePage": 6, "hint": "Look at page 6.", "explain": "The simile compares the shadow to ink that flows smoothly and strangely uphill.", "teach": "A <b>simile</b> compares two things using <b>as</b> or <b>like</b>, like <b>as easily as spilled ink</b>.<span class='cn'><b>明喻</b>用 <b>as</b> 或 <b>like</b> 来比较两个事物，比如 <b>as easily as spilled ink</b>（像泼出的墨水一样轻松）。</span>"}, {"q": "Which word is an abstract noun?", "choices": ["pier", "bench", "patience"], "answer": 2, "evidencePage": 6, "hint": "Look at page 6.", "explain": "Patience names a feeling or quality that you cannot touch.", "teach": "An <b>abstract noun</b> names an idea or feeling you cannot touch, like <b>patience</b> or <b>courage</b>.<span class='cn'><b>抽象名词</b>表示摸不到的想法或感受，比如 <b>patience</b>（耐心）和 <b>courage</b>（勇气）。</span>"}], "vocabulary": [{"q": "‘Motionless’ means ___.", "choices": ["moving in circles", "not moving at all", "moving very fast"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Behind the glass, the kites hung motionless."}, {"q": "‘Patience’ means ___.", "choices": ["wanting something right away", "staying calm while you wait", "being angry at a delay"], "answer": 1, "evidencePage": 6, "hint": "Look at page 6.", "explain": "She had mistaken that patience for a problem she could solve quickly."}, {"q": "‘Improvement’ means ___.", "choices": ["a mistake that must be fixed", "a change that makes something worse", "a change that makes something better"], "answer": 2, "evidencePage": 7, "hint": "Look at the last page.", "explain": "The shadow seemed quite content without her improvement."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(motionless|patience|improvement)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 5 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}var TEACH_ICONS='<svg class="ic i-spk" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.5v5h3.6l4.9 4.5V5L7.6 9.5H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.6 9.2a4 4 0 010 5.6M18.2 6.6a7.6 7.6 0 010 10.8"/></svg><svg class="ic i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></svg><svg class="ic i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 5.3v13.4c0 .8.9 1.3 1.6.8l9.6-6.7c.6-.4.6-1.2 0-1.6L9.8 4.5c-.7-.5-1.6 0-1.6.8z"/></svg>';var _tp=null;function _tpSet(b,st){if(!b)return;b.classList.toggle('is-playing',st==='playing');b.classList.toggle('is-paused',st==='paused');b.setAttribute('aria-pressed',st==='playing'?'true':'false');var z=b.dataset.part==='cn',L=st==='playing'?(z?'\u6682\u505C':'Pause'):st==='paused'?(z?'\u7EE7\u7EED\u64AD\u653E':'Resume'):b.dataset.label;b.setAttribute('aria-label',L);b.title=L;}function stopTeachAudio(){var c=_tp;if(!c)return;_tp=null;try{if(c.audio){c.audio.onended=c.audio.onerror=c.audio.ontimeupdate=null;c.audio.pause();}}catch(e){}if(c.mode==='tts'){try{speechSynthesis.cancel();}catch(e){}}_tpSet(c.btn,'idle');}function _tpFallback(btn){try{var u=new SpeechSynthesisUtterance(btn.dataset.text||'');u.lang=btn.dataset.lang||'en-US';var cur={btn:btn,mode:'tts'};_tp=cur;u.onend=u.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');}};_tpSet(btn,'playing');speechSynthesis.speak(u);}catch(e){}}function playTeachAudio(btn){if(_tp&&_tp.btn===btn){if(_tp.mode==='audio'){var a0=_tp.audio;if(a0.paused){var p0=a0.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}

function nextQuestion(){const list=quizzes[activeTab];if(qIndex[activeTab]<list.length-1){qIndex[activeTab]++;renderPanel();return}completed[activeTab]=true;if(activeTab==="comprehension")activeTab="grammar";else if(activeTab==="grammar")activeTab="vocabulary";else{return showCompletion()}setTabs();renderPanel()}
function showCompletion(){completed.vocabulary=true;setTabs();const correct=Object.keys(selections).filter(k=>{const [tab,idx]=k.split('-');return selections[k]===quizzes[tab][+idx].answer}).length,total=Object.values(quizzes).reduce((a,b)=>a+b.length,0);document.getElementById("stagePill").textContent="Journey Complete";document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">Reading journey complete</div><h2>Wonderful work! 🎉</h2><p class="small">You finished Reading, Grammar, and Vocabulary.</p><div class="score-row"><div class="score-box"><b>${total}</b><br><span>Questions</span></div><div class="score-box"><b>${correct}</b><br><span>Correct now</span></div></div><div class="feedback good">You used evidence, practiced sentence skills, and learned new words.</div><button class="submit" onclick="restartPractice()">Practice Again</button></div>`}

function saveProgress(){try{localStorage.setItem("les-the-ferry-for-lost-shadows-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-ferry-for-lost-shadows"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-ferry-for-lost-shadows",bookTitle:"The Ferry for Lost Shadows",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}
function clearHighlight(){document.querySelectorAll(".story-word.reading").forEach(x=>x.classList.remove("reading"))}
let preferredVoice=null;
