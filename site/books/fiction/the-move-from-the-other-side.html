<script>/*les-speech-shim*/
(function(){var w=window,ok=false,errs=[];
/* Some Android in-app browsers (UC/Quark and other vendor kernels, older WebViews) have no
   speechSynthesis at all. The page script calls it while loading, so it stopped there and the
   story was never drawn (the quiz still worked because its handlers were bound earlier).
   Give such browsers a silent stand-in so the rest of the page runs normally. */
try{ok=typeof w.speechSynthesis==="object"&&w.speechSynthesis!==null}catch(e){}
if(typeof w.SpeechSynthesisUtterance!=="function"&&typeof w.SpeechSynthesisUtterance!=="object"){
w.SpeechSynthesisUtterance=function(t){this.text=t==null?"":String(t);this.lang="";this.rate=1;this.pitch=1;this.volume=1;this.voice=null}}
if(!ok){var gen=0,told=false;
w.speechSynthesis={speaking:false,paused:false,pending:false,
getVoices:function(){return[]},cancel:function(){gen++},pause:function(){},resume:function(){},
addEventListener:function(){},removeEventListener:function(){},
speak:function(u){var g=gen;
if(!told&&typeof w.setStatus==="function"){told=true;try{w.setStatus("This browser can't read aloud, but you can still read and practice. 当前浏览器不支持朗读，仍可阅读和做题。",false)}catch(e){}}
setTimeout(function(){if(g===gen&&u&&u.onstart){try{u.onstart({})}catch(e){}}},0);
setTimeout(function(){if(g===gen&&u&&u.onend){try{u.onend({})}catch(e){}}},Math.max(600,String(u&&u.text||"").length*60))}}}
/* If the story still is not drawn after loading, say why on the page itself, so a screenshot
   from a phone we cannot test on shows the cause. */
w.addEventListener("error",function(e){try{if(errs.length<3)errs.push(String(e&&e.message||e))}catch(x){}});
w.addEventListener("load",function(){try{var v=document.getElementById("pageView");
if(v&&!v.firstChild&&errs.length){var d=document.createElement("div"),s=document.createElement("small");
d.style.cssText="padding:24px;color:#b91c1c;font:15px/1.6 sans-serif";
d.appendChild(document.createTextNode("The story could not be shown in this browser. 此浏览器暂时无法显示故事。"));
d.appendChild(document.createElement("br"));s.textContent=errs.join(" | ");d.appendChild(s);v.appendChild(d)}}catch(x){}});
})();

<script>

const pages=[{"type": "cover", "title": "The Move from the Other Side", "subtitle": "The Board Looked Different When Asha Changed Her Point of View", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-move-from-the-other-side-assets/cover.jpg"}, {"text": "1. The Quickest Plan\nAsha set up the chessboard in the school library and checked that every piece faced the right way. The club’s small tournament began after lunch. She wanted to win her first two games before anyone else finished. A fast game, she thought, would prove she belonged at the front table.\nAcross from her, Omar arranged his pieces slowly. Ms. Reed rang the little table bell, and the first game began. Asha moved her pawn toward the center. She already had a plan for her queen, her bishop, and the open path between them.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-move-from-the-other-side-assets/page1.jpg"}, {"text": "2. The Edge of the Board\nAfter several moves, Omar lifted his knight and placed it near the edge of the board. Asha blinked. The knight seemed far from the center, where the action was. She pictured her queen crossing the board and capturing a pawn that looked undefended.\nShe made the move. Omar looked at the board, not at Asha, and slid a rook forward. Asha’s smile faded. The rook did not threaten her queen yet. It sat beside a file of pieces she had barely noticed.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-move-from-the-other-side-assets/page2.jpg"}, {"text": "3. What She Missed\nAsha followed her attack. Her queen took the pawn, and her bishop pointed toward Omar’s king. She felt a rush of certainty. Then Omar moved his other bishop along a long diagonal. Asha traced its path across the squares and saw it ended beside her rook.\nShe reached for the rook, but the open file was blocked. The piece could not escape without exposing her king. Asha leaned back. She had watched the squares where she wanted to go, not the squares Omar had quietly opened.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-move-from-the-other-side-assets/page3.jpg"}, {"text": "4. The Board Looked Larger\nAsha tried two moves, but each one opened another path for Omar. At last, she lost her rook. She wanted to knock over a pawn and start again. Instead, she set both hands in her lap and watched Omar’s face. He looked focused, not pleased with himself.\n“How did you see that?” she asked. Omar pointed to his knight. “I moved it away from the center so the bishop could see through.” Asha looked again. The knight had not wandered; it had made room.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-move-from-the-other-side-assets/page4.jpg"}, {"text": "5. Sit in the Other Seat\nAfter the game, Asha asked Omar if they could reset the board and replay the opening. He agreed. This time, she moved to the chair he had used and looked at the position from his side. The knight’s path to the open file seemed clear from there.\nAsha returned to her seat. She named the squares she could defend and the ones Omar might use. Her next move was slower, but it guarded her rook and kept her king safe. The board had not changed. Her questions had.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-move-from-the-other-side-assets/page5.jpg"}, {"text": "6. A Safer Move\nIn the next round, Asha faced Omar again. He moved a knight toward the edge of the board. For one second, she felt the old urge to race for his pawn. Then she imagined the board from his chair and searched for the line his bishop might be opening.\nShe found it. Asha moved a pawn to block the diagonal and protected her rook. Omar studied the board, then nodded. He had to change his plan. Asha’s heart still beat quickly, but now she knew what she was watching for.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-move-from-the-other-side-assets/page6.jpg"}, {"text": "7. The Other Side\nThe game ended in a draw. Asha did not win the tournament, but she no longer wished she could erase the first game. It had shown her a move she could not see from her own side of the board.\nOmar reset the pieces. “Rematch next week?” he asked. Asha smiled and set her queen back in its square. “Yes,” she said. This time, she planned to watch both sides.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-move-from-the-other-side-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "Why did Asha want to win her first two games quickly?", "choices": ["Ms. Reed would give a prize for speed", "She thought a fast game would prove she belonged at the front table", "She had to leave the club early"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "A fast game, she thought, would prove she belonged at the front table."}, {"q": "What did Omar do with his knight that puzzled Asha?", "choices": ["He placed it near the edge of the board", "He traded it for her queen", "He hid it behind a rook"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Omar lifted his knight and placed it near the edge of the board."}, {"q": "Why had Omar moved his knight away from the center?", "choices": ["So his bishop could see through", "To block her open file", "To guard his king from her queen"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "He said he moved it away from the center so the bishop could see through."}, {"q": "How did Asha try to understand Omar’s idea after the game?", "choices": ["She read a chess book that night", "She reset the board and looked at it from the chair Omar had used", "She asked Ms. Reed to play the game again for her"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "She moved to the chair he had used and looked at the position from his side."}, {"q": "How did Asha feel about her first game by the end?", "choices": ["She no longer wished she could erase it, because it taught her something", "She wished she could erase it", "She felt sure she would never lose again"], "answer": 0, "evidencePage": 7, "hint": "Look at the last page.", "explain": "It had shown her a move she could not see from her own side of the board."}], "grammar": [{"q": "‘She had watched the squares ___ she wanted to go.’ Which word finishes the sentence?", "choices": ["where", "whose", "who"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "The squares are places, so the sentence uses the relative adverb “where”.", "teach": "A <b>relative adverb</b> like where, when, or why begins a part of the sentence that adds detail, and <b>where</b> is used for a place, like the squares where she wanted to go.<span class='cn'><b>关系副词</b>（如 where、when、why）引出补充说明的部分，<b>where</b> 用来指地点，比如 the squares <b>where</b> she wanted to go（她想去的那些格子）。</span>"}, {"q": "‘Asha’s heart still beat quickly, but now she knew what she ___ watching for.’ Which choice shows an action that was in progress in the past?", "choices": ["were", "is", "was"], "answer": 2, "evidencePage": 6, "hint": "Look at page 6.", "explain": "“Was watching” uses was and an ing verb to show an action in progress in the past.", "teach": "The <b>past progressive</b> uses was or were with an ing verb to show an action that was in progress, like she <b>was watching</b>.<span class='cn'><b>过去进行时</b>用 was 或 were 加动词的 ing 形式，表示过去某个时刻正在进行的动作，比如 she <b>was watching</b>（她当时正在留意）。</span>"}, {"q": "Which sentence puts the comma in the right place?", "choices": ["Her next move, was slower but it guarded her rook and kept her king safe.", "Her next move was slower, but it guarded her rook and kept her king safe.", "Her next move was slower but it guarded her rook, and kept her king safe."], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "In a compound sentence the comma goes before the joining word “but”.", "teach": "In a <b>compound sentence</b>, put a comma before the joining word like and, but, or so, like <b>It was slower, but it was safe</b>.<span class='cn'>在<b>并列句</b>里，连接词 and、but、so 前面要加逗号，比如 <b>It was slower, but it was safe</b>（它慢一些，但很安全）。</span>"}], "vocabulary": [{"q": "‘Tournament’ means ___.", "choices": ["a quiet place to play games", "a prize given to the winner", "a series of games played to find a winner"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "The club’s small tournament began after lunch."}, {"q": "‘Certainty’ means ___.", "choices": ["a feeling of being tired", "a plan for the next move", "a strong feeling of being sure"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "She felt a rush of certainty."}, {"q": "‘Exposing’ means ___.", "choices": ["moving something quickly", "leaving something open to danger", "hiding something safely"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "The piece could not escape without exposing her king."}]};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(tournament|certainty|exposing)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 4 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[ke
