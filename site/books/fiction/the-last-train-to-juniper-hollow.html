 16px;display:flex;align-items:center;gap:14px;box-shadow:0 14px 38px rgba(111,74,182,.24);border:1px solid rgba(255,255,255,.32)}.evidence-banner strong{text-shadow:0 1px 6px rgba(60,35,110,.35)}.evidence-banner span{font-size:.84rem;color:#fff}.evidence-banner button{border:0;border-radius:10px;padding:9px 12px;background:rgba(255,255,255,.92);color:var(--purple);font-weight:950;cursor:pointer}.footer{text-align:center;color:var(--muted);font-size:.8rem;padding:13px}

<script>

const pages=[{"type": "cover", "title": "The Last Train to Juniper Hollow", "subtitle": "One Mountain Journey Changed When Three Travelers Noticed Different Clues", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-last-train-to-juniper-hollow-assets/cover.jpg"}, {"text": "1. The Final Run of the Season\nNora boarded the last train to Juniper Hollow carrying a canvas mailbag from her aunt's post office. Inside were festival invitations that had to arrive before morning. Malik boarded with a weather box he had repaired for the mountain station.\nRain tapped the windows as the train climbed. Conductor Elena said the storm was early but manageable. Mr. Sato, the only other passenger, watched the clouds gathering below the ridge instead of above it.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-last-train-to-juniper-hollow-assets/page1.jpg"}, {"text": "2. Three Clues at Pine Bend\nAt Pine Bend, Elena stopped before a fallen branch. The rails looked clear beyond it, but the signal wire sagged. Nora heard water rushing where the map showed only a seasonal creek. Malik noticed the weather box needle dropping fast.\nEach clue suggested a different danger: blocked communication, rising water, or stronger wind. Elena refused to choose one explanation too quickly. They moved the branch together, then walked only as far as the next safe marker to gather more evidence.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-last-train-to-juniper-hollow-assets/page2.jpg"}, {"text": "3. The Bridge That Hummed\nThe bridge ahead gave a low humming sound. Nora thought the wind was vibrating the rails. Malik touched the wooden guardpost and felt a rhythm that matched the creek below.\nMr. Sato remembered the sound from a flood years ago. It came from branches striking a support beneath the bridge. The bridge still stood, but crossing before an inspection would turn a guess into a gamble.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-last-train-to-juniper-hollow-assets/page3.jpg"}, {"text": "4. The Map's Thin Gray Line\nThe topographic map showed an old maintenance siding curving uphill before the bridge. It ended near a fire lookout, not Juniper Hollow. Elena could park the train there, but the invitations would still be miles from town.\nNora wanted to carry the mail down the hiking trail. Malik compared the tight contour lines and argued that the wet slope would be too steep. Their disagreement changed when Mr. Sato revealed he had once maintained the lookout radio.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-last-train-to-juniper-hollow-assets/page4.jpg"}, {"text": "5. The Lookout Signal\nElena backed the train slowly onto the siding and secured it below the lookout. The four travelers climbed the short service steps, carrying the lantern, weather box, and mailbag.\nThe radio had no power, but Malik connected the weather box battery. Nora used the festival invitations as clean paper for one brief emergency message, writing on the blank backs. Mr. Sato sent the signal, and a ranger answered from the valley.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-last-train-to-juniper-hollow-assets/page5.jpg"}, {"text": "6. The Long Way Around\nA ranger confirmed that debris had damaged the bridge support. A road crew would bring the mail to Juniper Hollow by the longer valley route. The train would remain at the lookout until morning.\nNora felt disappointed that she would not deliver the invitations herself. Elena reminded her that the goal was not to complete the journey exactly as imagined. The goal was to protect the passengers and get the message through.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-last-train-to-juniper-hollow-assets/page6.jpg"}, {"text": "7. Arrival After Sunrise\nBy sunrise, inspectors cleared the bridge for a slow crossing. The last train rolled into Juniper Hollow after the invitations had already arrived by road. Festival flags lifted in clean mountain air.\nNora had begun the trip believing success meant being first to the station with the mailbag. She ended it knowing the journey depended on several people reading different clues. The train arrived late because the travelers had chosen evidence over urgency—and everyone arrived safely.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-last-train-to-juniper-hollow-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What was Nora carrying onto the last train?", "choices": ["A lantern for the mountain lookout", "A canvas mailbag with festival invitations", "A repaired weather box for the station"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Nora boarded carrying a canvas mailbag from her aunt's post office, holding festival invitations that had to arrive before morning."}, {"q": "What three different clues did the travelers notice at Pine Bend?", "choices": ["A broken train wheel, a missing conductor, and no rain at all", "A closed station, an empty mailbag, and a silent radio", "A sagging signal wire, rushing water, and a fast-dropping weather needle"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Elena noticed the sagging signal wire, Nora heard rushing water, and Malik saw the weather box needle dropping fast — three different clues suggesting different dangers."}, {"q": "Why didn't the group cross the bridge right away?", "choices": ["Crossing before an inspection would turn a guess into a gamble", "The bridge had already completely collapsed", "Nobody heard the humming sound at all"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Mr. Sato remembered the humming sound from a past flood, and the group agreed that crossing before an inspection would turn a guess into a gamble."}, {"q": "How did the travelers send an emergency signal from the lookout?", "choices": ["They waited silently until morning without doing anything", "They walked all the way down to town to find help", "Malik connected the weather box battery to the radio, and Nora used the invitations as paper for a message"], "answer": 2, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Malik connected the weather box battery to power the radio, Nora wrote a message on the backs of the invitations, and Mr. Sato sent the signal to a ranger."}, {"q": "What did Elena remind Nora about the goal of the journey?", "choices": ["The goal was to arrive before any other train no matter what", "The goal was to protect the passengers and get the message through, not to arrive exactly as planned", "The goal was to keep the mailbag a secret from everyone"], "answer": 1, "evidencePage": 6, "hint": "Look at page 6.", "explain": "Elena reminded Nora that the goal was not to complete the journey exactly as imagined, but to protect the passengers and get the message through safely."}], "grammar": [{"q": "'The bridge still stood, but crossing before an inspection would turn a guess into a gamble ___ nobody could be certain it was safe.' Which word shows a reason?", "choices": ["so", "because", "although"], "answer": 1, "evidencePage": 3, "hint": "This word introduces the reason behind something.", "explain": "'Because' introduces the reason crossing was risky — nobody could be certain the bridge was safe.", "teach": "<b>Because</b> introduces the <b>reason</b> for something.<span class='cn'><b>because</b>用来引出<b>原因</b>。</span>"}, {"q": "'The storm was early, ___ Conductor Elena said it was manageable.' Which word shows contrast?", "choices": ["but", "so", "and"], "answer": 0, "evidencePage": 1, "hint": "This word shows the second idea is different from what you might expect.", "explain": "'But' shows contrast: the storm was early, yet Elena still said it could be managed.", "teach": "<b>But</b> joins two ideas that are <b>different or surprising together</b>.<span class='cn'><b>but</b>用来连接两个<b>不同或令人意外</b>的想法。</span>"}, {"q": "Which sentence correctly punctuates an introductory phrase?", "choices": ["By sunrise, inspectors cleared the bridge for a slow crossing.", "By sunrise inspectors, cleared the bridge for a slow crossing.", "By, sunrise inspectors cleared the bridge for a slow crossing."], "answer": 0, "evidencePage": 7, "hint": "A comma follows an introductory phrase before the main sentence begins.", "explain": "The comma correctly separates the introductory phrase 'By sunrise' from the main sentence.", "teach": "<b>A comma</b> follows an <b>introductory phrase</b> before the main sentence begins.<span class='cn'><b>逗号</b>用在<b>引导性短语</b>之后，主句开始之前。</span>"}], "vocabulary": [{"q": "'Evidence' means ___.", "choices": ["facts or details that support a conclusion", "a guess made without any information", "a rule that must never be questioned"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Elena refused to choose one explanation too quickly and instead gathered more evidence before deciding what to do."}, {"q": "'Urgency' means ___.", "choices": ["a type of train schedule", "a feeling of complete calm and patience", "a feeling that something must happen quickly"], "answer": 2, "evidencePage": 7, "hint": "Look at page 7.", "explain": "The travelers chose evidence over urgency, meaning they took time to be careful instead of rushing."}, {"q": "'Inspection' means ___.", "choices": ["a quick guess with no checking at all", "a careful check to make sure something is safe", "a type of mountain weather"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Crossing the bridge before an inspection — a careful safety check — would have turned a guess into a gamble."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(evidence|urgency|inspection)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 5 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function saveProgress(){try{localStorage.setItem("les-the-last-train-to-juniper-hollow-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-last-train-to-juniper-hollow"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-last-train-to-juniper-hollow",bookTitle:"The Last Train to Juniper Hollow",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.
