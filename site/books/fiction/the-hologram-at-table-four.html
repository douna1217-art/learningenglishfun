<script>/*les-speech-shim*/
(function(){var w=window,ok=false,errs=[];
/* Some Android in-app browsers (UC/Quark and other vendor kernels, older WebViews) have no
   speechSynthesis at all. The page script calls it while loading, so it stopped there and the
   story was never drawn (the quiz still worked because its handlers were bound earlier).
   Give such browsers a silent stand-in so the rest of the page runs normally. */
try{ok=typeof w.speechSynthesis==="object"&&w.speechSynthesis!==null}catch(e){}
if(typeof w.SpeechSynthesisUtterance!=="function"&&typeof w.SpeechSynthesisUtterance!=="object"){
w.SpeechSynthesisUtterance=function(t){this.text=t==null?"":String(t);this.lang="";this.rate=1;this.pitch=1;this.volume=1;this.voice=null}}
if(!ok){var gen=0,told=false;
w.speechSynthesis={speaking:false,paused:false,pending:false,
getVoices:function(){return[]},cancel:function(){gen++},pause:function(){},resume:function(){},
addEventListener:function(){},removeEventListener:function(){},
speak:function(u){var g=gen;
if(!told&&typeof w.setStatus==="function"){told=true;try{w.setStatus("This browser can't read aloud, but you can still read and practice. 当前浏览器不支持朗读，仍可阅读和做题。",false)}catch(e){}}
setTimeout(function(){if(g===gen&&u&&u.onstart){try{u.onstart({})}catch(e){}}},0);
setTimeout(function(){if(g===gen&&u&&u.onend){try{u.onend({})}catch(e){}}},Math.max(600,String(u&&u.text||"").length*60))}}}
/* If the story still is not drawn after loading, say why on the page itself, so a screenshot
   from a phone we cannot test on shows the cause. */

<script>

const pages=[{"type": "cover", "title": "The Hologram at Table Four", "subtitle": "A Student in Another World Joins by Hologram, and Faye Learns to Check What Her Partner Can See", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-hologram-at-table-four-assets/cover.jpg"}, {"text": "1. A Partner Made of Light\nAt Faye's school, students could join a lesson from another world. The light-link brought their moving images into the classroom, small enough to stand above a table. Rafi's family was staying on a research station for the term. On Monday, his blue image appeared beside Faye's cardboard neighborhood. He lifted a hand to greet her. The projection was clear enough that she nearly handed him a piece of card.\nTheir task was to design a neighborhood with places for people to meet. Faye had already cut several buildings. She explained where the library would go, then where she wanted the playground. Rafi began a question, but she was reaching for another wall and didn't hear the end. She told him he could help with the presentation. It seemed like a fair division. She could build, and he could talk.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-hologram-at-table-four-assets/page1.jpg"}, {"text": "2. The Quiet Side of the Table\nBy the next lesson, Faye had added a row of shops and a large library wall. Rafi's image watched from its silver projector. Sometimes he asked what she had just moved. Faye described it quickly and carried on. She was pleased with how much they were finishing. When Ms. Vega asked how the partnership was going, Faye said they had nearly completed the center of the neighborhood.\nRafi said he wasn't sure where the center was. Faye pointed at the empty square between the buildings. He paused again. She wondered whether he had been listening. It was difficult to judge someone who could disappear when his connection ended. She asked whether he had worked on what to say. Rafi folded his hands. He said he needed to understand the model first. Faye thought she had been explaining it all morning.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-hologram-at-table-four-assets/page2.jpg"}, {"text": "3. What the Camera Could See\nMs. Vega asked them to open the camera preview. On the little screen, the neighborhood became one enormous brown rectangle. The library wall stood directly in front of the lens. Faye looked from the screen to Rafi's face. Because she could see him so clearly, she had assumed he could see everything she saw. Most of his morning had been spent looking at the back of a cardboard building.\nShe moved the wall aside, then leaned over the camera to show him the square. The preview filled with her orange sleeve. Rafi laughed once, and Faye laughed too, although she felt embarrassed. Ms. Vega waited while she straightened up. Then Faye asked Rafi what he needed to see. It was the first question that day which wasn't about the work she had already decided he should do.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-hologram-at-table-four-assets/page3.jpg"}, {"text": "4. A View They Could Share\nHe asked for a higher view of the whole model and a look at the paper plan. Ms. Vega helped them adjust the camera safely on its stand. Faye held the plan steady until Rafi said he could see it. This took longer than pointing. It also brought a question she hadn't expected. Why did the path from the apartments end behind the shops instead of reaching the square?\nFaye had left that narrow space when she moved the library. From where she stood, the buildings looked complete. From the camera's new angle, the missing path was obvious. She said she would fix it. Rafi asked whether they could try moving the shops first. Faye lifted her hand from the model. She was used to working out the next step by touching things. This time they talked before she moved anything.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-hologram-at-table-four-assets/page4.jpg"}, {"text": "5. Two Ways to Move a Wall\nRafi suggested leaving the square open on two sides. Faye moved the shop row a little, then stopped so he could check. His first idea made the playground too narrow. He admitted that he hadn't seen where its fence ended. They turned the model together, with Faye doing the lifting and Rafi asking her to pause. Neither of them could keep every part of the neighborhood in view at once.\nBy the end of the lesson, they had a path that reached the square without squeezing past the library. Faye asked which part Rafi wanted to explain at the presentation. He chose the path they had changed, and asked her to explain the buildings she had made. That sounded different from being given all the talking because he had no hands in the room. Faye wrote down the order they agreed on.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-hologram-at-table-four-assets/page5.jpg"}, {"text": "6. The Question from the Back\nAt the presentation, Faye described the library and the apartments. Rafi explained how the paths connected them. A student at the back asked what would happen if the shops became busier. Faye nearly answered at once. Then she looked at Rafi. He asked her to turn the model so they could both check the space beside the square. They hadn't worked out that possibility yet.\nThey found one place that might become crowded and said so. Ms. Vega asked what they would test next. Faye wrote the question beside their plan instead of pretending the neighborhood was finished. Rafi's image leaned closer, still unable to reach the paper. She read the note back so he could check it. This time, when she said they had made the model together, she knew which choices belonged to each of them.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-hologram-at-table-four-assets/page6.jpg"}, {"text": "7. Before the Next Building\nThe next morning, Faye reached table four before the lesson began. She checked the camera preview and moved a pencil case that blocked one corner. When Rafi's image appeared, she didn't begin by telling him what she had finished. She asked whether he could see the square. He said yes, but one shop had slipped sideways overnight. Faye put it back only after checking which one he meant.\nThen she showed him a piece of blue card. She thought it might make a roof for a covered meeting place. Rafi asked how people would get underneath it. Faye looked at the card, then at the open space they had worked so hard to make. She set it on the table instead of fixing it down. There was room to try another idea. There was also someone on the other side of the camera to try it with.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-hologram-at-table-four-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "How did Rafi join the lesson?", "choices": ["Through a recorded video", "As a moving blue image sent from a research station", "By coming to the classroom in person"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "The light-link brought his moving image into the classroom from a research station."}, {"q": "How did Faye first divide the work between them?", "choices": ["He would build, and she would talk", "She would build the model, and he would do the talking at the presentation", "They would each build half"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "She told him he could help with the presentation, and said she could build while he could talk."}, {"q": "What did the camera preview show?", "choices": ["Only Rafi’s face", "A clear view of the whole model", "One huge brown rectangle, because the library wall blocked the lens"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "The neighborhood became one enormous brown rectangle, with the library wall in front of the lens."}, {"q": "What did Rafi notice from the higher view?", "choices": ["The playground was missing", "The library was too tall", "The path from the apartments ended behind the shops and did not reach the square"], "answer": 2, "evidencePage": 4, "hint": "Look at page 4.", "explain": "He asked why the path from the apartments ended behind the shops instead of reaching the square."}, {"q": "What did Rafi choose to explain at the presentation?", "choices": ["The path they had changed", "Nothing at all", "The library and the apartments"], "answer": 0, "evidencePage": 5, "hint": "Look at page 5.", "explain": "He chose the path they had changed, and asked her to explain the buildings she had made."}], "grammar": [{"q": "The Latin root ‘ject’ means ‘throw’, as in ‘projection’. Which word has the same root?", "choices": ["reject", "recess", "recent"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "To reject something is to throw it back or away.", "teach": "The Latin root <b>ject</b> means throw, like <b>reject</b> and <b>eject</b>.<span class='cn'>拉丁词根 <b>ject</b> 表示“投、扔”，比如 <b>reject</b>（拒绝）和 <b>eject</b>（弹出）。</span>"}, {"q": "‘The empty square lay ___ the two rows of buildings.’ Which word belongs in the blank?", "choices": ["between", "beyond", "among"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Between is used for two things, so it fits “two rows”.", "teach": "Use <b>between</b> for two things, like <b>between the two shops</b>, and <b>among</b> for three or more.<span class='cn'><b>between</b> 用于两个事物之间，比如 <b>between the two shops</b>；<b>among</b> 用于三个或更多事物之间。</span>"}, {"q": "‘Faye ___ for another wall when Rafi began his question.’ Which choice shows an action that was in progress in the past?", "choices": ["reached", "was reaching", "will reach"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "She was in the middle of reaching when he spoke, so the sentence needs “was reaching”.", "teach": "The <b>past progressive</b>, like <b>was reaching</b>, shows an action that was in progress when something else happened.<span class='cn'><b>过去进行时</b>，比如 <b>was reaching</b>，表示另一件事发生时，某个动作正在进行。</span>"}], "vocabulary": [{"q": "‘Projection’ means ___.", "choices": ["a drawing on paper", "a sound from a speaker", "an image shown on a surface by light"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "The projection was clear enough that she nearly handed him a piece of card."}, {"q": "‘Partnership’ means ___.", "choices": ["working together as partners", "a game with two teams", "a long trip"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Ms. Vega asked how the partnership was going."}, {"q": "‘Preview’ means ___.", "choices": ["a place to store pictures", "a first look before something is final", "the last page of a book"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Ms. Vega asked them to open the camera preview."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(projection|partnership|preview)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 5 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();setListenActive(null);page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}
function selectAnswer(i){selections[activeTab+"-"+qIndex[activeTab]]=i;renderPanel()}

function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}var TEACH_ICONS='<svg class="ic i-spk" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.5v5h3.6l4.9 4.5V5L7.6 9.5H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.6 9.2a4 4 0 010 5.6M18.2 6.6a7.6 7.6 0 010 10.8"/></svg><svg class="ic i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></svg><svg class="ic i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 5.3v13.4c0 .8.9 1.3 1.6.8l9.6-6.7c.6-.4.6-1.2 0-1.6L9.8 4.5c-.7-.5-1.6 0-1.6.8z"/></svg>';var _tp=null;function _tpSet(b,st){if(!b)return;b.classList.toggle('is-playing',st==='playing');b.classList.toggle('is-paused',st==='paused');b.setAttribute('aria-pressed',st==='playing'?'true':'false');var z=b.dataset.part==='cn',L=st==='playing'?(z?'\u6682\u505C':'Pause'):st==='paused'?(z?'\u7EE7\u7EED\u64AD\u653E':'Resume'):b.dataset.label;b.setAttribute('aria-label',L);b.title=L;}function stopTeachAudio(){var c=_tp;if(!c)return;_tp=null;try{if(c.audio){c.audio.onended=c.audio.onerror=c.audio.ontimeupdate=null;c.audio.pause();}}catch(e){}if(c.mode==='tts'){try{speechSynthesis.cancel();}catch(e){}}_tpSet(c.btn,'idle');}function _tpFallback(btn){try{var u=new SpeechSynthesisUtterance(btn.dataset.text||'');u.lang=btn.dataset.lang||'en-US';var cur={btn:btn,mode:'tts'};_tp=cur;u.onend=u.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');}};_tpSet(btn,'playing');speechSynthesis.speak(u);}catch(e){}}function playTeachAudio(btn){if(_tp&&_tp.btn===btn){if(_tp.mode==='audio'){var a0=_tp.audio;if(a0.paused){var p0=a0.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}
function returnToQuestion(){(function(){var b=document.getElementById("evidenceBanner");if(b&&b.parentNode)b.parentNode.removeChild(b);})();renderPanel();document.querySelector(".panel").scrollIntoView({behavior:"smooth",block:"start"})}
function nextQuestion(){const list=quizzes[activeTab];if(qIndex[activeTab]<list.length-1){qIndex[activeTab]++;renderPanel();return}completed[activeTab]=true;if(activeTab==="comprehension")activeTab="grammar";else if(activeTab==="grammar")activeTab="vocabulary";else{return showCompletion()}setTabs();renderPanel()}
function showCompletion(){completed.vocabulary=true;setTabs();const correct=Object.keys(selections).filter(k=>{const [tab,idx]=k.split('-');return selections[k]===quizzes[tab][+idx].answer}).length,total=Object.values(quizzes).reduce((a,b)=>a+b.length,0);document.getElementById("stagePill").textContent="Journey Complete";document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">Reading journey complete</div><h2>Wonderful work! 🎉</h2><p class="small">You finished Reading, Grammar, and Vocabulary.</p><div class="score-row"><div class="score-box"><b>${total}</b><br><span>Questions</span></div><div class="score-box"><b>${correct}</b><br><span>Correct now</span></div></div><div class="feedback good">You used evidence, practiced sentence skills, and learned new words.</div><button class="submit" onclick="restartPractice()">Practice Again</button></div>`}
function restartPractice(){activeTab="comprehension";qIndex={comprehension:0,grammar:0,vocabulary:0};selections={};attempts={};completed={comprehension:false,grammar:false,vocabulary:false};setTabs();renderPanel()}
function saveProgress(){try{localStorage.setItem("les-the-hologram-at-table-four-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-hologram-at-table-four"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-hologram-at-table-four",bookTitle:"The Hologram at Table Four",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}
function clearHighlight(){document.querySelectorAll(".story-word.reading").forEach(x=>x.classList.remove("reading"))}
let preferredVoice=null;
