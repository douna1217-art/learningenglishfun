<script>

const pages=[{"type": "cover", "title": "The Invitation I Folded Twice", "subtitle": "A Student Must Tell a Best Friend Honestly That They Cannot Stay Overnight at a Birthday Sleepover", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-invitation-i-folded-twice-assets/cover.jpg"}, {"text": "1. The Yellow Envelope\nMae slid the yellow envelope across our lunch table as if she were dealing the winning card. Her birthday plan filled the inside, with pizza, a scary movie, a midnight treasure hunt, and breakfast before anyone went home. Six girls were coming. I had known Mae since second grade, when we had considered staying awake until nine a serious achievement. Now she grinned at the word midnight. I grinned back, which was easier than deciding what to say.\nI wanted the pizza and Mae. I did not want to sleep in a room full of people, where everyone could hear me ask for a light or see me lying awake. At my last sleepover, I had counted ceiling tiles until morning. Nothing terrible had happened. That was part of the difficulty of explaining it. I folded the invitation once, then again, until the exciting plan was hidden inside a yellow square.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-invitation-i-folded-twice-assets/page1.jpg"}, {"text": "2. An Excellent Excuse\nAt home, I asked Mom whether we had plans next Saturday. She checked the calendar. We did not. I suggested visiting Aunt Lou, who lived two hours away and had never once invited us for that particular weekend. Mom looked up from the sink. “Is this a visit you want, or a reason you need?” I rubbed a damp circle off the counter and told her about the party. She listened without promising to manufacture an emergency.\n“You can decide what you want to attend,” she said. “But Mae needs an answer from you.” I imagined telling Mae that six sleeping bags sounded unbearable. She would hear that her party was unbearable. At school the next day, I said I was still checking our plans. Mae nodded, then began describing the treasure hunt to someone else. My excellent excuse had not arrived, and now I had something else to worry about, which was that she might stop asking.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-invitation-i-folded-twice-assets/page2.jpg"}, {"text": "3. The Wrong Answer\nBy Wednesday, Mae needed a number for breakfast. “You're coming, right?” she asked by the lockers. Two other girls were comparing sleeping bags beside us. I could have said that I wanted to come for the evening. Instead, I said yes to everything. Mae hugged me. For three seconds I felt wonderfully relieved. Then she asked whether I preferred pancakes or waffles, and Saturday seemed to move several days closer.\nThat afternoon I packed a bag, although the party was still three days away. I put in pajamas, took them out, and checked whether my flashlight could shine through a pillowcase without anyone noticing. My brother wandered past the doorway. “Camping?” he asked. “Something like that.” He offered me his tiny lantern. I almost accepted it. Then I pictured spending an entire birthday hiding a light I needed, and sat down beside the half-empty bag.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-invitation-i-folded-twice-assets/page3.jpg"}, {"text": "4. A Smaller Yes\nI called Mae before I could ask Mom to speak for me. “I said yes too quickly,” I began. The line went quiet. I explained the ceiling tiles, the feeling of waiting for everyone else to fall asleep, and the morning when I had been too tired to enjoy breakfast. “Could I come for pizza and the movie, then leave at nine?” I asked. “I do want to be there. I just don't want to stay overnight.”\nMae did not immediately say that this was a wonderful idea. She had designed the treasure hunt for pairs, and I was supposed to be hers. I started offering to stay after all. Then I stopped. Mae sighed. “I'll change the teams. But next time, don't make me guess.” We agreed on nine. When I hung up, I was still uncomfortable. At least the uncomfortable part now belonged to an honest conversation instead of an imaginary trip.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-invitation-i-folded-twice-assets/page4.jpg"}, {"text": "5. Before Nine\nOn Saturday, I carried a wrapped book to Mae's apartment instead of an overnight bag. For the first hour, I wondered whether everyone could somehow tell. Then a slice of pizza slid off my paper plate, and Mae rescued it with a napkin. We laughed so hard that nobody could understand the story we were trying to tell. During the movie, I sat beside her on the sofa, pleasantly aware that my own bed still existed.\nAt eight thirty, the sleeping bags came out. I felt a sharp little ache as the living room changed into a place I would soon leave. The others discussed breakfast, and I considered pretending that Mom's car had broken down. Mae caught me looking at the bags. “You can still come over tomorrow afternoon,” she said. It wasn't an invitation to undo my choice. She was reminding me that the party did not have to contain our entire friendship.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-invitation-i-folded-twice-assets/page5.jpg"}, {"text": "6. The Doorway\nAt nine, Mom texted from downstairs. I put on my shoes while the others gathered in the kitchen to hear the first treasure-hunt clue. Their excited voices followed me to the door. Mae came over carrying my empty gift bag. For a moment, neither of us said anything. I hated that leaving could look so much like not caring. “I had a good time,” I said. “I know,” she answered. Then she added, “I was still disappointed.”\nI nodded. There wasn't a perfect sentence that would remove that. “I'm sorry I didn't tell you sooner.” Mae leaned against the doorway. “Next year, maybe we'll do something different.” “Or you can have another sleepover,” I said. “I'll come for the pizza.” She smiled, though not quite as broadly as at lunch. In the elevator, I could still hear the party in my head. I wanted to be there and wanted to go home. Both were true.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-invitation-i-folded-twice-assets/page6.jpg"}, {"text": "7. The Next Afternoon\nI slept well. In the morning, Mae sent a photograph of a pancake shaped like a boot. I laughed, then felt a small sting at having missed it. Leaving had not magically made me indifferent to everything that happened afterward. When I visited that afternoon, Mae told the treasure-hunt story badly because she kept laughing at parts I hadn't seen. I listened. Sometimes she had to explain a joke twice. Sometimes it was still funny.\nWe walked to the corner store, arguing about which ice pops were worth buying. Mae wanted the purple ones. I thought they tasted like cough syrup. It was an ordinary disagreement, and neither of us needed to disappear inside the other's answer. Later, I found the invitation in my desk drawer. I unfolded it and smoothed the yellow paper with my palm. It could be a good invitation even if my answer had been smaller than the one Mae first hoped to hear.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-invitation-i-folded-twice-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "Why did the narrator fold the invitation twice?", "choices": ["The invitation was too big for the bag", "The narrator did not want to sleep in a room full of people, so the exciting plan was hidden in a small square", "The narrator was cold"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "The narrator folded the invitation until the exciting plan was hidden inside a yellow square."}, {"q": "What did Mom ask when the narrator suggested visiting Aunt Lou?", "choices": ["Whether it was a visit the narrator wanted or a reason the narrator needed", "Whether the party was canceled", "Whether Aunt Lou had invited them"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Mom asked, “Is this a visit you want, or a reason you need?”"}, {"q": "What happened when Mae asked if the narrator was coming?", "choices": ["The narrator changed the subject", "The narrator said yes to everything and felt relieved for three seconds", "The narrator said no"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "The narrator said yes to everything and felt wonderfully relieved, then worried."}, {"q": "What did the narrator ask for on the phone?", "choices": ["To come for pizza and the movie, then leave at nine", "To skip the party", "To bring a friend"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "The narrator asked whether to come for pizza and the movie, then leave at nine."}, {"q": "What did Mae say at the doorway?", "choices": ["That the party was ruined", "That she was still disappointed, even though the narrator had a good time", "That she was angry and would never invite the narrator again"], "answer": 1, "evidencePage": 6, "hint": "Look at page 6.", "explain": "Mae said, “I was still disappointed.”"}], "grammar": [{"q": "‘I said yes too ___.’ Which word belongs in the blank?", "choices": ["quicker", "quick", "quickly"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Quickly tells how the narrator said yes, so the sentence needs the adverb.", "teach": "Use an adverb ending in <b>ly</b>, like <b>quickly</b>, to describe a verb like <b>said</b>.<span class='cn'>用以 <b>ly</b> 结尾的副词，比如 <b>quickly</b>，来修饰 <b>said</b> 这样的动词。</span>"}, {"q": "The prefix ‘mid-’ means ‘middle’. What does ‘midnight’ mean?", "choices": ["The middle of the night", "A very late dinner", "The start of the day"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Mid means middle, so midnight is the middle of the night.", "teach": "The prefix <b>mid</b> means middle, so <b>midnight</b> means the middle of the night.<span class='cn'>前缀 <b>mid</b> 表示“中间”，所以 <b>midnight</b> 就是夜晚的正中间。</span>"}, {"q": "‘I folded the invitation once, then again, until the exciting plan was hidden inside a yellow square.’ What does the folding show?", "choices": ["The narrator wanted to throw it away", "The narrator wanted to hide a worry about the sleepover", "The narrator was bored"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Hiding the plan inside a small square shows the narrator hiding a worry.", "teach": "A <b>symbol</b> is an object that stands for an idea, like a folded invitation that shows a <b>hidden worry</b>.<span class='cn'><b>象征</b>是用物品代表某种想法，比如折起来的邀请函象征 <b>hidden worry</b>（藏起来的担心）。</span>"}], "vocabulary": [{"q": "‘Relieved’ means ___.", "choices": ["feeling very angry", "feeling very hungry", "feeling better because a worry is gone"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "For three seconds I felt wonderfully relieved."}, {"q": "‘Uncomfortable’ means ___.", "choices": ["not at ease", "extremely loud", "full of joy"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "When I hung up, I was still uncomfortable."}, {"q": "‘Disappointed’ means ___.", "choices": ["very sleepy", "very proud", "sad because something did not go as hoped"], "answer": 2, "evidencePage": 6, "hint": "Look at page 6.", "explain": "Then she added, I was still disappointed."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(relieved|uncomfortable|disappointed)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 6 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}var TEACH_ICONS='<svg class="ic i-spk" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.5v5h3.6l4.9 4.5V5L7.6 9.5H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.6 9.2a4 4 0 010 5.6M18.2 6.6a7.6 7.6 0 010 10.8"/></svg><svg class="ic i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></svg><svg class="ic i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 5.3v13.4c0 .8.9 1.3 1.6.8l9.6-6.7c.6-.4.6-1.2 0-1.6L9.8 4.5c-.7-.5-1.6 0-1.6.8z"/></svg>';var _tp=null;function _tpSet(b,st){if(!b)return;b.classList.toggle('is-playing',st==='playing');b.classList.toggle('is-paused',st==='paused');b.setAttribute('aria-pressed',st==='playing'?'true':'false');var z=b.dataset.part==='cn',L=st==='playing'?(z?'\u6682\u505C':'Pause'):st==='paused'?(z?'\u7EE7\u7EED\u64AD\u653E':'Resume'):b.dataset.label;b.setAttribute('aria-label',L);b.title=L;}function stopTeachAudio(){var c=_tp;if(!c)return;_tp=null;try{if(c.audio){c.audio.onended=c.audio.onerror=c.audio.ontimeupdate=null;c.audio.pause();}}catch(e){}if(c.mode==='tts'){try{speechSynthesis.cancel();}catch(e){}}_tpSet(c.btn,'idle');}function _tpFallback(btn){try{var u=new SpeechSynthesisUtterance(btn.dataset.text||'');u.lang=btn.dataset.lang||'en-US';var cur={btn:btn,mode:'tts'};_tp=cur;u.onend=u.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');}};_tpSet(btn,'playing');speechSynthesis.speak(u);}catch(e){}}function playTeachAudio(btn){if(_tp&&_tp.btn===btn){if(_tp.mode==='audio'){var a0=_tp.audio;if(a0.paused){var p0=a0.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}

function nextQuestion(){const list=quizzes[activeTab];if(qIndex[activeTab]<list.length-1){qIndex[activeTab]++;renderPanel();return}completed[activeTab]=true;if(activeTab==="comprehension")activeTab="grammar";else if(activeTab==="grammar")activeTab="vocabulary";else{return showCompletion()}setTabs();renderPanel()}

function saveProgress(){try{localStorage.setItem("les-the-invitation-i-folded-twice-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-invitation-i-folded-twice"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-invitation-i-folded-twice",bookTitle:"The Invitation I Folded Twice",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

let preferredVoice=null;
