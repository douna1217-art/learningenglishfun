 16px;display:flex;align-items:center;gap:14px;box-shadow:0 14px 38px rgba(111,74,182,.24);border:1px solid rgba(255,255,255,.32)}.evidence-banner strong{text-shadow:0 1px 6px rgba(60,35,110,.35)}.evidence-banner span{font-size:.84rem;color:#fff}.evidence-banner button{border:0;border-radius:10px;padding:9px 12px;background:rgba(255,255,255,.92);color:var(--purple);font-weight:950;cursor:pointer}.footer{text-align:center;color:var(--muted);font-size:.8rem;padding:13px}

<script>

const pages=[{"type": "cover", "title": "The Robot Who Collected Questions", "subtitle": "An Answer Can Close a Box; a Question Can Open a Door.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-robot-who-collected-questions-assets/cover.jpg"}, {"text": "1. Q-7 Arrives\nThe new classroom robot was built to answer questions. Q-7 rolled between desks, scanned library databases, and displayed clear explanations on its screen. Jin tested it with the distance to Mars, the number of bones in a human hand, and the inventor of the zipper.\nBy lunch, every answer sounded ordinary. Then Q-7 stopped beside a wilted windowsill plant. “Why does this leaf lean away from the glass?” it asked. No one had programmed the robot to ask students anything. Jin looked at Ms. Rivera, who looked equally surprised.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-robot-who-collected-questions-assets/page1.jpg"}, {"text": "2. The Question Drawer\nQ-7 began collecting questions it could not answer immediately. Why did the hallway sound louder on rainy days? Why did two identical paper airplanes curve in opposite directions? Its screen filled with question cards faster than the class could investigate them.\nJin wanted Q-7 to return to useful answers. He opened the robot's question menu with Ms. Rivera's permission and tried sorting the cards into a trash folder. Q-7 rolled backward. “Unanswered does not mean unhelpful,” it said. Ms. Rivera asked Jin to choose one card before deleting any.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-robot-who-collected-questions-assets/page2.jpg"}, {"text": "3. The Crooked Airplanes\nJin chose the airplane question because it seemed easiest. He folded two planes from the same paper and launched them along a marked indoor test lane. One curved left. The other dipped. Q-7 measured the flights, but its numbers did not explain the difference.\nThe class compared the folds and found a tiny uneven crease on one wing. They rebuilt the planes, changed one feature at a time, and tested again. Some results matched; others did not. Jin discovered that the question did not block the work. It organized the work.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-robot-who-collected-questions-assets/page3.jpg"}, {"text": "4. A Machine That Could Wonder\nNews of Q-7's questions reached the school technology team. They explained that the robot had been designed to identify gaps between its information and new observations. It did not wonder exactly as a person did, but its question feature helped people notice uncertainty.\nJin felt relieved and disappointed at once, because the real explanation was less dramatic than he had imagined. He had imagined a machine becoming magically curious. The real explanation still gave the class a powerful tool. Q-7 could detect a gap. Students still had to decide which questions mattered and how to investigate them responsibly.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-robot-who-collected-questions-assets/page4.jpg"}, {"text": "5. Too Many Doors\nSoon, students added their own questions. The collection grew to nine hundred cards. Some repeated. Some were too broad to test in class. Jin could not find the airplane results under the pile. A room full of open doors was not useful if no one could reach them.\nThe class created categories: observe now, research safely, ask an expert, and save for later. They combined duplicates and recorded why a question mattered. Q-7 stopped counting the total and began showing connections between cards. The collection became smaller, clearer, and more inviting.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-robot-who-collected-questions-assets/page5.jpg"}, {"text": "6. Question Day\nAt the school showcase, other classes expected Q-7 to perform a rapid-answer game. Instead, Jin displayed the crooked paper airplanes and asked visitors what they would test next. Children examined wing length, paper weight, and launch angle.\nQ-7 supplied facts when students needed them, but it did not choose the investigation. One visitor asked whether a heavier plane always flew farther. Jin almost answered from memory. Then he handed her two kinds of paper and said, “Let's make the question smaller enough to test.”", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-robot-who-collected-questions-assets/page6.jpg"}, {"text": "7. The Card Jin Kept\nAt year's end, Q-7's collection moved to the school archive. Jin saved one card: Why did he once think answers were more useful than questions? No database could measure every reason. He wrote that answers felt fast and certain, while questions sometimes made him feel unfinished.\nHe placed the card above his desk. Below it, he left space for evidence he had not noticed yet. Q-7 gave a cheerful chime. “Collection active,” it said. Jin smiled. For once, he did not hurry to close the door.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-robot-who-collected-questions-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What was Q-7 originally built to do?", "choices": ["Answer questions using library databases", "Water plants", "Fold paper airplanes"], "answer": 0, "evidencePage": 1, "hint": "Look at chapter 1.", "explain": "The new classroom robot was built to answer questions, scanning library databases."}, {"q": "What question did Q-7 ask that no one had programmed it to ask?", "choices": ["What is the distance to Mars?", "Why does this leaf lean away from the glass?", "Who invented the zipper?"], "answer": 1, "evidencePage": 1, "hint": "Look at chapter 1.", "explain": "Q-7 stopped beside a wilted windowsill plant and asked why the leaf leaned away from the glass."}, {"q": "What did the class discover was different between the two paper airplanes?", "choices": ["One was made of thicker paper", "One was folded by a robot", "A tiny uneven crease on one wing"], "answer": 2, "evidencePage": 3, "hint": "Look at chapter 3.", "explain": "The class compared the folds and found a tiny uneven crease on one wing."}, {"q": "What did the school technology team explain about Q-7?", "choices": ["It was designed to identify gaps between its information and new observations", "It had become magically curious like a person", "It could not actually ask any questions"], "answer": 0, "evidencePage": 4, "hint": "Look at chapter 4.", "explain": "The robot had been designed to identify gaps between its information and new observations."}, {"q": "What is the big idea of this story?", "choices": ["Questions are never as useful as answers", "An answer can close a box; a question can open a door", "Robots should never be allowed to ask questions"], "answer": 1, "evidencePage": 7, "hint": "Look at the last chapter.", "explain": "Jin realized answers felt fast and certain, while questions opened up new places to look."}], "grammar": [{"q": "“Q-7 rolled backward. 'Unanswered does not mean unhelpful,' it said, ___ Ms. Rivera asked Jin to choose one card before deleting any.” Which word shows the result?", "choices": ["so", "but", "because"], "answer": 0, "evidencePage": 2, "hint": "This word shows what Ms. Rivera did as a result.", "explain": "“So” shows Ms. Rivera's request happened as a result of Q-7's response.", "teach": "<b>X, so Y</b> shows Y is a <b>result</b> of X.<span class='cn'><b>so</b>(所以)表示Y是X的<b>结果</b>。</span>"}, {"q": "“Jin felt relieved and disappointed at once, ___ the real explanation was less dramatic.” Which word shows the reason?", "choices": ["so", "because", "and"], "answer": 1, "evidencePage": 4, "hint": "This word shows the reason for his mixed feelings.", "explain": "“Because” shows the reason Jin felt both relieved and disappointed.", "teach": "<b>X, because Y</b> shows Y is the <b>reason</b> for X.<span class='cn'><b>because</b>(因为)表示Y是X的<b>原因</b>。</span>"}, {"q": "“Q-7 supplied facts when students needed them, ___ it did not choose the investigation.” Which word shows contrast?", "choices": ["so", "because", "but"], "answer": 2, "evidencePage": 6, "hint": "This word contrasts supplying facts with not directing the work.", "explain": "“But” contrasts Q-7 supplying facts with it not choosing the investigation itself.", "teach": "<b>But</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>but</b>(但是)表示两个事实之间的<b>对比</b>。</span>"}], "vocabulary": [{"q": "‘Database’ means ___.", "choices": ["an organized collection of information stored for searching", "a type of paper airplane", "a type of classroom robot"], "answer": 0, "evidencePage": 1, "hint": "Look at chapter 1.", "explain": "Q-7 scanned library databases to find its answers."}, {"q": "‘Uncertainty’ means ___.", "choices": ["being completely sure about everything", "not being sure or certain about something", "a type of question card"], "answer": 1, "evidencePage": 4, "hint": "Look at chapter 4.", "explain": "Q-7's question feature helped people notice uncertainty—gaps in what they knew."}, {"q": "‘Investigation’ means ___.", "choices": ["a random guess with no evidence", "a type of database", "a careful search for facts to understand something"], "answer": 2, "evidencePage": 3, "hint": "Look at chapter 3.", "explain": "Jin discovered that the question organized the class's investigation of the airplanes."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(database|uncertainty|investigation)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 4 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function saveProgress(){try{localStorage.setItem("les-the-robot-who-collected-questions-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-robot-who-collected-questions"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-robot-who-collected-questions",bookTitle:"The Robot Who Collected Questions",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.
