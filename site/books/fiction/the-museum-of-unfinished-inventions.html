<script>

const pages=[{"type": "cover", "title": "The Museum of Unfinished Inventions", "subtitle": "Every Almost-Finished Idea Is Still Asking a Question.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-museum-of-unfinished-inventions-assets/cover.jpg"}, {"text": "1. The Door Behind the Rain\nRain drummed on the museum roof while Tessa waited for her aunt to finish cataloging pottery. She liked machines better than bowls. Machines promised motion, noise, and answers. At the end of a dim hallway, she noticed a narrow brass door she had never seen before. Its handle was shaped like a question mark.\nInside, lamps glowed over crooked shelves. A metal bird had only one wing. An umbrella opened whenever the room became perfectly dry. A clock with glass sails ticked without showing the time. A silver sign above the gallery read, THE MUSEUM OF UNFINISHED INVENTIONS. Tessa leaned closer. The clock gave a hopeful little click.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-museum-of-unfinished-inventions-assets/page1.jpg"}, {"text": "2. A Room Full of Almost\nThe curator, Mr. Vale, appeared from behind a cabinet. He explained that inventors had donated ideas they could not—or chose not to—finish. “Almost is useful,” he said. “It shows where thinking changed.” Tessa disagreed. At school, unfinished work usually meant a missing assignment.\nThe wind clock fascinated her most. Its paper sails turned when she breathed on them, but a small empty peg waited between two gears. Tessa imagined adding one perfect piece and unveiling the clock to a cheering crowd. Mr. Vale let her study it at a worktable, as long as she used only the loose practice parts and changed nothing permanent.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-museum-of-unfinished-inventions-assets/page2.jpg"}, {"text": "3. The Perfect Gear\nTessa tried a copper gear from the practice tray. It fit the empty peg exactly. When she turned the clock's small fan, the sails flashed, the gears raced, and every paper label in the room lifted into a swirling storm. The one-winged bird spun in a circle. The dry-weather umbrella snapped open and bumped a lamp shade.\nMr. Vale switched off the fan. Nothing was broken, but Tessa's cheeks burned. “It fit,” she muttered. “Fit is not the same as purpose,” he replied. Together they returned every label to its shelf. Tessa looked again at the empty peg. Perhaps it was not simply waiting for her answer.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-museum-of-unfinished-inventions-assets/page3.jpg"}, {"text": "4. The Question in the Notebook\nIn a drawer beneath the clock, Tessa found the inventor's notebook. The first sketches showed a clock face. Later pages crossed it out. New drawings compared wide sails, narrow sails, gentle breezes, and sharp gusts. Beside the empty peg, the inventor had drawn three different gears, then a simple arrow pointing toward the window.\nTessa reread the pages. The machine had begun as a clock, but the inventor's question had changed. She had wanted to make invisible wind easier to notice. A gear that forced the sails to move at one speed would hide the very difference she hoped to show. The missing piece might be missing on purpose.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-museum-of-unfinished-inventions-assets/page4.jpg"}, {"text": "5. A Reversible Idea\nInstead of completing the clock, Tessa built a removable paper vane. It clipped beside the sails and pointed to a colored arc when the breeze shifted. A soft breath moved it a little; the fan moved it much farther. She recorded both results, then unclipped the vane so the original invention remained unchanged.\nMr. Vale tested the device and smiled. “You did not answer every question, but you made the next question easier to see,” he said. Tessa added a sketch of a lighter vane that might respond to smaller breaths. For once, the blank space on the page did not bother her. It felt like an invitation.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-museum-of-unfinished-inventions-assets/page5.jpg"}, {"text": "6. The New Exhibit\nThe following Saturday, the museum opened the gallery to visitors. Tessa expected people to hurry past the incomplete machines. Instead, children argued cheerfully about the bird's second wing. An engineer wondered whether the strange umbrella could water seedlings. A toddler made the wind clock's sails tremble with a laugh.\nTessa demonstrated her removable vane, including the gear that had failed. She explained what the notebook had taught her and asked visitors to sketch a next step. Soon the wall filled with careful guesses, wild possibilities, and questions no one had asked before. The unfinished room seemed more alive than any polished display.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-museum-of-unfinished-inventions-assets/page6.jpg"}, {"text": "7. Not Finished Yet\nBefore closing, Mr. Vale offered Tessa a blank exhibit card. She wrote a new heading: NEXT QUESTION. Under it, she drew the wind clock and three paths its inventor might have explored. She left room for a fourth path, then placed the card beside the glass sails.\nOn the way out, Tessa passed the one-winged bird. She no longer saw a failure waiting to be repaired. She saw choices, tests, and a story still moving. Outside, the rain had stopped, but drops kept sliding from the roof in different rhythms. Tessa opened her notebook. She was not finished listening yet.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-museum-of-unfinished-inventions-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did Tessa notice at the end of a dim hallway?", "choices": ["A pottery display", "A staircase to the roof", "A narrow brass door with a handle shaped like a question mark"], "answer": 2, "evidencePage": 1, "hint": "Look at chapter 1.", "explain": "She noticed a narrow brass door with a handle shaped like a question mark."}, {"q": "What happened when Tessa fit the copper gear into the empty peg?", "choices": ["The sails flashed, the gears raced, and paper labels lifted into a storm", "The clock stopped completely", "Nothing happened at all"], "answer": 0, "evidencePage": 3, "hint": "Look at chapter 3.", "explain": "The sails flashed, the gears raced, and every paper label lifted into a swirling storm."}, {"q": "What did Tessa discover in the inventor's notebook?", "choices": ["Instructions for finishing the clock exactly as planned", "The inventor's question had changed from making a clock to showing invisible wind", "A completely unrelated invention"], "answer": 1, "evidencePage": 4, "hint": "Look at chapter 4.", "explain": "The inventor's question had changed—she wanted to make invisible wind easier to notice."}, {"q": "What did Tessa build instead of completing the clock?", "choices": ["A brand new one-winged bird", "A working umbrella", "A removable paper vane that pointed to a colored arc in the breeze"], "answer": 2, "evidencePage": 5, "hint": "Look at chapter 5.", "explain": "She built a removable paper vane that clipped beside the sails and pointed to a colored arc."}, {"q": "What is the big idea of this story?", "choices": ["Every invention must be completed to be useful", "Unfinished things should always be thrown away", "Every almost-finished idea is still asking a question"], "answer": 2, "evidencePage": 7, "hint": "Look at the last chapter.", "explain": "Tessa saw choices, tests, and a story still moving—not a failure waiting to be repaired."}], "grammar": [{"q": "“'Almost is useful,' he said, ___ it shows where thinking changed.” Which word shows the reason?", "choices": ["so", "but", "because"], "answer": 2, "evidencePage": 2, "hint": "This word shows the reason almost is useful.", "explain": "“Because” shows the reason: it shows where thinking changed.", "teach": "<b>X, because Y</b> shows Y is the <b>reason</b> for X.<span class='cn'><b>because</b>(因为)表示Y是X的<b>原因</b>。</span>"}, {"q": "“Nothing was broken, ___ Tessa's cheeks burned.” Which word shows contrast?", "choices": ["but", "so", "because"], "answer": 0, "evidencePage": 3, "hint": "This word contrasts nothing being broken with her embarrassment.", "explain": "“But” contrasts nothing being broken with Tessa still feeling embarrassed.", "teach": "<b>But</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>but</b>(但是)表示两个事实之间的<b>对比</b>。</span>"}, {"q": "“You did not answer every question, ___ you made the next question easier to see.” Which word shows contrast?", "choices": ["so", "but", "because"], "answer": 1, "evidencePage": 5, "hint": "This word contrasts not answering with still being helpful.", "explain": "“But” contrasts not answering the question with still making progress.", "teach": "<b>But</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>but</b>(但是)表示两个事实之间的<b>对比</b>。</span>"}], "vocabulary": [{"q": "‘Curator’ means ___.", "choices": ["a type of clock", "a type of gear", "a person who manages and organizes items in a museum"], "answer": 2, "evidencePage": 2, "hint": "Look at chapter 2.", "explain": "The curator, Mr. Vale, explained that inventors had donated ideas to the museum."}, {"q": "‘Invention’ means ___.", "choices": ["something newly created or designed, often to solve a problem", "a broken machine with no purpose", "a type of rain"], "answer": 0, "evidencePage": 1, "hint": "Look at chapter 1.", "explain": "The gallery held many unfinished inventions—new ideas that were never fully completed."}, {"q": "‘Purpose’ means ___.", "choices": ["a random accident", "the reason something exists or is made", "a type of notebook"], "answer": 1, "evidencePage": 3, "hint": "Look at chapter 3.", "explain": "“Fit is not the same as purpose,” Mr. Vale said."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(curator|invention|purpose)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 4 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}
