</b> 表示“相反”,所以 <b>unfold=打开</b>。<b>fold again</b> 是再折(意思相反);<b>throw</b> 无关。</span>"},{"q":"“What a ___ day!” Which word means ‘full of wonder’?","choices":["wonderful","wonder","wondered"],"answer":0,"evidencePage":6,"hint":"Which word ends in -ful?","explain":"“Wonderful” = wonder + -ful, meaning full of wonder.","teach":"<b>wonderful</b> (wonder + -ful) = full of wonder → describes the day (adjective). <b>wonder</b> is the base word. <b>wondered</b> is past tense (an action).<span class='cn'><b>wonderful</b>(wonder+-ful)=充满惊奇→形容 day(形容词);<b>wonder</b> 是词根;<b>wondered</b> 是过去式(动作)。</span>"}],"vocabulary":[{"q":"To “imagine” means to ___.","choices":["make pictures and pretend in your mind","eat a snack","take a nap"],"answer":0,"evidencePage":2,"hint":"What is the child doing with the box?","explain":"To imagine means to make pictures in your mind and pretend."},{"q":"“Empty” means ___.","choices":["nothing inside","full to the top","very heavy"],"answer":0,"evidencePage":1,"hint":"What is in the box at the start?","explain":"Empty means there is nothing inside."},{"q":"“Cozy” means ___.","choices":["warm and comfy","cold and wet","loud and busy"],"answer":0,"evidencePage":5,"hint":"How does the little house feel?","explain":"Cozy means warm, snug, and comfy."}]};
