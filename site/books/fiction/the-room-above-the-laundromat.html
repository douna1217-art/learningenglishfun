<script>/*les-speech-shim*/
(function(){var w=window,ok=false,errs=[];
/* Some Android in-app browsers (UC/Quark and other vendor kernels, older WebViews) have no
   speechSynthesis at all. The page script calls it while loading, so it stopped there and the
   story was never drawn (the quiz still worked because its handlers were bound earlier).
   Give such browsers a silent stand-in so the rest of the page runs normally. */
try{ok=typeof w.speechSynthesis==="object"&&w.speechSynthesis!==null}catch(e){}
if(typeof w.SpeechSynthesisUtterance!=="function"&&typeof w.SpeechSynthesisUtterance!=="object"){
w.SpeechSynthesisUtterance=function(t){this.text=t==null?"":String(t);this.lang="";this.rate=1;this.pitch=1;this.volume=1;this.voice=null}}
if(!ok){var gen=0,told=false;
w.speechSynthesis={speaking:false,paused:false,pending:false,
getVoices:function(){return[]},cancel:function(){gen++},pause:function(){},resume:function(){},
addEventListener:function(){},removeEventListener:function(){},
speak:function(u){var g=gen;
if(!told&&typeof w.setStatus==="function"){told=true;try{w.setStatus("This browser can't read aloud, but you can still read and practice. 当前浏览器不支持朗读，仍可阅读和做题。",false)}catch(e){}}
setTimeout(function(){if(g===gen&&u&&u.onstart){try{u.onstart({})}catch(e){}}},0);
setTimeout(function(){if(g===gen&&u&&u.onend){try{u.onend({})}catch(e){}}},Math.max(600,String(u&&u.text||"").length*60))}}}
/* If the story still is not drawn after loading, say why on the page itself, so a screenshot
   from a phone we cannot test on shows the cause. */
w.addEventListener("error",function(e){try{if(errs.length<3)errs.push(String(e&&e.message||e))}catch(x){}});
w.addEventListener("load",function(){try{var v=document.getElementById("pageView");
if(v&&!v.firstChild&&errs.length){var d=document.createElement("div"),s=document.createElement("small");
d.style.cssText="padding:24px;color:#b91c1c;font:15px/1.6 sans-serif";
d.appendChild(document.createTextNode("The story could not be shown in this browser. 此浏览器暂时无法显示故事。"));
d.appendChild(document.createElement("br"));s.textContent=errs.join(" | ");d.appendChild(s);v.appendChild(d)}}catch(x){}});
})();

<script>

const pages=[{"type": "cover", "title": "The Room Above the Laundromat", "subtitle": "As Her Grandmother’s Laundromat Closes, Clara Learns That Keeping a Place Is Different From Keeping What It Meant", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-room-above-the-laundromat-assets/cover.jpg"}, {"text": "1. The Box Marked Keep\nClara brought the largest box she could find. By Friday, Nani's laundromat would close, and the room above it had to be emptied. Her grandmother was retiring after thirty-one years of washing other people's clothes. Clara understood the retiring part. What she didn't understand was why Nani seemed so cheerful about packing away the room where Clara had eaten supper, finished homework, and waited out entire rainy afternoons.\nRavi carried a stack of smaller boxes to the table. He had promised to help until his afternoon shift began. Nani handed him a folded blanket and asked him to take it to her car. Clara stopped him. That blanket belonged on the green armchair, where it had always been. Nani said the chair would not fit in her apartment. Clara opened her large box anyway. She had decided that anything important would go in it, even if she couldn't explain important to anyone else.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-room-above-the-laundromat-assets/page1.jpg"}, {"text": "2. What the Chair Remembered\nAfter Ravi left, Clara sat in the armchair to prove it was still useful. One spring pressed through the cushion. She shifted sideways, the way she always did, and tucked her feet beneath her. Nani laughed. She remembered buying the chair from a neighbor because it was cheap, not because it was comfortable. Clara remembered Nani telling stories from that chair while the washing machines hummed through the floor.\n“Those were good evenings,” Nani said. “I was also too tired to stand.” Clara hadn't considered that both could be true. To her, the room had been a place where adults stopped rushing long enough to notice her. To Nani, it had sometimes been another hour between work and home. Clara pressed the armrest with her palm. A narrow tear opened under the fabric. She covered it with the blanket, annoyed that the chair had chosen this moment to take her grandmother's side.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-room-above-the-laundromat-assets/page2.jpg"}, {"text": "3. A Bag Under the Table\nUnder the table, Nani found a cloth bag containing walking shoes. They were almost new. Clara had never seen her wear them. Nani explained that she had bought them for a walking group several years earlier. The group met on Saturday mornings, which were the busiest mornings at the laundromat. Each week she meant to go the next time. Eventually she had put the shoes upstairs so she wouldn't keep tripping over them at home.\nClara took one shoe from the bag. Its sole had only a little dust along the edge. She had imagined retirement as a long stretch of missing things, the customers, the machines, this room. Nani had been imagining a Saturday she could use without calculating how many sheets would be waiting when she returned. Clara put the shoe back carefully. It was difficult to argue for keeping everything exactly the same while holding something that had hardly been allowed to begin.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-room-above-the-laundromat-assets/page3.jpg"}, {"text": "4. The Wrong Kind of Rescue\nWhen Ravi returned, Clara asked whether they could move the green chair into his room. He pointed out that his desk already blocked half the cupboard. She suggested the hallway. He asked how anyone would reach the front door. His answers were sensible, which made them harder to listen to. Clara said that nobody else cared what happened to the room. Ravi stopped folding the box he was holding.\nHe told her he had spent hours up here wishing their grandmother could come home before he fell asleep. He liked the stories too. He simply didn't want to save the waiting that surrounded them. Clara stared at the floorboards. She had been treating the chair as proof that she remembered something the others had forgotten. Ravi remembered it perfectly. His memories were not less accurate because he didn't want to furnish his bedroom with them.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-room-above-the-laundromat-assets/page4.jpg"}, {"text": "5. A Smaller Request\nNani came upstairs carrying three cups of tea on a tray. They sat around the table, and Clara finally asked what she had meant to ask all morning. Where would they go on rainy afternoons now? Nani looked surprised. Clara had been talking about a chair, a blanket, and a room. She hadn't mentioned being afraid that there would be nowhere to wait for someone who had time for her.\n“You can come to my apartment,” Nani said. “I expect it will be quieter without six machines trying to join the conversation.” They could not meet every afternoon. Nani wanted some time for her walking group, and Clara had activities of her own. They chose Thursday suppers instead. It sounded smaller than having a room that was always available. Then Clara realized that on Thursdays, Nani would actually be waiting for them, rather than working until there was time left over.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-room-above-the-laundromat-assets/page5.jpg"}, {"text": "6. One Photograph\nBefore they moved anything else, Clara asked for one photograph of the room. She did not tidy the boxes out of sight. She wanted the picture to include this afternoon, when the room was changing, as well as the years she had liked it best. Ravi stood beside Nani at the window. Clara took the photograph with the table and armchair in the foreground, then asked Ravi to take one with her in it too.\nThey kept the blanket, the wooden tray, and a small lamp Nani wanted for reading. The chair went to a furniture repair shop that collected worn pieces and restored them. Clara watched two workers carry it out, keeping their path clear. She felt sad without feeling cheated. The chair had not become worthless. It simply wasn't the only place where her family could sit and tell the truth about how tired they had been.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-room-above-the-laundromat-assets/page6.jpg"}, {"text": "7. The First Thursday\nThe following Thursday, Clara reached Nani's apartment carrying bread. The cream blanket lay across a different chair. On the table, the familiar tray held three empty cups, waiting to be filled after supper. Nani had been out walking that morning. She described a steep little hill as if she had climbed a mountain, and Ravi asked whether she intended to conquer the entire neighborhood before winter. Nani said she hadn't ruled it out.\nAfter they ate, Clara showed them the photographs. In one, the old room looked smaller than she remembered. In another, Nani was laughing at something outside the frame. Clara couldn't recall what had been funny. She asked, and Ravi began an explanation that Nani immediately corrected. Rain tapped the apartment window. Clara set the phone down. For once, she didn't mind missing the exact version. She wanted to hear what happened when each of them tried to tell it.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-room-above-the-laundromat-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "Why was the room above the laundromat being emptied?", "choices": ["Clara was moving away", "Nani was retiring after thirty-one years, and the laundromat would close on Friday", "The building was being sold to a store"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Her grandmother was retiring after thirty-one years, and by Friday the laundromat would close."}, {"q": "What did Clara learn about the green armchair?", "choices": ["Nani had always hated it", "It was brand new", "Nani had bought it because it was cheap, and the good evenings had also been tiring ones"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Nani said she had bought it cheap, and that those were good evenings, but she was also too tired to stand."}, {"q": "What was in the cloth bag under the table?", "choices": ["Old laundry", "A set of keys", "Nearly new walking shoes Nani had bought for a walking group"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Nani had bought the shoes for a walking group that met on Saturday mornings, the busiest mornings at the laundromat."}, {"q": "Why did Ravi not want to keep the chair?", "choices": ["He did not like the color", "He did not want to save the waiting, because he had spent hours up there wishing his grandmother would come home", "It was too heavy"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "He said he liked the stories too, but he did not want to save the waiting that surrounded them."}, {"q": "What did Nani and Clara decide to do instead of using the room?", "choices": ["Have Thursday suppers at Nani’s apartment", "Meet at the laundromat on Saturdays", "Rent another room"], "answer": 0, "evidencePage": 5, "hint": "Look at page 5.", "explain": "They chose Thursday suppers instead."}], "grammar": [{"q": "‘Neither of the boxes ___ big enough.’ Which verb matches the subject?", "choices": ["was", "are", "were"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "The word “neither” is singular, so the verb is “was”.", "teach": "The word <b>neither</b> is singular, so use <b>was</b>, like <b>Neither of the boxes was big enough</b>.<span class='cn'><b>neither</b> 是单数，所以用 <b>was</b>，比如 <b>Neither of the boxes was big enough</b>（两个箱子都不够大）。</span>"}, {"q": "What does the suffix ‘-ment’ do in the word ‘retirement’?", "choices": ["It turns the verb into a noun that names a state", "It makes the word mean the opposite", "It makes the word mean again"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Adding “-ment” to “retire” makes a noun for the state of being retired.", "teach": "The suffix <b>ment</b> can turn a verb into a noun, like <b>retire</b> and <b>retirement</b>.<span class='cn'>后缀 <b>ment</b> 可以把动词变成名词，比如 <b>retire</b> 变成 <b>retirement</b>（退休）。</span>"}, {"q": "‘She was annoyed that the chair had chosen this moment to take her grandmother’s side.’ What is the writer doing?", "choices": ["Telling a joke about furniture shopping", "Giving the chair a human choice to show how annoyed Clara felt", "Describing a real argument with the chair"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "A chair cannot choose sides, so the writer is using personification to show Clara’s feelings.", "teach": "<b>Personification</b> gives human actions to an object, like <b>the chair took her side</b>, to show a character’s feelings.<span class='cn'><b>拟人</b>把人的行为赋予物品，比如 <b>the chair took her side</b>（椅子站在她奶奶那一边），来表现人物的感受。</span>"}], "vocabulary": [{"q": "‘Retiring’ means ___.", "choices": ["moving to a new city", "going to bed early", "stopping work for good, usually because of age"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Her grandmother was retiring after thirty-one years of washing other people’s clothes."}, {"q": "‘Cheerful’ means ___.", "choices": ["happy and in a good mood", "very tired", "angry and loud"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "She didn’t understand why Nani seemed so cheerful about packing away the room."}, {"q": "‘Furnish’ means ___.", "choices": ["to clean a room", "to fill a room with furniture and other things", "to paint a wall"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "His memories were not less accurate because he didn’t want to furnish his bedroom with them."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(retiring|cheerful|furnish)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 6 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}var TEACH_ICONS='<svg class="ic i-spk" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.5v5h3.6l4.9 4.5V5L7.6 9.5H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.6 9.2a4 4 0 010 5.6M18.2 6.6a7.6 7.6 0 010 10.8"/></svg><svg class="ic i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></svg><svg class="ic i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 5.3v13.4c0 .8.9 1.3 1.6.8l9.6-6.7c.6-.4.6-1.2 0-1.6L9.8 4.5c-.7-.5-1.6 0-1.6.8z"/></svg>';var _tp=null;function _tpSet(b,st){if(!b)return;b.classList.toggle('is-playing',st==='playing');b.classList.toggle('is-paused',st==='paused');b.setAttribute('aria-pressed',st==='playing'?'true':'false');var z=b.dataset.part==='cn',L=st==='playing'?(z?'\u6682\u505C':'Pause'):st==='paused'?(z?'\u7EE7\u7EED\u64AD\u653E':'Resume'):b.dataset.label;b.setAttribute('aria-label',L);b.title=L;}function stopTeachAudio(){var c=_tp;if(!c)return;_tp=null;try{if(c.audio){c.audio.onended=c.audio.onerror=c.audio.ontimeupdate=null;c.audio.pause();}}catch(e){}if(c.mode==='tts'){try{speechSynthesis.cancel();}catch(e){}}_tpSet(c.btn,'idle');}function _tpFallback(btn){try{var u=new SpeechSynthesisUtterance(btn.dataset.text||'');u.lang=btn.dataset.lang||'en-US';var cur={btn:btn,mode:'tts'};_tp=cur;u.onend=u.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');}};_tpSet(btn,'playing');speechSynthesis.speak(u);}catch(e){}}function playTeachAudio(btn){if(_tp&&_tp.btn===btn){if(_tp.mode==='audio'){var a0=_tp.audio;if(a0.paused){var p0=a0.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}

function saveProgress(){try{localStorage.setItem("les-the-room-above-the-laundromat-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-room-above-the-laundromat"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-room-above-the-laundromat",bookTitle:"The Room Above the Laundromat",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

let preferredVoice=null;
