<script>

const pages=[{"type": "cover", "title": "The Rabbit Who Counted Every Favor", "subtitle": "A Helpful Rabbit Who Keeps a Book of Favors Learns Why Help Offered Without Asking Cannot Be Collected Later", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-rabbit-who-counted-every-favor-assets/cover.jpg"}, {"text": "1. An Orderly Kind of Kindness\nRowan kept a blue book beside his front door. He used it to record favors. Carrying Moss's firewood earned a mark. Finding Kit's missing spoon earned another. Rowan liked to see the marks collect. A useful rabbit, he believed, would never have to face a difficult afternoon alone. Somewhere in the village, somebody would always owe him help.\nHe had begun the book after spending a whole morning repairing a neighbor's shelf. When he needed help that evening, the neighbor had already gone fishing. Rowan had felt foolish for expecting him. The book seemed a sensible solution. It could remember what other creatures forgot. On Monday, he carried Moss's last three logs indoors, though Moss said he could manage. Rowan insisted. Moss thanked him. Rowan went home and added a mark.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-rabbit-who-counted-every-favor-assets/page1.jpg"}, {"text": "2. The Pan Kit Had Not Dropped\nOn Tuesday, Rowan found Kit carrying a baking pan from her oven to a shelf. He offered to take it. Kit said she had it balanced, but Rowan reached for the cool handles anyway. She stepped aside, and he set it on the shelf. He asked whether that had saved her some trouble. Kit said it had mainly saved her from being allowed to finish.\nRowan laughed because she seemed to be joking. He enjoyed Kit's jokes. He also enjoyed writing another mark when he got home. By Thursday, he had collected enough marks to feel that the village was practically holding up his roof. He decided to build a cover over his market stall before the next rain. It would take two neighbors, a ladder, and an afternoon. He opened his book to choose the neighbors.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-rabbit-who-counted-every-favor-assets/page2.jpg"}, {"text": "3. When the Marks Became a Request\nMoss could not come on Friday. His mother was arriving from the hills, and he had promised to meet her cart. Kit could not come either. She had baking orders to finish. Rowan explained that he was not asking for a favor. He was collecting favors he had already given. He brought out the blue book and showed them the marks.\nMoss asked whether they had agreed to help him build a stall cover. Rowan said the whole point of a favor was that you did not need an agreement. Kit pointed at the mark for her pan. She asked what would have happened if she had kept holding it. Rowan said he had only wanted to help. Nobody disputed that. But neither neighbor reached for the ladder, which was leaning against the stall as uselessly as a very tall fork.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-rabbit-who-counted-every-favor-assets/page3.jpg"}, {"text": "4. The Missing Side of the Page\nRowan went home angry. He looked through the book for creatures who had understood kindness properly. Then he remembered Kit lending him a bowl. There was no mark for that, because the book recorded only his own favors. Moss had once waited with him when a delivery cart failed to arrive. There was no mark for the waiting either. Rowan could not remember thanking him.\nHe tried to add their favors on the opposite page. Soon he was arguing with himself about whether waiting counted more than carrying wood. Did finding a spoon count if the spoon was on its usual hook? Did the pan count at all? The columns would not settle the questions. Outside, the first drops tapped his window. His stall still needed a cover. He put down the pencil and went to look for a piece of canvas.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-rabbit-who-counted-every-favor-assets/page4.jpg"}, {"text": "5. A Smaller Job\nKit found him at the stall, trying to tie the canvas over his goods. She offered to hold one corner while he secured the other. Rowan almost told her that this would clear one mark. Instead, he asked whether she had time. She said she had ten minutes before her next batch came out of the oven. Ten minutes would not build a roof. It would keep his baskets dry.\nThey worked quickly. When the canvas sagged, Kit moved a crate under the middle instead of fetching the ladder. The shelter looked nothing like Rowan's plan. It worked well enough for the night. Rowan thanked her. Then he apologized for taking her pan after she had said she could carry it. Kit said the pan had survived. She would prefer to carry it herself next time. Rowan said he would ask before reaching.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-rabbit-who-counted-every-favor-assets/page5.jpg"}, {"text": "6. Something They Could Agree On\nOn Saturday, Moss returned after seeing his mother settled. Rowan asked whether he would help put up two wooden supports the following afternoon. Moss asked how long it would take. Rowan said an hour, perhaps longer if the ground stayed wet. Moss had one hour. They agreed to stop then and finish another day if necessary. In return, Rowan would help move Moss's seed sacks on Monday.\nRowan wrote that arrangement in the blue book. This time, Moss watched while he wrote. It felt less grand than having a whole village in his debt. It was also easier to understand. On Sunday, they finished the supports just before the hour ended. Moss did not stay for the canvas. Rowan did not ask him to. He tied one edge himself and left the remaining edge folded until somebody had time to help.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-rabbit-who-counted-every-favor-assets/page6.jpg"}, {"text": "7. The Book Beside the Door\nBy Wednesday, the cover was finished. Kit came to inspect it and asked Rowan to pass a length of string from the counter. He handed it over without reaching for the book. Then he asked whether she wanted help carrying her bread to the stalls. She said no, but she would like him to keep the path clear. He moved his empty crates.\nThat evening, Rowan opened the blue book. It contained promises he had actually made, jobs he had agreed to do, and several old marks he no longer knew how to count. He crossed out the mark for Kit's pan. The book stayed beside the door. When Moss knocked to borrow a cup, Rowan lent him one. He wanted it back by supper, and said so. Moss said that was fine. Neither of them needed a pencil.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-rabbit-who-counted-every-favor-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "Why did Rowan start the blue book?", "choices": ["Because Kit asked him to", "A neighbor he had helped was gone when he needed help, so he wanted a book that remembered what others forgot", "To write stories"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "The book seemed a sensible solution because it could remember what other creatures forgot."}, {"q": "What happened when Rowan took the pan from Kit?", "choices": ["Kit said she had it balanced, and that he had mainly saved her from being allowed to finish", "The pan fell and broke", "Kit thanked him warmly"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Kit said it had mainly saved her from being allowed to finish."}, {"q": "How did Rowan explain his request on Friday?", "choices": ["He said he was not asking for a favor but collecting favors he had already given", "He said it was a game", "He said he would pay them"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Rowan explained that he was collecting favors he had already given."}, {"q": "What did Rowan realize while looking through the book?", "choices": ["The book had been lost", "It recorded only his own favors, with no mark for Kit’s bowl or Moss waiting with him", "Moss and Kit had taken it"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "There was no mark for Kit lending a bowl, because the book recorded only his own favors."}, {"q": "What agreement did Rowan and Moss make?", "choices": ["Moss would help for one hour, and Rowan would help move Moss’s seed sacks on Monday", "Moss would build the whole cover alone", "They agreed not to help each other again"], "answer": 0, "evidencePage": 6, "hint": "Look at page 6.", "explain": "Moss had one hour, and in return Rowan would help move Moss’s seed sacks."}], "grammar": [{"q": "‘___ Moss ___ Kit could come on Friday.’ Which pair of words belongs in the blanks?", "choices": ["Both, nor", "Either, nor", "Neither, nor"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Neither is paired with nor.", "teach": "Pair <b>neither</b> with <b>nor</b>, like <b>neither Moss nor Kit</b>.<span class='cn'><b>neither</b> 要和 <b>nor</b> 搭配，比如 <b>neither Moss nor Kit</b>（莫斯和基特都不）。</span>"}, {"q": "‘The ladder was leaning against the stall as uselessly as a very tall fork.’ What does this comparison show?", "choices": ["That the ladder was not being used, which is funny", "That the stall was broken", "That the ladder was made of metal"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "A tall fork would be a silly tool, so the comparison jokes that the ladder was useless.", "teach": "A <b>simile</b> with <b>as</b> and <b>as</b> compares two things, like a ladder <b>as uselessly as a very tall fork</b>.<span class='cn'>用 <b>as</b> 和 <b>as</b> 做的比较是明喻，比如梯子 <b>as uselessly as a very tall fork</b>（像一把很高的叉子一样没用）。</span>"}, {"q": "The suffix ‘-ment’ turns a verb into a noun. What does ‘agreement’ name?", "choices": ["A kind of fork", "A very large village", "The act or result of agreeing"], "answer": 2, "evidencePage": 6, "hint": "Look at page 6.", "explain": "Agree is a verb, and agreement is the noun for what two people reach.", "teach": "The suffix <b>ment</b> turns a verb into a noun, so <b>agree</b> becomes <b>agreement</b>.<span class='cn'>后缀 <b>ment</b> 把动词变成名词，所以 <b>agree</b> 变成 <b>agreement</b>。</span>"}], "vocabulary": [{"q": "‘Insisted’ means ___.", "choices": ["forgot completely", "demanded firmly that something happen", "quietly gave up"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Moss said he could manage. Rowan insisted."}, {"q": "‘Agreement’ means ___.", "choices": ["a loud argument", "a shared understanding or deal", "a kind of weather"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Moss asked whether they had agreed to help him build a stall cover."}, {"q": "‘Debt’ means ___.", "choices": ["a spare coin", "a type of ladder", "something you owe to someone"], "answer": 2, "evidencePage": 6, "hint": "Look at page 6.", "explain": "It felt less grand than having a whole village in his debt."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(insisted|agreement|debt)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 6 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();setListenActive(null);page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}
function selectAnswer(i){selections[activeTab+"-"+qIndex[activeTab]]=i;renderPanel()}
function showHint(){const item=quizzes[activeTab][qIndex[activeTab]];document.getElementById("feedback").innerHTML=`💡 ${item.hint}`}
function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}var TEACH_ICONS='<svg class="ic i-spk" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.5v5h3.6l4.9 4.5V5L7.6 9.5H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.6 9.2a4 4 0 010 5.6M18.2 6.6a7.6 7.6 0 010 10.8"/></svg><svg class="ic i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></svg><svg class="ic i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 5.3v13.4c0 .8.9 1.3 1.6.8l9.6-6.7c.6-.4.6-1.2 0-1.6L9.8 4.5c-.7-.5-1.6 0-1.6.8z"/></svg>';var _tp=null;function _tpSet(b,st){if(!b)return;b.classList.toggle('is-playing',st==='playing');b.classList.toggle('is-paused',st==='paused');b.setAttribute('aria-pressed',st==='playing'?'true':'false');var z=b.dataset.part==='cn',L=st==='playing'?(z?'\u6682\u505C':'Pause'):st==='paused'?(z?'\u7EE7\u7EED\u64AD\u653E':'Resume'):b.dataset.label;b.setAttribute('aria-label',L);b.title=L;}function stopTeachAudio(){var c=_tp;if(!c)return;_tp=null;try{if(c.audio){c.audio.onended=c.audio.onerror=c.audio.ontimeupdate=null;c.audio.pause();}}catch(e){}if(c.mode==='tts'){try{speechSynthesis.cancel();}catch(e){}}_tpSet(c.btn,'idle');}function _tpFallback(btn){try{var u=new SpeechSynthesisUtterance(btn.dataset.text||'');u.lang=btn.dataset.lang||'en-US';var cur={btn:btn,mode:'tts'};_tp=cur;u.onend=u.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');}};_tpSet(btn,'playing');speechSynthesis.speak(u);}catch(e){}}function playTeachAudio(btn){if(_tp&&_tp.btn===btn){if(_tp.mode==='audio'){var a0=_tp.audio;if(a0.paused){var p0=a0.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}
function returnToQuestion(){(function(){var b=document.getElementById("evidenceBanner");if(b&&b.parentNode)b.parentNode.removeChild(b);})();renderPanel();document.querySelector(".panel").scrollIntoView({behavior:"smooth",block:"start"})}
function nextQuestion(){const list=quizzes[activeTab];if(qIndex[activeTab]<list.length-1){qIndex[activeTab]++;renderPanel();return}completed[activeTab]=true;if(activeTab==="comprehension")activeTab="grammar";else if(activeTab==="grammar")activeTab="vocabulary";else{return showCompletion()}setTabs();renderPanel()}
function showCompletion(){completed.vocabulary=true;setTabs();const correct=Object.keys(selections).filter(k=>{const [tab,idx]=k.split('-');return selections[k]===quizzes[tab][+idx].answer}).length,total=Object.values(quizzes).reduce((a,b)=>a+b.length,0);document.getElementById("stagePill").textContent="Journey Complete";document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">Reading journey complete</div><h2>Wonderful work! 🎉</h2><p class="small">You finished Reading, Grammar, and Vocabulary.</p><div class="score-row"><div class="score-box"><b>${total}</b><br><span>Questions</span></div><div class="score-box"><b>${correct}</b><br><span>Correct now</span></div></div><div class="feedback good">You used evidence, practiced sentence skills, and learned new words.</div><button class="submit" onclick="restartPractice()">Practice Again</button></div>`}
function restartPractice(){activeTab="comprehension";qIndex={comprehension:0,grammar:0,vocabulary:0};selections={};attempts={};completed={comprehension:false,grammar:false,vocabulary:false};setTabs();renderPanel()}
function saveProgress(){try{localStorage.setItem("les-the-rabbit-who-counted-every-favor-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-rabbit-who-counted-every-favor"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-rabbit-who-counted-every-favor",bookTitle:"The Rabbit Who Counted Every Favor",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}
function clearHighlight(){document.querySelectorAll(".story-word.reading").forEach(x=>x.classList.remove("reading"))}
let preferredVoice=null;

<script>/*les-button-layout-js*/
