<script>/*les-speech-shim*/
(function(){var w=window,ok=false,errs=[];
/* Some Android in-app browsers (UC/Quark and other vendor kernels, older WebViews) have no
   speechSynthesis at all. The page script calls it while loading, so it stopped there and the
   story was never drawn (the quiz still worked because its handlers were bound earlier).
   Give such browsers a silent stand-in so the rest of the page runs normally. */
try{ok=typeof w.speechSynthesis==="object"&&w.speechSynthesis!==null}catch(e){}
if(typeof w.SpeechSynthesisUtterance!=="function"&&typeof w.SpeechSynthesisUtterance!=="object"){
w.SpeechSynthesisUtterance=function(t){this.text=t==null?"":String(t);this.lang="";this.rate=1;this.pitch=1;this.volume=1;this.voice=null}}
if(!ok){var gen=0,told=false;
w.speechSynthesis={speaking:false,paused:false,pending:false,
getVoices:function(){return[]},cancel:function(){gen++},pause:function(){},resume:function(){},
addEventListener:function(){},removeEventListener:function(){},
speak:function(u){var g=gen;
if(!told&&typeof w.setStatus==="function"){told=true;try{w.setStatus("This browser can't read aloud, but you can still read and practice. 当前浏览器不支持朗读，仍可阅读和做题。",false)}catch(e){}}
setTimeout(function(){if(g===gen&&u&&u.onstart){try{u.onstart({})}catch(e){}}},0);
setTimeout(function(){if(g===gen&&u&&u.onend){try{u.onend({})}catch(e){}}},Math.max(600,String(u&&u.text||"").length*60))}}}
/* If the story still is not drawn after loading, say why on the page itself, so a screenshot
   from a phone we cannot test on shows the cause. */
w.addEventListener("error",function(e){try{if(errs.length<3)errs.push(String(e&&e.message||e))}catch(x){}});
w.addEventListener("load",function(){try{var v=document.getElementById("pageView");
if(v&&!v.firstChild&&errs.length){var d=document.createElement("div"),s=document.createElement("small");
d.style.cssText="padding:24px;color:#b91c1c;font:15px/1.6 sans-serif";
d.appendChild(document.createTextNode("The story could not be shown in this browser. 此浏览器暂时无法显示故事。"));
d.appendChild(document.createElement("br"));s.textContent=errs.join(" | ");d.appendChild(s);v.appendChild(d)}}catch(x){}});
})();

<script>

const pages=[{"type": "cover", "title": "The Birthday Between Messages", "subtitle": "On a Ship Forty Minutes from Earth, Neri Turns a Delayed Birthday into a Story Shared Across Space", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-birthday-between-messages-assets/cover.jpg"}, {"text": "1. A Party Across the Distance\nNeri had saved the blue paper hat for her eleventh birthday. Her cousin Sol had made it before she boarded the Celandine, back when they could pass things across a table. Now his hands were far away on Earth. The ship's relay took twenty minutes to carry a message to him and twenty more to bring an answer back. Neri knew this. She had explained it to three younger children that very morning.\nKnowing it did not make the empty chair easier to see. Mom set a small cake on the cabin table and asked whether Neri wanted to invite the children next door. Later, Neri said. First she wanted the birthday she and Sol had always shared. She put the tablet in its stand, straightened the hat, and recorded a greeting. At ten o'clock, ship time, she sent it toward Earth.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-birthday-between-messages-assets/page1.jpg"}, {"text": "2. An Answer From Earlier\nThe first reply arrived at ten forty. Sol appeared wearing the ridiculous expression he always used before a joke. He wished Neri a happy birthday, asked whether the ship had invented flying cake, and held up a hat that matched hers. Neri laughed before she could stop herself. She asked which birthday he remembered best. His picture kept talking about cake. She asked again, more loudly, and then remembered to press record.\nShe sent the question. For a moment she kept her hand beside the tablet, waiting for him to answer. But Sol's recorded smile was the same smile each time she played it. He had made that message twenty minutes before she received it. He was not sitting inside the screen, listening. Neri removed her hat and set it beside the cake. Forty minutes felt different when there was a question inside it.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-birthday-between-messages-assets/page2.jpg"}, {"text": "3. The Birthday She Remembered\nWhile her question traveled, Neri cut one slice of cake. She remembered the year their picnic had been moved into a laundry room because of rain. Sol had turned an empty basket into a royal carriage. Neri had been the queen of the missing socks. At the time she had complained about the rain. Now she could remember almost every word of their absurd royal argument, but not the cake's flavor.\nShe recorded a second message describing the laundry-room kingdom. Then she stopped before sending it. Sol was already answering a different question, one he had not even received when she began remembering. If she kept sending whatever came into her head, their conversation would become a drawer full of tangled strings. She saved the recording instead. The slice on her plate had lost its neat point. She had eaten it without noticing.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-birthday-between-messages-assets/page3.jpg"}, {"text": "4. A Memory They Both Kept\nAt eleven twenty, Sol's answer to her first question arrived. His favorite birthday had been the one in the laundry room. He remembered the basket carriage, the argument about socks, and the moment Neri had declared a single red mitten to be the royal dragon. Neri leaned closer. She had forgotten the mitten. She played that part twice. Nothing new had happened in the cabin, yet it suddenly felt less empty.\nMom came back with two cups of juice. Neri told her about the mitten. Then she admitted that she had wanted Sol to be here, not simply to send an excellent account of being somewhere else. Mom did not tell her that messages were just as good. She sat in the empty chair and said she missed people too. They listened to the ship's quiet fans until Neri reached for her saved recording.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-birthday-between-messages-assets/page4.jpg"}, {"text": "5. A Game With Room to Travel\nNeri did not send the saved recording. Instead she recorded a proposal. They could make a story together, one piece at a time. Each person would add a problem and leave the next part unfinished. There would be room between the pieces for lunch, chores, or a walk. The waiting would belong to the game. She sent the invitation at noon, with no demand that Sol pretend to be present.\nWhile she waited, she took her cake to the children next door. One wanted the largest slice. Another wanted to know whether a spaceship could have a basement. Neri said their story might need one. By the time she returned, Sol's reply had arrived. He accepted the game on one condition. He wanted to be allowed at least one deeply unreasonable creature. Neri put the blue hat back on.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-birthday-between-messages-assets/page5.jpg"}, {"text": "6. The Captain of the Cupboard\nNeri arranged three wooden blocks in front of the tablet. They became a very small spaceship carrying a very important passenger, a captain who was afraid of cupboards. She gave the captain her blue hat. Unfortunately, the ship's only map was locked inside a cupboard. Neri stopped there, though she already had an idea about the key. She sent the beginning to Sol and left the tablet on its stand.\nShe helped Mom clear the plates. She folded the blanket on her bunk and borrowed a book from the reading shelf. Sometimes she forgot the message was traveling. Sometimes she remembered and wondered what Sol would do with her captain. By midafternoon, she had imagined six different answers. She hoped he would choose a seventh. The story had become a place she could visit without knowing everything inside it.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-birthday-between-messages-assets/page6.jpg"}, {"text": "7. An Unreasonable Creature\nSol's next message contained a cupboard with a tenant. A six-legged moth had rented it for the winter and would not surrender the map until someone repaired its squeaky door. Neri laughed so hard that Mom looked in. Sol had not chosen any of her six answers. He had also left her a problem. The captain could repair a door, but he would have to go near the cupboard first.\nNeri began a reply. Outside the round window, the stars looked as still as pinholes, though the ship kept moving. Her birthday had not become the old kind of birthday. Sol had missed the cake cutting, and she still wished he could sit in the chair beside her. But there would be another part of their story tomorrow. She set the blue hat on her head, faced the camera, and introduced a captain with a very long screwdriver.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-birthday-between-messages-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "Why did a message and its answer take about forty minutes?", "choices": ["Sol was sleeping", "The tablet was very slow", "The ship’s relay took twenty minutes each way"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "The relay took twenty minutes to carry a message to Earth and twenty more to bring an answer back."}, {"q": "What did Neri realize about Sol’s recorded smile?", "choices": ["He was playing a joke on her", "He was not listening inside the screen, since he had made it twenty minutes earlier", "He had forgotten her question"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Sol’s recorded smile was the same each time, and he had made that message before she received it."}, {"q": "What birthday did Neri remember?", "choices": ["A rainy picnic that moved into a laundry room, where a basket became a royal carriage", "A party on a boat", "A birthday at school"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "She remembered the year their picnic was moved into a laundry room, and Sol turned a basket into a royal carriage."}, {"q": "What did Neri tell Mom she had really wanted?", "choices": ["For Sol to be there, not just to send a message about being somewhere else", "A faster ship", "A bigger cake"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "She admitted she wanted Sol to be here, not simply to send an excellent account of being somewhere else."}, {"q": "What game did Neri propose to Sol?", "choices": ["Playing a guessing game with cards", "Making up a story together, one piece at a time", "Sending the same message every hour"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "She proposed making a story together, each person adding a problem and leaving the next part unfinished."}], "grammar": [{"q": "The Greek root ‘tele’ means ‘far’. Which word has the same root?", "choices": ["teacher", "tablet", "television"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "A television shows pictures from far away.", "teach": "The Greek root <b>tele</b> means far, like <b>television</b> and <b>telephone</b>.<span class='cn'>希腊词根 <b>tele</b> 表示“远”，比如 <b>television</b>（电视）和 <b>telephone</b>（电话）。</span>"}, {"q": "‘Their conversation would become a drawer full of tangled strings.’ What does this metaphor describe?", "choices": ["A confusing mess of messages", "A neat set of letters", "A drawer of sewing supplies"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Tangled strings are a picture of messages that get mixed up and hard to follow.", "teach": "A <b>metaphor</b> describes one thing as another, like <b>a drawer full of tangled strings</b> for a confusing mess.<span class='cn'><b>隐喻</b>把一件事物说成另一件事物，比如用 <b>a drawer full of tangled strings</b>（一抽屉缠在一起的线）形容一团乱。</span>"}, {"q": "Which sentence is capitalized correctly?", "choices": ["Neri asked Mom for juice, and her Mom said yes.", "Neri asked mom for juice, and her Mom said yes.", "Neri asked Mom for juice, and her mom said yes."], "answer": 2, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Capitalize Mom when it is used as a name, but not after a word like “her”.", "teach": "Capitalize <b>Mom</b> when it is used like a name, but write <b>her mom</b> in small letters.<span class='cn'><b>Mom</b> 当作称呼（像名字）时要大写，而 <b>her mom</b> 里的 mom 用小写。</span>"}], "vocabulary": [{"q": "‘Relay’ means ___.", "choices": ["a system that passes a message along", "a kind of race", "a game with blocks"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "The ship’s relay took twenty minutes to carry a message to him."}, {"q": "‘Recorded’ means ___.", "choices": ["told a story out loud", "saved sound or video to play later", "wrote a letter by hand"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "She put the tablet in its stand and recorded a greeting."}, {"q": "‘Proposal’ means ___.", "choices": ["a long delay", "a plan or idea offered for others to accept", "a sudden surprise"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Instead she recorded a proposal."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(relay|recorded|proposal)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 5 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}var TEACH_ICONS='<svg class="ic i-spk" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.5v5h3.6l4.9 4.5V5L7.6 9.5H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.6 9.2a4 4 0 010 5.6M18.2 6.6a7.6 7.6 0 010 10.8"/></svg><svg class="ic i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></svg><svg class="ic i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 5.3v13.4c0 .8.9 1.3 1.6.8l9.6-6.7c.6-.4.6-1.2 0-1.6L9.8 4.5c-.7-.5-1.6 0-1.6.8z"/></svg>';var _tp=null;function _tpSet(b,st){if(!b)return;b.classList.toggle('is-playing',st==='playing');b.classList.toggle('is-paused',st==='paused');b.setAttribute('aria-pressed',st==='playing'?'true':'false');var z=b.dataset.part==='cn',L=st==='playing'?(z?'\u6682\u505C':'Pause'):st==='paused'?(z?'\u7EE7\u7EED\u64AD\u653E':'Resume'):b.dataset.label;b.setAttribute('aria-label',L);b.title=L;}function stopTeachAudio(){var c=_tp;if(!c)return;_tp=null;try{if(c.audio){c.audio.onended=c.audio.onerror=c.audio.ontimeupdate=null;c.audio.pause();}}catch(e){}if(c.mode==='tts'){try{speechSynthesis.cancel();}catch(e){}}_tpSet(c.btn,'idle');}function _tpFallback(btn){try{var u=new SpeechSynthesisUtterance(btn.dataset.text||'');u.lang=btn.dataset.lang||'en-US';var cur={btn:btn,mode:'tts'};_tp=cur;u.onend=u.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');}};_tpSet(btn,'playing');speechSynthesis.speak(u);}catch(e){}}function playTeachAudio(btn){if(_tp&&_tp.btn===btn){if(_tp.mode==='audio'){var a0=_tp.audio;if(a0.paused){var p0=a0.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}
function returnToQuestion(){(function(){var b=document.getElementById("evidenceBanner");if(b&&b.parentNode)b.parentNode.removeChild(b);})();renderPanel();document.querySelector(".panel").scrollIntoView({behavior:"smooth",block:"start"})}
function nextQuestion(){const list=quizzes[activeTab];if(qIndex[activeTab]<list.length-1){qIndex[activeTab]++;renderPanel();return}completed[activeTab]=true;if(activeTab==="comprehension")activeTab="grammar";else if(activeTab==="grammar")activeTab="vocabulary";else{return showCompletion()}setTabs();renderPanel()}
function showCompletion(){completed.vocabulary=true;setTabs();const correct=Object.keys(selections).filter(k=>{const [tab,idx]=k.split('-');return selections[k]===quizzes[tab][+idx].answer}).length,total=Object.values(quizzes).reduce((a,b)=>a+b.length,0);document.getElementById("stagePill").textContent="Journey Complete";document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">Reading journey complete</div><h2>Wonderful work! 🎉</h2><p class="small">You finished Reading, Grammar, and Vocabulary.</p><div class="score-row"><div class="score-box"><b>${total}</b><br><span>Questions</span></div><div class="score-box"><b>${correct}</b><br><span>Correct now</span></div></div><div class="feedback good">You used evidence, practiced sentence skills, and learned new words.</div><button class="submit" onclick="restartPractice()">Practice Again</button></div>`}
function restartPractice(){activeTab="comprehension";qIndex={comprehension:0,grammar:0,vocabulary:0};selections={};attempts={};completed={comprehension:false,grammar:false,vocabulary:false};setTabs();renderPanel()}
function saveProgress(){try{localStorage.setItem("les-the-birthday-between-messages-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-birthday-between-messages"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-birthday-between-messages",bookTitle:"The Birthday Between Messages",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}
function clearHighlight(){document.querySelectorAll(".story-word.reading").forEach(x=>x.classList.remove("reading"))}
let preferredVoice=null;
