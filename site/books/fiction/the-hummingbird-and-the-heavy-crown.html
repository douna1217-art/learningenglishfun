<script>

const pages=[{"type": "cover", "title": "The Hummingbird and the Heavy Crown", "subtitle": "A Tiny Bird Discovers That Leadership Is Lighter When Responsibility Is Shared", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-hummingbird-and-the-heavy-crown-assets/cover.jpg"}, {"text": "1. The Crown From the Canyon\nAfter a storm, the animals found a golden crown wedged between stones. Coro the kingfisher placed it on his crest, and everyone agreed that its shine made him look like a leader.\nLuma noticed that the crown covered Coro's ears and pulled his head sideways. Still, the animals cheered whenever sunlight flashed from its blue stones.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-hummingbird-and-the-heavy-crown-assets/page1.jpg"}, {"text": "2. The Leader Who Could Not Listen\nA fallen branch blocked the spring, and mice asked for help. Coro could not hear them beneath the crown. When he bent to inspect the water, the heavy gold slipped over his eyes.\nSable lifted the crown and announced that a stronger animal should lead. The animals agreed, confusing strength with the ability to carry weight.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-hummingbird-and-the-heavy-crown-assets/page2.jpg"}, {"text": "3. Strength With a Narrow View\nSable wore the crown without stumbling. She ordered the rabbits to move the branch and the squirrels to gather food while she guarded the canyon path.\nFrom the path, Sable could not see that the branch was pinned beneath a rock. The harder the rabbits pushed, the tighter it stuck. Carrying the crown had not given her every point of view.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-hummingbird-and-the-heavy-crown-assets/page3.jpg"}, {"text": "4. The Smallest Voice\nLuma flew above the spring and saw a loose vine wrapped around the rock. She suggested pulling the vine while pushing the branch. Sable laughed that a bird lighter than a leaf could not advise a crowned leader.\nCoro listened from a low perch. He asked Luma to show what she saw. Her view did not supply all the strength, but it revealed where strength should be used.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-hummingbird-and-the-heavy-crown-assets/page4.jpg"}, {"text": "5. The Crown Falls\nSable tugged the vine alone to prove her power. The rock rolled free, the branch swung, and she leaped aside. The crown tumbled into the stream and lodged in the same narrow channel.\nWater rose behind it. Luma could reach the crown but could not lift it. Coro could lift one side but not both. Sable had strength, yet the slippery bank defeated her paws.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-hummingbird-and-the-heavy-crown-assets/page5.jpg"}, {"text": "6. A Circle Without a Throne\nLuma directed two birds to raise the crown, Sable to brace the branch, and rabbits to roll the freed rock. Together they cleared the spring without anyone standing above the others.\nThe animals melted no gold and chose no new ruler. They hung the heavy crown in a cave as a reminder that an object could display authority without providing wisdom.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-hummingbird-and-the-heavy-crown-assets/page6.jpg"}, {"text": "7. The Crown That Could Travel\nLuma wove a light circlet from fallen flowers. Whoever guided the next task could wear it, then pass it on when another creature's skill was needed.\nThe circlet fit no one perfectly and belonged to everyone. From then on, the canyon animals often said that a heavy crown asks others to carry its wearer, while a wise leader helps everyone carry the work.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-hummingbird-and-the-heavy-crown-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did the animals believe when Coro wore the crown?", "choices": ["That it would make him fly faster", "That its shine made him look like a leader", "That he had earned it through a contest"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "The animals cheered whenever sunlight flashed from the crown's blue stones, believing its shine made Coro look like a leader."}, {"q": "Why couldn't Coro help the mice at the spring?", "choices": ["The heavy crown covered his ears and slipped over his eyes", "He refused to help them on purpose", "He was too far away to hear them"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Coro could not hear the mice beneath the crown, and when he bent to inspect the water, the heavy gold slipped over his eyes."}, {"q": "Why couldn't Sable solve the problem even though she was strong?", "choices": ["She was too weak to move the branch", "From the path she guarded, she couldn't see that the branch was pinned beneath a rock", "She refused to try helping at all"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "From the path, Sable could not see that the branch was pinned beneath a rock, so pushing harder only made it stick tighter."}, {"q": "What did Luma see from above that helped solve the problem?", "choices": ["A loose vine wrapped around the rock that could be pulled while pushing the branch", "A second branch blocking the spring from another direction", "Nothing useful; her view added no new information"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Luma flew above and saw a loose vine wrapped around the rock, suggesting they pull it while pushing the branch — a view Sable could not see."}, {"q": "How did the animals finally clear the spring?", "choices": ["They gave up and left the spring blocked", "Sable did all the work alone to prove her strength", "Luma directed birds to raise the crown, Sable to brace the branch, and rabbits to roll the rock, working together"], "answer": 2, "evidencePage": 6, "hint": "Look at page 6.", "explain": "Luma directed different animals to different tasks based on their strengths, clearing the spring together without anyone standing above the others."}], "grammar": [{"q": "'Luma suggested pulling the vine ___ pushing the branch.' Which word shows two actions happening together?", "choices": ["unless", "so", "while"], "answer": 2, "evidencePage": 4, "hint": "This word shows two things happening at the same time.", "explain": "'While' shows the two actions — pulling the vine and pushing the branch — happening at the same time.", "teach": "<b>While</b> shows two things happening <b>at the same time</b>.<span class='cn'><b>while</b>表示两件事<b>同时</b>发生。</span>"}, {"q": "'Sable had strength, ___ the slippery bank defeated her paws.' Which word shows contrast?", "choices": ["but", "and", "so"], "answer": 0, "evidencePage": 5, "hint": "This word shows the second idea is different from what you might expect.", "explain": "'But' shows contrast: Sable was strong, yet the slippery bank still defeated her.", "teach": "<b>But</b> joins two ideas that are <b>different or surprising together</b>.<span class='cn'><b>but</b>用来连接两个<b>不同或令人意外</b>的想法。</span>"}, {"q": "Which sentence correctly uses parallel structure?", "choices": ["Luma directed two birds to raise the crown, bracing the branch was Sable's job, and rabbits to roll the rock.", "Luma directed two birds to raise the crown, Sable to brace the branch, and rabbits to roll the rock.", "Luma directed two birds raising the crown, Sable to brace the branch, and rabbits to roll the rock."], "answer": 1, "evidencePage": 6, "hint": "Each item in a list should use the same grammatical form.", "explain": "Each item follows the same pattern — an animal, then 'to' plus a verb — keeping the sentence parallel.", "teach": "Items in a <b>series</b> should use the <b>same grammatical form</b>, like matching verb phrases.<span class='cn'>一系列并列的项目应该使用<b>相同的语法形式</b>，比如动词短语要一致。</span>"}], "vocabulary": [{"q": "'Authority' means ___.", "choices": ["the power or right to lead or make decisions", "a prize given for winning a race", "a soft material used for decoration"], "answer": 0, "evidencePage": 6, "hint": "Look at page 6.", "explain": "The animals hung the crown in a cave as a reminder that an object could display authority — the appearance of power — without providing wisdom."}, {"q": "'Wisdom' means ___.", "choices": ["physical strength and speed", "a shiny, valuable material", "good judgment gained through experience"], "answer": 2, "evidencePage": 6, "hint": "Look at page 6.", "explain": "A crown could display authority without providing wisdom — the good judgment a true leader needs."}, {"q": "'Circlet' means ___.", "choices": ["a heavy metal crown with jewels", "a small, light ring worn on the head", "a tool used to measure distance"], "answer": 1, "evidencePage": 7, "hint": "Look at page 7.", "explain": "Luma wove a light circlet from fallen flowers, a small ring that could pass from one guide to the next."}]};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(authority|wisdom|circlet)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 5 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}
