<script>/*les-speech-shim*/
(function(){var w=window,ok=false,errs=[];
/* Some Android in-app browsers (UC/Quark and other vendor kernels, older WebViews) have no

   Give such browsers a silent stand-in so the rest of the page runs normally. */
try{ok=typeof w.speechSynthesis==="object"&&w.speechSynthesis!==null}catch(e){}
if(typeof w.SpeechSynthesisUtterance!=="function"&&typeof w.SpeechSynthesisUtterance!=="object"){

if(!ok){var gen=0,told=false;
w.speechSynthesis={speaking:false,paused:false,pending:false,
getVoices:function(){return[]},cancel:function(){gen++},pause:function(){},resume:function(){},
addEventListener:function(){},removeEventListener:function(){},
speak:function(u){var g=gen;
if(!told&&typeof w.setStatus==="function"){told=true;try{w.setStatus("This browser can't read aloud, but you can still read and practice. 当前浏览器不支持朗读，仍可阅读和做题。",false)}catch(e){}}

<script>

const pages=[{"type": "cover", "title": "The Week We Borrowed Comet", "subtitle": "A Week of Dog-Sitting Teaches Jules That a Friend Can Know You Without Belonging to You", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-week-we-borrowed-comet-assets/cover.jpg"}, {"text": "1. A Dog for Seven Days\nAunt Nora arrived on Saturday with Comet, a bag of dog food, and a green blanket that smelled faintly of her kitchen. She was going away for a week. I had already cleared a place beside my desk and made a list of things Comet and I would do. Dad said looking after a dog was not the same as ordering a perfect week. I said I knew. I had heard many useful sentences from adults and expected very few of them to become necessary.\nComet sniffed the dog bed I had arranged for him. Then he walked past it and lay on the small rug by the door. Aunt Nora laughed. She showed Dad where she had written the feeding instructions and thanked us both. I wanted her to see how well Comet liked me. He lifted his head when she spoke, but kept watching her bag. When she left, he stayed on the rug.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-week-we-borrowed-comet-assets/page1.jpg"}, {"text": "2. The Wrong Kind of Fetch\nOn Sunday morning, I tried teaching Comet to bring back a soft flying disc. He watched it land on the living-room carpet. I picked it up and threw it again. Comet yawned. Dad asked whether the game was meant to exercise the dog or me. I fetched the disc for a third time and decided that Comet was probably saving his strength for something impressive. Perhaps he would perform better outside, where he could see the importance of the occasion.\nBefore our walk, I found him sitting by the front door again. I sat beside him and told him about the park. There was grass, a wide path, and a drinking fountain shaped like a fish. He listened with the solemn attention of a dog considering a very dull speech. When Dad picked up the red leash, Comet stood at once. Apparently, Dad had expressed the same idea much more clearly.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-week-we-borrowed-comet-assets/page2.jpg"}, {"text": "3. The Green Gate\nWe took the long way to the park because Comet stopped at a green gate. He did not bark or drag me. He simply sat down and looked through the wooden slats. I thought he wanted something on the other side. Dad suggested waiting a moment. Soon an older woman came down the path carrying a watering can. She saw Comet and smiled. He stood up, his whole back end joining his tail in a wag.\nThe woman was Mrs. Ives. She and Aunt Nora often talked at the gate after their walks. When I explained that Nora was away, Mrs. Ives asked how Comet was settling in. I almost said he was not doing anything I had planned. Instead, I said he liked our door rug. She laughed and set down the can. Comet leaned against the gate while she scratched his ears through the opening. There were no treats. He had come to visit a person.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-week-we-borrowed-comet-assets/page3.jpg"}, {"text": "4. A Different Sort of Company\nBy Monday, I suspected Comet had a more interesting life than the one I had prepared for him. He knew which gate to visit, where Dad kept the leash, and exactly when a cupboard opening might concern him. I had wanted to show him a new trick before Aunt Nora returned. Instead, I was learning a collection of small facts about a dog who had existed quite successfully before meeting my excellent plans.\nThat afternoon I sat on the floor to read. I had stopped inviting Comet to join every activity. After several pages, something warm settled against my knee. He had left the door rug and stretched out beside me. I did not call Dad to witness it. I did not move him into the bed so the scene would match my original picture. I kept reading, turning each page as quietly as I could. My leg went numb long before I wanted to stand up.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-week-we-borrowed-comet-assets/page4.jpg"}, {"text": "5. The Question I Did Not Ask\nOn Wednesday, Aunt Nora called. I told her about Mrs. Ives and the flying disc. She said Comet had never cared for that game. Then she asked whether he had found a place near my feet. I looked under the desk. He was there, asleep on the green blanket I had moved from the bed. I said yes. Aunt Nora sounded pleased, which surprised me. I had expected her to feel at least a little jealous.\nI nearly asked whether he might prefer staying with us. The question had been sitting in my mind all week, making itself look reasonable. Instead, I asked whether he missed her. She said she missed him, and that she was glad he had company while she was away. Under the desk, Comet made a small running motion in his sleep. I wondered who he was following. There was no way to ask him without waking him.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-week-we-borrowed-comet-assets/page5.jpg"}, {"text": "6. Saturday at the Door\nOn Friday evening, I packed the disc away and put Comet's food bag by the door. His week had gone faster than mine. He had no calendar to explain why I kept looking at him. I folded the green blanket, then unfolded it because he was already standing where it belonged. Dad said we could pack it in the morning. I sat down at the desk and let Comet arrange himself at my feet.\nWhen Aunt Nora arrived on Saturday, he heard her before I did. He ran to the door and greeted her with such complete happiness that I looked away. I had known she was coming back. I had helped count the days. Still, some foolish part of me had hoped he would hesitate, as though a difficult choice had been placed before him. He did not hesitate. Aunt Nora knelt to greet him, and his tail thumped the wall.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-week-we-borrowed-comet-assets/page6.jpg"}, {"text": "7. The Place Beside the Gate\nAunt Nora took the food bag. I handed her the blanket and explained where Comet liked to sleep now. She listened carefully, not as though I had been keeping her dog for seven days, but as though I had discovered something worth knowing. Before they left, she asked whether I would join their walk the next morning. I said I would think about it. Dad looked at me, and I admitted I had already decided.\nOn Sunday, Comet saw me coming down our path and wagged his tail. Then he turned toward the park. I walked beside Aunt Nora, carrying nothing I needed to give back. At the green gate, he sat down to wait. This time I knew why. Mrs. Ives appeared with her watering can and asked how my week had been. I looked at Comet. He was not mine, and he knew me. Both things were true when I answered.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-week-we-borrowed-comet-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "Where did Comet choose to lie instead of the bed Jules had prepared?", "choices": ["On the small rug by the door", "On Jules’s bed", "Under the kitchen table"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Comet walked past the dog bed and lay on the small rug by the door."}, {"q": "What did Comet do when Dad picked up the red leash?", "choices": ["He kept sleeping", "He ran and hid", "He stood up at once"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "When Dad picked up the red leash, Comet stood at once."}, {"q": "Why did Comet stop at the green gate?", "choices": ["He was afraid of the park", "He came to visit Mrs. Ives, who often talked there with Aunt Nora", "He wanted a treat"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Mrs. Ives and Aunt Nora often talked at the gate, and Comet had come to visit a person."}, {"q": "What happened after Jules stopped inviting Comet to join every activity?", "choices": ["Comet ran away", "Comet chewed the book", "Comet lay down beside Jules while he read"], "answer": 2, "evidencePage": 4, "hint": "Look at page 4.", "explain": "After several pages, something warm settled against his knee, and Comet had stretched out beside him."}, {"q": "How did Comet greet Aunt Nora when she came back?", "choices": ["He ignored her", "He ran to the door and greeted her with complete happiness, without hesitating", "He hid under the desk"], "answer": 1, "evidencePage": 6, "hint": "Look at page 6.", "explain": "He heard her first, ran to the door, and did not hesitate."}], "grammar": [{"q": "‘He listened with the solemn attention of a dog considering a very dull speech.’ What does this joke show?", "choices": ["Comet could not hear", "Comet looked serious, but he was not really interested", "Comet loved the speech"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "The comparison is funny because a dog cannot care about a speech, so he only looked serious.", "teach": "Writers use humor, like comparing a dog to someone listening to <b>a very dull speech</b>, to show how a character really feels.<span class='cn'>作者用幽默的比喻，比如把狗比作在听<b>一场非常乏味的演讲</b>，来表现角色的真实感受。</span>"}, {"q": "‘Comet ___ on the small rug by the door.’ Which verb is the past tense of ‘lie’?", "choices": ["lay", "laid", "lied"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "The past tense of “lie” in the sense of resting is “lay”.", "teach": "The past tense of <b>lie</b>, to rest, is <b>lay</b>, like <b>he lay on the rug</b>, and <b>laid</b> goes with <b>lay</b>, to put down.<span class='cn'><b>lie</b>（躺）的过去式是 <b>lay</b>，比如 <b>he lay on the rug</b>；<b>laid</b> 是 <b>lay</b>（放置）的过去式。</span>"}, {"q": "‘The ___ went by quickly.’ Which word means seven days?", "choices": ["weak", "week", "wick"], "answer": 1, "evidencePage": 6, "hint": "Look at page 6.", "explain": "A week is seven days, so it needs “week”.", "teach": "<b>Week</b> means seven days, but <b>weak</b> means not strong, and the two words sound the same.<span class='cn'><b>Week</b> 指“一周”，而 <b>weak</b> 指“虚弱”，两个词读音相同。</span>"}], "vocabulary": [{"q": "‘Settling’ means ___.", "choices": ["becoming comfortable in a new place", "packing a bag", "leaving a place"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Mrs. Ives asked how Comet was settling in."}, {"q": "‘Solemn’ means ___.", "choices": ["very serious", "very noisy", "very silly"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "He listened with the solemn attention of a dog considering a very dull speech."}, {"q": "‘Jealous’ means ___.", "choices": ["proud of a friend", "tired and sleepy", "unhappy because someone else has what you want"], "answer": 2, "evidencePage": 5, "hint": "Look at page 5.", "explain": "I had expected her to feel at least a little jealous."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(settling|solemn|jealous)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 5 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}

function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}var TEACH_ICONS='<svg class="ic i-spk" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.5v5h3.6l4.9 4.5V5L7.6 9.5H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.6 9.2a4 4 0 010 5.6M18.2 6.6a7.6 7.6 0 010 10.8"/></svg><svg class="ic i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></svg><svg class="ic i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 5.3v13.4c0 .8.9 1.3 1.6.8l9.6-6.7c.6-.4.6-1.2 0-1.6L9.8 4.5c-.7-.5-1.6 0-1.6.8z"/></svg>';var _tp=null;function _tpSet(b,st){if(!b)return;b.classList.toggle('is-playing',st==='playing');b.classList.toggle('is-paused',st==='paused');b.setAttribute('aria-pressed',st==='playing'?'true':'false');var z=b.dataset.part==='cn',L=st==='playing'?(z?'\u6682\u505C':'Pause'):st==='paused'?(z?'\u7EE7\u7EED\u64AD\u653E':'Resume'):b.dataset.label;b.setAttribute('aria-label',L);b.title=L;}function stopTeachAudio(){var c=_tp;if(!c)return;_tp=null;try{if(c.audio){c.audio.onended=c.audio.onerror=c.audio.ontimeupdate=null;c.audio.pause();}}catch(e){}if(c.mode==='tts'){try{speechSynthesis.cancel();}catch(e){}}_tpSet(c.btn,'idle');}function _tpFallback(btn){try{var u=new SpeechSynthesisUtterance(btn.dataset.text||'');u.lang=btn.dataset.lang||'en-US';var cur={btn:btn,mode:'tts'};_tp=cur;u.onend=u.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');}};_tpSet(btn,'playing');speechSynthesis.speak(u);}catch(e){}}function playTeachAudio(btn){if(_tp&&_tp.btn===btn){if(_tp.mode==='audio'){var a0=_tp.audio;if(a0.paused){var p0=a0.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}

function nextQuestion(){const list=quizzes[activeTab];if(qIndex[activeTab]<list.length-1){qIndex[activeTab]++;renderPanel();return}completed[activeTab]=true;if(activeTab==="comprehension")activeTab="grammar";else if(activeTab==="grammar")activeTab="vocabulary";else{return showCompletion()}setTabs();renderPanel()}
function showCompletion(){completed.vocabulary=true;setTabs();const correct=Object.keys(selections).filter(k=>{const [tab,idx]=k.split('-');return selections[k]===quizzes[tab][+idx].answer}).length,total=Object.values(quizzes).reduce((a,b)=>a+b.length,0);document.getElementById("stagePill").textContent="Journey Complete";document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">Reading journey complete</div><h2>Wonderful work! 🎉</h2><p class="small">You finished Reading, Grammar, and Vocabulary.</p><div class="score-row"><div class="score-box"><b>${total}</b><br><span>Questions</span></div><div class="score-box"><b>${correct}</b><br><span>Correct now</span></div></div><div class="feedback good">You used evidence, practiced sentence skills, and learned new words.</div><button class="submit" onclick="restartPractice()">Practice Again</button></div>`}
function restartPractice(){activeTab="comprehension";qIndex={comprehension:0,grammar:0,vocabulary:0};selections={};attempts={};completed={comprehension:false,grammar:false,vocabulary:false};setTabs();renderPanel()}
function saveProgress(){try{localStorage.setItem("les-the-week-we-borrowed-comet-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-week-we-borrowed-comet"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-week-we-borrowed-comet",bookTitle:"The Week We Borrowed Comet",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}
function clearHighlight(){document.querySelectorAll(".story-word.reading").forEach(x=>x.classList.remove("reading"))}
let preferredVoice=null;
