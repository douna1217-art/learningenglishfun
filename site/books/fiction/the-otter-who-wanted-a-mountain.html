<script>

const pages=[{"type": "cover", "title": "The Otter Who Wanted a Mountain", "subtitle": "An Otter Climbs a Quiet Mountain to Be Alone and Finds That Silence and Company Can Share the Same Hill", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-otter-who-wanted-a-mountain-assets/cover.jpg"}, {"text": "1. A Quiet Place in the Distance\nOrrin loved his river, but on Saturday mornings it seemed to belong to everyone at once. His cousins raced past his doorway. A neighbor borrowed his flat sunning stone to sort reeds. Someone always wanted to know whether he was coming swimming. Orrin had been trying to think of a tune for three days. Every time he found the next few notes, somebody called his name and the tune slid away.\nAcross the valley stood a mountain with a smooth green top. From the river, it looked completely still. Orrin decided to walk there and spend one morning without answering a question. He packed water, oatcakes, and a folded cloth to sit on. He told his cousins where he was going and when he expected to return. “What will you do up there?” they asked. “For a start,” Orrin said, “I won't explain what I'm doing.”", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-otter-who-wanted-a-mountain-assets/page1.jpg"}, {"text": "2. The Mountain Had Footsteps\nThe lower path smelled of warm grass. Orrin climbed until the river became a silver bend between the trees. He stopped to listen. A grasshopper clicked beside his foot. Somewhere higher up, stones rattled. Then a white goat appeared around a bend, wearing a blue scarf and chewing with great concentration. She introduced herself as Tess and asked whether Orrin was looking for the spring. He said he was looking for silence.\nTess finished chewing before she answered. The top was pleasant, she said, but the mountain was not particularly silent. Orrin thought she must be joking. From his home it never made a sound. Tess pointed her nose toward the distant river. From here, she explained, the river looked quiet too. Orrin could just see his cousins as small dark commas on the water. Their splashing did not reach him at all.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-otter-who-wanted-a-mountain-assets/page2.jpg"}, {"text": "3. An Unhelpful Piece of Wind\nOrrin thanked Tess and continued upward. He had no wish to argue about a place he hadn't reached. Near a broad patch of heather, he sat down to drink. The wind hurried across the slope, pressed his whiskers flat, and lifted the corner of his sitting cloth. Orrin caught it before it went anywhere. When he tried to hum his unfinished tune, the wind seemed determined to hum a different one through his ears.\nTess arrived by another curve of the same path. She suggested sitting behind a low boulder, where the air was calmer. Orrin wanted to point out that accepting advice was not part of his plan for being alone. Instead he moved. Behind the boulder, he could hear his own breathing again. He offered Tess an oatcake. She declined politely and continued chewing the mouthful she had already brought along.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-otter-who-wanted-a-mountain-assets/page3.jpg"}, {"text": "4. The Room Above the River\nThey reached the rounded summit before noon. Orrin found a hollow in the grass where he could sit below the wind. It was exactly the sort of place he had imagined, except for the insects, the rustling, and Tess's steady chewing. He set out his cloth. Tess asked whether she could rest nearby. Orrin hesitated. He had walked a long way to get away from company. She noticed and offered to move farther off.\n“You were here before I was,” Orrin said. “I can't ask the whole mountain to leave.” Tess settled on a separate patch of grass. For several minutes they watched a cloud shadow cross the valley. Nobody spoke. Orrin found that company could be quieter when it wasn't asking him to be interesting. He tried the first notes of his tune. This time, the next few came without anybody calling him down to the water.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-otter-who-wanted-a-mountain-assets/page4.jpg"}, {"text": "5. Two Different Views\nAfter a while Tess asked what the tune was called. Orrin said it didn't have a name yet. She thought it sounded like water sliding over stones. He had been hoping for something that sounded like a mountain. Tess laughed, then apologized. She had never lived beside water. To her, a tune about a river was much more unusual than one about grass. Orrin played the notes again, softly through his closed mouth.\nHe told her how the river changed after rain and which bend caught the evening light. Tess described the hollow when purple flowers covered it, and the little spring that stayed cool under the rocks. Neither place was empty, he realized. He had wanted the mountain to be a blank space he could fill with his own thoughts. Tess knew enough about it to hear things he would have called interruptions.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-otter-who-wanted-a-mountain-assets/page5.jpg"}, {"text": "6. A Way Back Down\nWhen the sun stood high, Orrin packed his cloth. He had promised to return before afternoon, and the path would take time. Tess walked with him to the lower meadow. They stopped at her spring, a clear trickle that gathered in a shallow stone basin. Orrin watched a leaf turn slowly in the water. He could have flicked it free, but Tess said she liked seeing which way it found for itself.\nAt the meadow, he invited her to visit the river. Then he remembered how far she would have to walk and added that she could come another day. He would show her a dry path along the bank. Tess said she might like that. She wasn't planning to swim. Orrin promised there would be no surprise swimming lesson, and she promised not to turn his visit into a surprise climbing lesson either.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-otter-who-wanted-a-mountain-assets/page6.jpg"}, {"text": "7. A Morning He Could Ask For\nBack at the river, his cousins wanted to hear everything. Orrin told them about the wind, the spring, and the goat who thought rivers were unusual. Then he said he needed ten quiet minutes before he went swimming. One cousin asked why he hadn't said so earlier. Orrin had no useful answer. He spread his cloth on the sunning stone and sat down. The cousins splashed farther along the bend, where they wouldn't keep calling to him.\nThe mountain still looked still across the valley. Now Orrin could imagine its wind and the grass moving under Tess's feet. He hummed the tune, adding a pause where a question might have interrupted it before. When he finished, he tried it again. He intended to visit the mountain another morning. He also intended to stay beside his river. It seemed possible to want both, provided he left a little room between the wanting and the going.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-otter-who-wanted-a-mountain-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "Why did Orrin decide to walk to the mountain?", "choices": ["To spend a morning without answering questions and to find the next notes of his tune", "To collect oatcakes", "To race his cousins"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "He wanted one morning without answering a question, and every time he found the next notes of his tune, somebody called his name."}, {"q": "What did Tess tell Orrin about the mountain and the river?", "choices": ["The mountain was not silent, and from up there the river looked quiet too", "Both were completely silent", "Both were very noisy"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "She said the mountain was not particularly silent, and that from there the river looked quiet too."}, {"q": "How did Tess help Orrin with the wind?", "choices": ["She suggested sitting behind a low boulder where the air was calmer", "She gave him a scarf", "She blew the wind away"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "She suggested sitting behind a low boulder, where the air was calmer."}, {"q": "What did Orrin discover about company on the summit?", "choices": ["It was always noisy", "He did not like it at all", "It could be quiet when it was not asking him to be interesting"], "answer": 2, "evidencePage": 4, "hint": "Look at page 4.", "explain": "He found that company could be quieter when it wasn’t asking him to be interesting."}, {"q": "What did Orrin ask his cousins for when he got back?", "choices": ["A walk up the mountain", "Ten quiet minutes before he went swimming", "A race along the river"], "answer": 1, "evidencePage": 7, "hint": "Look at the last page.", "explain": "He said he needed ten quiet minutes before he went swimming."}], "grammar": [{"q": "The Greek root ‘geo’ means ‘earth’. Which word has the same root?", "choices": ["gentle", "geography", "gem"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Geography is the study of the earth.", "teach": "The Greek root <b>geo</b> means earth, like <b>geography</b> and <b>geology</b>.<span class='cn'>希腊词根 <b>geo</b> 表示“地球、大地”，比如 <b>geography</b>（地理）和 <b>geology</b>（地质学）。</span>"}, {"q": "‘Orrin found a hollow in the grass ___ he could sit below the wind.’ Which word belongs in the blank?", "choices": ["when", "why", "where"], "answer": 2, "evidencePage": 4, "hint": "Look at page 4.", "explain": "The word tells about a place, so it needs “where”.", "teach": "<b>Where</b>, <b>when</b>, and <b>why</b> can join a noun to extra information, and <b>where</b> goes with a place, like <b>a hollow where he could sit</b>.<span class='cn'><b>where</b>、<b>when</b> 和 <b>why</b> 可以给名词补充信息，<b>where</b> 对应地点，比如 <b>a hollow where he could sit</b>。</span>"}, {"q": "‘His cousins looked like small dark commas on the water.’ What does this comparison show?", "choices": ["They looked tiny and curved from far away", "They were writing a letter", "They were swimming in circles"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "From high on the mountain, the cousins looked like tiny curved marks.", "teach": "A <b>comparison</b> can help you picture something, like <b>small dark commas on the water</b> for tiny swimmers seen from far away.<span class='cn'><b>比喻</b>能帮助读者想象画面，比如用 <b>small dark commas on the water</b>（水面上小小的黑逗号）形容远处的游泳者。</span>"}], "vocabulary": [{"q": "‘Summit’ means ___.", "choices": ["the bottom of a valley", "the highest point of a mountain", "a path through a forest"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "They reached the rounded summit before noon."}, {"q": "‘Hollow’ means ___.", "choices": ["a kind of tree", "a loud sound", "a small low place in the ground"], "answer": 2, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Orrin found a hollow in the grass where he could sit below the wind."}, {"q": "‘Interruptions’ means ___.", "choices": ["songs for the evening", "things that stop what you are doing for a while", "gifts from friends"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Tess knew enough about the mountain to hear things he would have called interruptions."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(summit|hollow|interruptions)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 5 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}var TEACH_ICONS='<svg class="ic i-spk" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.5v5h3.6l4.9 4.5V5L7.6 9.5H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.6 9.2a4 4 0 010 5.6M18.2 6.6a7.6 7.6 0 010 10.8"/></svg><svg class="ic i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></svg><svg class="ic i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 5.3v13.4c0 .8.9 1.3 1.6.8l9.6-6.7c.6-.4.6-1.2 0-1.6L9.8 4.5c-.7-.5-1.6 0-1.6.8z"/></svg>';var _tp=null;function _tpSet(b,st){if(!b)return;b.classList.toggle('is-playing',st==='playing');b.classList.toggle('is-paused',st==='paused');b.setAttribute('aria-pressed',st==='playing'?'true':'false');var z=b.dataset.part==='cn',L=st==='playing'?(z?'\u6682\u505C':'Pause'):st==='paused'?(z?'\u7EE7\u7EED\u64AD\u653E':'Resume'):b.dataset.label;b.setAttribute('aria-label',L);b.title=L;}function stopTeachAudio(){var c=_tp;if(!c)return;_tp=null;try{if(c.audio){c.audio.onended=c.audio.onerror=c.audio.ontimeupdate=null;c.audio.pause();}}catch(e){}if(c.mode==='tts'){try{speechSynthesis.cancel();}catch(e){}}_tpSet(c.btn,'idle');}function _tpFallback(btn){try{var u=new SpeechSynthesisUtterance(btn.dataset.text||'');u.lang=btn.dataset.lang||'en-US';var cur={btn:btn,mode:'tts'};_tp=cur;u.onend=u.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');}};_tpSet(btn,'playing');speechSynthesis.speak(u);}catch(e){}}function playTeachAudio(btn){if(_tp&&_tp.btn===btn){if(_tp.mode==='audio'){var a0=_tp.audio;if(a0.paused){var p0=a0.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}

function saveProgress(){try{localStorage.setItem("les-the-otter-who-wanted-a-mountain-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-otter-who-wanted-a-mountain"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-otter-who-wanted-a-mountain",bookTitle:"The Otter Who Wanted a Mountain",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

let preferredVoice=null;
