.panel{min-height:720px;padding:18px}.journey{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}.tab{border:0;border-radius:12px;padding:11px 5px;font-size:.8rem;font-weight:950;background:#f1edf7;color:#6c6573;cursor:pointer}.tab.active{background:var(--purple);color:#fff}.tab.done{background:#e8f5e6;color:#3f7c43}.card{background:var(--cream);border:1px solid #eadfd4;border-radius:21px;padding:19px}.question-count{text-transform:uppercase;letter-spacing:.09em;font-size:.75rem;font-weight:950;color:var(--purple)}.card h2{font-size:1.26rem;line-height:1.35;margin:8px 0}.small{color:var(--muted);line-height:1.45}.option{display:block;width:100%;text-align:left;border:1.5px solid #ddd4c9;background:#fff;border-radius:13px;padding:12px 13px;margin:9px 0;font-weight:850;cursor:pointer}.option:hover{transform:translateY(-1px);border-color:#baa9db}.option.selected{border-color:var(--purple);background:#f1ecff}.option.correct{border-color:#63a453;background:#eff9eb}.option.wrong{border-color:#df6a61;background:#fff0ee}.feedback{min-height:54px;margin-top:12px;padding:11px 12px;border-radius:12px;background:#f1edf7;line-height:1.43}.feedback.good{background:#edf8e9}.feedback.bad{background:#fff0ee}.submit{width:100%;border:0;border-radius:12px;padding:12px;margin-top:11px;background:var(--green);color:#fff;font-weight:950;cursor:pointer}.hint-btn{border:0;background:transparent;color:var(--purple);font-weight:900;cursor:pointer;padding:7px 0}.score-row{display:flex;justify-content:space-between;gap:10px;margin:14px 0}.score-box{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}.score-box b{font-size:1.35rem;color:var(--purple)}.evidence-banner{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:1000;max-width:92vw;background:rgba(139,107,209,.55);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);color:#fff;border-radius:17px;padding:13px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 14px 38px rgba(111,74,182,.24);border:1px solid rgba(255,255,255,.32)}.evidence-banner strong{text-shadow:0 1px 6px rgba(60,35,110,.35)}.evidence-banner span{font-size:.84rem;color:#fff}.evidence-banner button{border:0;border-radius:10px;padding:9px 12px;background:rgba(255,255,255,.92);color:var(--purple);font-weight:950;cursor:pointer}.footer{text-align:center;color:var(--muted);font-size:.8rem;padding:13px}

</style><style>/* Stacked pages: full-width art above the reading text. */.book-page,.cover-page{display:flex!important;flex-direction:column!important;min-height:0!important;overflow:hidden!important}.book-page .art,.cover-page .art{order:1!important;display:block!important;width:100%!important;height:auto!important;min-height:0!important;aspect-ratio:16/9!important;overflow:hidden!important;margin:0!important}.book-page .art img,.cover-page .art img{display:block!important;width:100%!important;height:100%!important;object-fit:cover!important;object-position:center!important}.book-page .story,.cover-page .story{order:2!important;display:flex!important;width:100%!important;min-height:0!important;margin:0!important;padding:32px 38px!important}.cover-page .story{padding:34px 42px!important}@media(max-width:820px){.reader.reader-long{overflow:visible!important}.book-page.long-text{overflow:visible!important}.book-page.long-text .art{position:sticky!important;top:0!important;z-index:2!important}.book-page.long-text .story p{font-size:1.05rem!important;line-height:1.5!important}.evidence-banner{padding:9px 12px!important;gap:8px!important;bottom:10px!important;border-radius:13px!important}.evidence-banner div{min-width:0!important}.evidence-banner strong{font-size:.82rem!important;line-height:1.25!important;display:block!important}.evidence-banner span{display:none!important}.evidence-banner button{padding:7px 10px!important;font-size:.8rem!important;flex-shrink:0!important}}</style></head><body><div class="app">
<header class="topbar"><div class="brand"><div class="logo">R</div><div><h1>Postcards from Tomorrow Harbor</h1><p>learningenglishfun · Interactive Grade 5 Fiction</p></div></div><div class="stage-pill" id="stagePill">Reading Mode</div></header>
<section class="audio-bar"><div class="audio-copy"><strong>Listen, read, and record</strong><span>Narration highlights each word. Recordings stay only in this browser session.</span></div><div class="audio-actions"><button class="audio-btn primary" id="listenPageBtn">🔊 This Page</button><button class="audio-btn" id="listenStoryBtn">📖 Full Story</button><button class="audio-btn" id="pauseBtn" disabled>⏸ Pause</button><button class="audio-btn record" id="recordPageBtn">🎙 Record</button><button class="audio-btn" id="playRecordingBtn" disabled>▶ Play</button><button class="audio-btn" id="deleteRecordingBtn" disabled>🗑 Delete</button></div><div id="recStatus" class="rec-status" aria-live="polite"></div></section>
<main class="shell"><section class="reader"><div id="pageView"></div><div class="controls"><div class="progress" id="progress"></div><div class="nav"><button class="prev" id="prevBtn">← Back</button><button class="next" id="nextBtn">Next →</button></div></div></section><aside class="panel"><div class="journey"><button class="tab active" data-tab="comprehension">1 Story</button><button class="tab" data-tab="grammar">2 Grammar</button><button class="tab" data-tab="vocabulary">3 Vocabulary</button></div><div id="panelContent"></div></aside></main><div class="footer">No API key required · narration, recording, feedback, retry, and progress work in the browser.</div></div>
<script>

const pages=[{"type": "cover", "title": "Postcards from Tomorrow Harbor", "subtitle": "Messages From a Future Shoreline Ask Two Friends to Choose What They Can Change Today", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/postcards-from-tomorrow-harbor-assets/cover.jpg"}, {"text": "1. The Postcard With Moving Water\nLena found a postcard inside the brass harbor mailbox. Its front showed the familiar pier, but water moved across the boards as if the picture were alive. The back was blank.\nMarcus found a second card showing the same pier high and dry behind a garden of eelgrass. Both cards carried tomorrow's date, yet they disagreed about the harbor's future.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/postcards-from-tomorrow-harbor-assets/page1.jpg"}, {"text": "2. Two Futures From One Storm\nCaptain Noor compared the images with the colored tide chart. Both futures began with the same king tide and winter storm. In one, waves crossed the parking lot. In the other, low barriers redirected water toward restored marsh.\nThe postcards were not predictions of certain events. They were paired possibilities. Their differences might reveal which choices separated one future from another.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/postcards-from-tomorrow-harbor-assets/page2.jpg"}, {"text": "3. Following Details Backward\nMarcus noticed a solar ferry in the dry postcard but an old fuel boat in the flooded one. Lena noticed that the dry future had fewer parking spaces and wider wetlands.\nThey listed details without assuming each one caused the result. A cleaner ferry could reduce pollution, but it would not stop a storm surge by itself. Evidence could suggest connections without proving them.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/postcards-from-tomorrow-harbor-assets/page3.jpg"}, {"text": "4. The Third Card Arrives\nThe next morning, a third card appeared. It showed workers installing reusable sand barriers while students planted eelgrass. The water still rose, but less reached the shops.\nLena recognized her own green raincoat in the moving picture. Marcus saw his orange sleeve carrying a plant tray. The future included them, but it did not show whether their actions were the only path.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/postcards-from-tomorrow-harbor-assets/page4.jpg"}, {"text": "5. Testing a Small Section\nThe town could not rebuild the whole shoreline before winter. Captain Noor helped the class test one short section with sand barriers, shallow channels, and eelgrass trays.\nA wave tank showed that barriers alone pushed water toward the next block. Eelgrass alone reduced small waves but bent under larger ones. Together with a drainage route, the system spread and slowed the water.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/postcards-from-tomorrow-harbor-assets/page5.jpg"}, {"text": "6. The Storm in the Present\nWhen the winter storm arrived, volunteers installed the tested design along the most vulnerable block. The harbor still flooded near the old ramp, but shops remained dry and the restored marsh held.\nThe result matched neither postcard perfectly. Marcus felt disappointed until Lena reminded him that the cards had shown possibilities, not promises. Their real choices had created a third future.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/postcards-from-tomorrow-harbor-assets/page6.jpg"}, {"text": "7. The Blank Postcard\nAfter the storm, a fifth postcard appeared with no moving image. Lena held it toward the harbor, but nothing formed. Marcus thought the emptiness meant the future had stopped sending answers.\nCaptain Noor saw an invitation instead. The children placed the blank card in the town display beside photographs of the test. Tomorrow Harbor had no single finished picture. Its next image would depend on evidence, revision, and choices made before the water arrived.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/postcards-from-tomorrow-harbor-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What was strange about the postcard Lena found?", "choices": ["The postcard showed a place that didn't exist", "Water moved across the pier in the picture as if it were alive", "The postcard was completely blank on both sides"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Lena's postcard showed the familiar pier, but water moved across the boards as if the picture were alive, and it carried tomorrow's date."}, {"q": "What did the two postcards actually represent, according to Captain Noor?", "choices": ["Two completely unrelated storms happening separately", "Paired possibilities that both began with the same storm, not certain predictions", "A single guaranteed future everyone had to accept"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Captain Noor explained the postcards were paired possibilities starting from the same king tide and storm, not certain predictions of the future."}, {"q": "What detail did Marcus and Lena notice differed between the two postcards?", "choices": ["The people in the postcards were completely different", "A solar ferry appeared in the dry postcard, but an old fuel boat appeared in the flooded one", "Nothing was different between the two cards at all"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Marcus noticed a solar ferry in the dry postcard and an old fuel boat in the flooded one, evidence that suggested connections without proving them."}, {"q": "What did the third postcard show?", "choices": ["Workers installing sand barriers while students planted eelgrass", "The town completely underwater with no hope", "A future with no people in it at all"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "The third card showed workers installing reusable sand barriers while students planted eelgrass, and Lena recognized her own raincoat in the image."}, {"q": "What did the wave tank test reveal about barriers and eelgrass alone?", "choices": ["Barriers alone pushed water toward the next block, and eelgrass alone bent under larger waves", "Neither one had any effect on the water", "Both worked perfectly with no problems at all"], "answer": 0, "evidencePage": 5, "hint": "Look at page 5.", "explain": "The wave tank showed that barriers alone pushed water elsewhere and eelgrass alone bent under larger waves — only combined with drainage did the system work."}], "grammar": [{"q": "'Marcus felt disappointed ___ Lena reminded him that the cards had shown possibilities, not promises.' Which word shows this happened before something changed?", "choices": ["until", "because", "so"], "answer": 0, "evidencePage": 6, "hint": "This word shows something continuing up to a point when it changes.", "explain": "'Until' shows Marcus's disappointment continued up to the point when Lena's reminder changed his view.", "teach": "<b>Until</b> shows something continuing <b>up to a point when it changes</b>.<span class='cn'><b>until</b> 表示某事持续到<b>发生变化的那一刻</b>。</span>"}, {"q": "Which sentence correctly punctuates an introductory phrase?", "choices": ["After the storm a fifth postcard, appeared with no moving image.", "After, the storm a fifth postcard appeared with no moving image.", "After the storm, a fifth postcard appeared with no moving image."], "answer": 2, "evidencePage": 7, "hint": "A comma follows an introductory phrase before the main sentence begins.", "explain": "The comma correctly separates the introductory phrase 'After the storm' from the main sentence.", "teach": "<b>A comma</b> follows an <b>introductory phrase</b> before the main sentence begins.<span class='cn'><b>逗号</b>用在<b>引导性短语</b>之后，主句开始之前。</span>"}, {"q": "'The result matched neither postcard perfectly, ___ their real choices had created a third future.' Which word shows contrast?", "choices": ["but", "and", "so"], "answer": 0, "evidencePage": 6, "hint": "This word shows the second idea is different from what you might expect.", "explain": "'But' shows contrast: the result didn't match either postcard, yet their choices still shaped a real, third outcome.", "teach": "<b>But</b> joins two ideas that are <b>different or surprising together</b>.<span class='cn'><b>but</b>用来连接两个<b>不同或令人意外</b>的想法。</span>"}], "vocabulary": [{"q": "'Possibilities' means ___.", "choices": ["rules that must always be followed", "things that might happen but are not certain", "events that have already happened"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "The postcards were paired possibilities — things that might happen — not guaranteed predictions of the future."}, {"q": "'Invitation' means ___.", "choices": ["a final decision that cannot change", "a warning to stay completely away", "a request or encouragement to take part in something"], "answer": 2, "evidencePage": 7, "hint": "Look at page 7.", "explain": "Captain Noor saw the blank postcard as an invitation, an encouragement to keep testing and choosing, not a dead end."}, {"q": "'Restored' means ___.", "choices": ["destroyed completely and permanently", "hidden away where no one can see it", "brought back to a good or original condition"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "In the safer future, low barriers redirected water toward a restored marsh — a wetland brought back to a healthy condition."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(possibilities|invitation|restored)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 5 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}
function selectAnswer(i){selections[activeTab+"-"+qIndex[activeTab]]=i;renderPanel()}
function showHint(){const item=quizzes[activeTab][qIndex[activeTab]];document.getElementById("feedback").innerHTML=`💡 ${item.hint}`}
function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}function playTeachAudio(key,part,fallbackText,fallbackLang){try{var store=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[key];if(store&&store[part]){var a=new Audio(store[part]);a.play();return;}}catch(e){}speakText(fallbackText,fallbackLang);}function renderTeach(teachHtml,key){var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+='<button style="border:0;background:#e2483f;color:#fff;cursor:pointer;font-size:.8em;line-height:1;vertical-align:middle;padding:0;margin-right:6px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;width:1.9em;height:1.9em;box-shadow:0 2px 6px rgba(226,72,63,.35)" data-key="'+key+'" data-part="en" data-text="'+escAttr(enText)+'" data-lang="en-US" onclick="playTeachAudio(this.dataset.key,this.dataset.part,this.dataset.text,this.dataset.lang)" aria-label="Listen in English" title="Listen in English">\uD83D\uDD0A</button> '+enHtml;if(cnHtml){out+='<span class="cn"><button style="border:0;background:#e2483f;color:#fff;cursor:pointer;font-size:.8em;line-height:1;vertical-align:middle;padding:0;margin-right:6px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;width:1.9em;height:1.9em;box-shadow:0 2px 6px rgba(226,72,63,.35)" data-key="'+key+'" data-part="cn" data-text="'+escAttr(cnText)+'" data-lang="zh-CN" onclick="playTeachAudio(this.dataset.key,this.dataset.part,this.dataset.text,this.dataset.lang)" aria-label="\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3" tit function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}

function saveProgress(){try{localStorage.setItem("les-postcards-from-tomorrow-harbor-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="postcards-from-tomorrow-harbor"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"postcards-from-tomorrow-harbor",bookTitle:"Postcards from Tomorrow Harbor",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}
function clearHighlight(){document.querySelectorAll(".story-word.reading").forEach(x=>x.classList.remove("reading"))}
let preferredVoice=null;
function pickVoice(){const voices=speechSynthesis.getVoices();if(!voices.length)return;const en=voices.filter(v=>/^en(-|_|$)/i.test(v.lang));const pool=en.length?en:voices;const score=v=>{let s=0;const n=(v.name||"").toLowerCase();if(/natural/.test(n))s+=8;if(/neural/.test(n))s+=6;if(/online/.test(n))s+=4;if(/google/.test(n))s+=5;if(/(aria|jenny|guy|libby|sonia|michelle|ava|andrew|emma|clara|natasha)/.test(n))s+=5;if(/(samantha|allison|karen|serena|siri|nicky|aaron)/.test(n))s+=4;if(v.localService===false)s+=3;if(/en-us|en-gb/i.test(v.lang))s+=1;if(/(zira|david|mark|hazel|compact|espeak|eloquence)/.test(n))s-=5;return s};pool.sort((a,b)=>score(b)-score(a));preferredVoice=pool[0]||null}
pickVoice();if(typeof speechSynthesis!=="undefined")speechSynthesis.addEventListener("voiceschanged",pickVoice);
var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.i);},at));});};}let advanced=false;const advance=()=>{if(advanced)return;advanced=true;if(watchdog)clearTimeout(watchdog);ci++;speakChunk();};u.onend=advance;u.onerror=advance;const estDur=Math.max(1200,chunk.text.length*110);const watchdog=setTimeout(advance,estDur+4000);speechSynthesis.speak(u);}setTimeout(speakChunk,70);}

function setStatus(m,ok){var el=document.getElementById("recStatus");if(el){el.textContent=m;el.style.color=ok?"#1f8f4d":"#b23b34";}}async function toggleRecording(){const btn=document.getElementById("recordPageBtn");if(recorder&&recorder.state==="recording"){recorder.stop();btn.textContent="🎙 Record";btn.classList.remove("recording");return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setStatus("Recording works only on the published website — the microphone is turned off in this preview.",false);return}if(typeof MediaRecorder==="undefined"){setStatus("This browser can't record audio. Try Chrome/Edge, or Safari 14+.",false);return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});let opts={};if(MediaRecorder.isTypeSupported){if(MediaRecorder.isTypeSupported("audio/webm"))opts={mimeType:"audio/webm"};else if(MediaRecorder.isTypeSupported("audio/mp4"))opts={mimeType:"audio/mp4"};}chunks=[];recorder=new MediaRecorder(stream,opts);recorder.ondataavailable=e=>{if(e.data&&e.data.size>0)chunks.push(e.data)};recorder.onstop=()=>{if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(new Blob(chunks,{type:(recorder.mimeType||"audio/webm")}));document.getElementById("playRecordingBtn").disabled=false;document.getElementById("deleteRecordingBtn").disabled=false;setStatus("Saved! Tap ▶ Play to hear your reading.",true);stream.getTracks().forEach(t=>t.stop())};recorder.start();btn.textContent="■ Stop";btn.classList.add("recording");setStatus("Recording… tap ■ Stop when you finish.",true)}catch(e){var n=(e&&e.name)?e.name:String(e);if(n==="NotAllowedError"||n==="SecurityError"){setStatus("Microphone blocked. In the chat preview the mic is always off — use the live website, then tap Allow (or click 🔒 in the address bar → allow Microphone → reload).",false);}else if(n==="NotFoundError"){setStatus("No microphone found on this device.",false);}else{setStatus("Could not record ("+n+"). Use the live website in Chrome/Edge/Safari 14+.",false);}}}
document.getElementById("recordPageBtn").onclick=toggleRecording;document.getElementById("playRecordingBtn").onclick=()=>{if(!audioURL)return;if(currentAudio)currentAudio.pause();currentAudio=new Audio(audioURL);var pb=document.getElementById("playRecordingBtn");pb.classList.add("active");currentAudio.onended=()=>pb.classList.remove("active");currentAudio.onpause=()=>pb.classList.remove("active");currentAudio.play().catch(err=>{pb.classList.remove("active");setStatus("Could not play ("+((err&&err.name)?err.name:err)+").",false);})};document.getElementById("deleteRecordingBtn").onclick=()=>{var db=document.getElementById("deleteRecordingBtn");db.classList.add("active");setTimeout(()=>db.classList.remove("active"),220);if(currentAudio)currentAudio.pause();if(audioURL)URL.revokeObjectURL(audioURL);audioURL=null;chunks=[];var pl=document.getElementById("playRecordingBtn");pl.disabled=true;pl.classList.remove("active");document.getElementById("deleteRecordingBtn").disabled=true};

function cancelFallback(){window.__fbt&&window.__fbt.forEach(clearTimeout);window.__fbt=[];}function setListenActive(id){["listenPageBtn","listenStoryBtn"].forEach(x=>{var el=document.getElementById(x);if(el)el.classList.toggle("active",x===id);});}function readStory(){var token=(window.__readToken=(window.__readToken||0)+1);speechSynthesis.cancel();cancelFallback();clearHighlight();setListenActive("listenStoryBtn");var seq=[{p:0,t:(pages[0].title+`. `+pages[0].subtitle+`.`),hl:false}];for(var i=1;i<pages.length;i++)seq.push({p:i,t:pages[i].text,hl:true});var k=0;function step(){if(token!==window.__readToken)return;if(k>=seq.length){endNarration();return;}var it=seq[k++];page=it.p;renderPage();speak(it.t,it.hl,function(){if(token===window.__readToken)step();});}step();}function endNarration(){stopRvAudio();clearHighlight();cancelFallback();var pb=document.getElementById("pauseBtn");if(pb){pb.textContent="⏸ Pause";pb.disabled=true;pb.classList.remove("active");}setListenActive(null);}
