<script>/*les-speech-shim*/
(function(){var w=window,ok=false,errs=[];
/* Some Android in-app browsers (UC/Quark and other vendor kernels, older WebViews) have no
   speechSynthesis at all. The page script calls it while loading, so it stopped there and the
   story was never drawn (the quiz still worked because its handlers were bound earlier).
   Give such browsers a silent stand-in so the rest of the page runs normally. */
try{ok=typeof w.speechSynthesis==="object"&&w.speechSynthesis!==null}catch(e){}
if(typeof w.SpeechSynthesisUtterance!=="function"&&typeof w.SpeechSynthesisUtterance!=="object"){
w.SpeechSynthesisUtterance=function(t){this.text=t==null?"":String(t);this.lang="";this.rate=1;this.pitch=1;this.volume=1;this.voice=null}}
if(!ok){var gen=0,told=false;
w.speechSynthesis={speaking:false,paused:false,pending:false,
getVoices:function(){return[]},cancel:function(){gen++},pause:function(){},resume:function(){},
addEventListener:function(){},removeEventListener:function(){},
speak:function(u){var g=gen;
if(!told&&typeof w.setStatus==="function"){told=true;try{w.setStatus("This browser can't read aloud, but you can still read and practice. 当前浏览器不支持朗读，仍可阅读和做题。",false)}catch(e){}}
setTimeout(function(){if(g===gen&&u&&u.onstart){try{u.onstart({})}catch(e){}}},0);
setTimeout(function(){if(g===gen&&u&&u.onend){try{u.onend({})}catch(e){}}},Math.max(600,String(u&&u.text||"").length*60))}}}
/* If the story still is not drawn after loading, say why on the page itself, so a screenshot
   from a phone we cannot test on shows the cause. */
w.addEventListener("error",function(e){try{if(errs.length<3)errs.push(String(e&&e.message||e))}catch(x){}});
w.addEventListener("load",function(){try{var v=document.getElementById("pageView");
if(v&&!v.firstChild&&errs.length){var d=document.createElement("div"),s=document.createElement("small");
d.style.cssText="padding:24px;color:#b91c1c;font:15px/1.6 sans-serif";
d.appendChild(document.createTextNode("The story could not be shown in this browser. 此浏览器暂时无法显示故事。"));
d.appendChild(document.createElement("br"));s.textContent=errs.join(" | ");d.appendChild(s);v.appendChild(d)}}catch(x){}});
})();

<script>

const pages=[{"type": "cover", "title": "The Table at the End of the Fair", "subtitle": "At the Quiet End of a School Fair, Twelve Closed Notebooks Become the Start of a Story Everyone Can Join", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-table-at-the-end-of-the-fair-assets/cover.jpg"}, {"text": "1. Twelve Blue Covers\nMiles arranged his twelve handmade notebooks in three neat rows. Each cover was blue with a white wave curling across it. Each ribbon lay flat. He had worked on them for two weekends, and he could see every tiny place where the edges weren't quite even. At the school fair, his table stood at the far end of the courtyard, beyond the birdhouse booth and the basket of donated books.\nLeena arrived carrying an orange notebook of her own. She admired the waves, then asked whether she could open one. Miles said the ribbons would lose their shape. She looked at the table again. “Then how will people know what's inside?” “It's a notebook,” he said. “There are pages.” He thought the covers ought to be enough. For the first half hour, nobody stopped long enough to find out.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-table-at-the-end-of-the-fair-assets/page1.jpg"}, {"text": "2. The Quiet End of the Courtyard\nAt the next booth, visitors picked up birdhouses and peered through the little round openings. The woman selling them turned one over to show how it was made. Miles straightened a ribbon that didn't need straightening. He wished his table were nearer the entrance. He wished the birdhouses would stop being interesting. Neither wish changed where anyone was standing.\nA young girl paused and touched a blue cover with one finger. “What would I write in it?” she asked. Miles almost said anything, because that seemed obvious. Then he realized it wasn't much of an answer. The girl waited beside her father. Leena asked whether she liked stories. “I like reading them,” the girl said. “I never know the first part when I try to make one.”", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-table-at-the-end-of-the-fair-assets/page2.jpg"}, {"text": "3. One Line to Begin\nLeena opened her own orange notebook and set it in the middle of the table. She wrote a sentence, then slid it toward the girl. The mayor's hat refused to come down from the sky. The girl read it twice. “Why?” she asked. “I don't know yet,” Leena said. “You could decide.” She offered the pencil, and the girl looked at her father before accepting it.\nMiles watched her add a sentence about a mayor who had forgotten the hat's birthday. It wasn't what he would have written. He was already thinking of a much better reason when the girl began to laugh. Her father read the two sentences and laughed too. He asked whether anyone could add the next part. Leena glanced at Miles. The orange notebook was hers, but the table belonged to both of them.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-table-at-the-end-of-the-fair-assets/page3.jpg"}, {"text": "4. A Story with Too Many Authors\nBy the time the girl left, the hat had demanded a cake and the mayor had tried to climb a very unhelpful tree. Miles put out a second chair for anyone who wanted to write. An older student added a squirrel who collected umbrellas. The birdhouse seller came over during a quiet moment and gave the squirrel a terrible singing voice. Every new sentence seemed to send the story somewhere else.\nMiles wanted to cross out the squirrel. It had nothing to do with the hat's birthday. He held the pencil above the page, then saw Leena waiting. “You can add something,” she said. “You don't have to remove what everyone else added first.” He sat down and read the whole page. The squirrel might know how to reach a hat in the sky. Perhaps he could use that.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-table-at-the-end-of-the-fair-assets/page4.jpg"}, {"text": "5. The Sentence He Added\nMiles wrote that the squirrel had once repaired the tree's broken branch. The tree owed it a favor. He pushed the notebook toward Leena. She added a branch that bent low enough for the squirrel to climb, but not far enough to reach the hat. Miles groaned. “You could have let that solve it.” “It could have,” she said. “Then what would the next person do?”\nHe looked up. Two visitors were waiting to read. The little table had become a place people returned to, even when they didn't want to buy anything. A boy asked to see the pages inside a blue notebook. This time Miles untied the ribbon and let him look. The pages were ordinary paper. Watching someone imagine using them made them seem less ordinary.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-table-at-the-end-of-the-fair-assets/page5.jpg"}, {"text": "6. Three Sales and a Flying Hat\nMiles sold three notebooks before the fair closed. He had hoped to sell all twelve, and nine still lay in the box under the table. The young girl who had written about the birthday came back with her father. She wanted to know whether the hat had received its cake. Nobody had written that part yet. Miles offered her the pencil without explaining how he thought the story should end.\nShe made the mayor apologize for forgetting, then invited the hat to choose its own birthday treat. The hat chose a windy hill and no mayor underneath it. Everyone reading over her shoulder went quiet for a moment. Then Leena smiled. It was a strange ending, but it belonged to the story they had made. Miles couldn't quite imagine it coming from any one of them alone.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-table-at-the-end-of-the-fair-assets/page6.jpg"}, {"text": "7. What Went Home\nThey packed the blue notebooks and folded the tablecloth. Leena tucked the orange notebook into her bag. Miles asked if he could borrow it after she had shown it to her family. She agreed, provided he didn't erase the squirrel. He said he might add an extra page, one where it finally sang. Leena said that sounded terrible, which was exactly why she wanted to read it.\nOn the way out, Miles passed the table near the entrance that he had wanted so badly that morning. It was empty now. He still wished he had sold more notebooks. Next time, he would let people open them from the beginning. But he also wanted one book that wasn't for sale, left open in the middle of the table. He had a first sentence ready. He didn't know what came after it.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-table-at-the-end-of-the-fair-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did Miles have on his table at the school fair?", "choices": ["Twelve handmade notebooks with blue covers and white waves", "A basket of donated books", "Birdhouses for sale"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Miles arranged twelve handmade notebooks, each with a blue cover and a white wave."}, {"q": "What did the young girl say she did not know how to do?", "choices": ["Read a story out loud", "Tie a ribbon", "Begin a story of her own"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "She said, “I never know the first part when I try to make one.”"}, {"q": "How did Leena help the girl?", "choices": ["She wrote a first sentence in her orange notebook and offered the pencil", "She told the girl a whole story", "She gave the girl a blue notebook"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Leena wrote a sentence, slid it toward the girl, and offered her the pencil."}, {"q": "What did Miles add to the shared story?", "choices": ["An ending for the story", "That the squirrel had once repaired the tree’s broken branch", "A new character called the mayor"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Miles wrote that the squirrel had once repaired the tree’s broken branch, so the tree owed it a favor."}, {"q": "How did the young girl end the story?", "choices": ["The squirrel climbed the tree", "The hat chose a windy hill and no mayor underneath it", "The mayor caught the hat"], "answer": 1, "evidencePage": 6, "hint": "Look at page 6.", "explain": "She made the mayor apologize, and the hat chose a windy hill and no mayor underneath it."}], "grammar": [{"q": "Which sentence uses a comma correctly before the joining word?", "choices": ["Miles untied, the ribbon so the boy could see the pages.", "Miles untied the ribbon, so the boy could see the pages.", "Miles untied the ribbon so, the boy could see the pages."], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "A comma goes before “so” when it joins two complete parts.", "teach": "Put a comma before <b>so</b>, <b>and</b>, or <b>but</b> when it joins two complete sentences.<span class='cn'>用 <b>so</b>、<b>and</b> 或 <b>but</b> 连接两个完整的句子时，要在连词前加逗号。</span>"}, {"q": "‘The pages were ordinary paper.’ Which word is closest in meaning to ‘ordinary’?", "choices": ["precious", "rare", "plain"], "answer": 2, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Ordinary means plain or common.", "teach": "<b>Synonyms</b> are words with almost the same meaning, like <b>ordinary</b> and <b>plain</b>.<span class='cn'><b>同义词</b>是意思几乎相同的词，比如 <b>ordinary</b>（普通的）和 <b>plain</b>（朴素的）。</span>"}, {"q": "Which sentence punctuates a quoted question correctly?", "choices": ["“What would I write in it,” she asked?", "“What would I write in it.” she asked.", "“What would I write in it?” she asked."], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "A question mark goes inside the quotation marks when the quote is a question.", "teach": "Put the question mark inside the quotation marks when the quoted words are a question, like <b>“Where is it?” he asked.</b><span class='cn'>引用的话是问句时，问号放在引号里面，比如 <b>“Where is it?” he asked.</b></span>"}], "vocabulary": [{"q": "‘Handmade’ means ___.", "choices": ["bought from a store", "made by a person and not by a machine", "very old"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Miles arranged his twelve handmade notebooks in three neat rows."}, {"q": "‘Donated’ means ___.", "choices": ["given freely to help others", "lost by accident", "sold at a high price"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "His table stood beyond the birdhouse stall and the basket of donated books."}, {"q": "‘Apologize’ means ___.", "choices": ["to say you are sorry", "to give a gift", "to ask a question"], "answer": 0, "evidencePage": 6, "hint": "Look at page 6.", "explain": "She made the mayor apologize for forgetting."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(handmade|donated|apologize)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 5 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();setListenActive(null);page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}
function selectAnswer(i){selections[activeTab+"-"+qIndex[activeTab]]=i;renderPanel()}
function showHint(){const item=quizzes[activeTab][qIndex[activeTab]];document.getElementById("feedback").innerHTML=`💡 ${item.hint}`}
function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}var TEACH_ICONS='<svg class="ic i-spk" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.5v5h3.6l4.9 4.5V5L7.6 9.5H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.6 9.2a4 4 0 010 5.6M18.2 6.6a7.6 7.6 0 010 10.8"/></svg><svg class="ic i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></svg><svg class="ic i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 5.3v13.4c0 .8.9 1.3 1.6.8l9.6-6.7c.6-.4.6-1.2 0-1.6L9.8 4.5c-.7-.5-1.6 0-1.6.8z"/></svg>';var _tp=null;function _tpSet(b,st){if(!b)return;b.classList.toggle('is-playing',st==='playing');b.classList.toggle('is-paused',st==='paused');b.setAttribute('aria-pressed',st==='playing'?'true':'false');var z=b.dataset.part==='cn',L=st==='playing'?(z?'\u6682\u505C':'Pause'):st==='paused'?(z?'\u7EE7\u7EED\u64AD\u653E':'Resume'):b.dataset.label;b.setAttribute('aria-label',L);b.title=L;}function stopTeachAudio(){var c=_tp;if(!c)return;_tp=null;try{if(c.audio){c.audio.onended=c.audio.onerror=c.audio.ontimeupdate=null;c.audio.pause();}}catch(e){}if(c.mode==='tts'){try{speechSynthesis.cancel();}catch(e){}}_tpSet(c.btn,'idle');}function _tpFallback(btn){try{var u=new SpeechSynthesisUtterance(btn.dataset.text||'');u.lang=btn.dataset.lang||'en-US';var cur={btn:btn,mode:'tts'};_tp=cur;u.onend=u.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');}};_tpSet(btn,'playing');speechSynthesis.speak(u);}catch(e){}}function playTeachAudio(btn){if(_tp&&_tp.btn===btn){if(_tp.mode==='audio'){var a0=_tp.audio;if(a0.paused){var p0=a0.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}
function returnToQuestion(){(function(){var b=document.getElementById("evidenceBanner");if(b&&b.parentNode)b.parentNode.removeChild(b);})();renderPanel();document.querySelector(".panel").scrollIntoView({behavior:"smooth",block:"start"})}
function nextQuestion(){const list=quizzes[activeTab];if(qIndex[activeTab]<list.length-1){qIndex[activeTab]++;renderPanel();return}completed[activeTab]=true;if(activeTab==="comprehension")activeTab="grammar";else if(activeTab==="grammar")activeTab="vocabulary";else{return showCompletion()}setTabs();renderPanel()}
function showCompletion(){completed.vocabulary=true;setTabs();const correct=Object.keys(selections).filter(k=>{const [tab,idx]=k.split('-');return selections[k]===quizzes[tab][+idx].answer}).length,total=Object.values(quizzes).reduce((a,b)=>a+b.length,0);document.getElementById("stagePill").textContent="Journey Complete";document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">Reading journey complete</div><h2>Wonderful work! 🎉</h2><p class="small">You finished Reading, Grammar, and Vocabulary.</p><div class="score-row"><div class="score-box"><b>${total}</b><br><span>Questions</span></div><div class="score-box"><b>${correct}</b><br><span>Correct now</span></div></div><div class="feedback good">You used evidence, practiced sentence skills, and learned new words.</div><button class="submit" onclick="restartPractice()">Practice Again</button></div>`}
function restartPractice(){activeTab="comprehension";qIndex={comprehension:0,grammar:0,vocabulary:0};selections={};attempts={};completed={comprehension:false,grammar:false,vocabulary:false};setTabs();renderPanel()}
function saveProgress(){try{localStorage.setItem("les-the-table-at-the-end-of-the-fair-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-table-at-the-end-of-the-fair"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-table-at-the-end-of-the-fair",bookTitle:"The Table at the End of the Fair",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}
function clearHighlight(){document.querySelectorAll(".story-word.reading").forEach(x=>x.classList.remove("reading"))}
let preferredVoice=null;
