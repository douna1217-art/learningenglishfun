<script>/*les-speech-shim*/

<script>

const pages=[{"type": "cover", "title": "The Letter Beneath the Floorboards", "subtitle": "A Letter Hidden Under the Floor Asks Granddad Whether He Still Makes Things, and Nina Helps Him Answer", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-letter-beneath-the-floorboards-assets/cover.jpg"}, {"text": "1. A Tin Under the Corner Board\nMom found the tin while replacing a loose board in the little front room. Nina had expected dust and perhaps a coin. Instead, there was a green metal box, small enough to fit between two floor supports. Mom lifted it out and covered the opening before Nina came closer. Granddad, who had grown up in the house, stopped in the doorway. He recognized the box before anyone had cleaned its lid.\nIt had once held his drawing pencils. He could not remember putting it under the floor. Mom set it on the table and went back to the board. Nina asked whether she could open it. Granddad said yes, though he warned her that he had never been a particularly successful pirate. Inside lay a folded letter and one red wooden wheel. Nina thought the wheel was a disappointing sort of treasure. The letter looked more promising.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-letter-beneath-the-floorboards-assets/page1.jpg"}, {"text": "2. A Letter With an Unusual Address\nThe letter began by addressing someone thirty years old. The writer wanted to know whether he had finally made the carriage turn a corner without losing its passenger. He hoped the older reader had a proper workbench and did not let anyone borrow the best red wheel. At the bottom was Granddad's name, written in a careful pencil hand. Nina looked at him. He laughed once, then became quiet. He had written it to himself.\nHe remembered the carriage now. At twelve, he had made a wooden cart with a front axle that refused to turn properly. Whenever he pulled it around a corner, the little block he used as a passenger fell off. He had planned to fix it when he understood more about making things. Thirty had seemed an age by which a person would know everything important. Nina asked whether that had proved true. Granddad said it had not.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-letter-beneath-the-floorboards-assets/page2.jpg"}, {"text": "3. The Invention He Had Left Behind\nNina asked where the rest of the carriage had gone. Granddad did not know. There had been several moves, a crowded shed, and years in which broken household things seemed more urgent than a cart carrying a wooden block. He turned the red wheel between his fingers. At thirty, he had been working long days and helping look after Nina's mom. He had repaired plenty of things. He had not thought about the little carriage.\nNina read the last lines again. The younger Granddad had not asked for a famous invention. He wanted to know whether making things still felt exciting. He hoped the older one would not become too busy to try something that might fail. Nina looked around the room at the shelf Granddad had fixed and the drawer that no longer stuck. She wondered when he had last made something simply because he wanted to see whether it would work.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-letter-beneath-the-floorboards-assets/page3.jpg"}, {"text": "4. A Very Late Reply\nGranddad folded the letter along its old creases. He said the twelve-year-old writer would probably find the answer disappointing. Nina asked what he would write back. He considered telling the boy about all the things he had learned. Then he looked at the red wheel. He said that would be rather a long answer to a simple question. Nina suggested that they could find out whether the carriage would turn now.\nThey went to the work table in the back room. Granddad found smooth scraps of wood already cut to useful sizes, three plain wheels, and a pair of old toy axles. Nina brought the red wheel and a small wooden block. It was not the original passenger, but it looked capable of an undemanding journey. Granddad cleared a space. For once, nobody had asked him to repair a shelf, a chair, or a drawer.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-letter-beneath-the-floorboards-assets/page4.jpg"}, {"text": "5. The Passenger on the Floor\nTheir first cart looked perfectly sensible while standing still. It had four wheels, a low wooden base, and a string at the front. Nina placed the block in the middle. Granddad pulled it across the hallway floor. It rolled straight ahead with a pleasant little rumble. At the corner, he turned the string. The cart continued in the old direction. One wheel bumped the baseboard, and the passenger fell onto its side.\nNina expected Granddad to be annoyed. He crouched to examine the front axle instead. It was almost exactly the trouble he remembered. They had fastened it so tightly that it could not swing when the string changed direction. Nina fetched the letter and stood it safely on the hall table. The twelve-year-old inventor could not watch them, but she liked the idea of keeping his question in the room while they worked.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-letter-beneath-the-floorboards-assets/page5.jpg"}, {"text": "6. A Corner Worth Trying Again\nBack at the table, Granddad loosened the front connection and gave the axle room to turn. Nina checked that the wheels still moved freely. They tested it without the passenger, then put the block aboard again. This time Nina held the string. Granddad waited beside the corner, where the floor was clear. She pulled slowly. The front axle swung, the cart followed, and the block remained upright. Nina kept going until Granddad asked whether the passenger had booked a return journey.\nThe cart wobbled on one side. The old red wheel was not quite the same size as the others. Nina asked whether they should replace it. Granddad said they could, if they wanted a smoother ride. They watched it make another uneven circle. Neither of them moved toward the work table. Granddad laughed when the passenger leaned, recovered, and continued on its way. Nina had heard him laugh at jokes before. This sounded different.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-letter-beneath-the-floorboards-assets/page6.jpg"}, {"text": "7. An Answer Beside the Question\nAfter supper, Granddad put the letter and green tin on the shelf beside the cart. Nina asked whether he wanted to write a reply. He found a pencil and added the date on a separate sheet, not over the old writing. He wrote that the carriage turned now. He also wrote that the red wheel still needed attention. Nina thought this was a rather modest account of an important expedition, but Granddad seemed satisfied.\nShe asked whether she should write to her thirty-year-old self. Granddad said she could, though he suggested leaving the letter somewhere she was likely to find it. Nina chose a notebook instead of the space beneath the floor. Before going upstairs, she looked back. Granddad was crouching in the hall, pulling the cart around the corner once more. The block sat upright. The red wheel made its uneven little turn. This time, nobody was keeping track of how late the answer had arrived.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-letter-beneath-the-floorboards-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did Mom find under the floorboard?", "choices": ["A green tin holding a folded letter and a red wooden wheel", "A map of the house", "A box of old coins"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "She found a green metal box, and inside lay a folded letter and one red wooden wheel."}, {"q": "Who wrote the letter, and to whom?", "choices": ["Granddad, at age twelve, to himself at age thirty", "Mom, to Granddad", "Nina, to her future self"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "The letter was signed with Granddad’s name, and it was addressed to someone thirty years old."}, {"q": "What did the twelve-year-old writer hope for?", "choices": ["That he would become famous", "That making things would still feel exciting and that his older self would still try things that might fail", "That the house would never change"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "He wanted to know whether making things still felt exciting, and hoped the older one would not be too busy to try something that might fail."}, {"q": "Why did the first cart fail at the corner?", "choices": ["The floor was too slippery", "The front axle was fastened too tightly to swing", "The red wheel was missing"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "They had fastened the front axle so tightly that it could not swing when the string changed direction."}, {"q": "What did Granddad write in his reply?", "choices": ["That he wanted a new house", "That he had given up inventing", "That the carriage turned now, and the red wheel still needed attention"], "answer": 2, "evidencePage": 7, "hint": "Look at the last page.", "explain": "He wrote that the carriage turned now and that the red wheel still needed attention."}], "grammar": [{"q": "The Latin root ‘dict’ means ‘say’. Which word has the same root?", "choices": ["dinner", "diamond", "dictionary"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "A dictionary tells you what words say or mean.", "teach": "The Latin root <b>dict</b> means say, like <b>dictionary</b> and <b>predict</b>.<span class='cn'>拉丁词根 <b>dict</b> 表示“说”，比如 <b>dictionary</b>（词典）和 <b>predict</b>（预言）。</span>"}, {"q": "Which sentence is in the active voice?", "choices": ["The cart was pulled by Granddad.", "The cart had been pulled.", "Granddad pulled the cart."], "answer": 2, "evidencePage": 5, "hint": "Look at page 5.", "explain": "In an active sentence, the subject does the action.", "teach": "In the <b>active voice</b>, the subject does the action, like <b>Granddad pulled the cart</b>.<span class='cn'><b>主动语态</b>中，主语是动作的执行者，比如 <b>Granddad pulled the cart</b>（爷爷拉了小车）。</span>"}, {"q": "‘___ name was written at the bottom of the letter?’ Which word belongs in the blank?", "choices": ["Whos", "Whose", "Who’s"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "The question asks who owns the name, so it needs “whose”.", "teach": "<b>Whose</b> asks who owns something, but <b>who’s</b> is short for who is.<span class='cn'><b>Whose</b> 询问“谁的”，而 <b>who’s</b> 是 who is 的缩写。</span>"}], "vocabulary": [{"q": "‘Expedition’ means ___.", "choices": ["a journey made for a special purpose", "a short nap", "a loud argument"], "answer": 0, "evidencePage": 7, "hint": "Look at the last page.", "explain": "Nina thought this was a rather modest account of an important expedition."}, {"q": "‘Axle’ means ___.", "choices": ["a rod that a wheel turns on", "a flat piece of wood", "a kind of string"], "answer": 0, "evidencePage": 5, "hint": "Look at page 5.", "explain": "It was almost exactly the trouble he remembered, with the front axle fastened too tightly."}, {"q": "‘Passenger’ means ___.", "choices": ["a driver of a car", "a person or thing being carried", "a builder of carts"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "The little block he used as a passenger fell off."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(expedition|axle|passenger)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 5 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}var TEACH_ICONS='<svg class="ic i-spk" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.5v5h3.6l4.9 4.5V5L7.6 9.5H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.6 9.2a4 4 0 010 5.6M18.2 6.6a7.6 7.6 0 010 10.8"/></svg><svg class="ic i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></svg><svg class="ic i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 5.3v13.4c0 .8.9 1.3 1.6.8l9.6-6.7c.6-.4.6-1.2 0-1.6L9.8 4.5c-.7-.5-1.6 0-1.6.8z"/></svg>';var _tp=null;function _tpSet(b,st){if(!b)return;b.classList.toggle('is-playing',st==='playing');b.classList.toggle('is-paused',st==='paused');b.setAttribute('aria-pressed',st==='playing'?'true':'false');var z=b.dataset.part==='cn',L=st==='playing'?(z?'\u6682\u505C':'Pause'):st==='paused'?(z?'\u7EE7\u7EED\u64AD\u653E':'Resume'):b.dataset.label;b.setAttribute('aria-label',L);b.title=L;}function stopTeachAudio(){var c=_tp;if(!c)return;_tp=null;try{if(c.audio){c.audio.onended=c.audio.onerror=c.audio.ontimeupdate=null;c.audio.pause();}}catch(e){}if(c.mode==='tts'){try{speechSynthesis.cancel();}catch(e){}}_tpSet(c.btn,'idle');}function _tpFallback(btn){try{var u=new SpeechSynthesisUtterance(btn.dataset.text||'');u.lang=btn.dataset.lang||'en-US';var cur={btn:btn,mode:'tts'};_tp=cur;u.onend=u.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');}};_tpSet(btn,'playing');speechSynthesis.speak(u);}catch(e){}}function playTeachAudio(btn){if(_tp&&_tp.btn===btn){if(_tp.mode==='audio'){var a0=_tp.audio;if(a0.paused){var p0=a0.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}

function saveProgress(){try{localStorage.setItem("les-the-letter-beneath-the-floorboards-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-letter-beneath-the-floorboards"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-letter-beneath-the-floorboards",bookTitle:"The Letter Beneath the Floorboards",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}
function clearHighlight(){document.querySelectorAll(".story-word.reading").forEach(x=>x.classList.remove("reading"))}
let preferredVoice=null;
