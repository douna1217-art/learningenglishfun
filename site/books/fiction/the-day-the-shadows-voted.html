<script>

const pages=[{"type": "cover", "title": "The Day the Shadows Voted", "subtitle": "When Shadows Demand a Voice, a Town Must Decide Whether Agreement Is the Same as Fairness", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-day-the-shadows-voted-assets/cover.jpg"}, {"text": "1. When the Shadows Spoke\nOn the longest day, every shadow in Lumen lifted from the ground just enough to gesture. The town allowed each one a vote before sunset.\nThis year the question was whether to remove the plaza awnings. People wanted more sunlight for the festival. Their shadows voted to keep every patch of shade.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-day-the-shadows-voted-assets/page1.jpg"}, {"text": "2. One Person Two Interests\nMara said the shadows were selfish because they grew strongest in bright light but depended on shade for sharp edges. Her own shadow pointed toward toddlers resting beneath an awning.\nDev noticed that bakers, elders, and outdoor workers also preferred shade during the hottest hours. The shadows' choice represented an interest many people shared but had not emphasized.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-day-the-shadows-voted-assets/page2.jpg"}, {"text": "3. The Problem With Counting Twice\nFestival planners objected that every resident now had two votes. Mayor Sol asked whether shadows were separate citizens or visible parts of their owners.\nIf shadows counted separately, sunny streets would give some people longer, darker voices than others. If they never counted, the town might ignore the needs the shadows revealed.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-day-the-shadows-voted-assets/page3.jpg"}, {"text": "4. An Experiment at Noon\nMara proposed repeating the vote at noon, when every shadow was shortest. The result barely changed. Dev moved one ballot bowl beneath an awning, and several human voters switched after standing in the cooler air.\nThe experiment showed that conditions shaped decisions. It did not prove that one choice was correct, but it exposed information the first vote had hidden.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-day-the-shadows-voted-assets/page4.jpg"}, {"text": "5. A Vote With Reasons\nInstead of counting the shadow stones as extra ballots, the town sorted them by the needs they represented: cooling, visibility, play space, garden light, and festival room.\nResidents then voted again after studying a model with removable awnings. The strongest plan kept shade over the fountain and work stalls while opening the center to morning light.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-day-the-shadows-voted-assets/page5.jpg"}, {"text": "6. The Minority at the Clock Tower\nMost voters approved the compromise, but shadows near the clock tower still opposed it. Their corner received reflected heat from pale walls, a fact the model had missed.\nMara resisted reopening the plan after a fair vote. Dev reminded her that fair procedures could still produce incomplete answers when evidence arrived late.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-day-the-shadows-voted-assets/page6.jpg"}, {"text": "7. What the Shadows Changed\nWorkers added a young tree and a small angled awning near the tower. The final design did not satisfy every preference, but it addressed the overlooked harm without discarding the whole decision.\nAt sunset, the shadows settled flat again. Mayor Sol stored their stones beside the town records, not as a second election but as evidence. Mara watched her shadow stretch across the cooler plaza and understood: a voice mattered not because it always won, but because a fair town remained willing to hear what its first count had missed.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-day-the-shadows-voted-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did the shadows vote for regarding the plaza awnings?", "choices": ["To remove all the awnings completely", "To keep every patch of shade, while people wanted more sunlight for the festival", "Nothing; the shadows did not actually vote"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "People wanted more sunlight for the festival, but their shadows voted to keep every patch of shade instead."}, {"q": "What interest did the shadows' vote actually represent, according to Dev?", "choices": ["A wish that applied only to the shadows themselves", "A need for shade during hot hours that bakers, elders, and outdoor workers shared but hadn't emphasized", "A completely selfish wish with no real basis"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Dev noticed the shadows' choice represented a real shared interest — many people wanted shade during the hottest hours, even if they hadn't said so directly."}, {"q": "What problem did Mayor Sol raise about counting shadow votes?", "choices": ["Whether shadows were separate citizens or just visible parts of their owners, since sunny streets would give some people extra voting power", "Shadows should always get triple the voting power", "There was no problem at all with the current system"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Mayor Sol worried that if shadows counted separately, people with longer shadows on sunny streets would effectively get more votes than others."}, {"q": "What did the noon experiment reveal?", "choices": ["Shadows disappeared entirely at noon", "Conditions shaped decisions — moving a ballot bowl to shade changed some human voters' choices", "The vote result was completely unaffected by anything"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "The experiment showed that conditions like temperature shaped decisions, since several human voters switched after standing in cooler air."}, {"q": "What did the town do instead of counting shadow votes as extra ballots?", "choices": ["Gave shadows permanent control over all town decisions", "Ignored the shadows' input completely from then on", "Sorted the shadow stones by the needs they represented, like cooling and visibility, then voted again after studying a model"], "answer": 2, "evidencePage": 5, "hint": "Look at page 5.", "explain": "The town sorted shadow stones by need — cooling, visibility, play space — then had residents vote again after studying a model with removable awnings."}], "grammar": [{"q": "'Most voters approved the compromise, ___ shadows near the clock tower still opposed it.' Which word shows contrast?", "choices": ["but", "and", "so"], "answer": 0, "evidencePage": 6, "hint": "This word shows the second idea is different from what you might expect.", "explain": "'But' shows contrast: most people agreed, yet a group near the tower still disagreed.", "teach": "<b>But</b> joins two ideas that are <b>different or surprising together</b>.<span class='cn'><b>but</b>用来连接两个<b>不同或令人意外</b>的想法。</span>"}, {"q": "'Mara proposed repeating the vote at noon, ___ every shadow was shortest.' Which word shows timing?", "choices": ["when", "although", "unless"], "answer": 0, "evidencePage": 4, "hint": "This word shows the time something happens.", "explain": "'When' shows the timing: the vote would be repeated at the moment shadows were shortest.", "teach": "<b>When</b> shows the <b>time</b> something happens.<span class='cn'><b>when</b> 表示某事发生的<b>时间</b>。</span>"}, {"q": "'A fact the model had missed pointed to reflected heat, ___ workers added a small angled awning near the tower.' Which word shows a result?", "choices": ["so", "or", "but"], "answer": 0, "evidencePage": 7, "hint": "This word connects a cause to the result that followed.", "explain": "'So' introduces the result: the discovery of reflected heat led directly to the new awning being added.", "teach": "<b>So</b> introduces a <b>result</b> that follows a cause.<span class='cn'><b>so</b>引出跟随原因而来的<b>结果</b>。</span>"}], "vocabulary": [{"q": "'Compromise' means ___.", "choices": ["a decision made with no discussion", "a total victory for only one side", "an agreement where each side gives up something"], "answer": 2, "evidencePage": 6, "hint": "Look at page 6.", "explain": "Most voters approved the compromise, though shadows near the clock tower still had concerns the model had missed."}, {"q": "'Procedures' means ___.", "choices": ["a type of shadow or reflection", "official steps followed to do something fairly", "a single unplanned decision"], "answer": 1, "evidencePage": 6, "hint": "Look at page 6.", "explain": "Dev reminded Mara that fair procedures could still produce incomplete answers when evidence arrived late."}, {"q": "'Reflected' means ___.", "choices": ["created from nothing", "completely absorbed with no effect", "bounced back, like light off a surface"], "answer": 2, "evidencePage": 6, "hint": "Look at page 6.", "explain": "The clock tower corner received reflected heat from pale walls, a detail the original model had missed."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(compromise|procedures|reflected)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 6 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}
