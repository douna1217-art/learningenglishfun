 16px;display:flex;align-items:center;gap:14px;box-shadow:0 14px 38px rgba(111,74,182,.24);border:1px solid rgba(255,255,255,.32)}.evidence-banner strong{text-shadow:0 1px 6px rgba(60,35,110,.35)}.evidence-banner span{font-size:.84rem;color:#fff}.evidence-banner button{border:0;border-radius:10px;padding:9px 12px;background:rgba(255,255,255,.92);color:var(--purple);font-weight:950;cursor:pointer}.footer{text-align:center;color:var(--muted);font-size:.8rem;padding:13px}

<script>

const pages=[{"type": "cover", "title": "The Path of Silver Reeds", "subtitle": "When the Trail Disappeared, the Marsh Offered a Different Kind of Map", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-path-of-silver-reeds-assets/cover.jpg"}, {"text": "1. Fog at Heron Marsh\nNia had walked the Heron Marsh loop twice, so she volunteered to lead Grandpa Tomas to the nature station. She wore her teal rain jacket and carried the orange field pouch with their map, whistle, and water. By the first bridge, fog had erased the familiar trail signs.\nGrandpa suggested returning, but the planks behind them were slick with rising water. Nia noticed a line of pale reeds bending southeast. Beyond them, a bell sounded once—low, distant, and possibly from the station. She wanted to hurry toward it, yet the mud hid every edge.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-path-of-silver-reeds-assets/page1.jpg"}, {"text": "2. Clues That Disagreed\nThe paper map showed the boardwalk turning east beside a round pond. The pond was invisible, but frogs called from Nia's left. A wooden post leaned ahead, its painted arrow blurred by rain. The reeds bent right, while the faint bell seemed to come from straight ahead.\nNia first trusted the loudest clue. Then Grandpa reminded her that fog can bend and soften sound. She compared details instead of choosing quickly: water level, wind direction, frog calls, and the boardwalk's slope. The clues did not agree, but each revealed part of the setting.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-path-of-silver-reeds-assets/page2.jpg"}, {"text": "3. A Track in the Mud\nNear the post, Nia found three-toed heron tracks crossing the mud. Beside them was a narrow groove made by the station's supply cart. The groove curved toward the reeds, then vanished under shallow water. It was evidence of a route, not proof that the route was safe now.\nGrandpa tested the flooded edge with his walking pole and found a sudden drop. Nia stepped back. Her first plan—to follow the cart mark—would have put them in deep water. She marked the hazard on the map with a pencil and searched for higher ground.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-path-of-silver-reeds-assets/page3.jpg"}, {"text": "4. Reading the Reeds\nThe silver reeds were not a path. Their bright undersides faced Nia because the wind had turned them all together. On the map, the station stood downwind of the old observation mound. If she could locate the mound, she could find the raised service walk beside it.\nA dark hump appeared whenever the fog thinned. Nia counted twelve railing posts toward it. She and Grandpa moved slowly, keeping one hand on the rail. The bell rang again, clearer now, and a square shadow rose behind the mound.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-path-of-silver-reeds-assets/page4.jpg"}, {"text": "5. The Red Roof\nThe square shadow became the nature station, but the expected bridge was underwater. Ranger Kim waved from beneath its red roof and pointed to yellow ribbons tied along a temporary detour. From a distance, the ribbons looked like marsh flowers; up close, they formed a careful route.\nNia did not rush. She checked that each ribbon led to another before stepping forward. The detour curved away from the shortest line and stayed on firm gravel. The safest path, she realized, was shaped by today's conditions—not yesterday's memory.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-path-of-silver-reeds-assets/page5.jpg"}, {"text": "6. The Map Gets Better\nInside, Ranger Kim explained that an upstream storm had flooded the loop before sunrise. The station bell sounded every ten minutes to guide trained staff, not visitors crossing open marsh. Nia added that fact to her map so another reader would not make her first assumption.\nTogether they drew the temporary detour, the hidden drop, and a note about wind showing the reeds' silver sides. Grandpa wrote the date and weather. Their revised map did not pretend the marsh stayed still; it recorded how evidence could change a decision.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-path-of-silver-reeds-assets/page6.jpg"}, {"text": "7. A Different Kind of Map\nWhen the fog lifted, Nia could see the loop she thought she knew. The bell tower stood west of where its sound had seemed to be. The reeds curved across the marsh like a shining arrow, though they had only been answering the wind.\nNia pinned the revised map beside the trail notice. It included routes, but also questions: What has changed? Which clues are reliable now? As she and Grandpa took the safe return path, she understood that good explorers do more than follow maps. They keep maps honest.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-path-of-silver-reeds-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "Why did Nia volunteer to lead Grandpa Tomas?", "choices": ["She was the only one who knew the ranger", "She had walked the Heron Marsh loop twice", "She wanted to test her new boots"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Nia had walked the Heron Marsh loop twice, so she volunteered to lead Grandpa Tomas."}, {"q": "What did Nia notice bending southeast near the first bridge?", "choices": ["A wooden bridge railing", "A group of frogs", "A line of pale reeds"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Nia noticed a line of pale reeds bending southeast."}, {"q": "What did Grandpa's walking pole find near the flooded edge?", "choices": ["A sudden drop", "A solid path forward", "A group of herons"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Grandpa tested the flooded edge with his walking pole and found a sudden drop."}, {"q": "What were the silver reeds actually showing, rather than a path?", "choices": ["A trail marked by rangers", "Their bright undersides because the wind had turned them all together", "A warning sign painted by hikers"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Their bright undersides faced Nia because the wind had turned them all together."}, {"q": "What is the big idea of this story?", "choices": ["Maps never need to be updated", "The fastest route is always the safest", "Good explorers do more than follow maps—they keep maps honest"], "answer": 2, "evidencePage": 7, "hint": "Look at the last page.", "explain": "She understood that good explorers do more than follow maps. They keep maps honest."}], "grammar": [{"q": "'Nia first trusted the loudest clue. ___ Grandpa reminded her that fog can bend and soften sound.' Which word signals what happened next?", "choices": ["Before", "Then", "Never"], "answer": 1, "evidencePage": 2, "hint": "This word signals the next thing that happened, after Nia's first reaction.", "explain": "'Then' signals the next step: first Nia trusted the loudest clue, then Grandpa reminded her about fog.", "teach": "<b>Then</b> signals the <b>next step</b> in a sequence of events.<span class='cn'><b>then</b>(然后)标志一系列事件中的<b>下一步</b>。</span>"}, {"q": "'Grandpa tested the flooded edge with his walking pole and found a sudden drop. ___ Nia stepped back.' Which word shows a result?", "choices": ["Before", "Yet", "So"], "answer": 2, "evidencePage": 3, "hint": "This word connects finding the drop to what Nia did next.", "explain": "'So' introduces the result: because Grandpa found a sudden drop, so Nia stepped back.", "teach": "<b>So</b> introduces a <b>result</b> that follows a reason.<span class='cn'><b>so</b>(所以)引出跟随原因而来的<b>结果</b>。</span>"}, {"q": "'The square shadow became the nature station, ___ the expected bridge was underwater.' Which word shows contrast?", "choices": ["but", "so", "and"], "answer": 0, "evidencePage": 5, "hint": "This word contrasts finding the station with the bridge being unusable.", "explain": "'But' contrasts finding the station with discovering the bridge was underwater.", "teach": "<b>But</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>but</b>(但是)表示两个事实之间的<b>对比</b>。</span>"}], "vocabulary": [{"q": "'Detour' means ___.", "choices": ["the shortest path available", "an alternate route taken to avoid an obstacle", "a type of bridge"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Ranger Kim pointed to yellow ribbons tied along a temporary detour."}, {"q": "'Assumption' means ___.", "choices": ["a proven scientific fact", "a type of map symbol", "something believed to be true without checking"], "answer": 2, "evidencePage": 6, "hint": "Look at page 6.", "explain": "Nia added that fact so another reader would not make her first assumption."}, {"q": "'Reliable' means ___.", "choices": ["able to be trusted to be accurate or consistent", "confusing and unclear", "loud and sudden"], "answer": 0, "evidencePage": 7, "hint": "Look at page 7.", "explain": "Nia's map included the question: Which clues are reliable now?"}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(detour|assumption|reliable)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 4 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function saveProgress(){try{localStorage.setItem("les-the-path-of-silver-reeds-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-path-of-silver-reeds"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-path-of-silver-reeds",bookTitle:"The Path of Silver Reeds",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.
