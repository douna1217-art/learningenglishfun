<script>/*les-speech-shim*/
(function(){var w=window,ok=false,errs=[];
/* Some Android in-app browsers (UC/Quark and other vendor kernels, older WebViews) have no
   speechSynthesis at all. The page script calls it while loading, so it stopped there and the
   story was never drawn (the quiz still worked because its handlers were bound earlier).
   Give such browsers a silent stand-in so the rest of the page runs normally. */
try{ok=typeof w.speechSynthesis==="object"&&w.speechSynthesis!==null}catch(e){}
if(typeof w.SpeechSynthesisUtterance!=="function"&&typeof w.SpeechSynthesisUtterance!=="object"){
w.SpeechSynthesisUtterance=function(t){this.text=t==null?"":String(t);this.lang="";this.rate=1;this.pitch=1;this.volume=1;this.voice=null}}
if(!ok){var gen=0,told=false;
w.speechSynthesis={speaking:false,paused:false,pending:false,
getVoices:function(){return[]},cancel:function(){gen++},pause:function(){},resume:function(){},
addEventListener:function(){},removeEventListener:function(){},
speak:function(u){var g=gen;
if(!told&&typeof w.setStatus==="function"){told=true;try{w.setStatus("This browser can't read aloud, but you can still read and practice. 当前浏览器不支持朗读，仍可阅读和做题。",false)}catch(e){}}
setTimeout(function(){if(g===gen&&u&&u.onstart){try{u.onstart({})}catch(e){}}},0);
setTimeout(function(){if(g===gen&&u&&u.onend){try{u.onend({})}catch(e){}}},Math.max(600,String(u&&u.text||"").length*60))}}}
/* If the story still is not drawn after loading, say why on the page itself, so a screenshot
   from a phone we cannot test on shows the cause. */

<script>

const pages=[{"type": "cover", "title": "The Blue Book in the Green Cover", "subtitle": "What We Remember Can Be Right and Hidden at the Same Time", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-blue-book-in-the-green-cover-assets/cover.jpg"}, {"text": "1. A Very Certain Color\nThe customer remembered that the book was blue. She remembered this so firmly that Theo searched every blue spine in Aunt Mara's shop before asking another question. He found a gardening book, a dictionary, and a guide to ships. None made the customer smile.\n“It was a story,” she said. “My mother read it to me when I was small.” Her name was Ms. Alvarez. She had brought an empty bag because she hoped to take the book home to her grandson. Theo wanted to find it before Aunt Mara finished unpacking a box. He liked being the person who knew where things were. Unfortunately, the shop contained a great many blue books.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-blue-book-in-the-green-cover-assets/page1.jpg"}, {"text": "2. The People in the Story\nAunt Mara asked what happened in the story. Ms. Alvarez thought for a while. There was a girl who lived beside the sea. There was also a fish, although she could not remember whether it was enormous or simply important. Theo selected three books with fish on their covers.\nMs. Alvarez shook her head at each one. The girl had owned a wooden spoon, she said, and somebody had been hungry. “A fish with a spoon?” Theo asked. “Possibly,” she answered. “Or perhaps I am remembering supper.” Aunt Mara laughed, but Theo frowned. His little stack of answers was growing, and none of them was right.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-blue-book-in-the-green-cover-assets/page2.jpg"}, {"text": "3. A Girl Who Made Soup\nTheo fetched paper. This time he wrote down what Ms. Alvarez remembered instead of running to a shelf. The girl had made soup for someone who knocked at her door. Each visitor had been larger than the last. One had carried a ladder because the doorbell was too high.\nAt that, Ms. Alvarez laughed. She could hear her mother's voice doing the visitor's very deep thank-you. Theo crossed out his fish guess. The fish might have belonged to another story, but the soup and the ladder belonged together. He asked what the house looked like. Ms. Alvarez closed her eyes. “Small,” she said. “Much too small for all those guests.”", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-blue-book-in-the-green-cover-assets/page3.jpg"}, {"text": "4. The Green Book on the Cart\nAunt Mara remembered an illustration of a giant kneeling beside a tiny cottage. She found the book on the cart of new arrivals. Its paper jacket was green. Theo almost put it aside without opening it. Then he noticed a little red bowl beneath the picture of the cottage.\nInside, a girl stirred a pot. On the next page, a giant bent down to hear her. Theo carried the book to Ms. Alvarez. She turned the pages slowly, stopping at the ladder. “That's him,” she said. Then she looked at the jacket again. “But I was so sure about the blue.” Theo wondered whether remembering one part clearly could make the other parts harder to see.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-blue-book-in-the-green-cover-assets/page4.jpg"}, {"text": "5. Underneath the Paper\nThe green jacket slipped as Ms. Alvarez reached the end. Beneath it was a blue cloth cover. Theo stared. Aunt Mara explained that the loose paper jacket protected the book. Sometimes families removed it before reading, especially when small children liked to turn pages themselves.\nMs. Alvarez ran her fingers along the blue cloth. She remembered a shelf above her mother's chair. The green paper had probably stayed there while the blue book came down to her lap. Theo spread the jacket carefully on the table. He had been looking at the part that might have been absent from every evening Ms. Alvarez remembered. The blue had been there all along.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-blue-book-in-the-green-cover-assets/page5.jpg"}, {"text": "6. The Last Visitor\nTheo asked whether she remembered the ending. Ms. Alvarez did not. She remembered asking for the story again before her mother had finished the last page. They read it together. After the enormous guests had eaten, a tiny visitor arrived. The girl gave him the smallest bowl and sat beside him to share her supper.\n“I thought the biggest guest would be the important one,” Theo said. Ms. Alvarez smiled. She had thought finding the book would make her remember everything at once. Instead, some parts were returning slowly, while others felt new. Aunt Mara brought a clean paper bag. Ms. Alvarez said the bag she had carried in would do very nicely.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-blue-book-in-the-green-cover-assets/page6.jpg"}, {"text": "7. A Better First Question\nAt the door, Ms. Alvarez put the book in her brown bag, with the green jacket folded safely around it. She said she would tell her grandson how they had found it. Theo hoped she would leave out the dictionary. She promised nothing.\nLater, a man asked Aunt Mara for a book with a yellow cover. Theo looked toward the shelves, then stopped. He pulled his notebook closer. “What do you remember about the story?” he asked. The man said there might have been a dog. Theo uncapped his pencil. This time, he was ready to hear about a dog without deciding that the cover had to show one.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-blue-book-in-the-green-cover-assets/page7.jpg"}];

gs, like <b>the girl who made soup</b> and <b>the book which was green</b>.<span class='cn'><b>who</b> 用于人，<b>which</b> 用于物，比如 <b>the girl who made soup</b>（做汤的女孩）和 <b>the book which was green</b>（那本绿色的书）。</span>"}, {"q": "‘The book kept ___ blue cloth cover hidden.’ Which word belongs in the blank?", "choices": ["its’", "its", "it’s"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "The blue cover belongs to the book, so the sentence needs “its” with no apostrophe.", "teach": "<b>Its</b> shows that something belongs to it, but <b>it’s</b> is short for it is.<span class='cn'><b>Its</b> 表示“它的”，而 <b>it’s</b> 是 it is 的缩写。</span>"}, {"q": "Which one is a complete sentence?", "choices": ["Theo found the green book.", "Beneath the green paper jacket.", "When the jacket slipped."], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "“Theo found the green book” has someone doing something, so it is a complete sentence.", "teach": "A <b>complete sentence</b> has a subject and a verb and tells a whole idea, but a <b>fragment</b> leaves part of the idea out.<span class='cn'><b>完整的句子</b>有主语和动词，表达完整的意思，而<b>残缺句</b>少了一部分内容。</span>"}], "vocabulary": [{"q": "‘Firmly’ means ___.", "choices": ["in a strong way that does not change", "in a loud and cheerful way", "in a slow and sleepy way"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "She remembered this so firmly that Theo searched every blue spine in the shop."}, {"q": "‘Enormous’ means ___.", "choices": ["very old", "very large", "very quiet"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "She could not remember whether the fish was enormous or simply important."}, {"q": "‘Illustration’ means ___.", "choices": ["the name of an author", "a list of chapters", "a picture that goes with the words in a book"], "answer": 2, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Aunt Mara remembered an illustration of a giant kneeling beside a tiny cottage."}]};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(firmly|enormous|illustration)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
