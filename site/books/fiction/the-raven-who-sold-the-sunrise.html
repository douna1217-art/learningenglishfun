<script>

const pages=[{"type": "cover", "title": "The Raven Who Sold the Sunrise", "subtitle": "A Raven Who Believes His Call Makes the Sun Rise Starts Charging Berries and Finds Out What He Is Really Selling", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-raven-who-sold-the-sunrise-assets/cover.jpg"}, {"text": "1. A Morning Discovery\nBram the raven had an excellent voice for waking sleeping creatures. It could pass through a closed burrow door, interrupt a dream, and make a squirrel drop whatever it was pretending not to eat. One morning, he called from the old stump just before the first edge of sunlight appeared above the ridge. Alba the badger emerged with her work basket. “There it is,” she said. “Thank you for that.” She meant the warning that morning had begun.\nBram, however, looked from his beak to the sun. He had called, and the sun had risen. The sequence seemed remarkably clear. On the following morning, he tried again. He called twice, more loudly, and watched the light arrive between two pines. By breakfast, he had repeated the story often enough to remember it as a discovery. By lunch, he was wondering whether a creature with such an important responsibility should have to gather his own berries.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-raven-who-sold-the-sunrise-assets/page1.jpg"}, {"text": "2. Two Berries for the Light\nHe placed a basket beside the stump and announced a sunrise fee of two berries per household. Pip the mouse paid immediately. He worried about many things, including whether there would be enough light to find his way home. A squirrel paid because she disliked arguments before breakfast. Others walked past, saying the sun had managed before Bram's arrival. “You cannot expect proper service without supporting it,” Bram called after them. He liked the sound of proper service.\nThe berries made a handsome pile. For three mornings, Bram stood straighter and called with a solemnity he had never used when shouting at beetles. Each time, the sun appeared. Pip began bringing a younger mouse to watch. The squirrel told her neighbors the service was reliable, though she had never actually doubted it. Bram heard only the word reliable. When an idea pleased him, the inconvenient parts of other creatures' sentences grew strangely difficult to remember.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-raven-who-sold-the-sunrise-assets/page2.jpg"}, {"text": "3. The Customer Who Disagreed\nAlba came on the fourth morning, carrying two berries in a folded leaf. “I appreciate being woken before I start work,” she said. “I'll pay for the call, if you keep it at the same time.” Bram shook his head. “The call is included. What you are purchasing is sunrise.” Alba set the leaf down. “No,” she said. “That is what you say you're selling. It isn't what I'm buying.” Bram found this unnecessarily complicated.\nHe asked her to imagine a day when he refused to call. Alba said she would prefer to imagine it after breakfast. Then she asked whether he had ever waited to see what happened without him. Bram opened his beak, but the answer he wanted was not available. He had always enjoyed calling, so he had always called. “I wouldn't risk everyone's morning on an experiment,” he said. Alba picked up her work basket. She left the berries, which Bram accepted as evidence that he had won.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-raven-who-sold-the-sunrise-assets/page3.jpg"}, {"text": "4. A Sky That Would Not Cooperate\nOn the fifth morning, heavy clouds covered the ridge. Bram called. The forest brightened, but no golden circle appeared between the pines. He called again. Pip waited beside the basket, twisting his tail. “Is it broken?” the mouse asked. Bram disliked the question so much that he answered it before thinking. “The sky is taking longer than usual. Important work cannot be hurried.” The squirrel looked up at the pale clouds and continued toward her breakfast.\nBram climbed to a higher branch and called until his throat felt rough. Nothing in the sky seemed to notice. At last, a gap opened in the clouds, and sunlight reached the stump. Pip sighed with relief. Bram bowed as if the delay had been planned. Yet that evening, while sorting berries, he remembered how the forest had grown light before the sun became visible. He tried to explain this to himself. His explanation became longer every time he repeated it.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-raven-who-sold-the-sunrise-assets/page4.jpg"}, {"text": "5. The Morning Without a Call\nBefore dawn, Bram returned to the stump and decided to remain silent. It was not a decision he intended to announce. If the sun failed to rise, he could still rescue the morning. He waited with his beak shut while the dark shapes of the trees became separate branches. Somewhere, another bird began a song. Bram wanted to interrupt it. Instead, he gripped the stump and watched the narrow strip of sky above the ridge.\nThe sun appeared between the pines. Bram had not made a sound. He waited a little longer, as though the light might realize its mistake and retreat. It spread across the grass. Pip arrived with his berries and looked up at him. “You're late,” the mouse said. Bram considered explaining that he had arranged the sunrise silently. It was a much better story for him. It was also a story he now knew he would have to invent. He stepped down from the tallest part of the stump.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-raven-who-sold-the-sunrise-assets/page5.jpg"}, {"text": "6. What the Basket Contained\n“The sunrise is not mine,” he told Pip. The mouse listened carefully, then asked why he had paid for it. Bram did not have a comfortable answer. He called the other customers together, although gathering an audience was less enjoyable this time. He explained what he had observed. The squirrel said she had expected as much. Pip said she could have mentioned it earlier. For once, Bram did not try to settle an argument by being the loudest creature present.\nHe returned the berries still in the basket. He had eaten some, and promised to gather replacements over the next several days. Alba asked him to say exactly how many he owed. Together they counted the households and separated the repayments into small leaf parcels. Bram spent the afternoon searching the bramble patch instead of discussing his importance. By evening, his scarf was caught on a thorn and his feet were tired. The basket was filling slowly. He kept gathering.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-raven-who-sold-the-sunrise-assets/page6.jpg"}, {"text": "7. A Smaller Business\nWhen the final parcel had been delivered, Bram left the basket in his nest for a day. The forest woke without him. It was an unpleasantly useful thing to observe. The following evening, Alba stopped below his tree. She still wanted a reliable morning call. She offered the same two berries, for the service she had named before. Bram asked what would happen on mornings when clouds covered the ridge. “I still need to wake up,” she said.\nHe agreed to call at the usual time and to make no promises about the sky. Pip did not become a customer. He preferred to sleep later, now that he knew the light would arrive without his payment. On Bram's first morning back at work, the raven waited until the forest had begun to pale. Then he called toward Alba's burrow. A door opened, a basket scraped over the ground, and the badger thanked him. Bram accepted the thanks. Behind the ridge, the sun continued on its way.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-raven-who-sold-the-sunrise-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did Bram decide after calling and seeing the sun rise?", "choices": ["That the sun was broken", "That his call made the sunrise happen", "That he should stop calling"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "He had called, and the sun had risen, and the sequence seemed remarkably clear."}, {"q": "What fee did Bram announce?", "choices": ["A fee for every leaf", "Two berries per household for the sunrise", "One basket a week from each bird"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "He announced a sunrise fee of two berries per household."}, {"q": "What did Alba say she was really buying?", "choices": ["The sunrise itself", "A basket of berries", "The wake-up call, not the sunrise"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "She said that was what Bram said he was selling, but not what she was buying."}, {"q": "What happened when Bram stayed silent at dawn?", "choices": ["The sun did not rise", "A new bird took over the call", "The sun rose anyway, and Pip said he was late"], "answer": 2, "evidencePage": 5, "hint": "Look at page 5.", "explain": "The sun appeared between the pines, and Bram had not made a sound."}, {"q": "What did Bram agree to do for Alba at the end?", "choices": ["Call at the usual time and make no promises about the sky", "Sell her the sunrise again", "Make the sun rise earlier"], "answer": 0, "evidencePage": 7, "hint": "Look at page 7.", "explain": "He agreed to call at the usual time and to make no promises about the sky."}], "grammar": [{"q": "‘The squirrel shared the berries ___ the three neighbors.’ Which word belongs in the blank?", "choices": ["among", "beside", "between"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Use among for three or more, and between for two.", "teach": "Use <b>between</b> for two things, like <b>between two pines</b>, and <b>among</b> for three or more.<span class='cn'>两者之间用 <b>between</b>，比如 <b>between two pines</b>；三者或更多之间用 <b>among</b>。</span>"}, {"q": "The root ‘vis’ means ‘see’. What does ‘visible’ mean?", "choices": ["Too small to hold", "Hard to hear", "Able to be seen"], "answer": 2, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Visible describes something that can be seen.", "teach": "The root <b>vis</b> means see, so <b>visible</b> means able to be seen.<span class='cn'>词根 <b>vis</b> 表示“看”，所以 <b>visible</b> 就是看得见的。</span>"}, {"q": "‘She left the berries, which Bram accepted as evidence that he had won.’ What does this show about Bram?", "choices": ["He misread what Alba meant because he only noticed what pleased him", "He wanted Alba to leave", "He understood Alba perfectly"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Alba left the berries to pay for the call, but Bram thought it meant he had won.", "teach": "<b>Point of view</b> shows what a character believes, and here Bram misreads Alba because he hears only what pleases him.<span class='cn'><b>视角</b>展示角色的想法，这里 Bram 只听自己爱听的，所以误解了 Alba。</span>"}], "vocabulary": [{"q": "‘Solemnity’ means ___.", "choices": ["a silly game", "a serious and formal manner", "a sudden storm"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Bram called with a solemnity he had never used when shouting at beetles."}, {"q": "‘Reliable’ means ___.", "choices": ["able to be trusted to do what is expected", "very noisy", "easy to break"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "The squirrel told her neighbors the service was reliable."}, {"q": "‘Experiment’ means ___.", "choices": ["a loud call", "a test to find out what happens", "a kind of berry"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "I wouldn’t risk everyone’s morning on an experiment."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(solemnity|reliable|experiment)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 6 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}var TEACH_ICONS='<svg class="ic i-spk" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.5v5h3.6l4.9 4.5V5L7.6 9.5H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.6 9.2a4 4 0 010 5.6M18.2 6.6a7.6 7.6 0 010 10.8"/></svg><svg class="ic i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></svg><svg class="ic i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 5.3v13.4c0 .8.9 1.3 1.6.8l9.6-6.7c.6-.4.6-1.2 0-1.6L9.8 4.5c-.7-.5-1.6 0-1.6.8z"/></svg>';var _tp=null;function _tpSet(b,st){if(!b)return;b.classList.toggle('is-playing',st==='playing');b.classList.toggle('is-paused',st==='paused');b.setAttribute('aria-pressed',st==='playing'?'true':'false');var z=b.dataset.part==='cn',L=st==='playing'?(z?'\u6682\u505C':'Pause'):st==='paused'?(z?'\u7EE7\u7EED\u64AD\u653E':'Resume'):b.dataset.label;b.setAttribute('aria-label',L);b.title=L;}function stopTeachAudio(){var c=_tp;if(!c)return;_tp=null;try{if(c.audio){c.audio.onended=c.audio.onerror=c.audio.ontimeupdate=null;c.audio.pause();}}catch(e){}if(c.mode==='tts'){try{speechSynthesis.cancel();}catch(e){}}_tpSet(c.btn,'idle');}function _tpFallback(btn){try{var u=new SpeechSynthesisUtterance(btn.dataset.text||'');u.lang=btn.dataset.lang||'en-US';var cur={btn:btn,mode:'tts'};_tp=cur;u.onend=u.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');}};_tpSet(btn,'playing');speechSynthesis.speak(u);}catch(e){}}function playTeachAudio(btn){if(_tp&&_tp.btn===btn){if(_tp.mode==='audio'){var a0=_tp.audio;if(a0.paused){var p0=a0.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}

function saveProgress(){try{localStorage.setItem("les-the-raven-who-sold-the-sunrise-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-raven-who-sold-the-sunrise"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-raven-who-sold-the-sunrise",bookTitle:"The Raven Who Sold the Sunrise",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

let preferredVoice=null;
