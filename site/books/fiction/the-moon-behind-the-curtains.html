<script>/*les-speech-shim*/
(function(){var w=window,ok=false,errs=[];
/* Some Android in-app browsers (UC/Quark and other vendor kernels, older WebViews) have no
   speechSynthesis at all. The page script calls it while loading, so it stopped there and the
   story was never drawn (the quiz still worked because its handlers were bound earlier).
   Give such browsers a silent stand-in so the rest of the page runs normally. */
try{ok=typeof w.speechSynthesis==="object"&&w.speechSynthesis!==null}catch(e){}
if(typeof w.SpeechSynthesisUtterance!=="function"&&typeof w.SpeechSynthesisUtterance!=="object"){
w.SpeechSynthesisUtterance=function(t){this.text=t==null?"":String(t);this.lang="";this.rate=1;this.pitch=1;this.volume=1;this.voice=null}}
if(!ok){var gen=0,told=false;
w.speechSynthesis={speaking:false,paused:false,pending:false,
getVoices:function(){return[]},cancel:function(){gen++},pause:function(){},resume:function(){},
addEventListener:function(){},removeEventListener:function(){},
speak:function(u){var g=gen;
if(!told&&typeof w.setStatus==="function"){told=true;try{w.setStatus("This browser can't read aloud, but you can still read and practice. 当前浏览器不支持朗读，仍可阅读和做题。",false)}catch(e){}}
setTimeout(function(){if(g===gen&&u&&u.onstart){try{u.onstart({})}catch(e){}}},0);
setTimeout(function(){if(g===gen&&u&&u.onend){try{u.onend({})}catch(e){}}},Math.max(600,String(u&&u.text||"").length*60))}}}
/* If the story still is not drawn after loading, say why on the page itself, so a screenshot
   from a phone we cannot test on shows the cause. */
w.addEventListener("error",function(e){try{if(errs.length<3)errs.push(String(e&&e.message||e))}catch(x){}});
w.addEventListener("load",function(){try{var v=document.getElementById("pageView");
if(v&&!v.firstChild&&errs.length){var d=document.createElement("div"),s=document.createElement("small");
d.style.cssText="padding:24px;color:#b91c1c;font:15px/1.6 sans-serif";
d.appendChild(document.createTextNode("The story could not be shown in this browser. 此浏览器暂时无法显示故事。"));
d.appendChild(document.createElement("br"));s.textContent=errs.join(" | ");d.appendChild(s);v.appendChild(d)}}catch(x){}});
})();

<script>

const pages=[{"type": "cover", "title": "The Moon Behind the Curtains", "subtitle": "A Boy Saves His Painted Moon, Then Realizes His Little Brother Needs the Stage More Than He Does", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-moon-behind-the-curtains-assets/cover.jpg"}, {"text": "1. The Best Thing on the Stage\nTheo had painted the moon three times before he liked it. The first version looked like a banana. The second looked like a banana that had suffered a disappointment. Now a pale crescent shone against the blue panel, and Theo could imagine the audience noticing it before they noticed anything else. He cleaned his brush and stepped back. His younger brother Ben stood beside the curtain, turning the edge of his vest between his fingers.\nBen played a night watchman. He had one short question to ask before the other actors entered. Theo had a whole moon, a painted sky, and two afternoons of work behind him. When Ben said he might forget his question, Theo reminded him that it was only three words. Ben looked at the moon instead of answering. Theo assumed that meant he agreed.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-moon-behind-the-curtains-assets/page1.jpg"}, {"text": "2. Three Words in an Empty Hall\nAt rehearsal, Ben walked to his place and stared into the empty hall. Ms. Reyes waited beside the stage. The other actors waited out of sight. Ben opened his mouth. Nothing happened. Theo, who was checking the feet beneath his panel, whispered the question from behind the curtain. Ben said it so softly that even Theo could barely hear. Ms. Reyes thanked him and suggested trying again after a break.\nTheo followed Ben into the hallway. He said the line himself, loudly enough to make a custodian glance up. Ben said that was not the difficult part. He knew the words when nobody was waiting for them. It was the waiting that made them disappear. Theo wanted to explain that an audience would not be especially interested in three small words. Then he remembered how badly he wanted them to notice his moon.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-moon-behind-the-curtains-assets/page2.jpg"}, {"text": "3. A Mark in the Paint\nThe next afternoon, Theo found a dark streak across the lower tip of the crescent. Someone had leaned a damp brush against it. Ben was nearby with a cloth, trying to remove the mark and making its edges wider. He said he had been helping put things away. Theo took the cloth from him. The paint had dried just enough to resist cleaning and not enough to resist becoming worse.\nBen apologized. Theo said the moon had been finished, which was true but not useful. He kept rubbing until Ms. Reyes asked him to leave it alone. A branch painted over the mark might work, she suggested, once everything was dry. Theo looked at the clock. There would be little time before the evening performance. Ben slipped behind the curtain. Theo watched him go and did not call him back.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-moon-behind-the-curtains-assets/page3.jpg"}, {"text": "4. Someone on the Other Side\nFrom behind the curtain came Ben's question. Theo heard it clearly this time. Is anybody there? He answered before thinking, saying yes, someone who was trying to repair a moon. Ben laughed. The sound surprised them both. Theo went to the gap in the curtains. Ben was facing the blue panel's unpainted back. He said talking to something was easier than talking into a space where everybody expected him to be interesting.\nTheo stood still beside the panel. During rehearsals, he had worried about whether the audience could see his work. He had not thought about what Ben could see from the stage. Mostly there would be a dark hall and rows of faces he could not make out. Theo asked him to try the question again, this time looking toward his brother. Ben did. The words sounded like a question someone might actually ask.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-moon-behind-the-curtains-assets/page4.jpg"}, {"text": "5. A Different Place for the Moon\nMs. Reyes listened to their idea. Theo could stand where Ben would be able to see him through a narrow gap in the side curtain. He would not say the line or signal each word. He would simply be there to hear it. The moon panel, however, occupied the same spot. Moving it into the wing would leave that part of the scenery plain. Ms. Reyes said the play could begin beneath an ordinary dark sky.\nTheo looked at the streak on the crescent. He had spent so long trying to save the picture that he had not considered changing the picture. With Ms. Reyes helping at the other end, he carried the panel into the wide backstage space and set its feet down. Ben practiced again. Theo was visible in the gap. The moon was hidden behind them, where the audience would never admire it.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-moon-behind-the-curtains-assets/page5.jpg"}, {"text": "6. The First Question\nThat evening, Theo heard chairs scrape and programs rustle beyond the curtain. He had never noticed how much noise people made while waiting to be quiet. Ben stood a few steps away. He looked toward the gap once, then adjusted his vest. Theo wanted to offer another explanation, but Ben had heard enough explanations. He kept his hands at his sides and waited. Beside him, the damaged moon leaned securely on its wooden feet.\nThe lights changed. Ben walked into his place. For one uncomfortable moment, nothing happened. Theo could hear his own breathing. Then Ben turned his face slightly toward the gap and asked his question. His voice reached the hall. The next actor answered from the far side of the stage, exactly as the script required. Ben looked toward that voice and continued. Theo stayed where he was, grinning at a crescent nobody could see.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-moon-behind-the-curtains-assets/page6.jpg"}, {"text": "7. What They Carried Home\nAfter the play, people congratulated Ben. He said his brother had helped, and Theo wondered whether that would be the story Ben told every time. Then someone asked who had painted the scenery. Theo began to point toward the hidden panel before remembering there was nothing to point at. Ms. Reyes gave him the clean brushes to take home. She said the moon could stay at school until Monday.\nOutside, Ben asked whether Theo was still angry about the mark. Theo said he wished it had not happened. Ben nodded. Neither of them tried to turn that answer into a nicer one. At the car, Ben asked his three words once more, this time in a deep and ridiculous watchman's voice. Theo answered that there was, unfortunately, an older brother carrying a bucket of brushes. Ben held the door for him.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-moon-behind-the-curtains-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What was Ben’s part in the play?", "choices": ["The moon", "The director", "A night watchman with one short question of three words"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Ben played a night watchman who had one short question to ask before the other actors entered."}, {"q": "Why did Ben forget his line at rehearsal?", "choices": ["He was angry at Theo", "He had never learned them", "He knew the words, but the waiting made them disappear"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Ben said he knew the words when nobody was waiting for them, and it was the waiting that made them disappear."}, {"q": "What happened to Theo’s moon?", "choices": ["A dark streak smeared on the crescent, and Ben’s cleaning made it wider", "It fell off the stage", "It was stolen"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Someone leaned a damp brush against it, and Ben’s cleaning made the edges wider."}, {"q": "How did Ben manage to say his line behind the curtain?", "choices": ["He read it from a card", "He asked it to Theo, who answered, and it felt like a real question", "He whispered it to the wall"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Theo answered him, Ben laughed, and when Ben tried again toward his brother, the words sounded like a real question."}, {"q": "What did they change so Ben could perform?", "choices": ["They cut Ben’s line", "Theo stood visible in a gap in the side curtain, and the moon panel was moved into the wing", "They moved the play to another day"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Theo would stand where Ben could see him through a narrow gap, and the moon panel was moved out of the way."}], "grammar": [{"q": "The Latin root ‘cresc’ means ‘grow’, as in ‘crescent’. Which word has the same root?", "choices": ["increase", "credit", "crumb"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "To increase is to grow larger.", "teach": "The Latin root <b>cresc</b> means grow, like <b>crescent</b> and <b>increase</b>.<span class='cn'>拉丁词根 <b>cresc</b> 表示“增长”，比如 <b>crescent</b>（新月）和 <b>increase</b>（增加）。</span>"}, {"q": "‘Ben spoke ___ at the evening performance.’ Which word describes how he spoke?", "choices": ["goodly", "well", "good"], "answer": 1, "evidencePage": 6, "hint": "Look at page 6.", "explain": "The word describes how he spoke, so it needs the adverb “well”.", "teach": "<b>Good</b> describes a noun, but <b>well</b> describes how an action is done, like <b>he spoke well</b>.<span class='cn'><b>good</b> 修饰名词，而 <b>well</b> 说明动作做得怎么样，比如 <b>he spoke well</b>（他说得很好）。</span>"}, {"q": "‘Theo was visible in the gap.’ Which word means the opposite of ‘visible’?", "choices": ["hidden", "bright", "narrow"], "answer": 0, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Something hidden cannot be seen, which is the opposite of visible.", "teach": "<b>Antonyms</b> are words with opposite meanings, like <b>visible</b> and <b>hidden</b>.<span class='cn'><b>反义词</b>是意思相反的词，比如 <b>visible</b>（看得见的）和 <b>hidden</b>（藏起来的）。</span>"}], "vocabulary": [{"q": "‘Crescent’ means ___.", "choices": ["a full round circle", "a thin curved shape like a new moon", "a straight line"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Now a pale crescent shone against the blue panel."}, {"q": "‘Panel’ means ___.", "choices": ["a kind of paint", "a seat in a theater", "a flat piece of wood or board"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "A pale crescent shone against the blue panel."}, {"q": "‘Scenery’ means ___.", "choices": ["the painted background and objects on a stage", "the audience in a hall", "the lines an actor says"], "answer": 0, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Moving it into the wing would leave that part of the scenery plain."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(crescent|panel|scenery)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 5 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();setListenActive(null);page=Math.max(0,Math.min(pages.length-1,i));renderPage()}

function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}

function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}var TEACH_ICONS='<svg class="ic i-spk" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.5v5h3.6l4.9 4.5V5L7.6 9.5H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.6 9.2a4 4 0 010 5.6M18.2 6.6a7.6 7.6 0 010 10.8"/></svg><svg class="ic i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></svg><svg class="ic i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 5.3v13.4c0 .8.9 1.3 1.6.8l9.6-6.7c.6-.4.6-1.2 0-1.6L9.8 4.5c-.7-.5-1.6 0-1.6.8z"/></svg>';var _tp=null;function _tpSet(b,st){if(!b)return;b.classList.toggle('is-playing',st==='playing');b.classList.toggle('is-paused',st==='paused');b.setAttribute('aria-pressed',st==='playing'?'true':'false');var z=b.dataset.part==='cn',L=st==='playing'?(z?'\u6682\u505C':'Pause'):st==='paused'?(z?'\u7EE7\u7EED\u64AD\u653E':'Resume'):b.dataset.label;b.setAttribute('aria-label',L);b.title=L;}function stopTeachAudio(){var c=_tp;if(!c)return;_tp=null;try{if(c.audio){c.audio.onended=c.audio.onerror=c.audio.ontimeupdate=null;c.audio.pause();}}catch(e){}if(c.mode==='tts'){try{speechSynthesis.cancel();}catch(e){}}_tpSet(c.btn,'idle');}function _tpFallback(btn){try{var u=new SpeechSynthesisUtterance(btn.dataset.text||'');u.lang=btn.dataset.lang||'en-US';var cur={btn:btn,mode:'tts'};_tp=cur;u.onend=u.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');}};_tpSet(btn,'playing');speechSynthesis.speak(u);}catch(e){}}function playTeachAudio(btn){if(_tp&&_tp.btn===btn){if(_tp.mode==='audio'){var a0=_tp.audio;if(a0.paused){var p0=a0.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}
function returnToQuestion(){(function(){var b=document.getElementById("evidenceBanner");if(b&&b.parentNode)b.parentNode.removeChild(b);})();renderPanel();document.querySelector(".panel").scrollIntoView({behavior:"smooth",block:"start"})}
function nextQuestion(){const list=quizzes[activeTab];if(qIndex[activeTab]<list.length-1){qIndex[activeTab]++;renderPanel();return}completed[activeTab]=true;if(activeTab==="comprehension")activeTab="grammar";else if(activeTab==="grammar")activeTab="vocabulary";else{return showCompletion()}setTabs();renderPanel()}
function showCompletion(){completed.vocabulary=true;setTabs();const correct=Object.keys(selections).filter(k=>{const [tab,idx]=k.split('-');return selections[k]===quizzes[tab][+idx].answer}).length,total=Object.values(quizzes).reduce((a,b)=>a+b.length,0);document.getElementById("stagePill").textContent="Journey Complete";document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">Reading journey complete</div><h2>Wonderful work! 🎉</h2><p class="small">You finished Reading, Grammar, and Vocabulary.</p><div class="score-row"><div class="score-box"><b>${total}</b><br><span>Questions</span></div><div class="score-box"><b>${correct}</b><br><span>Correct now</span></div></div><div class="feedback good">You used evidence, practiced sentence skills, and learned new words.</div><button class="submit" onclick="restartPractice()">Practice Again</button></div>`}
function restartPractice(){activeTab="comprehension";qIndex={comprehension:0,grammar:0,vocabulary:0};selections={};attempts={};completed={comprehension:false,grammar:false,vocabulary:false};setTabs();renderPanel()}
function saveProgress(){try{localStorage.setItem("les-the-moon-behind-the-curtains-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-moon-behind-the-curtains"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-moon-behind-the-curtains",bookTitle:"The Moon Behind the Curtains",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}
function clearHighlight(){document.querySelectorAll(".story-word.reading").forEach(x=>x.classList.remove("reading"))}
let preferredVoice=null;
