const pages=[{"type": "cover", "title": "Juniper Hare Takes the Stage", "subtitle": "The Best Performance Began When the Actors Stopped Hiding the Mistake", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/juniper-hare-takes-the-stage-assets/cover.jpg"}, {"text": "1. The Hare with One Ear\nEli built the Juniper Hare puppet from russet felt, a carved wooden head, and one springy ear. Zuri painted a tiny white star above its left eye. For the neighborhood show, they would operate the puppet together behind a green patchwork curtain.\nTheir story ended with Juniper leaping over the Moon Gate. During rehearsal, Eli pulled the jump cord while Zuri turned the head. The hare rose beautifully—then its springy ear flew off and landed at Director Bell's shoes.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/juniper-hare-takes-the-stage-assets/page1.jpg"}, {"text": "2. Two Ideas for Hiding\nEli wanted to glue the ear in place and shorten the jump. Zuri wanted to keep the full leap and paint both ears flat against the head. Each plan concealed the accident, but each removed something that made Juniper expressive.\nDirector Bell asked what the scene was truly about. Eli said it was about reaching the Moon Gate. Zuri said it was about trying after a fall. They looked at the ear on the floor. The mistake suddenly resembled part of the story instead of an enemy outside it.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/juniper-hare-takes-the-stage-assets/page2.jpg"}, {"text": "3. Prose Tells the Inside\nEli rewrote the moment as prose: Juniper heard the crowd gasp. Heat rushed beneath his fur, and he wished the stage would swallow him. Then he saw the fallen ear and wondered whether losing it had changed where he needed to go.\nThe narrator could reveal Juniper's private embarrassment and question. Zuri liked the feeling, but actors could not simply read the paragraph aloud. The audience needed to understand through visible action, spoken words, and the timing of a pause.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/juniper-hare-takes-the-stage-assets/page3.jpg"}, {"text": "4. Drama Shows the Choice\nThey changed the page into a script: [JUNIPER lands. One ear drops. He freezes.] JUNIPER: I planned to arrive with everything. [He lifts the ear.] MOON: Perhaps you arrived with a story. JUNIPER: Then the story comes too.\nStage directions told the puppeteers when to stop and move. Dialogue let the audience hear the choice without a narrator explaining every thought. The forms did different work, yet both focused on the same turning point.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/juniper-hare-takes-the-stage-assets/page4.jpg"}, {"text": "5. The Wrong Kind of Perfect\nAt dress rehearsal, the repaired ear refused to detach. Their new scene depended on the accident, but the puppet had become too sturdy. Eli tugged harder, and Juniper's whole head tilted sideways. Zuri whispered that they were trying to force a mistake to look perfect.\nThey replaced the ear with a safe fabric loop that could release gently. Then they practiced the pause, the lifted ear, and the Moon's reply. The scene worked only when they listened to each other instead of racing through their separate jobs.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/juniper-hare-takes-the-stage-assets/page5.jpg"}, {"text": "6. Opening Night\nOn opening night, Juniper leaped. The ear dropped exactly beside the Moon Gate, and the audience gasped. Eli held the puppet still for one full breath. Zuri turned its painted eye toward the ear, making the silence feel like a thought.\n\"I planned to arrive with everything,\" Juniper said. When the Moon answered, a child in the front row nodded. The audience laughed warmly as Juniper tucked the ear under one arm and crossed the gate. The mistake had become the scene they remembered.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/juniper-hare-takes-the-stage-assets/page6.jpg"}, {"text": "7. After the Curtain\nEli saved both drafts in the prop box. The prose version explained what Juniper felt inside. The script recorded what performers should say and do. Neither was a failed version of the other; each offered a different doorway into the moment.\nZuri sewed the little white star firmly above Juniper's left eye, but left the ear's loop unchanged. At the next show, they would repeat the planned accident. It reminded them that good theater did not erase every surprise. Sometimes it gave surprise a purpose.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/juniper-hare-takes-the-stage-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What happened to Juniper's ear during rehearsal?", "choices": ["It flew off and landed at Director Bell's shoes", "It got painted a different color", "It was replaced immediately"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "The hare rose beautifully—then its springy ear flew off and landed at Director Bell's shoes."}, {"q": "What did Director Bell ask Eli and Zuri to think about?", "choices": ["How to fix the ear quickly", "What the scene was truly about", "Who was responsible for the accident"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Director Bell asked what the scene was truly about."}, {"q": "What could the prose version reveal that the puppet show alone could not?", "choices": ["The exact measurements of the stage", "The names of the audience members", "Juniper's private embarrassment and question"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "The narrator could reveal Juniper's private embarrassment and question."}, {"q": "What problem came up at dress rehearsal?", "choices": ["The repaired ear refused to detach", "The curtain would not open", "The audience arrived too early"], "answer": 0, "evidencePage": 5, "hint": "Look at page 5.", "explain": "At dress rehearsal, the repaired ear refused to detach."}, {"q": "What is the big idea of this story?", "choices": ["Puppets should never be repaired", "Good theater did not erase every surprise—sometimes it gave surprise a purpose", "Mistakes must always be hidden from the audience"], "answer": 1, "evidencePage": 7, "hint": "Look at the last page.", "explain": "Good theater did not erase every surprise. Sometimes it gave surprise a purpose."}], "grammar": [{"q": "'Each plan concealed the accident, ___ each removed something that made Juniper expressive.' Which word shows contrast?", "choices": ["but", "so", "and"], "answer": 0, "evidencePage": 2, "hint": "This word contrasts hiding the accident with losing something valuable.", "explain": "'But' contrasts each plan hiding the accident with each plan removing Juniper's expressiveness.", "teach": "<b>But</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>but</b>(但是)表示两个事实之间的<b>对比</b>。</span>"}, {"q": "'Eli held the puppet still for one full breath. ___ Zuri turned its painted eye toward the ear.' Which word signals what happened next?", "choices": ["Before", "Then", "Never"], "answer": 1, "evidencePage": 6, "hint": "This word signals the next action, in order.", "explain": "'Then' signals the next step: first Eli held the puppet still, then Zuri turned its eye.", "teach": "<b>Then</b> signals the <b>next step</b> in a sequence of events.<span class='cn'><b>then</b>(然后)标志一系列事件中的<b>下一步</b>。</span>"}, {"q": "'Its springy ear flew off ___ landed at Director Bell's shoes.' Which word joins these two actions?", "choices": ["but", "so", "and"], "answer": 2, "evidencePage": 1, "hint": "This word joins the two things that happened to the ear.", "explain": "'And' joins the ear flying off with it landing at Director Bell's shoes.", "teach": "<b>And</b> joins <b>two actions</b> happening one after another.<span class='cn'><b>and</b>(和)连接<b>先后发生</b>的两个动作。</span>"}], "vocabulary": [{"q": "'Rehearsal' means ___.", "choices": ["a practice session before a real performance", "the final live performance itself", "a type of stage curtain"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "During rehearsal, Eli pulled the jump cord while Zuri turned the head."}, {"q": "'Concealed' means ___.", "choices": ["displayed openly for everyone", "hidden or kept from being seen", "repaired completely"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Each plan concealed the accident."}, {"q": "'Expressive' means ___.", "choices": ["silent and without any movement", "made of metal or plastic", "showing feeling or meaning clearly through appearance or action"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Each plan removed something that made Juniper expressive."}]};

function saveProgress(){try{localStorage.setItem("les-juniper-hare-takes-the-stage-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="juniper-hare-takes-the-stage"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"juniper-hare-takes-the-stage",bookTitle:"Juniper Hare Takes the Stage",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.
