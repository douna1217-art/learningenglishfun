<script>

const pages=[{"type": "cover", "title": "The Fox Who Missed the Farewell", "subtitle": "A Friendship Can Travel Farther Than a Wagon", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-fox-who-missed-the-farewell-assets/cover.jpg"}, {"text": "1. The Empty Gate\nBy the time Rowan reached the cottage, the moving wagon was gone. He had spent the morning searching for the smooth green stone he meant to give Larch. It was their best skipping stone, although neither of them had ever made it skip more than twice. Now it sat heavily in his coat pocket.\nThe gate stood open. A pale rectangle showed where Larch's nameplate had been. Rowan knocked anyway, first politely, then hard enough to make a leaf fall from the doorframe. No answer came. He had imagined an excellent farewell, with a gift, a joke, perhaps no crying. He had arrived too late for any of it.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-fox-who-missed-the-farewell-assets/page1.jpg"}, {"text": "2. Something Left Behind\nOn the doorstep lay an envelope tucked beneath a flowerpot. Rowan recognized the crooked leaf Larch always drew beside his name. Inside was the address of the new house beyond Willow Hill and a short letter. Larch had waited as long as he could. The wagon driver had needed to leave before noon.\nAt the bottom, Larch had added a question. Would Rowan tell him when the little blue flower beside the gate opened? Rowan looked down. It had opened that morning. He almost called out the news. Then he remembered the empty rooms and folded the letter along every crease until it was a very small square.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-fox-who-missed-the-farewell-assets/page2.jpg"}, {"text": "3. The First Letter\nThat evening, Rowan wrote that everything in the village was exactly the same. He described the baker's enormous rolls and the duck who slept through the market bell. Both were true. He did not mention passing the cottage three times or finding nobody to share the last roll with.\nHe read the letter aloud to his mother. She was a red fox too, but her coat was the color of dark honey. “Does that tell Larch what you want him to know?” she asked. Rowan rubbed one paw across the page. He wanted Larch to think he was doing splendidly. He also wanted his friend to come back. Neither wish fitted into his neat little account of the duck.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-fox-who-missed-the-farewell-assets/page3.jpg"}, {"text": "4. A Less Perfect Page\nRowan began again. This time he wrote about the stone and the empty gate. He told Larch that he was sorry he had missed the wagon. He wished the new house were next door instead of beyond the hill. Then he described the blue flower, including its tiny bent petal.\nThe letter looked untidy. One sentence climbed uphill, and a drop of water had blurred the word gate. Rowan left it there. He wrapped the green stone in a scrap of cloth and asked his mother to help him pack it safely. At the village post office, he watched the parcel disappear into the mail sack. His pocket felt strangely light on the way home.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-fox-who-missed-the-farewell-assets/page4.jpg"}, {"text": "5. Days Without an Answer\nFor three mornings, Rowan visited the post office before breakfast. On the fourth, the postmistress suggested that letters traveled more slowly than foxes worried. Rowan went to the pond instead. He tried a different stone. It sank with an ordinary plunk.\nA young badger watched from the reeds. Her name was Nell, and she could not make stones skip at all. Rowan showed her the low, sideways throw Larch had taught him. Neither stone skipped, but Nell's splashed his boots. They laughed. Later, Rowan felt a small pinch of guilt. He had enjoyed the afternoon without Larch. He wondered whether he should leave that part out of his next letter.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-fox-who-missed-the-farewell-assets/page5.jpg"}, {"text": "6. The Window Beyond the Hill\nLarch's reply arrived in a blue envelope. He had put the green stone on his windowsill. Beyond the glass stood a pear tree, which Rowan had never seen. Larch missed the pond, but he had met an otter who knew a stream full of flat stones. Would Rowan like to visit when their families could arrange it?\nRowan read the letter twice. Larch sounded lonely in one sentence and excited in the next. Apparently both could fit on the same page. Rowan fetched his pencil. He wrote about Nell, the splash, and the stone that had sunk. Then he asked whether the pear tree was tall enough to shade Larch's whole room.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-fox-who-missed-the-farewell-assets/page6.jpg"}, {"text": "7. Another Place to Knock\nTwo weeks later, Rowan and his mother walked beyond Willow Hill. Larch opened the new door before they reached the step. For a moment, Rowan forgot the speech he had practiced. Then Larch said the stone had still refused to skip, even in its new town.\nRowan laughed and followed him to the window. The green stone lay beneath a pear-tree shadow. There were boxes against one wall and two cups on the table. Rowan took out a folded drawing of the blue flower. This time he had arrived before anything was finished. Larch moved a box off the second chair. Rowan sat down and began telling him about home.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-fox-who-missed-the-farewell-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did Rowan want to give Larch before he moved?", "choices": ["A blue flower", "A smooth green skipping stone", "A drawing of the cottage"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Rowan had spent the morning searching for the smooth green stone he meant to give Larch."}, {"q": "What did Larch leave on the doorstep?", "choices": ["An envelope with his new address and a letter", "His old nameplate", "A basket of rolls"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "An envelope lay beneath a flowerpot, with the new address and a short letter inside."}, {"q": "What did Rowan leave out of his first letter?", "choices": ["That he had passed the cottage three times and had nobody to share the last roll with", "That a duck slept through the market bell", "That the baker made enormous rolls"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "He did not mention passing the cottage three times or finding nobody to share the last roll with."}, {"q": "How was Rowan’s second letter different from his first?", "choices": ["It told Larch how he really felt", "It only talked about the duck", "It was neater and shorter"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "This time he wrote about the stone and the empty gate, said he was sorry, and wished the new house were next door."}, {"q": "What did Rowan bring to Larch’s new house?", "choices": ["A pear tree", "A folded drawing of the blue flower", "A new skipping stone"], "answer": 1, "evidencePage": 7, "hint": "Look at the last page.", "explain": "Rowan took out a folded drawing of the blue flower."}], "grammar": [{"q": "Which sentence uses a comma correctly?", "choices": ["Rowan wrote, the letter and Larch wrote back.", "Rowan wrote the letter, and Larch wrote back.", "Rowan wrote the letter and, Larch wrote back."], "answer": 1, "evidencePage": 6, "hint": "Look at page 6.", "explain": "In a sentence with two main parts, the comma goes before the joining word “and”.", "teach": "When you join two complete sentences with <b>and</b>, <b>but</b>, or <b>so</b>, put a comma before the joining word.<span class='cn'>用 <b>and</b>、<b>but</b> 或 <b>so</b> 连接两个完整的句子时，要在连接词前面加逗号。</span>"}, {"q": "‘Rowan felt ___ after he wrote the honest letter.’ Which word belongs in the blank?", "choices": ["more lighter", "lightest", "lighter"], "answer": 2, "evidencePage": 4, "hint": "Look at page 4.", "explain": "He compared how he felt now with how he felt before, so the sentence needs “lighter”.", "teach": "Add <b>er</b> to a short word to compare two things, like <b>light</b> and <b>lighter</b>.<span class='cn'>给较短的词加 <b>er</b> 来比较两件事，比如 <b>light</b> 变成 <b>lighter</b>（更轻的）。</span>"}, {"q": "‘The letter looked untidy.’ What does the prefix ‘un-’ mean in ‘untidy’?", "choices": ["again", "not", "before"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "The prefix “un-” means not, so untidy means not tidy.", "teach": "The prefix <b>un</b> means not, like <b>untidy</b> and <b>unkind</b>.<span class='cn'>前缀 <b>un</b> 表示“不”，比如 <b>untidy</b>（不整齐的）和 <b>unkind</b>（不友善的）。</span>"}], "vocabulary": [{"q": "‘Politely’ means ___.", "choices": ["in a kind way that shows good manners", "in a quick and careless way", "in a loud and angry way"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Rowan knocked anyway, first politely, then hard enough to make a leaf fall."}, {"q": "‘Guilt’ means ___.", "choices": ["a feeling of being very sleepy", "a gift for a friend", "an uneasy feeling that you did something wrong"], "answer": 2, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Later, Rowan felt a small pinch of guilt."}, {"q": "‘Splendidly’ means ___.", "choices": ["very quietly", "very slowly", "very well"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "He wanted Larch to think he was doing splendidly."}]};

function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 4 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[ke
