<script>/*les-speech-shim*/
(function(){var w=window,ok=false,errs=[];

try{ok=typeof w.speechSynthesis==="object"&&w.speechSynthesis!==null}catch(e){}

addEventListener:function(){},removeEventListener:function(){},
speak:function(u){var g=gen;

<script>

const pages=[{"type": "cover", "title": "The Robot Who Kept My Seat", "subtitle": "A Boy Asks a School Robot to Guard Three Empty Seats and Slowly Learns the Difference Between Keeping a Place and Making a Choice", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-robot-who-kept-my-seat-assets/cover.jpg"}, {"text": "1. The Same Place Every Day\nPip could find a room, remember a deadline, and keep a place at a lunch table while its borrower washed their hands. The school lent the little wheeled assistants to students who wanted help organizing the day. Malik borrowed one because he kept losing his schedule. By the second week, he had found another use for it.\nHis friends had been assigned a later lunch period. On the first Monday, he asked Pip to keep their usual places anyway. A small amber light appeared on the tabletop, and Pip politely told anyone who approached that the places were reserved. Malik knew Tomas and the others wouldn't arrive. He told himself that sitting somewhere familiar made the new schedule easier. The empty chairs were temporary, like a coat left on a hook. He could move when he felt ready. That was what made asking the robot seem different from making a decision.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-robot-who-kept-my-seat-assets/page1.jpg"}, {"text": "2. A Question from Across the Table\nOn Tuesday, Asha stopped beside the amber light. She asked who the seats were for. Malik said his friends. She looked at the clock, then at his tray. She had seen him eating alone yesterday. He asked whether she wanted him to explain the new lunch schedule. She said she had only wanted to know if anyone was coming.\nPip announced that a reservation could be extended. Malik touched the button on his wrist screen. Asha went to another table. For a while, he felt relieved that the conversation had ended without anything awkward happening. Then he noticed that she had not asked whether she could become his friend, or whether he liked her, or any of the difficult questions he had prepared answers for. She had been holding a lunch tray. He had made a question about a chair sound as if it required a schedule.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-robot-who-kept-my-seat-assets/page2.jpg"}, {"text": "3. The Report Pip Could Give\nAt the end of the week, Malik checked Pip's activity report. It had protected his seat successfully every day. No stranger had taken his friends' places. No unexpected change had interrupted his meal. The report made the week sound excellent. Malik remembered eating three lunches so quickly that he couldn't recall what he had tasted.\nHe asked Pip whether it thought he should sit somewhere else. The robot said it could compare distances from the serving counter and noise levels near the doors. He asked which table had people who might want him there. Pip paused, then said it did not have permission to judge students' private feelings. Malik was annoyed, although he was glad it could not do that. It could help him find an empty chair. It could not guarantee what would happen after he sat down. He had been waiting for a feature the school had never offered.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-robot-who-kept-my-seat-assets/page3.jpg"}, {"text": "4. What Tomas Had Been Doing\nMalik met Tomas in the library after school. He expected to hear that the later lunch period was terrible. Tomas complained about the line, then described a girl who could balance a spoon on her nose. He had sat with her twice. Malik asked whether they were friends now. Tomas shrugged. They had mostly discussed whether the trick counted if she used a shorter spoon.\nMalik told him about the reserved seats. Tomas looked surprised, then a little guilty. He hadn't known they were still waiting for him. Malik said they weren't waiting exactly. The sentence grew difficult before he reached the end. Tomas suggested meeting in the courtyard before classes on Fridays. It would not give them back their old lunches, but it was something they could actually do. Malik agreed. He was relieved that Tomas didn't offer to stop liking the people at his new table.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-robot-who-kept-my-seat-assets/page4.jpg"}, {"text": "5. The First Chair He Did Not Keep\nOn Monday, Malik canceled two reservations. He left the third active, although he couldn't explain why one empty chair felt safer than none. Asha passed his table with a classmate. She asked whether the other places were free. Malik said yes. They sat down and began discussing a game he hadn't played. He ate quietly, unable to decide whether the silence on his side counted as failure.\nThen Asha asked if he knew how to get a game piece out of a narrow gap. Malik suggested turning the board over. She laughed and explained that the board was digital. He laughed too, mostly at the seriousness of his own suggestion. Pip's amber light remained beside the last empty chair. Asha asked whether that friend was coming tomorrow. Malik looked at the light. He said nobody was coming. He had just been keeping the place because he didn't know what else to do.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-robot-who-kept-my-seat-assets/page5.jpg"}, {"text": "6. A Different Kind of Instruction\nAsha did not tell him that everything would be easy now. She said she sometimes wanted to reserve the seat beside her so she wouldn't have to wonder who would choose it. Malik asked why she didn't. She said she also wanted someone to choose it. She said it lightly, but he heard the difficulty inside it.\nHe ended the final reservation. When another student asked about the chair, Malik moved his bag from under it and said it was free. The student sat down without asking why a robot had been guarding it. Later, Malik changed Pip's usual lunch task. It could remind him to return his tray and help find a quiet route when the hallway was crowded. It would not hold places for people who weren't coming. Pip accepted the instructions without sounding either proud or disappointed. Malik liked that it let him change the rule without making a speech.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-robot-who-kept-my-seat-assets/page6.jpg"}, {"text": "7. Friday Before Classes\nOn Friday, Malik found Tomas in the courtyard. They had twelve minutes before the bell. Tomas tried the spoon trick using a dry leaf, which slid off immediately. Malik told him about the game he still didn't understand. Neither story was important enough to send in a message. He liked that they had made time to tell them anyway.\nAt lunch, Asha was absent. Malik felt the old uncertainty when he reached the table. He sat down without asking Pip to turn on its light. A boy asked if the chair beside him was taken. Malik said no. The boy began eating, and for a while neither of them spoke. Malik took a bite of his sandwich. The afternoon did not arrive with a guarantee. Beside him was an occupied chair, and the possibility of a conversation he had not arranged in advance.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-robot-who-kept-my-seat-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "Why did Malik ask Pip to keep seats at the lunch table?", "choices": ["He wanted to save seats for a party", "Pip had asked him to", "His friends had moved to a later lunch period, and a familiar place made the new schedule easier"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "His friends had been assigned a later lunch, and he told himself that sitting somewhere familiar made the new schedule easier."}, {"q": "What did Asha ask when she stopped beside the amber light?", "choices": ["Who the seats were for and whether anyone was coming", "Whether Malik liked lunch", "Whether she could borrow the robot"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "She asked who the seats were for and said she only wanted to know if anyone was coming."}, {"q": "What did Pip say when Malik asked which table had people who might want him there?", "choices": ["It did not have permission to judge students’ private feelings", "It named a table right away", "It said no one wanted him"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Pip said it could compare distances and noise, but did not have permission to judge students’ private feelings."}, {"q": "What did Tomas and Malik agree to do?", "choices": ["Ask Pip to hold seats for both of them", "Sit together at lunch every day", "Meet in the courtyard before classes on Fridays"], "answer": 2, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Tomas suggested meeting in the courtyard before classes on Fridays, and Malik agreed."}, {"q": "What did Malik finally tell Asha about the last empty chair?", "choices": ["He wanted to keep it for the robot", "Nobody was coming, and he had been keeping the place because he didn’t know what else to do", "His friend would arrive tomorrow"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "He said nobody was coming and that he had just been keeping the place."}], "grammar": [{"q": "The Latin root ‘serv’ means ‘keep’ or ‘save’. Which word has the same root?", "choices": ["preserve", "serious", "series"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "To preserve something is to keep it safe.", "teach": "The Latin root <b>serv</b> means keep or save, like <b>reserve</b> and <b>preserve</b>.<span class='cn'>拉丁词根 <b>serv</b> 表示“保存”，比如 <b>reserve</b>（预留）和 <b>preserve</b>（保存）。</span>"}, {"q": "Which sentence is the most formal?", "choices": ["Malik was like, can I keep it?", "Malik asked whether he could extend the reservation.", "Malik goes, hey, keep it for me."], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "The first sentence uses polished words suitable for careful writing.", "teach": "Formal writing uses careful, complete wording, like <b>asked whether he could extend</b>, instead of slang.<span class='cn'>正式的写作使用谨慎、完整的措辞，比如 <b>asked whether he could extend</b>，而不是俚语。</span>"}, {"q": "‘The empty chairs were temporary, like a coat left on a hook.’ What does the comparison suggest?", "choices": ["Something left in place for a short time, to be picked up soon", "Something that was very expensive", "Something that was lost forever"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "A coat left on a hook is expected to be picked up soon, so the chairs were meant to be only a short stay.", "teach": "A <b>simile</b> can help you understand a feeling, like <b>a coat left on a hook</b> for something temporary.<span class='cn'><b>明喻</b>可以帮助你理解感受，比如用 <b>a coat left on a hook</b>（挂在钩子上的外套）形容暂时的东西。</span>"}], "vocabulary": [{"q": "‘Reservation’ means ___.", "choices": ["a type of robot", "an arrangement to keep something for someone", "a kind of lunch"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Pip announced that a reservation could be extended."}, {"q": "‘Guarantee’ means ___.", "choices": ["a long delay", "a surprise gift", "a promise that something will happen"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "It could not guarantee what would happen after he sat down."}, {"q": "‘Occupied’ means ___.", "choices": ["very empty", "being used or filled by someone", "freshly painted"], "answer": 1, "evidencePage": 7, "hint": "Look at the last page.", "explain": "Beside him was an occupied chair, and the possibility of a conversation he had not arranged in advance."}]};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(reservation|guarantee|occupied)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 6 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}

function saveProgress(){try{localStorage.setItem("les-the-robot-who-kept-my-seat-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-robot-who-kept-my-seat"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-robot-who-kept-my-seat",bookTitle:"The Robot Who Kept My Seat",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

<script>/*les-button-layout-js*/
