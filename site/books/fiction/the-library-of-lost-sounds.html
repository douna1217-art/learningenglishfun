 16px;display:flex;align-items:center;gap:14px;box-shadow:0 14px 38px rgba(111,74,182,.24);border:1px solid rgba(255,255,255,.32)}.evidence-banner strong{text-shadow:0 1px 6px rgba(60,35,110,.35)}.evidence-banner span{font-size:.84rem;color:#fff}.evidence-banner button{border:0;border-radius:10px;padding:9px 12px;background:rgba(255,255,255,.92);color:var(--purple);font-weight:950;cursor:pointer}.footer{text-align:center;color:var(--muted);font-size:.8rem;padding:13px}

<header class="topbar"><div class="brand"><div class="logo">R</div><div><h1>The Library of Lost Sounds</h1><p>learningenglishfun · Interactive Grade 4 Fiction</p></div></div><div class="stage-pill" id="stagePill">Reading Mode</div></header>
<section class="audio-bar"><div class="audio-copy"><strong>Listen, read, and record</strong><span>Narration highlights each word. Recordings stay only in this browser session.</span></div><div class="audio-actions"><button class="audio-btn primary" id="listenPageBtn">🔊 This Page</button><button class="audio-btn" id="listenStoryBtn">📖 Full Story</button><button class="audio-btn" id="pauseBtn" disabled>⏸ Pause</button><button class="audio-btn record" id="recordPageBtn">🎙 Record</button><button class="audio-btn" id="playRecordingBtn" disabled>▶ Play</button><button class="audio-btn" id="deleteRecordingBtn" disabled>🗑 Delete</button></div><div id="recStatus" class="rec-status" aria-live="polite"></div></section>

<script>

const pages=[{"type": "cover", "title": "The Library of Lost Sounds", "subtitle": "Some Memories Are Waiting to Be Heard Again.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-library-of-lost-sounds-assets/cover.jpg"}, {"text": "1. The Humming Shelf\nAmara stayed late at the library while her father repaired a loose window latch. In the quiet history room, one shelf hummed beneath her hand. She pressed a carved wooden button, and the bookcase swung open to reveal a staircase no map of the library showed.\nBelow, hundreds of glass jars glimmered on blue shelves. None held objects. One rumbled like distant thunder. Another released the quick tap of dancing shoes when Amara walked past. A small jar beside her ear gave only a faint breath. Its paper tag showed a drawing of the town clock tower.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-library-of-lost-sounds-assets/page1.jpg"}, {"text": "2. What the Town Forgot\nMr. Soto, the librarian, found Amara at the bottom step. He was surprised but not angry. The secret room, he explained, kept sounds that had vanished from the town: the old ferry bell, a bakery whistle, songs once called between fishing boats. Most jars still played clearly.\nThe clock-tower jar was different. Years ago, the great clock had marked noon with twelve deep notes. After it cracked in an earthquake, the bell was removed. Now even the recording was fading. “A sound lasts longer when people remember more than its noise,” Mr. Soto said. Amara decided to rebuild the memory before the jar became silent.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-library-of-lost-sounds-assets/page2.jpg"}, {"text": "3. Twelve Different Bells\nAmara interviewed neighbors. Mr. Lee remembered pigeons lifting from the square at the first note. Ms. Brooks remembered counting the chimes while kneading bread. A bus driver said the last note told him he was late for lunch. Everyone imitated the bell differently—low, bright, wobbly, or grand.\nAmara worried that their memories did not match. Then she noticed that each person described what happened around the sound. The bell had been more than twelve identical notes. It had mixed with wings, footsteps, voices, and the work of the town. She recorded those surrounding memories in her notebook.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-library-of-lost-sounds-assets/page3.jpg"}, {"text": "4. The Wrong Reconstruction\nUsing a small keyboard in the library's media room, Amara created twelve perfect low notes. Mr. Soto played them beside the jar. The glass brightened, then dimmed again. Her notes were smooth and accurate, but they sounded like a machine practicing alone.\nAmara had treated every difference as a mistake. She returned to her interviews and layered in the rustle of wings, a rolling cart, a bicycle bell, and a baker laughing between chimes. The result was less tidy. It also sounded like a place where people actually lived.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-library-of-lost-sounds-assets/page4.jpg"}, {"text": "5. A Memory Made Together\nOn Saturday, neighbors gathered in the square. At noon, they listened to Amara's layered recording. People added details she had missed: a dog's bark, a stroller wheel, a whispered count. Mr. Soto recorded the gathering itself, with permission from everyone taking part.\nWhen he poured the new recording into the jar, golden ripples swirled through the glass. The old bell's notes returned—not as one exact copy, but as many memories held together. Amara understood why the jar had faded. No single person had carried the whole sound.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-library-of-lost-sounds-assets/page5.jpg"}, {"text": "6. The Listening Room\nMr. Soto opened the hidden room for one afternoon each month. Visitors could listen, share a memory, or record a disappearing sound from their own neighborhood. Amara created a guide that asked where the sound happened, who heard it, and what changed when it stopped.\nA child brought the squeak of a playground spinner scheduled for replacement. A gardener recorded rain dripping through an old metal barrel. The jars no longer seemed like a museum of endings. They were beginnings for conversations about how a town changed.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-library-of-lost-sounds-assets/page6.jpg"}, {"text": "7. The Sound Beside Silence\nBefore closing, Amara placed the clock-tower jar back on its shelf. It rang twelve uneven, beautiful notes. Between them came wings, wheels, bread trays, and voices counting. The silences mattered too; they gave each memory room to arrive.\nUpstairs, her father tested the repaired window. The latch clicked firmly into place. Amara paused. It was an ordinary sound, easy to ignore, and someday the library might be different. She wrote it down anyway: one small click at sunset, with Dad smiling beside the window.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-library-of-lost-sounds-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did Amara find when she pressed the carved wooden button?", "choices": ["A hidden staircase with glass jars of sound", "A new library book", "A locked door"], "answer": 0, "evidencePage": 1, "hint": "Look at chapter 1.", "explain": "The bookcase swung open to reveal a staircase, below which glimmered hundreds of glass jars."}, {"q": "According to Mr. Soto, what did the jars hold?", "choices": ["Maps of the library", "Sounds that had vanished from the town", "Photographs of the town"], "answer": 1, "evidencePage": 2, "hint": "Look at chapter 2.", "explain": "The secret room kept sounds that had vanished from the town."}, {"q": "What happened when Amara played twelve perfect notes on the keyboard?", "choices": ["The town cheered", "The jar shattered", "They sounded like a machine practicing alone"], "answer": 2, "evidencePage": 4, "hint": "Look at chapter 4.", "explain": "Her notes were smooth and accurate, but they sounded like a machine practicing alone."}, {"q": "What did neighbors do at the gathering in the square?", "choices": ["Added details Amara had missed to the recording", "Left before it started", "Argued about the bell's sound"], "answer": 0, "evidencePage": 5, "hint": "Look at chapter 5.", "explain": "People added details she had missed: a dog's bark, a stroller wheel, a whispered count."}, {"q": "What is the big idea of this story?", "choices": ["A machine can recreate any memory perfectly alone", "Some memories are waiting to be heard again, made whole by many people together", "Old sounds should be forgotten and replaced"], "answer": 1, "evidencePage": 7, "hint": "Look at the last chapter.", "explain": "The bell's notes returned not as one exact copy, but as many memories held together."}], "grammar": [{"q": "“A sound lasts longer ___ people remember more than its noise,” Mr. Soto said. Which word shows the condition?", "choices": ["when", "so", "but"], "answer": 0, "evidencePage": 2, "hint": "This word shows under what condition a sound lasts longer.", "explain": "“When” shows the condition under which a sound lasts longer.", "teach": "<b>When X, Y</b> shows Y depends on the <b>condition</b> X.<span class='cn'><b>when</b>(当……时)表示Y取决于<b>条件</b>X。</span>"}, {"q": "“Her notes were smooth and accurate, ___ they sounded like a machine practicing alone.” Which word shows contrast?", "choices": ["so", "but", "when"], "answer": 1, "evidencePage": 4, "hint": "This word contrasts being accurate with sounding like a machine.", "explain": "“But” contrasts the accurate notes with how mechanical they sounded.", "teach": "<b>But</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>but</b>(但是)表示两个事实之间的<b>对比</b>。</span>"}, {"q": "“A child brought the squeak of a playground spinner scheduled for replacement, ___ a gardener recorded rain dripping through an old metal barrel.” Which word joins these two examples?", "choices": ["when", "but", "and"], "answer": 2, "evidencePage": 6, "hint": "This word joins two separate examples of recorded sounds.", "explain": "“And” joins the child's example with the gardener's example.", "teach": "<b>And</b> joins <b>two separate examples</b>.<span class='cn'><b>and</b>(和)连接<b>两个独立的例子</b>。</span>"}], "vocabulary": [{"q": "‘Vanished’ means ___.", "choices": ["disappeared completely", "grew louder", "became repaired"], "answer": 0, "evidencePage": 2, "hint": "Look at chapter 2.", "explain": "The jars kept sounds that had vanished from the town."}, {"q": "‘Layered’ means ___.", "choices": ["removed completely", "added on top of each other in different levels", "played only once"], "answer": 1, "evidencePage": 4, "hint": "Look at chapter 4.", "explain": "She layered in the rustle of wings, a rolling cart, a bicycle bell, and a baker laughing."}, {"q": "‘Reconstruction’ means ___.", "choices": ["the act of destroying something", "a type of jar", "the act of building or putting something back together again"], "answer": 2, "evidencePage": 4, "hint": "Look at chapter 4's title.", "explain": "Amara's first attempt was 'The Wrong Reconstruction'—rebuilding the bell's sound."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(vanished|layered|reconstruction)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 4 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function saveProgress(){try{localStorage.setItem("les-the-library-of-lost-sounds-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-library-of-lost-sounds"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-library-of-lost-sounds",bookTitle:"The Library of Lost Sounds",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.
