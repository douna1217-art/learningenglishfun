<script>/*les-speech-shim*/
(function(){var w=window,ok=false,errs=[];
/* Some Android in-app browsers (UC/Quark and other vendor kernels, older WebViews) have no
   speechSynthesis at all. The page script calls it while loading, so it stopped there and the
   story was never drawn (the quiz still worked because its handlers were bound earlier).
   Give such browsers a silent stand-in so the rest of the page runs normally. */
try{ok=typeof w.speechSynthesis==="object"&&w.speechSynthesis!==null}catch(e){}
if(typeof w.SpeechSynthesisUtterance!=="function"&&typeof w.SpeechSynthesisUtterance!=="object"){
w.SpeechSynthesisUtterance=function(t){this.text=t==null?"":String(t);this.lang="";this.rate=1;this.pitch=1;this.volume=1;this.voice=null}}
if(!ok){var gen=0,told=false;
w.speechSynthesis={speaking:false,paused:false,pending:false,
getVoices:function(){return[]},cancel:function(){gen++},pause:function(){},resume:function(){},
addEventListener:function(){},removeEventListener:function(){},
speak:function(u){var g=gen;
if(!told&&typeof w.setStatus==="function"){told=true;try{w.setStatus("This browser can't read aloud, but you can still read and practice. 当前浏览器不支持朗读，仍可阅读和做题。",false)}catch(e){}}
setTimeout(function(){if(g===gen&&u&&u.onstart){try{u.onstart({})}catch(e){}}},0);
setTimeout(function(){if(g===gen&&u&&u.onend){try{u.onend({})}catch(e){}}},Math.max(600,String(u&&u.text||"").length*60))}}}
/* If the story still is not drawn after loading, say why on the page itself, so a screenshot
   from a phone we cannot test on shows the cause. */
w.addEventListener("error",function(e){try{if(errs.length<3)errs.push(String(e&&e.message||e))}catch(x){}});

if(v&&!v.firstChild&&errs.length){var d=document.createElement("div"),s=document.createElement("small");

})();

<script>

const pages=[{"type": "cover", "title": "The Last Point Before Supper", "subtitle": "A Good Game Can Wait Until Morning", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-last-point-before-supper-assets/cover.jpg"}, {"text": "1. The Game I Expected to Win\nAt Grandpa's house, Rae used to watch while I played table tennis with Dad. She fetched the balls that rolled behind the boxes. This visit, the boxes were gone, and Rae picked up a paddle before I did. I asked whether she remembered how to play.\nShe said she thought she could manage. We agreed on a short house game, first to ten points. Supper would be ready soon. I chose my usual end of the table and gave the ball a confident bounce. Rae won the first point. Then she won three more. I looked toward the doorway, but Dad had already gone inside to help set the table.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-last-point-before-supper-assets/page1.jpg"}, {"text": "2. The Corner She Kept Finding\nI hit harder. The ball flew past Rae and struck the wall. She picked it up and returned it gently. When I tried a slower shot, she sent the next one toward the far corner. By the time I reached it, the ball had bounced away.\n“Lucky,” I said. Rae tilted her head. She did not argue. She simply did it again. I had expected the cousin who fetched balls. The girl across the net was watching where I stood, and I kept standing in the same place. At six points to four, with Rae ahead, I decided I had been warming up. Now the real game could begin.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-last-point-before-supper-assets/page2.jpg"}, {"text": "3. One More Game after This\nAt nine to seven, I announced that we should play another game afterward. Rae said we should finish this one first. I told her the light at my end was different. She offered to swap ends. That was annoying, because I had not actually wanted to swap.\nFrom the kitchen, Dad called that supper would be ready in three minutes. Rae glanced toward the door. I bounced the ball again. I wanted one clean shot that would remind her how things usually went at Grandpa's house. Instead, I fumbled the ball before serving and had to fetch it from under the table. Rae waited without saying anything. Somehow that was worse.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-last-point-before-supper-assets/page3.jpg"}, {"text": "4. The Space behind the Ball\nFor the next point, I watched Rae's paddle instead of imagining what everyone would say if I lost. Her return went toward the same corner. This time I moved early. The ball came back over the net, and Rae missed it. Nine to eight. I let out a breath I had been holding for far too long.\nThe following rally lasted long enough for me to hear our shoes squeak on the clean floor. I stopped trying to finish every shot. Rae reached wide, and her return went beyond the table. Nine all. I grinned. She grinned back. For a moment, neither of us seemed eager to explain why the other had lost a point.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-last-point-before-supper-assets/page4.jpg"}, {"text": "5. A Point That Had to Wait\nDad appeared in the doorway. Supper was ready. I said we needed one more point. Rae set her paddle on the table. “Then it will still be there tomorrow,” she said. I looked at the white ball in my hand. It seemed ridiculous that something so small could be left unfinished overnight.\nDad waited. He did not ask who was winning. I wanted him to ask so I could explain how I had caught up. Instead, I put the ball beside the net. Rae held the door while I went inside. Behind us, the table stood exactly as we had left it. Nine all, with nobody there to make the score change.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-last-point-before-supper-assets/page5.jpg"}, {"text": "6. What Happened on Tuesdays\nAt supper, Grandpa asked whether we had enjoyed the game. I said it was not finished. Rae said the long rally had been good. She showed him the little movement she used for a backhand, without picking anything up. I asked where she had learned it.\n“At the recreation center,” she said. “I go on Tuesdays.” She had been practicing for months while I was remembering how she played last year. I asked about the corner shot. Rae explained where she had seen the empty space. Dad passed the bread. I listened, then described the point when I had finally moved early. We were still talking about the game when Grandpa brought out the fruit.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-last-point-before-supper-assets/page6.jpg"}, {"text": "7. Ten to Nine\nIn the morning, Rae found me beside the table. I remembered the score. She remembered whose turn it was to serve. The last point began quietly. She sent the ball over, I returned it, and we kept it moving until I reached a little too far. The ball dropped beyond my paddle.\n“Ten to nine,” Rae said. I picked it up. There was no bad light to mention and no warm-up left to claim. She had won our short game. I rolled the ball in my palm, then asked whether she wanted another one. Rae lifted her paddle. This time, when she said she thought she could manage, I knew she was making a joke.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-last-point-before-supper-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What kind of game did Nico and Rae agree to play?", "choices": ["A long match with three rounds", "A short game of table tennis, first to ten points", "A game of catch with Dad"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "They agreed on a short house game, first to ten points."}, {"q": "Why did Nico keep losing points at the start?", "choices": ["The ball was too light", "Rae sent the ball to the corner where he was not standing", "He had never held a paddle before"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Rae watched where he stood, and he kept standing in the same place."}, {"q": "What happened when Nico watched Rae’s paddle?", "choices": ["He moved early, won a point, and the score became nine all", "Dad stopped the game", "He lost the game at once"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "He moved early, Rae missed, and the score reached nine all."}, {"q": "Where had Rae learned her backhand?", "choices": ["From watching Dad play", "At the recreation center on Tuesdays", "From Grandpa"], "answer": 1, "evidencePage": 6, "hint": "Look at page 6.", "explain": "Rae said she goes to the recreation center on Tuesdays."}, {"q": "Who won the game in the end?", "choices": ["Nico, by ten points to nine", "Nobody, because supper was ready", "Rae, by ten points to nine"], "answer": 2, "evidencePage": 7, "hint": "Look at the last page.", "explain": "Rae said, “Ten to nine,” and Nico agreed that she had won."}], "grammar": [{"q": "‘She had been practicing for months while I ___ how she played last year.’ Which choice completes the sentence?", "choices": ["was remembering", "will remember", "remember"], "answer": 0, "evidencePage": 6, "hint": "Look at page 6.", "explain": "The action was going on in the past, so the sentence needs “was remembering”.", "teach": "A <b>progressive tense</b> shows an action that was in progress, like <b>was remembering</b> or <b>were playing</b>.<span class='cn'><b>进行时</b>表示某个动作正在进行，比如 <b>was remembering</b>（那时一直在回想）或 <b>were playing</b>（那时在玩）。</span>"}, {"q": "‘Rae set her paddle on the table.’ Which words are the prepositional phrase?", "choices": ["on the table", "her paddle", "Rae set"], "answer": 0, "evidencePage": 5, "hint": "Look at page 5.", "explain": "“On the table” starts with the preposition “on” and tells where the paddle went.", "teach": "A <b>prepositional phrase</b> starts with a word like on, in, or under, and it tells where or when, like <b>under the net</b>.<span class='cn'><b>介词短语</b>以 on、in、under 这类词开头，说明地点或时间，比如 <b>under the net</b>（在球网下面）。</span>"}, {"q": "Which sentence is punctuated correctly?", "choices": ["“Ten to nine.” Rae said.", "“Ten to nine” Rae said.", "“Ten to nine,” Rae said."], "answer": 2, "evidencePage": 7, "hint": "Look at the last page.", "explain": "A comma goes inside the closing quotation mark before words like “Rae said”.", "teach": "When a speaker tag follows a quotation, put a comma inside the quotation marks, like <b>“Come here,” she said.</b><span class='cn'>说话人标记跟在引语后面时，要把逗号放在引号里面，比如 <b>“Come here,” she said.</b></span>"}], "vocabulary": [{"q": "‘Confident’ means ___.", "choices": ["sure that you can do something well", "tired and ready to rest", "afraid of making mistakes"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "I chose my usual end of the table and gave the ball a confident bounce."}, {"q": "‘Fumbled’ means ___.", "choices": ["caught with one hand", "hit as hard as possible", "handled clumsily and dropped"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "I fumbled the ball before serving and had to fetch it from under the table."}, {"q": "‘Ridiculous’ means ___.", "choices": ["very quiet and calm", "so silly that it is hard to take seriously", "extremely hot or cold"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "It seemed ridiculous that something so small could be left unfinished overnight."}]};

.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
