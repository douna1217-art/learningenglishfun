<script>

const pages=[{"type": "cover", "title": "The Griffin Who Arrived Too Late", "subtitle": "A Griffin Delivers a Letter Seventy Years Late to a Girl Who Has Become a Grandmother", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-griffin-who-arrived-too-late-assets/cover.jpg"}, {"text": "1. Directions to a Castle\nThe griffin landed outside the bakery just as Tamsin carried out the bread trays. He folded his wings, shook a little pale dust from his feathers, and asked which road led to the castle. Tamsin set the trays on the bench. There had not been a castle above the village for twenty years. The last tower had burned, and the ground was now an orchard.\nThe griffin said this was inconvenient. He had a letter for a girl in the castle kitchen, and she had been expecting it yesterday. His name was Pell. He gave it as though Tamsin ought to know it. She offered to ask her grandmother, who remembered the castle. Pell checked the sun. He had already stopped once, he explained, to shelter from a mountain storm. He could not afford another delay. Tamsin thought this an odd concern for someone using directions twenty years out of date.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-griffin-who-arrived-too-late-assets/page1.jpg"}, {"text": "2. A Girl Who Loved Pears\nPell asked whether the orchard had been planted around the castle. Tamsin told him it grew where the courtyard used to be. He stared uphill. The castle kitchen had stood beside a narrow staircase, he said. The girl who worked there would bring him pear peelings and complain that he left feathers in the soup. Her name was Asha. She had a small scar above her left eyebrow.\nTamsin forgot about the bread. Her grandmother was called Asha. She had the same scar, which she blamed on a broken pitcher. But Grandmother was eighty-three. Pell's Asha was thirteen. They stood in the street doing the subtraction in different ways. Finally, Pell asked what year it was. After Tamsin answered, he lowered himself onto his haunches. The little pouch tapped against his chest. He did not ask for directions again.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-griffin-who-arrived-too-late-assets/page2.jpg"}, {"text": "3. One Night in the Mountain\nHis shelter had been a cave behind white hanging flowers. Inside, the rain sounded far away. He had slept, woken to clear skies, and flown down to the village. Tamsin knew a story about those flowers. Travelers who slept behind them could wake after one night and find whole seasons gone. She had thought it was a story meant to keep children out of caves.\nPell asked whether seventy years could count as whole seasons. Tamsin said she supposed they could. She wanted to say something useful about having arrived safely, but he was looking at the pouch again. With his permission, she unfastened it and took out an envelope. The red seal was unbroken. The paper had stayed dry. Someone had folded it carefully before putting an entire lifetime between the letter and its reader.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-griffin-who-arrived-too-late-assets/page3.jpg"}, {"text": "4. The Person Who Was Waiting\nGrandmother was in the backyard, tying up the beans. She came around the house when Tamsin called. For a moment, she looked only at the white head above the garden wall. Then she said Pell's name. He bent his head so low that his beak almost touched the path. Tamsin held the envelope, suddenly uncertain whether she should have brought it at all.\nGrandmother asked where he had been. Pell told her about the cave. He said he had meant to deliver the letter before supper, that he remembered the red seal, that he had not forgotten her. His explanations came faster as she listened. At last, she put one hand against the feathers at his neck. “We thought you'd fallen in the storm,” she said. Pell went quiet. He had been preparing to apologize for a late letter. She had been looking at someone she thought was lost.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-griffin-who-arrived-too-late-assets/page4.jpg"}, {"text": "5. Before the First Snow\nThey sat in the courtyard, with Grandmother in her wicker chair and Pell on the stones beside her. She broke the seal. Tamsin watched her eyes move across the paper, then return to the beginning. The letter was from Asha's father. He had found work in a town beyond the mountains. He wrote that he would come home before the first snow and bring the blue scarf she had asked for.\nPell asked whether the snow had come first. Grandmother smiled without looking up. Her father had arrived in an early snowfall, carrying the scarf under his coat to keep it dry. He had expected Pell to be there already. When the griffin never came, he had searched the mountain roads. “He got home?” Pell asked. Grandmother nodded. She read the last line aloud. It was a joke about the castle cook, who had once mistaken salt for sugar.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-griffin-who-arrived-too-late-assets/page5.jpg"}, {"text": "6. What the Letter Could Still Do\nTamsin had thought the letter would explain something nobody knew. Perhaps it would reveal a missing treasure or change the ending of an old story. Instead, it told Grandmother something she had learned seventy years ago. Yet she kept reading it. She laughed at the cook's mistake, then wiped her eyes with the edge of her shawl. Tamsin stopped trying to decide whether the letter was useful.\nPell said he should have kept flying through the storm. Grandmother folded the paper. She had no answer that would give those years back. She said she was glad he had found shelter, and sorry that it had kept him so long. Then she went inside and returned with a faded blue scarf. Her father had died many years later, she told Pell. He had lived to see her children. She spread the scarf across her knees while they talked about him.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-griffin-who-arrived-too-late-assets/page6.jpg"}, {"text": "7. A Place Beside the Chair\nBy evening, Pell could have flown back to the mountains. He stood, stretched one wing, and looked at the darkening ridge. Grandmother asked whether he liked pear peelings as much as he used to. He said that depended on whether they still came with complaints about feathers. Tamsin went into the kitchen and found a bowl. When she returned, he had settled beside the wicker chair again.\nThe letter stayed on the little table, weighted with a smooth stone. Tamsin would help Grandmother put it away tomorrow. For now, there were stories to trade. Pell described the village before the orchard. Grandmother described its first harvest. Neither could tell the other everything in one evening. Tamsin carried out a second lamp. Beyond its light, the mountain waited, but Pell asked another question about the trees. This time, he did not check the sun.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-griffin-who-arrived-too-late-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did Pell ask Tamsin when he landed?", "choices": ["How to find the mountain", "Where he could buy bread", "Which road led to the castle, which had burned down twenty years ago"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Pell asked the way to the castle, but there had been no castle above the village for twenty years."}, {"q": "Who was Asha?", "choices": ["A baker in the village", "Pell’s sister", "The girl from the castle kitchen, who was now Tamsin’s grandmother"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Tamsin’s grandmother was called Asha and had the same scar as the girl Pell remembered."}, {"q": "What had happened to Pell in the mountain?", "choices": ["He slept one night in a cave behind white hanging flowers, and about seventy years passed", "He was lost for a day", "He fell and hurt his wing"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Travelers who slept behind those flowers could wake after one night and find whole seasons gone."}, {"q": "How did Grandmother react to seeing Pell?", "choices": ["She said his name, and told him they had thought he had fallen in the storm", "She did not recognize him", "She was angry about the delay"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "She said they thought he had fallen in the storm."}, {"q": "What did the letter say?", "choices": ["The castle was going to be rebuilt", "Asha’s father had found work beyond the mountains and would come home before the first snow with a blue scarf", "Pell must come home at once"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "The letter was from Asha’s father, who promised to bring the blue scarf she had asked for."}], "grammar": [{"q": "‘Pell had ___ down to the village.’ Which word belongs in the blank?", "choices": ["flew", "flown", "flied"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Had is followed by the past participle flown.", "teach": "<b>Had</b> goes with the past participle, like <b>had flown</b>, not <b>flew</b>.<span class='cn'><b>had</b> 后面要接过去分词，比如 <b>had flown</b>，不是 <b>flew</b>。</span>"}, {"q": "The prefix ‘in-’ can mean ‘not’. What does ‘inconvenient’ most likely mean?", "choices": ["Very convenient", "Easy to carry", "Not convenient, or causing trouble"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Inconvenient means not convenient.", "teach": "The prefix <b>in</b> can mean not, so <b>inconvenient</b> means not convenient.<span class='cn'>前缀 <b>in</b> 可以表示“不”，所以 <b>inconvenient</b> 就是不方便的。</span>"}, {"q": "‘Someone had folded it carefully before putting an entire lifetime between the letter and its reader.’ What does this mean?", "choices": ["The reader lived far away", "A very long time had passed before the letter was read", "The letter was very heavy"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "A lifetime between the letter and its reader means seventy years had passed.", "teach": "A <b>figure of speech</b> can describe time as something you put between two things, like <b>a lifetime between the letter and its reader</b>.<span class='cn'><b>修辞</b>可以把时间说成放在两个东西之间的东西，比如 <b>a lifetime between the letter and its reader</b>（信和读信人之间隔着一生）。</span>"}], "vocabulary": [{"q": "‘Inconvenient’ means ___.", "choices": ["easy to carry", "causing trouble or difficulty", "very pleasant"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "The griffin said this was inconvenient."}, {"q": "‘Apologize’ means ___.", "choices": ["to say you are sorry", "to ask a question", "to fly away"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "He had been preparing to apologize for a late letter."}, {"q": "‘Reveal’ means ___.", "choices": ["to show something that was hidden", "to lose something", "to close something tightly"], "answer": 0, "evidencePage": 6, "hint": "Look at page 6.", "explain": "Perhaps it would reveal a missing treasure."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(inconvenient|apologize|reveal)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 6 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}var TEACH_ICONS='<svg class="ic i-spk" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.5v5h3.6l4.9 4.5V5L7.6 9.5H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.6 9.2a4 4 0 010 5.6M18.2 6.6a7.6 7.6 0 010 10.8"/></svg><svg class="ic i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></svg><svg class="ic i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 5.3v13.4c0 .8.9 1.3 1.6.8l9.6-6.7c.6-.4.6-1.2 0-1.6L9.8 4.5c-.7-.5-1.6 0-1.6.8z"/></svg>';var _tp=null;function _tpSet(b,st){if(!b)return;b.classList.toggle('is-playing',st==='playing');b.classList.toggle('is-paused',st==='paused');b.setAttribute('aria-pressed',st==='playing'?'true':'false');var z=b.dataset.part==='cn',L=st==='playing'?(z?'\u6682\u505C':'Pause'):st==='paused'?(z?'\u7EE7\u7EED\u64AD\u653E':'Resume'):b.dataset.label;b.setAttribute('aria-label',L);b.title=L;}function stopTeachAudio(){var c=_tp;if(!c)return;_tp=null;try{if(c.audio){c.audio.onended=c.audio.onerror=c.audio.ontimeupdate=null;c.audio.pause();}}catch(e){}if(c.mode==='tts'){try{speechSynthesis.cancel();}catch(e){}}_tpSet(c.btn,'idle');}function _tpFallback(btn){try{var u=new SpeechSynthesisUtterance(btn.dataset.text||'');u.lang=btn.dataset.lang||'en-US';var cur={btn:btn,mode:'tts'};_tp=cur;u.onend=u.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');}};_tpSet(btn,'playing');speechSynthesis.speak(u);}catch(e){}}function playTeachAudio(btn){if(_tp&&_tp.btn===btn){if(_tp.mode==='audio'){var a0=_tp.audio;if(a0.paused){var p0=a0.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}

function saveProgress(){try{localStorage.setItem("les-the-griffin-who-arrived-too-late-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-griffin-who-arrived-too-late"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-griffin-who-arrived-too-late",bookTitle:"The Griffin Who Arrived Too Late",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

let preferredVoice=null;
