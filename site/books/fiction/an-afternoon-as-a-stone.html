<script>/*les-speech-shim*/
(function(){var w=window,ok=false,errs=[];
/* Some Android in-app browsers (UC/Quark and other vendor kernels, older WebViews) have no
   speechSynthesis at all. The page script calls it while loading, so it stopped there and the
   story was never drawn (the quiz still worked because its handlers were bound earlier).
   Give such browsers a silent stand-in so the rest of the page runs normally. */
try{ok=typeof w.speechSynthesis==="object"&&w.speechSynthesis!==null}catch(e){}
if(typeof w.SpeechSynthesisUtterance!=="function"&&typeof w.SpeechSynthesisUtterance!=="object"){
w.SpeechSynthesisUtterance=function(t){this.text=t==null?"":String(t);this.lang="";this.rate=1;this.pitch=1;this.volume=1;this.voice=null}}
if(!ok){var gen=0,told=false;
w.speechSynthesis={speaking:false,paused:false,pending:false,
getVoices:function(){return[]},cancel:function(){gen++},pause:function(){},resume:function(){},
addEventListener:function(){},removeEventListener:function(){},
speak:function(u){var g=gen;
if(!told&&typeof w.setStatus==="function"){told=true;try{w.setStatus("This browser can't read aloud, but you can still read and practice. 当前浏览器不支持朗读，仍可阅读和做题。",false)}catch(e){}}
setTimeout(function(){if(g===gen&&u&&u.onstart){try{u.onstart({})}catch(e){}}},0);
setTimeout(function(){if(g===gen&&u&&u.onend){try{u.onend({})}catch(e){}}},Math.max(600,String(u&&u.text||"").length*60))}}}
/* If the story still is not drawn after loading, say why on the page itself, so a screenshot
   from a phone we cannot test on shows the cause. */
w.addEventListener("error",function(e){try{if(errs.length<3)errs.push(String(e&&e.message||e))}catch(x){}});
w.addEventListener("load",function(){try{var v=document.getElementById("pageView");
if(v&&!v.firstChild&&errs.length){var d=document.createElement("div"),s=document.createElement("small");
d.style.cssText="padding:24px;color:#b91c1c;font:15px/1.6 sans-serif";
d.appendChild(document.createTextNode("The story could not be shown in this browser. 此浏览器暂时无法显示故事。"));
d.appendChild(document.createElement("br"));s.textContent=errs.join(" | ");d.appendChild(s);v.appendChild(d)}}catch(x){}});
})();

<script>

const pages=[{"type": "cover", "title": "An Afternoon as a Stone", "subtitle": "A Girl Tired of Being Sensible Spends an Afternoon as a Stone and Hears What She Usually Misses When She Is Busy Helping", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/an-afternoon-as-a-stone-assets/cover.jpg"}, {"text": "1. The Last Question Before Lunch\nBy noon, Willow had been asked to untie a knot, settle an argument about a game, and explain why a cake had sunk. She was twelve, not a professional answerer of questions. Still, people often said she was sensible, and she liked the word until it began arriving just before a request. When Mistress Fern asked how she wanted to spend the afternoon, Willow said she wanted to be a stone.\nThe old magician did not laugh. She showed Willow a smooth violet pebble on her desk and explained the temporary spell. Willow would keep her thoughts and hear nearby voices. She would feel warmth and coolness, but she would have no eyes, no hands, and no way to speak. At four, she would be herself again. Fern would remain in the garden throughout. Willow considered the rules. Having no way to answer sounded, at that moment, like the most attractive part.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/an-afternoon-as-a-stone-assets/page1.jpg"}, {"text": "2. A Very Quiet Shape\nFern placed a cushion on the garden wall and asked Willow to sit. The spell felt like the briefest pause between two breaths. Then Willow could no longer see the marigolds or the shade beneath the oak. She was a small stone resting in a shallow hollow of the wall. Fern described where she had put her, away from the edge. Willow was glad of that detail.\nFor several minutes, being a stone was excellent. Nothing needed arranging. No sleeve had slipped down her wrist. No one was waiting for her to choose the right word. Fern swept the garden path, and each scrape of the broom sounded distinct. A bee passed close enough for its hum to seem enormous. Willow tried to tell Fern about it, then remembered. She found the silence agreeable again, although this time she had to make a small effort to like it.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/an-afternoon-as-a-stone-assets/page2.jpg"}, {"text": "3. Someone Who Did Not Need Rescuing\nA neighbor came to borrow string. Willow recognized his voice and immediately remembered which drawer contained it. She heard Fern say, “This short spool should do.” Willow knew a longer one was available and prepared an explanation before remembering that explanations were no longer among her available activities. The neighbor said he needed only a small piece. Willow had assumed a problem neither of them had.\nLater, Fern exclaimed that she had dropped her dusting cloth into the flowerbed. Willow wanted to warn her about the soil. Before she could finish thinking it, Fern said she had shaken the cloth clean, and the broom began scraping again. The garden continued without assistance. Willow had expected that to feel peaceful. Sometimes it did. Sometimes it felt as if the world had stopped noticing a useful part of her. She had wanted a rest from being needed, but she hadn't thought about how much she liked being the person who knew which drawer to open.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/an-afternoon-as-a-stone-assets/page3.jpg"}, {"text": "4. A Visitor with a Bent Wing\nRue arrived carrying a wind-up bird. One tin wing had bent, and its feet moved in circles instead of making it hop. Willow knew the toy well. She had straightened the wing twice, usually while explaining what Rue ought to avoid next time. Fern told Rue that Willow was spending the afternoon as the violet stone. Rue sat in the grass beside the wall.\n“I was going to ask you to look at this,” she told the stone. “Then I was going to pretend I hadn't tried to fix it myself.” Willow wanted to say that Rue should have brought it before bending it further. She couldn't. Rue turned the key. The bird clicked against her palm. She said she had almost got it working once. Her voice sounded pleased about that almost. Willow had usually been too busy supplying the next step to hear how much Rue liked discovering one herself.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/an-afternoon-as-a-stone-assets/page4.jpg"}, {"text": "5. The Part She Usually Missed\nRue stayed. She described the first repair she had tried, then the second. Some of her ideas would not have worked. Willow noticed each one. She also noticed how carefully Rue described the moment the feet had begun moving. It had happened just before the wing caught again. Rue laughed while telling it, and Willow wished she could laugh too.\nAfter a while, Rue said she missed doing things with Willow before every activity became something Willow could improve. The stone felt warm beneath the sun. Willow had no face with which to look hurt, no quick reply to make Rue take the sentence back. Rue added that she liked Willow's ideas. She simply wanted a little room for her own. Then she put the bird down in the grass and lay back. The silence beside them did not feel empty. For once, Willow had heard what came after the part she wanted to interrupt.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/an-afternoon-as-a-stone-assets/page5.jpg"}, {"text": "6. The First Words Back\nAt four, Fern lifted the stone from its hollow and placed it on the cushion. The returning spell felt like a sneeze that changed its mind. Willow found herself sitting on the wall, with both boots dangling above the grass. Rue sat up. Willow had prepared several excellent sentences while waiting. She used none of them.\nShe asked whether Rue wanted help with the bird or company while she tried. Rue thought about it. Company first, she said. Willow climbed down and sat beside her. She apologized for taking over the last repair. Rue passed her the bird to hold, then asked her not to turn the key yet. Willow held it still. It was such a small request that she might once have mistaken it for being given nothing important to do. Now she could feel Rue examining the wing without having to hurry past somebody else's suggestion.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/an-afternoon-as-a-stone-assets/page6.jpg"}, {"text": "7. Before She Answered\nThe bird did not work properly that afternoon. Its feet turned, the wing caught, and Rue decided to try again tomorrow. Willow knew where Fern kept some useful tools. She waited until Rue asked whether they could borrow them. Fern said yes, provided they worked at the table and brought the bird back before using anything sharp. They left it safely on the workshop shelf for the night.\nOn the way home, Rue asked if Willow had enjoyed being a stone. Willow said the first part had been restful. The middle had been irritating. She was still deciding about the rest. Rue laughed and said that sounded like an honest recommendation. At the lane, a younger child called out a question. Willow stopped. She was glad to have a voice again. Before using it, she let the child finish explaining what she had already tried.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/an-afternoon-as-a-stone-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "Why did Willow ask to be a stone for an afternoon?", "choices": ["She wanted to hide from a storm", "She was tired of being the sensible one who answered everyone’s questions", "She was learning magic"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "She had been asked to fix many things by noon, and having no way to answer sounded like the most attractive part."}, {"q": "What did Willow enjoy about being a stone at first?", "choices": ["Nothing needed arranging and no one was waiting for her to find the right word", "She could talk to the bee", "She could see the whole garden"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "For several minutes nothing needed arranging, and no one was waiting for her to choose the right word."}, {"q": "What did Willow realize when the garden went on without her help?", "choices": ["She wanted to stay a stone forever", "She liked being the person who knew which drawer to open", "She was angry at Fern"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "She had wanted a rest from being needed, but she hadn’t thought about how much she liked being the person who knew which drawer to open."}, {"q": "What did Rue tell the stone?", "choices": ["She wanted Willow to stop visiting", "She liked Willow’s ideas but wanted a little room for her own", "She did not want to fix the bird"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Rue said she missed doing things with Willow before every activity became something Willow could improve."}, {"q": "What did Willow do when a younger child called out a question?", "choices": ["She answered at once", "She walked away", "She let the child finish explaining what she had already tried"], "answer": 2, "evidencePage": 7, "hint": "Look at the last page.", "explain": "Before using her voice, she let the child finish explaining what she had already tried."}], "grammar": [{"q": "The Latin root ‘tract’ means ‘pull’. Which word has the same root?", "choices": ["tractor", "trail", "trace"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "A tractor is a machine that pulls things.", "teach": "The Latin root <b>tract</b> means pull, like <b>tractor</b> and <b>attract</b>.<span class='cn'>拉丁词根 <b>tract</b> 表示“拉”，比如 <b>tractor</b>（拖拉机）和 <b>attract</b>（吸引）。</span>"}, {"q": "Which sentence places the opening phrase correctly?", "choices": ["Sitting on the wall, the broom scraped for Willow.", "Sitting on the wall, a bee and the broom.", "Sitting on the wall, Willow heard the broom scrape."], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "The opening phrase must describe the person who is doing the action, which is Willow.", "teach": "An opening phrase like <b>Sitting on the wall</b> must be followed by the person or thing it describes, like <b>Willow</b>.<span class='cn'><b>Sitting on the wall</b> 这样的开头短语，后面必须紧跟它所描述的人或物，比如 <b>Willow</b>。</span>"}, {"q": "‘She explained the temporary spell. At four, she would be herself again.’ What does ‘temporary’ mean?", "choices": ["very powerful", "hard to understand", "lasting only a short time"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "The next sentence says she will be herself again at four, so temporary means lasting a short time.", "teach": "You can find a word’s meaning from nearby sentences, like <b>she would be herself again at four</b> for <b>temporary</b>.<span class='cn'>可以从附近的句子推断词义，比如 <b>she would be herself again at four</b>（四点就会恢复原样）说明 <b>temporary</b> 是“短暂的”。</span>"}], "vocabulary": [{"q": "‘Sensible’ means ___.", "choices": ["showing good judgment", "very silly", "easily frightened"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "People often said she was sensible, and she liked the word until it began arriving just before a request."}, {"q": "‘Distinct’ means ___.", "choices": ["hard to hear", "clearly separate and easy to notice", "very loud"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Each scrape of the broom sounded distinct."}, {"q": "‘Agreeable’ means ___.", "choices": ["pleasant and easy to like", "loud and rude", "difficult and tiring"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "She found the silence agreeable again."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(sensible|distinct|agreeable)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 6 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}var TEACH_ICONS='<svg class="ic i-spk" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.5v5h3.6l4.9 4.5V5L7.6 9.5H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.6 9.2a4 4 0 010 5.6M18.2 6.6a7.6 7.6 0 010 10.8"/></svg><svg class="ic i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></svg><svg class="ic i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 5.3v13.4c0 .8.9 1.3 1.6.8l9.6-6.7c.6-.4.6-1.2 0-1.6L9.8 4.5c-.7-.5-1.6 0-1.6.8z"/></svg>';var _tp=null;function _tpSet(b,st){if(!b)return;b.classList.toggle('is-playing',st==='playing');b.classList.toggle('is-paused',st==='paused');b.setAttribute('aria-pressed',st==='playing'?'true':'false');var z=b.dataset.part==='cn',L=st==='playing'?(z?'\u6682\u505C':'Pause'):st==='paused'?(z?'\u7EE7\u7EED\u64AD\u653E':'Resume'):b.dataset.label;b.setAttribute('aria-label',L);b.title=L;}function stopTeachAudio(){var c=_tp;if(!c)return;_tp=null;try{if(c.audio){c.audio.onended=c.audio.onerror=c.audio.ontimeupdate=null;c.audio.pause();}}catch(e){}if(c.mode==='tts'){try{speechSynthesis.cancel();}catch(e){}}_tpSet(c.btn,'idle');}function _tpFallback(btn){try{var u=new SpeechSynthesisUtterance(btn.dataset.text||'');u.lang=btn.dataset.lang||'en-US';var cur={btn:btn,mode:'tts'};_tp=cur;u.onend=u.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');}};_tpSet(btn,'playing');speechSynthesis.speak(u);}catch(e){}}function playTeachAudio(btn){if(_tp&&_tp.btn===btn){if(_tp.mode==='audio'){var a0=_tp.audio;if(a0.paused){var p0=a0.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}

function saveProgress(){try{localStorage.setItem("les-an-afternoon-as-a-stone-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="an-afternoon-as-a-stone"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"an-afternoon-as-a-stone",bookTitle:"An Afternoon as a Stone",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

let preferredVoice=null;
