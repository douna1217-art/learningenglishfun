<script>

const pages=[{"type": "cover", "title": "The Clockmakers Borrowed Hour", "subtitle": "A Missing Hour Tests What a Town Believes About Time and Fairness", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-clockmakers-borrowed-hour-assets/cover.jpg"}, {"text": "1. The Hour That Did Not Ring\nAt four o'clock, every clock in Bellweather chimed. At six, they chimed again. Mina checked Aunt Sora's master clock and found that five o'clock had vanished. No hand had crossed it, yet an hour had passed outside.\nShopkeepers argued about whether the missing hour had ever belonged to them. Theo noticed something stranger. A brass pocket watch on the repair bench had gained a star-shaped crack and continued ticking backward.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-clockmakers-borrowed-hour-assets/page1.jpg"}, {"text": "2. Silver Sand on the Steps\nA trail of silver grains crossed the shop and climbed the courthouse steps. Each grain hovered just above the stone. When Mina touched one, she remembered finishing a task she had actually left undone.\nTheo refused to touch the trail. He followed its direction instead and found a glass hourglass hidden beneath the town clock. Its upper chamber held one bright ribbon shaped like an hour.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-clockmakers-borrowed-hour-assets/page2.jpg"}, {"text": "3. What People Did With Extra Time\nThe borrowed hour had not disappeared equally. The baker remembered resting while bread baked itself. The crossing guard remembered guiding two extra groups of children. A musician remembered practicing, but her neighbors remembered silence.\nMina wrote each account on blank cards. The stories contradicted one another, yet each revealed a wish. The hourglass had given people memories of what they wanted time to do, not evidence of what had happened.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-clockmakers-borrowed-hour-assets/page3.jpg"}, {"text": "4. The Clockmakers Rule\nAunt Sora said old clockmakers kept one rule: time could be measured, shared, or wasted, but never owned. Long ago, Bellweather had built the hourglass to pause the town during emergencies. Someone had restarted it for an ordinary dispute.\nThe cracked watch belonged to Mayor Vale, who wanted more time before announcing the winter market plan. Mina felt angry, but Theo pointed out that a possession was evidence, not a verdict. Anyone could have taken it.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-clockmakers-borrowed-hour-assets/page4.jpg"}, {"text": "5. The Backward Bird\nOne clockwork bird flew backward around the tower and landed on the courthouse roof. Its tiny feet were dusted with silver. Theo found a matching nest of gears beside the clerk's window.\nThe town clerk admitted turning the hourglass. She had hoped to finish every market form before the council meeting. Instead, the magic created an hour in which wishes felt finished while real work remained.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-clockmakers-borrowed-hour-assets/page5.jpg"}, {"text": "6. Returning What Was Borrowed\nTo return the hour, everyone had to name one unfinished task without pretending it was complete. The baker reset the dough. The musician apologized for the silence. The clerk placed the unsigned forms on the council table.\nAs each person spoke honestly, silver grains fell into the lower chamber. Mina repaired the pocket watch while Theo counted the final drops. The bright ribbon loosened and flowed back into the town clock.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-clockmakers-borrowed-hour-assets/page6.jpg"}, {"text": "7. The Next Five Oclock\nThe next afternoon, Bellweather reached five o'clock normally. The bell rang once for each neighborhood, and nobody gained a perfect memory of work they had not done.\nMina mounted the repaired watch beside the hourglass. Its crack remained visible. She wanted the town to remember that asking for more time was honest, but borrowing it in secret changed everyone else's day. Time moved forward because the truth finally did.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-clockmakers-borrowed-hour-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did Mina discover when she checked Aunt Sora's master clock?", "choices": ["That the clock was now an hour fast", "That the clock had completely stopped working", "That five o'clock had vanished even though no hand had crossed it"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Mina found that five o'clock had vanished from the clock, yet an hour had still passed outside."}, {"q": "What did Theo find hidden beneath the town clock?", "choices": ["A map showing where the silver trail began", "A glass hourglass with a bright ribbon shaped like an hour", "A second pocket watch identical to the first"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Theo found a glass hourglass hidden beneath the town clock, its upper chamber holding a bright ribbon shaped like an hour."}, {"q": "What did the borrowed hour actually give people?", "choices": ["Memories of what they wanted time to do, not evidence of what had happened", "An extra hour that everyone could remember clearly", "Nothing at all; nobody noticed any difference"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Mina realized the hourglass had given people memories of their wishes, not real evidence of what had actually happened during the missing hour."}, {"q": "Whose pocket watch had gained the star-shaped crack?", "choices": ["Mayor Vale's, who wanted more time before announcing the market plan", "Theo's, who wanted to fix the town clock", "Aunt Sora's, who wanted to test the old clockmakers' rule"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "The cracked watch belonged to Mayor Vale, who had wanted more time before announcing the winter market plan."}, {"q": "What did everyone have to do to return the borrowed hour?", "choices": ["Promise never to use the hourglass again", "Name one unfinished task honestly, without pretending it was complete", "Pay a fine to the town council"], "answer": 1, "evidencePage": 6, "hint": "Look at page 6.", "explain": "To return the hour, each person had to name an unfinished task honestly, and as they spoke, silver grains fell back into the hourglass."}], "grammar": [{"q": "Which sentence correctly uses a colon to introduce a list?", "choices": ["Old clockmakers kept: one rule time could be measured, shared, or wasted, but never owned.", "Old clockmakers kept one rule, time could be measured: shared, or wasted, but never owned.", "Old clockmakers kept one rule: time could be measured, shared, or wasted, but never owned."], "answer": 2, "evidencePage": 4, "hint": "A colon can introduce a list after a complete sentence.", "explain": "A colon follows a complete sentence to introduce the rule's parts that came next.", "teach": "A colon can introduce a list after a complete sentence, like a rule followed by its parts.<span class='cn'>冒号可以在一个完整的句子后面引出一个列表，比如一条规则后面跟着具体的内容。</span>"}, {"q": "'Mina repaired the pocket watch ___ Theo counted the final drops.' Which word shows two things happening at the same time?", "choices": ["because", "while", "unless"], "answer": 1, "evidencePage": 6, "hint": "This word shows two things happening at the same time.", "explain": "'While' shows Mina's repairing and Theo's counting happened at the same time.", "teach": "<b>While</b> shows two things happening <b>at the same time</b>.<span class='cn'><b>while</b>表示两件事<b>同时</b>发生。</span>"}, {"q": "Which sentence correctly uses 'who' with a comma to add extra information about a specific person?", "choices": ["The cracked watch belonged to Mayor Vale, which wanted more time before the announcement.", "The cracked watch belonged to Mayor Vale, who wanted more time before the announcement.", "The cracked watch belonged to Mayor Vale who, wanted more time before the announcement."], "answer": 1, "evidencePage": 4, "hint": "'Who' refers to a person; when it adds extra information, a comma comes before it.", "explain": "'Who' refers to Mayor Vale, and the comma sets off the extra information since we already know exactly who is meant.", "teach": "<b>Who</b> refers to a <b>person</b>; when it adds extra information, a comma comes before it.<span class='cn'><b>who</b> 指的是<b>人</b>；当它补充额外的信息时，前面要加逗号。</span>"}], "vocabulary": [{"q": "'Vanished' means ___.", "choices": ["disappeared suddenly and completely", "became much louder than before", "appeared very slowly over time"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Five o'clock had vanished from the clock, disappearing completely even though no hand had moved."}, {"q": "'Dispute' means ___.", "choices": ["a celebration held by the whole town", "a tool used to repair clocks", "a disagreement or argument between people"], "answer": 2, "evidencePage": 4, "hint": "Look at page 4.", "explain": "The hourglass, meant for emergencies, had been restarted for an ordinary dispute instead."}, {"q": "'Honestly' means ___.", "choices": ["in a truthful and sincere way", "in a fast and careless way", "in a hidden and secretive way"], "answer": 0, "evidencePage": 6, "hint": "Look at page 6.", "explain": "As each person spoke honestly about their unfinished task, the silver grains flowed back into the hourglass."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(vanished|dispute|honestly)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 5 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function saveProgress(){try{localStorage.setItem("les-the-clockmakers-borrowed-hour-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-clockmakers-borrowed-hour"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-clockmakers-borrowed-hour",bookTitle:"The Clockmakers Borrowed Hour",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

function pickVoice(){const voices=speechSynthesis.getVoices();if(!voices.length)return;const en=voices.filter(v=>/^en(-|_|$)/i.test(v.lang));const pool=en.length?en:voices;const score=v=>{let s=0;const n=(v.name||"").toLowerCase();if(/natural/.test(n))s+=8;if(/neural/.test(n))s+=6;if(/online/.test(n))s+=4;if(/google/.test(n))s+=5;if(/(aria|jenny|guy|libby|sonia|michelle|ava|andrew|emma|clara|natasha)/.test(n))s+=5;if(/(samantha|allison|karen|serena|siri|nicky|aaron)/.test(n))s+=4;if(v.localService===false)s+=3;if(/en-us|en-gb/i.test(v.lang))s+=1;if(/(zira|david|mark|hazel|compact|espeak|eloquence)/.test(n))s-=5;return s};pool.sort((a,b)=>score(b)-score(a));preferredVoice=pool[0]||null}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.i);},at));});};}let advanced=false;const advance=()=>{if(advanced)return;advanced=true;if(watchdog)clearTimeout(watchdog);ci++;speakChunk();};u.onend=advance;u.onerror=advance;const estDur=Math.max(1200,chunk.text.length*110);const watchdog=setTimeout(advance,estDur+4000);speechSynthesis.speak(u);}setTimeout(speakChunk,70);}

function setStatus(m,ok){var el=document.getElementById("recStatus");if(el){el.textContent=m;el.style.color=ok?"#1f8f4d":"#b23b34";}}async function toggleRecording(){const btn=document.getElementById("recordPageBtn");if(recorder&&recorder.state==="recording"){recorder.stop();btn.textContent="🎙 Record";btn.classList.remove("recording");return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setStatus("Recording works only on the published website — the microphone is turned off in this preview.",false);return}if(typeof MediaRecorder==="undefined"){setStatus("This browser can't record audio. Try Chrome/Edge, or Safari 14+.",false);return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});let opts={};if(MediaRecorder.isTypeSupported){if(MediaRecorder.isTypeSupported("audio/webm"))opts={mimeType:"audio/webm"};else if(MediaRecorder.isTypeSupported("audio/mp4"))opts={mimeType:"audio/mp4"};}chunks=[];recorder=new MediaRecorder(stream,opts);recorder.ondataavailable=e=>{if(e.data&&e.data.size>0)chunks.push(e.data)};recorder.onstop=()=>{if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(new Blob(chunks,{type:(recorder.mimeType||"audio/webm")}));document.getElementById("playRecordingBtn").disabled=false;document.getElementById("deleteRecordingBtn").disabled=false;setStatus("Saved! Tap ▶ Play to hear your reading.",true);stream.getTracks().forEach(t=>t.stop())};recorder.start();btn.textContent="■ Stop";btn.classList.add("recording");setStatus("Recording… tap ■ Stop when you finish.",true)}catch(e){var n=(e&&e.name)?e.name:String(e);if(n==="NotAllowedError"||n==="SecurityError"){setStatus("Microphone blocked. In the chat preview the mic is always off — use the live website, then tap Allow (or click 🔒 in the address bar → allow Microphone → reload).",false);}else if(n==="NotFoundError"){setStatus("No microphone found on this device.",false);}else{setStatus("Could not record ("+n+"). Use the live website in Chrome/Edge/Safa function cancelFallback(){window.__fbt&&window.__fbt.forEach(clearTimeout);window.__fbt=[];}function setListenActive(id){["listenPageBtn","listenStoryBtn"].forEach(x=>{var el=document.getElementById(x);if(el)el.classList.toggle("active",x===id);});}function readStory(){var token=(window.__readToken=(window.__readToken||0)+1);speechSynthesis.cancel();cancelFallback();clearHighlight();setListenActive("listenStoryBtn");var seq=[{p:0,t:(pages[0].title+`. `+pages[0].subtitle+`.`),hl:false}];for(var i=1;i<pages.length;i++)seq.push({p:i,t:pages[i].text,hl:true});var k=0;function step(){if(token!==window.__readToken)return;if(k>=seq.length){endNarration();return;}var it=seq[k++];page=it.p;renderPage();speak(it.t,it.hl,function(){if(token===window.__readToken)step();});}step();}function endNarration(){stopRvAudio();clearHighlight();cancelFallback();var pb=document.getElementById("pauseBtn");if(pb){pb.textContent="⏸ Pause";pb.disabled=true;pb.classList.remove("active");}setListenActive(null);}
