<script>/*les-speech-shim*/
(function(){var w=window,ok=false,errs=[];

   speechSynthesis at all. The page script calls it while loading, so it stopped there and the
   story was never drawn (the quiz still worked because its handlers were bound earlier).
   Give such browsers a silent stand-in so the rest of the page runs normally. */
try{ok=typeof w.speechSynthesis==="object"&&w.speechSynthesis!==null}catch(e){}
if(typeof w.SpeechSynthesisUtterance!=="function"&&typeof w.SpeechSynthesisUtterance!=="object"){
w.SpeechSynthesisUtterance=function(t){this.text=t==null?"":String(t);this.lang="";this.rate=1;this.pitch=1;this.volume=1;this.voice=null}}
if(!ok){var gen=0,told=false;
w.speechSynthesis={speaking:false,paused:false,pending:false,
getVoices:function(){return[]},cancel:function(){gen++},pause:function(){},resume:function(){},
addEventListener:function(){},removeEventListener:function(){},
speak:function(u){var g=gen;
if(!told&&typeof w.setStatus==="function"){told=true;try{w.setStatus("This browser can't read aloud, but you can still read and practice. 当前浏览器不支持朗读，仍可阅读和做题。",false)}catch(e){}}
setTimeout(function(){if(g===gen&&u&&u.onstart){try{u.onstart({})}catch(e){}}},0);

/* If the story still is not drawn after loading, say why on the page itself, so a screenshot

<script>

const pages=[{"type": "cover", "title": "The Key Without a Door", "subtitle": "A Brass Key With No Door Sends Milo Searching for a Locked Box, but the Answer Turns on a Different Question", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-key-without-a-door-assets/cover.jpg"}, {"text": "1. Something Worth Finding\nI found the key beneath a layer of buttons in a donated cookie tin. Aunt Bea was sorting things for the library sale, and I had been given the job of matching board-game pieces. Until then, my most exciting discovery was a missing green counter under my own elbow. The key felt heavy for its size. Its broad brass handle was polished almost smooth, but the short end had no teeth. I held it up and announced that we had found a mystery.\nAunt Bea asked what kind. I said there must be a locked box somewhere. Possibly a drawer. Possibly a secret drawer. She put the tin aside and suggested we begin with the things that had arrived in the same donation. I was already imagining a small chest lined with velvet. I did not ask what might be inside it. The chest itself seemed exciting enough.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-key-without-a-door-assets/page1.jpg"}, {"text": "2. A Hole at the Wrong End\nWe found a desk organizer with an ordinary little lock. Aunt Bea showed me its key, which was still taped inside a drawer. It had a flat blade with teeth. Mine ended in a short tube. Looking straight into it, I could see a square hole. I had thought the key was supposed to go into something. Now it seemed that something was supposed to go into the key.\nI turned it between my fingers. The edges of the broad handle were dull, but two places near the middle shone. Somebody had held it there over and over. Aunt Bea asked whether it might be part of a tool. I did not like that possibility. A tool would probably lead to a loose screw rather than a secret drawer. I wrote down the square hole anyway, because it was difficult to pretend I had not seen it.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-key-without-a-door-assets/page2.jpg"}, {"text": "3. The Label on the Crate\nThe donation had come from the old house beside the bus stop. Its owner, Mrs. Vale, had moved to a smaller place and sent several crates through the library volunteer. Aunt Bea checked the list rather than letting me telephone with a question about hidden treasure. There were books, a desk organizer, a tin of sewing things, and a small wooden carousel. The carousel had been set aside because it no longer played.\nI remembered seeing a striped roof under a cloth near the shelves. I had assumed it was a cake stand. Aunt Bea said we would look at it after lunch, once she had cleared a safe space on the table. I glanced at my notebook. A silent carousel did not look much like a locked chest. Still, it belonged to the same group of objects, which was more than my imaginary chest could claim.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-key-without-a-door-assets/page3.jpg"}, {"text": "4. A Photograph of the Fair\nBefore lunch, I found an envelope of photographs in one of the donated books. Aunt Bea opened it with me. The pictures showed the town fair years ago, including a carousel with a striped roof. In one photograph, a child sat beside a much smaller version on a table. An adult's hand reached toward the toy's base. The picture did not show what the hand was holding, but it showed where the person was looking.\nI pointed to the base. Aunt Bea nodded, then asked me to separate what the picture showed from what I was guessing. I tried again. The adult might be turning something, I said. The toy might have a moving part. My key might fit it. Three possibilities were not proof, but they gave us something specific to examine. I put the photograph down instead of searching it for a hidden message.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-key-without-a-door-assets/page4.jpg"}, {"text": "5. Under the Striped Roof\nAfter lunch we uncovered the toy. Three painted horses stood beneath a red-and-white roof. One horse had lost part of its blue saddle, and the roof leaned slightly to one side. Aunt Bea lifted the whole carousel carefully and looked beneath the base. There was no keyhole. For a moment I felt disappointed in it. Then she turned it sideways so I could see a short square metal post.\nI held the key beside the post without pushing. The shapes looked right together. So did the size. The polished places on the handle now made sense, since a person could grip them and turn. I had spent half the morning searching for a hole because I thought that was what keys needed. The square socket had been in my hand the whole time, waiting for me to ask a different question.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-key-without-a-door-assets/page5.jpg"}, {"text": "6. What the Key Could Do\nAunt Bea checked the mechanism before trying it. The little post turned freely, and the base was not damaged. She fitted the brass key over it and wound gently, stopping before it felt tight. Then she set the carousel upright on the table. A thin tune began inside the wood. The horses moved slowly around the central pole. The one with the chipped saddle came past first, looking pleased with itself despite having no expression at all.\nI listened twice before speaking. It was an ordinary tune, a little uneven, and much better than the click of a secret drawer. Aunt Bea asked whether I still wanted the chest. I told her I wanted to see the third horse come around again. She left the key beside the carousel instead of putting it back with the buttons. This time the two things looked as if they belonged together.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-key-without-a-door-assets/page6.jpg"}, {"text": "7. A Better Label\nMrs. Vale came to the library sale on Saturday. Aunt Bea had called to check that she meant to donate the carousel. She did, but she was surprised to hear it playing. The key had gone missing years ago. She watched the horses make a slow circle and told us that the chipped saddle had been blue when she painted it as a child. She did not ask us to change it back.\nWe tied the key to the carousel with soft ribbon so it would not become a mystery again. I wrote a small label explaining that the music worked and that the toy had been checked. I wanted to add that I had solved a case, but the label was not about me. A younger child stopped to listen. I waited for the tune to finish before showing her where the key belonged.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-key-without-a-door-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did Milo find at the bottom of the donated tin?", "choices": ["A heavy brass key with no teeth on its short end", "A map of the library", "A tiny locked box"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "He found a heavy brass key beneath a layer of buttons, and the short end had no teeth."}, {"q": "What was strange about the end of Milo’s key?", "choices": ["It had two sets of teeth", "It was bent in half", "It was a short tube with a square hole inside"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Looking straight into it, he could see a square hole, so something was supposed to go into the key."}, {"q": "Where had the donation come from?", "choices": ["Mrs. Vale’s old house, and it included a carousel that no longer played", "The town fair", "A school in the next town"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "The crates came from the old house beside the bus stop, and the list included a small wooden carousel that no longer played."}, {"q": "What did the old photograph suggest?", "choices": ["The toy carousel might have a moving part in its base", "Mrs. Vale had never owned a toy", "The key belonged to a desk"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "A hand reached toward the toy’s base, which suggested a moving part."}, {"q": "What matched the square socket in Milo’s key?", "choices": ["A hole in the desk organizer", "A short square metal post under the carousel’s base", "A lock on the tin"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Aunt Bea turned the carousel sideways to show a short square metal post, and the shapes looked right together."}], "grammar": [{"q": "‘Looking into the key, I could see a square ___.’ Which word belongs in the blank?", "choices": ["whole", "hoal", "hole"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "The sentence is about an opening, so it needs “hole”.", "teach": "<b>Hole</b> means an opening, but <b>whole</b> means all of something, and the two words sound the same.<span class='cn'><b>Hole</b> 指“洞”，而 <b>whole</b> 指“整个的”，两个词读音相同。</span>"}, {"q": "‘Aunt Bea ___ the carousel upright on the table.’ Which verb means to put something down?", "choices": ["sit", "sat", "set"], "answer": 2, "evidencePage": 6, "hint": "Look at page 6.", "explain": "To put something somewhere is to set it.", "teach": "<b>Set</b> means to put something down, but <b>sit</b> means to rest in a seat, like <b>I set the cup down and sit.</b><span class='cn'><b>set</b> 表示“放下某物”，而 <b>sit</b> 表示“坐”，比如 <b>I set the cup down and sit.</b></span>"}, {"q": "The Greek root ‘mech’ means ‘machine’, as in ‘mechanism’. Which word has the same root?", "choices": ["medal", "mechanic", "meadow"], "answer": 1, "evidencePage": 6, "hint": "Look at page 6.", "explain": "A mechanic is a person who works on machines.", "teach": "The Greek root <b>mech</b> means machine, like <b>mechanic</b> and <b>mechanical</b>.<span class='cn'>希腊词根 <b>mech</b> 表示“机器”，比如 <b>mechanic</b>（机械师）和 <b>mechanical</b>（机械的）。</span>"}], "vocabulary": [{"q": "‘Mechanism’ means ___.", "choices": ["a kind of lock", "the working parts of a machine", "a story about a toy"], "answer": 1, "evidencePage": 6, "hint": "Look at page 6.", "explain": "Aunt Bea checked the mechanism before trying it."}, {"q": "‘Donated’ means ___.", "choices": ["sold for a high price", "given away freely to help others", "lost on purpose"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "I found the key beneath a layer of buttons in a donated cookie tin."}, {"q": "‘Socket’ means ___.", "choices": ["a hollow part that something fits into", "a loud noise", "a kind of ribbon"], "answer": 0, "evidencePage": 5, "hint": "Look at page 5.", "explain": "The square socket had been in my hand the whole time."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(mechanism|donated|socket)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 5 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}var TEACH_ICONS='<svg class="ic i-spk" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.5v5h3.6l4.9 4.5V5L7.6 9.5H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.6 9.2a4 4 0 010 5.6M18.2 6.6a7.6 7.6 0 010 10.8"/></svg><svg class="ic i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></svg><svg class="ic i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 5.3v13.4c0 .8.9 1.3 1.6.8l9.6-6.7c.6-.4.6-1.2 0-1.6L9.8 4.5c-.7-.5-1.6 0-1.6.8z"/></svg>';var _tp=null;function _tpSet(b,st){if(!b)return;b.classList.toggle('is-playing',st==='playing');b.classList.toggle('is-paused',st==='paused');b.setAttribute('aria-pressed',st==='playing'?'true':'false');var z=b.dataset.part==='cn',L=st==='playing'?(z?'\u6682\u505C':'Pause'):st==='paused'?(z?'\u7EE7\u7EED\u64AD\u653E':'Resume'):b.dataset.label;b.setAttribute('aria-label',L);b.title=L;}function stopTeachAudio(){var c=_tp;if(!c)return;_tp=null;try{if(c.audio){c.audio.onended=c.audio.onerror=c.audio.ontimeupdate=null;c.audio.pause();}}catch(e){}if(c.mode==='tts'){try{speechSynthesis.cancel();}catch(e){}}_tpSet(c.btn,'idle');}function _tpFallback(btn){try{var u=new SpeechSynthesisUtterance(btn.dataset.text||'');u.lang=btn.dataset.lang||'en-US';var cur={btn:btn,mode:'tts'};_tp=cur;u.onend=u.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');}};_tpSet(btn,'playing');speechSynthesis.speak(u);}catch(e){}}function playTeachAudio(btn){if(_tp&&_tp.btn===btn){if(_tp.mode==='audio'){var a0=_tp.audio;if(a0.paused){var p0=a0.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}

function nextQuestion(){const list=quizzes[activeTab];if(qIndex[activeTab]<list.length-1){qIndex[activeTab]++;renderPanel();return}completed[activeTab]=true;if(activeTab==="comprehension")activeTab="grammar";else if(activeTab==="grammar")activeTab="vocabulary";else{return showCompletion()}setTabs();renderPanel()}

function restartPractice(){activeTab="comprehension";qIndex={comprehension:0,grammar:0,vocabulary:0};selections={};attempts={};completed={comprehension:false,grammar:false,vocabulary:false};setTabs();renderPanel()}
function saveProgress(){try{localStorage.setItem("les-the-key-without-a-door-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-key-without-a-door"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-key-without-a-door",bookTitle:"The Key Without a Door",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

let preferredVoice=null;
