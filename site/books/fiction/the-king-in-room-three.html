<script>/*les-speech-shim*/
(function(){var w=window,ok=false,errs=[];
/* Some Android in-app browsers (UC/Quark and other vendor kernels, older WebViews) have no
   speechSynthesis at all. The page script calls it while loading, so it stopped there and the
   story was never drawn (the quiz still worked because its handlers were bound earlier).
   Give such browsers a silent stand-in so the rest of the page runs normally. */
try{ok=typeof w.speechSynthesis==="object"&&w.speechSynthesis!==null}catch(e){}
if(typeof w.SpeechSynthesisUtterance!=="function"&&typeof w.SpeechSynthesisUtterance!=="object"){
w.SpeechSynthesisUtterance=function(t){this.text=t==null?"":String(t);this.lang="";this.rate=1;this.pitch=1;this.volume=1;this.voice=null}}
if(!ok){var gen=0,told=false;
w.speechSynthesis={speaking:false,paused:false,pending:false,
getVoices:function(){return[]},cancel:function(){gen++},pause:function(){},resume:function(){},
addEventListener:function(){},removeEventListener:function(){},
speak:function(u){var g=gen;
if(!told&&typeof w.setStatus==="function"){told=true;try{w.setStatus("This browser can't read aloud, but you can still read and practice. 当前浏览器不支持朗读，仍可阅读和做题。",false)}catch(e){}}
setTimeout(function(){if(g===gen&&u&&u.onstart){try{u.onstart({})}catch(e){}}},0);
setTimeout(function(){if(g===gen&&u&&u.onend){try{u.onend({})}catch(e){}}},Math.max(600,String(u&&u.text||"").length*60))}}}
/* If the story still is not drawn after loading, say why on the page itself, so a screenshot
   from a phone we cannot test on shows the cause. */
w.addEventListener("error",function(e){try{if(errs.length<3)errs.push(String(e&&e.message||e))}catch(x){}});

})();

<script>

const pages=[{"type": "cover", "title": "The King in Room Three", "subtitle": "An Innkeeper’s Child Realizes the Quiet Guest in Room Three Is the King and Watches Father Tell Him the Truth About the North Road", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-king-in-room-three-assets/cover.jpg"}, {"text": "1. The Man without a Title\nThe traveler arrived with a dusty coat, a small bag, and a request not to be bothered. Father said he could have room three. It had a bed, a washstand, and a view of the stable roof. The traveler asked whether there was something quieter. Father said the stable roof rarely spoke. I waited for the man to laugh. After a moment, he did.\nHe signed the guest book as Elian Vale. I carried his bag upstairs while he examined the narrow hallway. He asked whether supper could be brought to his room. I explained that we served everyone downstairs because there were only three of us working. He looked surprised by a number that small. At the doorway, he said he wanted an ordinary evening, with nobody asking him to settle anything. I thought that sounded easy. Most guests managed it without making a special request.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-king-in-room-three-assets/page1.jpg"}, {"text": "2. An Ordinary Wait\nAt supper, Elian asked for the chair nearest the hearth. Father said it was being kept for a carter who had gone to fetch his supper bowl. Elian looked at the empty chair as though it had failed to understand him. He took another. Then he asked for a second blanket. I said I would bring one after helping Father clear the tables.\nHe asked how long that would take. I counted the bowls and said about ten minutes. He said a good inn should be ready for a guest's needs. I nearly told him that we had been ready for six guests and had received nine. Instead, I carried another stack of bowls to the kitchen. When I returned, he was still watching the empty hearth chair. It occurred to me that he wanted an ordinary evening with the ordinary parts removed. That seemed harder to arrange than bringing a blanket.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-king-in-room-three-assets/page2.jpg"}, {"text": "3. The Ring at the Table\nI brought the blue blanket exactly when I had promised. Elian thanked me, then held out his hand for the lamp to be moved closer. The ring on his finger caught the light. I had seen that seal pressed into the notices outside the town hall. I looked at his face again and remembered the painted portrait above the notices.\nI almost dropped the blanket. Elian put a finger to his lips. He said he had come to hear himself think, not to hear people call him Your Majesty. I promised not to announce him. In the kitchen, I told Father quietly. Father stopped scrubbing a pan. Then he asked whether the man had paid for the room. I said yes. Father went back to the pan. I expected him to order better soup or take down the good cups. He asked me to remember where we had put the clean spoons.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-king-in-room-three-assets/page3.jpg"}, {"text": "4. The Road in the Soup\nAfter the other guests went upstairs, Father sat with us for a few minutes. Elian asked whether business was good. Father said it would be better if the north road did not swallow wagon wheels. The palace had promised to inspect it twice. Both times, the inspectors had arrived by the south road and reported a pleasant journey.\nElian straightened. He said somebody should have told the palace. Father said somebody had, in three letters. I wished he would talk about the weather. Elian asked whether the letters had been respectful. Father looked at him for a moment. The first two had been, he said. Elian's mouth tightened. He had not wanted to be recognized, but he still wanted the king defended. I watched him turn the soup spoon between his fingers. For the first time that evening, he seemed uncertain which sort of guest he meant to be.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-king-in-room-three-assets/page4.jpg"}, {"text": "5. A Room with Responsibilities\nElian asked Father what he would do if he were king. Father said he would begin by asking someone who used the north road where the trouble was. Elian said that ruling involved more than repairing holes. Father agreed. So did running an inn, he said, but they still had to mend the roof.\nI waited for an angry answer. Instead, Elian asked for paper. Father brought one sheet and set the lamp beside it. Elian began a note, stopped, and asked Father's full name. He wanted a description he could send to the people responsible, he explained. Father said he could provide one in the morning. For tonight, he needed to finish the dishes. Elian glanced at the remaining pans. Then he took his blue blanket upstairs. He did not offer to appoint anybody or promise to rebuild the whole road before breakfast.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-king-in-room-three-assets/page5.jpg"}, {"text": "6. The Price of Room Three\nIn the morning, Father wrote down the worst section of the road. Elian read the description and asked two questions. I brought bread. When Elian offered an extra gold coin, Father asked what it was for. Elian said the trouble. Father said the blanket had been included in the price.\nI thought he might accept it for me. Elian put the coin away. At the door, he told me I had kept his secret well. I asked whether he had enjoyed being an ordinary guest. He looked toward the empty breakfast tables. He said he had enjoyed parts of it. Then he asked whether I had known all along that he disliked waiting. I said I had noticed before I knew who he was. He laughed more easily than he had the night before. Father handed him his bag, and this time he carried it himself.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-king-in-room-three-assets/page6.jpg"}, {"text": "7. What Came by the North Road\nThree weeks later, two surveyors arrived by the north road. Their wagon stopped at the ruts Father had described. They measured, asked questions, and stayed long enough for their boots to become properly muddy. Father gave them supper. I asked whether the king had sent them. They said their office had received a very specific instruction.\nThe road was not repaired that afternoon. It was not repaired that week either. But the surveyors returned with a work schedule, and Father pinned it beside the old letters. Room three went on being room three. Sometimes I imagined Elian at a long palace table, waiting while somebody found the right paper. I hoped he remembered the blue blanket. Father hoped he remembered the road. Both seemed possible. When the next traveler asked for a quieter room, Father mentioned the stable roof, and I waited to see whether the joke would work again.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-king-in-room-three-assets/page7.jpg"}];

in room three asked for a blanket.", "Elian Vale, the traveler in room three, asked for a blanket.", "Elian Vale, the traveler in room three asked for a blanket."], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Extra information in the middle of a sentence is set off by a comma before and after it.", "teach": "Extra information in the middle of a sentence is set off with commas on both sides, like <b>Elian Vale, the traveler in room three, asked</b>.<span class='cn'>句子中间的补充信息要用逗号前后隔开，比如 <b>Elian Vale, the traveler in room three, asked</b>。</span>"}, {"q": "The suffix ‘-ful’ means ‘full of’. What does ‘respectful’ mean?", "choices": ["Able to be respected twice", "Without respect", "Full of respect"], "answer": 2, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Respectful means showing respect.", "teach": "The suffix <b>ful</b> means full of, so <b>respectful</b> means full of respect.<span class='cn'>后缀 <b>ful</b> 表示“充满”，所以 <b>respectful</b> 就是充满敬意的。</span>"}, {"q": "‘Their wagon stopped at the ruts Father had described.’ What are ruts?", "choices": ["Wagon drivers", "Deep grooves worn into a road", "Tall trees beside a road"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "The north road swallowed wagon wheels, so ruts are deep tracks in the road.", "teach": "You can use clues around a word, like a road that <b>swallowed wagon wheels</b>, to work out that <b>ruts</b> are deep grooves.<span class='cn'>可以用周围的线索，比如道路会 <b>swallowed wagon wheels</b>（吞掉车轮），推断出 <b>ruts</b> 是深深的车辙。</span>"}], "vocabulary": [{"q": "‘Ordinary’ means ___.", "choices": ["normal, not special", "dangerous", "very expensive"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "He wanted an ordinary evening with the ordinary parts removed."}, {"q": "‘Recognized’ means ___.", "choices": ["paid for", "known because you have seen the person or thing before", "forgotten"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "He had not wanted to be recognized, but he still wanted the king defended."}, {"q": "‘Uncertain’ means ___.", "choices": ["not sure", "very angry", "extremely tired"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "He seemed uncertain which sort of guest he meant to be."}]};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(ordinary|recognized|uncertain)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}

.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
