<script>

const pages=[{"type": "cover", "title": "Mina and the Glass Dragon", "subtitle": "A Creature Made to Look Fearless Still Had Something to Fear", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/mina-and-the-glass-dragon-assets/cover.jpg"}, {"text": "1. The Crack in the Cabinet\nMina stayed late to help Auntie Sora inventory the conservatory's art cabinet. She wore her mustard cardigan, and the copper key hung from a blue cord at her neck. When she opened the last door, a glass dragon no longer sat on its velvet stand.\nA hairline crack crossed the cabinet's back panel. Beyond it, tiny blue footprints glittered across the greenhouse floor. Auntie Sora saw only scattered reflections. Mina followed them between the ferns until two bright eyes opened beneath a bench.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/mina-and-the-glass-dragon-assets/page1.jpg"}, {"text": "2. A Fearsome Whisper\nThe dragon was no larger than a cat, translucent blue with copper-colored wing joints. It lifted its narrow head and whispered, \"Do not come closer. I am fearsome.\" Its voice sounded like a spoon tapping a glass, and its wings trembled hard enough to ring.\nMina had expected a roar. Instead, she noticed the creature was hiding from the storm flashing beyond the windows. She sat several steps away and said she would not touch it. The dragon repeated \"fearsome,\" but the word now seemed like a shield made of sound.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/mina-and-the-glass-dragon-assets/page2.jpg"}, {"text": "3. The Story on the Stand\nAuntie Sora found an old label inside the cabinet: THE DRAGON WHO GUARDED THE DAWN. The carved scene showed the creature facing a wall of lightning. Mina assumed the dragon had once defeated a storm, but the small dragon shook its head.\n\"I carried one sunrise through it,\" the dragon said. \"The storm did not become less loud.\" Mina understood that the carving showed an action, not every feeling behind it. Being pictured as brave had trapped the dragon inside one polished idea.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/mina-and-the-glass-dragon-assets/page3.jpg"}, {"text": "4. Thunder in the Glasshouse\nThunder rolled over the roof. The dragon darted toward the cabinet, but a gust slammed the greenhouse door and toppled a watering can. A pane above them rattled in its frame. Auntie Sora called for everyone to move into the sturdy workroom.\nThe dragon froze halfway across the aisle. Mina was afraid too, yet she named what she could do: take the key, hold the door, and follow Auntie Sora. She offered her open satchel, not a command. After one sharp breath, the dragon climbed inside.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/mina-and-the-glass-dragon-assets/page4.jpg"}, {"text": "5. Carrying the Light\nIn the workroom, a power outage turned the windows black. The dragon's body began to glow, first at its heart and then along every glass scale. Its blue light showed the emergency lantern, the radio, and the faces gathered safely around the table.\n\"You brought the dawn again,\" Mina said. The dragon replied that it had also been carried. Mina smiled. Courage was not a coat someone wore forever; it was a choice that could be borrowed, shared, and chosen again.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/mina-and-the-glass-dragon-assets/page5.jpg"}, {"text": "6. A New Label\nAfter the storm, the dragon returned to the cabinet by choice. Mina repaired the backing with Auntie Sora and placed a small shelter inside, away from the window. Then she drafted a new label and left space for the dragon to correct it.\nThe label read: THE DRAGON WHO FEARED STORMS AND CARRIED LIGHT ANYWAY. The dragon tapped one copper wing against the glass. \"Better,\" it said. \"But write that Mina opened the way.\" A truthful story, Mina learned, could hold more than one brave act.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/mina-and-the-glass-dragon-assets/page6.jpg"}, {"text": "7. Not Without Fear\nVisitors soon gathered around the restored display. Some expected the dragon to roar. Instead, it sometimes hid during thunder and sometimes lit the cabinet. Mina never promised which version they would see, because both belonged to the same creature.\nThe copper key remained on Mina's blue cord, ready for ordinary work. Whenever she felt her own hands shake, she remembered the clear wings trembling beneath the bench. Fear could ring loudly inside a person. Courage was the action that answered.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/mina-and-the-glass-dragon-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did Mina find missing when she opened the last cabinet door?", "choices": ["A new key had appeared", "The cabinet was completely empty of everything", "The glass dragon no longer sat on its velvet stand"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "When she opened the last door, a glass dragon no longer sat on its velvet stand."}, {"q": "What did the dragon whisper when it first spoke to Mina?", "choices": ["Do not come closer. I am fearsome.", "Please help me find my way home", "I am not real, go away"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "It lifted its narrow head and whispered, \"Do not come closer. I am fearsome.\""}, {"q": "What did the old label in the cabinet claim about the dragon?", "choices": ["That it could breathe fire", "That it had once defeated a storm", "That it was the oldest dragon alive"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Mina assumed the dragon had once defeated a storm, based on the carved scene."}, {"q": "What did Mina offer the dragon during the thunder?", "choices": ["A locked cage for safety", "A loud command to obey her", "Her open satchel, not a command"], "answer": 2, "evidencePage": 4, "hint": "Look at page 4.", "explain": "She offered her open satchel, not a command."}, {"q": "What is the big idea of this story?", "choices": ["Courage is the action that answers fear, even when fear rings loudly inside someone", "Only fearless creatures deserve to be admired", "Fear should always be hidden completely"], "answer": 0, "evidencePage": 7, "hint": "Look at the last page.", "explain": "Fear could ring loudly inside a person. Courage was the action that answered."}], "grammar": [{"q": "'Mina had expected a roar. ___, she noticed the creature was hiding from the storm.' Which word signals a surprising alternative?", "choices": ["Because", "Never", "Instead"], "answer": 2, "evidencePage": 2, "hint": "This word signals what actually happened, replacing what Mina expected.", "explain": "'Instead' signals what actually happened, replacing Mina's expectation of a roar.", "teach": "<b>Instead</b> introduces what <b>actually happened</b>, replacing another idea.<span class='cn'><b>instead</b>(取而代之)引出<b>实际发生</b>的事，代替另一种想法。</span>"}, {"q": "'Mina was afraid too, ___ she named what she could do.' Which word shows contrast?", "choices": ["yet", "so", "because"], "answer": 0, "evidencePage": 4, "hint": "This word contrasts Mina's fear with her still taking action.", "explain": "'Yet' contrasts Mina's fear with her still naming what she could do.", "teach": "<b>X, yet Y</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>yet</b>(然而)表示两个事实之间的<b>对比</b>。</span>"}, {"q": "'Mina repaired the backing with Auntie Sora ___ placed a small shelter inside.' Which word joins these two actions?", "choices": ["but", "and", "so"], "answer": 1, "evidencePage": 6, "hint": "This word joins the two things Mina did.", "explain": "'And' joins repairing the backing with placing a small shelter inside.", "teach": "<b>And</b> joins <b>two actions</b> done by the same person.<span class='cn'><b>and</b>(和)连接同一个人做的<b>两个动作</b>。</span>"}], "vocabulary": [{"q": "'Translucent' means ___.", "choices": ["completely solid and opaque", "extremely heavy", "allowing some light to pass through, partly see-through"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "The dragon was translucent blue with copper-colored wing joints."}, {"q": "'Fearsome' means ___.", "choices": ["causing fear; frightening", "calm and gentle", "bright and colorful"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "\"Do not come closer. I am fearsome.\""}, {"q": "'Restored' means ___.", "choices": ["destroyed completely", "brought back to an earlier, good condition", "hidden away forever"], "answer": 1, "evidencePage": 7, "hint": "Look at page 7.", "explain": "Visitors soon gathered around the restored display."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(translucent|fearsome|restored)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 4 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function saveProgress(){try{localStorage.setItem("les-mina-and-the-glass-dragon-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="mina-and-the-glass-dragon"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"mina-and-the-glass-dragon",bookTitle:"Mina and the Glass Dragon",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

function pickVoice(){const voices=speechSynthesis.getVoices();if(!voices.length)return;const en=voices.filter(v=>/^en(-|_|$)/i.test(v.lang));const pool=en.length?en:voices;const score=v=>{let s=0;const n=(v.name||"").toLowerCase();if(/natural/.test(n))s+=8;if(/neural/.test(n))s+=6;if(/online/.test(n))s+=4;if(/google/.test(n))s+=5;if(/(aria|jenny|guy|libby|sonia|michelle|ava|andrew|emma|clara|natasha)/.test(n))s+=5;if(/(samantha|allison|karen|serena|siri|nicky|aaron)/.test(n))s+=4;if(v.localService===false)s+=3;if(/en-us|en-gb/i.test(v.lang))s+=1;if(/(zira|david|mark|hazel|compact|espeak|eloquence)/.test(n))s-=5;return s};pool.sort((a,b)=>score(b)-score(a));preferredVoice=pool[0]||null}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.
