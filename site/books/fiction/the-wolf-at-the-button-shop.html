<script>/*les-speech-shim*/
(function(){var w=window,ok=false,errs=[];
/* Some Android in-app browsers (UC/Quark and other vendor kernels, older WebViews) have no
   speechSynthesis at all. The page script calls it while loading, so it stopped there and the
   story was never drawn (the quiz still worked because its handlers were bound earlier).
   Give such browsers a silent stand-in so the rest of the page runs normally. */
try{ok=typeof w.speechSynthesis==="object"&&w.speechSynthesis!==null}catch(e){}
if(typeof w.SpeechSynthesisUtterance!=="function"&&typeof w.SpeechSynthesisUtterance!=="object"){
w.SpeechSynthesisUtterance=function(t){this.text=t==null?"":String(t);this.lang="";this.rate=1;this.pitch=1;this.volume=1;this.voice=null}}
if(!ok){var gen=0,told=false;
w.speechSynthesis={speaking:false,paused:false,pending:false,
getVoices:function(){return[]},cancel:function(){gen++},pause:function(){},resume:function(){},
addEventListener:function(){},removeEventListener:function(){},
speak:function(u){var g=gen;
if(!told&&typeof w.setStatus==="function"){told=true;try{w.setStatus("This browser can't read aloud, but you can still read and practice. 当前浏览器不支持朗读，仍可阅读和做题。",false)}catch(e){}}
setTimeout(function(){if(g===gen&&u&&u.onstart){try{u.onstart({})}catch(e){}}},0);
setTimeout(function(){if(g===gen&&u&&u.onend){try{u.onend({})}catch(e){}}},Math.max(600,String(u&&u.text||"").length*60))}}}
/* If the story still is not drawn after loading, say why on the page itself, so a screenshot
   from a phone we cannot test on shows the cause. */
w.addEventListener("error",function(e){try{if(errs.length<3)errs.push(String(e&&e.message||e))}catch(x){}});
w.addEventListener("load",function(){try{var v=document.getElementById("pageView");
if(v&&!v.firstChild&&errs.length){var d=document.createElement("div"),s=document.createElement("small");
d.style.cssText="padding:24px;color:#b91c1c;font:15px/1.6 sans-serif";
d.appendChild(document.createTextNode("The story could not be shown in this browser. 此浏览器暂时无法显示故事。"));
d.appendChild(document.createElement("br"));s.textContent=errs.join(" | ");d.appendChild(s);v.appendChild(d)}}catch(x){}});
})();
</script>
<script>

const pages=[{"type": "cover", "title": "The Wolf at the Button Shop", "subtitle": "A Helper Learns to Listen Before Changing Things", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-wolf-at-the-button-shop-assets/cover.jpg"}, {"text": "1. A Window Full of Color\nIvo loved Mabel's button shop before he worked there. He loved the green glass buttons that looked like pond water and the red ones shaped like berries. At home, he made pictures from scraps of colored paper. Here, he thought, were little pieces of pictures waiting to happen. When Mabel needed help for the spring market, he offered at once.\nOn his first morning, she showed him the drawers. Some held large buttons; others held small ones. Little cards showed circles and different numbers of holes. Ivo looked from the plain drawers to the bright window. “Could I make the shop easier to see?” he asked. “Certainly,” said Mabel. “The window could use your eye for color.”", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-wolf-at-the-button-shop-assets/page1.jpg"}, {"text": "2. A Rainbow Inside\nWhile Mabel visited the market stalls outside, Ivo arranged a rainbow in the window. Then he looked back at the drawers. Why should the rainbow stop at the glass? He poured the buttons into broad trays and sorted them by color. Blue beside blue, yellow beside yellow. The plain little cards went into a box beneath the counter. Now every tray looked like a patch of garden.\nMabel returned carrying lunch. She stopped in the doorway. “You've changed the drawers too,” she said. Ivo spread his paws proudly. The colors shone in the sunlight. Mabel set down the basket. Before she could say more, the doorbell rang. Mr. Moss came in with a button missing from his navy coat.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-wolf-at-the-button-shop-assets/page2.jpg"}, {"text": "3. The Wrong Blue\n“Something like this,” said Mr. Moss, showing a loose button from the same coat. Ivo brought the blue tray. The badger searched it with one careful paw. “These are lovely, but that one's too thick. This one won't pass through the buttonhole.” He held up a tiny blue button. “And I'd lose this before breakfast.”\nIvo carried over the black tray, hoping another color might help. Mabel put a piece of white cloth on the counter. She laid the sample button on it and searched both trays. At last, she found a match. Mr. Moss bought it, but several customers were waiting by then. Ivo watched Mabel return the trays. The rainbow seemed less convenient from this side of the counter.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-wolf-at-the-button-shop-assets/page3.jpg"}, {"text": "4. Looking for a Button\nAt lunchtime, Ivo sat beside the card box. “I made it harder, didn't I?” he asked. Mabel nodded. “You made it beautiful. Those aren't always the same job.” She took out a card with a large circle and four dots. It matched a drawer of big, flat buttons with four holes. Customers often brought coats or cuffs, she explained. First, a button had to fit. Color came after that.\nIvo rubbed a paw across his waistcoat. Its buttons were wooden, although he would have chosen yellow glass. He imagined trying to push a thick glass button through the narrow opening. “May I watch the next few customers before I move anything else?” he asked. Mabel handed him his sandwich. “That sounds like a useful beginning.”", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-wolf-at-the-button-shop-assets/page4.jpg"}, {"text": "5. What Customers Asked\nThat afternoon, Ivo listened. A squirrel needed a button flat enough to sit comfortably under a backpack strap. A mole wanted a large one that his paws could grip. A mouse brought a doll's coat with buttonholes no bigger than apple seeds. None of them began by asking for a whole tray of one color. Ivo sketched the shapes they needed on scrap paper.\nWhen the shop grew quiet, he and Mabel restored the drawers. They checked sizes against the cards instead of guessing. It took longer than making the rainbow. Ivo kept stopping to compare two nearly identical buttons. By closing time, his paws were tired. He could find a large, flat button with four holes without opening every drawer. He tried again just to be sure.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-wolf-at-the-button-shop-assets/page5.jpg"}, {"text": "6. Two Places for Color\nThe rainbow still glowed in the window. Ivo stood outside to look at it. A young hedgehog had stopped to point at the red section. Her father followed her inside and asked about buttons for a cushion. Ivo showed him the drawer of large buttons. Once they had found the right size, he brought out several colors. The hedgehog chose orange. Her father chose orange too, after a short discussion.\nThat gave Ivo another idea. He asked Mabel before trying it. They placed a few colorful sample buttons on the front of each drawer, beside its circle card. The samples showed what was inside without changing how the stock was arranged. Mabel stepped back. “Now I can find what I need, and I want to look while I do it.”", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-wolf-at-the-button-shop-assets/page6.jpg"}, {"text": "7. A Button That Fits\nOn Saturday, Mr. Moss returned. Ivo hurried to the counter, then reminded himself to wait for the question. This time, the badger needed buttons for a thick cushion cover. The little coat button would never do. Ivo asked to see the fabric and the buttonholes. He brought out two suitable sizes. Then they considered color. Mr. Moss chose a deep green that Ivo liked very much.\nBefore leaving, the badger admired the window. “Did you make that?” Ivo nodded. “And I helped arrange the drawers. Twice.” Mabel looked up from her mending and smiled. That evening, Ivo cut a yellow paper circle for his newest picture. He laid it beside a smaller one, moved it, and looked again. This picture could take its time.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-wolf-at-the-button-shop-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "Why did Ivo offer to help in Mabel’s shop?", "choices": ["He wanted to sell his paper pictures", "Mr. Moss asked him to", "He loved the buttons and Mabel needed help for the spring market"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Ivo loved the shop, and when Mabel needed help for the spring market he offered at once."}, {"q": "What did Ivo do to the drawers while Mabel was out?", "choices": ["Painted the drawers bright colors", "Sorted the buttons into trays by color", "Threw away the old cards"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "He poured the buttons into broad trays and sorted them by color."}, {"q": "Why could Mr. Moss not use the blue buttons Ivo brought?", "choices": ["They were too expensive", "They were the wrong color", "They were too thick or too tiny for his coat"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "One was too thick to pass through the buttonhole, and the tiny one he would lose before breakfast."}, {"q": "What did Mabel say has to come first when choosing a button?", "choices": ["The color has to match", "The button has to fit, and color comes after that", "The button has to be shiny"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "She explained that a button had to fit first, and color came after that."}, {"q": "How did Ivo and Mabel bring color back to the drawers?", "choices": ["They put sample buttons beside the shape cards on each drawer", "They put the rainbow in the window only", "They sorted everything by color again"], "answer": 0, "evidencePage": 6, "hint": "Look at page 6.", "explain": "They placed a few colorful sample buttons on the front of each drawer, beside its circle card."}], "grammar": [{"q": "‘Its buttons were wooden, ___ he would have chosen yellow glass.’ Which word belongs in the blank?", "choices": ["because", "although", "unless"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "The two ideas are different, so the sentence needs “although”.", "teach": "The word <b>although</b> shows that two ideas are different, like <b>although it rained, we played</b>.<span class='cn'><b>although</b> 表示两个想法形成对比，比如 <b>although it rained, we played</b>（虽然下雨了，我们还是玩了）。</span>"}, {"q": "‘Ivo looked from the plain drawers to the bright window.’ Which word means the opposite of ‘plain’?", "choices": ["empty", "fancy", "simple"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "The opposite of plain is fancy.", "teach": "<b>Antonyms</b> are words with opposite meanings, like <b>plain</b> and <b>fancy</b>.<span class='cn'><b>反义词</b>是意思相反的词，比如 <b>plain</b>（朴素的）和 <b>fancy</b>（华丽的）。</span>"}, {"q": "Which two words make up the compound word ‘buttonhole’?", "choices": ["but and tonhole", "butt and onhole", "button and hole"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "“Buttonhole” joins the words “button” and “hole”.", "teach": "A <b>compound word</b> joins two smaller words, like <b>button</b> and <b>hole</b> make <b>buttonhole</b>.<span class='cn'><b>合成词</b>由两个较小的词组成，比如 <b>button</b> 加 <b>hole</b> 变成 <b>buttonhole</b>（扣眼）。</span>"}], "vocabulary": [{"q": "‘Convenient’ means ___.", "choices": ["easy and helpful to use", "difficult to see", "very expensive"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "The rainbow seemed less convenient from this side of the counter."}, {"q": "‘Suitable’ means ___.", "choices": ["right for a certain use", "very old", "too heavy to carry"], "answer": 0, "evidencePage": 7, "hint": "Look at the last page.", "explain": "He brought out two suitable sizes."}, {"q": "‘Admired’ means ___.", "choices": ["looked at with pleasure and respect", "forgot about", "turned away from"], "answer": 0, "evidencePage": 7, "hint": "Look at the last page.", "explain": "Before leaving, the badger admired the window."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(convenient|suitable|admired)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 4 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();setListenActive(null);page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}
function selectAnswer(i){selections[activeTab+"-"+qIndex[activeTab]]=i;renderPanel()}

function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}var TEACH_ICONS='<svg class="ic i-spk" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.5v5h3.6l4.9 4.5V5L7.6 9.5H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.6 9.2a4 4 0 010 5.6M18.2 6.6a7.6 7.6 0 010 10.8"/></svg><svg class="ic i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></svg><svg class="ic i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 5.3v13.4c0 .8.9 1.3 1.6.8l9.6-6.7c.6-.4.6-1.2 0-1.6L9.8 4.5c-.7-.5-1.6 0-1.6.8z"/></svg>';var _tp=null;function _tpSet(b,st){if(!b)return;b.classList.toggle('is-playing',st==='playing');b.classList.toggle('is-paused',st==='paused');b.setAttribute('aria-pressed',st==='playing'?'true':'false');var z=b.dataset.part==='cn',L=st==='playing'?(z?'\u6682\u505C':'Pause'):st==='paused'?(z?'\u7EE7\u7EED\u64AD\u653E':'Resume'):b.dataset.label;b.setAttribute('aria-label',L);b.title=L;}function stopTeachAudio(){var c=_tp;if(!c)return;_tp=null;try{if(c.audio){c.audio.onended=c.audio.onerror=c.audio.ontimeupdate=null;c.audio.pause();}}catch(e){}if(c.mode==='tts'){try{speechSynthesis.cancel();}catch(e){}}_tpSet(c.btn,'idle');}function _tpFallback(btn){try{var u=new SpeechSynthesisUtterance(btn.dataset.text||'');u.lang=btn.dataset.lang||'en-US';var cur={btn:btn,mode:'tts'};_tp=cur;u.onend=u.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');}};_tpSet(btn,'playing');speechSynthesis.speak(u);}catch(e){}}function playTeachAudio(btn){if(_tp&&_tp.btn===btn){if(_tp.mode==='audio'){var a0=_tp.audio;if(a0.paused){var p0=a0.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}
function returnToQuestion(){(function(){var b=document.getElementById("evidenceBanner");if(b&&b.parentNode)b.parentNode.removeChild(b);})();renderPanel();document.querySelector(".panel").scrollIntoView({behavior:"smooth",block:"start"})}
function nextQuestion(){const list=quizzes[activeTab];if(qIndex[activeTab]<list.length-1){qIndex[activeTab]++;renderPanel();return}completed[activeTab]=true;if(activeTab==="comprehension")activeTab="grammar";else if(activeTab==="grammar")activeTab="vocabulary";else{return showCompletion()}setTabs();renderPanel()}
function showCompletion(){completed.vocabulary=true;setTabs();const correct=Object.keys(selections).filter(k=>{const [tab,idx]=k.split('-');return selections[k]===quizzes[tab][+idx].answer}).length,total=Object.values(quizzes).reduce((a,b)=>a+b.length,0);document.getElementById("stagePill").textContent="Journey Complete";document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">Reading journey complete</div><h2>Wonderful work! 🎉</h2><p class="small">You finished Reading, Grammar, and Vocabulary.</p><div class="score-row"><div class="score-box"><b>${total}</b><br><span>Questions</span></div><div class="score-box"><b>${correct}</b><br><span>Correct now</span></div></div><div class="feedback good">You used evidence, practiced sentence skills, and learned new words.</div><button class="submit" onclick="restartPractice()">Practice Again</button></div>`}
function restartPractice(){activeTab="comprehension";qIndex={comprehension:0,grammar:0,vocabulary:0};selections={};attempts={};completed={comprehension:false,grammar:false,vocabulary:false};setTabs();renderPanel()}
function saveProgress(){try{localStorage.setItem("les-the-wolf-at-the-button-shop-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-wolf-at-the-button-shop"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-wolf-at-the-button-shop",bookTitle:"The Wolf at the Button Shop",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}
function clearHighlight(){document.querySelectorAll(".story-word.reading").forEach(x=>x.classList.remove("reading"))}
let preferredVoice=null;

<script>/*les-button-layout-js*/
