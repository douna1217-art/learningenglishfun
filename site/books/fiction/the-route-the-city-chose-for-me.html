<script>/*les-speech-shim*/
(function(){var w=window,ok=false,errs=[];
/* Some Android in-app browsers (UC/Quark and other vendor kernels, older WebViews) have no
   speechSynthesis at all. The page script calls it while loading, so it stopped there and the
   story was never drawn (the quiz still worked because its handlers were bound earlier).
   Give such browsers a silent stand-in so the rest of the page runs normally. */
try{ok=typeof w.speechSynthesis==="object"&&w.speechSynthesis!==null}catch(e){}
if(typeof w.SpeechSynthesisUtterance!=="function"&&typeof w.SpeechSynthesisUtterance!=="object"){
w.SpeechSynthesisUtterance=function(t){this.text=t==null?"":String(t);this.lang="";this.rate=1;this.pitch=1;this.volume=1;this.voice=null}}
if(!ok){var gen=0,told=false;
w.speechSynthesis={speaking:false,paused:false,pending:false,
getVoices:function(){return[]},cancel:function(){gen++},pause:function(){},resume:function(){},
addEventListener:function(){},removeEventListener:function(){},
speak:function(u){var g=gen;
if(!told&&typeof w.setStatus==="function"){told=true;try{w.setStatus("This browser can't read aloud, but you can still read and practice. 当前浏览器不支持朗读，仍可阅读和做题。",false)}catch(e){}}
setTimeout(function(){if(g===gen&&u&&u.onstart){try{u.onstart({})}catch(e){}}},0);
setTimeout(function(){if(g===gen&&u&&u.onend){try{u.onend({})}catch(e){}}},Math.max(600,String(u&&u.text||"").length*60))}}}
/* If the story still is not drawn after loading, say why on the page itself, so a screenshot

<script>

const pages=[{"type": "cover", "title": "The Route the City Chose for Me", "subtitle": "A Student Whose Smart Glasses Plan Every Saturday Tries a Clay Workshop and Learns That a Rating Cannot Predict What They Will Enjoy", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-route-the-city-chose-for-me-assets/cover.jpg"}, {"text": "1. A Saturday Already Chosen\nThe city planned an excellent Saturday for me before I finished breakfast. My glasses offered the rooftop game hall, a bowl of pepper noodles, and a visit to the racing museum. All three places had earned five stars from me. The route avoided long lines and left enough time to reach home before dinner. I accepted it with a blink. Planning used to take ages, Dad said. I could do it while brushing my teeth.\nNia met me outside the transit stop. We had been allowed to spend the afternoon together in the central district, where we both knew the streets and the return trains. I told her the plan. She tipped her head. “Didn't we do that last month?” We had. We had also done most of it the month before. That seemed like evidence of a good plan to me. Nia asked whether the city knew anything we hadn't already tried.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-route-the-city-chose-for-me-assets/page1.jpg"}, {"text": "2. The Missing Afternoon\nI asked for something different. The glasses suggested a new racing museum exhibit and pepper noodles with an extra topping. Nia laughed, but I felt defensive on the city's behalf. It had found my favorite game hall when I was new to the district. It knew which trains were crowded and which restaurants served food I could eat. A system that remembered so much surely understood what I liked.\nWe passed an open workshop where tiny ceramic houses stood in a window. Behind them, a worker rolled a patterned cylinder through wet clay, leaving a trail of little stars. Nia stopped. “That looks interesting.” My glasses had no reason to send me inside. I had given a clay activity one star when I was eight. I remembered the dry lump that would not become a dragon, and my sister's much better bowl. The city had remembered too.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-route-the-city-chose-for-me-assets/page2.jpg"}, {"text": "3. One Star\n“You were eight,” Nia said when I told her. “I'm still not good at it.” “You might still hate it,” she admitted. “We could find out.” I looked at the neat route waiting in my lenses. The game hall had a place for me. The workshop had a question. I asked the glasses how much I would enjoy a visit. They offered a low estimate based on my earlier rating and recommended keeping our current booking.\nFor a moment, I was angry at the number. Then I realized I had asked for it. The city wasn't dragging me toward the museum. It was using the answers I had given and the choices I kept repeating. Nia suggested going inside for ten minutes before deciding. I canceled our free game-hall reservation so someone else could use it. My glasses adjusted our return time. They did that part perfectly.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-route-the-city-chose-for-me-assets/page3.jpg"}, {"text": "4. The First Crooked House\nThe workshop owner, Mrs. Sen, explained the short beginner session. We could use a wooden roller to make a strip of patterned clay, then build a small house from flat pieces. Nia chose leaves. I chose stars, perhaps because the city had not yet ruined my opinion of them. Mrs. Sen showed me how to press firmly without making the clay stick to the roller. My first wall folded over like a tired sandwich.\nI waited for Nia's house to be annoyingly perfect. Its doorway leaned, and its roof had a hole she hadn't intended. She laughed and made the hole larger for a chimney. Mrs. Sen brought me another small piece of clay. “Would you like to try that wall again?” I did, though I couldn't yet say I was enjoying myself. My sleeves were dusty. The game hall would have been easier. I rolled another row of stars.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-route-the-city-chose-for-me-assets/page4.jpg"}, {"text": "5. Something Without a Score\nBy the end of the session, my house stood without assistance. One wall was thicker than the others, and the roof had a visible crack that Mrs. Sen helped me join. She said the pieces would dry and be fired before we could collect them. I chose blue glaze from a sample tile. Nia chose green. We washed our hands while Mrs. Sen placed our houses on a drying shelf with labels underneath.\nOutside, my glasses asked for a rating. I nearly chose three stars. Then I hesitated. I had disliked the first ten minutes and liked the last twenty. I liked the company, the star roller, and the fact that I had made something I could not have ordered exactly. I still disliked the way clay collected under my nails. “Can I answer later?” I asked. The question disappeared. The afternoon continued without becoming a number.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-route-the-city-chose-for-me-assets/page5.jpg"}, {"text": "6. The Wrong Noodles\nWe were hungry by then. I asked the glasses for the nearest place with tables outside, rather than the place most likely to become my favorite. They found one around the corner. I chose a dish I hadn't tried. It tasted strongly of anise, which I disliked. Nia offered me some rice, and I ate enough to stop being hungry. A new choice, it turned out, could be disappointing without proving that every new choice was foolish.\nOn the train home, the city suggested pepper noodles for our next outing. I smiled. It wasn't wrong that I liked them. I changed one setting to include unfamiliar activities, even when there wasn't enough information to predict my rating. The glasses warned that suggestions might suit me less often. I accepted. Nia leaned back against the seat and asked what I would tell Dad. “That the city got us home on time,” I said. “And we planned some of the middle ourselves.”", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-route-the-city-chose-for-me-assets/page6.jpg"}, {"text": "7. The Space Beside the Line\nTwo weeks later, we collected our houses. Mine was a brighter blue than I expected. The repaired crack still showed faintly below the roof, and the little stars blurred at one corner. I put it on my windowsill. I finally rated the workshop, adding a note about the beginner session instead of expecting one number to explain the whole afternoon. The city thanked me and suggested a longer class. I hadn't decided whether I wanted that yet.\nThe following Saturday, my glasses offered a route with an unfamiliar stop beside two places I already liked. I looked up the stop, checked its hours, and asked Nia what she thought. We kept it on the plan. Later, we might change our minds. I still used the glasses for train times, road crossings, and directions. I simply stopped treating every line they drew as if it were the edge of the person I was allowed to become.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-route-the-city-chose-for-me-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "Why did Nia ask whether the city knew anything they had not already tried?", "choices": ["They had done almost the same plan last month and the month before", "The plan was too expensive", "She had never been to the district"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "The narrator had to admit that they had done most of the plan the month before and last month."}, {"q": "Why did the glasses not suggest the clay workshop?", "choices": ["The narrator had given a clay activity one star at age eight", "The workshop was closed", "The workshop was too far away"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "I had given a clay activity one star when I was eight."}, {"q": "What did the narrator do with the game-hall reservation?", "choices": ["Kept it and went later", "Gave it to Nia’s sister", "Canceled it so someone else could use it"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "The narrator canceled the free game-hall reservation so someone else could use it."}, {"q": "What happened to the narrator’s first clay wall?", "choices": ["It dried perfectly", "It folded over like a tired sandwich, and Mrs. Sen offered another piece of clay to try again", "Nia fixed it for the narrator"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "The first wall folded over, and Mrs. Sen brought another small piece of clay."}, {"q": "What setting did the narrator change on the glasses?", "choices": ["To only show noodle restaurants", "To include unfamiliar activities, even when there was not enough information to predict the rating", "To turn off all suggestions"], "answer": 1, "evidencePage": 6, "hint": "Look at page 6.", "explain": "The narrator changed one setting to include unfamiliar activities."}], "grammar": [{"q": "‘The glasses did that part ___.’ Which word belongs in the blank?", "choices": ["well", "goodly", "good"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Well describes how the glasses did the job, so the sentence needs the adverb.", "teach": "Use <b>well</b> as an adverb to tell how something is done, like <b>did it well</b>, and <b>good</b> to describe a noun.<span class='cn'><b>well</b> 是副词，表示事情做得怎样，比如 <b>did it well</b>；<b>good</b> 用来描述名词。</span>"}, {"q": "The prefix ‘pre-’ means ‘before’ and the root ‘dict’ means ‘say’. What does ‘predict’ mean?", "choices": ["To say something loudly", "To say what will happen before it happens", "To say something again"], "answer": 1, "evidencePage": 6, "hint": "Look at page 6.", "explain": "Pre means before and dict means say, so predict means say before.", "teach": "The prefix <b>pre</b> means before and the root <b>dict</b> means say, so <b>predict</b> means say before.<span class='cn'>前缀 <b>pre</b> 表示“之前”，词根 <b>dict</b> 表示“说”，所以 <b>predict</b> 就是事先说出会发生什么。</span>"}, {"q": "‘My first wall folded over like a tired sandwich.’ What does this comparison show?", "choices": ["The narrator was hungry", "The wall was floppy and drooped instead of standing up", "The wall was very strong"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "A tired sandwich droops, so the comparison shows the wall could not stand.", "teach": "A <b>simile</b> uses <b>like</b> to compare, and a wall <b>like a tired sandwich</b> shows that it drooped.<span class='cn'><b>明喻</b>用 <b>like</b> 来比较，墙 <b>like a tired sandwich</b>（像一块疲惫的三明治）说明它软塌塌的。</span>"}], "vocabulary": [{"q": "‘Estimate’ means ___.", "choices": ["a careful guess about an amount or result", "a kind of clay", "a loud complaint"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "They offered a low estimate based on my earlier rating."}, {"q": "‘Recommended’ means ___.", "choices": ["forgotten", "refused completely", "suggested as a good choice"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "They recommended keeping our current booking."}, {"q": "‘Unfamiliar’ means ___.", "choices": ["easy to find", "very old", "not known or tried before"], "answer": 2, "evidencePage": 6, "hint": "Look at page 6.", "explain": "I changed one setting to include unfamiliar activities."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(estimate|recommended|unfamiliar)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 6 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}var TEACH_ICONS='<svg class="ic i-spk" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.5v5h3.6l4.9 4.5V5L7.6 9.5H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.6 9.2a4 4 0 010 5.6M18.2 6.6a7.6 7.6 0 010 10.8"/></svg><svg class="ic i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></svg><svg class="ic i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 5.3v13.4c0 .8.9 1.3 1.6.8l9.6-6.7c.6-.4.6-1.2 0-1.6L9.8 4.5c-.7-.5-1.6 0-1.6.8z"/></svg>';var _tp=null;function _tpSet(b,st){if(!b)return;b.classList.toggle('is-playing',st==='playing');b.classList.toggle('is-paused',st==='paused');b.setAttribute('aria-pressed',st==='playing'?'true':'false');var z=b.dataset.part==='cn',L=st==='playing'?(z?'\u6682\u505C':'Pause'):st==='paused'?(z?'\u7EE7\u7EED\u64AD\u653E':'Resume'):b.dataset.label;b.setAttribute('aria-label',L);b.title=L;}function stopTeachAudio(){var c=_tp;if(!c)return;_tp=null;try{if(c.audio){c.audio.onended=c.audio.onerror=c.audio.ontimeupdate=null;c.audio.pause();}}catch(e){}if(c.mode==='tts'){try{speechSynthesis.cancel();}catch(e){}}_tpSet(c.btn,'idle');}function _tpFallback(btn){try{var u=new SpeechSynthesisUtterance(btn.dataset.text||'');u.lang=btn.dataset.lang||'en-US';var cur={btn:btn,mode:'tts'};_tp=cur;u.onend=u.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');}};_tpSet(btn,'playing');speechSynthesis.speak(u);}catch(e){}}function playTeachAudio(btn){if(_tp&&_tp.btn===btn){if(_tp.mode==='audio'){var a0=_tp.audio;if(a0.paused){var p0=a0.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}

function nextQuestion(){const list=quizzes[activeTab];if(qIndex[activeTab]<list.length-1){qIndex[activeTab]++;renderPanel();return}completed[activeTab]=true;if(activeTab==="comprehension")activeTab="grammar";else if(activeTab==="grammar")activeTab="vocabulary";else{return showCompletion()}setTabs();renderPanel()}

function saveProgress(){try{localStorage.setItem("les-the-route-the-city-chose-for-me-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-route-the-city-chose-for-me"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-route-the-city-chose-for-me",bookTitle:"The Route the City Chose for Me",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}
function clearHighlight(){document.querySelectorAll(".story-word.reading").forEach(x=>x.classList.remove("reading"))}
let preferredVoice=null;
