n{font-size:.84rem;color:#ddd4e8}.evidence-banner button{border:0;border-radius:10px;padding:9px 12px;background:#fff;color:var(--purple);font-weight:950;cursor:pointer}.footer{text-align:center;color:var(--muted);font-size:.8rem;padding:13px}

<script>
const pages=[{"type":"cover","image":"https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-attic-orchestra-assets/cover.jpg","title":"The Attic Orchestra","subtitle":"A Story About Listening Together"},{"text":"Sofia climbed the attic stairs quietly. Somewhere above her, something tapped softly: tap, tap, tap.","image":"https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-attic-orchestra-assets/page1.jpg"},{"text":"An old music trunk opened suddenly. Five tiny instruments jumped out and bowed politely.","image":"https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-attic-orchestra-assets/page2.jpg"},{"text":"The drum beat loudly. The trumpet played quickly. Everyone performed at once, and Sofia covered her ears.","image":"https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-attic-orchestra-assets/page3.jpg"},{"text":"Sofia listened carefully. Then she raised one hand slowly, just like a conductor.","image":"https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-attic-orchestra-assets/page4.jpg"},{"text":"The drum tapped slowly. The flute played softly. For the first time, they could hear each other.","image":"https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-attic-orchestra-assets/page5.jpg"},{"text":"The violin joined smoothly. The trumpet answered brightly. The triangle rang clearly above them all.","image":"https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-attic-orchestra-assets/page6.jpg"},{"text":"Soon, the little orchestra played beautifully together. Sofia conducted happily as the music filled the attic.","image":"https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-attic-orchestra-assets/page7.jpg"},{"text":"At last, the instruments bowed politely and climbed neatly into the trunk. They left Sofia a tiny golden music charm.","image":"https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-attic-orchestra-assets/page8.jpg"}];
const quizzes={"comprehension":[{"q":"What did Sofia hear in the attic?","choices":["a soft tapping sound","a barking dog","a ringing phone"],"answer":0,"evidencePage":1,"hint":"Look at page 1.","explain":"Sofia heard something tapping softly. (CA CCSS RL.1.1)"},{"q":"What came out of the old trunk?","choices":["five tiny instruments","five toy cars","five birds"],"answer":0,"evidencePage":2,"hint":"Look closely at page 2.","explain":"Five tiny living instruments jumped from the trunk. (CA CCSS RL.1.3, RL.1.7)"},{"q":"Why did Sofia cover her ears?","choices":["everyone played loudly at once","the attic was cold","the trunk disappeared"],"answer":0,"evidencePage":3,"hint":"Look at page 3.","explain":"The instruments all played loudly and quickly at the same time."},{"q":"How did the music change?","choices":["the instruments listened and played together","the instruments stopped forever","Sofia left the attic"],"answer":0,"evidencePage":7,"hint":"Look at page 7.","explain":"The instruments listened to one another and made beautiful music together. (CA CCSS RL.1.2)"}],"grammar":[{"q":"Which word tells HOW Sofia climbed the stairs?","choices":["quietly","attic","stairs"],"answer":0,"evidencePage":1,"hint":"Find the word that describes the action “climbed.”","explain":"“Quietly” is an adverb. It tells how Sofia climbed. (CA CCSS L.1.1)","teach":"An <b>adverb</b> tells <b>how</b> and often ends in <b>-ly</b>. <b>quietly</b> = how she climbed → adverb. <b>attic</b> and <b>stairs</b> name places/things → nouns.<span class='cn'><b>副词</b>说明“怎样”,常以 <b>-ly</b> 结尾。<b>quietly</b>(安静地)→副词;<b>attic</b>、<b>stairs</b> 是名称→名词。</span>"},{"q":"Choose the best adverb: “The drum played ___.”","choices":["loudly","loud","noise"],"answer":0,"evidencePage":3,"hint":"Choose the word that tells how it played.","explain":"“Loudly” tells how the drum played. (CA CCSS L.1.1)","teach":"Use an adverb to tell how it played: <b>loudly</b> (-ly) describes the action 'played'. <b>loud</b> is an adjective (describes a thing). <b>noise</b> names a thing → noun.<span class='cn'>用副词说明怎么演奏:<b>loudly</b>(-ly)修饰动作 played;<b>loud</b> 是形容词(修饰物);<b>noise</b> 是名词。</span>"},{"q":"Which adverb means “with great care”?","choices":["carefully","suddenly","brightly"],"answer":0,"evidencePage":4,"hint":"Sofia paid close attention.","explain":"“Carefully” means with care and attention.","teach":"<b>carefully</b> = with care. <b>suddenly</b> = all at once. <b>brightly</b> = in a bright way. Only 'carefully' means with great care.<span class='cn'><b>carefully</b>=细心地;<b>suddenly</b>=突然;<b>brightly</b>=明亮地。只有 carefully 表示“很小心”。</span>"},{"q":"Which sentence uses an adverb correctly?","choices":["The flute played softly.","The softly flute played.","The flute was softly."],"answer":0,"evidencePage":5,"hint":"The adverb should describe the action “played.”","explain":"In “played softly,” the adverb tells how the flute played. (CA CCSS L.1.1)","teach":"An adverb usually comes <b>after</b> the action: 'played <b>softly</b>.' 'softly flute' puts it before a noun (wrong). 'was softly' has no action to describe (wrong).<span class='cn'>副词通常放在动作<b>后面</b>:played softly。“softly flute”放在名词前(错);“was softly”没有动作可修饰(错)。</span>"}],"vocabulary":[{"q":"What is an “orchestra”?","choices":["a group of musicians playing together","a box of old clothes","a kind of staircase"],"answer":0,"evidencePage":7,"hint":"Think about all the instruments together.","explain":"An orchestra is a group of musicians who perform together."},{"q":"What does “conductor” mean in this story?","choices":["a person who guides musicians","a person who repairs stairs","a person who paints pictures"],"answer":0,"evidencePage":4,"hint":"Sofia used her hands to guide the music.","explain":"A conductor leads and guides an orchestra."},{"q":"What does “politely” mean?","choices":["with good manners","very noisily","without looking"],"answer":0,"evidencePage":8,"hint":"Think about the instruments bowing.","explain":"Politely means acting with good manners and respect."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Reading",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(quietly|softly|suddenly|loudly|quickly|carefully|slowly|smoothly|brightly|clearly|beautifully|happily|politely|neatly)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 1 Reading</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><div class="cover-title"><h2>${p.title}</h2><p>${p.subtitle}</p></div><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}
function selectAnswer(i){selections[activeTab+"-"+qIndex[activeTab]]=i;renderPanel()}

function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}function playTeachAudio(key,part,fallbackText,fallbackLang){try{var store=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[key];if(store&&store[part]){var a=new Audio(store[part]);a.play();return;}}catch(e){}speakText(fallbackText,fallbackLang);}function renderTeach(teachHtml,key){var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+='<button style="border:0;background:#e2483f;color:#fff;cursor:pointer;font-size:.8em;line-height:1;vertical-align:middle;padding:0;margin-right:6px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;width:1.9em;height:1.9em;box-shadow:0 2px 6px rgba(226,72,63,.35)" data-key="'+key+'" data-part="en" data-text="'+escAttr(enText)+'" data-lang="en-US" onclick="playTeachAudio(this.dataset.key,this.dataset.part,this.dataset.text,this.dataset.lang)" aria-label="Listen in English" title="Listen in English">\uD83D\uDD0A</button> '+enHtml;if(cnHtml){out+='<span class="cn"><button style="border:0;background:#e2483f;color:#fff;cursor:pointer;font-size:.8em;line-height:1;vertical-align:middle;padding:0;margin-right:6px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;width:1.9em;height:1.9em;box-shadow:0 2px 6px rgba(226,72,63,.35)" data-key="'+key+'" data-part="cn" data-text="'+escAttr(cnText)+'" data-lang="zh-CN" onclick="playTeachAudio(this.dataset.key,this.dataset.part,this.dataset.text,this.dataset.lang)" aria-label="\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3" tit
