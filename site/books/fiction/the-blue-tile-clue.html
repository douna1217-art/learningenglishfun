<script>

const pages=[{"type": "cover", "title": "The Blue Tile Clue", "subtitle": "A Missing Piece, a Trail of Evidence, and an Assumption That Does Not Fit.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-blue-tile-clue-assets/cover.jpg"}, {"text": "1. The Empty Shape\nOn Saturday morning, Elena Ruiz arrived early to help finish the community center's river mosaic. Hundreds of glass tiles curved across the wall—green for reeds, silver for fish, and blue for moving water. In the center of the river, however, a thumb-sized shape was empty.\n“The cobalt tile was here yesterday,” said Jordan Lee. “Someone must have taken it.” Elena felt the same quick suspicion, but she opened her notebook instead. A guess, she reminded herself, was not yet a conclusion.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-blue-tile-clue-assets/page1.jpg"}, {"text": "2. What Was Not There\nElena studied the worktable below the mosaic. There were no glittering shards, so the tile probably had not shattered there. The empty space held a curved smear of dried adhesive, but no torn backing paper. On the floor, a faint line of pale blue dust led toward the supply carts.\nJordan leaned close. “A thief left a trail.” Elena wrote a different sentence: The dust may show where the tile traveled. The two statements sounded similar, yet only one stayed open to more than one explanation.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-blue-tile-clue-assets/page2.jpg"}, {"text": "3. The Trail That Stopped\nThe dust ended beside a cart stacked with grout, sponges, and safety goggles. A folded rag on the bottom shelf carried a crescent-shaped blue stain. Jordan checked behind the cart, but there was no tile. Then Elena noticed that one wheel had rolled through the dust and printed the same narrow line again and again.\n“The cart made the trail,” she said, “but it does not prove that the tile came this way.” Jordan erased thief from the top of his own notes. The mystery had become harder, but their evidence had become better.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-blue-tile-clue-assets/page3.jpg"}, {"text": "4. A Different Kind of Clue\nThey returned to the mosaic and tapped two spare tiles gently with wooden craft sticks, as their instructor had shown them. One tile chimed. The other answered with a dull click. Ms. Torres had explained that hidden cracks could change a tile's sound even when its surface looked whole.\nElena pictured yesterday's cleanup. The missing tile had been near the edge of the table. If someone discovered a crack, where would a careful artist place it? Not in a pocket, she thought. Somewhere padded. Somewhere safe.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-blue-tile-clue-assets/page4.jpg"}, {"text": "5. Under the Workbench\nThey searched the shelves for foam, cloth, or boxes used to protect sharp materials. Beneath the main workbench, Jordan found a shallow tray lined with thick felt. Inside lay the cobalt tile, wrapped in the corner of a rag. A hairline crack crossed its back.\nBeside it sat a replacement tile, slightly darker than the original. No one had stolen anything, but someone had removed a damaged piece before it could break on the wall. Elena felt relief—and an uncomfortable pinch when she remembered how quickly they had imagined a thief.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-blue-tile-clue-assets/page5.jpg"}, {"text": "6. The Explanation Fits\nMs. Torres returned carrying a box of gloves. She confirmed their inference: during cleanup, she had heard the tile click instead of chime. She had set it aside, then left to find a replacement before labeling the tray. “You followed the evidence,” she said, “and you also changed your minds when the evidence changed.”\nJordan looked at his crossed-out word. “I think changing our minds was the most important clue.” Elena agreed. A strong explanation did not simply sound exciting; it accounted for every detail without inventing facts.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-blue-tile-clue-assets/page6.jpg"}, {"text": "7. A Better-Fitting Piece\nThey fitted the darker blue replacement into the river. At first, Elena worried that it would look wrong. Then she stepped back. The new shade made the water seem deeper, like a pool beneath a bridge. The repaired mosaic did not hide the mystery; it carried the story of careful work.\nFor the opening, Elena placed the cracked tile in a clear display box with their clue sketches. Jordan suggested a title: Look Twice. Elena smiled. The empty shape had taught them that evidence can fill a gap—and that assumptions often leave one behind.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-blue-tile-clue-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What was missing from the river mosaic?", "choices": ["An entire wall panel", "A thumb-sized cobalt blue tile", "A wooden picture frame"], "answer": 1, "evidencePage": 1, "hint": "Look at chapter 1.", "explain": "In the center of the river, a thumb-sized shape was empty."}, {"q": "What did Elena notice was missing from the empty space on the worktable?", "choices": ["A note explaining what happened", "Nothing was different at all", "Glittering shards and torn backing paper"], "answer": 2, "evidencePage": 2, "hint": "Look at chapter 2.", "explain": "There were no glittering shards and no torn backing paper near the empty space."}, {"q": "What did Elena realize about the dust trail near the cart?", "choices": ["The cart's wheel had made the trail, not necessarily the tile", "It definitely proved a thief had taken the tile", "It led directly to the missing tile"], "answer": 0, "evidencePage": 3, "hint": "Look at chapter 3.", "explain": "One wheel had rolled through the dust and printed the same narrow line again and again."}, {"q": "Where did Jordan find the missing tile?", "choices": ["In someone's pocket", "In a felt-lined tray under the workbench, with a hairline crack", "Thrown in the trash"], "answer": 1, "evidencePage": 5, "hint": "Look at chapter 5.", "explain": "Beneath the main workbench, Jordan found the cobalt tile in a felt-lined tray, with a hairline crack across its back."}, {"q": "What is the big idea of this story?", "choices": ["The first suspicion is always the correct explanation", "Broken tiles should never be replaced", "A missing piece, a trail of evidence, and an assumption that does not fit—evidence can fill a gap that assumptions leave behind"], "answer": 2, "evidencePage": 7, "hint": "Look at the last chapter.", "explain": "Evidence can fill a gap—and assumptions often leave one behind."}], "grammar": [{"q": "“A guess was not yet a conclusion, ___ Elena opened her notebook instead of assuming a thief.” Which word shows the result?", "choices": ["but", "so", "because"], "answer": 1, "evidencePage": 1, "hint": "This word shows what Elena did as a result of that belief.", "explain": "“So” shows opening her notebook was a result of believing a guess wasn't yet a conclusion.", "teach": "<b>X, so Y</b> shows Y is a <b>result</b> of X.<span class='cn'><b>so</b>(所以)表示Y是X的<b>结果</b>。</span>"}, {"q": "“The cart made the trail, ___ it does not prove that the tile came this way.” Which word shows contrast?", "choices": ["so", "because", "but"], "answer": 2, "evidencePage": 3, "hint": "This word contrasts one fact with what it does NOT prove.", "explain": "“But” contrasts the cart making the trail with that fact not proving anything about the tile.", "teach": "<b>But</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>but</b>(但是)表示两个事实之间的<b>对比</b>。</span>"}, {"q": "“No one had stolen anything, ___ someone had removed a damaged piece before it could break on the wall.” Which word shows contrast?", "choices": ["but", "so", "because"], "answer": 0, "evidencePage": 5, "hint": "This word contrasts the false suspicion with the real explanation.", "explain": "“But” contrasts the assumption of theft with the careful, real explanation.", "teach": "<b>But</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>but</b>(但是)表示两个事实之间的<b>对比</b>。</span>"}], "vocabulary": [{"q": "‘Adhesive’ means ___.", "choices": ["a type of glass tile", "a substance used to stick or glue things together", "a type of dust"], "answer": 1, "evidencePage": 2, "hint": "Look at chapter 2.", "explain": "The empty space held a curved smear of dried adhesive."}, {"q": "‘Assumption’ means ___.", "choices": ["a fact proven with careful evidence", "a type of mosaic tile", "something believed to be true without being checked or proven"], "answer": 2, "evidencePage": 6, "hint": "Look at chapter 6.", "explain": "Assumptions often leave a gap that evidence can fill instead."}, {"q": "‘Conclusion’ means ___.", "choices": ["a decision or judgment reached after looking at the evidence", "a random guess made before looking at anything", "a type of adhesive"], "answer": 0, "evidencePage": 1, "hint": "Look at chapter 1.", "explain": "A guess, Elena reminded herself, was not yet a conclusion."}]};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(adhesive|assumption|conclusion)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 4 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function saveProgress(){try{localStorage.setItem("les-the-blue-tile-clue-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-blue-tile-clue"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-blue-tile-clue",bookTitle:"The Blue Tile Clue",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

function pickVoice(){const voices=speechSynthesis.getVoices();if(!voices.length)return;const en=voices.filter(v=>/^en(-|_|$)/i.test(v.lang));const pool=en.length?en:voices;const score=v=>{let s=0;const n=(v.name||"").toLowerCase();if(/natural/.test(n))s+=8;if(/neural/.test(n))s+=6;if(/online/.test(n))s+=4;if(/google/.test(n))s+=5;if(/(aria|jenny|guy|libby|sonia|michelle|ava|andrew|emma|clara|natasha)/.test(n))s+=5;if(/(samantha|allison|karen|serena|siri|nicky|aaron)/.test(n))s+=4;if(v.localService===false)s+=3;if(/en-us|en-gb/i.test(v.lang))s+=1;if(/(zira|david|mark|hazel|compact|espeak|eloquence)/.test(n))s-=5;return s};pool.sort((a,b)=>score(b)-score(a));preferredVoice=pool[0]||null}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.i);},at));});};}let advanced=false;const advance=()=>{if(advanced)return;advanced=true;if(watchdog)clearTimeout(watchdog);ci++;speakChunk();};u.onend=advance;u.onerror=advance;const estDur=Math.max(1200,chunk.text.length*110);const watchdog=setTimeout(advance,estDur+4000);speechSynthesis.speak(u);}setTimeout(speakChunk,70);}

function setStatus(m,ok){var el=document.getElementById("recStatus");if(el){el.textContent=m;el.style.color=ok?"#1f8f4d":"#b23b34";}}async function toggleRecording(){const btn=document.getElementById("recordPageBtn");if(recorder&&recorder.state==="recording"){recorder.stop();btn.textContent="🎙 Record";btn.classList.remove("recording");return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setStatus("Recording works only on the published website — the microphone is turned off in this preview.",false);return}if(typeof MediaRecorder==="undefined"){setStatus("This browser can't record audio. Try Chrome/Edge, or Safari 14+.",false);return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});let opts={};if(MediaRecorder.isTypeSupported){if(MediaRecorder.isTypeSupported("audio/webm"))opts={mimeType:"audio/webm"};else if(MediaRecorder.isTypeSupported("audio/mp4"))opts={mimeType:"audio/mp4"};}chunks=[];recorder=new MediaRecorder(stream,opts);recorder.ondataavailable=e=>{if(e.data&&e.data.size>0)chunks.push(e.data)};recorder.onstop=()=>{if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(new Blob(chunks,{type:(recorder.mimeType||"audio/webm")}));document.getElementById("playRecordingBtn").disabled=false;document.getElementById("deleteRecordingBtn").disabled=false;setStatus("Saved! Tap ▶ Play to hear your reading.",true);stream.getTracks().forEach(t=>t.stop())};recorder.start();btn.textContent="■ Stop";btn.classList.add("recording");setStatus("Recording… tap ■ Stop when you finish.",true)}catch(e){var n=(e&&e.name)?e.name:String(e);if(n==="NotAllowedError"||n==="SecurityError"){setStatus("Microphone blocked. In the chat preview the mic is always off — use the live website, then tap Allow (or click 🔒 in the address bar → allow Microphone → reload).",false);}else if(n==="NotFoundError"){setStatus("No microphone found on this device.",false);}else{setStatus("Could not record ("+n+"). Use the live website in Chrome/Edge/Safa
