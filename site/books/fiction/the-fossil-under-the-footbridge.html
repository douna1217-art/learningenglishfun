   Give such browsers a silent stand-in so the rest of the page runs normally. */
try{ok=typeof w.speechSynthesis==="object"&&w.speechSynthesis!==null}catch(e){}
if(typeof w.SpeechSynthesisUtterance!=="function"&&typeof w.SpeechSynthesisUtterance!=="object"){

w.speechSynthesis={speaking:false,paused:false,pending:false,
getVoices:function(){return[]},cancel:function(){gen++},pause:function(){},resume:function(){},
addEventListener:function(){},removeEventListener:function(){},
speak:function(u){var g=gen;
if(!told&&typeof w.setStatus==="function"){told=true;try{w.setStatus("This browser can't read aloud, but you can still read and practice. 当前浏览器不支持朗读，仍可阅读和做题。",false)}catch(e){}}

<script>

const pages=[{"type": "cover", "title": "The Fossil Under the Footbridge", "subtitle": "A Careful Look Can Protect What a Quick Grab Would Lose", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-fossil-under-the-footbridge-assets/cover.jpg"}, {"text": "1. The Creek Went Quiet\nAfter three days of rain, Willow Creek had settled into a narrow ribbon beneath the footbridge. Bea and Mateo walked with their nature club along the gravel path, carrying notebooks and pencils. Their teacher had asked them to record one detail they might have hurried past.\nBea noticed a flat gray stone beside the bridge's lowest beam. A fern-shaped line ran across it, with tiny ribs branching from a center stem. She leaned closer but kept her hands behind her back. The mark looked like a leaf pressed into the stone.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-fossil-under-the-footbridge-assets/page1.jpg"}, {"text": "2. A Leaf in Stone\nMateo studied the mark. “It could be a scratch,” he said. “The bridge crew might have dragged something over it.” Bea saw why he thought so. One edge was straight, almost like a cut. Still, the little ribs curved in different directions, just as the veins did on the fern above them.\nShe sketched what she could see and wrote the date. Mateo drew the bridge beam and the creek bend so they could find the spot again. Neither was sure what the stone held. Bea felt a tug to take it home, but she left it exactly where it was.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-fossil-under-the-footbridge-assets/page2.jpg"}, {"text": "3. Work on the Footbridge\nAt the trail entrance, a notice said the footbridge would close on Monday for repairs. Two boards had loosened, and the creek bank needed support. The crew planned to move several stones while they made the path safer.\nBea read the notice twice. She did not want anyone to cross a loose bridge, but she worried the crew might move the marked stone. “We should tell someone what we found,” she said. Mateo pointed to his sketch. “And show where it is, not just say it is by the bridge.”", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-fossil-under-the-footbridge-assets/page3.jpg"}, {"text": "4. Ask Before Acting\nThe next morning, they showed their notes to Ms. Lau, the trail ranger. She listened, then asked them to describe the mark without naming it. Bea explained the center stem and the fine lines. Mateo added the stone's shape and its position under the lowest beam.\n“Those details make it worth checking,” Ms. Lau said. “But we should not call it a fossil until someone with the right training has looked.” She took a photo with a ruler for scale and marked the location on a trail map. The stone stayed in the creek bank.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-fossil-under-the-footbridge-assets/page4.jpg"}, {"text": "5. More Than One Clue\nMs. Lau returned with a local geology volunteer, Mr. Reed. He compared the impression with photographs of plant fossils and examined the stone's thin layers. The branching lines and the way the mark sat within the rock were clues, he explained, but they did not reveal the exact plant.\n“It is likely a fossil impression,” Mr. Reed said. “A specialist could study it further.” Bea felt her excitement settle into something steadier. The stone was not a prize to carry away. It was a piece of a much longer story, still resting where the creek had left it.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-fossil-under-the-footbridge-assets/page5.jpg"}, {"text": "6. A Safer Way Around\nThe repair crew arrived on Monday. Ms. Lau showed the foreperson the photo and map before work began. They agreed to leave the small section of bank undisturbed while they replaced the bridge boards from the trail side. The crew set up a clear detour so walkers stayed away from the work area.\nBea watched from behind the safety barrier with her class. The bridge still needed its repair, and the stone still needed protection. She had thought those goals might compete. Instead, careful planning made room for both. Mateo added the detour to his sketch.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-fossil-under-the-footbridge-assets/page6.jpg"}, {"text": "7. The Stone Stays\nWhen the bridge reopened, the nature club returned to the creek. A small sign beside the path invited visitors to look closely and leave creek stones in place. Bea showed the class her drawing, the dated photo, and the map. She called the mark a likely plant fossil and explained which details supported that idea.\nSomeone asked if she wished she had taken the stone home. Bea looked through the railing at its quiet gray shape. “No,” she said. “Now more people can see it, and the creek can keep its story.” Mateo finished the club's record with a new note. The stone was still where they had found it.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-fossil-under-the-footbridge-assets/page7.jpg"}];

t of a story, so it needs “piece”.", "teach": "<b>Piece</b> means a part of something, but <b>peace</b> means calm and quiet.<span class='cn'><b>Piece</b> 指“一部分”，而 <b>peace</b> 指“平静、和平”，两个词读音相同。</span>"}, {"q": "Which sentence puts the comma in the right place?", "choices": ["The bridge still needed its repair, and the stone still needed protection.", "The bridge still needed its repair and, the stone still needed protection.", "The bridge still needed, its repair and the stone still needed protection."], "answer": 0, "evidencePage": 6, "hint": "Look at page 6.", "explain": "In a compound sentence, the comma goes before the joining word “and”.", "teach": "In a <b>compound sentence</b>, put a comma before the joining word like and, but, or so, like <b>It was small, but it was strong</b>.<span class='cn'>在<b>并列句</b>里，连接词 and、but、so 前面要加逗号，比如 <b>It was small, but it was strong</b>（它很小，但很结实）。</span>"}, {"q": "‘The mark looked like a leaf pressed into the stone.’ What two things does the writer compare?", "choices": ["The mark and a leaf pressed into stone", "The creek and a fern", "The stone and the bridge"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "The word “like” compares the mark to a leaf, which is a simile.", "teach": "A <b>simile</b> compares two different things using like or as, like <b>looked like a leaf pressed into stone</b>.<span class='cn'><b>明喻</b>用 like 或 as 把两种不同的东西作比较，比如 <b>looked like a leaf pressed into stone</b>（看起来像压在石头里的一片叶子）。</span>"}], "vocabulary": [{"q": "‘Impression’ means ___.", "choices": ["a loud sound in the creek", "a plan made in a hurry", "a mark made by pressing something into a surface"], "answer": 2, "evidencePage": 5, "hint": "Look at page 5.", "explain": "He compared the impression with photographs of plant fossils."}, {"q": "‘Specialist’ means ___.", "choices": ["someone who walks very fast", "a worker who paints signs", "a person with expert training in one subject"], "answer": 2, "evidencePage": 5,
