 16px;display:flex;align-items:center;gap:14px;box-shadow:0 14px 38px rgba(111,74,182,.24);border:1px solid rgba(255,255,255,.32)}.evidence-banner strong{text-shadow:0 1px 6px rgba(60,35,110,.35)}.evidence-banner span{font-size:.84rem;color:#fff}.evidence-banner button{border:0;border-radius:10px;padding:9px 12px;background:rgba(255,255,255,.92);color:var(--purple);font-weight:950;cursor:pointer}.footer{text-align:center;color:var(--muted);font-size:.8rem;padding:13px}

<script>

const pages=[{"type": "cover", "title": "The Archive of Borrowed Voices", "subtitle": "A Perfect Recording Forces One Apprentice to Decide Whether Preservation Can Become Theft", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-archive-of-borrowed-voices-assets/cover.jpg"}, {"text": "1. The Voice That Knew Her Name\nOn her first day as an archive apprentice, Anika polished a blue cylinder labeled only by a leaf-shaped token. When she lifted it to the listening horn, her late grandmother's voice spoke her name.\nThe sentence had never been recorded at home. Director Vale explained that the archive preserved voices at the instant a memory was in danger of disappearing. Tomas called it a miracle. Anika heard an intrusion.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-archive-of-borrowed-voices-assets/page1.jpg"}, {"text": "2. Preservation Without Permission\nDirector Vale said the archive collected only fragments needed by future generations. She showed them songs, eyewitness accounts, and endangered languages rescued from silence.\nAnika asked who had agreed to be collected. Vale pointed to leaf tokens that represented consent, but her grandmother's cylinder had none. The absence might be an error, or it might reveal a rule the archive preferred not to discuss.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-archive-of-borrowed-voices-assets/page2.jpg"}, {"text": "3. The Same Story in Two Voices\nTomas found two cylinders describing the harbor fire. One speaker praised the archive for saving her account. The other accused it of taking words spoken in grief and replaying them as public history.\nBoth accounts named the same flames and rescue boat, yet their tones changed the meaning of preservation. Anika realized that a voice contained more than information. It carried the speaker's relationship to being heard.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-archive-of-borrowed-voices-assets/page3.jpg"}, {"text": "4. A Door Behind the Shelves\nA pulsing sound led them behind a movable shelf. There, an automatic machine was creating new cylinders from conversations in the rooms above. It did not distinguish public speeches from private goodbyes.\nDirector Vale admitted the founder had built the collector during a century of disappearing records. She had kept it running because choosing what to lose felt more frightening than collecting too much.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-archive-of-borrowed-voices-assets/page4.jpg"}, {"text": "5. The Dangerous Perfect Copy\nAnika could not destroy her grandmother's cylinder. Hearing the voice again felt like opening a door she had missed. Yet keeping it meant accepting the same theft from strangers.\nTomas proposed locking every unapproved voice away. Anika answered that secrecy would preserve the archive's power without repairing the harm. Their choice had to include the people whose voices had become objects.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-archive-of-borrowed-voices-assets/page5.jpg"}, {"text": "6. Returning the Voices\nThey reversed the listening horns and sent each unapproved fragment to its speaker or family. Recipients could donate it, seal it, or let it dissolve. The archive lost thousands of cylinders in one night.\nDirector Vale watched dark spaces spread across the shelves. Then approved voices began returning with stories, context, and conditions attached. The collection became smaller but more trustworthy.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-archive-of-borrowed-voices-assets/page6.jpg"}, {"text": "7. The Silence With Meaning\nAnika's family sealed her grandmother's cylinder for private listening. At the public exhibit, its shelf remained empty except for a leaf token turned inward.\nVisitors sometimes asked what belonged there. Anika answered that the silence was part of the record. The archive had once treated every missing voice as a failure. Now it understood that absence could also mean a boundary, and that honoring a voice included respecting when it should not be heard.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-archive-of-borrowed-voices-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What surprised Anika when she played the blue cylinder?", "choices": ["It played a stranger's voice she didn't recognize", "Her late grandmother's voice spoke her name, a sentence never recorded at home", "The cylinder was completely silent"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "When Anika played the cylinder, her late grandmother's voice spoke her name — a sentence that had never actually been recorded at home."}, {"q": "What did the leaf tokens represent, and what was missing from the grandmother's cylinder?", "choices": ["A date; the cylinder had no recording date", "Consent; her grandmother's cylinder had no token showing she had agreed to be recorded", "Payment; the cylinder had not been paid for"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Leaf tokens represented consent to be collected, but Anika's grandmother's cylinder had none, raising a troubling question."}, {"q": "What did Tomas discover about the two cylinders describing the harbor fire?", "choices": ["One cylinder was blank while the other had sound", "The same events were described very differently — one grateful, one accusing the archive of taking words spoken in grief", "The two cylinders described completely different fires"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Both accounts named the same flames and rescue boat, yet their very different tones changed the meaning of what preservation meant to each speaker."}, {"q": "What did they find behind the movable shelf?", "choices": ["An automatic machine creating new cylinders from conversations, without distinguishing public from private", "A door leading directly outside the archive", "A hidden room full of empty shelves"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "They found a machine automatically recording all conversations in the rooms above, without any distinction between public speeches and private goodbyes."}, {"q": "What did Anika and Tomas do with the unapproved recordings?", "choices": ["Kept all of them exactly as they were", "Deleted every recording in the archive immediately", "Sent each unapproved fragment back to its speaker or family to decide its fate"], "answer": 2, "evidencePage": 6, "hint": "Look at page 6.", "explain": "They reversed the listening horns and returned each unapproved fragment to its speaker or family, who could donate, seal, or let it dissolve."}], "grammar": [{"q": "'The founder had built the collector ___ she knew it did not distinguish private from public conversations.' Which word shows contrast?", "choices": ["so", "because", "though"], "answer": 2, "evidencePage": 4, "hint": "This word shows a surprising contrast, similar to 'although.'", "explain": "'Though' shows contrast: the founder built the machine even though she knew its limits.", "teach": "<b>Though</b> shows a <b>contrast</b>, similar to <b>although</b>.<span class='cn'><b>though</b> 表示<b>转折</b>，和 <b>although</b> 类似。</span>"}, {"q": "Which sentence correctly uses 'whose' to show possession?", "choices": ["The archive included voices which speakers had never given consent.", "The archive included voices who's speakers had never given consent.", "The archive included voices whose speakers had never given consent."], "answer": 2, "evidencePage": 2, "hint": "'Whose' shows possession and can refer to people or things.", "explain": "'Whose' correctly shows that the speakers belonged to those voices, without needing consent.", "teach": "<b>Whose</b> shows <b>possession</b> and can refer to people or things.<span class='cn'><b>whose</b> 表示<b>所属关系</b>，可以指人或事物。</span>"}, {"q": "'Hearing the voice again felt like opening a door she had missed, ___ keeping it meant accepting the same theft from strangers.' Which word shows a surprising contrast?", "choices": ["yet", "and", "so"], "answer": 0, "evidencePage": 5, "hint": "This word shows a surprising contrast, similar to 'but.'", "explain": "'Yet' shows contrast: the voice felt precious to keep, but keeping it meant accepting an unfair practice.", "teach": "<b>Yet</b> shows a <b>surprising contrast</b>, similar to <b>but</b>.<span class='cn'><b>yet</b>表示令人意外的<b>转折</b>，和 <b>but</b> 类似。</span>"}], "vocabulary": [{"q": "'Preservation' means ___.", "choices": ["the act of keeping something safe from loss or damage", "the act of selling something valuable", "the act of destroying something old"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Director Vale explained that the archive's preservation captured voices at the instant a memory was in danger of disappearing."}, {"q": "'Consent' means ___.", "choices": ["a punishment given for breaking a rule", "permission given freely for something to happen", "a type of recording device"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Leaf tokens represented consent, but Anika's grandmother had never given permission to be recorded."}, {"q": "'Intrusion' means ___.", "choices": ["an unwanted entry into someone's private space", "a reward for good behavior", "a warm welcome into a group"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "While Tomas called the recording a miracle, Anika heard an intrusion — an unwanted entry into her grandmother's private words."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(preservation|consent|intrusion)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 6 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function saveProgress(){try{localStorage.setItem("les-the-archive-of-borrowed-voices-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-archive-of-borrowed-voices"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-archive-of-borrowed-voices",bookTitle:"The Archive of Borrowed Voices",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.
