<script>/*les-speech-shim*/

<script>

const pages=[{"type": "cover", "title": "The Spaceship in the Lost and Found", "subtitle": "A Student Reporter Finds a Tiny Captain in the Lost and Found and Learns How to Help Without Taking Over", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-spaceship-in-lost-property-assets/cover.jpg"}, {"text": "1. A Small Item for the School News\nMy first job for the school news was to list the things in lost and found. I had hoped to interview a visiting space captain. Earth had welcomed travelers from other worlds for years, but our school paper usually reported missing lunch boxes. Ms. Bell gave me a plastic crate and asked me not to describe every scarf as mysterious. I promised to use mysterious only when necessary.\nUnder a green mitten, I found a blue spacecraft no longer than my thumb. It had a clear cockpit and a tiny amber light. I put it beside my pencil and took a photograph. Then a voice from inside asked me to stop. I looked through the cockpit. A little figure in a green helmet was waving both arms. The voice asked whether I would kindly move my enormous face out of the sunlight.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-spaceship-in-lost-property-assets/page1.jpg"}, {"text": "2. Captain Nim\nHer name was Captain Nim. She was not a toy, a model, or an especially convincing school project. She had entered through a high open window because she thought the silver flagpole was a landing beacon. A cleaner had found her ship on a shelf and carried it to the office. Nim had spent the morning trying to make her speaker louder than the telephone.\nI asked whether I could interview her. She asked whether that was the human word for getting somebody out of a box. I said it was not exactly the same thing. She pointed to the amber light. A strand of wool had caught beneath a cover on the underside, preventing her from rising more than a finger's width. She needed room to open it. I reached for the ship. Nim told me to ask before lifting the floor she was standing on. I put my hand down.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-spaceship-in-lost-property-assets/page2.jpg"}, {"text": "3. A Landing Field Made of Paper\nMs. Bell came over when I called. I expected her to fetch the principal. Instead, she asked Nim where she wanted to be moved. Nim chose a flat sheet of card. Ms. Bell held it level beside the ship, and Nim used a low-powered glide to slide aboard. The card hardly stirred. I had been planning to pick her up between two fingers, like a dropped button.\nWe carried the card to a clear desk. Nim asked for a little block she could rest one edge of the ship on without tipping the cockpit sideways. Ms. Bell found a pencil eraser. I found another and held up both, pleased to have understood the scale of the problem. Nim chose the smaller one. I put the other away. For once, contributing less seemed to make the work go better.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-spaceship-in-lost-property-assets/page3.jpg"}, {"text": "4. The Photograph I Wanted\nFrom inside her cockpit, Nim guided a tool arm thinner than a pin beneath the hull and raised the cover. I could see the red thread, but I could not reach it safely. She asked me to keep my hands still. While she worked, two students paused outside the office. One saw the little blue shape and asked what I had found. My answer was ready, which was a stranded captain, a real ship, and the best story the paper had ever had.\nNim's helmet turned toward me. I remembered her trying to be heard over the telephone. If the whole school gathered, even a polite crowd would become a wall of hands and faces. I told the students I was helping Ms. Bell with lost and found. They went on. I wanted to call them back. Instead, I stayed beside the desk and stopped my sleeve from brushing the card.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-spaceship-in-lost-property-assets/page4.jpg"}, {"text": "5. The Thread on the Card\nWhen Nim freed the wool, it fell onto the card in a red curl. I had expected a flash or a burst of engines. She closed the cover, checked the light, and asked whether there was somewhere outside without feet passing through it. Ms. Bell suggested the courtyard bench. I offered to carry the card. Nim agreed, provided I kept it flat and warned her before turning.\nThe hallway felt much longer with a captain balanced on a sheet of card. At the corner, I stopped for a class to pass. I announced the turn in a voice so solemn that Ms. Bell smiled. Nim said she preferred a dull flight to an interesting accident. I had no answer for that. We reached the courtyard with the red thread still lying beside her ship. Nothing dramatic had happened. I was unexpectedly proud of the journey.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-spaceship-in-lost-property-assets/page5.jpg"}, {"text": "6. A Captain at Work\nWe set the card on the bench. Sunlight caught the blue hull. Nim asked whether I still wanted the interview. I said I did, but only after she checked her ship. She said that was a reasonable order. I asked why she had come to Earth. She was delivering a replacement lens to an observatory, not exploring unknown worlds or chasing space pirates. She was already late.\nI asked about the photograph. Nim said I could keep the picture of the ship, but she did not want her face printed. I showed her the image by resting my phone flat beside the card. She examined it and agreed. The picture contained a pencil, a blue oval, and one amber light. It would not make anybody look heroic. It did show how small a real spacecraft could be beside something I had stopped noticing.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-spaceship-in-lost-property-assets/page6.jpg"}, {"text": "7. What I Put in the Paper\nNim lifted a few inches above the card, waited for a clear space, and rose past the courtyard wall. I watched until the amber light became too small to follow. Ms. Bell picked up the card. The red thread was still there. She asked whether I wanted it for the paper. I said I had better ask whose scarf it belonged to before calling it a souvenir.\nMy article included Nim's ordinary delivery and the mistake about the flagpole. I left out her face, as promised. I also wrote that Ms. Bell had asked where she wanted to be moved. That was the part I kept remembering while I finished the list of lunch boxes. The next week, the paper's editor asked whether I wanted another small assignment. I said yes. Then I asked what kind of small he meant.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-spaceship-in-lost-property-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did the narrator find in the lost and found?", "choices": ["A lost lunch box", "A blue spacecraft as small as a thumb, with a tiny captain inside", "A toy robot"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Under a green mitten was a blue spacecraft no longer than the narrator’s thumb."}, {"q": "Why could Captain Nim not take off?", "choices": ["A strand of wool was caught beneath a cover on the underside of her ship", "Her ship had run out of fuel", "The window was closed"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "A strand of wool had caught beneath a cover, preventing her from rising."}, {"q": "What did Ms. Bell do when the narrator called her?", "choices": ["She took a photograph", "She took the ship to the principal", "She asked Nim where she wanted to be moved and held a card level for her"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Ms. Bell asked Nim where she wanted to be moved and held the card level."}, {"q": "Why did the narrator not tell the other students?", "choices": ["The narrator forgot the story", "A crowd would have become a wall of hands and faces for Nim", "Ms. Bell had said not to"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Even a polite crowd would become a wall of hands and faces."}, {"q": "Why had Nim come to Earth?", "choices": ["To explore a new world", "To chase space pirates", "To deliver a replacement lens to an observatory, and she was already late"], "answer": 2, "evidencePage": 6, "hint": "Look at page 6.", "explain": "She was delivering a replacement lens to an observatory and was already late."}], "grammar": [{"q": "Which phrase means the width of one finger?", "choices": ["a finger’s width", "a fingers width", "a fingers’ width"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "An apostrophe before the s shows the width belongs to one finger.", "teach": "An apostrophe before the <b>s</b> shows one owner, like <b>a finger’s width</b>, and after the <b>s</b> shows more than one.<span class='cn'>撇号在 <b>s</b> 前表示一个所有者，比如 <b>a finger’s width</b>；撇号在 <b>s</b> 后表示多个所有者。</span>"}, {"q": "The Greek roots ‘tele’ means ‘far’ and ‘phone’ means ‘sound’. What does ‘telephone’ literally mean?", "choices": ["A kind of light", "Sound from far away", "A small spaceship"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Tele means far and phone means sound, so a telephone carries sound from far away.", "teach": "The Greek roots <b>tele</b>, far, and <b>phone</b>, sound, join to make <b>telephone</b>, sound from far away.<span class='cn'>希腊词根 <b>tele</b> 表示“远”，<b>phone</b> 表示“声音”，合起来 <b>telephone</b> 就是远处传来的声音。</span>"}, {"q": "Nim asked the narrator to ‘kindly move my enormous face out of the sunlight.’ Whose point of view makes the face enormous?", "choices": ["Ms. Bell’s", "Nim’s, because she is tiny", "The principal’s"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "To a captain who fits in a ship the size of a thumb, a human face looks huge.", "teach": "<b>Point of view</b> is who is seeing something, and to tiny Nim a human face looks <b>enormous</b>.<span class='cn'><b>视角</b>指是谁在看，对小小的 Nim 来说，人的脸看起来 <b>enormous</b>（巨大）。</span>"}], "vocabulary": [{"q": "‘Stranded’ means ___.", "choices": ["stuck in a place and unable to leave", "very tired", "happily at home"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "My answer was ready, which was a stranded captain, a real ship, and the best story the paper had ever had."}, {"q": "‘Scale’ means ___.", "choices": ["the size of something compared to other things", "a kind of fish", "a heavy rock"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "I was pleased to have understood the scale of the problem."}, {"q": "‘Souvenir’ means ___.", "choices": ["a kind of lunch box", "a loud noise", "something kept to remember a place or event"], "answer": 2, "evidencePage": 7, "hint": "Look at page 7.", "explain": "I had better ask whose scarf it belonged to before calling it a souvenir."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(stranded|scale|souvenir)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 6 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}
function selectAnswer(i){selections[activeTab+"-"+qIndex[activeTab]]=i;renderPanel()}
function showHint(){const item=quizzes[activeTab][qIndex[activeTab]];document.getElementById("feedback").innerHTML=`💡 ${item.hint}`}
function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}var TEACH_ICONS='<svg class="ic i-spk" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.5v5h3.6l4.9 4.5V5L7.6 9.5H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.6 9.2a4 4 0 010 5.6M18.2 6.6a7.6 7.6 0 010 10.8"/></svg><svg class="ic i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></svg><svg class="ic i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 5.3v13.4c0 .8.9 1.3 1.6.8l9.6-6.7c.6-.4.6-1.2 0-1.6L9.8 4.5c-.7-.5-1.6 0-1.6.8z"/></svg>';var _tp=null;function _tpSet(b,st){if(!b)return;b.classList.toggle('is-playing',st==='playing');b.classList.toggle('is-paused',st==='paused');b.setAttribute('aria-pressed',st==='playing'?'true':'false');var z=b.dataset.part==='cn',L=st==='playing'?(z?'\u6682\u505C':'Pause'):st==='paused'?(z?'\u7EE7\u7EED\u64AD\u653E':'Resume'):b.dataset.label;b.setAttribute('aria-label',L);b.title=L;}function stopTeachAudio(){var c=_tp;if(!c)return;_tp=null;try{if(c.audio){c.audio.onended=c.audio.onerror=c.audio.ontimeupdate=null;c.audio.pause();}}catch(e){}if(c.mode==='tts'){try{speechSynthesis.cancel();}catch(e){}}_tpSet(c.btn,'idle');}function _tpFallback(btn){try{var u=new SpeechSynthesisUtterance(btn.dataset.text||'');u.lang=btn.dataset.lang||'en-US';var cur={btn:btn,mode:'tts'};_tp=cur;u.onend=u.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');}};_tpSet(btn,'playing');speechSynthesis.speak(u);}catch(e){}}function playTeachAudio(btn){if(_tp&&_tp.btn===btn){if(_tp.mode==='audio'){var a0=_tp.audio;if(a0.paused){var p0=a0.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}
function returnToQuestion(){(function(){var b=document.getElementById("evidenceBanner");if(b&&b.parentNode)b.parentNode.removeChild(b);})();renderPanel();document.querySelector(".panel").scrollIntoView({behavior:"smooth",block:"start"})}
function nextQuestion(){const list=quizzes[activeTab];if(qIndex[activeTab]<list.length-1){qIndex[activeTab]++;renderPanel();return}completed[activeTab]=true;if(activeTab==="comprehension")activeTab="grammar";else if(activeTab==="grammar")activeTab="vocabulary";else{return showCompletion()}setTabs();renderPanel()}
function showCompletion(){completed.vocabulary=true;setTabs();const correct=Object.keys(selections).filter(k=>{const [tab,idx]=k.split('-');return selections[k]===quizzes[tab][+idx].answer}).length,total=Object.values(quizzes).reduce((a,b)=>a+b.length,0);document.getElementById("stagePill").textContent="Journey Complete";document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">Reading journey complete</div><h2>Wonderful work! 🎉</h2><p class="small">You finished Reading, Grammar, and Vocabulary.</p><div class="score-row"><div class="score-box"><b>${total}</b><br><span>Questions</span></div><div class="score-box"><b>${correct}</b><br><span>Correct now</span></div></div><div class="feedback good">You used evidence, practiced sentence skills, and learned new words.</div><button class="submit" onclick="restartPractice()">Practice Again</button></div>`}
function restartPractice(){activeTab="comprehension";qIndex={comprehension:0,grammar:0,vocabulary:0};selections={};attempts={};completed={comprehension:false,grammar:false,vocabulary:false};setTabs();renderPanel()}
function saveProgress(){try{localStorage.setItem("les-the-spaceship-in-lost-property-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-spaceship-in-lost-property"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-spaceship-in-lost-property",bookTitle:"The Spaceship in the Lost and Found",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}
function clearHighlight(){document.querySelectorAll(".story-word.reading").forEach(x=>x.classList.remove("reading"))}
let preferredVoice=null;
