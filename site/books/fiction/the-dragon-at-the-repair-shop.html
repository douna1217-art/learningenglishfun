<script>/*les-speech-shim*/
(function(){var w=window,ok=false,errs=[];
/* Some Android in-app browsers (UC/Quark and other vendor kernels, older WebViews) have no
   speechSynthesis at all. The page script calls it while loading, so it stopped there and the
   story was never drawn (the quiz still worked because its handlers were bound earlier).
   Give such browsers a silent stand-in so the rest of the page runs normally. */
try{ok=typeof w.speechSynthesis==="object"&&w.speechSynthesis!==null}catch(e){}
if(typeof w.SpeechSynthesisUtterance!=="function"&&typeof w.SpeechSynthesisUtterance!=="object"){
w.SpeechSynthesisUtterance=function(t){this.text=t==null?"":String(t);this.lang="";this.rate=1;this.pitch=1;this.volume=1;this.voice=null}}
if(!ok){var gen=0,told=false;
w.speechSynthesis={speaking:false,paused:false,pending:false,
getVoices:function(){return[]},cancel:function(){gen++},pause:function(){},resume:function(){},
addEventListener:function(){},removeEventListener:function(){},
speak:function(u){var g=gen;
if(!told&&typeof w.setStatus==="function"){told=true;try{w.setStatus("This browser can't read aloud, but you can still read and practice. 当前浏览器不支持朗读，仍可阅读和做题。",false)}catch(e){}}
setTimeout(function(){if(g===gen&&u&&u.onstart){try{u.onstart({})}catch(e){}}},0);
setTimeout(function(){if(g===gen&&u&&u.onend){try{u.onend({})}catch(e){}}},Math.max(600,String(u&&u.text||"").length*60))}}}
/* If the story still is not drawn after loading, say why on the page itself, so a screenshot
   from a phone we cannot test on shows the cause. */
w.addEventListener("error",function(e){try{if(errs.length<3)errs.push(String(e&&e.message||e))}catch(x){}});
w.addEventListener("load",function(){try{var v=document.getElementById("pageView");
if(v&&!v.firstChild&&errs.length){var d=document.createElement("div"),s=document.createElement("small");
d.style.cssText="padding:24px;color:#b91c1c;font:15px/1.6 sans-serif";
d.appendChild(document.createTextNode("The story could not be shown in this browser. 此浏览器暂时无法显示故事。"));
d.appendChild(document.createElement("br"));s.textContent=errs.join(" | ");d.appendChild(s);v.appendChild(d)}}catch(x){}});
})();
</script>
<script>

const pages=[{"type": "cover", "title": "The Dragon at the Repair Shop", "subtitle": "A Dragon Brings a Faded Toy Boat, and a Young Craftsman Learns What Is Worth Keeping", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-dragon-at-the-repair-shop-assets/cover.jpg"}, {"text": "1. A Customer at the Door\nWhen a dragon's shadow crossed the workshop window, Tavi put down the chair leg he was polishing. Perhaps the customer needed a new saddle, or a latch for an enormous treasure chest. Instead, Brindle lowered a linen bundle onto the bench. Inside lay a toy sailing boat. Its blue paint had faded, its red sail sagged, and the mast had snapped near the deck. A little yellow star remained near the bow.\n“Can you make it sail again?” the dragon asked. Tavi's mother, Ada, examined the boat without lifting it by the mast. Tavi imagined a better one already. He could add a silver cabin and a handsome curved prow. The spring craft show was next week, and a dragon's boat would certainly draw attention to his work.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-dragon-at-the-repair-shop-assets/page1.jpg"}, {"text": "2. The Better Boat\nWhile Ada checked the underside, Tavi sketched his idea. A wider hull would make room for the cabin. Fresh paint could hide the old scratches. He turned the drawing toward Brindle. “We could build this instead. It would be much grander.” The dragon looked politely at the silver roof, then back at the little star on the old boat. “I can see that,” he said. “But it wouldn't be this one.”\nTavi's pencil stopped. Nell, Brindle explained, had made the boat when she was a child. She had sailed it across a duck pond while he watched from the bank, before his wings were strong enough to carry him. Nell was a grandmother now. Every spring, they still met at the pond. This year, he wanted to bring their boat.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-dragon-at-the-repair-shop-assets/page2.jpg"}, {"text": "3. What Could Not Stay\nAda found a split in the thin bottom board. Part of the wood had softened. She could replace that board and fit a new mast, but she couldn't make the old bottom strong simply by painting over it. Brindle's tail curled around his feet. “Would there be much left of Nell's boat?” he asked. Tavi understood the question better now. His new design lay facedown beside the bench.\nAda pointed out what could remain, namely the sides, the deck, the cloth sail, and the star. Then she explained what the repair would change. She didn't promise that nothing would look different. Brindle asked for a moment. Tavi went back to polishing the chair leg, although he kept glancing toward the small boat. The dragon considered it as carefully as if it really were a treasure chest.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-dragon-at-the-repair-shop-assets/page3.jpg"}, {"text": "4. The Part Worth Keeping\n“Nell will notice the new wood,” Brindle said at last. “We used to count every scratch.” Ada nodded. Tavi wondered whether that meant they should leave the boat alone. A shelf would be safer than a pond. Then the dragon touched the folded sail with the edge of one claw. “But she asked if we could sail it again. Not just look at it.”\nThey agreed to keep every sound part and replace what could no longer do its job. Tavi asked whether Brindle wanted the new bottom painted to match. The dragon shook his head. He wanted to be able to show Nell exactly what had changed. Tavi turned over his drawing. In a blank corner, he sketched a plain new board beneath the familiar blue sides.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-dragon-at-the-repair-shop-assets/page4.jpg"}, {"text": "5. Work That Could Be Seen\nAda did the cutting and fitting. Tavi helped hold the boat steady and smoothed the new mast after she checked it. They left the blue paint alone. Up close, Tavi could see where a small hand had painted the star more than once, trying to make its points match. He had planned to cover it with a neat brass shape. Now he cleaned around it carefully.\nThe repair took several days. Between waiting for parts to set, Tavi worked on his own new boat for the craft show. He still liked the silver cabin. Brindle visited once and admired it. That surprised Tavi. The dragon wasn't against new things. He had simply brought an old thing for a different reason. On the last afternoon, Ada prepared a wide basin for the test.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-dragon-at-the-repair-shop-assets/page5.jpg"}, {"text": "6. A Familiar Lean\nBrindle arrived before they filled the basin. He watched Ada lower the boat into the water. It floated, but leaned slightly to one side. Tavi reached forward, then stopped. The old cloth sail had settled awkwardly against the mast. With Ada's help, he adjusted it. When she tested the boat again, it rested more evenly. Brindle bent his long neck until his nose hovered above the red sail.\n“That's how it looked,” he said. “Except there used to be a duck chasing it.” Tavi laughed. He asked if Nell would mind the pale new wood underneath. Brindle studied the boat as it moved across the basin. “She might wish the old wood had lasted. I do too. But I think she'll be glad we can use it.”", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-dragon-at-the-repair-shop-assets/page6.jpg"}, {"text": "7. Two Kinds of Work\nBefore Brindle left, Tavi wrapped the boat in clean linen. He included the old bottom board in a separate bundle, because the dragon had asked to keep it. There would be room for both at the pond, the part that could no longer sail and the boat that could. Brindle carried them away without once mentioning the craft show. Tavi found that he didn't mind.\nOn the day of the show, his silver-cabin boat stood on a shelf in the workshop window. Beside it, with Brindle's permission, he placed a sketch of the blue boat's repair. A visitor asked which design he had made. Tavi showed her the silver cabin first. Then he explained the new bottom board. The second explanation took longer. He had learned enough to know why.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-dragon-at-the-repair-shop-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did Brindle bring to the workshop?", "choices": ["An enormous treasure chest", "A faded toy sailing boat with a snapped mast", "A broken saddle"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Inside the linen bundle lay a toy sailing boat with faded paint and a snapped mast."}, {"q": "Why did Brindle say a grander boat would not do?", "choices": ["It would not be Nell’s boat, the one she made as a child", "He did not like silver", "He wanted a smaller boat"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "He said, “But it wouldn’t be this one.” Nell had made the boat when she was a child."}, {"q": "What problem did Ada find with the old boat?", "choices": ["A split and softened wood in the thin bottom board", "A hole in the red sail", "A missing yellow star"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Ada found a split in the thin bottom board, and part of the wood had softened."}, {"q": "Why did Brindle choose to repair the boat instead of keeping it on a shelf?", "choices": ["The craft show was next week", "Nell had asked whether they could sail it again, not just look at it", "The boat was too heavy for a shelf"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "He said, “But she asked if we could sail it again. Not just look at it.”"}, {"q": "What did Tavi place beside his own silver-cabin boat at the craft show?", "choices": ["The old bottom board", "A sketch of the blue boat’s repair", "A picture of the pond"], "answer": 1, "evidencePage": 7, "hint": "Look at the last page.", "explain": "Beside his boat, Tavi placed a sketch of the blue boat’s repair."}], "grammar": [{"q": "Which sentence uses commas in a series correctly?", "choices": ["Ada kept, the sides, the deck the cloth sail, and the star.", "Ada kept the sides the deck, the cloth sail and, the star.", "Ada kept the sides, the deck, the cloth sail, and the star."], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Put a comma after each item in a series, except the last one.", "teach": "In a series of items, put a comma after each item except the last, like <b>the sides, the deck, and the star</b>.<span class='cn'>列举多个事物时，每一项后面加逗号，最后一项除外，比如 <b>the sides, the deck, and the star</b>。</span>"}, {"q": "‘The dragon considered it as carefully as if it really were a treasure chest.’ What does this show about Brindle?", "choices": ["He was afraid of the boat", "He thought the boat was full of gold", "He treated the little boat as something very valuable"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Comparing the boat to a treasure chest shows how much it mattered to him.", "teach": "<b>Figurative language</b> compares one thing to another to show how someone feels, like <b>as carefully as if it were a treasure chest</b>.<span class='cn'><b>比喻性语言</b>通过比较来表现人物的感受，比如 <b>as carefully as if it were a treasure chest</b>（像对待宝箱一样小心）。</span>"}, {"q": "‘Ada could replace that board and fit a new mast.’ What does the prefix ‘re-’ mean in ‘replace’?", "choices": ["again", "not", "before"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "The prefix “re-” means again, so replace means to put something in again.", "teach": "The prefix <b>re</b> means again, like <b>replace</b> and <b>rebuild</b>.<span class='cn'>前缀 <b>re</b> 表示“再次”，比如 <b>replace</b>（替换）和 <b>rebuild</b>（重建）。</span>"}], "vocabulary": [{"q": "‘Hull’ means ___.", "choices": ["the main body of a boat", "a rope tied to a pole", "the cloth that catches the wind"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "A wider hull would make room for the cabin."}, {"q": "‘Sound’ means ___ in the phrase ‘every sound part’.", "choices": ["very old", "in good condition", "making a noise"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "They agreed to keep every sound part and replace what could no longer do its job."}, {"q": "‘Awkwardly’ means ___.", "choices": ["in a bright and cheerful way", "very quickly", "in a clumsy way that does not fit well"], "answer": 2, "evidencePage": 6, "hint": "Look at page 6.", "explain": "The old cloth sail had settled awkwardly against the mast."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(hull|sound|awkwardly)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 5 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();setListenActive(null);page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}
function selectAnswer(i){selections[activeTab+"-"+qIndex[activeTab]]=i;renderPanel()}
function showHint(){const item=quizzes[activeTab][qIndex[activeTab]];document.getElementById("feedback").innerHTML=`💡 ${item.hint}`}
function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}var TEACH_ICONS='<svg class="ic i-spk" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.5v5h3.6l4.9 4.5V5L7.6 9.5H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.6 9.2a4 4 0 010 5.6M18.2 6.6a7.6 7.6 0 010 10.8"/></svg><svg class="ic i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></svg><svg class="ic i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 5.3v13.4c0 .8.9 1.3 1.6.8l9.6-6.7c.6-.4.6-1.2 0-1.6L9.8 4.5c-.7-.5-1.6 0-1.6.8z"/></svg>';var _tp=null;function _tpSet(b,st){if(!b)return;b.classList.toggle('is-playing',st==='playing');b.classList.toggle('is-paused',st==='paused');b.setAttribute('aria-pressed',st==='playing'?'true':'false');var z=b.dataset.part==='cn',L=st==='playing'?(z?'\u6682\u505C':'Pause'):st==='paused'?(z?'\u7EE7\u7EED\u64AD\u653E':'Resume'):b.dataset.label;b.setAttribute('aria-label',L);b.title=L;}function stopTeachAudio(){var c=_tp;if(!c)return;_tp=null;try{if(c.audio){c.audio.onended=c.audio.onerror=c.audio.ontimeupdate=null;c.audio.pause();}}catch(e){}if(c.mode==='tts'){try{speechSynthesis.cancel();}catch(e){}}_tpSet(c.btn,'idle');}function _tpFallback(btn){try{var u=new SpeechSynthesisUtterance(btn.dataset.text||'');u.lang=btn.dataset.lang||'en-US';var cur={btn:btn,mode:'tts'};_tp=cur;u.onend=u.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');}};_tpSet(btn,'playing');speechSynthesis.speak(u);}catch(e){}}function playTeachAudio(btn){if(_tp&&_tp.btn===btn){if(_tp.mode==='audio'){var a0=_tp.audio;if(a0.paused){var p0=a0.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}
function returnToQuestion(){(function(){var b=document.getElementById("evidenceBanner");if(b&&b.parentNode)b.parentNode.removeChild(b);})();renderPanel();document.querySelector(".panel").scrollIntoView({behavior:"smooth",block:"start"})}
function nextQuestion(){const list=quizzes[activeTab];if(qIndex[activeTab]<list.length-1){qIndex[activeTab]++;renderPanel();return}completed[activeTab]=true;if(activeTab==="comprehension")activeTab="grammar";else if(activeTab==="grammar")activeTab="vocabulary";else{return showCompletion()}setTabs();renderPanel()}
function showCompletion(){completed.vocabulary=true;setTabs();const correct=Object.keys(selections).filter(k=>{const [tab,idx]=k.split('-');return selections[k]===quizzes[tab][+idx].answer}).length,total=Object.values(quizzes).reduce((a,b)=>a+b.length,0);document.getElementById("stagePill").textContent="Journey Complete";document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">Reading journey complete</div><h2>Wonderful work! 🎉</h2><p class="small">You finished Reading, Grammar, and Vocabulary.</p><div class="score-row"><div class="score-box"><b>${total}</b><br><span>Questions</span></div><div class="score-box"><b>${correct}</b><br><span>Correct now</span></div></div><div class="feedback good">You used evidence, practiced sentence skills, and learned new words.</div><button class="submit" onclick="restartPractice()">Practice Again</button></div>`}
function restartPractice(){activeTab="comprehension";qIndex={comprehension:0,grammar:0,vocabulary:0};selections={};attempts={};completed={comprehension:false,grammar:false,vocabulary:false};setTabs();renderPanel()}
function saveProgress(){try{localStorage.setItem("les-the-dragon-at-the-repair-shop-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-dragon-at-the-repair-shop"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-dragon-at-the-repair-shop",bookTitle:"The Dragon at the Repair Shop",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}
function clearHighlight(){document.querySelectorAll(".story-word.reading").forEach(x=>x.classList.remove("reading"))}
let preferredVoice=null;
