<script>

const pages=[{"type": "cover", "title": "The Giant Who Borrowed a Whisper", "subtitle": "A Giant Borrows a Whisper to Hear a Silver Moth, and Must Give It Back When the Sheep Need Him", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-giant-who-borrowed-a-whisper-assets/cover.jpg"}, {"text": "1. A Voice Too Large\nWhen Orrin said good morning, three pears fell out of the orchard. He caught two in his hands. The third landed in his pocket, which pleased him until he sat down. Lark heard the squashing sound from the other side of the hedge. She found the giant standing very still, looking offended by his own pants. He had been trying to greet a silver singing moth. It had left before he finished the first word.\nSilver moths visited the orchard at dusk and sang so softly that most people mistook them for leaves rubbing together. Orrin had never heard a whole song. He wanted to welcome one without shaking the branch. Lark suggested saying nothing. Orrin considered this, but he had prepared a very polite greeting. It seemed a waste not to use it.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-giant-who-borrowed-a-whisper-assets/page1.jpg"}, {"text": "2. The Walnut Agreement\nLark's grandmother had taught her how to lend a whisper. It was a small sort of magic, useful for speaking across a crowded room or asking a shy mouse to move out of a cupboard. Lark found an empty walnut shell, breathed a whisper into it, and closed the two halves. She explained the rule carefully. While Orrin carried her whisper, his own voice would wait inside the shell. Opening it would return both voices to their owners.\nOrrin asked whether he might keep it until the moth finished singing. Lark agreed, provided he returned it before dark. He took the walnut between finger and thumb as gently as if it were an egg. When he thanked her, his words were no louder than a blade of grass brushing a boot. He thanked her again, simply to hear it happen.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-giant-who-borrowed-a-whisper-assets/page2.jpg"}, {"text": "3. The Smallest Song\nAt dusk they sat beneath the pear tree. Orrin waited with the walnut resting in one huge palm. Lark listened to the orchard settle. A beetle ticked against the bark. Far away, a gate latch clicked. Then the silver moth arrived on a thin twig beside Orrin's nose. He whispered his greeting. The moth folded its wings and stayed. Orrin's smile opened slowly, as though he was afraid to disturb it.\nThe song was nothing like the village musicians. It rose a little, paused, and began again in a different place. Orrin leaned closer. Lark could see him forgetting the polite speech he had prepared. He seemed to be counting the pauses. Beyond the hedge, a thin white line of mist gathered over the meadow. Neither of them noticed it until the pear leaves began to disappear at the edges.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-giant-who-borrowed-a-whisper-assets/page3.jpg"}, {"text": "4. The Bell Beyond the Hedge\nA sheep bell rang beyond the orchard. Then it rang again, farther from the gate. The village flock was supposed to come in before the evening mist covered the meadow. Their shepherd, Nessa, appeared at the open gate carrying her lantern. She could hear the sheep but could no longer see them. She called, and the mist seemed to swallow her voice. Orrin stood up, keeping his hand clear of the moth's branch.\nUsually his call reached the far end of the meadow. He tried it now. Only Lark's borrowed whisper came out. Nessa shook her head because she had heard nothing. Orrin looked down at the walnut. Beside him the moth began another verse. It had taken him years to hear this much. If he opened the shell, his first loud word might send it flying.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-giant-who-borrowed-a-whisper-assets/page4.jpg"}, {"text": "5. One More Verse\nOrrin asked whether they could wait one more verse. Lark wanted to say yes. She had watched his face when the song began. But another bell sounded, faint and uncertain, and Nessa lifted her lantern higher. The flock knew Orrin's voice. Lark could not replace it by shouting harder. She told him that she needed her whisper back now. Then she waited without reaching for the shell.\nThe giant closed his fingers around it. For a moment Lark thought he would put it in his pocket. Instead, he looked at the moth and bowed his enormous head. He whispered that he had enjoyed the song. The moth shifted its wings. It could not promise to return, and it did not seem to understand why he wanted such a promise. Orrin knelt beside Lark and held out the walnut.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-giant-who-borrowed-a-whisper-assets/page5.jpg"}, {"text": "6. The Call Across the Meadow\nLark opened the shell. Her whisper slipped back into her throat with the feeling of a cool sip of water. Orrin took a breath and called the flock. Pear leaves trembled. The moth lifted from its twig and vanished into the dim air. Lark kept looking at the empty branch until the first sheep emerged through the mist. Nessa stepped aside, holding the gate wide and the lantern steady.\nThe sheep followed Orrin's call along the familiar grass path. He waited between calls, listening for the bells. When the last sheep passed through, Nessa closed the gate and counted the flock. Every one was there. Orrin sat down outside the fence. Lark placed the empty walnut halves beside him. She could have told him he had done the right thing, but he was still watching the tree. She sat with him instead.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-giant-who-borrowed-a-whisper-assets/page6.jpg"}, {"text": "7. The Part He Could Keep\nNext evening Orrin returned to the pear tree without asking for another whisper. He set a pear beside Lark and lowered himself onto the grass. They waited. The orchard offered them beetle clicks, leaf rustles, and a distant dog that sounded deeply annoyed about something. No silver moth came. Orrin admitted that he had hoped doing a useful thing would somehow earn him the rest of the song.\nLark said she had hoped that too. They ate their pears. After a while Orrin tapped one enormous finger against his knee, very lightly. Lark recognized the spaces between the taps. He had remembered the part he heard. She joined in by brushing a leaf against her sleeve. Their little tune was uneven, and the ending was missing. Orrin did not speak over it. He leaned closer so he could listen.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-giant-who-borrowed-a-whisper-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "Why did Orrin want to greet the silver moth quietly?", "choices": ["Lark told him not to speak", "His loud voice would shake the branch and frighten it away", "The moth was asleep"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "He wanted to welcome a moth without shaking the branch, and his greeting had scared one off."}, {"q": "How did Lark lend Orrin a whisper?", "choices": ["She breathed a whisper into a walnut shell and closed it", "She taught him a song", "She tied a ribbon around his neck"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "She breathed a whisper into an empty walnut shell, and his own voice waited inside it."}, {"q": "What happened when Orrin whispered to the moth?", "choices": ["It began to bite", "It flew away", "It folded its wings and stayed"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "He whispered his greeting, and the moth folded its wings and stayed."}, {"q": "Why did Orrin need his own voice back?", "choices": ["To thank Lark", "To call the sheep home through the mist, which only his own voice could do", "To sing louder than the moth"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "The flock knew Orrin’s voice, and his borrowed whisper could not reach Nessa or the sheep."}, {"q": "What did the sheep follow through the mist?", "choices": ["The song of the moth", "Orrin’s call along the familiar grass path", "Nessa’s lantern only"], "answer": 1, "evidencePage": 6, "hint": "Look at page 6.", "explain": "The sheep followed Orrin’s call along the familiar grass path."}], "grammar": [{"q": "‘Lark agreed, ___ he returned it before dark.’ Which word shows a condition?", "choices": ["provided", "while", "although"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "The word “provided” means on the condition that.", "teach": "The word <b>provided</b> means on the condition that, like <b>I will go, provided it is sunny</b>.<span class='cn'><b>provided</b> 表示“在……的条件下”，比如 <b>I will go, provided it is sunny</b>（只要天晴我就去）。</span>"}, {"q": "‘His words were no louder than a blade of grass brushing a boot.’ What does this comparison show?", "choices": ["How very quiet his voice was", "How fast he spoke", "How angry he was"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "The sound of grass brushing a boot is almost silent, so his voice was extremely quiet.", "teach": "A <b>comparison</b> can show how much of something there is, like <b>no louder than grass brushing a boot</b> for a very quiet sound.<span class='cn'><b>比喻</b>可以表现程度，比如 <b>no louder than grass brushing a boot</b>（不比青草擦过靴子的声音更响）表示声音极轻。</span>"}, {"q": "‘Lark and Orrin ___ their pears.’ Which verb shows what happened last evening?", "choices": ["eat", "eated", "ate"], "answer": 2, "evidencePage": 7, "hint": "Look at the last page.", "explain": "The past tense of “eat” is “ate”.", "teach": "Some verbs change their spelling in the past tense, like <b>eat</b> and <b>ate</b>.<span class='cn'>有些动词的过去式拼写会整个变化，比如 <b>eat</b> 变成 <b>ate</b>（吃）。</span>"}], "vocabulary": [{"q": "‘Greeting’ means ___.", "choices": ["a loud warning", "a song for the evening", "a friendly word or sign when meeting someone"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "He had prepared a very polite greeting."}, {"q": "‘Provided’ means ___.", "choices": ["on the condition that", "even though", "as soon as"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Lark agreed, provided he returned it before dark."}, {"q": "‘Vanished’ means ___.", "choices": ["arrived slowly", "disappeared suddenly", "grew larger"], "answer": 1, "evidencePage": 6, "hint": "Look at page 6.", "explain": "The moth lifted from its twig and vanished into the dim air."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(greeting|provided|vanished)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 5 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();setListenActive(null);page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}
function selectAnswer(i){selections[activeTab+"-"+qIndex[activeTab]]=i;renderPanel()}
function showHint(){const item=quizzes[activeTab][qIndex[activeTab]];document.getElementById("feedback").innerHTML=`💡 ${item.hint}`}
function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}var TEACH_ICONS='<svg class="ic i-spk" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.5v5h3.6l4.9 4.5V5L7.6 9.5H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.6 9.2a4 4 0 010 5.6M18.2 6.6a7.6 7.6 0 010 10.8"/></svg><svg class="ic i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></svg><svg class="ic i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 5.3v13.4c0 .8.9 1.3 1.6.8l9.6-6.7c.6-.4.6-1.2 0-1.6L9.8 4.5c-.7-.5-1.6 0-1.6.8z"/></svg>';var _tp=null;function _tpSet(b,st){if(!b)return;b.classList.toggle('is-playing',st==='playing');b.classList.toggle('is-paused',st==='paused');b.setAttribute('aria-pressed',st==='playing'?'true':'false');var z=b.dataset.part==='cn',L=st==='playing'?(z?'\u6682\u505C':'Pause'):st==='paused'?(z?'\u7EE7\u7EED\u64AD\u653E':'Resume'):b.dataset.label;b.setAttribute('aria-label',L);b.title=L;}function stopTeachAudio(){var c=_tp;if(!c)return;_tp=null;try{if(c.audio){c.audio.onended=c.audio.onerror=c.audio.ontimeupdate=null;c.audio.pause();}}catch(e){}if(c.mode==='tts'){try{speechSynthesis.cancel();}catch(e){}}_tpSet(c.btn,'idle');}function _tpFallback(btn){try{var u=new SpeechSynthesisUtterance(btn.dataset.text||'');u.lang=btn.dataset.lang||'en-US';var cur={btn:btn,mode:'tts'};_tp=cur;u.onend=u.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');}};_tpSet(btn,'playing');speechSynthesis.speak(u);}catch(e){}}function playTeachAudio(btn){if(_tp&&_tp.btn===btn){if(_tp.mode==='audio'){var a0=_tp.audio;if(a0.paused){var p0=a0.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}
function returnToQuestion(){(function(){var b=document.getElementById("evidenceBanner");if(b&&b.parentNode)b.parentNode.removeChild(b);})();renderPanel();document.querySelector(".panel").scrollIntoView({behavior:"smooth",block:"start"})}
function nextQuestion(){const list=quizzes[activeTab];if(qIndex[activeTab]<list.length-1){qIndex[activeTab]++;renderPanel();return}completed[activeTab]=true;if(activeTab==="comprehension")activeTab="grammar";else if(activeTab==="grammar")activeTab="vocabulary";else{return showCompletion()}setTabs();renderPanel()}
function showCompletion(){completed.vocabulary=true;setTabs();const correct=Object.keys(selections).filter(k=>{const [tab,idx]=k.split('-');return selections[k]===quizzes[tab][+idx].answer}).length,total=Object.values(quizzes).reduce((a,b)=>a+b.length,0);document.getElementById("stagePill").textContent="Journey Complete";document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">Reading journey complete</div><h2>Wonderful work! 🎉</h2><p class="small">You finished Reading, Grammar, and Vocabulary.</p><div class="score-row"><div class="score-box"><b>${total}</b><br><span>Questions</span></div><div class="score-box"><b>${correct}</b><br><span>Correct now</span></div></div><div class="feedback good">You used evidence, practiced sentence skills, and learned new words.</div><button class="submit" onclick="restartPractice()">Practice Again</button></div>`}
function restartPractice(){activeTab="comprehension";qIndex={comprehension:0,grammar:0,vocabulary:0};selections={};attempts={};completed={comprehension:false,grammar:false,vocabulary:false};setTabs();renderPanel()}
function saveProgress(){try{localStorage.setItem("les-the-giant-who-borrowed-a-whisper-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-giant-who-borrowed-a-whisper"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-giant-who-borrowed-a-whisper",bookTitle:"The Giant Who Borrowed a Whisper",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}
function clearHighlight(){document.querySelectorAll(".story-word.reading").forEach(x=>x.classList.remove("reading"))}
let preferredVoice=null;
