<script>

const pages=[{"type": "cover", "title": "The Last Train to Juniper Station", "subtitle": "A Station Clock Offers Two Siblings One Chance to Revise a Goodbye", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-last-train-to-juniper-station-assets/cover.jpg"}, {"text": "1. The Clock at 6 17\nJuniper Station had closed before Leila was born, but her father still used its platform as a meeting place. On the evening he moved to another city, Leila arrived late. His car lights vanished at exactly 6:17.\nA year later, she and Ben returned to leave a box of family photographs. The station clock, frozen since the closure, clicked forward to 6:17. Rails buried under snow began to hum.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-last-train-to-juniper-station-assets/page1.jpg"}, {"text": "2. Tickets for a Memory\nA vintage train emerged without disturbing the snow. Conductor Rosa offered two blank tickets and explained that the last train did not travel to places. It returned passengers to one unfinished departure.\nBen wanted to see their father wave goodbye. Leila wanted to arrive early enough to prevent the argument that had delayed her. Rosa warned that the train could revisit a moment but could not guarantee a different ending.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-last-train-to-juniper-station-assets/page2.jpg"}, {"text": "3. The Carriage of Almost Said Things\nInside, empty seats held reflections of passengers who had once swallowed important words. Ben saw himself pretending not to care about the move. Leila saw her own anger covering fear.\nShe had remembered the argument as something her father started. The reflection replayed her first sharp sentence. Memory had preserved her hurt clearly while softening the part she had contributed.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-last-train-to-juniper-station-assets/page3.jpg"}, {"text": "4. The Platform One Year Earlier\nThe doors opened onto the station as it had looked a year before. Their father stood beside his packed car, waiting. Leila stepped forward, but her hand passed through the scene like mist.\nThey could not change actions. They could only add one sentence each to the memory. Ben used his sentence to ask for regular calls. Leila hesitated, searching for words that were honest rather than perfect.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-last-train-to-juniper-station-assets/page4.jpg"}, {"text": "5. The Sentence She Chose\nLeila could have said, Do not go. She could have apologized without explaining. Instead she said, I was angry because I wanted proof that distance would not make us less important.\nThe memory did not replace her father's departure. It changed what surrounded it. He turned as if hearing from far away, placed a hand over his heart, and left the silver thermos on the bench.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-last-train-to-juniper-station-assets/page5.jpg"}, {"text": "6. The Price of Another Minute\nThe clock moved to 6:18, and the station began to fade. Leila begged Rosa for another minute. Rosa said every added minute would erase one detail from the present.\nBen pointed to the photographs already losing color. They boarded before the faces vanished. A longer visit might have felt generous, but it would have consumed the memories they came to protect.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-last-train-to-juniper-station-assets/page6.jpg"}, {"text": "7. A Goodbye That Kept Moving\nAt dawn, the train was gone. The real silver thermos rested on the bench, warm with tea. Their father called that morning without knowing why he had dreamed of Juniper Station.\nLeila did not claim the past had been repaired. The argument remained, as did the move. What changed was the story she told about the goodbye: not a door slammed shut, but a conversation that could continue. Behind them, the station clock ticked on.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-last-train-to-juniper-station-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What happened when Leila and Ben returned to Juniper Station a year later?", "choices": ["Nothing unusual happened at all", "The frozen station clock clicked forward to 6:17 and the buried rails began to hum", "The station had been completely demolished"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "A year after the station closed, the frozen clock clicked forward to 6:17 and the snow-buried rails began to hum when Leila and Ben returned."}, {"q": "What did Conductor Rosa explain about the last train?", "choices": ["It could travel anywhere passengers wanted to go", "It only traveled forward in time, never back", "It didn't travel to places; it returned passengers to one unfinished departure"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Rosa explained that the train returned passengers to one unfinished departure and could not guarantee a different ending, only revisit the moment."}, {"q": "What did Leila realize about her memory of the argument?", "choices": ["She realized the argument had never actually happened", "She realized her father had never been upset at all", "She had remembered it as her father's fault, but the reflection showed her own sharp first words"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Leila's memory had preserved her hurt clearly while softening the part she contributed — the reflection replayed her own sharp first sentence."}, {"q": "What could Ben and Leila do on the platform from a year earlier?", "choices": ["Add one sentence each to the memory, though they couldn't change the actions", "Completely rewrite everything that had happened", "Stop their father from leaving at all"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "They could not change actions, only add one sentence each to the memory — Ben asked for regular calls, and Leila searched for honest words."}, {"q": "What did Rosa warn would happen if they stayed longer?", "choices": ["Nothing bad would happen no matter how long they stayed", "Every added minute would erase one detail from the present", "The train would leave without them"], "answer": 1, "evidencePage": 6, "hint": "Look at page 6.", "explain": "Rosa warned that every added minute would erase a detail from the present, so a longer visit would have cost them the very memories they came to protect."}], "grammar": [{"q": "'Her hand passed through the scene ___ mist.' Which word introduces a comparison?", "choices": ["because", "like", "although"], "answer": 1, "evidencePage": 4, "hint": "This word introduces a comparison between two things.", "explain": "'Like' introduces the comparison, showing her hand passing through the scene as mist would.", "teach": "<b>Like</b> introduces a <b>comparison</b> between two things.<span class='cn'><b>like</b> 用来引出两件事物之间的<b>比较</b>。</span>"}, {"q": "'A longer visit might have felt generous, ___ it would have consumed the memories they came to protect.' Which word shows contrast?", "choices": ["so", "but", "and"], "answer": 1, "evidencePage": 6, "hint": "This word shows the second idea is different from what you might expect.", "explain": "'But' shows contrast: staying longer would have felt kind, yet it would have cost them what mattered most.", "teach": "<b>But</b> joins two ideas that are <b>different or surprising together</b>.<span class='cn'><b>but</b>用来连接两个<b>不同或令人意外</b>的想法。</span>"}, {"q": "Which sentence correctly punctuates an introductory phrase?", "choices": ["At dawn, the train was gone.", "At dawn the train, was gone.", "At, dawn the train was gone."], "answer": 0, "evidencePage": 7, "hint": "A comma follows an introductory phrase before the main sentence begins.", "explain": "The comma correctly separates the introductory phrase 'At dawn' from the main sentence.", "teach": "<b>A comma</b> follows an <b>introductory phrase</b> before the main sentence begins.<span class='cn'><b>逗号</b>用在<b>引导性短语</b>之后，主句开始之前。</span>"}], "vocabulary": [{"q": "'Unfinished' means ___.", "choices": ["completely finished and done", "repeated many times over", "not yet completed"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "The train returned passengers to one unfinished departure — a moment that had never felt complete."}, {"q": "'Swallowed' means ___.", "choices": ["held back or kept inside without saying", "spoken loudly for everyone to hear", "written down carefully"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "The reflections held passengers who had once swallowed important words instead of saying them out loud."}, {"q": "'Generous' means ___.", "choices": ["giving more than what is expected", "cold and unfriendly", "quick and rushed"], "answer": 0, "evidencePage": 6, "hint": "Look at page 6.", "explain": "A longer visit might have felt generous, giving them more time, but it would have cost them the memories they wanted to keep."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(unfinished|swallowed|generous)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 6 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function saveProgress(){try{localStorage.setItem("les-the-last-train-to-juniper-station-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-last-train-to-juniper-station"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-last-train-to-juniper-station",bookTitle:"The Last Train to Juniper Station",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.
