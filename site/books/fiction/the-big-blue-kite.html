const quizzes={"comprehension":[{"q":"What color was Sam’s kite?","choices":["Red","Blue","Green"],"answer":1,"evidencePage":1,"hint":"Look at page 1.","explain":"The story says Sam had a big blue kite."},{"q":"Where did the kite get stuck?","choices":["In the water","In a tall tree","Under a car"],"answer":1,"evidencePage":3,"hint":"Look at page 3.","explain":"On page 3, the kite got stuck in a tall tree."},{"q":"Who came to help Sam?","choices":["His mom","His friend Mia","A dog"],"answer":1,"evidencePage":5,"hint":"Page 5 shows who came.","explain":"Sam’s friend Mia came to help him."},{"q":"What is the lesson of the story?","choices":["Kites are fun.","Working together helps.","Trees are tall."],"answer":1,"evidencePage":6,"hint":"Think about how the kite came free.","explain":"Sam and Mia solved the problem by working together."}],"grammar":[{"q":"Which word should begin with a capital letter?","choices":["kite","sam","park"],"answer":1,"evidencePage":1,"hint":"One of these is a person’s name.","explain":"Sam is a person’s name, so it begins with a capital S.","teach":"Names of people always start with a <b>capital</b>: <b>Sam</b>. 'kite' and 'park' are common words (not names), so they stay lowercase in the middle of a sentence.<span class='cn'>人名总是<b>大写</b>开头:<b>Sam</b>。kite、park 是普通词(非名字),句中保持小写。</span>"},{"q":"Choose the complete sentence.","choices":["The kite in the tree.","The kite is in the tree.","In the tree."],"answer":1,"evidencePage":3,"hint":"A sentence needs a naming part and a telling part.","explain":"“The kite is in the tree.” tells what the kite is doing.","teach":"A complete sentence needs a naming part AND an action word. 'The kite <b>is</b> in the tree.' has both. 'The kite in the tree' is missing the verb (is). 'In the tree' has no subject.<span class='cn'>完整句要有主语和动词。'The kite <b>is</b> in the tree.' 都有;'The kite in the tree' 缺动词 is;'In the tree' 没有主语。</span>"},{"q":"Choose the correct ending mark: “Oh no__”","choices":[".","?","!"],"answer":2,"evidencePage":3,"hint":"Sam is surprised and upset.","explain":"“Oh no!” shows strong feeling, so it ends with an exclamation mark.","teach":"<b>!</b> shows a strong feeling — 'Oh no!' A <b>period (.)</b> ends a calm telling sentence; a <b>question mark (?)</b> ends a question.<span class='cn'><b>!</b> 表示强烈情绪——Oh no!;<b>句号(.)</b> 结束陈述句;<b>问号(?)</b> 结束疑问句。</span>"},{"q":"Which word means more than one?","choices":["tree","trees","tall"],"answer":1,"evidencePage":3,"hint":"Which word has an -s at the end?","explain":"“Trees” means more than one tree.","teach":"Add <b>-s</b> to make most nouns plural (more than one): tree → <b>trees</b>. 'tree' is just one. 'tall' is a describing word (adjective), not a number of things.<span class='cn'>多数名词加 <b>-s</b> 表复数:tree→<b>trees</b>;tree 只有一个;tall 是形容词,不表示数量。</span>"}],"vocabulary":[{"q":"In the story, a “soft wind” means the wind was ___.","choices":["gentle and light","very loud","cold as ice"],"answer":0,"evidencePage":2,"hint":"Page 2 says the wind was soft.","explain":"A soft wind is a gentle, light wind."},{"q":"The kite “came free.” Free means ___.","choices":["still stuck","not stuck anymore","broken"],"answer":1,"evidencePage":6,"hint":"What happened to the kite at the end?","explain":"“Came free” means the kite was no longer stuck."},{"q":"“They pulled and pulled.” To pull means to ___.","choices":["push it away","tug it toward you","let it go"],"answer":1,"evidencePage":6,"hint":"Think about what you do with a string.","explain":"To pull means to tug something toward you."}]};
