<script>

const pages=[{"type": "cover", "title": "The Rain Gauge That Stayed Empty", "subtitle": "An Empty Rain Gauge Sends Two Young Scientists Searching for a Culprit Until a Small Test Tells the Truth", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-rain-gauge-that-stayed-empty-assets/cover.jpg"}, {"text": "1. An Empty Answer\nNell had heard the rain drumming on her window after bedtime. By morning the garden path shone, and drops hung from every cabbage leaf. She opened her weather notebook, ready to finish the first week of observations. Then she looked at the rain gauge. The clear cylinder was empty. Not low. Empty. Beside her, Max tipped back his hood and checked the sky, as if the rain might have gone to the wrong address.\nTheir class had made the gauge from a straight-sided plastic container. A strip of blue tape marked the top so nobody would mistake it for a drinking cup. Nell checked that it was upright in its holder. She had planned to enter a number, draw a tidy line under the week, and go home. Instead, she left the space blank. Max said they had found a mystery. Nell wished they had found some rain.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-rain-gauge-that-stayed-empty-assets/page1.jpg"}, {"text": "2. Who Had Been There\nMax's first guess was that somebody had emptied it. The gate was unlocked during daylight, and a green watering can stood beside the shed. Mr. Bell, who cared for the vegetable beds, often arrived early. Nell imagined him pouring their collected rain onto a thirsty plant. It was a perfectly ordinary thing for a gardener to do. It was also a thing she had not seen him do.\nThey looked for footprints, but the gravel kept no useful record. Max suggested a bird might have taken a drink. Nell looked at the cylinder's narrow opening and tried to imagine a bird drinking every last drop. She could not rule out a visitor simply because it sounded unlikely. She wrote their guesses on a fresh page. The list looked impressively long. None of it explained anything yet.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-rain-gauge-that-stayed-empty-assets/page2.jpg"}, {"text": "3. The Patch Under the Fence\nThey returned to the holder. A broad leaf hung near the gauge, but not over its opening. Max moved around the fence and looked up. No branch or roof sheltered the container. Nell crouched to check the ground. Most of the soil beneath the fence was merely damp. Directly under the gauge, one small patch was much darker. A drop fell from the holder while she watched.\nShe touched the outside of the cylinder. It was wet, just like the fence. That could explain a drop, she thought. Max suggested that the holder had caught extra rain. They waited until another drop fell. Then they waited longer. Nell was beginning to feel that the most interesting part of the gauge might be underneath it, where she had not been looking at all.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-rain-gauge-that-stayed-empty-assets/page3.jpg"}, {"text": "4. The Gardener Had a Question\nMr. Bell arrived with a bag of pea seeds. Nell asked whether he had emptied their gauge. He said he had not, then looked at the container. He remembered giving their teacher several old plastic tubs from the shed. Some had held small plant pots. He could not remember which ones the class had chosen. Max asked whether one might have a hole. Mr. Bell told them to test it before deciding.\nNell lifted the cylinder from its holder. She found no large hole in the bottom. A thin mark near the lower edge looked like an ordinary scratch. She had seen it when they added the scale and had thought nothing of it. Max carried a shallow metal tray to the potting bench. Nell brought the gauge. Mr. Bell filled a small jug with water and set it down beside them.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-rain-gauge-that-stayed-empty-assets/page4.jpg"}, {"text": "5. The Scratch That Was a Split\nNell stood the gauge in the tray and poured in a little water. At first the level stayed where she expected. Then a bead formed beside the thin mark where the side met the base. It swelled, slipped down the plastic, and joined another bead. Max leaned closer without touching it. The mark was a split. It was small enough to overlook and large enough to let their evidence escape all night.\nThey watched until the cylinder was empty. A shallow puddle spread across the metal tray. Nell thought of the dark patch under the fence. It had not told them who emptied the gauge. It had told them where the water went. She crossed out none of their guesses. Instead, she wrote the result of the test beneath them. Max said the mystery had a very small villain. Nell said it had no villain at all.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-rain-gauge-that-stayed-empty-assets/page5.jpg"}, {"text": "6. A Space They Could Not Fill\nThey found another straight-sided container in the supply box and tested it over the tray. This one held its water. Max added green tape so they would know which was the replacement. After emptying it, they put it in the holder. The sky was beginning to clear. Nell looked at the blank space in her notebook. She could not use the amount from a nearby garden or guess how much had escaped. Their broken gauge had not kept that information.\nIt bothered her more than she expected. The other days formed a neat row, and this day would interrupt it. She explained in the space that the container had leaked. Max drew a tiny rain cloud in the margin. Nell almost asked him to erase it, then left it there. The week was still a record of what they had done. It simply included something they had not managed to measure.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-rain-gauge-that-stayed-empty-assets/page6.jpg"}, {"text": "7. Rain on the Roof Again\nThe next shower came two days later. By then, the old cylinder stood on the classroom shelf holding pencils. Nell had wrapped its sharp split with tape, since it no longer needed to hold water. When the rain stopped, she and Max went to the garden. A clear line of water waited inside the green-marked gauge. They checked it together before writing anything down.\nOn their way back, Max pointed out a wet streak beside the shed. He wondered whether they had discovered another mystery. Nell followed it with her eyes. At the top stood the green watering can, tipped slightly on its side. They righted it and moved on. Not every strange mark needed a long explanation. But Nell looked at the ground beneath the fence once more before she left, pleased to find it no wetter than the soil around it.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-rain-gauge-that-stayed-empty-assets/page7.jpg"}];

rule to follow", "draw a straight line"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "To rule out a visitor is to decide that a visitor could not have done it.", "teach": "The words <b>rule out</b> mean to decide that something is not possible, like <b>rule out a visitor</b>.<span class='cn'><b>rule out</b> 表示“排除”，认定某种可能不存在，比如 <b>rule out a visitor</b>（排除有访客的可能）。</span>"}, {"q": "‘The list of guesses ___ impressively long.’ Which verb matches the subject?", "choices": ["are", "was", "were"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "The subject is “list”, which is one thing, so the verb is “was”.", "teach": "The verb must match the main subject, so use <b>was</b> with <b>list</b> even when <b>of guesses</b> comes between them.<span class='cn'>动词要和主要的主语一致，所以 <b>list</b> 用 <b>was</b>，即使中间隔着 <b>of guesses</b>。</span>"}, {"q": "The Greek root ‘meter’ means ‘measure’. Which word has the same root?", "choices": ["diary", "diameter", "diamond"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "The diameter is a measurement across a circle.", "teach": "The Greek root <b>meter</b> means measure, like <b>diameter</b> and <b>thermometer</b>.<span class='cn'>希腊词根 <b>meter</b> 表示“测量”，比如 <b>diameter</b>（直径）和 <b>thermometer</b>（温度计）。</span>"}], "vocabulary": [{"q": "‘Observations’ means ___.", "choices": ["rules for an experiment", "pictures drawn from memory", "things you notice by watching carefully"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "She opened her weather notebook, ready to finish the first week of observations."}, {"q": "‘Cylinder’ means ___.", "choices": ["a tube-shaped container", "a flat tray", "a kind of tape"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "The clear cylinder was empty."}, {"q": "‘Replacement’ means ___.", "choices": ["something that takes the place of another thing", "something that is very old", "something that is broken"], "answer": 0, "evidencePage": 6, "hint": "Look at page 6.", "explain": "Max added green tape so they would know which was the replacement."}]};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(observations|cylinder|replacement)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 5 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
