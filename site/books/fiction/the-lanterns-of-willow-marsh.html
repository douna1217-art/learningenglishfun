const pages=[{"type": "cover", "title": "The Lanterns of Willow Marsh", "subtitle": "Two Friends Follow Mysterious Lights and Learn to Test Every Explanation", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-lanterns-of-willow-marsh-assets/cover.jpg"}, {"text": "1. Lights Beyond the Reeds\nMaya and Owen were recording frog calls when three amber lights appeared beyond the reeds. The marsh map showed no trail there, and Ranger Celeste had not placed any visitor lanterns.\nThe lights drifted in a straight line, then seemed to turn together. Maya imagined a hidden boat. Owen wondered whether the water itself was carrying them.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-lanterns-of-willow-marsh-assets/page1.jpg"}, {"text": "2. A Path That Moved\nThey launched the canoe along the marked channel. Each time Owen looked down at the compass, the lights appeared farther left. Maya noticed that their reflections stretched across the ripples.\nRanger Celeste asked them to separate what moved from what only appeared to move. They marked the canoe's direction, the wind, and the position of a tall dead tree.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-lanterns-of-willow-marsh-assets/page2.jpg"}, {"text": "3. The Silent Marker\nNear the first light, they found a solar lantern attached to a blue reed marker. A broken cord let the marker swing with the current, making the entire row seem to turn.\nThe lantern was not a mystery boat, but it raised another question. Why had research markers been placed beside a nesting island that was supposed to remain undisturbed?", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-lanterns-of-willow-marsh-assets/page3.jpg"}, {"text": "4. Tracks in Two Directions\nAt the island's muddy edge, boot prints led toward a half-submerged sensor box. A second trail led back to the channel. Maya thought someone had visited twice.\nOwen compared the tread shapes and saw they matched. Ranger Celeste explained that a rising tide could erase the middle of one continuous path. Two trails did not always mean two trips.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-lanterns-of-willow-marsh-assets/page4.jpg"}, {"text": "5. The Wrong Kind of Rescue\nA soft chirping came from the reeds. Maya wanted to step onto the island and search for a trapped bird. Ranger Celeste stopped the canoe before it crossed the blue markers.\nOwen listened carefully. The chirps repeated at exact intervals and came from the sensor box, not a nest. Its low-battery alarm sounded like a young bird. A rushed rescue could have frightened the real chicks nearby.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-lanterns-of-willow-marsh-assets/page5.jpg"}, {"text": "6. Repair Before Sunrise\nFrom the canoe, Ranger Celeste used a hooked pole to lift the sensor. Maya secured its loose cord, and Owen replaced the battery from the ranger kit. They never stepped onto the nesting ground.\nThe other lanterns formed a boundary for researchers, not a route for visitors. Once the broken marker was fixed, their straight line pointed away from the island and back toward the safe channel.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-lanterns-of-willow-marsh-assets/page6.jpg"}, {"text": "7. What the Lights Meant\nAt sunrise, the lanterns faded against the bright water. Maya's first explanation had been exciting, and Owen's had been partly correct, but neither had included the whole system.\nTheir notes connected reflection, current, tide, and purpose. The lights had seemed to invite them forward, yet their real message was to keep back. In Willow Marsh, good observers learned not only to follow clues, but also to respect the boundaries those clues revealed.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-lanterns-of-willow-marsh-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did Maya and Owen see while recording frog calls?", "choices": ["Three amber lights beyond the reeds, in a spot with no marked trail", "Ranger Celeste's visitor lanterns", "A boat clearly approaching them"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Maya and Owen saw three amber lights beyond the reeds, in an area where the marsh map showed no trail and no visitor lanterns had been placed."}, {"q": "What did Ranger Celeste ask Maya and Owen to do?", "choices": ["Separate what actually moved from what only appeared to move", "Turn back immediately without investigating", "Follow the lights as fast as they could"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Ranger Celeste asked them to separate what moved from what only appeared to move, and they marked the canoe's direction, wind, and a landmark tree."}, {"q": "What did they find near the first light?", "choices": ["An abandoned boat tied to a tree", "A solar lantern attached to a blue reed marker with a broken cord", "A group of researchers camping nearby"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "They found a solar lantern attached to a blue reed marker, and a broken cord let it swing with the current, making the row seem to turn."}, {"q": "What did Ranger Celeste explain about the two sets of boot prints?", "choices": ["A rising tide could erase the middle of one continuous path, so two trails didn't always mean two trips", "The prints definitely belonged to two different people", "The prints were not real footprints at all"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Ranger Celeste explained that a rising tide could erase part of one continuous path, so what looked like two trails might have been just one."}, {"q": "What was actually making the chirping sound near the reeds?", "choices": ["A low-battery alarm on the sensor box, not a trapped bird", "A real chick calling for help", "Nothing; the sound was imagined"], "answer": 0, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Owen realized the chirps came at exact intervals from the sensor box's low-battery alarm, not a real trapped bird, which could have caused a rushed and harmful rescue."}], "grammar": [{"q": "'Maya's first explanation had been exciting, ___ neither one had included the whole system.' Which word shows contrast?", "choices": ["so", "and", "but"], "answer": 2, "evidencePage": 7, "hint": "This word shows the second idea is different from what you might expect.", "explain": "'But' shows contrast: both explanations had some truth, yet neither covered everything.", "teach": "<b>But</b> joins two ideas that are <b>different or surprising together</b>.<span class='cn'><b>but</b>用来连接两个<b>不同或令人意外</b>的想法。</span>"}, {"q": "'Owen wondered ___ the water itself was carrying the lights.' Which word introduces a question with two possible answers?", "choices": ["so", "because", "whether"], "answer": 2, "evidencePage": 1, "hint": "This word introduces a question with a yes or no answer inside the sentence.", "explain": "'Whether' introduces a question with two possible outcomes — yes or no — inside the sentence.", "teach": "<b>Whether</b> introduces a question with <b>two possible outcomes</b> inside a sentence.<span class='cn'><b>whether</b>用来在句子里引出一个有<b>两种可能结果</b>的问题。</span>"}, {"q": "Which sentence correctly punctuates an introductory phrase?", "choices": ["From, the canoe Ranger Celeste used a hooked pole to lift the sensor.", "From the canoe, Ranger Celeste used a hooked pole to lift the sensor.", "From the canoe Ranger Celeste, used a hooked pole to lift the sensor."], "answer": 1, "evidencePage": 6, "hint": "A comma follows an introductory phrase before the main sentence begins.", "explain": "The comma correctly separates the introductory phrase 'From the canoe' from the main sentence.", "teach": "<b>A comma</b> follows an <b>introductory phrase</b> before the main sentence begins.<span class='cn'><b>逗号</b>用在<b>引导性短语</b>之后，主句开始之前。</span>"}], "vocabulary": [{"q": "'Reflections' means ___.", "choices": ["sounds made by frogs at night", "measurements taken with a compass", "images formed by light bouncing off a surface"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Maya noticed the lanterns' reflections stretched across the ripples, images formed by light bouncing off the water."}, {"q": "'Undisturbed' means ___.", "choices": ["visited by many people often", "left alone and not interfered with", "completely destroyed by weather"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Research markers had been placed beside a nesting island that was supposed to remain undisturbed, left alone by visitors."}, {"q": "'Boundary' means ___.", "choices": ["a type of small boat", "a line or marker showing a limit", "a bright light used for signaling"], "answer": 1, "evidencePage": 6, "hint": "Look at page 6.", "explain": "The lanterns formed a boundary for researchers, marking a limit that was not meant to be crossed by visitors."}]};

function saveProgress(){try{localStorage.setItem("les-the-lanterns-of-willow-marsh-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-lanterns-of-willow-marsh"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-lanterns-of-willow-marsh",bookTitle:"The Lanterns of Willow Marsh",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.
