<script>

const pages=[{"type": "cover", "title": "The Case of the Vanishing Mural", "subtitle": "The Picture Did Not Disappear—It Changed With the Light.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-case-of-the-vanishing-mural-assets/cover.jpg"}, {"text": "1. Missing by Lunchtime\nAt morning recess, the ocean mural behind the school garden blazed with blue fish and orange kelp. By lunchtime, a wide stripe across its center looked almost white. Niko insisted someone was erasing it. Priya pointed out that the wall felt dry and no paint chips lay below.\nTheir principal asked them not to touch the artwork. The mural had been painted by families five years earlier, so a professional would inspect it. Until then, Niko and Priya could observe from the walkway. They photographed the wall from the same marked spot at morning, noon, and afternoon.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-case-of-the-vanishing-mural-assets/page1.jpg"}, {"text": "2. A Stripe That Moved\nThe next morning, every fish was bright again. At 11:35, the pale stripe appeared near the top. By 12:20, it crossed the center. At 1:10, it had slipped lower. Paint could fade over years, but it would not recover overnight or move down a wall.\nNiko crossed “eraser” from their list. Priya held a sheet of cardboard so its shadow covered one pale fish. Inside the shadow, the blue returned. The color had never left. Something was making it difficult to see. They turned around and searched for what changed with the Sun.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-case-of-the-vanishing-mural-assets/page2.jpg"}, {"text": "3. The New Windows\nAcross the courtyard, new high-efficiency windows had been installed on the gym. At noon, one pane flashed like a mirror. Its reflected light landed exactly on the mural's pale stripe. As the Sun moved, the reflection moved too.\nNiko wanted to hang a blanket over the window, but the principal explained that students could not alter the building. Ms. Alvarez, an art conservator, arrived the following day. She praised their time-stamped photographs and shadow test. “You separated a change in the paint from a change in how the paint appears,” she said.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-case-of-the-vanishing-mural-assets/page3.jpg"}, {"text": "4. More Than One Problem\nMs. Alvarez examined the mural without scraping it. The reflected glare explained the disappearing colors, but her light meter found that the intense patch also delivered extra light and heat. Over a long time, that could damage some pigments and protective coatings.\nThe mystery had two answers: an immediate illusion and a possible future risk. Priya added both to their chart. Niko had wanted one dramatic culprit. Instead, careful evidence revealed a problem that changed depending on whether they asked, “What do we see today?” or “What could happen over time?”", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-case-of-the-vanishing-mural-assets/page4.jpg"}, {"text": "5. Testing the Shade\nFacilities staff installed a temporary shade panel on an approved frame near the gym window. Niko and Priya repeated their photographs. At noon, the mural stayed visible. The light meter reading also dropped, but the gym classroom remained bright.\nBefore choosing a permanent solution, the adults tested several angles so the shade would not block an emergency view or create glare somewhere else. Priya appreciated the slower process. Solving one problem without checking the whole setting could simply move the problem to another wall.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-case-of-the-vanishing-mural-assets/page5.jpg"}, {"text": "6. The Mural Returns\nA narrow exterior sunshade was approved and installed by professionals. At the next lunchtime, the blue fish remained blue and the orange kelp twisted clearly through the painted water. Students cheered as if the mural had been repainted overnight.\nNiko and Priya presented their investigation at assembly. They showed the moving stripe, the shadow test, the reflected path, and the conservator's measurements. Niko admitted that his first theory had sounded exciting but failed to explain why the colors returned. A good mystery answer had to fit every clue.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-case-of-the-vanishing-mural-assets/page6.jpg"}, {"text": "7. What Light Can Hide\nLater, clouds crossed the Sun and softened every color in the courtyard. Niko watched the mural change without disappearing. He realized that seeing was not as simple as opening his eyes. Position, time, surface, and light all shaped the picture he believed was there.\nPriya added one final note to the investigation folder: The paint stayed. Our explanation changed. They left the folder in the library for the next school mystery, along with an empty page for a theory that might need to be crossed out.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-case-of-the-vanishing-mural-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did Niko and Priya notice about the mural by lunchtime?", "choices": ["It had been completely repainted", "A wide pale stripe had appeared across its center", "It had a new frame"], "answer": 1, "evidencePage": 1, "hint": "Look at chapter 1.", "explain": "By lunchtime, a wide stripe across its center looked almost white."}, {"q": "What did Priya discover when she held cardboard to cast a shadow on a pale fish?", "choices": ["Nothing changed at all", "The fish disappeared completely", "The blue color returned inside the shadow"], "answer": 2, "evidencePage": 2, "hint": "Look at chapter 2.", "explain": "Inside the shadow, the blue returned—the color had never left."}, {"q": "What was causing the pale stripe on the mural?", "choices": ["Reflected light from new windows on the gym", "Old paint peeling off", "Students touching the wall"], "answer": 0, "evidencePage": 3, "hint": "Look at chapter 3.", "explain": "Its reflected light landed exactly on the mural's pale stripe."}, {"q": "What did Ms. Alvarez's light meter reveal, beyond the glare?", "choices": ["The wall was crumbling", "The intense light patch also delivered extra heat that could damage pigments over time", "The mural was painted with the wrong paint"], "answer": 1, "evidencePage": 4, "hint": "Look at chapter 4.", "explain": "Her light meter found that the intense patch also delivered extra light and heat."}, {"q": "What is the big idea of this story?", "choices": ["Light never affects how we see color", "The mural had to be completely repainted", "The paint stayed the same; what changed was the explanation for what they saw"], "answer": 2, "evidencePage": 7, "hint": "Look at the last chapter.", "explain": "The paint stayed. Our explanation changed."}], "grammar": [{"q": "“Paint could fade over years, ___ it would not recover overnight or move down a wall.” Which word shows contrast?", "choices": ["but", "so", "and"], "answer": 0, "evidencePage": 2, "hint": "This word contrasts fading over years with recovering overnight.", "explain": "“But” contrasts slow fading with the impossible idea of overnight recovery.", "teach": "<b>But</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>but</b>(但是)表示两个事实之间的<b>对比</b>。</span>"}, {"q": "“The reflected glare explained the disappearing colors, ___ her light meter found extra light and heat too.” Which word adds another finding?", "choices": ["but", "so", "and"], "answer": 2, "evidencePage": 4, "hint": "This word adds a second finding alongside the first.", "explain": "“And” adds the light meter's finding alongside the glare explanation.", "teach": "<b>And</b> adds <b>another fact</b> alongside the first.<span class='cn'><b>and</b>(和)在第一个事实旁<b>增加另一个事实</b>。</span>"}, {"q": "“Niko admitted his first theory had sounded exciting, ___ it failed to explain why the colors returned.” Which word shows contrast?", "choices": ["but", "so", "and"], "answer": 0, "evidencePage": 6, "hint": "This word contrasts sounding exciting with failing to explain.", "explain": "“But” contrasts the exciting-sounding theory with its failure to explain the clues.", "teach": "<b>But</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>but</b>(但是)表示两个事实之间的<b>对比</b>。</span>"}], "vocabulary": [{"q": "‘Reflection’ means ___.", "choices": ["a return to a previous prediction", "light bouncing off a surface, like a mirror", "light passing directly through glass"], "answer": 1, "evidencePage": 3, "hint": "Look at chapter 3.", "explain": "One pane flashed like a mirror, and its reflected light landed on the mural."}, {"q": "‘Evidence’ means ___.", "choices": ["a random guess", "a type of paint", "facts or clues that help support an explanation"], "answer": 2, "evidencePage": 6, "hint": "Look at chapter 6.", "explain": "They showed the moving stripe, the shadow test, and the conservator's measurements as evidence."}, {"q": "‘Temporary’ means ___.", "choices": ["lasting for only a short time, not permanent", "lasting forever", "broken beyond repair"], "answer": 0, "evidencePage": 5, "hint": "Look at chapter 5.", "explain": "Facilities staff installed a temporary shade panel before choosing a permanent solution."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(reflection|evidence|temporary)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 4 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else{const __wc=(p.text||"").split(/\s+/).filter(Boolean).length;view.innerHTML=`<div class="book-page${__wc>55?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;}document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.
