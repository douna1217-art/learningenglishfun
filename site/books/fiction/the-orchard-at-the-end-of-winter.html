 16px;display:flex;align-items:center;gap:14px;box-shadow:0 14px 38px rgba(111,74,182,.24);border:1px solid rgba(255,255,255,.32)}.evidence-banner strong{text-shadow:0 1px 6px rgba(60,35,110,.35)}.evidence-banner span{font-size:.84rem;color:#fff}.evidence-banner button{border:0;border-radius:10px;padding:9px 12px;background:rgba(255,255,255,.92);color:var(--purple);font-weight:950;cursor:pointer}.footer{text-align:center;color:var(--muted);font-size:.8rem;padding:13px}

<script>

const pages=[{"type": "cover", "title": "The Orchard at the End of Winter", "subtitle": "Some Traditions Survive Because They Know How to Change.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-orchard-at-the-end-of-winter-assets/cover.jpg"}, {"text": "1. The Crack After the Storm\nThe storm ended before sunrise, leaving silver puddles between the orchard rows. Mina followed Grandma to the oldest pear tree. One heavy branch had split where it joined the trunk. Its wet leaves brushed the ground, but several small buds still held tightly to the twigs.\n“We need an arborist to remove the unsafe part,” Grandma said. Mina wrapped both arms around the trunk. That tree appeared in every family photograph, so cutting it felt like cutting a page from their story. “Can't we tape it back?” she asked. Grandma shook her head gently.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-orchard-at-the-end-of-winter-assets/page1.jpg"}, {"text": "2. What Counts as the Same?\nAt breakfast, Mina argued that a tradition should stay the same. Every autumn, the family picked the old tree's pears first. Grandma opened a wooden box of orchard records instead of arguing back. The photographs showed the tree at different ages—short, tall, wide, and once nearly bare.\nIn one picture, Mina's great-grandfather held a healthy pear twig beside a younger trunk. A note explained that he had grafted the twig after disease damaged the original top. “This tree has already changed,” Grandma said. Mina studied the familiar trunk. A pale ridge in its bark marked where two pieces had grown together.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-orchard-at-the-end-of-winter-assets/page2.jpg"}, {"text": "3. A Living Record\nThe arborist, Ms. Nguyen, arrived with safety gear and bright ropes. She explained that the split branch could fall without warning. A healthy twig from it might be saved as a scion for grafting onto compatible pear rootstock, though no graft was guaranteed to grow.\nMina wanted certainty, but the orchard records told a different story: careful pruning after wind, new irrigation during dry years, and grafts after disease. The tradition was not a frozen picture. It was a record of people noticing what the trees needed.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-orchard-at-the-end-of-winter-assets/page3.jpg"}, {"text": "4. The Cut\nMina and Grandma stood beyond the safety cones while Ms. Nguyen removed the damaged limb in sections. The saw's sound made Mina wince. When the last piece lowered to the ground, the tree looked lopsided against the cloudy sky. Empty air filled the place where the branch had shaded their picnic blanket.\nMs. Nguyen selected a healthy one-year twig and showed Mina its sleeping buds. She made the graft onto prepared pear rootstock while Mina handed Grandma the labels. They recorded the date, the tree variety, and the storm. Even if the graft failed, their notes would help the next attempt.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-orchard-at-the-end-of-winter-assets/page4.jpg"}, {"text": "5. Waiting Without a Promise\nLate winter gave way to warmer afternoons. Mina checked the graft every day until Grandma asked her to check only on Saturdays. “Growing cannot be hurried by staring,” she said. Some mornings, the old tree's uneven shape still startled Mina. Then she noticed sunlight reaching young branches that had once been shaded.\nFor her class project, Mina drew the tree as a timeline. She included the first graft, the irrigation change, the storm, and the new scion. At the center she wrote a question: If something changes in order to keep growing, is it still the same tradition? She did not write an easy answer.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-orchard-at-the-end-of-winter-assets/page5.jpg"}, {"text": "6. A Small Green Sign\nOne Saturday, a bud on the graft looked rounder. A week later, a tiny green tip opened. Mina called Grandma, then stopped herself from declaring success. Ms. Nguyen had said the graft would need careful watching through the season. Still, the small leaf was a beginning.\nThe old pear tree opened blossoms too. Fewer than last year, they scattered across the remaining branches like white stars. Mina spread the picnic blanket in a new patch of shade. The empty space had not vanished, and neither had the family story. Both were visible at once.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-orchard-at-the-end-of-winter-assets/page6.jpg"}, {"text": "7. The First Pear\nAt the autumn gathering, the family still picked the old tree's pears first. Mina chose one from a low remaining branch and placed it in Grandma's basket. Beside the row, the young graft had grown several leaves but no fruit. Its story would take longer.\nMina added a new photograph to the wooden box. It showed the old tree, the open sky where the branch had been, and the young graft tied to its support. On the back she wrote, We cared for what came before by helping what comes next. Then she left room for another date.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-orchard-at-the-end-of-winter-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What happened to the old pear tree's branch after the storm?", "choices": ["It grew twice as fast", "It split where it joined the trunk", "It bloomed early"], "answer": 1, "evidencePage": 1, "hint": "Look at chapter 1.", "explain": "One heavy branch had split where it joined the trunk."}, {"q": "What did the orchard records show about the tree?", "choices": ["It had never changed at all", "It was planted only last year", "It had already changed many times, including being grafted in the past"], "answer": 2, "evidencePage": 2, "hint": "Look at chapter 2.", "explain": "Mina's great-grandfather had grafted a twig after disease damaged the original top."}, {"q": "What did Ms. Nguyen the arborist plan to do with a healthy twig from the branch?", "choices": ["Save it as a scion for grafting onto pear rootstock", "Throw it away completely", "Plant it as a brand new tree immediately"], "answer": 0, "evidencePage": 3, "hint": "Look at chapter 3.", "explain": "A healthy twig might be saved as a scion for grafting onto compatible pear rootstock."}, {"q": "What did Mina and Grandma record after the graft was made?", "choices": ["Nothing at all", "The date, the tree variety, and the storm", "Only a guess about the weather"], "answer": 1, "evidencePage": 4, "hint": "Look at chapter 4.", "explain": "They recorded the date, the tree variety, and the storm."}, {"q": "What is the big idea of this story?", "choices": ["Traditions must never change in any way", "Cutting a tree always ends a family's story", "Some traditions survive because they know how to change"], "answer": 2, "evidencePage": 7, "hint": "Look at the last chapter.", "explain": "We cared for what came before by helping what comes next."}], "grammar": [{"q": "“Mina wanted certainty, ___ the orchard records told a different story.” Which word shows contrast?", "choices": ["so", "but", "because"], "answer": 1, "evidencePage": 3, "hint": "This word contrasts wanting certainty with what the records showed.", "explain": "“But” contrasts Mina's wish for certainty with the more complicated story the records told.", "teach": "<b>But</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>but</b>(但是)表示两个事实之间的<b>对比</b>。</span>"}, {"q": "“The empty space had not vanished, ___ neither had the family story.” Which word joins these two things that stayed true?", "choices": ["so", "because", "and"], "answer": 2, "evidencePage": 6, "hint": "This word joins two things that both remained true.", "explain": "“And” joins the empty space remaining with the family story also remaining.", "teach": "<b>And</b> joins <b>two things that are both true</b>.<span class='cn'><b>and</b>(和)连接<b>两件都成立的事</b>。</span>"}, {"q": "“That tree appeared in every family photograph, ___ cutting it felt like cutting a page from their story.” Which word shows the result?", "choices": ["so", "because", "and"], "answer": 0, "evidencePage": 1, "hint": "This word shows why cutting it felt so significant to Mina.", "explain": "“So” shows why cutting the tree felt so significant—it was in every family photograph.", "teach": "<b>X, so Y</b> shows Y is a <b>result</b> of X.<span class='cn'><b>so</b>(所以)表示Y是X的<b>结果</b>。</span>"}], "vocabulary": [{"q": "‘Graft’ means ___.", "choices": ["a type of storm damage", "a piece of a plant joined onto another plant so it can grow", "a type of family photograph"], "answer": 1, "evidencePage": 3, "hint": "Look at chapter 3.", "explain": "A healthy twig might be saved as a scion for grafting onto pear rootstock."}, {"q": "‘Tradition’ means ___.", "choices": ["a single random event", "a type of tree disease", "a custom or practice passed down and repeated over time"], "answer": 2, "evidencePage": 2, "hint": "Look at chapter 2.", "explain": "Every autumn, the family picked the old tree's pears first—a tradition."}, {"q": "‘Arborist’ means ___.", "choices": ["a person who is trained to care for trees", "a person who takes family photographs", "a person who grows only pears"], "answer": 0, "evidencePage": 3, "hint": "Look at chapter 3.", "explain": "Ms. Nguyen, the arborist, arrived with safety gear and bright ropes."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(graft|tradition|arborist)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 4 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}
