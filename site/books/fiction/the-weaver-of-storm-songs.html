 16px;display:flex;align-items:center;gap:14px;box-shadow:0 14px 38px rgba(111,74,182,.24);border:1px solid rgba(255,255,255,.32)}.evidence-banner strong{text-shadow:0 1px 6px rgba(60,35,110,.35)}.evidence-banner span{font-size:.84rem;color:#fff}.evidence-banner button{border:0;border-radius:10px;padding:9px 12px;background:rgba(255,255,255,.92);color:var(--purple);font-weight:950;cursor:pointer}.footer{text-align:center;color:var(--muted);font-size:.8rem;padding:13px}

<script>

const pages=[{"type": "cover", "title": "The Weaver of Storm Songs", "subtitle": "To Quiet the Wind, Lio First Had to Hear What It Was Saying", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-weaver-of-storm-songs-assets/cover.jpg"}, {"text": "1. The Hill That Hummed\nLong ago in the hill town of Bellweather, every roof sang when storms arrived. Lio, the youngest apprentice weaver, wore a blue sash and carried a walnut-wood hand loom. He could weave wool, flax, and grass, but he wished to weave the wind itself.\nOne autumn, a storm settled above the town and would not move. The wind had a thousand elbows; it shoved shutters, bent chimneys, and knocked baskets down the lanes. The elders asked whether any song could persuade it to travel on.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-weaver-of-storm-songs-assets/page1.jpg"}, {"text": "2. The Song of Command\nLio stretched red wool across his loom and wove a song with straight, tight lines: GO, GO, GO. He carried it to the hilltop and sang the words into the storm. The wind snapped the cloth like a flag and hurled his cap into a pond.\n\"It refuses orders,\" said the baker. Lio blamed the weak wool, but he saved one torn red thread around the loom's handle. In many old tales, the first attempt reveals pride before wisdom. Lio had not noticed that pattern yet.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-weaver-of-storm-songs-assets/page2.jpg"}, {"text": "3. The Song of Praise\nNext Lio wove gold grass into loops and sang, O MIGHTY WIND, STRONGEST OF ALL. The storm puffed proudly. It lifted three roofs, spun the weather vane backward, and scattered the baker's flour like pale smoke.\n\"It enjoys praise too much,\" said the mason. Lio tied one gold blade beside the red thread. His second song had recognized the wind's strength but ignored the town's need. Flattery was a soft rope that pulled in the wrong direction.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-weaver-of-storm-songs-assets/page3.jpg"}, {"text": "4. The Song of Silence\nFor the third song, Lio used gray wool and wove no words at all. He held the blank cloth high, hoping silence would swallow the storm. Instead, the wind filled every empty space and made the cloth boom like a great drum.\nThe townspeople covered their ears. Lio tied one gray strand beside the red and gold. He had ordered, praised, and ignored the wind. Three attempts had failed because each began with what Lio wanted to say, not with what he needed to hear.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-weaver-of-storm-songs-assets/page4.jpg"}, {"text": "5. Listening at the Hollow\nLio climbed into a sheltered hollow and set the loom on the ground. Without his own song, he heard the storm's pattern: rush, pause, turn; rush, pause, turn. Between gusts came a thin whistle from the mountain pass, blocked by fallen branches.\nThe storm was not refusing to leave. It could not find its usual road. Lio gathered the red, gold, and gray strands. Command had supplied direction, praise had noticed strength, and silence had made room to listen. Each failure held one useful thread.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-weaver-of-storm-songs-assets/page5.jpg"}, {"text": "6. The Song with an Opening\nThe townspeople cleared the fallen branches while Lio wove the three strands into a spiral with an open center. His new song matched the storm: rush, pause, turn. It did not demand or flatter. It showed the wind a shape it already knew.\nThe gusts circled the cloth once, twice, three times. Then they streamed through the cleared pass. Roofs stopped singing. Chimneys stood still. The storm traveled east, carrying Lio's final note like a small blue bird.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-weaver-of-storm-songs-assets/page6.jpg"}, {"text": "7. Threads of a Tale\nLio hung the spiral cloth in the meeting hall beside the walnut loom. He did not cut away the uneven places. They showed where each attempt had become part of the answer. Children traced the three colored strands and retold the story in threes.\nSome said Lio had conquered the storm. The elders corrected them: he had listened and helped open a road. That difference became the tale's strongest thread. In Bellweather, people still say that a difficult voice may sound like noise until someone makes room for its pattern.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-weaver-of-storm-songs-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did Lio wish he could weave, beyond wool, flax, and grass?", "choices": ["Gold and silver thread", "Songs for the elders only", "The wind itself"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "He could weave wool, flax, and grass, but he wished to weave the wind itself."}, {"q": "What happened when Lio sang his first song, the Song of Command?", "choices": ["The wind snapped the cloth like a flag and hurled his cap into a pond", "The storm calmed down immediately", "Nothing happened at all"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "The wind snapped the cloth like a flag and hurled his cap into a pond."}, {"q": "What did the wind do in response to the Song of Praise?", "choices": ["It quietly drifted away", "It puffed proudly, lifted roofs, and scattered the baker's flour", "It wove its own song back"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "The storm puffed proudly. It lifted three roofs and scattered the baker's flour."}, {"q": "What did Lio hear when he stopped singing and simply listened at the hollow?", "choices": ["Complete silence with nothing at all", "Another weaver's song from far away", "The storm's pattern: rush, pause, turn, and a thin whistle from the blocked mountain pass"], "answer": 2, "evidencePage": 5, "hint": "Look at page 5.", "explain": "He heard the storm's pattern, and between gusts came a thin whistle from the mountain pass."}, {"q": "What is the big idea of this story?", "choices": ["A difficult voice may sound like noise until someone makes room for its pattern", "Storms should always be commanded to leave", "Only the loudest song can move a storm"], "answer": 0, "evidencePage": 7, "hint": "Look at the last page.", "explain": "In Bellweather, people still say that a difficult voice may sound like noise until someone makes room for its pattern."}], "grammar": [{"q": "'Lio blamed the weak wool, ___ he saved one torn red thread around the loom's handle.' Which word shows contrast?", "choices": ["so", "because", "but"], "answer": 2, "evidencePage": 2, "hint": "This word contrasts blaming the wool with still keeping the thread.", "explain": "'But' contrasts Lio blaming the wool with him still saving the thread.", "teach": "<b>But</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>but</b>(但是)表示两个事实之间的<b>对比</b>。</span>"}, {"q": "'Command had supplied direction, praise had noticed strength, ___ silence had made room to listen.' Which word joins the last item in this list?", "choices": ["and", "but", "so"], "answer": 0, "evidencePage": 5, "hint": "This word joins the final item to the list.", "explain": "'And' joins the last item—silence—to the list of what each song had supplied.", "teach": "<b>And</b> joins the <b>last item</b> in a list.<span class='cn'><b>and</b>(和)连接一系列事物中的<b>最后一项</b>。</span>"}, {"q": "'The gusts circled the cloth once, twice, three times. ___ they streamed through the cleared pass.' Which word signals what happened next?", "choices": ["Before", "Then", "Never"], "answer": 1, "evidencePage": 6, "hint": "This word signals the next thing that happened.", "explain": "'Then' signals the next step: first the gusts circled, then they streamed through the pass.", "teach": "<b>Then</b> signals the <b>next step</b> in a sequence of events.<span class='cn'><b>then</b>(然后)标志一系列事件中的<b>下一步</b>。</span>"}], "vocabulary": [{"q": "'Apprentice' means ___.", "choices": ["a fully trained master of a craft", "a type of musical instrument", "someone learning a skill from an experienced worker"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Lio, the youngest apprentice weaver, wore a blue sash."}, {"q": "'Persuade' means ___.", "choices": ["to convince someone to do or believe something", "to ignore someone completely", "to weave cloth quickly"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "The elders asked whether any song could persuade it to travel on."}, {"q": "'Flattery' means ___.", "choices": ["a strong, honest criticism", "excessive praise, often insincere, meant to please someone", "a type of storm cloud"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Flattery was a soft rope that pulled in the wrong direction."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(apprentice|persuade|flattery)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 4 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function saveProgress(){try{localStorage.setItem("les-the-weaver-of-storm-songs-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-weaver-of-storm-songs"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-weaver-of-storm-songs",bookTitle:"The Weaver of Storm Songs",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.
