const pages=[{"type": "cover", "title": "The Echo Beneath the Stage", "subtitle": "A Strange Voice, a Careful Clue, and a Mystery Worth Listening To.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-echo-beneath-the-stage-assets/cover.jpg"}, {"text": "1. The Voice After the Line\n“The treasure is not gold,” Sofia declared from center stage. A heartbeat later, a thin voice answered, “Not gold.” Everyone in the school play froze. Malik dropped the cardboard lantern he was carrying. Their teacher, Ms. Reed, checked the sound booth, but its switches were off.\nThey tried the scene again. This time the voice returned only the last sound: “Old.” It seemed to come from beneath the stage-left floor. Sofia pictured hidden speakers and a brilliant prank. Malik knelt near a small brass grille. “Before we decide,” he said, “we need to know when it happens.”", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-echo-beneath-the-stage-assets/page1.jpg"}, {"text": "2. A Pattern in the Curtain\nWith Ms. Reed supervising, Sofia and Malik made a chart. They spoke from center stage, stage right, and stage left. The echo was strongest near the grille. It nearly vanished when the heavy curtain was open, then sharpened when the curtain closed behind them.\nSofia searched for wires, but Ms. Reed reminded her not to touch any equipment. Malik clapped once. The sound bounced from the curtain and returned as a soft metallic buzz. “Maybe no one is making a voice,” he said. Sofia frowned. An echo that sounded like words seemed less exciting than a secret recording, but it matched their evidence.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-echo-beneath-the-stage-assets/page2.jpg"}, {"text": "3. The Old Floor Plan\nIn the lobby display case, an old floor plan showed the auditorium before its renovation. A narrow tube once connected the orchestra pit to a prompter's corner near stage left. Actors could receive quiet reminders without the audience noticing. On the plan, the tube ended exactly below the brass grille.\nThe next morning, the facilities manager, Mr. Chao, opened the access panel while the students watched from a safe distance. The speaking tube had been disconnected long ago. Inside it, a loose round cover trembled whenever sound entered. The tube was not playing a message. It was catching sound, carrying it, and changing it.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-echo-beneath-the-stage-assets/page3.jpg"}, {"text": "4. Words That Changed Shape\nThey tested short phrases while Mr. Chao listened below. Long vowel sounds traveled clearly, while quick consonants faded. When Sofia said “not gold,” the tube returned the strongest part, which sounded like “old.” The curtain reflected the sound toward the grille, and the loose cover added its bright, ringing tone.\nSofia crossed “hidden recording” off their list. She did not feel disappointed anymore. The real explanation used more clues than her prank idea had. “The voice was our own sound wearing a metal costume,” she said. Malik wrote that comparison at the top of their chart.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-echo-beneath-the-stage-assets/page4.jpg"}, {"text": "5. A Mystery Solved Safely\nMr. Chao secured the loose cover and marked the old tube for a later inspection. The mysterious voice disappeared. Ms. Reed was relieved, but the scene suddenly felt flat. Its treasure hunter needed to understand that the treasure was knowledge, not gold, and Sofia missed the strange reply.\nMalik suggested that the cast create a planned echo themselves. Three actors stood at different distances and repeated one word in softer voices. Unlike the old tube, their chorus could be practiced, controlled, and changed. Sofia listened carefully, moving each actor until the sound faded like a thought.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-echo-beneath-the-stage-assets/page5.jpg"}, {"text": "6. Opening Night\nOn opening night, Sofia reached the important line. “The treasure is not gold.” From the shadows, the cast answered, “Not gold… gold…” The audience leaned forward. Then Sofia lifted the cardboard lantern and revealed the lost books in the final scene.\nAfter the applause, a younger student asked how the echo worked. Sofia almost told the answer immediately. Instead, she showed him their chart and asked what pattern he noticed. His finger moved from the open curtain test to the closed one. “The curtain mattered,” he said. Sofia smiled. Evidence had opened the mystery for someone else.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-echo-beneath-the-stage-assets/page6.jpg"}, {"text": "7. The Best Kind of Answer\nThe next week, Ms. Reed hung the investigation chart backstage. It included Sofia's first guess, Malik's questions, the old floor plan, and the sound tests. No one erased the wrong guess. It showed how their thinking had changed.\nSofia stood on the quiet stage and said, “Mystery solved.” Nothing answered from below. Still, she heard the faint rustle of the curtain, the hum of the lights, and Malik tapping a careful rhythm on his clipboard. The theater had not become less mysterious, but she had simply learned that listening closely could turn wonder into understanding.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-echo-beneath-the-stage-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What happened right after Sofia said her line on stage?", "choices": ["A thin voice answered back part of what she said", "The lights went out", "The curtain fell down"], "answer": 0, "evidencePage": 1, "hint": "Look at chapter 1.", "explain": "A heartbeat later, a thin voice answered, “Not gold.”"}, {"q": "What did Sofia and Malik discover about when the echo was strongest?", "choices": ["It never changed no matter what they did", "It was strongest near the grille and when the curtain was closed", "It only happened when Ms. Reed was in the room"], "answer": 1, "evidencePage": 2, "hint": "Look at chapter 2.", "explain": "The echo was strongest near the grille, and it sharpened when the curtain closed."}, {"q": "What did the old floor plan reveal?", "choices": ["A hidden treasure room", "A secret second stage", "A narrow tube once connected the orchestra pit to a spot near stage left"], "answer": 2, "evidencePage": 3, "hint": "Look at chapter 3.", "explain": "A narrow tube once connected the orchestra pit to a prompter's corner near stage left."}, {"q": "What did Mr. Chao find inside the old tube?", "choices": ["A loose round cover that trembled whenever sound entered", "A modern speaker system", "Nothing at all"], "answer": 0, "evidencePage": 3, "hint": "Look at chapter 3.", "explain": "Inside it, a loose round cover trembled whenever sound entered."}, {"q": "What is the big idea of this story?", "choices": ["Only adults can solve real mysteries", "A strange voice, a careful clue, and a mystery worth listening to—evidence can turn wonder into understanding", "Mysteries are never worth solving carefully"], "answer": 1, "evidencePage": 7, "hint": "Look at the last chapter.", "explain": "She had learned that listening closely could turn wonder into understanding."}], "grammar": [{"q": "“An echo that sounded like words seemed less exciting than a secret recording, ___ it matched their evidence.” Which word shows contrast?", "choices": ["but", "so", "because"], "answer": 0, "evidencePage": 2, "hint": "This word contrasts being less exciting with matching the evidence.", "explain": "“But” contrasts the less-exciting explanation with the fact that it matched the evidence.", "teach": "<b>But</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>but</b>(但是)表示两个事实之间的<b>对比</b>。</span>"}, {"q": "“Long vowel sounds traveled clearly, ___ quick consonants faded.” Which word shows contrast between the two kinds of sounds?", "choices": ["so", "while", "because"], "answer": 1, "evidencePage": 4, "hint": "This word contrasts how two kinds of sounds behaved.", "explain": "“While” contrasts long vowel sounds traveling clearly with quick consonants fading.", "teach": "<b>X, while Y</b> shows a <b>contrast</b> between two things.<span class='cn'><b>while</b>(然而)表示两者之间的<b>对比</b>。</span>"}, {"q": "“The theater had not become less mysterious, ___ she had simply learned that listening closely could turn wonder into understanding.” Which word shows contrast?", "choices": ["so", "because", "but"], "answer": 2, "evidencePage": 7, "hint": "This word contrasts the theater staying mysterious with what Sofia learned.", "explain": "“But” contrasts the theater staying mysterious with Sofia's new understanding.", "teach": "<b>But</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>but</b>(但是)表示两个事实之间的<b>对比</b>。</span>"}], "vocabulary": [{"q": "‘Echo’ means ___.", "choices": ["a sound that repeats after bouncing off a surface", "a type of curtain", "a type of stage light"], "answer": 0, "evidencePage": 1, "hint": "Look at chapter 1.", "explain": "A thin voice answered back part of what Sofia said—an echo."}, {"q": "‘Reflected’ means ___.", "choices": ["absorbed completely", "bounced back off a surface", "created from nothing"], "answer": 1, "evidencePage": 4, "hint": "Look at chapter 4.", "explain": "The curtain reflected the sound toward the grille."}, {"q": "‘Disappointed’ means ___.", "choices": ["feeling extremely excited", "feeling completely confused", "feeling let down because something wasn't as hoped"], "answer": 2, "evidencePage": 4, "hint": "Look at chapter 4.", "explain": "She did not feel disappointed anymore, once she understood the real explanation."}]};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(echo|reflected|disappointed)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 4 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else{const __wc=(p.text||"").split(/\s+/).filter(Boolean).length;view.innerHTML=`<div class="book-page${__wc>55?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;}document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}

function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function saveProgress(){try{localStorage.setItem("les-the-echo-beneath-the-stage-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-echo-beneath-the-stage"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-echo-beneath-the-stage",bookTitle:"The Echo Beneath the Stage",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.
