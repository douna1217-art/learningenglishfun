<script>

const pages=[{"type": "cover", "title": "The Snowline Orchard", "subtitle": "An Old Farm Journal and a Warm Winter Challenge One Family's Idea of Tradition", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-snowline-orchard-assets/cover.jpg"}, {"text": "1. Blossoms Before the Snowmelt\nThe peach trees usually bloomed when snow disappeared from the lower ridge. That year, pink petals opened while the mountain still wore a narrow white stripe.\nGrandpa Tomas called it a lucky early spring. Elena worried that one cold night could damage every blossom. Noah asked which belief the orchard records supported.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-snowline-orchard-assets/page1.jpg"}, {"text": "2. The Journal's Pattern\nThe family journal contained seventy years of bloom sketches, bird arrivals, and frost marks. Elena found that early blossoms had survived twice and failed three times.\nGrandpa Tomas remembered only the successful years because those harvests became family celebrations. The journal held quieter seasons that memory had allowed to fade.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-snowline-orchard-assets/page2.jpg"}, {"text": "3. Birds Before Bees\nNoah noticed that meadowlarks had returned, but few bees visited the blossoms. Warm afternoons had opened flowers before the bee colonies became active.\nElena first blamed the cold hives. Then she observed blossoms facing the sunny slope receiving more visitors than those in shade. Temperature, timing, and location worked together.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-snowline-orchard-assets/page3.jpg"}, {"text": "4. The Forecast Divides the Family\nA frost warning arrived. Grandpa Tomas wanted to protect the oldest trees, whose fruit had won prizes. Elena argued for the youngest block because it represented future harvests.\nNoah mapped low places where cold air collected. The threatened trees did not fit either age group. Evidence shifted the question from which trees mattered most to which trees faced the greatest risk.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-snowline-orchard-assets/page4.jpg"}, {"text": "5. Protecting More With Less\nThere was not enough frost cloth for every tree. The family covered the low rows, moved water barrels among them to hold daytime warmth, and left upper blossoms exposed.\nElena worried the plan looked uneven. Grandpa Tomas said farming had never meant treating every tree identically. Fair care responded to different conditions.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-snowline-orchard-assets/page5.jpg"}, {"text": "6. Frost Along the Ground\nBefore dawn, frost silvered the grass. The covered low rows stayed just warm enough, while a few exposed blossoms at the bottom of the hill turned brown.\nThe upper orchard remained unharmed. Their plan had not saved every flower, but it protected far more than the family's first two proposals would have done.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-snowline-orchard-assets/page6.jpg"}, {"text": "7. A New Line in the Journal\nGrandpa Tomas drew the year's higher snowline and added the early bloom, missing bees, and cold-air map. He handed the pencil to Elena for the final harvest symbol.\nShe left the space blank until summer. Tradition, she realized, was not repeating an old answer. It was keeping a long conversation honest enough for the next generation to continue.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-snowline-orchard-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "Why did Elena worry about the early blossoms?", "choices": ["She feared one cold night could damage every blossom", "She was worried about too many bees arriving", "She thought the trees would never bloom at all"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Elena worried that one cold night could damage every blossom, even though Grandpa Tomas called the early spring lucky."}, {"q": "What did Elena discover in the family journal?", "choices": ["The journal contained no useful records at all", "Early blossoms had always survived without exception", "Early blossoms had survived twice and failed three times in the past"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Elena found that early blossoms had survived twice and failed three times, showing the journal held a fuller picture than memory alone."}, {"q": "Why had few bees visited the early blossoms?", "choices": ["The blossoms had no scent for bees to find", "Warm afternoons opened flowers before the bee colonies became active", "All the bees had left the orchard forever"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Noah noticed that warm afternoons had opened flowers before the bee colonies became active, so few bees were available to visit them."}, {"q": "What did Noah's mapping reveal about the threatened trees?", "choices": ["The trees most at risk didn't fit neatly into either the oldest or youngest group", "Only the very oldest trees were ever at risk", "Every single tree faced exactly the same risk"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Noah mapped where cold air collected and found the threatened trees didn't match either age group, shifting the question to which trees faced the greatest risk."}, {"q": "What was the result of the family's frost protection plan?", "choices": ["The entire orchard was damaged by the frost", "Every single blossom in the orchard was saved", "The covered low rows stayed warm enough, though a few exposed blossoms still turned brown"], "answer": 2, "evidencePage": 6, "hint": "Look at page 6.", "explain": "The covered low rows stayed warm enough and the upper orchard was unharmed, though a few exposed blossoms at the bottom of the hill turned brown."}], "grammar": [{"q": "'Grandpa Tomas remembered only the successful years ___ those harvests became family celebrations.' Which word shows a reason?", "choices": ["because", "although", "unless"], "answer": 0, "evidencePage": 2, "hint": "This word introduces the reason behind something.", "explain": "'Because' introduces the reason Grandpa Tomas remembered mainly the good years — they became family celebrations.", "teach": "<b>Because</b> introduces the <b>reason</b> for something.<span class='cn'><b>because</b>用来引出<b>原因</b>。</span>"}, {"q": "'___ there was not enough frost cloth for every tree, the family found a plan that protected far more than expected.' Which word correctly starts this sentence?", "choices": ["Although", "So", "Because"], "answer": 0, "evidencePage": 5, "hint": "This word shows the second idea contrasts with what might be expected from the first.", "explain": "'Although' introduces a contrast: even with limited frost cloth, the family still protected much of the orchard.", "teach": "<b>Although</b> introduces an <b>unexpected contrast</b>.<span class='cn'><b>although</b> 引出一个出人意料的<b>转折</b>。</span>"}, {"q": "Which sentence correctly uses a semicolon to join two related complete thoughts?", "choices": ["The plan did not save every flower, it protected far more than the first two proposals would have;", "The plan did not save every flower; it protected far more than the first two proposals would have.", "The plan; did not save every flower it protected far more than the first two proposals would have."], "answer": 1, "evidencePage": 6, "hint": "A semicolon joins two complete sentences that are closely related.", "explain": "The semicolon correctly joins two related complete thoughts without needing a conjunction.", "teach": "<b>A semicolon</b> joins two <b>closely related complete sentences</b>.<span class='cn'><b>分号</b>连接两个意思相关的<b>完整句子</b>。</span>"}], "vocabulary": [{"q": "'Tradition' means ___.", "choices": ["a single event that never repeats", "a custom or belief passed down over time", "a scientific tool used to measure frost"], "answer": 1, "evidencePage": 7, "hint": "Look at page 7.", "explain": "Elena realized tradition was not repeating an old answer, but keeping an honest, ongoing conversation for the next generation."}, {"q": "'Identically' means ___.", "choices": ["in a completely different way each time", "in a way that changes constantly", "in exactly the same way"], "answer": 2, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Grandpa Tomas said farming never meant treating every tree identically — in exactly the same way — since conditions varied."}, {"q": "'Harvest' means ___.", "choices": ["a type of frost that damages trees", "the gathering of crops that have grown", "a tool used to plant new seeds"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Grandpa Tomas remembered the years when good harvests became family celebrations, though the journal recorded quieter seasons too."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(tradition|identically|harvest)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 5 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}
