<script>/*les-speech-shim*/
(function(){var w=window,ok=false,errs=[];
/* Some Android in-app browsers (UC/Quark and other vendor kernels, older WebViews) have no
   speechSynthesis at all. The page script calls it while loading, so it stopped there and the
   story was never drawn (the quiz still worked because its handlers were bound earlier).
   Give such browsers a silent stand-in so the rest of the page runs normally. */
try{ok=typeof w.speechSynthesis==="object"&&w.speechSynthesis!==null}catch(e){}
if(typeof w.SpeechSynthesisUtterance!=="function"&&typeof w.SpeechSynthesisUtterance!=="object"){
w.SpeechSynthesisUtterance=function(t){this.text=t==null?"":String(t);this.lang="";this.rate=1;this.pitch=1;this.volume=1;this.voice=null}}
if(!ok){var gen=0,told=false;
w.speechSynthesis={speaking:false,paused:false,pending:false,
getVoices:function(){return[]},cancel:function(){gen++},pause:function(){},resume:function(){},
addEventListener:function(){},removeEventListener:function(){},
speak:function(u){var g=gen;
if(!told&&typeof w.setStatus==="function"){told=true;try{w.setStatus("This browser can't read aloud, but you can still read and practice. 当前浏览器不支持朗读，仍可阅读和做题。",false)}catch(e){}}
setTimeout(function(){if(g===gen&&u&&u.onstart){try{u.onstart({})}catch(e){}}},0);
setTimeout(function(){if(g===gen&&u&&u.onend){try{u.onend({})}catch(e){}}},Math.max(600,String(u&&u.text||"").length*60))}}}
/* If the story still is not drawn after loading, say why on the page itself, so a screenshot
   from a phone we cannot test on shows the cause. */
w.addEventListener("error",function(e){try{if(errs.length<3)errs.push(String(e&&e.message||e))}catch(x){}});

d.style.cssText="padding:24px;color:#b91c1c;font:15px/1.6 sans-serif";

})();

<script>

const pages=[{"type": "cover", "title": "The Sandship with Two Captains", "subtitle": "Two Cousins Argue About Who Should Navigate a Desert Sandship and Discover That the Best Route Uses Both of Their Ideas", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-sandship-with-two-captains-assets/cover.jpg"}, {"text": "1. Two Ways to Arrive\nNessa had planned their arrival at Red Rock before they left home. She would stand beside Aunt Sen at the sandship's wheel, recognize the harbor flags, and call the final turn. Her cousin Ivo could carry the parcels. Ivo had apparently imagined a similar arrival, except that Nessa would be carrying them. They discovered this while arguing over the front seat of the supply wagon.\nNow they stood on Aunt Sen's deck, watching the last garden disappear behind a dune. The ship's runners whispered over sand. A little wind could move a sandship in this country, provided its hull had been carved from singing cedar. Nessa had crossed the desert twice. Ivo had never crossed it, a fact she mentioned whenever he offered advice. Aunt Sen gave them one shared task, which was to find the route to the old stone shelter before the afternoon winds arrived.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-sandship-with-two-captains-assets/page1.jpg"}, {"text": "2. The Straight Line\nNessa spread the route sheet on a low deck chest. Three dark rocks, shaped like teeth, marked the western side of the crossing. From there, a straight line led to the shelter. She traced it with one finger. Ivo leaned over her shoulder and asked why the line passed through a patch of little dots. “Old dunes,” she said. “They were barely higher than the runners last time.”\nIvo looked from the sheet to the horizon. The dunes ahead seemed taller than that. Nessa explained that distant things could look different in the morning light. She sounded like Aunt Sen explaining a proper fact. It was pleasant enough that she explained it twice. Aunt Sen listened, then asked each cousin what they would look for next. Nessa said the three rocks. Ivo said a break in the dunes. Neither liked the other's answer.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-sandship-with-two-captains-assets/page2.jpg"}, {"text": "3. Where the Route Had Gone\nBy noon, the three rocks stood exactly where Nessa expected them. The rest of the desert did not. A steep dune lay across the straight route. Its face was smooth and unbroken, and the wind blew loose sand from its crest. Aunt Sen eased the ship to a stop on firm ground. Nessa checked the rocks, the sun, and the route sheet, in that order. None of them moved the dune.\n“It wasn't there before,” she said. Ivo opened his mouth. She waited for him to say that he had noticed first. Instead, he pointed along the foot of the dune. A shallow passage curved north, between the sand and a line of low stone. It might reach the shelter. Nessa folded the sheet too sharply. “Might,” she repeated. Aunt Sen lowered the sail. They would examine the passage before deciding. Nobody was taking a ship into a guess.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-sandship-with-two-captains-assets/page3.jpg"}, {"text": "4. A Passage, Not a Promise\nThey climbed down the short stern ladder and walked a little way together. The passage was wide enough for the runners, but it bent out of sight. Beyond the bend, Nessa recognized a pale pillar with a split top. Her old route had passed on its other side. If they kept the pillar to their left, they should reach the shelter's southern entrance. Ivo wanted to continue at once.\nThen a faint veil of sand lifted between the distant rocks. Aunt Sen watched it for several breaths. The afternoon wind was arriving early. They returned to the ship, and she raised only a small corner of sail. Nessa stood beside the wheel to call the bends. Ivo watched the runner on the stone side. They were using his passage and her remembered landmark. Nessa still wished the route had been entirely hers.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-sandship-with-two-captains-assets/page4.jpg"}, {"text": "5. The Bend Before the Shelter\nThe passage narrowed after the second bend. Ivo called that the left runner was coming close to stone. Nessa could see the split pillar ahead. Beyond it stood the shelter, a low building with a broad opening. She called for a turn toward it. Aunt Sen began the turn, then stopped when Ivo shouted. The stone beside his runner rose higher than it had looked from the wheel.\nNessa wanted one more moment to make her instructions work. Behind them, the veil had become a brown curtain. “Back a little,” Ivo said. “There's room behind us to turn wider.” Nessa looked back. There was. She told Aunt Sen to reverse. Together they pushed long poles against the sand while she controlled the wheel. The ship slid backward, slowly and without dignity. Then its bow swung clear of the rock.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-sandship-with-two-captains-assets/page5.jpg"}, {"text": "6. Inside the Stone Walls\nThey reached the shelter with sand already ticking against the hull. Aunt Sen brought the ship completely inside, where the entrance faced away from the wind. Ivo secured the sail while Nessa carried their water jar to the wall. Outside, the pillar disappeared. They sat on the deck and listened to the desert pouring past the doorway like an enormous sack being emptied.\nNessa said she should have called for the wider turn sooner. Ivo said he had nearly urged them around the first bend without looking. Aunt Sen handed them bread. “You both noticed useful things,” she said. “Eventually, you both said them.” Nessa picked a grain of sand from the crust. She had imagined arriving as someone who knew the way. Instead, she had arrived because Ivo saw a rock she had been trying not to see.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-sandship-with-two-captains-assets/page6.jpg"}, {"text": "7. A Different Arrival\nThe wind dropped before sunset. They left the shelter and followed the remaining route to Red Rock, where the harbor was a flat yard instead of water. Nessa recognized the flags. She also noticed a stack of crates beside the usual approach and told Ivo to watch that side. He called the distance while Aunt Sen steered. The runners stopped neatly between two painted stones.\nA dockworker asked which cousin had navigated. Nessa looked at Ivo, who was already reaching for the parcels. “Both,” she said. He handed her a small box and kept the heavier one. Later, she unfolded the route sheet to mark the new dune. Ivo began describing the passage. She moved her finger from the paper and let him point. The mark he made was crooked. She left it that way, because it showed where they had actually gone.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-sandship-with-two-captains-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What shared task did Aunt Sen give the cousins?", "choices": ["To find the route to the old stone shelter before the afternoon winds arrived", "To carry the parcels to Red Rock", "To repair the sail"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Aunt Sen gave them one shared task, to find the route to the old stone shelter."}, {"q": "What stopped the ship at noon?", "choices": ["A steep dune lay across the straight route", "A broken runner", "The wind stopped blowing"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "A steep dune lay across the straight route."}, {"q": "What did Ivo find?", "choices": ["A faster road", "A hidden spring", "A shallow passage curving north between the sand and a line of low stone"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "He pointed along the foot of the dune and showed a shallow passage."}, {"q": "How did the ship get past the rock near the shelter?", "choices": ["They waited for the wind to stop", "Ivo warned that the stone was close, Nessa told Aunt Sen to reverse, and they pushed poles against the sand", "They tied a rope to the pillar"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Ivo said there was room to turn wider, and Nessa told Aunt Sen to reverse."}, {"q": "What did Nessa say when a dockworker asked who had navigated?", "choices": ["Both", "Aunt Sen", "Ivo"], "answer": 0, "evidencePage": 7, "hint": "Look at page 7.", "explain": "Nessa said, “Both.”"}], "grammar": [{"q": "‘Each cousin ___ a different idea.’ Which word belongs in the blank?", "choices": ["have", "were having", "had"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Each is singular, so it takes had.", "teach": "<b>Each</b> and <b>neither</b> are singular, so they take <b>has</b> or <b>had</b>, like <b>Each cousin had</b> an idea.<span class='cn'><b>each</b> 和 <b>neither</b> 是单数，要配 <b>has</b> 或 <b>had</b>，比如 <b>Each cousin had</b> an idea。</span>"}, {"q": "The Latin root ‘nav’ means ‘ship’. Which word shares this root?", "choices": ["navy", "novel", "native"], "answer": 0, "evidencePage": 7, "hint": "Look at page 7.", "explain": "A navy is made of ships, so it shares the root nav.", "teach": "The Latin root <b>nav</b> means ship, so <b>navigated</b> and <b>navy</b> both connect to ships.<span class='cn'>拉丁词根 <b>nav</b> 表示“船”，所以 <b>navigated</b> 和 <b>navy</b> 都和船有关。</span>"}, {"q": "‘She sounded like Aunt Sen explaining a proper fact. It was pleasant enough that she explained it twice.’ What does this show about Nessa?", "choices": ["She forgot the route", "She enjoyed feeling like an expert", "She was afraid of Ivo"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Nessa repeats the fact because acting like an expert feels good.", "teach": "<b>Characterization</b> shows what a character is like through what they do, like explaining a fact twice because it feels good.<span class='cn'><b>人物刻画</b>通过角色的行为展示性格，比如因为感觉好而把同一件事解释两遍。</span>"}], "vocabulary": [{"q": "‘Horizon’ means ___.", "choices": ["a kind of boat", "the line where the land and sky seem to meet", "a stone shelter"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Ivo looked from the sheet to the horizon."}, {"q": "‘Landmark’ means ___.", "choices": ["a hidden treasure", "a type of sand", "an easy-to-see object that helps people find their way"], "answer": 2, "evidencePage": 4, "hint": "Look at page 4.", "explain": "They were using his passage and her remembered landmark."}, {"q": "‘Navigated’ means ___.", "choices": ["built a boat", "found and followed the way", "carried a heavy box"], "answer": 1, "evidencePage": 7, "hint": "Look at page 7.", "explain": "A dockworker asked which cousin had navigated."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(horizon|landmark|navigated)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 6 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}var TEACH_ICONS='<svg class="ic i-spk" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.5v5h3.6l4.9 4.5V5L7.6 9.5H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.6 9.2a4 4 0 010 5.6M18.2 6.6a7.6 7.6 0 010 10.8"/></svg><svg class="ic i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></svg><svg class="ic i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 5.3v13.4c0 .8.9 1.3 1.6.8l9.6-6.7c.6-.4.6-1.2 0-1.6L9.8 4.5c-.7-.5-1.6 0-1.6.8z"/></svg>';var _tp=null;function _tpSet(b,st){if(!b)return;b.classList.toggle('is-playing',st==='playing');b.classList.toggle('is-paused',st==='paused');b.setAttribute('aria-pressed',st==='playing'?'true':'false');var z=b.dataset.part==='cn',L=st==='playing'?(z?'\u6682\u505C':'Pause'):st==='paused'?(z?'\u7EE7\u7EED\u64AD\u653E':'Resume'):b.dataset.label;b.setAttribute('aria-label',L);b.title=L;}function stopTeachAudio(){var c=_tp;if(!c)return;_tp=null;try{if(c.audio){c.audio.onended=c.audio.onerror=c.audio.ontimeupdate=null;c.audio.pause();}}catch(e){}if(c.mode==='tts'){try{speechSynthesis.cancel();}catch(e){}}_tpSet(c.btn,'idle');}function _tpFallback(btn){try{var u=new SpeechSynthesisUtterance(btn.dataset.text||'');u.lang=btn.dataset.lang||'en-US';var cur={btn:btn,mode:'tts'};_tp=cur;u.onend=u.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');}};_tpSet(btn,'playing');speechSynthesis.speak(u);}catch(e){}}function playTeachAudio(btn){if(_tp&&_tp.btn===btn){if(_tp.mode==='audio'){var a0=_tp.audio;if(a0.paused){var p0=a0.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}
