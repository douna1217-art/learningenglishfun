<script>

const pages=[{"type": "cover", "title": "The Laugh I Added", "subtitle": "A Student Who Laughed at a Classmate’s Unwanted Nickname Decides What to Do Instead of Joining In", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-laugh-i-added-assets/cover.jpg"}, {"text": "1. The Extra Laugh\nOwen had saved me a place at his lunch table for three days. By Thursday, I no longer approached it wondering whether the place was still mine. He could make ordinary things funny, like the way a door squeaked, the shape of a carrot, or our principal's habit of saying briefly before a long announcement. I liked being close enough to hear the quiet jokes.\nThat morning, Nell answered a question in class and added a fact nobody had asked for. Owen whispered, “Thank you, Professor.” Two people smiled. Nell turned around and said she didn't like being called that. Owen spread his hands, as though she had made a small joke unnecessarily difficult. I laughed. Not loudly enough for the whole room, but loudly enough for her. She looked at me before facing forward. It took less than a second. I thought about it through the rest of class.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-laugh-i-added-assets/page1.jpg"}, {"text": "2. An Explanation for Myself\nAt lunch, Nell sat two tables away. Owen told a story about his little brother putting a sock on the dog. I laughed at that too. This time, nobody looked hurt, which helped me explain the morning to myself. Owen joked about everybody. I had laughed because I was surprised. Nell probably knew I wasn't against her. I had never actually called her anything.\nThen she passed our table carrying an empty tray. Owen asked whether the Professor had a lecture for us. Nell kept walking. I looked down at my sandwich. I did not laugh, and I was briefly pleased with myself for that. But I did not say her name either. Owen began another story. The place at the table still felt like mine. I could no longer pretend I didn't know what I was paying for it.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-laugh-i-added-assets/page2.jpg"}, {"text": "3. Beside the Same Page\nIn the next class, Ms. Lane paired Nell and me to discuss the choices made by two characters in our reading. I moved my chair beside her desk. She opened her book and placed a finger beside the passage we needed. I started talking too quickly. I wanted to sound like the sort of partner who had not laughed at her an hour earlier.\nAfter a while, I said I hadn't meant anything by it. Nell took her finger off the page. “I said I didn't like it,” she replied. I told her I knew Owen was joking. She looked at me. “I know that too.” There was no argument I could win by explaining the joke more clearly. She understood the morning perfectly well. I had been hoping the problem was something she had misunderstood.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-laugh-i-added-assets/page3.jpg"}, {"text": "4. Nobody Watching\nAfter school, I found Owen beside the bike racks. Nell had already left. He asked how my session with the Professor had gone. I felt the easy answer arrive in my mouth. Something about needing a notebook for all her extra facts. It would have been a small joke, and I knew exactly where he would laugh.\nI said her name was Nell. Owen raised his eyebrows. “I know her name.” I said she had asked him to use it. He told me to relax because it was only a joke. I had used almost those words at her desk. Hearing them from him did not make them sound kinder. For a moment, the bike racks seemed extremely quiet. I wanted Nell to be there to hear me. Then I was glad she wasn't, because I could not turn this into a performance for her.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-laugh-i-added-assets/page4.jpg"}, {"text": "5. The Place at the Table\nOwen said I had laughed too. I said I knew. This was the part I had wanted to leave out. It would have been easier if he alone had done something wrong and I had appeared afterward to object. He looked away, then asked whether I was still coming to lunch tomorrow. I said yes, unless the invitation depended on the nickname.\nHe rolled his eyes. I could not tell whether he was annoyed with me or with the conversation. We walked toward the school gate without settling it. Near the corner, he made a terrible imitation of his own singing voice. I smiled. That surprised me. The whole friendship had not vanished because I had refused one joke. It had become less comfortable, though, and I would have preferred to know how long that part would last.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-laugh-i-added-assets/page5.jpg"}, {"text": "6. What I Had Actually Done\nOn Friday, I asked Nell whether I could talk to her before class. I said I was sorry I had laughed after she asked Owen to stop. I did not add that I was surprised or that I had meant something else. She zipped her bag while I spoke. When I finished, she said she had heard me the first time.\nI almost told her about the bike racks. I wanted credit for a conversation she hadn't asked me to have. Instead, I asked whether there was anything I should do now. “Don't join in next time,” she said. Then she went into the classroom. She had not said we were friends. She had not said it was fine. I stood by the door until somebody behind me asked if I planned to stay there all morning.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-laugh-i-added-assets/page6.jpg"}, {"text": "7. The Next Discussion\nAt lunch, Owen called Nell by her name when he asked her to pass a chair. She passed it. I watched, then made myself look away. Her ordinary day did not have to become a series of signs about whether I was doing better. Owen saved me a place. I sat down and asked about his brother's dog.\nLater, Nell and I worked together again. I asked which passage she wanted to begin with. She chose one where a character kept insisting that he hadn't meant any harm. I wondered whether she had chosen it because of me, but I didn't ask. We read the passage, and I listened to what she thought. She disagreed with my first answer. I disagreed with her second one. We kept talking, without either of us needing a new name.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-laugh-i-added-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What happened after Owen called Nell Professor?", "choices": ["Nell said she did not like being called that, and the narrator laughed loudly enough for her to hear", "Nell left the room", "Everyone apologized"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Nell turned around and said she did not like being called that, and the narrator laughed."}, {"q": "How did the narrator explain the morning at lunch?", "choices": ["Owen joked about everybody, and the narrator had laughed because of surprise, never calling her anything", "The narrator decided Nell was wrong", "The narrator forgot the morning"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "The narrator told themselves that Owen joked about everybody and had never actually called Nell anything."}, {"q": "What did Nell say when the narrator said they hadn’t meant anything?", "choices": ["That she wanted a new partner", "That she had said she did not like it, and she knew Owen was joking too", "That she forgave the narrator"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "She said, “I said I didn’t like it,” and later, “I know that too.”"}, {"q": "What did the narrator do when Owen asked about the Professor?", "choices": ["Walked away without a word", "Said her name was Nell, instead of making the easy joke", "Told another joke"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "The narrator said her name was Nell."}, {"q": "What did Nell tell the narrator at the end of their talk?", "choices": ["It is fine.", "You are not my friend.", "Don’t join in next time."], "answer": 2, "evidencePage": 6, "hint": "Look at page 6.", "explain": "Nell said, “Don’t join in next time.”"}], "grammar": [{"q": "Which sentence is punctuated correctly?", "choices": ["“I said I didn’t like it” she replied.", "“I said I didn’t like it,” she replied.", "“I said I didn’t like it.” she replied."], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "A comma goes inside the quotation marks before words like she replied.", "teach": "A comma goes inside the quotation marks before words like <b>she replied</b>, as in <b>“I said I didn’t like it,” she replied.</b><span class='cn'>引语后面接 <b>she replied</b> 这类词时，逗号放在引号里面，比如 <b>“I said I didn’t like it,” she replied.</b></span>"}, {"q": "‘Then she ___ our table carrying an empty tray.’ Which word belongs in the blank?", "choices": ["past", "pasted", "passed"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "The sentence needs a past tense verb, passed.", "teach": "<b>Passed</b> is a verb, like <b>passed our table</b>, and <b>past</b> names a time or a place beyond something.<span class='cn'><b>passed</b> 是动词，比如 <b>passed our table</b>（经过我们的桌子）；<b>past</b> 表示过去的时间或经过某处。</span>"}, {"q": "‘I did not laugh, and I was briefly pleased with myself for that. But I did not say her name either.’ What does the word ‘But’ show?", "choices": ["The narrator realizes not laughing was not enough", "The narrator is proud", "The narrator is joking"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "The word But introduces a contrast with the pleased feeling.", "teach": "<b>But</b> signals a contrast, like the narrator being pleased about not laughing and then admitting not speaking up either.<span class='cn'><b>But</b> 表示转折，比如叙述者为没笑而得意，却又承认也没出声帮忙。</span>"}], "vocabulary": [{"q": "‘Nickname’ means ___.", "choices": ["a school rule", "a name used instead of someone’s real name", "a long speech"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "I said yes, unless the invitation depended on the nickname."}, {"q": "‘Invitation’ means ___.", "choices": ["a kind of joke", "a school test", "a request for someone to come or join"], "answer": 2, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Unless the invitation depended on the nickname."}, {"q": "‘Performance’ means ___.", "choices": ["a show done for others to watch", "a lost book", "a quiet rest"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "I could not turn this into a performance for her."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(nickname|performance|invitation)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 6 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}var TEACH_ICONS='<svg class="ic i-spk" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.5v5h3.6l4.9 4.5V5L7.6 9.5H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.6 9.2a4 4 0 010 5.6M18.2 6.6a7.6 7.6 0 010 10.8"/></svg><svg class="ic i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></svg><svg class="ic i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 5.3v13.4c0 .8.9 1.3 1.6.8l9.6-6.7c.6-.4.6-1.2 0-1.6L9.8 4.5c-.7-.5-1.6 0-1.6.8z"/></svg>';var _tp=null;function _tpSet(b,st){if(!b)return;b.classList.toggle('is-playing',st==='playing');b.classList.toggle('is-paused',st==='paused');b.setAttribute('aria-pressed',st==='playing'?'true':'false');var z=b.dataset.part==='cn',L=st==='playing'?(z?'\u6682\u505C':'Pause'):st==='paused'?(z?'\u7EE7\u7EED\u64AD\u653E':'Resume'):b.dataset.label;b.setAttribute('aria-label',L);b.title=L;}function stopTeachAudio(){var c=_tp;if(!c)return;_tp=null;try{if(c.audio){c.audio.onended=c.audio.onerror=c.audio.ontimeupdate=null;c.audio.pause();}}catch(e){}if(c.mode==='tts'){try{speechSynthesis.cancel();}catch(e){}}_tpSet(c.btn,'idle');}function _tpFallback(btn){try{var u=new SpeechSynthesisUtterance(btn.dataset.text||'');u.lang=btn.dataset.lang||'en-US';var cur={btn:btn,mode:'tts'};_tp=cur;u.onend=u.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');}};_tpSet(btn,'playing');speechSynthesis.speak(u);}catch(e){}}function playTeachAudio(btn){if(_tp&&_tp.btn===btn){if(_tp.mode==='audio'){var a0=_tp.audio;if(a0.paused){var p0=a0.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}
function returnToQuestion(){(function(){var b=document.getElementById("evidenceBanner");if(b&&b.parentNode)b.parentNode.removeChild(b);})();renderPanel();document.querySelector(".panel").scrollIntoView({behavior:"smooth",block:"start"})}
function nextQuestion(){const list=quizzes[activeTab];if(qIndex[activeTab]<list.length-1){qIndex[activeTab]++;renderPanel();return}completed[activeTab]=true;if(activeTab==="comprehension")activeTab="grammar";else if(activeTab==="grammar")activeTab="vocabulary";else{return showCompletion()}setTabs();renderPanel()}
function showCompletion(){completed.vocabulary=true;setTabs();const correct=Object.keys(selections).filter(k=>{const [tab,idx]=k.split('-');return selections[k]===quizzes[tab][+idx].answer}).length,total=Object.values(quizzes).reduce((a,b)=>a+b.length,0);document.getElementById("stagePill").textContent="Journey Complete";document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">Reading journey complete</div><h2>Wonderful work! 🎉</h2><p class="small">You finished Reading, Grammar, and Vocabulary.</p><div class="score-row"><div class="score-box"><b>${total}</b><br><span>Questions</span></div><div class="score-box"><b>${correct}</b><br><span>Correct now</span></div></div><div class="feedback good">You used evidence, practiced sentence skills, and learned new words.</div><button class="submit" onclick="restartPractice()">Practice Again</button></div>`}
function restartPractice(){activeTab="comprehension";qIndex={comprehension:0,grammar:0,vocabulary:0};selections={};attempts={};completed={comprehension:false,grammar:false,vocabulary:false};setTabs();renderPanel()}
function saveProgress(){try{localStorage.setItem("les-the-laugh-i-added-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-laugh-i-added"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-laugh-i-added",bookTitle:"The Laugh I Added",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}
function clearHighlight(){document.querySelectorAll(".story-word.reading").forEach(x=>x.classList.remove("reading"))}
let preferredVoice=null;
