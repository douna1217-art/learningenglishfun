<script>

const pages=[{"type": "cover", "title": "The Island Between the Tides", "subtitle": "The Boldest Choice Is Not Always the One That Moves Forward.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-island-between-the-tides-assets/cover.jpg"}, {"text": "1. A Temporary Island\nAt low tide, the ocean pulled back like a curtain and revealed a rocky outcrop beyond the tide pools. Nia named it Notebook Island because she sat on the overlook sketching anemones, limpets, and sea stars. Her cousin Mateo recorded the time beside each drawing while Aunt Lena watched from the marked trail.\nA ranger had warned them that the outcrop became an island when the tide returned. From above, the channel looked narrow and harmless. Nia drew a dotted line across it anyway, labeling the route temporary.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-island-between-the-tides-assets/page1.jpg"}, {"text": "2. The Gust\nA sudden gust lifted three pages at once. Nia caught two, but the field notebook flipped over the railing, skated across flat rock, and landed on the outcrop. It stopped beside a shallow pool, close enough to see and far enough to make Nia's stomach tighten.\n“I can hop across before the water rises,” she said. Mateo studied the channel. A wave slid in, covered a dark strip of stone, and drained away. “It is already rising,” he answered, and Nia heard caution in his voice and mistook it for fear.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-island-between-the-tides-assets/page2.jpg"}, {"text": "3. Signs in the Water\nNia searched for the dry rocks she had drawn earlier. Two were now shining wet. A ribbon of seaweed that had rested flat began to float. Farther out, each wave reached a crack higher than the one before it. Mateo pointed to the outcrop's base, where water had erased their sandy footprints.\nThe channel was not deep, but depth was only one clue. The moving water, slippery rock, and changing waves made the route less predictable each minute. Nia's first plan no longer matched the setting in front of her.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-island-between-the-tides-assets/page3.jpg"}, {"text": "4. The Harder Kind of Brave\n“If we tell Aunt Lena, she may say the notebook is gone,” Nia whispered. It held weeks of drawings, including the sea star she planned to enter in the nature journal contest. Standing still felt like giving up, but asking for help is not the same as quitting.\nNia looked again at the dotted line in her last sketch. She had drawn it temporary because she knew the route could disappear. Pretending otherwise would not rescue her work; it would only ignore her own evidence.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-island-between-the-tides-assets/page4.jpg"}, {"text": "5. A Safer Plan\nAunt Lena called the ranger, who closed that section of the overlook and brought a long-handled litter grabber. From stable ground behind the barrier, the ranger tested the tool's reach. It was still too short by nearly a meter.\nNia noticed a floating loop of kelp beside the notebook. She suggested guiding the kelp with the grabber so the next small wave might nudge the notebook closer. The ranger adjusted the idea: he used the tool to move only loose kelp, never protected animals or attached plants.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-island-between-the-tides-assets/page5.jpg"}, {"text": "6. The Returning Wave\nThe ranger hooked the loose kelp and drew it into a wide curve behind the notebook. A gentle wave lifted the cover, pushed against the kelp, and slid the notebook several inches toward shore. On the second try, the grabber caught its spiral binding.\nEveryone stepped farther back as a larger wave crossed the outcrop. The notebook dripped, and some pencil lines blurred into gray clouds, but most pages remained readable. Nia hugged it to her jacket. Waiting had not made her powerless, but it had made room for a plan that respected the ocean.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-island-between-the-tides-assets/page6.jpg"}, {"text": "7. What the Water Added\nAt home, Nia pressed the damp pages beneath heavy books. The blurred pencil around her sea star looked like moving water, so she kept it. Beneath the drawing, she wrote about every clue that had changed her decision.\nFor the contest, she titled the entry The Island Between the Tides. The judges praised the picture, but Nia cared most about the final sentence: Courage is not proving that you are unafraid. Sometimes courage is noticing when the world has changed—and choosing to change your plan with it.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-island-between-the-tides-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What happened to Nia's field notebook?", "choices": ["It fell into a deep hole", "Mateo threw it away", "A gust of wind blew it onto the rocky outcrop"], "answer": 2, "evidencePage": 2, "hint": "Look at chapter 2.", "explain": "The field notebook flipped over the railing and landed on the outcrop."}, {"q": "What did Mateo say when Nia wanted to hop across to get the notebook?", "choices": ["The water was already rising", "It was perfectly safe to go", "He would go get it himself"], "answer": 0, "evidencePage": 2, "hint": "Look at chapter 2.", "explain": "“It is already rising,” he answered, watching the waves cover the stone."}, {"q": "What did Nia notice had changed since she first sketched the rocks?", "choices": ["Nothing at all had changed", "Rocks that were dry earlier were now shining wet, and waves reached higher", "The rocks had completely disappeared"], "answer": 1, "evidencePage": 3, "hint": "Look at chapter 3.", "explain": "Two rocks that had been dry were now shining wet, and each wave reached higher than the last."}, {"q": "What did the ranger use to help retrieve the notebook?", "choices": ["A boat", "A rope tied to the railing", "A long-handled litter grabber and loose floating kelp"], "answer": 2, "evidencePage": 5, "hint": "Look at chapter 5.", "explain": "The ranger brought a long-handled litter grabber and used it to guide loose kelp toward the notebook."}, {"q": "What is the big idea of this story?", "choices": ["The boldest choice is always to rush forward", "Asking for help means you have failed", "Courage is not proving you are unafraid; sometimes it means noticing change and adjusting your plan"], "answer": 2, "evidencePage": 7, "hint": "Look at the last chapter.", "explain": "Sometimes courage is noticing when the world has changed—and choosing to change your plan with it."}], "grammar": [{"q": "“'It is already rising,' he answered, ___ Nia heard caution in his voice and mistook it for fear.” Which word joins these two events?", "choices": ["but", "so", "and"], "answer": 2, "evidencePage": 2, "hint": "This word joins Mateo's answer with Nia's reaction.", "explain": "“And” joins Mateo answering with Nia hearing caution in his voice.", "teach": "<b>And</b> joins <b>two related events</b>.<span class='cn'><b>and</b>(和)连接<b>两个相关的事件</b>。</span>"}, {"q": "“Standing still felt like giving up, ___ asking for help is not the same as quitting.” Which word shows contrast?", "choices": ["but", "so", "because"], "answer": 0, "evidencePage": 4, "hint": "This word contrasts how standing still felt with what was actually true.", "explain": "“But” contrasts the feeling of giving up with the truth that asking for help isn't quitting.", "teach": "<b>But</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>but</b>(但是)表示两个事实之间的<b>对比</b>。</span>"}, {"q": "“Waiting had not made her powerless, ___ it had made room for a plan that respected the ocean.” Which word shows contrast?", "choices": ["so", "but", "because"], "answer": 1, "evidencePage": 6, "hint": "This word contrasts feeling powerless with actually creating a better plan.", "explain": "“But” contrasts the idea of powerlessness with the plan that waiting actually made possible.", "teach": "<b>But</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>but</b>(但是)表示两个事实之间的<b>对比</b>。</span>"}], "vocabulary": [{"q": "‘Outcrop’ means ___.", "choices": ["a type of tide pool", "a type of notebook", "a rocky area that sticks out and is visible above the surrounding surface"], "answer": 2, "evidencePage": 1, "hint": "Look at chapter 1.", "explain": "The ocean revealed a rocky outcrop beyond the tide pools at low tide."}, {"q": "‘Caution’ means ___.", "choices": ["carefulness because of possible danger", "complete carelessness", "a type of ocean wave"], "answer": 0, "evidencePage": 2, "hint": "Look at chapter 2.", "explain": "Nia heard caution in Mateo's voice and mistook it for fear."}, {"q": "‘Courage’ means ___.", "choices": ["the complete absence of any fear or difficulty", "the ability to do something difficult or frightening", "a type of rocky outcrop"], "answer": 1, "evidencePage": 7, "hint": "Look at chapter 7.", "explain": "Courage is not proving you are unafraid—it is noticing change and adjusting your plan."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(outcrop|caution|courage)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 4 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function saveProgress(){try{localStorage.setItem("les-the-island-between-the-tides-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-island-between-the-tides"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-island-between-the-tides",bookTitle:"The Island Between the Tides",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.
