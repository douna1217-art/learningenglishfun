<script>

const pages=[{"type": "cover", "title": "The Borrowed Saturday", "subtitle": "A Perfect Day May Not Be the Day That Matters Most.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-borrowed-saturday-assets/cover.jpg"}, {"text": "1. The Note I Missed\nI missed the final note of my piano solo. My hand landed one key too far to the right, and the bright wrong sound rang through the community hall. People still clapped. My friend Lena whispered, “You kept going.” But all I could hear was the note I had missed.\nAt home, I opened Grandpa's old pocket watch. It had not worked for years, yet its hands began turning backward. The room folded like a page. Suddenly, Saturday morning sunlight crossed my bed again, and Mom called that breakfast was ready. I had been given the whole day back.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-borrowed-saturday-assets/page1.jpg"}, {"text": "2. The Better Version\nThis time I practiced through breakfast. I ignored Lena's message asking whether we could rehearse our bows together. At the hall, I played every note correctly. Relief rushed through me—until I noticed Lena enter late for her violin duet. She had waited outside my house, thinking we would walk together as planned.\nHer duet began before she had tuned properly, and one string sounded rough. “It's fine,” she said afterward, but her smile looked thin. My perfect solo had changed her day, so in my pocket the watch grew warm. I turned its tiny knob, and Saturday folded again.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-borrowed-saturday-assets/page2.jpg"}, {"text": "3. Fixing Everything\nOn the third Saturday, I walked with Lena, helped her tune, and still practiced before my turn. Then I rushed past Mr. Avery in our building lobby when his grocery bag tore. Oranges rolled under a bench. Without my help, he arrived late to hear his granddaughter sing.\nI borrowed Saturday again. I gathered the oranges, hurried Lena to the hall, and skipped lunch. During my solo, my stomach growled so loudly that I lost my place. Each repair tugged another thread loose. The day was not a puzzle with one perfect arrangement. It was full of people whose moments touched mine.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-borrowed-saturday-assets/page3.jpg"}, {"text": "4. The Quiet Between Ticks\nBefore trying again, I held the watch to my ear. Between its ticks, I remembered what I had erased: Lena laughing when the wind turned our music folders inside out, Mr. Avery telling a terrible orange joke, Mom squeezing my shoulder before I walked onstage.\nNone of those moments improved my score. That was why I had treated them like obstacles. Yet without them, the day felt polished and empty. I finally understood that the watch could return my hours, but it could not make me pay attention to them. Only I could do that.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-borrowed-saturday-assets/page4.jpg"}, {"text": "5. The Last Saturday\nI turned the knob one final time. At breakfast, I ate instead of practicing. I walked with Lena and helped chase her music when the wind lifted it. We gathered Mr. Avery's oranges and listened to his joke all the way to the hall. I practiced once, slowly, then closed the piano lid.\nBefore my solo, Lena said, “Whatever happens, keep going.” I played the opening clearly. In the middle, one note came out softer than I planned. My hands wanted to panic, but I listened to the next phrase and continued. The music became a path, not a test I had to escape.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-borrowed-saturday-assets/page5.jpg"}, {"text": "6. Applause I Finally Heard\nMy final note landed exactly where it should. For a second, I waited for the fierce relief I had felt on the second Saturday. Instead, I heard the whole room: chairs creaking, a baby humming, Grandpa coughing softly, and Lena clapping above everyone else.\nAfterward, I listened to her duet from the front row. Mr. Avery waved when his granddaughter sang. Mom asked whether I was proud of my performance. “I'm glad I was here for it,” I said. The answer surprised me, but it was true.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-borrowed-saturday-assets/page6.jpg"}, {"text": "7. Time Returned\nThat night, the pocket watch stopped. I tried the knob, but Sunday arrived normally. I placed the watch beside Grandpa's photograph and wondered if he had ever borrowed a day. If he had, he had never told me.\nOn Monday, my teacher asked us to write about the weekend. I could have described every Saturday I remembered, but only one had truly continued into Sunday. I wrote about the wrong notes, the oranges, the wind, and my friend's advice. The day was not perfect. At last, it was mine.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-borrowed-saturday-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What happened at the narrator's first piano performance?", "choices": ["They forgot the whole piece", "They won first place", "They missed the final note and heard a wrong sound"], "answer": 2, "evidencePage": 1, "hint": "Look at chapter 1.", "explain": "The narrator's hand landed one key too far to the right, and the wrong sound rang through the hall."}, {"q": "What did the pocket watch do?", "choices": ["Turned backward and gave the narrator the whole Saturday again", "Stopped working forever", "Rang loudly like an alarm"], "answer": 0, "evidencePage": 1, "hint": "Look at chapter 1.", "explain": "The watch's hands began turning backward, and Saturday morning began again."}, {"q": "What happened to Lena when the narrator played a perfect solo on the second Saturday?", "choices": ["She had a wonderful day", "She arrived late for her duet because she had waited to walk together", "She won a music award"], "answer": 1, "evidencePage": 2, "hint": "Look at chapter 2.", "explain": "Lena had waited outside the narrator's house, so she arrived late and her duet started roughly."}, {"q": "What did the narrator realize between the ticks of the watch?", "choices": ["The watch was broken beyond repair", "Practicing more was the only thing that mattered", "They had erased small, meaningful moments with people they cared about"], "answer": 2, "evidencePage": 4, "hint": "Look at chapter 4.", "explain": "Between its ticks, the narrator remembered moments with Lena, Mr. Avery, and Mom that had been erased."}, {"q": "What is the big idea of this story?", "choices": ["A perfect day may not be the day that matters most", "Only a perfect performance makes a day worthwhile", "Repeating a day always makes everything better"], "answer": 0, "evidencePage": 7, "hint": "Look at the last chapter.", "explain": "The day was not perfect. At last, it was mine."}], "grammar": [{"q": "“People still clapped, ___ all I could hear was the note I had missed.” Which word shows contrast?", "choices": ["so", "because", "but"], "answer": 2, "evidencePage": 1, "hint": "This word contrasts the applause with what the narrator focused on.", "explain": "“But” contrasts the clapping with the narrator only hearing the missed note.", "teach": "<b>But</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>but</b>(但是)表示两个事实之间的<b>对比</b>。</span>"}, {"q": "“My perfect solo had changed her day, ___ in my pocket the watch grew warm.” Which word shows the result?", "choices": ["so", "but", "because"], "answer": 0, "evidencePage": 2, "hint": "This word shows what happened as a result.", "explain": "“So” shows the watch warming up as a result of the solo changing Lena's day.", "teach": "<b>X, so Y</b> shows Y is a <b>result</b> of X.<span class='cn'><b>so</b>(所以)表示Y是X的<b>结果</b>。</span>"}, {"q": "“My hands wanted to panic, ___ I listened to the next phrase and continued.” Which word shows contrast?", "choices": ["but", "so", "because"], "answer": 0, "evidencePage": 5, "hint": "This word contrasts wanting to panic with what the narrator actually did.", "explain": "“But” contrasts the urge to panic with actually continuing calmly.", "teach": "<b>But</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>but</b>(但是)表示两个事实之间的<b>对比</b>。</span>"}], "vocabulary": [{"q": "‘Obstacle’ means ___.", "choices": ["a type of musical note", "a type of watch", "something that gets in the way or makes progress harder"], "answer": 2, "evidencePage": 4, "hint": "Look at chapter 4.", "explain": "The narrator had treated meaningful moments like obstacles to a perfect score."}, {"q": "‘Relief’ means ___.", "choices": ["a feeling of comfort after worry or stress ends", "a feeling of extreme anger", "a type of piano piece"], "answer": 0, "evidencePage": 2, "hint": "Look at chapter 2.", "explain": "Relief rushed through the narrator after playing every note correctly."}, {"q": "‘Attention’ means ___.", "choices": ["complete carelessness", "careful focus or notice given to something", "a type of pocket watch"], "answer": 1, "evidencePage": 4, "hint": "Look at chapter 4.", "explain": "The watch could return the narrator's hours, but only they could pay attention to them."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(obstacle|relief|attention)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 4 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function saveProgress(){try{localStorage.setItem("les-the-borrowed-saturday-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-borrowed-saturday"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-borrowed-saturday",bookTitle:"The Borrowed Saturday",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

function pickVoice(){const voices=speechSynthesis.getVoices();if(!voices.length)return;const en=voices.filter(v=>/^en(-|_|$)/i.test(v.lang));const pool=en.length?en:voices;const score=v=>{let s=0;const n=(v.name||"").toLowerCase();if(/natural/.test(n))s+=8;if(/neural/.test(n))s+=6;if(/online/.test(n))s+=4;if(/google/.test(n))s+=5;if(/(aria|jenny|guy|libby|sonia|michelle|ava|andrew|emma|clara|natasha)/.test(n))s+=5;if(/(samantha|allison|karen|serena|siri|nicky|aaron)/.test(n))s+=4;if(v.localService===false)s+=3;if(/en-us|en-gb/i.test(v.lang))s+=1;if(/(zira|david|mark|hazel|compact|espeak|eloquence)/.test(n))s-=5;return s};pool.sort((a,b)=>score(b)-score(a));preferredVoice=pool[0]||null}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.
