<script>

const pages=[{"type": "cover", "title": "The Robot Who Chose a New Voice", "subtitle": "A Thirteen-Year-Old Is Upset When a Family Robot Chooses a New Voice Instead of the Old One and Slowly Learns to Listen", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-robot-who-chose-a-new-voice-assets/cover.jpg"}, {"text": "1. A Voice from the Kitchen\nOtto's voice had always sounded like a kettle trying to be polite. It rose at the end of every sentence, including sentences that were definitely not questions. “The toast is ready?” he would announce. “Your shoe is under the chair?” When I was little, I answered him every time. By thirteen, I only answered when I wanted to annoy him. He claimed this did not annoy him. His next sentence usually rose even higher.\nThen his speaker began to crackle. At first, the crackle appeared only on long words. Soon it followed him through ordinary conversations, breaking his sentences into pieces. My mother booked an appointment at Ms. Mora's repair shop. I went along because Otto had helped me choose almost everything important in my room, including the lamp that looked like a sleeping pear. I thought he might appreciate my advice about something he would have to live with every day.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-robot-who-chose-a-new-voice-assets/page1.jpg"}, {"text": "2. The Reason He Had Waited\nOn the walk, I asked why he hadn't reported the trouble sooner. He said the crackle had been small. I said small problems could become large. He said that was an interesting opinion from someone who had hidden a broken pencil sharpener for six weeks. I told him that situation had involved unusual circumstances. “Pencil shavings?” he asked. The crackle swallowed the last word, and neither of us laughed as much as we would have.\nMs. Mora tested the speaker without opening his memory compartment. She said it could be replaced, and his memories would stay exactly where they were. I felt better. Otto asked what choices he had. She set out several small speaker modules and let him try their voices through a separate testing box. One sounded grand enough to announce a royal parade. I suggested it immediately. Otto asked to hear the next one. It was calm, low, and nothing like a kettle.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-robot-who-chose-a-new-voice-assets/page2.jpg"}, {"text": "3. The Choice I Did Not Like\nHe asked Ms. Mora to play the low voice again. Then he chose it. I waited for him to ask whether I agreed. He asked how long the work would take instead. “What about the old sound?” I said. Ms. Mora explained that the damaged model was no longer made. She could make a new speaker imitate its pitch, though the result wouldn't be exact. I turned to Otto. That seemed like the obvious solution.\n“I would rather use this one,” he said. The testing box repeated a sample greeting. It sounded patient and certain. I disliked it immediately. It was the voice of someone who would know where to put a bookshelf without first helping me knock over a plant. I said it didn't suit him. Otto's eyes stayed bright, but he stopped moving his hands. “It doesn't sound familiar to you,” he said. “That isn't quite the same thing.” Ms. Mora quietly began putting the unused modules away.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-robot-who-chose-a-new-voice-assets/page3.jpg"}, {"text": "4. The Quiet Walk Home\nThe repair took less than an hour. Ms. Mora asked Otto to say several sentences, then adjusted the volume. He sounded pleased, though I had to listen carefully to recognize it. Outside, I walked a little ahead. He caught up at the crossing. “Your mother asked us to buy tomatoes,” he said. I almost asked who he was. It was a foolish thought. The silver body beside me had the same dent near one knee and the same blue light on its chest.\nAt the grocery stall, he chose the firm tomatoes and left the split one in the crate. Then he bought the split one too, because my mother would use it for soup that evening. He had always done that. I noticed his habit with an irritation that surprised me. I wanted either the old Otto or a convincing stranger. This mixture refused to become either. On the way home, he asked whether I still wanted help moving my bookshelf. I said I could do it myself.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-robot-who-chose-a-new-voice-assets/page4.jpg"}, {"text": "5. The Bookshelf Incident\nI could not do it myself. The bookshelf was wider than the space between my desk and the door. After ten minutes, I had moved the rug, one shoe, and my opinion of how much help I required. Otto waited in the hallway until I asked. Together we took the books off, turned the empty shelf, and moved it without knocking over the lamp. He said we had beaten our previous record for not knocking over a lamp. I laughed before remembering that his voice was different.\nHe stayed while I put the books back. I asked why he had chosen that particular sound. He said the old voice often made people treat serious statements as jokes. “You never told me,” I said. “You liked it,” he replied. I looked at the shelf, which now stood where I had wanted it. I had invited him to help choose a voice as though the important question were whether I would enjoy listening to it. I hadn't asked what speaking in it felt like for him.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-robot-who-chose-a-new-voice-assets/page5.jpg"}, {"text": "6. A Request in the Old Pitch\nI asked if he could say my name in the old pitch one more time. The request came out before I considered how it might sound. Otto paused. “For a recording?” he asked. I hadn't thought that far. I said I wanted to remember. He could imitate the old rise, but the new speaker would still give it a different texture. “I can do that once,” he said. “I don't want to perform it every time you miss the old sound.”\nI took out my recorder. He said my name with the familiar upward lift. Then he added, in the voice he had chosen, “Your bookshelf is finally straight.” I kept both sentences in the same file. Listening back, I could hear where one ended and the other began. I thanked him. He asked whether I would like to hear something else his new speaker could do. It produced the solemn opening note of a trumpet, followed by a remarkably convincing hiccup. This time, I laughed without checking myself.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-robot-who-chose-a-new-voice-assets/page6.jpg"}, {"text": "7. The Sentence I Recognized\nFor several days, I still expected the old voice when I came into a room. Sometimes the new sound surprised me from the kitchen. I did not announce this every time. Otto had heard my opinion. He didn't need to live inside it. On Saturday, we finished arranging the books, and he asked whether the lamp should move to the other side of the desk. I told him it looked comfortable where it was. He said he would consult the pear.\nThat evening, he called me downstairs. I heard my name in a low, steady voice and knew exactly who was speaking. My mother was stirring a pot of soup. Otto reminded me to wash my hands. He sounded certain that they needed washing, which they did. I started to answer with a question, the way I used to. Then I answered him normally and went to the sink. Behind me, he was telling my mother about the trumpet hiccup.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-robot-who-chose-a-new-voice-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "How did Otto’s voice sound?", "choices": ["Loud and angry", "Low and calm", "Like a kettle trying to be polite, rising at the end of every sentence"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Otto’s voice rose at the end of every sentence, including sentences that were not questions."}, {"q": "What did Ms. Mora say about the repair?", "choices": ["The robot would forget everything", "The speaker could be replaced, and Otto’s memories would stay where they were", "The robot could not be fixed"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "She said the speaker could be replaced, and his memories would stay exactly where they were."}, {"q": "Which voice did Otto choose, and how did the narrator feel?", "choices": ["The calm, low one, and the narrator disliked it right away", "The old voice, and the narrator was relieved", "The royal parade voice, and the narrator loved it"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Otto chose the low voice, and the narrator disliked it immediately."}, {"q": "Why had Otto chosen that sound?", "choices": ["It was the cheapest one", "The old voice often made people treat serious statements as jokes", "Ms. Mora told him to"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "He said the old voice often made people treat serious statements as jokes."}, {"q": "What showed the narrator was beginning to accept the new voice?", "choices": ["The narrator recognized it saying the name, answered normally, and went to wash up", "The narrator left the house", "The narrator asked for the old voice back"], "answer": 0, "evidencePage": 7, "hint": "Look at page 7.", "explain": "The narrator heard the name in a low, steady voice and knew exactly who was speaking."}], "grammar": [{"q": "‘The new voice had a calm ___ on the room.’ Which word belongs in the blank?", "choices": ["affect", "effect", "affected"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "A calm effect names something, so the sentence needs the noun effect.", "teach": "<b>Effect</b> is usually a noun, like <b>a calm effect</b>, and <b>affect</b> is usually a verb.<span class='cn'><b>effect</b> 通常是名词，比如 <b>a calm effect</b>；<b>affect</b> 通常是动词。</span>"}, {"q": "The prefix ‘dis-’ means ‘not’. What does ‘disliked’ mean in ‘I disliked it immediately’?", "choices": ["Liked very much", "Liked a little", "Did not like"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Disliked means the narrator did not like it.", "teach": "The prefix <b>dis</b> means not, so <b>disliked</b> means did not like.<span class='cn'>前缀 <b>dis</b> 表示“不”，所以 <b>disliked</b> 就是不喜欢。</span>"}, {"q": "‘Otto’s voice had always sounded like a kettle trying to be polite.’ What does this show?", "choices": ["The kitchen was too hot", "Otto was made of metal", "The voice was high and whistling, and a little fussy"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "The comparison paints the voice as high, steamy, and polite in a funny way.", "teach": "A <b>simile</b> uses <b>like</b> to compare, and <b>like a kettle trying to be polite</b> makes the voice easy to hear in your mind.<span class='cn'><b>明喻</b>用 <b>like</b> 来比较，<b>like a kettle trying to be polite</b> 让人在脑中就能听到这个声音。</span>"}], "vocabulary": [{"q": "‘Appreciate’ means ___.", "choices": ["to value something or be grateful for it", "to break something", "to forget something"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "I thought he might appreciate my advice."}, {"q": "‘Familiar’ means ___.", "choices": ["extremely loud", "known well because you have seen or heard it often", "very strange"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "It doesn’t sound familiar to you."}, {"q": "‘Texture’ means ___.", "choices": ["the way a sound or surface feels or seems", "a long walk", "a kind of speaker"], "answer": 0, "evidencePage": 6, "hint": "Look at page 6.", "explain": "The new speaker would still give it a different texture."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(appreciate|familiar|texture)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 6 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}var TEACH_ICONS='<svg class="ic i-spk" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.5v5h3.6l4.9 4.5V5L7.6 9.5H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.6 9.2a4 4 0 010 5.6M18.2 6.6a7.6 7.6 0 010 10.8"/></svg><svg class="ic i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></svg><svg class="ic i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 5.3v13.4c0 .8.9 1.3 1.6.8l9.6-6.7c.6-.4.6-1.2 0-1.6L9.8 4.5c-.7-.5-1.6 0-1.6.8z"/></svg>';var _tp=null;function _tpSet(b,st){if(!b)return;b.classList.toggle('is-playing',st==='playing');b.classList.toggle('is-paused',st==='paused');b.setAttribute('aria-pressed',st==='playing'?'true':'false');var z=b.dataset.part==='cn',L=st==='playing'?(z?'\u6682\u505C':'Pause'):st==='paused'?(z?'\u7EE7\u7EED\u64AD\u653E':'Resume'):b.dataset.label;b.setAttribute('aria-label',L);b.title=L;}function stopTeachAudio(){var c=_tp;if(!c)return;_tp=null;try{if(c.audio){c.audio.onended=c.audio.onerror=c.audio.ontimeupdate=null;c.audio.pause();}}catch(e){}if(c.mode==='tts'){try{speechSynthesis.cancel();}catch(e){}}_tpSet(c.btn,'idle');}function _tpFallback(btn){try{var u=new SpeechSynthesisUtterance(btn.dataset.text||'');u.lang=btn.dataset.lang||'en-US';var cur={btn:btn,mode:'tts'};_tp=cur;u.onend=u.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');}};_tpSet(btn,'playing');speechSynthesis.speak(u);}catch(e){}}function playTeachAudio(btn){if(_tp&&_tp.btn===btn){if(_tp.mode==='audio'){var a0=_tp.audio;if(a0.paused){var p0=a0.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}

function saveProgress(){try{localStorage.setItem("les-the-robot-who-chose-a-new-voice-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-robot-who-chose-a-new-voice"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-robot-who-chose-a-new-voice",bookTitle:"The Robot Who Chose a New Voice",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

let preferredVoice=null;
