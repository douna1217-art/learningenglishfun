<script>/*les-speech-shim*/
(function(){var w=window,ok=false,errs=[];
/* Some Android in-app browsers (UC/Quark and other vendor kernels, older WebViews) have no
   speechSynthesis at all. The page script calls it while loading, so it stopped there and the
   story was never drawn (the quiz still worked because its handlers were bound earlier).
   Give such browsers a silent stand-in so the rest of the page runs normally. */
try{ok=typeof w.speechSynthesis==="object"&&w.speechSynthesis!==null}catch(e){}
if(typeof w.SpeechSynthesisUtterance!=="function"&&typeof w.SpeechSynthesisUtterance!=="object"){
w.SpeechSynthesisUtterance=function(t){this.text=t==null?"":String(t);this.lang="";this.rate=1;this.pitch=1;this.volume=1;this.voice=null}}
if(!ok){var gen=0,told=false;
w.speechSynthesis={speaking:false,paused:false,pending:false,
getVoices:function(){return[]},cancel:function(){gen++},pause:function(){},resume:function(){},
addEventListener:function(){},removeEventListener:function(){},
speak:function(u){var g=gen;
if(!told&&typeof w.setStatus==="function"){told=true;try{w.setStatus("This browser can't read aloud, but you can still read and practice. 当前浏览器不支持朗读，仍可阅读和做题。",false)}catch(e){}}
setTimeout(function(){if(g===gen&&u&&u.onstart){try{u.onstart({})}catch(e){}}},0);
setTimeout(function(){if(g===gen&&u&&u.onend){try{u.onend({})}catch(e){}}},Math.max(600,String(u&&u.text||"").length*60))}}}
/* If the story still is not drawn after loading, say why on the page itself, so a screenshot
   from a phone we cannot test on shows the cause. */
w.addEventListener("error",function(e){try{if(errs.length<3)errs.push(String(e&&e.message||e))}catch(x){}});
w.addEventListener("load",function(){try{var v=document.getElementById("pageView");
if(v&&!v.firstChild&&errs.length){var d=document.createElement("div"),s=document.createElement("small");
d.style.cssText="padding:24px;color:#b91c1c;font:15px/1.6 sans-serif";
d.appendChild(document.createTextNode("The story could not be shown in this browser. 此浏览器暂时无法显示故事。"));
d.appendChild(document.createElement("br"));s.textContent=errs.join(" | ");d.appendChild(s);v.appendChild(d)}}catch(x){}});
})();

<script>

const pages=[{"type": "cover", "title": "The Pet from Apartment Nine", "subtitle": "A Boy Who Thinks He Is Entertaining a Neighbor’s Pet Discovers That the Small Creature Is a Visiting Scientist", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-pet-from-apartment-nine-assets/cover.jpg"}, {"text": "1. An Afternoon of Company\nDr. Vega from Apartment Nine asked Jules to keep her visitor company while she collected a repaired translator. Jules saw a small teal creature peering around her ankle and almost forgot to answer. It had four short legs, golden eyes, and fur that stood in little waves around its head. Its silver collar held an empty round socket. “Oro has already eaten,” Dr. Vega said. “I'll be back in an hour. The building garden is open if you both want to go.”\nJules promised to be careful. His family had never kept a pet, and here was a creature more interesting than any dog in the park. He knew Earth received visitors from other worlds, but he had only seen tall ones speaking on the news. Oro was the size of a cat. As Dr. Vega left, the creature raised one front paw. Jules waved back and wondered whether it had been taught any other tricks.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-pet-from-apartment-nine-assets/page1.jpg"}, {"text": "2. The Ball Experiment\nJules brought Oro into his apartment and found an old foam ball under the sofa. He rolled it across the rug. Oro watched it stop beside a chair. Then it walked over, pushed the ball back with one paw, and settled down again. Jules rolled it a second time. Oro returned it more slowly. On the third attempt, it nudged the ball beneath the sofa and looked at Jules. He decided that meant the game was finished.\nHe offered water in a bowl. Oro inspected the bowl, then pointed toward the cups on the kitchen counter. Jules filled a shallow cup instead. The creature held it between its flexible front paws and drank. That was an impressive trick. Jules considered making a video, but Dr. Vega hadn't said he could, so he left his phone alone. Oro set the cup down neatly and looked toward the doorway. “You want a walk,” Jules said. “I understand that one.”", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-pet-from-apartment-nine-assets/page2.jpg"}, {"text": "3. A Visitor at Work\nThe building garden occupied a wide room beneath the roof. Jules took the elevator because Oro's legs were short. He expected his visitor to race around once they arrived. Instead, Oro stopped at the first planter and studied its leaves. It lifted a fallen leaf with a front paw, turned it over, and carried it to the next planter. Jules crouched beside it. “Those aren't treats,” he said. Oro gave him a long, steady look.\nAt the far end of the room, a gardener was adjusting a drip pipe. Oro walked toward her, carrying the leaf. Jules hurried after it and rolled the foam ball along the path to attract its attention. Oro stepped around the ball. Its fur rose slightly. Jules had read that some animals became difficult in unfamiliar places. He wondered whether he should take it home before it disturbed anyone. “Come on,” he said, patting his knee. Oro stayed beside the planter.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-pet-from-apartment-nine-assets/page3.jpg"}, {"text": "4. The Card on the Collar\nThe gardener, Ms. Bell, noticed the leaf. “Has our visitor found something?” she asked. Jules explained that he was keeping Dr. Vega's pet entertained. Ms. Bell looked from him to Oro. “Did Dr. Vega call Oro a pet?” Jules opened his mouth, then closed it. She had said visitor. Company. Already eaten. He had supplied the rest. Oro tapped the flat card attached behind its collar, a card Jules had assumed was an address tag.\nMs. Bell held out her hand and waited. Oro leaned forward so she could turn the card toward her eyes. “This is a research visitor's pass,” she said. “I can't read the name without the translator, but that symbol belongs to the plant laboratory.” Jules looked at the leaf held so carefully in Oro's paw. The turned leaves, the patient examination of the drip pipe, the cup chosen instead of the bowl, each detail seemed to shift without changing. “Oh,” he said. Oro lowered the leaf.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-pet-from-apartment-nine-assets/page4.jpg"}, {"text": "5. Doctor Oro\nDr. Vega found them beside the planter. She fitted a small silver disk into the empty collar socket. Oro made a soft clicking sound. A clear voice came from the disk. “The young host has shown me a moving sphere several times,” it said. “I believe it is important to him.” Dr. Vega pressed her lips together. Ms. Bell became very interested in the drip pipe. Jules wished the planter were large enough to hide behind.\n“Jules,” Dr. Vega said, “this is Doctor Oro. We work together on plants that can grow in enclosed settlements.” Jules began three different apologies before finishing one. Oro listened with its head tilted. “I accepted the first apology,” the translator said. “The others appear to describe the same event.” Jules stopped. Dr. Vega explained that she had assumed Jules knew why Oro was visiting. She apologized too. Somehow that helped more than being told that everything was fine. Everything had been rather awkward.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-pet-from-apartment-nine-assets/page5.jpg"}, {"text": "6. A Second Introduction\nJules asked whether Oro had thought the ball game was ridiculous. “I thought you were demonstrating a custom,” Oro replied. “Refusing a host's custom can be impolite.” Jules remembered praising the creature every time it pushed the ball back. He stared at his shoes. Then Oro added, “I also assumed you maintained the garden because you carried a tool.” It indicated the foam ball. “I now suspect that conclusion was incorrect.” Jules looked up. A clicking sound came through the disk before the translation caught up. Oro was laughing.\nThis time Jules asked what the leaf meant. Oro explained that it had fallen from a planter with damp soil, while a neighboring planter was dry. It wanted to ask Ms. Bell how the watering system worked before making any guesses. Jules helped carry an empty tray while the two researchers talked. He understood only part of their discussion. For once, being the person who knew least in the room felt more interesting than pretending he already understood.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-pet-from-apartment-nine-assets/page6.jpg"}, {"text": "7. A Better Question\nBefore Oro left, Jules asked what visitors his own size were like on its world. Oro described beings that lived in water, beings that traveled in little wheeled shelters, and one extremely argumentative friend who resembled a folded blanket. Jules tried to imagine meeting the blanket. He might have put it on the sofa. The thought made him uncomfortable enough to remember. He asked another question instead of saying what he would probably have done.\nDr. Vega invited him to visit the plant laboratory on Saturday with his mother. Oro would be there, working. Jules accepted. At his apartment door, Oro lifted a front paw, just as it had when they first met. Jules lifted his hand. This time he didn't count it as a trick. After the visitors went downstairs, he went back to the garden for the foam ball and put it in its box. Then he wrote down three things he wanted to ask Doctor Oro.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-pet-from-apartment-nine-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did Dr. Vega ask Jules to do?", "choices": ["Water the garden", "Walk a neighbor’s dog", "Keep her visitor company for an hour while she collected a repaired translator"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "She asked Jules to keep her visitor company while she collected a repaired translator."}, {"q": "What did Oro do in the building garden?", "choices": ["Raced around the room", "Studied the leaves, carried a fallen leaf from planter to planter, and walked toward the gardener", "Hid behind a planter"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Oro stopped at the first planter, studied its leaves, and carried a leaf to the next planter."}, {"q": "What did Ms. Bell discover?", "choices": ["Oro was lost", "The card on the collar was a research visitor’s pass, and Dr. Vega had never called Oro a pet", "Oro belonged to the gardener"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "She read the symbol on the card and noticed that Dr. Vega had said visitor and company, not pet."}, {"q": "How did Oro react to Jules’s many apologies?", "choices": ["It walked away", "It refused to listen", "It accepted the first one and said the others seemed to describe the same event"], "answer": 2, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Oro said it accepted the first apology and that the others appeared to describe the same event."}, {"q": "Why had Oro pushed the ball back to Jules?", "choices": ["It thought Jules was showing a custom, and refusing a host’s custom could be impolite", "It was angry", "It wanted to break the ball"], "answer": 0, "evidencePage": 6, "hint": "Look at page 6.", "explain": "Oro said it thought Jules was demonstrating a custom."}], "grammar": [{"q": "‘By the time Dr. Vega returned, Jules ___ already apologized.’ Which word belongs in the blank?", "choices": ["has", "have", "had"], "answer": 2, "evidencePage": 5, "hint": "Look at page 5.", "explain": "The apology happened before Dr. Vega returned, so the sentence needs had.", "teach": "Use <b>had</b> plus a past form, like <b>had apologized</b>, for an action finished before another past action.<span class='cn'>用 <b>had</b> 加过去分词，比如 <b>had apologized</b>，表示在另一个过去动作之前已经完成的动作。</span>"}, {"q": "The prefix ‘trans-’ means ‘across’. What does a ‘translator’ most likely do?", "choices": ["Rolls a ball", "Carries meaning across languages", "Plants gardens"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "A translator moves meaning from one language to another.", "teach": "The prefix <b>trans</b> means across, so a <b>translator</b> carries meaning across languages.<span class='cn'>前缀 <b>trans</b> 表示“跨过”，所以 <b>translator</b>（翻译器）就是把意思传到另一种语言里的东西。</span>"}, {"q": "‘I accepted the first apology. The others appear to describe the same event.’ What does Oro’s serious tone show?", "choices": ["A dry joke that gently points out Jules repeated himself", "That Oro was very angry", "That Oro could not understand"], "answer": 0, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Oro speaks in a very serious way to make a gentle joke.", "teach": "<b>Dry humor</b> says something in a very serious tone to be funny, like Oro saying the other apologies <b>describe the same event</b>.<span class='cn'><b>冷幽默</b>是用很严肃的语气说出有趣的话，比如 Oro 说其他道歉 <b>describe the same event</b>（描述的是同一件事）。</span>"}], "vocabulary": [{"q": "‘Assumed’ means ___.", "choices": ["forgot completely", "believed something was true without checking", "asked a clear question"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "He had supplied the rest."}, {"q": "‘Impolite’ means ___.", "choices": ["not showing good manners", "very quiet", "full of energy"], "answer": 0, "evidencePage": 6, "hint": "Look at page 6.", "explain": "Refusing a host’s custom can be impolite."}, {"q": "‘Examination’ means ___.", "choices": ["a careful look at something", "a quick nap", "a loud noise"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "The patient examination of the drip pipe."}]};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(assumed|impolite|examination)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 6 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}var TEACH_ICONS='<svg class="ic i-spk" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.5v5h3.6l4.9 4.5V5L7.6 9.5H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.6 9.2a4 4 0 010 5.6M18.2 6.6a7.6 7.6 0 010 10.8"/></svg><svg class="ic i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></svg><svg class="ic i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 5.3v13.4c0 .8.9 1.3 1.6.8l9.6-6.7c.6-.4.6-1.2 0-1.6L9.8 4.5c-.7-.5-1.6 0-1.6.8z"/></svg>';var _tp=null;function _tpSet(b,st){if(!b)return;b.classList.toggle('is-playing',st==='playing');b.classList.toggle('is-paused',st==='paused');b.setAttribute('aria-pressed',st==='playing'?'true':'false');var z=b.dataset.part==='cn',L=st==='playing'?(z?'\u6682\u505C':'Pause'):st==='paused'?(z?'\u7EE7\u7EED\u64AD\u653E':'Resume'):b.dataset.label;b.setAttribute('aria-label',L);b.title=L;}function stopTeachAudio(){var c=_tp;if(!c)return;_tp=null;try{if(c.audio){c.audio.onended=c.audio.onerror=c.audio.ontimeupdate=null;c.audio.pause();}}catch(e){}if(c.mode==='tts'){try{speechSynthesis.cancel();}catch(e){}}_tpSet(c.btn,'idle');}function _tpFallback(btn){try{var u=new SpeechSynthesisUtterance(btn.dataset.text||'');u.lang=btn.dataset.lang||'en-US';var cur={btn:btn,mode:'tts'};_tp=cur;u.onend=u.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');}};_tpSet(btn,'playing');speechSynthesis.speak(u);}catch(e){}}function playTeachAudio(btn){if(_tp&&_tp.btn===btn){if(_tp.mode==='audio'){var a0=_tp.audio;if(a0.paused){var p0=a0.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}

function saveProgress(){try{localStorage.setItem("les-the-pet-from-apartment-nine-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-pet-from-apartment-nine"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-pet-from-apartment-nine",bookTitle:"The Pet from Apartment Nine",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

let preferredVoice=null;
