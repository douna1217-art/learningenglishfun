<script>

const pages=[{"type": "cover", "title": "Two Plans for Cedar Bridge", "subtitle": "The Same Problem Can Look Different From Opposite Sides of the Table.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/two-plans-for-cedar-bridge-assets/cover.jpg"}, {"text": "1. ROWAN · My Straight-Line Plan\nI like plans that hold still. For the class bridge challenge, I measured every cedar craft strip twice and drew a straight deck with two triangle supports. My partner, Imani, studied the blueprint quietly. Then she laid three bright paper bands across my careful lines.\n“A woven deck could bend without breaking,” she said. I heard could bend and imagined a sagging bridge. Before I asked what she meant, I moved the bands aside. Her eyebrows lifted. I decided she was annoyed because I had protected the plan.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/two-plans-for-cedar-bridge-assets/page1.jpg"}, {"text": "2. IMANI · The Part He Did Not Hear\nRowan's triangles were strong, but the deck in his drawing had no way to adjust when weight shifted. I had woven paper baskets with my grandmother; crossing strips shared the pull instead of leaving one strip to carry it alone. I wanted to test that idea on the bridge.\nRowan swept my bands away before I finished explaining. He called his design the plan, as if mine were only decoration. I folded my sketch and tucked it beneath my notebook. I decided he cared more about being correct than about being partners.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/two-plans-for-cedar-bridge-assets/page2.jpg"}, {"text": "3. ROWAN · The Test I Expected to Pass\nWe built my straight deck first because the teacher required every team to test more than one solution. The bridge held six metal washers, but at seven, the center strip cracked with a sound like a snapped twig. I stared at the break and felt heat climb into my face.\nImani did not say I told you so. She turned the broken strip over and pointed to the single pressure mark in the center. “What if the weight had more paths to travel?” she asked. This time, I realized her question was not an attack.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/two-plans-for-cedar-bridge-assets/page3.jpg"}, {"text": "4. IMANI · The Weakness in My Idea\nWe built my woven deck next. The paper bands spread the weight, just as I had hoped, but the bridge twisted sideways after five washers. Rowan steadied the testing tray without touching the bridge. He could have smiled at my mistake. Instead, he studied the loose ends.\n“Your deck shares the load,” he said, “but it needs something rigid to keep its shape.” I looked at his triangle supports. They had not failed; only his center deck had. My design was not the answer either. It was one useful part.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/two-plans-for-cedar-bridge-assets/page4.jpg"}, {"text": "5. ROWAN · A Third Plan\nWe placed both sketches between us. I drew triangles beneath the deck. Imani drew woven bands across the top. At first our pencil lines collided, but soon they connected. The third plan belonged to neither of us alone.\nI told Imani I had mistaken her flexible material for a weak idea. She told me she had mistaken my silence for disrespect. Neither assumption had come from a question. We agreed that during the next build, each person would explain the purpose of a change before moving anything.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/two-plans-for-cedar-bridge-assets/page5.jpg"}, {"text": "6. IMANI · Twelve Washers\nThe combined bridge looked unusual: precise cedar triangles below, flexible bands above. One by one, we added washers. Six. Seven. Eight. The deck settled slightly, then held. At twelve washers, our teacher ended the test to protect the materials.\nThe bridge had not succeeded because one of us surrendered. It worked because each failure had revealed a different need. Rowan's structure controlled the shape, while my weave distributed the weight. The strongest part of our design was the space where our ideas overlapped.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/two-plans-for-cedar-bridge-assets/page6.jpg"}, {"text": "7. BOTH · What We Saw from Here\nROWAN: When I look at the finished bridge, I see measurements that became more useful after they made room for flexibility. I used to think changing a plan meant the first plan had failed completely.\nIMANI: I see a weave held steady by a structure I once thought was too stiff. We still notice different things first. Now we treat those differences as information. Cedar Bridge crosses only a cardboard ravine, but building it taught us how to meet in the middle.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/two-plans-for-cedar-bridge-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What kind of deck did Rowan originally design?", "choices": ["A deck made of metal washers", "A woven paper deck", "A straight deck with two triangle supports"], "answer": 2, "evidencePage": 1, "hint": "Look at chapter 1.", "explain": "Rowan drew a straight deck with two triangle supports."}, {"q": "What happened when Rowan's straight deck was tested?", "choices": ["It held six washers, then the center strip cracked at seven", "It held all twelve washers easily", "It never held any weight at all"], "answer": 0, "evidencePage": 3, "hint": "Look at chapter 3.", "explain": "The bridge held six metal washers, but at seven the center strip cracked."}, {"q": "What happened when Imani's woven deck was tested?", "choices": ["It held every washer perfectly", "It spread the weight well but twisted sideways after five washers", "It broke immediately with no washers"], "answer": 1, "evidencePage": 4, "hint": "Look at chapter 4.", "explain": "The paper bands spread the weight, but the bridge twisted sideways after five washers."}, {"q": "What did the combined bridge include?", "choices": ["Only Rowan's original design", "Only Imani's original design", "Rowan's triangle supports below and Imani's woven bands above"], "answer": 2, "evidencePage": 6, "hint": "Look at chapter 6.", "explain": "The combined bridge had precise cedar triangles below and flexible bands above."}, {"q": "What is the big idea of this story?", "choices": ["The same problem can look different from opposite sides of the table, and combining ideas can make something stronger", "Only one person's design can ever be correct", "Working alone is always better than working together"], "answer": 0, "evidencePage": 7, "hint": "Look at the last chapter.", "explain": "Building it together taught Rowan and Imani how to meet in the middle."}], "grammar": [{"q": "“Rowan's triangles were strong, ___ the deck in his drawing had no way to adjust when weight shifted.” Which word shows contrast?", "choices": ["so", "because", "but"], "answer": 2, "evidencePage": 2, "hint": "This word contrasts being strong with lacking flexibility.", "explain": "“But” contrasts the strong triangles with the deck's inability to adjust.", "teach": "<b>But</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>but</b>(但是)表示两个事实之间的<b>对比</b>。</span>"}, {"q": "“The bridge held six metal washers, ___ at seven the center strip cracked.” Which word shows contrast?", "choices": ["but", "so", "because"], "answer": 0, "evidencePage": 3, "hint": "This word contrasts holding six washers with cracking at seven.", "explain": "“But” contrasts the bridge holding six washers with it cracking at seven.", "teach": "<b>But</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>but</b>(但是)表示两个事实之间的<b>对比</b>。</span>"}, {"q": "“Rowan's structure controlled the shape, ___ Imani's weave distributed the weight.” Which word shows a contrast between their two roles?", "choices": ["so", "while", "because"], "answer": 1, "evidencePage": 6, "hint": "This word contrasts the two different jobs each part did.", "explain": "“While” contrasts Rowan's structure controlling shape with Imani's weave distributing weight.", "teach": "<b>X, while Y</b> shows a <b>contrast</b> between two things.<span class='cn'><b>while</b>(然而)表示两者之间的<b>对比</b>。</span>"}], "vocabulary": [{"q": "‘Rigid’ means ___.", "choices": ["soft and easily bent", "completely broken", "stiff and not easily bent"], "answer": 2, "evidencePage": 4, "hint": "Look at chapter 4.", "explain": "Rowan said the woven deck needed something rigid to keep its shape."}, {"q": "‘Distribute’ means ___.", "choices": ["to spread something out among several parts", "to gather everything into one single spot", "to remove something completely"], "answer": 0, "evidencePage": 6, "hint": "Look at chapter 6.", "explain": "Imani's weave distributed the weight across the bridge."}, {"q": "‘Overlap’ means ___.", "choices": ["to stay completely separate with no connection", "to share a common part or area with something else", "to break into pieces"], "answer": 1, "evidencePage": 6, "hint": "Look at chapter 6.", "explain": "The strongest part of their design was the space where their ideas overlapped."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(rigid|distribute|overlap)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 4 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else{const __wc=(p.text||"").split(/\s+/).filter(Boolean).length;view.innerHTML=`<div class="book-page${__wc>55?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;}document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}

function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById(
