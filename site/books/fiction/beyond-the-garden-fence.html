 16px;display:flex;align-items:center;gap:14px;box-shadow:0 14px 38px rgba(111,74,182,.24);border:1px solid rgba(255,255,255,.32)}.evidence-banner strong{text-shadow:0 1px 6px rgba(60,35,110,.35)}.evidence-banner span{font-size:.84rem;color:#fff}.evidence-banner button{border:0;border-radius:10px;padding:9px 12px;background:rgba(255,255,255,.92);color:var(--purple);font-weight:950;cursor:pointer}.footer{text-align:center;color:var(--muted);font-size:.8rem;padding:13px}

<script>

const pages=[{"type": "cover", "title": "Beyond the Garden Fence", "subtitle": "Two Paths Crossed at the Edge of the Schoolyard.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/beyond-the-garden-fence-assets/cover.jpg"}, {"text": "1. Maya — Tracks by the Lettuce\nBefore the morning bell, Maya found paw prints beside the school garden. They were smaller than a dog's and formed a neat line toward the back fence. Beyond it, a gray fox stood beneath an oak, its black-tipped tail low and still.\nMaya wanted a closer photograph, but her teacher, Mr. Grant, kept the class on the walkway. He reminded them never to approach or feed wildlife. The fox slipped into shrubs beside the drainage corridor. Maya named it Silver in her notebook, though she knew a wild animal did not belong to her.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/beyond-the-garden-fence-assets/page1.jpg"}, {"text": "2. The Fox — A Narrow Route\nThe fox knew the school as a bright, noisy opening between two strips of cover. Before sunrise, the grounds were quiet. A gap beneath the back fence led from the drainage corridor to another patch of trees. The fox did not seek children. It sought a safe path and the scent of mice near the compost area.\nThen a metal lid banged. Voices rose. The fox froze, listening for distance and direction. When footsteps remained on the walkway, it moved along the fence instead of across the open yard. The shrubs closed behind its gray back.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/beyond-the-garden-fence-assets/page2.jpg"}, {"text": "3. Maya — The Wrong Welcome\nAt lunch, someone left a bowl of crackers near the fence. Maya understood the kind intention, but remembered Mr. Grant's warning. Food could draw wildlife closer to people, change natural behavior, and attract other animals. She told an adult instead of moving toward the fence herself.\nThe custodian removed the bowl and secured a loose trash lid. The school contacted a local wildlife educator, Dr. Hassan. She confirmed from the photographs that the visitor was a gray fox, a species able to live near wooded edges and neighborhoods. “Coexisting starts with distance,” she said.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/beyond-the-garden-fence-assets/page3.jpg"}, {"text": "4. The Fox — Too Many Scents\nThat evening, the fox returned to a different-smelling yard. The crackers were gone. The trash lid no longer lifted in the breeze. Without the sharp scent of human food, the fox followed the quieter trail of beetles and mice along the corridor.\nNear the garden, new footsteps and voices lingered in its memory. The fox waited in cover until the grounds emptied. It did not know about rules, classrooms, or wildlife lessons. It knew open space, sudden noise, hunger, and the safest direction home.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/beyond-the-garden-fence-assets/page4.jpg"}, {"text": "5. Maya — A Map for Sharing Space\nDr. Hassan helped the class map where the fox had entered and exited without revealing a den location. The goal was not to chase or trap a healthy animal. Adults inspected the campus for attractants, secured compost, and planned how to keep students away from the corridor at dawn and dusk.\nMaya's first map placed the school at the center. Her second showed the connected shrubs and trees continuing far beyond the fence. What looked like a visitor crossing their property could also be an animal traveling through a habitat divided by roads and buildings.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/beyond-the-garden-fence-assets/page5.jpg"}, {"text": "6. Two Views of the Fence\nFor Maya, the fence marked the edge of the school garden. It protected vegetables and showed students where to stop, but for the fox the same fence was an obstacle with one narrow gap along a familiar route. Neither view made the other disappear.\nThe facilities team, guided by wildlife professionals, kept the student area secure while preserving an appropriate passage outside the garden zone. Signs reminded families to observe from a distance, remove food, and report unusual animal behavior to adults. The fox remained wild, not a mascot.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/beyond-the-garden-fence-assets/page6.jpg"}, {"text": "7. Beyond the Bell\nWeeks passed before Maya saw the fox again. One foggy morning, Silver appeared beyond the far fence, crossed quickly between shrubs, and vanished before the bell. No one followed. Maya simply marked the time and direction in the class observation log.\nShe had once imagined that caring meant getting closer. Now she understood another kind of care: making room, reducing danger, and accepting that a wild creature's story continued beyond her view. The bell rang. Maya entered the classroom, and the quiet path remained outside.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/beyond-the-garden-fence-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did Maya find beside the school garden before the morning bell?", "choices": ["A lost dog", "Paw prints leading toward the back fence", "A broken fence"], "answer": 1, "evidencePage": 1, "hint": "Look at chapter 1.", "explain": "Maya found paw prints that formed a neat line toward the back fence."}, {"q": "Why did the fox avoid crossing the open yard when it heard footsteps?", "choices": ["It was looking for the crackers", "It wanted to play with the children", "It was listening for distance and direction, and stayed safe along the fence"], "answer": 2, "evidencePage": 2, "hint": "Look at chapter 2.", "explain": "The fox froze, listening for distance and direction, then moved along the fence instead of across the open yard."}, {"q": "What happened after someone left a bowl of crackers near the fence?", "choices": ["The custodian removed the bowl, and the school contacted a wildlife educator", "The fox stopped visiting the school forever", "Nothing happened at all"], "answer": 0, "evidencePage": 3, "hint": "Look at chapter 3.", "explain": "The custodian removed the bowl, and the school contacted a local wildlife educator, Dr. Hassan."}, {"q": "What did Maya's second map show, that her first map did not?", "choices": ["Only the school garden itself", "The connected shrubs and trees continuing far beyond the fence", "The location of the fox's den"], "answer": 1, "evidencePage": 5, "hint": "Look at chapter 5.", "explain": "Her second map showed the connected shrubs and trees continuing far beyond the fence."}, {"q": "What is the big idea of this story?", "choices": ["Wild animals should be fed and made into pets", "The fence meant nothing to either Maya or the fox", "Two paths crossed at the edge of the schoolyard, and caring can mean making room instead of getting closer"], "answer": 2, "evidencePage": 7, "hint": "Look at the last chapter.", "explain": "Maya understood a kind of care that meant making room and accepting a wild creature's story continued beyond her view."}], "grammar": [{"q": "“Maya wanted a closer photograph, ___ her teacher kept the class on the walkway.” Which word shows contrast?", "choices": ["so", "but", "because"], "answer": 1, "evidencePage": 1, "hint": "This word contrasts wanting something with being kept back.", "explain": "“But” contrasts Maya's wish for a photo with her teacher keeping the class back.", "teach": "<b>But</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>but</b>(但是)表示两个事实之间的<b>对比</b>。</span>"}, {"q": "“Without the sharp scent of human food, the fox followed the quieter trail of beetles and mice, ___ near the garden new footsteps lingered in its memory.” Which word adds another detail?", "choices": ["so", "but", "and"], "answer": 2, "evidencePage": 4, "hint": "This word adds another detail alongside the first.", "explain": "“And” adds the detail about lingering footsteps alongside the trail of beetles and mice.", "teach": "<b>And</b> adds <b>another detail</b> alongside the first.<span class='cn'><b>and</b>(和)在第一个细节旁<b>增加另一个细节</b>。</span>"}, {"q": "“The fence protected vegetables and showed students where to stop, ___ for the fox it was an obstacle with one narrow gap.” Which word shows contrast?", "choices": ["but", "so", "and"], "answer": 0, "evidencePage": 6, "hint": "This word contrasts the two different views of the fence.", "explain": "“But” contrasts Maya's view of the fence with the fox's very different view of it.", "teach": "<b>But</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>but</b>(但是)表示两个事实之间的<b>对比</b>。</span>"}], "vocabulary": [{"q": "‘Wildlife’ means ___.", "choices": ["pet animals kept at home", "wild animals living in their natural environment", "farm animals raised for food"], "answer": 1, "evidencePage": 1, "hint": "Look at chapter 1.", "explain": "Mr. Grant reminded them never to approach or feed wildlife."}, {"q": "‘Coexisting’ means ___.", "choices": ["fighting constantly", "living in completely separate worlds with no overlap", "living together peacefully, even while being different"], "answer": 2, "evidencePage": 3, "hint": "Look at chapter 3.", "explain": "“Coexisting starts with distance,” Dr. Hassan said."}, {"q": "‘Habitat’ means ___.", "choices": ["the natural home or environment where an animal lives", "a type of fence", "a type of classroom"], "answer": 0, "evidencePage": 5, "hint": "Look at chapter 5.", "explain": "The fox was an animal traveling through a habitat divided by roads and buildings."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(wildlife|coexisting|habitat)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 4 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function saveProgress(){try{localStorage.setItem("les-beyond-the-garden-fence-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="beyond-the-garden-fence"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"beyond-the-garden-fence",bookTitle:"Beyond the Garden Fence",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

function pickVoice(){const voices=speechSynthesis.getVoices();if(!voices.length)return;const en=voices.filter(v=>/^en(-|_|$)/i.test(v.lang));const pool=en.length?en:voices;const score=v=>{let s=0;const n=(v.name||"").toLowerCase();if(/natural/.test(n))s+=8;if(/neural/.test(n))s+=6;if(/online/.test(n))s+=4;if(/google/.test(n))s+=5;if(/(aria|jenny|guy|libby|sonia|michelle|ava|andrew|emma|clara|natasha)/.test(n))s+=5;if(/(samantha|allison|karen|serena|siri|nicky|aaron)/.test(n))s+=4;if(v.localService===false)s+=3;if(/en-us|en-gb/i.test(v.lang))s+=1;if(/(zira|david|mark|hazel|compact|espeak|eloquence)/.test(n))s-=5;return s};pool.sort((a,b)=>score(b)-score(a));preferredVoice=pool[0]||null}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w. function setStatus(m,ok){var el=document.getElementById("recStatus");if(el){el.textContent=m;el.style.color=ok?"#1f8f4d":"#b23b34";}}async function toggleRecording(){const btn=document.getElementById("recordPageBtn");if(recorder&&recorder.state==="recording"){recorder.stop();btn.textContent="🎙 Record";btn.classList.remove("recording");return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setStatus("Recording works only on the published website — the microphone is turned off in this preview.",false);return}if(typeof MediaRecorder==="undefined"){setStatus("This browser can't record audio. Try Chrome/Edge, or Safari 14+.",false);return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});let opts={};if(MediaRecorder.isTypeSupported){if(MediaRecorder.isTypeSupported("audio/webm"))opts={mimeType:"audio/webm"};else if(MediaRecorder.isTypeSupported("audio/mp4"))opts={mimeType:"audio/mp4"};}chunks=[];recorder=new MediaRecorder(stream,opts);recorder.ondataavailable=e=>{if(e.data&&e.data.size>0)chunks.push(e.data)};recorder.onstop=()=>{if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(new Blob(chunks,{type:(recorder.mimeType||"audio/webm")}));document.getElementById("playRecordingBtn").disabled=false;document.getElementById("deleteRecordingBtn").disabled=false;setStatus("Saved! Tap ▶ Play to hear your reading.",true);stream.getTracks().forEach(t=>t.stop())};recorder.start();btn.textContent="■ Stop";btn.classList.add("recording");setStatus("Recording… tap ■ Stop when you finish.",true)}catch(e){var n=(e&&e.name)?e.name:String(e);if(n==="NotAllowedError"||n==="SecurityError"){setStatus("Microphone blocked. In the chat preview the mic is always off — use the live website, then tap Allow (or click 🔒 in the address bar → allow Microphone → reload).",false);}else if(n==="NotFoundError"){setStatus("No microphone found on this device.",false);}else{setStatus("Could not record ("+n+"). Use the live website in Chrome/Edge/Safa
