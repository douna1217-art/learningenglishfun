const quizzes={"comprehension":[{"q":"Who raced with Sam and Mia?","choices":["a cat","Rex the dog","a bird"],"answer":1,"evidencePage":1,"hint":"Look at page 1.","explain":"Rex the dog raced with Sam and Mia. (RL.1.1/1.3)"},{"q":"Who was the fastest runner?","choices":["Rex","Mia","Sam"],"answer":2,"evidencePage":2,"hint":"Look at page 2.","explain":"Sam was the fastest of all. (RL.1.1)"},{"q":"What happened to Sam during the race?","choices":["He won a prize","He tripped and fell","He flew a kite"],"answer":1,"evidencePage":3,"hint":"Look at page 3.","explain":"Sam tripped on a rock and fell down. (RL.1.3)"},{"q":"What is the lesson of the story?","choices":["Always run fast","Trying your best and being kind matter most","Dogs are fast"],"answer":1,"evidencePage":6,"hint":"Think about what Mia said at the end.","explain":"The story teaches that trying your best and being kind matter most. (RL.1.2)"}],"grammar":[{"q":"“Sam was the ___ runner of all.” Which word fits?","choices":["fast","faster","fastest"],"answer":2,"evidencePage":2,"hint":"He beat everyone, not just one.","explain":"“Fastest” compares three or more — the most of all.","teach":"Use <b>-est</b> to compare 3 or more: <b>fastest</b> = #1 of all. <b>faster</b> (-er) compares just 2. <b>fast</b> compares none.<span class='cn'>三者以上用 <b>-est</b>:<b>fastest</b>=最快;<b>faster</b>(-er)只比两者;<b>fast</b> 不作比较。</span>"},{"q":"“The runners ___ ready.” Which word fits?","choices":["was","were"],"answer":1,"evidencePage":1,"hint":"Is it one runner or many?","explain":"Use “were” for more than one: the runners were ready.","teach":"Use <b>were</b> with more than one (the runners = plural). Use <b>was</b> with one (the runner was ready).<span class='cn'>复数用 <b>were</b>(the runners);单数用 <b>was</b>(the runner)。</span>"},{"q":"Sam points to the far path and says, “Go ___ way!”","choices":["this","that"],"answer":1,"evidencePage":5,"hint":"Is the path near or far?","explain":"Use “that” for something far away.","teach":"<b>that</b> points to something <b>far</b> away (the far path). <b>this</b> points to something <b>near</b> you.<span class='cn'><b>that</b> 指<b>远</b>处(那条远路);<b>this</b> 指<b>近</b>处。</span>"}],"vocabulary":[{"q":"“Lined up” means they stood in a ___.","choices":["line","circle","pile"],"answer":0,"evidencePage":1,"hint":"How do racers start?","explain":"“Lined up” means they stood in a line, one next to another."},{"q":"“The finish line” is where the race ___.","choices":["ends","begins","stops for lunch"],"answer":0,"evidencePage":5,"hint":"Is it the start or the end?","explain":"The finish line is where the race ends."},{"q":"“They cheered” means they ___.","choices":["shouted happily","cried","whispered"],"answer":0,"evidencePage":6,"hint":"How do you feel when you finish a race?","explain":"“Cheered” means they shouted happily to celebrate."}]};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(fast|faster|fastest|race|best|kind)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 1 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}

function saveProgress(){try{localStorage.setItem("les-the-big-race-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-big-race::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-big-race",bookTitle:"The Big Race",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}
