<script>/*les-speech-shim*/

<script>

const pages=[{"type": "cover", "title": "The Portrait with the Crooked Tail", "subtitle": "A Squirrel Orders a Serious Portrait, Until a Scatter of Acorns Shows the Painter What Visitors Will Remember", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-portrait-with-the-crooked-tail-assets/cover.jpg"}, {"text": "1. A Portrait Fit for the Mantel\nRook wanted a portrait that would make visitors lower their voices. He had seen one in a grand house, a squirrel with a distant gaze, an enormous collar, and a tail so straight that it looked ironed. Rook owned neither a grand house nor an iron. He did, however, have a mantel and enough acorns to pay Bram, the woodland painter. He arrived at the studio wearing his cleanest blue vest.\nBram asked how Rook wanted to be painted. Rook described the distant gaze. He demonstrated the serious expression. Then he tried to straighten his tail, which had always preferred a comfortable curl. Bram suggested leaving it where it naturally fell. Rook said a portrait was meant to improve a person. Bram set a clean canvas on the easel and asked him to take a seat. He did not promise what sort of improvement would occur.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-portrait-with-the-crooked-tail-assets/page1.jpg"}, {"text": "2. The Work of Looking Important\nFor the first ten minutes, Rook looked toward the far corner as though expecting news from a country he owned. His nose itched. One hindpaw went to sleep. His tail slowly curled around the stool leg until Bram asked whether the tail had received the same instructions as the rest of him. Rook uncurled it and resumed being important. A fly crossed the room. He watched it without moving his head.\nBram worked steadily. He asked Rook to lower his chin a little. Rook raised it instead because he thought dignity probably lived somewhere above the ceiling. After a while, he asked whether the painting was nearly finished. Bram said the face was coming along. The expression was taking longer. Rook wanted to ask what was wrong with it, but he was afraid that speaking might disturb the serious look he had worked so hard to hold.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-portrait-with-the-crooked-tail-assets/page2.jpg"}, {"text": "3. A Very Respectable Stranger\nAt last Bram turned the easel so Rook could see. The painted squirrel looked clean, serious, and prepared to refuse several perfectly reasonable requests. Its blue vest was excellent. Its tail looked longer than Rook remembered, although Bram said he had painted what he had been shown. Rook stood in front of the canvas and tried to feel satisfied. It was almost exactly the portrait he had ordered.\nHe asked whether the mouth could be made friendlier. Bram held up a small mirror. Rook put on his important expression. The mouth in the mirror looked much like the mouth in the painting. Rook lowered the mirror. He said perhaps the eyes needed something. Bram asked what. Rook could not name it. He had spent the whole morning deciding what he wanted to look like and almost no time deciding what he wanted visitors to recognize.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-portrait-with-the-crooked-tail-assets/page3.jpg"}, {"text": "4. The Question About the Chair\nBram covered the brush jar and offered Rook a break. Rook said he did not need one. Then he stood so quickly that his stiff hindleg nearly persuaded him otherwise. He walked around the room until it felt like his leg again. Bram asked whether he usually sat in that manner at home. Rook admitted that he usually sat sideways, with one paw on the mantel and his tail doing whatever it pleased.\nHe told Bram about the grand-house portrait. Bram said it might have looked entirely natural to the squirrel who commissioned it. That was an irritating possibility. Rook had assumed that grandness could be borrowed like a hat. He looked again at the painting. It was not badly done. In fact, its accuracy was becoming inconvenient. He asked whether Bram had ever painted someone who changed his mind after seeing himself. Bram said yes, quite often.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-portrait-with-the-crooked-tail-assets/page4.jpg"}, {"text": "5. The Acorns on the Floor\nRook decided to pay for the work. He put his little bag on the table, opened it, and discovered that the drawstring had knotted itself around the wrong end. When he pulled, the bag tipped. Acorns scattered across the floor. He forgot his expression. He crouched to catch one rolling beneath the stool and stopped another with a hindpaw. His tail made its usual crooked hook behind him. Bram moved the wet canvas out of the way.\nOne acorn rolled into Bram's empty slipper beside the wall. Rook said it had found better accommodation than either of them. Bram laughed. Rook laughed too, still crouching beside the stool. While Rook gathered the acorns into the bag, Bram took a small sheet of paper and made a quick pencil drawing. Rook was too busy explaining the duties of an acorn hotel manager to notice that anyone was drawing him.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-portrait-with-the-crooked-tail-assets/page5.jpg"}, {"text": "6. The Squirrel in the Drawing\nBram showed him the sketch when the last acorn was found. It was small and unfinished. Rook was crouching, his vest slightly crooked, his mouth open in the middle of a joke. His tail bent in its familiar hook. There was nothing distant about his gaze. He seemed to be looking at someone who had said something worth answering. Rook recognized the squirrel immediately. He looked from the sketch to the grand portrait on the easel.\nHe asked whether he could have the drawing as well. Bram said he could. Rook still owed the agreed price for the painting, which suited him. He had asked for the work, and Bram had done it. They counted the acorns carefully this time. Rook explained that he had no intention of throwing away a respectable portrait simply because he had discovered someone more interesting on a scrap of paper. Bram said he was glad to hear it.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-portrait-with-the-crooked-tail-assets/page6.jpg"}, {"text": "7. Two Places on the Mantel\nThe large portrait went above Rook's mantel. The small drawing stood on the shelf below it, held upright in a plain wooden frame. When visitors came, some noticed the painting first and lowered their voices, exactly as Rook had hoped. Then they saw the sketch. Usually they smiled and asked what had happened to the acorns. Rook had been waiting for that question. It was an excellent beginning to a story.\nOnce, a visitor said the tail in the sketch was crooked. Rook looked at his own tail, which had curled itself around the leg of his chair. He said the artist had been unusually accurate. Then he offered the visitor a seat and began describing the acorn that had rented a slipper. Above him, the painted squirrel continued to look important. On the shelf below, the smaller squirrel appeared to be enjoying the company.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-portrait-with-the-crooked-tail-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "Why did Rook want a portrait?", "choices": ["The painter had asked to paint him", "He wanted visitors to lower their voices, as they did for a grand portrait he had seen", "He needed a picture for his passport"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Rook wanted a portrait that would make visitors lower their voices, like the one he had seen in a grand house."}, {"q": "How did Rook try to look important while he sat for Bram?", "choices": ["He stood on the stool", "He stared at a far corner, raised his chin, and tried to keep his tail straight", "He talked to Bram the whole time"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "He looked toward the far corner as if expecting news, raised his chin, and tried to straighten his tail."}, {"q": "What did Rook think of the finished painting?", "choices": ["It was almost exactly what he had ordered, but something about it felt missing", "It was too small for his mantel", "It looked nothing like him"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "It was almost exactly the portrait he had ordered, but he could not name what the eyes needed."}, {"q": "What made the acorns scatter across the floor?", "choices": ["A fly landed on the bag", "The drawstring of his bag knotted, and the bag tipped when he pulled", "Bram knocked over the table"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "The drawstring had knotted around the wrong end, and when he pulled, the bag tipped."}, {"q": "Why did Rook keep both the painting and the sketch?", "choices": ["Bram forced him to take both", "The sketch was worth more acorns", "He saw that the quick sketch showed him as himself, and the painting was still respectable"], "answer": 2, "evidencePage": 6, "hint": "Look at page 6.", "explain": "The sketch showed him mid-joke with nothing distant about his gaze, and he did not want to throw away the respectable portrait."}], "grammar": [{"q": "The Latin root ‘port’ means ‘carry’. Which word has the same root?", "choices": ["transport", "porridge", "poster"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "To transport something is to carry it from one place to another.", "teach": "The Latin root <b>port</b> means carry, like <b>transport</b> and <b>important</b>.<span class='cn'>拉丁词根 <b>port</b> 表示“携带”，比如 <b>transport</b>（运输）和 <b>important</b>（重要的）。</span>"}, {"q": "‘A squirrel with a tail so straight that it looked ironed.’ What does this comparison show?", "choices": ["The tail was very stiff and flat", "The squirrel had been in a fire", "The squirrel was very old"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Comparing a tail to something ironed shows how straight and stiff it was.", "teach": "Writers compare things to show an extreme, like <b>a tail so straight that it looked ironed</b>.<span class='cn'>作者用比较来突出程度，比如 <b>a tail so straight that it looked ironed</b>（尾巴直得像熨过一样）。</span>"}, {"q": "‘If Rook ___ the sketch first, he might have ordered a different portrait.’ Which words complete the sentence?", "choices": ["has seen", "would see", "had seen"], "answer": 2, "evidencePage": 6, "hint": "Look at page 6.", "explain": "The sentence talks about something that did not happen in the past, so it needs “had seen”.", "teach": "To talk about something that did not happen, use <b>had</b> plus a past form in the <b>if</b> part, like <b>If he had seen it</b>.<span class='cn'>谈论过去没有发生的事，<b>if</b> 部分要用 <b>had</b> 加过去分词，比如 <b>If he had seen it</b>（如果他当时看到了）。</span>"}], "vocabulary": [{"q": "‘Portrait’ means ___.", "choices": ["a place to hang pictures", "a painting or drawing of a person or animal", "a tool for painting"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Rook wanted a portrait that would make visitors lower their voices."}, {"q": "‘Commissioned’ means ___.", "choices": ["asked and paid someone to make something", "painted by accident", "stole from someone"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Bram said it might have looked entirely natural to the squirrel who commissioned it."}, {"q": "‘Accuracy’ means ___.", "choices": ["a very fast speed", "a feeling of great pride", "the quality of being exactly correct"], "answer": 2, "evidencePage": 4, "hint": "Look at page 4.", "explain": "It was not badly done, and its accuracy was becoming inconvenient."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(portrait|commissioned|accuracy)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 5 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}var TEACH_ICONS='<svg class="ic i-spk" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.5v5h3.6l4.9 4.5V5L7.6 9.5H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.6 9.2a4 4 0 010 5.6M18.2 6.6a7.6 7.6 0 010 10.8"/></svg><svg class="ic i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></svg><svg class="ic i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 5.3v13.4c0 .8.9 1.3 1.6.8l9.6-6.7c.6-.4.6-1.2 0-1.6L9.8 4.5c-.7-.5-1.6 0-1.6.8z"/></svg>';var _tp=null;function _tpSet(b,st){if(!b)return;b.classList.toggle('is-playing',st==='playing');b.classList.toggle('is-paused',st==='paused');b.setAttribute('aria-pressed',st==='playing'?'true':'false');var z=b.dataset.part==='cn',L=st==='playing'?(z?'\u6682\u505C':'Pause'):st==='paused'?(z?'\u7EE7\u7EED\u64AD\u653E':'Resume'):b.dataset.label;b.setAttribute('aria-label',L);b.title=L;}function stopTeachAudio(){var c=_tp;if(!c)return;_tp=null;try{if(c.audio){c.audio.onended=c.audio.onerror=c.audio.ontimeupdate=null;c.audio.pause();}}catch(e){}if(c.mode==='tts'){try{speechSynthesis.cancel();}catch(e){}}_tpSet(c.btn,'idle');}function _tpFallback(btn){try{var u=new SpeechSynthesisUtterance(btn.dataset.text||'');u.lang=btn.dataset.lang||'en-US';var cur={btn:btn,mode:'tts'};_tp=cur;u.onend=u.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');}};_tpSet(btn,'playing');speechSynthesis.speak(u);}catch(e){}}function playTeachAudio(btn){if(_tp&&_tp.btn===btn){if(_tp.mode==='audio'){var a0=_tp.audio;if(a0.paused){var p0=a0.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}

function saveProgress(){try{localStorage.setItem("les-the-portrait-with-the-crooked-tail-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-portrait-with-the-crooked-tail"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-portrait-with-the-crooked-tail",bookTitle:"The Portrait with the Crooked Tail",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}
