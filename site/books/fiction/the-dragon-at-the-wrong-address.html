<script>/*les-speech-shim*/
(function(){var w=window,ok=false,errs=[];
/* Some Android in-app browsers (UC/Quark and other vendor kernels, older WebViews) have no
   speechSynthesis at all. The page script calls it while loading, so it stopped there and the
   story was never drawn (the quiz still worked because its handlers were bound earlier).
   Give such browsers a silent stand-in so the rest of the page runs normally. */
try{ok=typeof w.speechSynthesis==="object"&&w.speechSynthesis!==null}catch(e){}
if(typeof w.SpeechSynthesisUtterance!=="function"&&typeof w.SpeechSynthesisUtterance!=="object"){
w.SpeechSynthesisUtterance=function(t){this.text=t==null?"":String(t);this.lang="";this.rate=1;this.pitch=1;this.volume=1;this.voice=null}}
if(!ok){var gen=0,told=false;
w.speechSynthesis={speaking:false,paused:false,pending:false,
getVoices:function(){return[]},cancel:function(){gen++},pause:function(){},resume:function(){},
addEventListener:function(){},removeEventListener:function(){},
speak:function(u){var g=gen;
if(!told&&typeof w.setStatus==="function"){told=true;try{w.setStatus("This browser can't read aloud, but you can still read and practice. 当前浏览器不支持朗读，仍可阅读和做题。",false)}catch(e){}}
setTimeout(function(){if(g===gen&&u&&u.onstart){try{u.onstart({})}catch(e){}}},0);

/* If the story still is not drawn after loading, say why on the page itself, so a screenshot

<script>

const pages=[{"type": "cover", "title": "The Dragon at the Wrong Address", "subtitle": "A Courier Dragon Lands at the Wrong House and Learns That an Honest Mistake Can Make a Better Record Than a Perfect One", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-dragon-at-the-wrong-address-assets/cover.jpg"}, {"text": "1. A Package and a Problem\nThe dragon landed in Nell's front garden between the rosemary bush and the clothesline. He folded his copper wings, straightened the strap of his delivery bag, and asked whether she was Mrs. Moss. Nell said she wasn't. He studied the package in his forepaw, then studied the house. A clothespin slid along the line behind his ear. He looked as though he would prefer a dangerous storm to this small uncertainty.\nNell had never met a dragon, although she had hoped to meet one for most of her twelve years. When he asked whether dragons often delivered here, she said, “Often enough.” It seemed more dignified than admitting that she was trying to decide whether his scales would feel warm. The dragon introduced himself as Ferric, a courier with an excellent record. He explained that an excellent record consisted, so far, of no mistakes whatsoever. Nell wished she hadn't mentioned the other dragons.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-dragon-at-the-wrong-address-assets/page1.jpg"}, {"text": "2. The House Was Quite Certain\nFerric read out the number. Twelve. Nell confirmed it. He read the name on the package again. Mrs. Moss. Nell suggested that the number might be correct while something else wasn't. Ferric said the address had been copied from the dispatch ledger by a very senior dragon. A mistake in the ledger seemed to trouble him more than the possibility that Nell had somehow forgotten her own name. She began to feel protective of her ordinary front door.\nShe asked him to read the street name. He hesitated, then turned the package toward her. Wren Lane. Nell lived on Wren Walk. Wren Lane was on the other side of the village, where the houses faced a small orchard. Ferric tucked the package into his satchel with great care. He announced that this had merely been a precautionary landing. Nell said that naturally she had assumed as much. Neither sounded convinced.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-dragon-at-the-wrong-address-assets/page2.jpg"}, {"text": "3. The View from Above\nNell told her mother where she was going, then offered to show Ferric the way. He could have flown, but from the air the two streets had looked remarkably similar. He agreed to walk, provided she understood that walking was not an admission of being lost. They set off along the broad sidewalk. Ferric kept his tail close to his feet so it wouldn't sweep anyone's shopping out of their hands.\nFrom above, he explained, houses were mostly roofs. Chimneys were useful landmarks. Door colors weren't much help. Nell had never thought about directions that way. She described the village by the place that sold hot rolls and the wall where her bicycle chain had come off. Ferric said neither landmark had appeared on his flight chart. For the first time that afternoon, Nell admitted that she had never seen one of those. Ferric offered to show her when they stopped.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-dragon-at-the-wrong-address-assets/page3.jpg"}, {"text": "4. An Experienced Dragon Expert\nThey stopped beside a little public garden, where Ferric took a folded chart from his bag. He held it low enough for Nell to see. She recognized the village green, but she couldn't tell which square represented her house. Ferric waited for her expert comment. She pointed to a square at random. He turned his head slowly. That square, he said, was the roof of a very large chicken shed.\nNell could have invented a reason for living in a chicken shed. For a moment she considered it. Then she told him that he was the first dragon she had ever met. Ferric looked relieved rather than offended. He had been wondering whether the other couriers were truly visiting this tiny street so often without his knowing. Nell laughed, and he made a low rattling sound that might have been a laugh too. The chart became much easier to look at once she stopped pretending to understand it.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-dragon-at-the-wrong-address-assets/page4.jpg"}, {"text": "5. What a Perfect Record Cost\nAt the orchard corner, Ferric stopped again. He would have to enter the delay in his delivery book. Nell suggested leaving out the wrong landing, since they had found the right street eventually. Ferric shook his head. That was precisely what made him uneasy. He could keep his perfect record only by changing what perfect meant whenever something went wrong. He hadn't expected his first mistake to require quite so much walking afterward.\nNell remembered how quickly her own small invention had begun needing additional inventions. She asked whether the senior dragon would be angry. Ferric didn't know. He had never given the senior dragon an opportunity. For a while they listened to apples dropping softly in the orchard. Then Ferric said he could record the street names clearly enough to warn the next courier. Nell pointed out the cottage ahead. A woman in a red cardigan was opening its front gate.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-dragon-at-the-wrong-address-assets/page5.jpg"}, {"text": "6. The Correct Pair of Boots\nMrs. Moss had been waiting for a pair of pink walking boots. She had ordered them from her sister's shop in the next valley. Ferric apologized for the delay without mentioning a precautionary landing. He named the two streets, explained the confusion, and set the package on her garden table. Mrs. Moss said her groceries had once gone to Wren Walk too. She was considerably less impressed by the mistake than Ferric had expected.\nWhen she opened the box, the boots were bright enough to alarm a sensible bird. Nell admired them. Mrs. Moss said she was tired of sensible brown things. She signed Ferric's delivery book, thanked him, and asked whether either visitor would like a cookie. Ferric accepted two. His wings relaxed against his back. Nell wondered how many enjoyable things he had passed over while concentrating on being the sort of dragon to whom nothing unexpected ever happened.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-dragon-at-the-wrong-address-assets/page6.jpg"}, {"text": "7. A Useful Mark in the Book\nBefore leaving, Ferric wrote in his delivery book. Nell couldn't see the words, but he told her what he had put, correct package delivered, incorrect first landing, street names similar from above. The final part was a recommendation to check at ground level. It was a rather long account of something that had taken one foolish moment. Ferric said that was often how useful records began. Then he asked Nell whether she wanted to watch him take off.\nShe said yes, with no suggestion that she had seen it all before. They moved to the open village green, away from roofs and clotheslines. Ferric checked that she stood well clear before spreading his wings. In the air he looked magnificent. At ground level he had looked worried, dusty, and pleased about cookies. Nell found she preferred knowing both versions. As he turned toward the valley, she waved to the first dragon she had actually met.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-dragon-at-the-wrong-address-assets/page7.jpg"}];

in": "Chimneys were useful landmarks."}]};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(courier|precautionary|landmarks)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 6 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[ke
