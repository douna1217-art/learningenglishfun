 16px;display:flex;align-items:center;gap:14px;box-shadow:0 14px 38px rgba(111,74,182,.24);border:1px solid rgba(255,255,255,.32)}.evidence-banner strong{text-shadow:0 1px 6px rgba(60,35,110,.35)}.evidence-banner span{font-size:.84rem;color:#fff}.evidence-banner button{border:0;border-radius:10px;padding:9px 12px;background:rgba(255,255,255,.92);color:var(--purple);font-weight:950;cursor:pointer}.footer{text-align:center;color:var(--muted);font-size:.8rem;padding:13px}

<script>

const pages=[{"type": "cover", "title": "The Cartographer of Small Doors", "subtitle": "Some Maps Reveal a Path. Others Reveal a Responsibility.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-cartographer-of-small-doors-assets/cover.jpg"}, {"text": "1. The Door in the Roots\nTheo noticed places other people passed without seeing: the snail trail beneath the drinking fountain, the sparrow nest above the gym, the way the old oak's roots made valleys in the soil. While sketching the school garden, he found a brass door no taller than his hand tucked between two roots.\nThere was no knob—only a keyhole shaped like a leaf. When Theo touched it with his pencil, the door opened on a hallway lit by firefly lamps. A wren in a red satchel stepped out and bowed. “At last,” she said. “A cartographer.”", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-cartographer-of-small-doors-assets/page1.jpg"}, {"text": "2. The Living Map\nThe wren introduced herself as Bristle and handed Theo a pale leaf. Golden lines spread across it like sunlight through branches. They showed tunnels under hedges, stairways inside stone walls, and sheltered rooms where small creatures waited out storms. One path ended in a blank curl.\n“Our routes keep changing,” Bristle explained. “Roots grow. Puddles rise. Big feet move stones. We need someone who can see both the large world and the small one.” Theo's chest felt as bright as the map. He promised to chart every hidden door.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-cartographer-of-small-doors-assets/page2.jpg"}, {"text": "3. A Map That Would Not Stay Still\nFor three afternoons, Theo measured shadows, counted root arches, and marked safe crossings. Yet each morning the golden lines had shifted. A sprinkler flooded one tunnel. A fallen branch opened another. The map behaved less like a photograph and more like a conversation.\nTheo began to understand its language. A pulsing line meant danger. A silver dot meant shelter. When he completed the blank route to the herb garden, dozens of beetles crossed before the next rain. Theo wanted everyone to know what he had accomplished.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-cartographer-of-small-doors-assets/page3.jpg"}, {"text": "4. The Photograph\nTheo showed the brass door to his friend Samira after school. “One picture,” he said. “Then people will believe me.” Samira raised her tablet. Before she could press the button, the door shivered and shrank until it was no larger than a seed.\nBehind it, the firefly lamps went dark. Bristle's voice came through the keyhole, thin with fear: “A map can guide visitors, but it can also guide those who do not ask.” Theo lowered Samira's tablet. He had thought discovery made the door his to reveal.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-cartographer-of-small-doors-assets/page4.jpg"}, {"text": "5. Blank Spaces on Purpose\nTheo apologized through the tiny keyhole. Then he and Samira studied the leaf map again. Some blank spaces were not unfinished. They formed quiet circles around nests, burrows, and winter shelters. The missing details were a kind of protection.\nSamira suggested a new legend: open routes for helpers, dotted routes that required permission, and blank areas that stayed private. Theo hesitated. A complete map had once seemed like proof of his skill. Now he saw that leaving something out could require even greater care.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-cartographer-of-small-doors-assets/page5.jpg"}, {"text": "6. A Promise in the Legend\nTheo redrew the map's legend, and he carried it to the oak. “I will not share a route without the travelers' permission,” he promised. “And I will erase any path that puts a home at risk.” The leaf warmed in his hands.\nThe brass door unfolded from seed-size to hand-size. One by one, the firefly lamps brightened. Bristle emerged and examined the new symbols. “A cartographer does not own the places on a map,” she said, “but a cartographer earns their trust.”", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-cartographer-of-small-doors-assets/page6.jpg"}, {"text": "7. The Route Home\nBy spring, Theo's map held fewer lines than his first one, but every line mattered. He and Samira guided the garden club around delicate shelters and toward places where cleanup was welcome. They never photographed the doors. Instead, they taught others to notice before stepping.\nOne afternoon, a new golden path appeared on the leaf. It curved from the tiny brass door to a mark shaped like Theo's own front gate. Bristle adjusted her red satchel. “Ready to map the route home?” Theo smiled—and checked the legend before taking the first step.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-cartographer-of-small-doors-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did Theo find tucked between two roots of the old oak?", "choices": ["A buried treasure chest", "A tiny brass door with a leaf-shaped keyhole", "A sparrow's nest"], "answer": 1, "evidencePage": 1, "hint": "Look at chapter 1.", "explain": "He found a brass door no taller than his hand, with a keyhole shaped like a leaf."}, {"q": "What did Bristle give Theo?", "choices": ["A satchel full of seeds", "A pencil that never runs out", "A living map with golden lines that kept changing"], "answer": 2, "evidencePage": 2, "hint": "Look at chapter 2.", "explain": "Bristle handed Theo a pale leaf with golden lines that showed tunnels and stairways."}, {"q": "What happened when Samira tried to photograph the brass door?", "choices": ["The door shrank to the size of a seed and the lamps went dark", "The photo came out perfectly", "Nothing happened at all"], "answer": 0, "evidencePage": 4, "hint": "Look at chapter 4.", "explain": "The door shivered and shrank until it was no larger than a seed, and the lamps went dark."}, {"q": "What did Theo and Samira realize about the map's blank spaces?", "choices": ["They were simply mistakes to fix", "Some blank spaces were a kind of protection around private places", "They meant Theo had failed at his job"], "answer": 1, "evidencePage": 5, "hint": "Look at chapter 5.", "explain": "The missing details were a kind of protection around nests, burrows, and winter shelters."}, {"q": "What is the big idea of this story?", "choices": ["Discovering something makes it yours to reveal to everyone", "A map should always show every single detail", "Some maps reveal a path, and others reveal a responsibility"], "answer": 2, "evidencePage": 6, "hint": "Look at the last chapters.", "explain": "A cartographer does not own the places on a map—a cartographer earns their trust."}], "grammar": [{"q": "“There was no knob, ___ only a keyhole shaped like a leaf.” Which word shows contrast?", "choices": ["so", "but", "because"], "answer": 1, "evidencePage": 1, "hint": "This word contrasts having no knob with having a keyhole instead.", "explain": "“But” contrasts the missing knob with the leaf-shaped keyhole that was there instead.", "teach": "<b>But</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>but</b>(但是)表示两个事实之间的<b>对比</b>。</span>"}, {"q": "“'A cartographer does not own the places on a map,' she said, ___ 'a cartographer earns their trust.'” Which word shows contrast?", "choices": ["so", "because", "but"], "answer": 2, "evidencePage": 6, "hint": "This word contrasts owning a place with earning trust.", "explain": "“But” contrasts owning a place with the harder, more important work of earning trust.", "teach": "<b>But</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>but</b>(但是)表示两个事实之间的<b>对比</b>。</span>"}, {"q": "“Theo redrew the map's legend, ___ he carried it to the oak.” Which word joins these two actions?", "choices": ["and", "so", "but"], "answer": 0, "evidencePage": 6, "hint": "This word joins two actions Theo did in order.", "explain": "“And” joins redrawing the legend with carrying it to the oak.", "teach": "<b>And</b> joins <b>two actions done in order</b>.<span class='cn'><b>and</b>(和)连接<b>按顺序进行</b>的两个动作。</span>"}], "vocabulary": [{"q": "‘Cartographer’ means ___.", "choices": ["a type of small door", "a person who makes maps", "a type of bird"], "answer": 1, "evidencePage": 1, "hint": "Look at chapter 1.", "explain": "Bristle called Theo “a cartographer”—someone who makes maps."}, {"q": "‘Legend’ (on a map) means ___.", "choices": ["a make-believe story with no truth", "a type of firefly lamp", "a key that explains what the symbols on a map mean"], "answer": 2, "evidencePage": 5, "hint": "Look at chapter 5.", "explain": "Samira suggested a new legend with open routes, dotted routes, and blank private areas."}, {"q": "‘Permission’ means ___.", "choices": ["agreement or approval to do something", "a type of map route", "a type of keyhole"], "answer": 0, "evidencePage": 5, "hint": "Look at chapter 5.", "explain": "Dotted routes on the new map required permission before travelers could use them."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(cartographer|legend|permission)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 4 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}
