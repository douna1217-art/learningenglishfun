<script>/*les-speech-shim*/
(function(){var w=window,ok=false,errs=[];
/* Some Android in-app browsers (UC/Quark and other vendor kernels, older WebViews) have no

   Give such browsers a silent stand-in so the rest of the page runs normally. */
try{ok=typeof w.speechSynthesis==="object"&&w.speechSynthesis!==null}catch(e){}
if(typeof w.SpeechSynthesisUtterance!=="function"&&typeof w.SpeechSynthesisUtterance!=="object"){
w.SpeechSynthesisUtterance=function(t){this.text=t==null?"":String(t);this.lang="";this.rate=1;this.pitch=1;this.volume=1;this.voice=null}}
if(!ok){var gen=0,told=false;
w.speechSynthesis={speaking:false,paused:false,pending:false,
getVoices:function(){return[]},cancel:function(){gen++},pause:function(){},resume:function(){},
addEventListener:function(){},removeEventListener:function(){},
speak:function(u){var g=gen;
if(!told&&typeof w.setStatus==="function"){told=true;try{w.setStatus("This browser can't read aloud, but you can still read and practice. 当前浏览器不支持朗读，仍可阅读和做题。",false)}catch(e){}}
setTimeout(function(){if(g===gen&&u&&u.onstart){try{u.onstart({})}catch(e){}}},0);

<script>

const pages=[{"type": "cover", "title": "The Longest Rally at Cedar Court", "subtitle": "Two Tennis Players Invent a Game with No Winner, and Tessa Learns What Her Aim Was Missing", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-longest-rally-at-cedar-court-assets/cover.jpg"}, {"text": "1. Seven to Two\nTessa won their first game by sending the ball into the corner Julian could not reach. She lifted her racket, pleased with the clean sound it had made. They were playing a short practice game, first to seven points, and she had won seven to two. Julian retrieved the ball from the fence. He bounced it once on his strings and looked at the long shadows crossing Cedar Court.\n“Another game?” Tessa asked. “Same score, probably.” Julian shook his head. “Different game. Twenty returns in play. We count a shot when it lands inside the court.” Tessa laughed. Twenty seemed almost too easy after winning seven points. She took her place on the other side of the net. Julian sent the ball gently toward her. She saw the empty corner at once and hit it there. He watched it bounce past. “Two,” he said.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-longest-rally-at-cedar-court-assets/page1.jpg"}, {"text": "2. A Game With No Corner to Win\nThey counted five hits on the next try. Then Tessa drove the ball low and fast. Julian stretched, caught it on the edge of his racket, and sent it into the net. Tessa began to explain that he should have been ready. Then she remembered what they were trying to do. There was no point for making the ball difficult. There was only another walk to pick it up.\n“You're making it easy for me,” she said. “That's the idea,” Julian replied. He tapped the ball over again. Tessa returned it toward the middle. It felt oddly unfinished, as if she had stopped a sentence halfway through. The ball came back. This time she had to choose where to send it instead of simply looking for the place Julian was not.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-longest-rally-at-cedar-court-assets/page2.jpg"}, {"text": "3. The Shot He Had Been Saving\nAfter another short rally, Tessa asked whether Julian ever tried to hit hard. He looked at her for a moment, then asked her to send him a ball. She did. He stepped into the return and drove it past her before she had moved her racket. It struck the back fence with a sharp rattle. Tessa turned around slowly. Julian had been choosing the softer shots. She had mistaken that choice for a limit.\n“Why don't you do that every time?” she asked. He said he liked long rallies because he could feel himself learning the other player's movements. He liked winning too. These were different games. Tessa picked up the ball and rolled it across her palm. She still liked the empty corner. But she was beginning to wonder what else she had missed by watching it so closely.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-longest-rally-at-cedar-court-assets/page3.jpg"}, {"text": "4. Twelve\nThey started again. Tessa aimed where Julian stood, leaving him enough room to move without chasing. He sent the ball back with a high, comfortable curve. Eight hits. Nine. At ten, she nearly swung too hard because the ball had risen exactly where she liked it. She loosened her grip and guided it over instead. Julian returned it. Twelve. Tessa heard herself counting before he did.\nA ball that would once have seemed dull now carried a small problem for her to solve. It was a little short, or a little wider than the last one. She had to move, balance, and leave Julian something he could use. They reached sixteen before the ball bounced off Tessa's frame. She expected to be annoyed. Instead, she immediately wanted to know which hit had begun pulling them out of position.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-longest-rally-at-cedar-court-assets/page4.jpg"}, {"text": "5. The Hit After Nineteen\nThe next rally reached eighteen. Tessa watched Julian move toward the center, and for one foolish instant the empty side of the court tempted her again. She gave the nineteenth shot a little extra angle. Julian ran wide and reached it, but his return went beyond the line. The ball rolled to the fence. Neither of them said twenty. Tessa put her racket against her leg and stared at the place her shot had landed.\n“I thought you could get there,” she began. Julian looked at her, breathing hard. “I did get there.” She had no answer to that. Reaching the ball was different from having time to return it well. She collected it herself. When she came back, she said the shot had been too wide. Julian nodded. He did not make a speech, which made it easier to stay.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-longest-rally-at-cedar-court-assets/page5.jpg"}, {"text": "6. What They Had Been Watching\nThey took a water break on the bench outside the court. Julian said he watched Tessa's racket before the ball left it. Sometimes he could guess where she was aiming. Tessa admitted she mostly watched the gaps around him. She had been treating his position as a problem to beat, even when their new game needed her to help him stay in it. Julian said her quick feet had rescued several of his awkward returns.\n“You noticed those?” she asked. “I was counting on them.” Tessa looked through the fence at the court. She could still picture the nineteenth hit. It bothered her, but it no longer seemed like the only important thing that had happened. When their turn ended, they left without reaching twenty. Tessa asked whether Julian could come back the next afternoon. This time she did not predict the score.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-longest-rally-at-cedar-court-assets/page6.jpg"}, {"text": "7. The Ball That Came Back\nThey reached twenty the next day, almost without noticing. Tessa was busy returning a ball that had bounced short. Julian was already moving to meet it. He called the number when his return landed. For an instant she wanted to stop and celebrate. Instead, she stepped toward the next bounce. Twenty-one. They reached twenty-three before Julian's next shot clipped the net and fell on his own side.\nThey stood there laughing, both disappointed that it had ended. Tessa still wanted to play matches and hit shots nobody could reach. She would probably aim for the corners again tomorrow. But when Julian asked for one more rally, she sent the ball where he could find it. She watched his feet settle, his racket draw back, and the ball begin its way home. This time the part she waited for was the return.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-longest-rally-at-cedar-court-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What new game did Julian suggest?", "choices": ["Twenty returns in play, counting each shot that lands inside the court", "A game with a higher net", "A race to ten points"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "He said, “Twenty returns in play. We count a shot when it lands inside the court.”"}, {"q": "What did Tessa learn when Julian hit a hard return?", "choices": ["He had hurt his arm", "He had been choosing softer shots, not hitting as hard as he could", "He was angry with her"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Julian had been choosing the softer shots, and she had mistaken that choice for a limit."}, {"q": "How did Tessa change her playing to keep the rally going?", "choices": ["She hit harder every time", "She stopped playing", "She aimed where Julian stood and guided the ball so he could return it"], "answer": 2, "evidencePage": 4, "hint": "Look at page 4.", "explain": "She aimed where Julian stood, leaving him enough room to move, and guided the ball over."}, {"q": "What ended the rally at nineteen?", "choices": ["Tessa dropped her racket", "Tessa angled the shot too wide, and Julian’s return went out of bounds", "Julian hit the ball into the net"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "She gave the nineteenth shot extra angle, and Julian’s return went beyond the line."}, {"q": "What was different on the next day?", "choices": ["They stopped before twenty", "They played to seven points again", "They passed twenty and reached twenty-three, with Tessa sending the ball where Julian could find it"], "answer": 2, "evidencePage": 7, "hint": "Look at the last page.", "explain": "They reached twenty almost without noticing and kept going to twenty-three."}], "grammar": [{"q": "Which is the correct way to write 23 in words?", "choices": ["twentythree", "twenty three", "twenty-three"], "answer": 2, "evidencePage": 7, "hint": "Look at the last page.", "explain": "Numbers from twenty-one to ninety-nine are written with a hyphen.", "teach": "Write numbers from twenty-one to ninety-nine with a hyphen, like <b>twenty-three</b>.<span class='cn'>21 到 99 之间的数字要用连字符，比如 <b>twenty-three</b>。</span>"}, {"q": "‘It felt oddly unfinished, as if she had stopped a sentence halfway through.’ What does this comparison show?", "choices": ["The rally ended too early and felt incomplete", "Tessa forgot how to play", "Tessa was writing a story"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Stopping a sentence halfway is a comparison for something that ends before it feels finished.", "teach": "<b>As if</b> can begin a comparison that helps you picture a feeling, like <b>as if she had stopped a sentence halfway</b>.<span class='cn'><b>as if</b> 可以引出一个比喻，帮助读者想象某种感受，比如 <b>as if she had stopped a sentence halfway</b>（像话说到一半停住了）。</span>"}, {"q": "‘Julian ___ it on the edge of his racket.’ Which word belongs in the blank?", "choices": ["cot", "caught", "court"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "The action is about catching the ball, so it needs “caught”.", "teach": "<b>Caught</b> is the past tense of catch, and <b>court</b> is a place to play, and the two words sound alike.<span class='cn'><b>Caught</b> 是 catch 的过去式，而 <b>court</b> 指球场，两个词读音相近。</span>"}], "vocabulary": [{"q": "‘Retrieved’ means ___.", "choices": ["went and got something back", "hid something", "threw something away"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Julian retrieved the ball from the fence."}, {"q": "‘Tempted’ means ___.", "choices": ["forced to stop", "made to want to do something", "asked to wait"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "For one foolish instant the empty side of the court tempted her again."}, {"q": "‘Rescued’ means ___.", "choices": ["saved from a bad situation", "made much harder", "lost on purpose"], "answer": 0, "evidencePage": 6, "hint": "Look at page 6.", "explain": "Julian said her quick feet had rescued several of his awkward returns."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(retrieved|tempted|rescued)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 5 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();setListenActive(null);page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function showHint(){const item=quizzes[activeTab][qIndex[activeTab]];document.getElementById("feedback").innerHTML=`💡 ${item.hint}`}
function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}var TEACH_ICONS='<svg class="ic i-spk" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.5v5h3.6l4.9 4.5V5L7.6 9.5H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.6 9.2a4 4 0 010 5.6M18.2 6.6a7.6 7.6 0 010 10.8"/></svg><svg class="ic i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></svg><svg class="ic i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 5.3v13.4c0 .8.9 1.3 1.6.8l9.6-6.7c.6-.4.6-1.2 0-1.6L9.8 4.5c-.7-.5-1.6 0-1.6.8z"/></svg>';var _tp=null;function _tpSet(b,st){if(!b)return;b.classList.toggle('is-playing',st==='playing');b.classList.toggle('is-paused',st==='paused');b.setAttribute('aria-pressed',st==='playing'?'true':'false');var z=b.dataset.part==='cn',L=st==='playing'?(z?'\u6682\u505C':'Pause'):st==='paused'?(z?'\u7EE7\u7EED\u64AD\u653E':'Resume'):b.dataset.label;b.setAttribute('aria-label',L);b.title=L;}function stopTeachAudio(){var c=_tp;if(!c)return;_tp=null;try{if(c.audio){c.audio.onended=c.audio.onerror=c.audio.ontimeupdate=null;c.audio.pause();}}catch(e){}if(c.mode==='tts'){try{speechSynthesis.cancel();}catch(e){}}_tpSet(c.btn,'idle');}function _tpFallback(btn){try{var u=new SpeechSynthesisUtterance(btn.dataset.text||'');u.lang=btn.dataset.lang||'en-US';var cur={btn:btn,mode:'tts'};_tp=cur;u.onend=u.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');}};_tpSet(btn,'playing');speechSynthesis.speak(u);}catch(e){}}function playTeachAudio(btn){if(_tp&&_tp.btn===btn){if(_tp.mode==='audio'){var a0=_tp.audio;if(a0.paused){var p0=a0.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}
function returnToQuestion(){(function(){var b=document.getElementById("evidenceBanner");if(b&&b.parentNode)b.parentNode.removeChild(b);})();renderPanel();document.querySelector(".panel").scrollIntoView({behavior:"smooth",block:"start"})}
function nextQuestion(){const list=quizzes[activeTab];if(qIndex[activeTab]<list.length-1){qIndex[activeTab]++;renderPanel();return}completed[activeTab]=true;if(activeTab==="comprehension")activeTab="grammar";else if(activeTab==="grammar")activeTab="vocabulary";else{return showCompletion()}setTabs();renderPanel()}
function showCompletion(){completed.vocabulary=true;setTabs();const correct=Object.keys(selections).filter(k=>{const [tab,idx]=k.split('-');return selections[k]===quizzes[tab][+idx].answer}).length,total=Object.values(quizzes).reduce((a,b)=>a+b.length,0);document.getElementById("stagePill").textContent="Journey Complete";document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">Reading journey complete</div><h2>Wonderful work! 🎉</h2><p class="small">You finished Reading, Grammar, and Vocabulary.</p><div class="score-row"><div class="score-box"><b>${total}</b><br><span>Questions</span></div><div class="score-box"><b>${correct}</b><br><span>Correct now</span></div></div><div class="feedback good">You used evidence, practiced sentence skills, and learned new words.</div><button class="submit" onclick="restartPractice()">Practice Again</button></div>`}
function restartPractice(){activeTab="comprehension";qIndex={comprehension:0,grammar:0,vocabulary:0};selections={};attempts={};completed={comprehension:false,grammar:false,vocabulary:false};setTabs();renderPanel()}
function saveProgress(){try{localStorage.setItem("les-the-longest-rally-at-cedar-court-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-longest-rally-at-cedar-court"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-longest-rally-at-cedar-court",bookTitle:"The Longest Rally at Cedar Court",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}
function clearHighlight(){document.querySelectorAll(".story-word.reading").forEach(x=>x.classList.remove("reading"))}
let preferredVoice=null;
