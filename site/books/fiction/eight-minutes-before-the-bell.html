 16px;display:flex;align-items:center;gap:14px;box-shadow:0 14px 38px rgba(111,74,182,.24);border:1px solid rgba(255,255,255,.32)}.evidence-banner strong{text-shadow:0 1px 6px rgba(60,35,110,.35)}.evidence-banner span{font-size:.84rem;color:#fff}.evidence-banner button{border:0;border-radius:10px;padding:9px 12px;background:rgba(255,255,255,.92);color:var(--purple);font-weight:950;cursor:pointer}.footer{text-align:center;color:var(--muted);font-size:.8rem;padding:13px}

<script>

const pages=[{"type": "cover", "title": "Eight Minutes Before the Bell", "subtitle": "Two Students, One Locked Cart, and Two Very Different Versions of the Same Eight Minutes", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/eight-minutes-before-the-bell-assets/cover.jpg"}, {"text": "1. Amara: 8 Minutes\nI had eight minutes to roll our blue makerspace cart into the assembly. The solar model, speaker, and display cards were packed inside. Ben was supposed to bring the key, but he stood at the far end of the hall reading a wrinkled note.\nI waved. He lifted one finger, which I interpreted as wait. Waiting was exactly what had made our first rehearsal late. I pulled the cart handle, hoping the latch might open anyway. It did not. The clock above the office clicked toward 9:00.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/eight-minutes-before-the-bell-assets/page1.jpg"}, {"text": "2. Ben: 7 Minutes\nI saw Amara wave, but the note said the assembly had moved from the gym to the courtyard. Mr. Ruiz had written it quickly after a water leak. If I ran to the cart without reading the rest, we might push fragile equipment to the wrong place.\nI raised one finger to mean one important minute. Amara yanked the handle and frowned at me. I thought she was blaming me for the lock, even though the key had been clipped inside her purple binder after yesterday's rehearsal.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/eight-minutes-before-the-bell-assets/page2.jpg"}, {"text": "3. Amara: 6 Minutes\nBen finally said, \"Courtyard,\" without explaining. I heard it as a suggestion to take the longer route. I told him we did not have time for a new plan. Then he pointed at my binder, and I assumed he wanted the schedule.\nWhen I opened it, the small brass key slid onto the floor. Heat climbed into my face. Ben had not forgotten it; I had. I wanted to apologize, but the clock showed six minutes, and embarrassment made my words come out sharp: \"Why didn't you just tell me?\"", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/eight-minutes-before-the-bell-assets/page3.jpg"}, {"text": "4. Ben: 5 Minutes\nAmara's question sounded like an accusation, but I could see she was staring at the key. I almost answered, \"I tried.\" Instead, I handed her Mr. Ruiz's note and explained the leak, the courtyard entrance, and the covered ramp.\nHer shoulders lowered. She said my one-finger signal had looked like a request to wait. I admitted that \"courtyard\" had not counted as an explanation. We had each supplied a whole story where the other had offered only a gesture or a word.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/eight-minutes-before-the-bell-assets/page4.jpg"}, {"text": "5. Together: 4 Minutes\nWe unlocked the cart and checked the equipment. The covered ramp was longer but smoother than the outdoor steps. Amara pushed while Ben walked beside the solar model, holding it steady through each turn.\nAt the first doorway, a box blocked the ramp. Amara wanted to squeeze past; Ben noticed a loose display card near the wheel. This time, we each explained what we saw. We moved the box, secured the card, and kept going without guessing at the other's reason.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/eight-minutes-before-the-bell-assets/page5.jpg"}, {"text": "6. The Final Minute\nWe reached the courtyard as the principal introduced the next group. The clock visible through the doors showed 8:59. Our breathing was loud, but the solar model was safe and every card still faced forward.\nBefore we rolled onstage, Amara said, \"I thought you were delaying us.\" Ben replied, \"I thought you weren't listening.\" Both statements had been true from inside our separate eight minutes. Neither described everything that happened between us.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/eight-minutes-before-the-bell-assets/page6.jpg"}, {"text": "7. Two Timelines\nAfter the assembly, we wrote two timelines for Mr. Ruiz. Amara's began with a missing key. Ben's began with a changed location. The events overlapped, but the descriptions emphasized different worries, clues, and choices.\nWe joined the timelines at the moment the key fell from the binder. Above that point, Amara wrote ASK. Ben wrote EXPLAIN. The next time one of us raised a finger in a busy hallway, we would not expect a gesture to carry eight minutes of meaning.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/eight-minutes-before-the-bell-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What happened when Amara pulled the cart handle?", "choices": ["It opened immediately", "It did not open", "It broke apart completely"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "I pulled the cart handle, hoping the latch might open anyway. It did not."}, {"q": "Why did Ben raise one finger instead of running to help right away?", "choices": ["He was counting the minutes left", "He didn't want to help Amara", "The note said the assembly had moved, and he needed to finish reading it"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "If Ben ran to the cart without reading the rest of the note, they might push equipment to the wrong place."}, {"q": "Where was the small brass key the whole time?", "choices": ["Clipped inside Amara's own purple binder", "In Ben's pocket", "Left on Mr. Ruiz's desk"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "The key had been clipped inside Amara's purple binder after yesterday's rehearsal."}, {"q": "What had each of them assumed about the other's gesture?", "choices": ["They both immediately understood exactly what the other meant", "Amara thought Ben's raised finger meant wait, and Ben thought her frown meant she was blaming him", "Neither of them noticed any gesture at all"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "They had each supplied a whole story where the other had offered only a gesture or a word."}, {"q": "What is the big idea of this story?", "choices": ["Running is always faster than talking", "One person is always entirely at fault", "A gesture or a single word cannot carry a whole story—ask and explain instead of assuming"], "answer": 2, "evidencePage": 7, "hint": "Look at the last page.", "explain": "They would not expect a gesture to carry eight minutes of meaning."}], "grammar": [{"q": "'Amara's question sounded like an accusation, ___ I could see she was staring at the key.' Which word shows contrast?", "choices": ["so", "but", "because"], "answer": 1, "evidencePage": 4, "hint": "This word contrasts how the question sounded with what Ben actually noticed.", "explain": "'But' contrasts the accusing tone of the question with Ben noticing she was staring at the key.", "teach": "<b>But</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>but</b>(但是)表示两个事实之间的<b>对比</b>。</span>"}, {"q": "'We moved the box, secured the card, ___ kept going without guessing at the other's reason.' Which word joins these actions?", "choices": ["but", "so", "and"], "answer": 2, "evidencePage": 5, "hint": "This word joins the last action in the list.", "explain": "'And' joins the final action—kept going—to the list of things they did.", "teach": "<b>And</b> joins the <b>last item</b> in a list of actions.<span class='cn'><b>and</b>(和)连接一系列动作中的<b>最后一项</b>。</span>"}, {"q": "'___ we rolled onstage, Amara said, \"I thought you were delaying us.\"' Which word shows the order things happened in?", "choices": ["Before", "After", "Then"], "answer": 0, "evidencePage": 6, "hint": "This word tells you Amara spoke earlier than they went onstage.", "explain": "'Before' signals that Amara spoke earlier, ahead of rolling onstage.", "teach": "<b>Before</b> signals that one event happened <b>earlier than</b> another.<span class='cn'><b>before</b>(在...之前)表示一件事发生在另一件事<b>之前</b>。</span>"}], "vocabulary": [{"q": "'Accusation' means ___.", "choices": ["a compliment or praise", "a statement blaming someone for doing something wrong", "a type of school assembly"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Amara's question sounded like an accusation."}, {"q": "'Fragile' means ___.", "choices": ["extremely strong and sturdy", "very colorful and bright", "easily broken or damaged"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Ben worried about pushing fragile equipment to the wrong place."}, {"q": "'Overlapped' means ___.", "choices": ["covered the same time or space as something else, partly matching", "happened at completely different times", "never connected in any way"], "answer": 0, "evidencePage": 7, "hint": "Look at page 7.", "explain": "The events overlapped, but the descriptions emphasized different worries, clues, and choices."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(accusation|fragile|overlapped)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 4 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function saveProgress(){try{localStorage.setItem("les-eight-minutes-before-the-bell-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="eight-minutes-before-the-bell"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"eight-minutes-before-the-bell",bookTitle:"Eight Minutes Before the Bell",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

function pickVoice(){const voices=speechSynthesis.getVoices();if(!voices.length)return;const en=voices.filter(v=>/^en(-|_|$)/i.test(v.lang));const pool=en.length?en:voices;const score=v=>{let s=0;const n=(v.name||"").toLowerCase();if(/natural/.test(n))s+=8;if(/neural/.test(n))s+=6;if(/online/.test(n))s+=4;if(/google/.test(n))s+=5;if(/(aria|jenny|guy|libby|sonia|michelle|ava|andrew|emma|clara|natasha)/.test(n))s+=5;if(/(samantha|allison|karen|serena|siri|nicky|aaron)/.test(n))s+=4;if(v.localService===false)s+=3;if(/en-us|en-gb/i.test(v.lang))s+=1;if(/(zira|david|mark|hazel|compact|espeak|eloquence)/.test(n))s-=5;return s};pool.sort((a,b)=>score(b)-score(a));preferredVoice=pool[0]||null}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w. function setStatus(m,ok){var el=document.getElementById("recStatus");if(el){el.textContent=m;el.style.color=ok?"#1f8f4d":"#b23b34";}}async function toggleRecording(){const btn=document.getElementById("recordPageBtn");if(recorder&&recorder.state==="recording"){recorder.stop();btn.textContent="🎙 Record";btn.classList.remove("recording");return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setStatus("Recording works only on the published website — the microphone is turned off in this preview.",false);return}if(typeof MediaRecorder==="undefined"){setStatus("This browser can't record audio. Try Chrome/Edge, or Safari 14+.",false);return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});let opts={};if(MediaRecorder.isTypeSupported){if(MediaRecorder.isTypeSupported("audio/webm"))opts={mimeType:"audio/webm"};else if(MediaRecorder.isTypeSupported("audio/mp4"))opts={mimeType:"audio/mp4"};}chunks=[];recorder=new MediaRecorder(stream,opts);recorder.ondataavailable=e=>{if(e.data&&e.data.size>0)chunks.push(e.data)};recorder.onstop=()=>{if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(new Blob(chunks,{type:(recorder.mimeType||"audio/webm")}));document.getElementById("playRecordingBtn").disabled=false;document.getElementById("deleteRecordingBtn").disabled=false;setStatus("Saved! Tap ▶ Play to hear your reading.",true);stream.getTracks().forEach(t=>t.stop())};recorder.start();btn.textContent="■ Stop";btn.classList.add("recording");setStatus("Recording… tap ■ Stop when you finish.",true)}catch(e){var n=(e&&e.name)?e.name:String(e);if(n==="NotAllowedError"||n==="SecurityError"){setStatus("Microphone blocked. In the chat preview the mic is always off — use the live website, then tap Allow (or click 🔒 in the address bar → allow Microphone → reload).",false);}else if(n==="NotFoundError"){setStatus("No microphone found on this device.",false);}else{setStatus("Could not record ("+n+"). Use the live website in Chrome/Edge/Safa
