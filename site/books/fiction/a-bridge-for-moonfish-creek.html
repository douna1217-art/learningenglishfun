<script>

const pages=[{"type": "cover", "title": "A Bridge for Moonfish Creek", "subtitle": "A Creek Crossing Improves When Students Study Both People and Wildlife", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/a-bridge-for-moonfish-creek-assets/cover.jpg"}, {"text": "1. The Crossing After Rain\nAfter every storm, Moonfish Creek covered the stepping stones. Sofia's grandmother had to turn back with her walker, and students arrived late after using the distant road bridge.\nThe class proposed a footbridge. Sofia wanted a low arch that blended with the trail. Jamal wanted a flat deck that would be easier and cheaper to build.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/a-bridge-for-moonfish-creek-assets/page1.jpg"}, {"text": "2. Evidence From the Trail\nThey counted walkers, bicycles, strollers, and wheelchairs at different hours. A flat approach served more users, but it required supports in the streambed.\nMr. Alvarez asked what else used the crossing. At dusk, silver moonfish moved upstream through the same narrow channel. A bridge that helped people could still create a barrier below.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/a-bridge-for-moonfish-creek-assets/page2.jpg"}, {"text": "3. Testing the Models\nIn a clear water tray, the flat model's center posts trapped leaves. Water piled up and scoured sand around them. Sofia's arch left the channel open but its steep ends failed the model wheelchair test.\nEach design solved the problem its builder noticed first. Neither solved the full set of needs. The failed tests gave them better information than applause for their drawings.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/a-bridge-for-moonfish-creek-assets/page3.jpg"}, {"text": "4. A Third Shape\nJamal suggested a level deck suspended from shallow arches on the banks. Sofia added long gentle ramps that curved around an old willow instead of cutting its roots.\nThe hybrid used more lumber than the flat bridge but fewer stream supports. Their class compared costs, access, shade, fish passage, and flood debris before voting to recommend it.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/a-bridge-for-moonfish-creek-assets/page4.jpg"}, {"text": "5. The Shortcut Problem\nDuring construction, a contractor proposed straightening one ramp to save time. The shortcut would cut across willow roots and create a slope too steep for some users.\nSofia cited the tree survey. Jamal demonstrated the slope with the model wheelchair. Their evidence changed the plan before concrete was poured, when revision was still possible.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/a-bridge-for-moonfish-creek-assets/page5.jpg"}, {"text": "6. High Water Test\nA late storm arrived before opening day. Brown water carried branches beneath the new deck. The bank arches held, and the open channel let debris pass.\nThe class waited until inspectors declared the bridge safe. At the creek window below, moonfish continued upstream. The storm tested both visible structure and the space the builders had chosen not to fill.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/a-bridge-for-moonfish-creek-assets/page6.jpg"}, {"text": "7. Two Kinds of Passage\nOn opening morning, Sofia's grandmother crossed beside families, cyclists, and students. Beneath them, moonfish flashed through clear water toward their spawning pools.\nA plaque would later list the bridge builders, but the class remembered the empty stream space as part of the design. A useful bridge did more than carry people over water. It protected another passage moving below.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/a-bridge-for-moonfish-creek-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "Why did the class propose building a footbridge?", "choices": ["The old road bridge had completely collapsed", "After storms, the stepping stones flooded, making it hard for Sofia's grandmother and students to cross", "The class wanted a new project for a grade"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "After every storm, the flooded stepping stones forced Sofia's grandmother to turn back and made students arrive late."}, {"q": "What did Mr. Alvarez point out that the students hadn't considered?", "choices": ["Moonfish moved upstream through the same channel the bridge would cross", "The bridge would be too expensive to ever build", "Nobody actually used the creek crossing at all"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Mr. Alvarez asked what else used the crossing, and at dusk they saw moonfish moving upstream — a bridge for people could still block wildlife."}, {"q": "What did testing the models in a water tray reveal?", "choices": ["Neither model could hold any weight at all", "Both models worked perfectly with no problems", "The flat model trapped leaves and water, while the arch model failed the wheelchair test"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "The flat model's posts trapped leaves and scoured sand, while Sofia's arch left the channel open but its steep ends failed the wheelchair test."}, {"q": "What did the final hybrid design combine?", "choices": ["A level deck on shallow arches with ramps curving around an old willow tree", "Only the original flat deck design with no changes", "A design that ignored the willow tree completely"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Jamal's level deck on shallow arches combined with Sofia's ramps curving around the willow, using more lumber but fewer stream supports."}, {"q": "What did Sofia and Jamal do when a contractor proposed a shortcut?", "choices": ["They ignored the contractor and said nothing", "They used the tree survey and the wheelchair model to show the shortcut would be unsafe", "They agreed immediately to save construction time"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Sofia cited the tree survey and Jamal demonstrated the slope with the model wheelchair, changing the plan before concrete was poured."}], "grammar": [{"q": "'Their evidence changed the plan before concrete was poured, ___ revision was still possible.' Which word shows timing?", "choices": ["unless", "although", "when"], "answer": 2, "evidencePage": 5, "hint": "This word shows the time something happens.", "explain": "'When' shows the timing: the evidence changed the plan at the point when revision was still possible.", "teach": "<b>When</b> shows the <b>time</b> something happens.<span class='cn'><b>when</b> 表示某事发生的<b>时间</b>。</span>"}, {"q": "Which sentence correctly uses commas in a list of three items?", "choices": ["Their class compared costs access and shade before voting.", "Their class compared costs, access, and shade before voting.", "Their class compared costs, access and, shade before voting."], "answer": 1, "evidencePage": 4, "hint": "A comma follows each item in a list, including before 'and' and the last item.", "explain": "Commas separate each item in the series, including one before 'and' and the final item.", "teach": "Use a comma after each item in a list of three or more, like costs, access, and shade.<span class='cn'>在三个或更多项目的列表中，每个项目后面都要用逗号，比如 costs, access, and shade。</span>"}, {"q": "Which sentence correctly sets off extra information with commas?", "choices": ["Mr. Alvarez the science teacher, asked what else used the crossing.", "Mr. Alvarez, the science teacher asked what else used the crossing.", "Mr. Alvarez, the science teacher, asked what else used the crossing."], "answer": 2, "evidencePage": 2, "hint": "Extra information about a noun is set off by a comma on each side.", "explain": "Commas surround the appositive phrase 'the science teacher,' which adds extra information about Mr. Alvarez.", "teach": "An <b>appositive</b> renames a noun and is set off with <b>commas on both sides</b>, like Mr. Alvarez, the teacher.<span class='cn'><b>同位语</b>用来重新说明一个名词，两边都要用<b>逗号</b>隔开，比如 Mr. Alvarez, the teacher。</span>"}], "vocabulary": [{"q": "'Barrier' means ___.", "choices": ["something that blocks or stands in the way", "a reward given for good design", "a tool used to measure water"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "A bridge that helped people could still create a barrier below, blocking the moonfish's path upstream."}, {"q": "'Hybrid' means ___.", "choices": ["something made by combining two different things", "something copied exactly from one source", "something built without any planning"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "The hybrid design combined Jamal's deck and Sofia's ramps, using ideas from both original plans."}, {"q": "'Vulnerable' means ___.", "choices": ["completely safe from any danger", "easily harmed or at risk", "extremely strong and unbreakable"], "answer": 1, "evidencePage": 6, "hint": "Look at page 6.", "explain": "Volunteers installed the tested design along the most vulnerable block, the section most at risk during the storm."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(barrier|hybrid|vulnerable)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 5 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}
