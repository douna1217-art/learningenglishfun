<script>/*les-speech-shim*/
(function(){var w=window,ok=false,errs=[];
/* Some Android in-app browsers (UC/Quark and other vendor kernels, older WebViews) have no
   speechSynthesis at all. The page script calls it while loading, so it stopped there and the
   story was never drawn (the quiz still worked because its handlers were bound earlier).
   Give such browsers a silent stand-in so the rest of the page runs normally. */
try{ok=typeof w.speechSynthesis==="object"&&w.speechSynthesis!==null}catch(e){}
if(typeof w.SpeechSynthesisUtterance!=="function"&&typeof w.SpeechSynthesisUtterance!=="object"){
w.SpeechSynthesisUtterance=function(t){this.text=t==null?"":String(t);this.lang="";this.rate=1;this.pitch=1;this.volume=1;this.voice=null}}
if(!ok){var gen=0,told=false;
w.speechSynthesis={speaking:false,paused:false,pending:false,
getVoices:function(){return[]},cancel:function(){gen++},pause:function(){},resume:function(){},
addEventListener:function(){},removeEventListener:function(){},
speak:function(u){var g=gen;
if(!told&&typeof w.setStatus==="function"){told=true;try{w.setStatus("This browser can't read aloud, but you can still read and practice. 当前浏览器不支持朗读，仍可阅读和做题。",false)}catch(e){}}
setTimeout(function(){if(g===gen&&u&&u.onstart){try{u.onstart({})}catch(e){}}},0);
setTimeout(function(){if(g===gen&&u&&u.onend){try{u.onend({})}catch(e){}}},Math.max(600,String(u&&u.text||"").length*60))}}}
/* If the story still is not drawn after loading, say why on the page itself, so a screenshot
   from a phone we cannot test on shows the cause. */
w.addEventListener("error",function(e){try{if(errs.length<3)errs.push(String(e&&e.message||e))}catch(x){}});

d.style.cssText="padding:24px;color:#b91c1c;font:15px/1.6 sans-serif";

<script>

const pages=[{"type": "cover", "title": "The Badger at the Midnight Feast", "subtitle": "At a Fancy Midnight Feast, a Hungry Badger Learns That Honest Appetite Is Better Than Polite Praise", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-badger-at-the-midnight-feast-assets/cover.jpg"}, {"text": "1. A Very Important Invitation\nBasil read the invitation three times. Olwen, who lived in the old oak, was giving a midnight feast. Venn would be there too. Venn had once described a bowl of porridge as having a disappointing conclusion, so Basil assumed this would be an evening in which ordinary manners might not be sufficient. He polished his vest buttons and practiced saying that things were excellent without sounding surprised that anyone had made them.\nThe invitation asked guests to bring something they liked. Basil made potato soup and baked a plain loaf. While he packed them, the soup suddenly seemed too pale and the loaf too round. He imagined Venn discovering that there were no rare herbs in the pot. At Olwen's door, Basil placed the covered basket beneath the porch bench. He intended to mention it later, when the conversation had become safe enough for potatoes.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-badger-at-the-midnight-feast-assets/page1.jpg"}, {"text": "2. A Meal Too Fine to Touch\nInside, the table glittered. Three white plates held little towers of vegetables, each crowned with a leaf as thin as a moth's wing. Olwen said she had spent all afternoon arranging them. Venn leaned forward and observed that the towers had considerable height. Basil agreed. Nobody said anything about eating. Olwen looked so pleased that Basil worried a fork might destroy something that ought to be admired from a respectful distance.\nAt last Venn cut a tiny piece from the side of his tower. It slid gently across the plate. Basil tried his own. The vegetables were cold, although he thought perhaps coldness was part of the design. Olwen asked whether the arrangement reminded them of a forest. Venn said it suggested several forests. Basil nodded with what he hoped was the expression of a badger who had frequently eaten landscapes and knew when one had been particularly successful.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-badger-at-the-midnight-feast-assets/page2.jpg"}, {"text": "3. An Excellent Description\nOlwen brought the next course from a sideboard. It was a shallow bowl of clear broth with one pale circle floating in the center. Venn called it delicate. Basil could think of no safer word, so he called it delicate too. The broth tasted mainly of warm water. He remembered the soup under the porch bench and wondered whether it would be rude to go outside and stand beside it for a moment.\nOlwen asked whether they would like more. Venn said the serving was wonderfully restrained. Basil said nothing. Then his stomach made a noise that sounded like a cupboard being dragged across a floor. Olwen's feathers lifted. Basil apologized and blamed the chair. Venn looked down at the chair legs. For the first time that evening, he appeared to be studying something without preparing an excellent description of it.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-badger-at-the-midnight-feast-assets/page3.jpg"}, {"text": "4. The Question under the Praise\nOlwen leaned toward him. Was he still hungry? Basil could have blamed the chair again, but chairs had limited responsibilities and this one had already done enough. He said yes. There was a long pause. Venn straightened his napkin. Olwen looked at the bowls, then explained that she had wanted to give a feast nobody would forget. She had practiced the vegetable towers for days. The clear broth had taken most of the evening.\nBasil said he would remember the towers. He had simply expected a feast to leave a guest feeling fed. Venn made a small sound into his napkin. Basil thought he was laughing at him until the fox admitted that he was hungry too. His beautiful descriptions had not made the bowl any fuller. Olwen sat very still. She had asked whether the food looked impressive because she had been afraid to ask whether they were enjoying it.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-badger-at-the-midnight-feast-assets/page4.jpg"}, {"text": "5. Something Beneath the Bench\nBasil remembered the basket. He admitted that he had brought soup and bread but left them outside because they seemed too ordinary. Olwen stared at him. Her invitation had said something guests liked, not something they could use to impress the other guests. Basil acknowledged this. He had read every word carefully and then behaved as though it meant something else. Venn offered to fetch the basket before anyone could give the soup a disappointing review.\nThey set the pot on a thick wooden board in the center of the table. It was still warm inside its covered basket. Basil lifted the lid. The room filled with the smell of onions and pepper. Olwen asked for a proper bowl. Venn asked whether the loaf had a complicated name. Basil said it was called bread. The fox considered this, then said it was an unusually clear title for something he intended to eat.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-badger-at-the-midnight-feast-assets/page5.jpg"}, {"text": "6. The Table Began to Sound Different\nOnce they had eaten, the conversation changed. Olwen described a vegetable tower that had collapsed into her slipper. Venn confessed that he had never known what he meant by a disappointing conclusion in porridge. He had heard the phrase elsewhere and thought it sounded useful. Basil laughed until he had to put down his spoon. He could still see the fine plates waiting on the sideboard. They looked less threatening from beside a full bowl.\nThe soup wasn't perfect. Olwen thought it needed a little more salt. Basil passed it to her without feeling that she had rejected his entire life. Venn preferred more pepper. He offered the mill to Basil afterward instead of composing a description of its dramatic effect. They stayed at the table long after the pot was empty. Nobody needed to announce that the evening was memorable. They were too busy remembering other things badly and correcting one another.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-badger-at-the-midnight-feast-assets/page6.jpg"}, {"text": "7. An Invitation for Another Night\nAt the door, Olwen asked whether they would come again. She planned to make something less ambitious. Basil said she could make the towers if she liked, provided there was supper afterward. Venn offered to bring dessert. They both looked at him. He promised it would be a dessert rather than an argument about the idea of sweetness. Olwen laughed so suddenly that her cape slipped sideways, and she shook it straight with a ruffle of feathers.\nWalking home, Basil carried the empty pot. He had expected to feel proud of saving the feast. Instead he kept thinking how much easier the evening might have been if he had brought the basket indoors at the start. The next invitation arrived a week later. He read it once, chose a dish he liked, and put it beside the door. He left his important expressions in the mirror. They had not proved nearly as useful as a second helping.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-badger-at-the-midnight-feast-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did Basil bring to the feast, and where did he leave it?", "choices": ["Potato soup and a plain loaf, in a covered basket under the porch bench", "Fruit, which he gave to Olwen", "A cake, which he put on the table"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "He made potato soup and baked a plain loaf, and left the covered basket beneath the porch bench."}, {"q": "What was unusual about the first course?", "choices": ["Little towers of cold vegetables that everyone admired and nobody ate", "A huge roasted bird", "A bowl of hot porridge"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "The towers were so carefully arranged that nobody said anything about eating them, and the vegetables were cold."}, {"q": "What did Basil finally admit when Olwen asked?", "choices": ["That he had brought nothing", "That he disliked the broth", "That he was still hungry"], "answer": 2, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Olwen asked whether he was still hungry, and Basil said yes."}, {"q": "What did Basil realize about the invitation?", "choices": ["It was meant for someone else", "It had asked for something guests liked, and he had read it carefully but behaved as though it meant something else", "It had asked him to bring a gift"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Olwen’s invitation had said something guests liked, not something to impress the others."}, {"q": "What did Basil think about while walking home?", "choices": ["How he would never go to another feast", "How much easier the evening would have been if he had brought the basket in at the start", "How to cook better vegetable towers"], "answer": 1, "evidencePage": 7, "hint": "Look at the last page.", "explain": "He kept thinking how much easier the evening might have been if he had brought the basket indoors at the start."}], "grammar": [{"q": "Which sentence is a complex sentence?", "choices": ["The soup was plain, and everyone asked for more.", "The soup was plain.", "Although the soup was plain, everyone asked for more."], "answer": 2, "evidencePage": 6, "hint": "Look at page 6.", "explain": "A complex sentence has a main part and a part that cannot stand alone, like “Although the soup was plain”.", "teach": "A <b>complex sentence</b> has a main clause and a clause that cannot stand alone, like <b>Although it was plain</b>, everyone asked for more.<span class='cn'><b>复合句</b>由主句和不能单独成句的从句组成，比如 <b>Although it was plain</b>, everyone asked for more（虽然它很朴素，大家还是要求再来一份）。</span>"}, {"q": "What does the prefix ‘dis-’ mean in ‘disappointing’?", "choices": ["not or the opposite of", "before", "again"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "The prefix “dis-” means not or the opposite of.", "teach": "The prefix <b>dis</b> means not or the opposite of, like <b>disappoint</b> and <b>disagree</b>.<span class='cn'>前缀 <b>dis</b> 表示“不”或“相反”，比如 <b>disappoint</b>（使失望）和 <b>disagree</b>（不同意）。</span>"}, {"q": "‘His important expressions had not proved nearly as useful as a second helping.’ What does this suggest?", "choices": ["Basil ate too much", "Fancy words did less good than a real meal", "Basil wanted a second serving of dessert"], "answer": 1, "evidencePage": 7, "hint": "Look at the last page.", "explain": "The writer compares his fancy expressions with a second helping to show that a real meal mattered more.", "teach": "A <b>comparison</b> can show what matters more, like <b>fancy words</b> and <b>a second helping</b>.<span class='cn'><b>比较</b>可以表现什么更重要，比如 <b>fancy words</b>（华丽的词）和 <b>a second helping</b>（再来一份饭）。</span>"}], "vocabulary": [{"q": "‘Delicate’ means ___.", "choices": ["loud and bold", "heavy and thick", "light, fine, and easily damaged"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Venn called the broth delicate."}, {"q": "‘Restrained’ means ___.", "choices": ["very large", "held back and not overdone", "very sweet"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Venn said the serving was wonderfully restrained."}, {"q": "‘Ambitious’ means ___.", "choices": ["aiming to do something difficult or grand", "very lazy", "very small"], "answer": 0, "evidencePage": 7, "hint": "Look at the last page.", "explain": "She planned to make something less ambitious."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(delicate|restrained|ambitious)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 6 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}var TEACH_ICONS='<svg class="ic i-spk" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.5v5h3.6l4.9 4.5V5L7.6 9.5H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.6 9.2a4 4 0 010 5.6M18.2 6.6a7.6 7.6 0 010 10.8"/></svg><svg class="ic i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></svg><svg class="ic i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 5.3v13.4c0 .8.9 1.3 1.6.8l9.6-6.7c.6-.4.6-1.2 0-1.6L9.8 4.5c-.7-.5-1.6 0-1.6.8z"/></svg>';var _tp=null;function _tpSet(b,st){if(!b)return;b.classList.toggle('is-playing',st==='playing');b.classList.toggle('is-paused',st==='paused');b.setAttribute('aria-pressed',st==='playing'?'true':'false');var z=b.dataset.part==='cn',L=st==='playing'?(z?'\u6682\u505C':'Pause'):st==='paused'?(z?'\u7EE7\u7EED\u64AD\u653E':'Resume'):b.dataset.label;b.setAttribute('aria-label',L);b.title=L;}function stopTeachAudio(){var c=_tp;if(!c)return;_tp=null;try{if(c.audio){c.audio.onended=c.audio.onerror=c.audio.ontimeupdate=null;c.audio.pause();}}catch(e){}if(c.mode==='tts'){try{speechSynthesis.cancel();}catch(e){}}_tpSet(c.btn,'idle');}function _tpFallback(btn){try{var u=new SpeechSynthesisUtterance(btn.dataset.text||'');u.lang=btn.dataset.lang||'en-US';var cur={btn:btn,mode:'tts'};_tp=cur;u.onend=u.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');}};_tpSet(btn,'playing');speechSynthesis.speak(u);}catch(e){}}function playTeachAudio(btn){if(_tp&&_tp.btn===btn){if(_tp.mode==='audio'){var a0=_tp.audio;if(a0.paused){var p0=a0.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}

function saveProgress(){try{localStorage.setItem("les-the-badger-at-the-midnight-feast-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-badger-at-the-midnight-feast"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-badger-at-the-midnight-feast",bookTitle:"The Badger at the Midnight Feast",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

let preferredVoice=null;
