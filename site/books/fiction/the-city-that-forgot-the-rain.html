<script>

const pages=[{"type": "cover", "title": "The City That Forgot the Rain", "subtitle": "A Sealed Weather Machine Returns Water and Memories to a Drought-Shaped City", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-city-that-forgot-the-rain-assets/cover.jpg"}, {"text": "1. A Word Nobody Used\nIn Solara, water arrived through pipes, and the sky stayed polished blue. When Sofia found a paper umbrella in Keeper Amara's attic, she thought it was a portable shade.\nAmara called it a rain umbrella. Jalen recognized the word from an old poem, though he had assumed rain was a metaphor for grief. Neither student had ever felt water fall from the sky.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-city-that-forgot-the-rain-assets/page1.jpg"}, {"text": "2. The Tower That Prevented Storms\nThe city council said the weather tower protected Solara from floods and crop damage. Its copper vanes separated clouds before they crossed the ridge.\nAmara remembered that the machine was meant to run for five drought years, not fifty. After the emergency ended, citizens feared surrendering perfect control. The temporary solution became a tradition no one voted to continue.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-city-that-forgot-the-rain-assets/page2.jpg"}, {"text": "3. Memories Inside Glass\nBeneath the tower, Sofia found glass spheres filled with moving images: children jumping through puddles, muddy gardens, and families stacking sandbags. The machine had stored rain memories when it removed storms.\nJalen saw joy in the puddles. Sofia saw danger in the sandbags. The spheres did not argue for or against rain; together they preserved consequences the city's simple blue sky had erased.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-city-that-forgot-the-rain-assets/page3.jpg"}, {"text": "4. A City Built for Dryness\nThey proposed switching off the tower, but engineers showed that streets had been paved over old drainage channels. Roofs sent water toward homes instead of cisterns. The city had forgotten rain in its design as well as its language.\nOpening the sky without changing the ground would turn memory into disaster. The students revised their plan: prepare one district, invite one small cloud, and measure every result.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-city-that-forgot-the-rain-assets/page4.jpg"}, {"text": "5. Preparing for an Uncertain Sky\nNeighbors cleared a buried canal, connected rooftop cisterns, planted a basin garden, and practiced moving supplies above the flood line. Some called the work wasteful because the trial cloud might produce nothing.\nJalen answered that preparation was not a prediction. It reduced harm across several possible outcomes, including a broken pipe or future storm the tower could not stop.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-city-that-forgot-the-rain-assets/page5.jpg"}, {"text": "6. The First Rain\nThe copper vanes paused for twelve minutes. A cloud crossed the ridge, and large drops struck dust hard enough to release a smell no sphere had preserved.\nWater filled the basin, overflowed one gutter, and reached the canal without entering homes. People laughed, worried, slipped, measured, and adjusted. The real rain refused to become only beautiful or only dangerous.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-city-that-forgot-the-rain-assets/page6.jpg"}, {"text": "7. Weather With a Memory\nSolara did not shut down the tower forever. It opened weather windows by season while rebuilding drainage one district at a time. Rain returned gradually, along with words such as drizzle, downpour, and petrichor.\nSofia placed the wet umbrella beside the memory spheres, but she did not call it proof that the experiment had succeeded. The proof was outside: revised streets, fuller cisterns, greener soil, and citizens willing to remember that safety meant adapting to change, not pretending change had ended.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-city-that-forgot-the-rain-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did Sofia think the paper umbrella was when she first found it?", "choices": ["A portable shade, since she had never seen rain", "A tool for measuring wind", "A weapon used for defense"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Sofia thought the paper umbrella was a portable shade because she had never actually felt water fall from the sky."}, {"q": "Why had the weather tower originally been built?", "choices": ["To protect Solara during five drought years, but it kept running for fifty", "To create rain whenever the city wanted it", "To measure temperature across the city"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "The tower was meant to run for five drought years, but citizens feared losing perfect control, so the temporary fix became an unquestioned fifty-year tradition."}, {"q": "What did the glass spheres beneath the tower contain?", "choices": ["Only instructions for repairing the tower", "Nothing; the spheres were completely empty", "Stored rain memories, showing both joyful and dangerous moments"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "The spheres stored moving images of rain memories — joyful puddle-jumping and dangerous sandbag-stacking — preserving consequences the blue sky had erased."}, {"q": "Why couldn't the students simply switch off the tower?", "choices": ["There was no way to turn the tower off at all", "The city's streets and roofs had been built for dryness, so opening the sky could cause flooding", "The tower was too old to be turned off"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Streets had been paved over old drainage channels and roofs sent water toward homes, so opening the sky without changing the ground would turn memory into disaster."}, {"q": "What happened during the first test rain?", "choices": ["Water filled the basin and reached the canal without entering homes, and people reacted in many different ways", "The rain caused immediate and total disaster", "Nothing happened; no rain actually fell"], "answer": 0, "evidencePage": 6, "hint": "Look at page 6.", "explain": "The test rain filled the basin and reached the canal safely, and people laughed, worried, slipped, and measured — the real rain wasn't only good or only bad."}], "grammar": [{"q": "'Jalen recognized the word from an old poem, ___ he had assumed rain was a metaphor for grief.' Which word shows contrast?", "choices": ["because", "so", "though"], "answer": 2, "evidencePage": 1, "hint": "This word shows a surprising contrast, similar to 'although.'", "explain": "'Though' shows contrast: Jalen knew the word, even though he had misunderstood its literal meaning.", "teach": "<b>Though</b> shows a <b>contrast</b>, similar to <b>although</b>.<span class='cn'><b>though</b> 表示<b>转折</b>，和 <b>although</b> 类似。</span>"}, {"q": "Which sentence correctly punctuates an introductory phrase?", "choices": ["Beneath the tower Sofia, found glass spheres filled with moving images.", "Beneath the tower, Sofia found glass spheres filled with moving images.", "Beneath, the tower Sofia found glass spheres filled with moving images."], "answer": 1, "evidencePage": 3, "hint": "A comma follows an introductory phrase before the main sentence begins.", "explain": "The comma correctly separates the introductory phrase 'Beneath the tower' from the main sentence.", "teach": "<b>A comma</b> follows an <b>introductory phrase</b> before the main sentence begins.<span class='cn'><b>逗号</b>用在<b>引导性短语</b>之后，主句开始之前。</span>"}, {"q": "Which sentence correctly uses parallel structure?", "choices": ["Neighbors clearing a buried canal, connected rooftop cisterns, and planted a basin garden.", "Neighbors cleared a buried canal, connected rooftop cisterns, and planted a basin garden.", "Neighbors cleared a buried canal, connected rooftop cisterns, and a basin garden was planted."], "answer": 1, "evidencePage": 5, "hint": "Each item in a list should use the same grammatical form.", "explain": "Each item follows the same pattern — cleared, connected, planted — keeping the sentence parallel.", "teach": "Items in a <b>series</b> should use the <b>same grammatical form</b>, like matching verbs.<span class='cn'>一系列并列的项目应该使用<b>相同的语法形式</b>，比如动词形式要一致。</span>"}], "vocabulary": [{"q": "'Drought' means ___.", "choices": ["a long period with little or no rain", "a type of underground pipe", "a sudden, heavy storm"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "The weather tower was built to protect the city during five drought years — years with almost no rain."}, {"q": "'Metaphor' means ___.", "choices": ["a real, physical event that happened", "a word or phrase used to represent something else, not literally", "a tool used to measure weather"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Jalen had assumed rain was only a metaphor for grief in an old poem, not something that literally fell from the sky."}, {"q": "'Consequences' means ___.", "choices": ["questions that have no answer", "tools used to build machines", "results or effects that follow an action"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "The memory spheres preserved consequences — both good and bad results — that the city's simple blue sky had erased."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(drought|metaphor|consequences)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 6 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}
