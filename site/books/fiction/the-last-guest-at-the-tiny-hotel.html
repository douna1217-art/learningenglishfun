<script>/*les-speech-shim*/
(function(){var w=window,ok=false,errs=[];
/* Some Android in-app browsers (UC/Quark and other vendor kernels, older WebViews) have no
   speechSynthesis at all. The page script calls it while loading, so it stopped there and the
   story was never drawn (the quiz still worked because its handlers were bound earlier).
   Give such browsers a silent stand-in so the rest of the page runs normally. */
try{ok=typeof w.speechSynthesis==="object"&&w.speechSynthesis!==null}catch(e){}
if(typeof w.SpeechSynthesisUtterance!=="function"&&typeof w.SpeechSynthesisUtterance!=="object"){
w.SpeechSynthesisUtterance=function(t){this.text=t==null?"":String(t);this.lang="";this.rate=1;this.pitch=1;this.volume=1;this.voice=null}}
if(!ok){var gen=0,told=false;
w.speechSynthesis={speaking:false,paused:false,pending:false,
getVoices:function(){return[]},cancel:function(){gen++},pause:function(){},resume:function(){},
addEventListener:function(){},removeEventListener:function(){},
speak:function(u){var g=gen;
if(!told&&typeof w.setStatus==="function"){told=true;try{w.setStatus("This browser can't read aloud, but you can still read and practice. 当前浏览器不支持朗读，仍可阅读和做题。",false)}catch(e){}}
setTimeout(function(){if(g===gen&&u&&u.onstart){try{u.onstart({})}catch(e){}}},0);
setTimeout(function(){if(g===gen&&u&&u.onend){try{u.onend({})}catch(e){}}},Math.max(600,String(u&&u.text||"").length*60))}}}
/* If the story still is not drawn after loading, say why on the page itself, so a screenshot
   from a phone we cannot test on shows the cause. */
w.addEventListener("error",function(e){try{if(errs.length<3)errs.push(String(e&&e.message||e))}catch(x){}});
w.addEventListener("load",function(){try{var v=document.getElementById("pageView");
if(v&&!v.firstChild&&errs.length){var d=document.createElement("div"),s=document.createElement("small");
d.style.cssText="padding:24px;color:#b91c1c;font:15px/1.6 sans-serif";
d.appendChild(document.createTextNode("The story could not be shown in this browser. 此浏览器暂时无法显示故事。"));
d.appendChild(document.createElement("br"));s.textContent=errs.join(" | ");d.appendChild(s);v.appendChild(d)}}catch(x){}});
})();

<script>

const pages=[{"type": "cover", "title": "The Last Guest at the Tiny Hotel", "subtitle": "A Good Host Asks What a Guest Really Needs", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-last-guest-at-the-tiny-hotel-assets/cover.jpg"}, {"text": "1. Six Keys in a Row\nNora polished the six brass keys until she could see her whiskers in them. This was her first evening helping Grandmother at the Willow Hotel. Every bedroom had a quilt, a little jug of water, and a window facing the river. Nora had checked each one twice.\nFive guests had arrived by sunset. Nora was straightening the last key when somebody knocked on the roof. At least, that was how it sounded. Outside stood a badger with a brown traveling bag. He had knocked as low as he could. “Mr. Brindle,” he said. “I was told there might be a room.” Nora looked from him to the tiny door.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-last-guest-at-the-tiny-hotel-assets/page1.jpg"}, {"text": "2. The Largest Room\nNora fetched the key to Room Six. It was their largest room. She explained that it had an excellent view and a particularly fine quilt. Mr. Brindle leaned down to look through the doorway. One of his boots was wider than the hallway.\n“It sounds lovely,” he said. “But I don't believe I can reach it.” Nora's ears grew warm. Grandmother came outside, carrying the guest book. She asked him to rest on the garden bench while they thought. Nora followed her back inside. There was no larger key on the rack. She wished she had checked something besides the shine on the brass.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-last-guest-at-the-tiny-hotel-assets/page2.jpg"}, {"text": "3. A Room for the Winter Pots\nBehind the hotel stood the old potting house. Its doorway was wide enough for the gardener's cart. Empty clay pots lined one wall, and a strong wooden daybed waited beneath the window. Grandmother sometimes rested there after working in the garden. Mr. Brindle could certainly fit.\nNora objected at once. The room had no river view. A curtain made from old grain sacks covered the window, and the quilt was plain brown. Grandmother said they should show Mr. Brindle before deciding for him. Nora opened the wide door. He stood on the path for a moment, looking in. “Is it quiet in here?” he asked.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-last-guest-at-the-tiny-hotel-assets/page3.jpg"}, {"text": "4. What the Guest Asked For\nNora explained the missing view and apologized for the plain quilt. Mr. Brindle set down his bag. “I've been beside the river since breakfast,” he said. “A quiet bed sounds very good.” He asked where he might put his boots and whether breakfast could be a little later than usual.\nNora had prepared a speech about the finest rooms in the hotel. None of it answered those questions. She showed him a dry corner for his boots. Grandmother brought a clean pillow. Mr. Brindle tested the daybed, stretched out his tired legs, and gave a long sigh. Nora knew that sound. She made it herself after carrying things uphill.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-last-guest-at-the-tiny-hotel-assets/page4.jpg"}, {"text": "5. Something Worth Leaving Alone\nAfter Mr. Brindle went to supper, Nora carried ribbons to the potting house. She meant to tie them around the curtain and make the room look more like the upstairs bedrooms. Through the open door, she noticed his sketchbook on the daybed. A drawing showed the willow branches above the hotel.\nShe stopped at the threshold. The room already held something of its guest. Nora took the ribbons away without touching the book. Instead, she asked Grandmother for a larger jug and a cup that would fit comfortably in a badger's paw. They found both in the garden cupboard. Nora placed them on a low table, where Mr. Brindle could reach them.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-last-guest-at-the-tiny-hotel-assets/page5.jpg"}, {"text": "6. Breakfast in the Garden\nIn the morning, Nora carried breakfast to the garden bench. She had arranged everything on a tray before realizing that Mr. Brindle's cup took most of the space. He offered to carry the tray while she led the way. They made a slow, dignified procession past the roses.\nMr. Brindle asked whether she had been running the hotel for long. Nora nearly said yes. Then she admitted that yesterday had been her first evening. He looked toward the potting house. “You found me a comfortable place,” he said. “I shall remember it.” Nora sat on the far end of the bench. From there she could just see the river between the leaves.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-last-guest-at-the-tiny-hotel-assets/page6.jpg"}, {"text": "7. The Seventh Key\nBefore leaving, Mr. Brindle gave Nora a drawing. It showed the potting house with its wide door open and a small mouse beside it. Nora searched the picture for a mistake. The sacks still hung at the window. The quilt was still plain. Everything looked peaceful.\nGrandmother found the spare potting-house key and hung it beside the six polished ones. It was iron, dull and much larger than the others. Nora almost reached for a polishing cloth. Then a knock sounded at the front door. She put down the cloth and went to answer it. Before fetching any key, she asked the new guest what sort of room he needed.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-last-guest-at-the-tiny-hotel-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "Why could Mr. Brindle not stay in Room Six?", "choices": ["The room was already full", "He could not reach it through the tiny doorway", "It had no quilt"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Mr. Brindle said he did not believe he could reach it."}, {"q": "Why did Nora object to the potting house at first?", "choices": ["It had no river view, a sack curtain, and a plain quilt", "It was too far from the river", "It was too small for a badger"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "The room had no river view, a curtain made from old grain sacks, and a plain brown quilt."}, {"q": "What did Mr. Brindle ask for?", "choices": ["A bigger room with a view", "A cup of hot tea", "A quiet bed, a place for his boots, and a later breakfast"], "answer": 2, "evidencePage": 4, "hint": "Look at page 4.", "explain": "He asked about a quiet bed, where to put his boots, and whether breakfast could be later."}, {"q": "Why did Nora take the ribbons away without using them?", "choices": ["She had run out of ribbon", "Grandmother told her not to", "The room already held something of its guest, like his sketchbook"], "answer": 2, "evidencePage": 5, "hint": "Look at page 5.", "explain": "She noticed the sketchbook and felt the room already held something of its guest."}, {"q": "What did Nora do when a new guest knocked at the end?", "choices": ["Asked what sort of room he needed before fetching any key", "Offered him Room Six", "Ran to polish the keys"], "answer": 0, "evidencePage": 7, "hint": "Look at the last page.", "explain": "Before fetching any key, she asked the new guest what sort of room he needed."}], "grammar": [{"q": "‘Grandmother brought a clean pillow. ___ put it on the daybed.’ Which word belongs in the blank?", "choices": ["She", "Her", "Them"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "A pronoun that does the action takes the place of Grandmother, so it needs “She”.", "teach": "A <b>subject pronoun</b> like <b>she</b>, <b>he</b>, or <b>they</b> takes the place of a name and does the action.<span class='cn'><b>主格代词</b>比如 <b>she</b>、<b>he</b>、<b>they</b>，用来代替人名，作动作的发出者。</span>"}, {"q": "‘It was their ___ room.’ Which word belongs in the blank?", "choices": ["largest", "larger", "more large"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Room Six was bigger than all the others, so it needs “largest”.", "teach": "Add <b>est</b> to compare three or more things, like <b>large</b> and <b>largest</b>.<span class='cn'>比较三个或更多事物时，给词加 <b>est</b>，比如 <b>large</b> 变成 <b>largest</b>（最大的）。</span>"}, {"q": "‘Everything looked peaceful.’ What does the suffix ‘-ful’ mean in ‘peaceful’?", "choices": ["without", "full of", "again"], "answer": 1, "evidencePage": 7, "hint": "Look at the last page.", "explain": "The suffix “-ful” means full of, so peaceful means full of peace.", "teach": "The suffix <b>ful</b> means full of, like <b>peaceful</b> and <b>careful</b>.<span class='cn'>后缀 <b>ful</b> 表示“充满……的”，比如 <b>peaceful</b>（平静的）和 <b>careful</b>（小心的）。</span>"}], "vocabulary": [{"q": "‘Particularly’ means ___.", "choices": ["hardly", "sometimes", "especially"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "She explained that it had an excellent view and a particularly fine quilt."}, {"q": "‘Threshold’ means ___.", "choices": ["a high shelf", "the bottom of a doorway", "a kind of key"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "She stopped at the threshold."}, {"q": "‘Dignified’ means ___.", "choices": ["noisy and silly", "calm and showing respect", "tired and cross"], "answer": 1, "evidencePage": 6, "hint": "Look at page 6.", "explain": "They made a slow, dignified procession past the roses."}]};

.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
