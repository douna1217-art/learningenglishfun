<script>

const pages=[{"type": "cover", "title": "The Cedar Street Debate", "subtitle": "Two Plans for One Empty Lot Become Stronger When Neighbors Examine the Evidence", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-cedar-street-debate-assets/cover.jpg"}, {"text": "1. One Lot and Two Promises\nAmara promised the empty lot would become a garden where families could grow food. Luis promised it would become a small play court where children could move safely away from traffic.\nAt the council meeting, both groups applauded only their own plan. Ms. Chen gave Amara and Luis one week to study the lot together. She said a strong argument begins with a claim, but it earns trust through evidence.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-cedar-street-debate-assets/page1.jpg"}, {"text": "2. Measuring More Than Space\nThey measured the lot and discovered the cedar's roots filled the sunniest corner. Amara could not place garden beds there without harming the tree. Luis found that a full court would leave no safe path for toddlers and wheelchairs.\nTheir first plans had treated the lot as empty. The measurements showed it was already occupied by roots, shade, drainage, and people who crossed it every day.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-cedar-street-debate-assets/page2.jpg"}, {"text": "3. Listening at Different Hours\nBefore school, elders used the shaded bench. In the afternoon, younger children kicked a ball against the fence. At sunset, apartment residents crossed the lot carrying groceries.\nAmara interviewed gardeners about sunlight and water. Luis counted how often balls rolled toward the street. Each gathered evidence for a favorite idea, but each also recorded facts that weakened it.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-cedar-street-debate-assets/page3.jpg"}, {"text": "4. The Debate Changes\nDuring rehearsal, Amara argued that food mattered more than games. Luis answered that exercise mattered more than tomatoes. Their claims sounded forceful but ignored the people standing in front of them.\nThey began again. Amara cited the sunny western strip and the families who requested herbs. Luis cited the fence distance and the need for a safe practice wall. The debate became less dramatic and more useful.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-cedar-street-debate-assets/page4.jpg"}, {"text": "5. A Question Neither Plan Answered\nA third grader asked where she could sit while waiting for her brother. Neither poster included seating. A neighbor using a wheelchair asked whether the soil path would stay firm after rain.\nAmara and Luis realized that choosing a winner would not solve every problem. They traced a shared path beneath the cedar and placed a circular bench where adults could see both growing beds and play space.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-cedar-street-debate-assets/page5.jpg"}, {"text": "6. The Smaller Better Plan\nThe final design had three raised garden beds instead of eight and one practice wall instead of a full court. Some supporters complained that compromise made both ideas smaller.\nLuis explained that the plan was smaller in size but larger in purpose. Amara showed how runoff from the practice area could water native plants. Their evidence connected each choice to a real user of the lot.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-cedar-street-debate-assets/page6.jpg"}, {"text": "7. Opening Day on Cedar Street\nBy summer, beans climbed trellises beside the practice wall. Chalk games curved around the cedar without crossing the garden path. The circular bench was almost always full.\nAmara still preferred gardening, and Luis still preferred basketball. They had not erased their disagreement. They had learned to test it. The lot worked because their final claim was not that one idea mattered most, but that every choice needed a reason.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-cedar-street-debate-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did Ms. Chen ask Amara and Luis to do?", "choices": ["Study the lot together for one week", "Vote immediately on which plan was better", "Give up their plans and start over completely"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Ms. Chen gave Amara and Luis one week to study the lot together, since a strong argument needs evidence, not just applause."}, {"q": "What did measuring the lot reveal?", "choices": ["The lot was actually much smaller than anyone thought", "Nothing new; the lot was exactly as empty as expected", "The cedar's roots filled the sunniest corner and there was no safe path for toddlers and wheelchairs"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "The measurements showed the lot was already occupied by the cedar's roots, shade, drainage, and people who crossed it daily."}, {"q": "What did Amara and Luis discover while listening at different hours?", "choices": ["Elders used the bench, children played by the fence, and residents crossed with groceries", "Only children ever visited the empty lot", "Nobody ever used the lot at any time of day"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "At different hours they saw elders on the bench, children playing by the fence, and residents crossing with groceries — many different uses of the same space."}, {"q": "What question did a third grader ask that neither plan answered?", "choices": ["Whether the play court would be too loud", "Whether the garden would have enough sunlight", "Where she could sit while waiting for her brother"], "answer": 2, "evidencePage": 5, "hint": "Look at page 5.", "explain": "A third grader asked where she could sit while waiting, revealing that neither original plan included seating."}, {"q": "What did the final design include instead of one winning plan?", "choices": ["Three raised garden beds and one practice wall, smaller but connected to real users' needs", "Eight garden beds and a full basketball court", "Neither a garden nor a play area at all"], "answer": 0, "evidencePage": 6, "hint": "Look at page 6.", "explain": "The final plan had three raised beds and one practice wall — smaller than either original plan but shaped by evidence from real users."}], "grammar": [{"q": "Which sentence correctly punctuates an introductory phrase?", "choices": ["By, summer beans climbed trellises beside the practice wall.", "By summer, beans climbed trellises beside the practice wall.", "By summer beans, climbed trellises beside the practice wall."], "answer": 1, "evidencePage": 7, "hint": "A comma follows an introductory phrase before the main sentence begins.", "explain": "The comma correctly separates the introductory phrase 'By summer' from the main sentence.", "teach": "<b>A comma</b> follows an <b>introductory phrase</b> before the main sentence begins.<span class='cn'><b>逗号</b>用在<b>引导性短语</b>之后，主句开始之前。</span>"}, {"q": "Which sentence correctly uses a semicolon to join two related complete thoughts?", "choices": ["Amara still preferred gardening, Luis still preferred basketball;", "Amara; still preferred gardening Luis still preferred basketball.", "Amara still preferred gardening; Luis still preferred basketball."], "answer": 2, "evidencePage": 7, "hint": "A semicolon joins two complete sentences that are closely related.", "explain": "The semicolon correctly joins two related complete thoughts without needing a conjunction.", "teach": "<b>A semicolon</b> joins two <b>closely related complete sentences</b>.<span class='cn'><b>分号</b>连接两个意思相关的<b>完整句子</b>。</span>"}, {"q": "'The plan was smaller in size, ___ it was larger in purpose.' Which word shows contrast?", "choices": ["and", "but", "so"], "answer": 1, "evidencePage": 6, "hint": "This word shows the second idea is different from what you might expect.", "explain": "'But' shows contrast: the plan was smaller in size, yet larger in purpose.", "teach": "<b>But</b> joins two ideas that are <b>different or surprising together</b>.<span class='cn'><b>but</b>用来连接两个<b>不同或令人意外</b>的想法。</span>"}], "vocabulary": [{"q": "'Evidence' means ___.", "choices": ["a guess made without checking anything", "facts or details that support a conclusion", "a rule that can never be questioned"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Ms. Chen said an argument earns trust through evidence, not just a claim that sounds good."}, {"q": "'Compromise' means ___.", "choices": ["a decision made without any discussion", "an agreement where each side gives up something", "a total victory for only one side"], "answer": 1, "evidencePage": 6, "hint": "Look at page 6.", "explain": "Some supporters complained that the compromise made both plans smaller, even though it served more people fairly."}, {"q": "'Forceful' means ___.", "choices": ["strong and confident, but not necessarily gentle", "uncertain and full of doubt", "quiet and difficult to hear"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Amara and Luis's first claims sounded forceful but ignored the real people standing in front of them."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(evidence|compromise|forceful)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 5 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function saveProgress(){try{localStorage.setItem("les-the-cedar-street-debate-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-cedar-street-debate"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-cedar-street-debate",bookTitle:"The Cedar Street Debate",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

function pickVoice(){const voices=speechSynthesis.getVoices();if(!voices.length)return;const en=voices.filter(v=>/^en(-|_|$)/i.test(v.lang));const pool=en.length?en:voices;const score=v=>{let s=0;const n=(v.name||"").toLowerCase();if(/natural/.test(n))s+=8;if(/neural/.test(n))s+=6;if(/online/.test(n))s+=4;if(/google/.test(n))s+=5;if(/(aria|jenny|guy|libby|sonia|michelle|ava|andrew|emma|clara|natasha)/.test(n))s+=5;if(/(samantha|allison|karen|serena|siri|nicky|aaron)/.test(n))s+=4;if(v.localService===false)s+=3;if(/en-us|en-gb/i.test(v.lang))s+=1;if(/(zira|david|mark|hazel|compact|espeak|eloquence)/.test(n))s-=5;return s};pool.sort((a,b)=>score(b)-score(a));preferredVoice=pool[0]||null}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.
