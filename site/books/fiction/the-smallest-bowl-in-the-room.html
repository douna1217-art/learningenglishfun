<script>/*les-speech-shim*/
(function(){var w=window,ok=false,errs=[];
/* Some Android in-app browsers (UC/Quark and other vendor kernels, older WebViews) have no
   speechSynthesis at all. The page script calls it while loading, so it stopped there and the
   story was never drawn (the quiz still worked because its handlers were bound earlier).
   Give such browsers a silent stand-in so the rest of the page runs normally. */
try{ok=typeof w.speechSynthesis==="object"&&w.speechSynthesis!==null}catch(e){}
if(typeof w.SpeechSynthesisUtterance!=="function"&&typeof w.SpeechSynthesisUtterance!=="object"){
w.SpeechSynthesisUtterance=function(t){this.text=t==null?"":String(t);this.lang="";this.rate=1;this.pitch=1;this.volume=1;this.voice=null}}
if(!ok){var gen=0,told=false;
w.speechSynthesis={speaking:false,paused:false,pending:false,
getVoices:function(){return[]},cancel:function(){gen++},pause:function(){},resume:function(){},
addEventListener:function(){},removeEventListener:function(){},
speak:function(u){var g=gen;
if(!told&&typeof w.setStatus==="function"){told=true;try{w.setStatus("This browser can't read aloud, but you can still read and practice. 当前浏览器不支持朗读，仍可阅读和做题。",false)}catch(e){}}
setTimeout(function(){if(g===gen&&u&&u.onstart){try{u.onstart({})}catch(e){}}},0);
setTimeout(function(){if(g===gen&&u&&u.onend){try{u.onend({})}catch(e){}}},Math.max(600,String(u&&u.text||"").length*60))}}}
/* If the story still is not drawn after loading, say why on the page itself, so a screenshot
   from a phone we cannot test on shows the cause. */
w.addEventListener("error",function(e){try{if(errs.length<3)errs.push(String(e&&e.message||e))}catch(x){}});

d.style.cssText="padding:24px;color:#b91c1c;font:15px/1.6 sans-serif";

d.appendChild(document.createElement("br"));s.textContent=errs.join(" | ");d.appendChild(s);v.appendChild(d)}}catch(x){}});
})();

<script>

const pages=[{"type": "cover", "title": "The Smallest Bowl in the Room", "subtitle": "A Good Idea Can Take Shape One Careful Choice at a Time", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-smallest-bowl-in-the-room-assets/cover.jpg"}, {"text": "1. The Biggest Bowl\nOn Saturday morning, Inez carried a sketch of a wide blue bowl into the community art studio. The open studio was next week, and she wanted visitors to stop at her table. In her drawing, the bowl rose almost to the top of a shelf. “This one will be the biggest,” she told Ms. Park.\nMs. Park tied on her mustard apron and looked at the sketch. She asked Inez what the bowl needed to hold. Inez had not decided. It only needed to look impressive, she thought. Around the room, students patted clay and wiped their hands on blue towels. The pottery wheels waited, round and still.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-smallest-bowl-in-the-room-assets/page1.jpg"}, {"text": "2. A Wobbly Start\nInez wedged a lump of clay and set it in the middle of the wheel. When Ms. Park switched on the motor, the clay began to spin. Inez pressed both palms against it. The lump wobbled, then leaned to one side like a sleepy tower.\nShe pushed harder. The clay flattened, but it did not become a bowl. Ms. Park showed her how to steady her elbows against her body and guide the clay toward the center. Inez tried once more. This time the clay rose, but its rim tilted like a hat sliding over one eye.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-smallest-bowl-in-the-room-assets/page2.jpg"}, {"text": "3. The Leaning Rim\nAcross the room, Ravi shaped a small cup with a smooth, even rim. Inez glanced from his cup to her leaning bowl. She imagined visitors noticing the crooked edge first. She stopped the wheel and tried to straighten it with one finger.\nThe rim bent farther. Inez's cheeks grew hot. Ms. Park did not reach in to fix it. “What does the clay do when you press there?” she asked. Inez studied the soft wall. It dipped beneath her fingertip, then sagged. She had been asking the clay to grow before it was steady.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-smallest-bowl-in-the-room-assets/page3.jpg"}, {"text": "4. Starting Over\nInez wanted to save the tall bowl. She smoothed the bent rim and tried to lift it higher. The clay stretched thin on one side. A moment later, the wall folded inward and slumped onto the wheel.\nFor a few seconds, Inez stared at the flat lump. She had hoped for a perfect bowl on her first try. Ms. Park set a damp sponge beside her. “Clay can be used again,” she said. Inez pressed the collapsed walls together. The bowl was gone, but the clay was still ready.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-smallest-bowl-in-the-room-assets/page4.jpg"}, {"text": "5. Center First\nInez rolled the clay into a smooth lump and pressed it onto the wheel again. This time, she did not think about the shelf or the visitors. She watched the spinning clay. When it wobbled, she paused, took a breath, and guided it back to the middle.\nShe opened a small space with her thumbs. Then she lifted the sides slowly, stopping whenever the wall began to shake. The bowl grew only a little. Its rim stayed level. Inez let out a breath she had been holding and watched the wheel turn.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-smallest-bowl-in-the-room-assets/page5.jpg"}, {"text": "6. A Useful Size\nWhen the bowl was ready, Ms. Park helped Inez slide a wire beneath it and lift it from the wheel. It was small enough to fit in both of Inez's hands. One side was a little thicker than the other, but the bowl sat flat on the table.\nInez turned it slowly. Instead of comparing its height with her sketch, she traced the smooth inside with one finger. She thought of the tiny blue buttons her brother kept in a jar. The bowl could hold a few of them without hiding their bright colors.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-smallest-bowl-in-the-room-assets/page6.jpg"}, {"text": "7. The Smallest Bowl\nAt the open studio, Inez set her glazed blue bowl beside Ravi's cup and a tall vase. It was the smallest piece on the shelf. Her brother Nico placed three bright buttons inside it. They fit without sliding beneath the rim.\nA visitor leaned closer. “This bowl knows exactly what it is for,” she said. Inez looked at the steady base and the slightly uneven rim. She had wanted everyone to notice the biggest bowl. Instead, she was glad she had noticed what the clay needed.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-smallest-bowl-in-the-room-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "Why did Inez sketch such a big bowl?", "choices": ["She needed it to hold her brother’s toys", "She wanted it to look impressive so visitors would stop at her table", "Ms. Park told her to make the biggest bowl"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "She wanted visitors to stop at her table, and she thought the bowl only needed to look impressive."}, {"q": "What did Ms. Park ask when Inez tried to fix the rim with one finger?", "choices": ["Why did you choose blue clay?", "Who showed you how to use the wheel?", "What does the clay do when you press there?"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Ms. Park did not fix it for her. She asked what the clay does when you press there."}, {"q": "What happened when Inez tried to lift the tall bowl higher?", "choices": ["The rim became perfectly level", "The wall folded inward and slumped onto the wheel", "The wheel stopped spinning"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "The clay stretched thin, and the wall folded inward and slumped onto the wheel."}, {"q": "What did Inez do differently when she started over?", "choices": ["She watched the clay and paused whenever it wobbled", "She thought about the shelf and the visitors", "She spun the wheel faster"], "answer": 0, "evidencePage": 5, "hint": "Look at page 5.", "explain": "She did not think about the shelf or the visitors. She watched the spinning clay."}, {"q": "Why was Inez glad at the open studio?", "choices": ["Ravi gave her his cup", "Her bowl was the tallest on the shelf", "She had noticed what the clay needed"], "answer": 2, "evidencePage": 7, "hint": "Look at the last page.", "explain": "She was glad she had noticed what the clay needed."}], "grammar": [{"q": "Inez carried a sketch of a wide blue bowl. Which phrase puts the adjectives in the usual order?", "choices": ["a bowl wide blue", "a wide blue bowl", "a blue wide bowl"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Size usually comes before color, so it is “a wide blue bowl”.", "teach": "Adjectives usually go in a set order, with size before color, like <b>a wide blue bowl</b>.<span class='cn'>形容词通常按固定顺序排列，表示大小的词在表示颜色的词前面，比如 <b>a wide blue bowl</b>（一只宽口的蓝碗）。</span>"}, {"q": "‘The lump wobbled, then leaned to one side like a sleepy tower.’ What does the comparison do?", "choices": ["It compares the clay to a tower to show how it leaned", "It tells when the clay fell", "It says the clay was built from towers"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "The comparison with “like” is a simile that shows how the clay leaned.", "teach": "A <b>simile</b> compares two different things using like or as, like <b>leaned like a sleepy tower</b>.<span class='cn'><b>明喻</b>用 like 或 as 把两种不同的东西作比较，比如 <b>leaned like a sleepy tower</b>（像一座瞌睡的塔那样歪着）。</span>"}, {"q": "‘___ rim stayed level.’ Which word belongs in the blank?", "choices": ["Its", "Its’", "It’s"], "answer": 0, "evidencePage": 5, "hint": "Look at page 5.", "explain": "The rim belongs to the bowl, so the sentence needs the word that shows belonging, “its”.", "teach": "<b>Its</b> shows that something belongs to it, like its rim, but <b>it’s</b> is short for it is.<span class='cn'><b>Its</b>（它的）表示属于它，比如 its rim（它的边沿），而 <b>it’s</b> 是 it is 的缩写。</span>"}], "vocabulary": [{"q": "‘Impressive’ means ___.", "choices": ["very quiet", "causing admiration because it is large or well made", "easy to break"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "It only needed to look impressive, she thought."}, {"q": "‘Steady’ means ___.", "choices": ["very tall", "bright blue", "not shaking or moving"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "She had been asking the clay to grow before it was steady."}, {"q": "‘Slumped’ means ___.", "choices": ["sank or fell down heavily", "rose up high", "spun very fast"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "The wall folded inward and slumped onto the wheel."}]};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(impressive|steady|slumped)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 4 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[ke
