<script>

const pages=[{"type": "cover", "title": "The Seven Word Message", "subtitle": "A Child on a Space Station Struggles to Fit Everything Into a Seven-Word Note to a Parent Far Away", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-seven-word-message-assets/cover.jpg"}, {"text": "1. Seven Places to Put a Word\nOn Sable Station, our family could send one seven-word note between the longer relay calls. The short messages traveled when a passing supply ship had room in its signal. Bigger messages waited for the scheduled connection. I did not understand every part of the system. I understood that seven words were less than I needed.\nDad was surveying a distant world called Venn. He would be away for six more weeks. Mom let me choose our next quick note. I wrote, Bring cake. We miss you. Come home. Seven words, including cake, which mattered because station birthday cakes tasted faintly of the containers they arrived in. Mom counted them, then asked whether that was the message I wanted him to carry around all week. I said it was only a note. She said that was why she wanted me to read it again.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-seven-word-message-assets/page1.jpg"}, {"text": "2. A Message That Sounded Impressive\nI took the tablet to Luka after school. He suggested telling Dad about the running race. I had finished third, which was better than last month. Luka had finished fourth and spent the afternoon explaining the effect of his untied shoelace. I wrote, Won the race. Beat Luka by miles. It fitted exactly.\nLuka said he objected to miles. He did not object to won until I asked whether Dad would know it was a joke. That was the trouble with seven words. A raised eyebrow did not fit. Neither did the long explanation that made something ridiculous rather than untrue. I deleted the sentence. Luka said I could simply write that I had come third. I tried it, but the news seemed lonely without the rest of the race around it. I wanted Dad to hear the whole afternoon.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-seven-word-message-assets/page2.jpg"}, {"text": "3. The Message That Kept Him Safe\nIn the garden deck, I tried a reassuring note. Everything is fine. We are never lonely. Seven words. Luka looked at the little trees growing under the lamps and asked whether never was doing too much work. I said Dad was far away. I did not want him worrying about us when there was nothing he could do.\nLuka said that was reasonable, then asked whether I wanted Dad to believe we never missed him. I stared at the tablet. Sometimes I was happy for an entire afternoon and remembered him only when something happened that he would have liked. Sometimes the empty chair at supper annoyed me before I understood why. Fine could mean many things. Never meant something much smaller and less true. I erased that word first. Once it was gone, the rest of the message did not seem worth protecting.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-seven-word-message-assets/page3.jpg"}, {"text": "4. A Message for the Empty Chair\nBack home, I wrote, Come home now. I hate this station. I counted the words with the blue pencil. Mom read over my shoulder. She did not tell me to be grateful. She asked which part I hated. I said the waiting. She said that was a good place to begin.\nI liked the garden deck. I liked Luka, even when he explained his shoelace. I liked watching the blue planet from the window when the station lights dimmed for night. I did not like Dad being somewhere I could not imagine properly. His last full message had described red dunes and a small sun. I had read it quickly, looking for the date he would return. Now I opened it again. There was a joke about his tent, a description of the cold, and a question about our school play. I had answered the question but ignored the dunes.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-seven-word-message-assets/page4.jpg"}, {"text": "5. Something I Had Not Asked\nI asked Mom whether Dad liked Venn. She said he liked parts of the work and missed parts of home. I asked which parts. She said I could ask him. I nearly pointed at the word limit. Then I realized I had spent the whole afternoon planning what Dad ought to hear from me. I had not left him much room to answer.\nI wrote, We miss you. Tell us your sky. Seven words. The first three did not hide the empty chair. The last four did not ask him to make it disappear immediately. Mom read the sentence twice. She said she wanted to know about his sky too. I imagined Dad looking up from a place I had never seen, choosing something he could bring back in words. For the first time, the little note seemed less like a box I had to fill and more like the beginning of a conversation.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-seven-word-message-assets/page5.jpg"}, {"text": "6. The Space after Sending\nAt the station post terminal, I checked the address with Mom. The note was accepted for the next supply-ship relay. Nothing dramatic happened. There was no beam I could follow through the window. The tablet returned to its ordinary menu, and we went to get supper. I wished sending a question made waiting easier.\nIt did not. I checked for a reply the next morning, although Mom had explained that it might take several days. At school, Luka asked whether I had mentioned his terrible defeat. I said Dad would have to wait for the full version. That afternoon, I began a longer letter for our next scheduled connection. I wrote about coming third and about the slipper someone had used as a stage prop. Without the seven-word limit, I still stopped to ask whether each detail told Dad what I actually meant.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-seven-word-message-assets/page6.jpg"}, {"text": "7. The Sky That Came Back\nThe reply arrived two days later. Red dunes. Small sun. Thinking of you. I counted seven words, then read them again without counting. Dad had answered the question. He had also found a way to put us into the answer. I showed Mom before showing Luka, who said small sun sounded like a disappointing vacation.\nThat night, I stood by our sealed window and watched the blue planet turn slowly below. I could not see Venn. I did not pretend the view was the same as Dad's. But when I thought about him, I could picture him looking at something instead of only being absent from our table. Six weeks was still six weeks. The station cake would still taste peculiar. In my longer letter, I asked about the tent. There was room for the question, and I wanted to know the answer.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-seven-word-message-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What was the rule for the quick notes on Sable Station?", "choices": ["A note could be as long as the sender liked", "Each note had to be exactly seven words and traveled when a passing supply ship had room", "Notes were sent only once a year"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "The family could send one seven-word note, and short messages traveled when a supply ship had room in its signal."}, {"q": "Why did the narrator delete the joke about the race?", "choices": ["Dad would not read it", "Luka asked for a longer note", "Seven words had no room to show it was a joke, so it might look untrue"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "A raised eyebrow did not fit, and neither did the explanation that made something ridiculous rather than untrue."}, {"q": "Why did Luka question the word ‘never’?", "choices": ["It would make Dad believe they never missed him, which was not true", "It was spelled wrong", "It was too long for the note"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Luka asked whether the narrator wanted Dad to believe they never missed him."}, {"q": "What did the narrator change in the final note?", "choices": ["Added a long joke", "Added a question, so it read We miss you. Tell us your sky.", "Told Dad to come home now"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "The narrator left Dad room to answer by asking about his sky."}, {"q": "What was Dad’s reply?", "choices": ["Red dunes. Small sun. Thinking of you.", "Come home now. I hate this station.", "Bring cake. We miss you."], "answer": 0, "evidencePage": 7, "hint": "Look at page 7.", "explain": "Dad answered the question about his sky and found a way to put the family into the answer."}], "grammar": [{"q": "‘The quick note had ___ words than the longer letter.’ Which word belongs in the blank?", "choices": ["littler", "less", "fewer"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Words can be counted, so the sentence needs fewer.", "teach": "Use <b>fewer</b> for things you can count, like <b>fewer words</b>, and <b>less</b> for amounts you cannot count.<span class='cn'>能数的东西用 <b>fewer</b>，比如 <b>fewer words</b>；不能数的量才用 <b>less</b>。</span>"}, {"q": "Which phrase is written correctly?", "choices": ["a seven word’s note", "a seven-words note", "a seven-word note"], "answer": 2, "evidencePage": 6, "hint": "Look at page 6.", "explain": "A number and a noun that work together as one describing word are joined by a hyphen, and the noun stays singular.", "teach": "When a number and a noun work together as one describing word, like <b>seven-word</b>, they are joined with a hyphen and the noun stays singular.<span class='cn'>数字和名词合在一起当形容词用时，比如 <b>seven-word</b>，要用连字符连接，名词保持单数。</span>"}, {"q": "‘The little note seemed less like a box I had to fill and more like the beginning of a conversation.’ What does this show?", "choices": ["The note first felt like a task with a fixed size and now felt like a way to talk back and forth", "The note was too big", "The box was really full"], "answer": 0, "evidencePage": 5, "hint": "Look at page 5.", "explain": "A box has fixed limits, but a conversation goes back and forth.", "teach": "A comparison with <b>like</b> is a simile, and here the <b>box</b> stands for a small space that must be filled.<span class='cn'>用 <b>like</b> 做的比较是明喻，这里的 <b>box</b>（盒子）代表必须填满的小空间。</span>"}], "vocabulary": [{"q": "‘Reassuring’ means ___.", "choices": ["making someone feel less worried", "making someone tired", "making someone laugh"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "In the garden deck, I tried a reassuring note."}, {"q": "‘Peculiar’ means ___.", "choices": ["very sweet", "strange or unusual", "extremely large"], "answer": 1, "evidencePage": 7, "hint": "Look at page 7.", "explain": "The station cake would still taste peculiar."}, {"q": "‘Conversation’ means ___.", "choices": ["a long trip", "a talk where people take turns speaking", "a kind of game"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "The note seemed more like the beginning of a conversation."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(reassuring|peculiar|conversation)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 6 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}

function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}var TEACH_ICONS='<svg class="ic i-spk" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.5v5h3.6l4.9 4.5V5L7.6 9.5H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.6 9.2a4 4 0 010 5.6M18.2 6.6a7.6 7.6 0 010 10.8"/></svg><svg class="ic i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></svg><svg class="ic i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 5.3v13.4c0 .8.9 1.3 1.6.8l9.6-6.7c.6-.4.6-1.2 0-1.6L9.8 4.5c-.7-.5-1.6 0-1.6.8z"/></svg>';var _tp=null;function _tpSet(b,st){if(!b)return;b.classList.toggle('is-playing',st==='playing');b.classList.toggle('is-paused',st==='paused');b.setAttribute('aria-pressed',st==='playing'?'true':'false');var z=b.dataset.part==='cn',L=st==='playing'?(z?'\u6682\u505C':'Pause'):st==='paused'?(z?'\u7EE7\u7EED\u64AD\u653E':'Resume'):b.dataset.label;b.setAttribute('aria-label',L);b.title=L;}function stopTeachAudio(){var c=_tp;if(!c)return;_tp=null;try{if(c.audio){c.audio.onended=c.audio.onerror=c.audio.ontimeupdate=null;c.audio.pause();}}catch(e){}if(c.mode==='tts'){try{speechSynthesis.cancel();}catch(e){}}_tpSet(c.btn,'idle');}function _tpFallback(btn){try{var u=new SpeechSynthesisUtterance(btn.dataset.text||'');u.lang=btn.dataset.lang||'en-US';var cur={btn:btn,mode:'tts'};_tp=cur;u.onend=u.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');}};_tpSet(btn,'playing');speechSynthesis.speak(u);}catch(e){}}function playTeachAudio(btn){if(_tp&&_tp.btn===btn){if(_tp.mode==='audio'){var a0=_tp.audio;if(a0.paused){var p0=a0.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}
function returnToQuestion(){(function(){var b=document.getElementById("evidenceBanner");if(b&&b.parentNode)b.parentNode.removeChild(b);})();renderPanel();document.querySelector(".panel").scrollIntoView({behavior:"smooth",block:"start"})}
function nextQuestion(){const list=quizzes[activeTab];if(qIndex[activeTab]<list.length-1){qIndex[activeTab]++;renderPanel();return}completed[activeTab]=true;if(activeTab==="comprehension")activeTab="grammar";else if(activeTab==="grammar")activeTab="vocabulary";else{return showCompletion()}setTabs();renderPanel()}
function showCompletion(){completed.vocabulary=true;setTabs();const correct=Object.keys(selections).filter(k=>{const [tab,idx]=k.split('-');return selections[k]===quizzes[tab][+idx].answer}).length,total=Object.values(quizzes).reduce((a,b)=>a+b.length,0);document.getElementById("stagePill").textContent="Journey Complete";document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">Reading journey complete</div><h2>Wonderful work! 🎉</h2><p class="small">You finished Reading, Grammar, and Vocabulary.</p><div class="score-row"><div class="score-box"><b>${total}</b><br><span>Questions</span></div><div class="score-box"><b>${correct}</b><br><span>Correct now</span></div></div><div class="feedback good">You used evidence, practiced sentence skills, and learned new words.</div><button class="submit" onclick="restartPractice()">Practice Again</button></div>`}
function restartPractice(){activeTab="comprehension";qIndex={comprehension:0,grammar:0,vocabulary:0};selections={};attempts={};completed={comprehension:false,grammar:false,vocabulary:false};setTabs();renderPanel()}
function saveProgress(){try{localStorage.setItem("les-the-seven-word-message-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-seven-word-message"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-seven-word-message",bookTitle:"The Seven Word Message",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}
function clearHighlight(){document.querySelectorAll(".story-word.reading").forEach(x=>x.classList.remove("reading"))}
let preferredVoice=null;
