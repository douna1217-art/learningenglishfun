<script>

const pages=[{"type": "cover", "title": "The Shot I Was Willing to Miss", "subtitle": "A Basketball Player Who Always Passes to Avoid Missing Learns to Take the Shot and Live With the Result", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-shot-i-was-willing-to-miss-assets/cover.jpg"}, {"text": "1. The Player Who Shared\nCoach Lina called me an unselfish player, and for a while I treated that as my official position. Other players were guards or forwards. I was unselfish. If someone passed me the ball, I found another person to give it to. Parents praised the way I shared. My teammates knew I would look for them. Nobody complained, except Bea, who once asked whether I thought the ball became dangerous after I held it for three seconds.\nI told her I was keeping it moving. That was what our coach wanted. What I didn't tell her was that a missed shot stayed with me long after practice. I could hear the flat knock of the ball against the rim while brushing my teeth. A pass disappeared into someone else's decision. If the next shot missed, I could be disappointed for my teammate without having to wonder whether everyone was disappointed in me.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-shot-i-was-willing-to-miss-assets/page1.jpg"}, {"text": "2. The Space I Would Not Use\nDuring Thursday's practice, I received the ball with a clear path to the basket. Bea was near the corner, with a defender close beside her. I passed anyway. The defender stepped across, caught the ball, and ran the other way. Coach blew her whistle. I expected her to tell me to pass sooner. Instead, she asked what I had seen. I described the defender near Bea and the empty space in front of me. Saying it aloud made the pass sound stranger.\n“Why did you choose Bea?” she asked. I said Bea was a better shooter. Bea put her hands on her hips. “I was a very well-guarded better shooter,” she said. A few teammates smiled, but nobody laughed at me. That almost made it worse. Coach asked us to reset. When the same gap opened again, I took two steps toward it, then passed back. This time she didn't stop play. I wished she had.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-shot-i-was-willing-to-miss-assets/page2.jpg"}, {"text": "3. Ten Attempts After Practice\nBea stayed after the others left. She tossed me the ball and stood far enough away that I couldn't hand it straight back. “You can miss,” she said. “We all do.” I knew this in the ordinary way I knew it rained in other towns. It became less convincing when the ball was in my hands. I took a shot. It hit the front of the rim. Bea collected it and passed it back without saying anything.\nWe tried ten attempts. Some went in. Some didn't. By the last one, I had stopped checking Bea's face after every miss. Coach sat on the bench, unlacing one shoe. I asked whether she wanted me to shoot more often. “I want you to notice the whole court,” she said. “You're part of it.” She wasn't giving me permission to shoot every time. That would have been an easier instruction. She was asking me to choose, which was the part I had been avoiding.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-shot-i-was-willing-to-miss-assets/page3.jpg"}, {"text": "4. A Different Kind of Passing\nOn Saturday, I entered the game determined to recognize an open shot. My first chance was not open at all. A defender stood between me and the basket, and Bea was free near the sideline. I passed. She scored. For a second, I wondered whether I had failed the lesson. Then she pointed at me while running back on defense. It was the same pass I would usually have made, but I knew why I had made it.\nLater, I took a short shot that bounced away. Nobody stopped playing to discuss my character. I ran after the rebound and missed that too. The game continued, inconveniently ordinary. From the bench, Coach called for us to spread out. I began seeing things I had missed while searching for the quickest way to stop holding the ball, like a teammate moving behind a defender, a gap closing, or a patch of floor opening beside the basket. There were choices everywhere. None came with a promise.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-shot-i-was-willing-to-miss-assets/page4.jpg"}, {"text": "5. One Point Behind\nNear the end, we were one point behind. I received a pass near the side of the lane. The defender in front of me moved toward Bea. For a moment, the space between me and the basket was clear. I could see the old pass waiting. Bea would catch it with a defender already arriving. If she missed, I could tell myself I had done my part. I bent my knees and took the shot.\nThe ball struck the rim and rolled away. An opponent caught the rebound. We chased back, but the last seconds vanished before we could recover it. The whistle ended the game. I stood with my hands still half raised. I had imagined that choosing the shot would make me feel different, as though courage might come with its own small guarantee. Instead, my stomach felt exactly the way I had feared. We had lost. I had missed. Both things were true.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-shot-i-was-willing-to-miss-assets/page5.jpg"}, {"text": "6. The Question Afterward\nIn the hallway, I apologized to Bea. She asked what I was apologizing for. I said the last shot. “Were you open?” she asked. I nodded. “Was I?” I shook my head. She leaned against the wall and drank some water. I wanted her to tell me I had played brilliantly. She said my next practice should include that same shot. It was not quite the comfort I had ordered, but it sounded like she expected me to take another one.\nCoach came out carrying the ball bag. I asked whether she would make the same decision again. She said she would look at the defender again, then decide. We discussed my release and where my feet had landed. There were things I could improve. She didn't turn my miss into a secret victory. Neither did she treat it as proof that I should have passed. On the drive home, I was still upset. I also found myself planning where Bea and I could stand at our next practice.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-shot-i-was-willing-to-miss-assets/page6.jpg"}, {"text": "7. The Next Ball\nOn Monday, I took the shot from the same patch of floor. It missed. Bea threw the ball back. The next one went in. We kept practicing until other players arrived, and then we played a short game. Twice I passed to Bea. Once I drove toward the basket and stopped when the opening closed. I could still hear Saturday's miss, but it no longer gave all the instructions.\nCoach called me unselfish again when I found a teammate near the corner. I was glad, though I didn't collect the word as carefully as before. A few minutes later, Bea sent me the ball. I looked at the basket, then at the defender's feet. There was room. I couldn't know where the ball would go after it left my hands. I took the shot before that uncertainty could make the choice for me.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-shot-i-was-willing-to-miss-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "Why did the narrator keep passing the ball?", "choices": ["The narrator could not shoot at all", "A missed shot stayed in the narrator’s mind, and a pass left the decision to someone else", "Coach made every player pass"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "A pass disappeared into someone else’s decision, so the narrator never had to wonder if everyone was disappointed."}, {"q": "What happened when the narrator passed to Bea during practice?", "choices": ["A defender stepped across, caught the ball, and ran the other way", "The ball went out of bounds", "Bea scored easily"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "The defender stepped across, caught the ball, and ran the other way."}, {"q": "What did Coach want from the narrator?", "choices": ["To stop playing", "To notice the whole court and choose, not to shoot every time", "To shoot every time"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "She said she wanted the narrator to notice the whole court, and she was asking the narrator to choose."}, {"q": "What happened on the last shot of the game?", "choices": ["The narrator took it and missed, and the team lost", "The narrator passed to Bea", "The narrator made the winning basket"], "answer": 0, "evidencePage": 5, "hint": "Look at page 5.", "explain": "The ball struck the rim and rolled away, and the narrator thought, We had lost. I had missed."}, {"q": "What did the narrator do near the end of the story?", "choices": ["Passed it to Bea again", "Took the shot before uncertainty could make the choice", "Left the court"], "answer": 1, "evidencePage": 7, "hint": "Look at page 7.", "explain": "The narrator looked at the basket, then at the defender’s feet, and took the shot."}], "grammar": [{"q": "‘Bea was a better shooter ___ the narrator.’ Which word belongs in the blank?", "choices": ["then", "that", "than"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "The sentence compares two players, so it needs than.", "teach": "Use <b>than</b> to compare, like <b>better than</b>, and use <b>then</b> to talk about time or what comes next.<span class='cn'>比较时用 <b>than</b>，比如 <b>better than</b>；表示时间或接下来的事才用 <b>then</b>。</span>"}, {"q": "Which of these is a complete sentence?", "choices": ["Bea, near the corner, with a defender.", "Because the ball hit the rim.", "Bea threw the ball back."], "answer": 2, "evidencePage": 7, "hint": "Look at page 7.", "explain": "A complete sentence has a subject and a verb and expresses a full thought.", "teach": "A complete sentence has a subject and a verb, like <b>Bea threw the ball back</b>.<span class='cn'>完整的句子要有主语和谓语，比如 <b>Bea threw the ball back</b>。</span>"}, {"q": "‘It was not quite the comfort I had ordered.’ What does the writer mean?", "choices": ["Bea was rude", "The narrator ordered food", "The narrator had wanted reassurance, as if ordering it, and did not get exactly that"], "answer": 2, "evidencePage": 6, "hint": "Look at page 6.", "explain": "The writer pretends comfort is something you order, so the answer was not what the narrator wanted.", "teach": "A <b>metaphor</b> treats one thing as another, like comfort that can be <b>ordered</b> like a meal.<span class='cn'><b>隐喻</b>把一件事当作另一件事，比如把安慰说成能像点餐一样 <b>ordered</b>（点）的东西。</span>"}], "vocabulary": [{"q": "‘Unselfish’ means ___.", "choices": ["caring about others more than yourself", "wanting everything", "afraid of the ball"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Coach Lina called me an unselfish player."}, {"q": "‘Permission’ means ___.", "choices": ["a loud whistle", "being allowed to do something", "a team uniform"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "She wasn’t giving me permission to shoot every time."}, {"q": "‘Uncertainty’ means ___.", "choices": ["not knowing what will happen", "a happy ending", "feeling very sure"], "answer": 0, "evidencePage": 7, "hint": "Look at page 7.", "explain": "I took the shot before that uncertainty could make the choice for me."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(unselfish|permission|uncertainty)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 6 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}var TEACH_ICONS='<svg class="ic i-spk" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.5v5h3.6l4.9 4.5V5L7.6 9.5H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.6 9.2a4 4 0 010 5.6M18.2 6.6a7.6 7.6 0 010 10.8"/></svg><svg class="ic i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></svg><svg class="ic i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 5.3v13.4c0 .8.9 1.3 1.6.8l9.6-6.7c.6-.4.6-1.2 0-1.6L9.8 4.5c-.7-.5-1.6 0-1.6.8z"/></svg>';var _tp=null;function _tpSet(b,st){if(!b)return;b.classList.toggle('is-playing',st==='playing');b.classList.toggle('is-paused',st==='paused');b.setAttribute('aria-pressed',st==='playing'?'true':'false');var z=b.dataset.part==='cn',L=st==='playing'?(z?'\u6682\u505C':'Pause'):st==='paused'?(z?'\u7EE7\u7EED\u64AD\u653E':'Resume'):b.dataset.label;b.setAttribute('aria-label',L);b.title=L;}function stopTeachAudio(){var c=_tp;if(!c)return;_tp=null;try{if(c.audio){c.audio.onended=c.audio.onerror=c.audio.ontimeupdate=null;c.audio.pause();}}catch(e){}if(c.mode==='tts'){try{speechSynthesis.cancel();}catch(e){}}_tpSet(c.btn,'idle');}function _tpFallback(btn){try{var u=new SpeechSynthesisUtterance(btn.dataset.text||'');u.lang=btn.dataset.lang||'en-US';var cur={btn:btn,mode:'tts'};_tp=cur;u.onend=u.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');}};_tpSet(btn,'playing');speechSynthesis.speak(u);}catch(e){}}function playTeachAudio(btn){if(_tp&&_tp.btn===btn){if(_tp.mode==='audio'){var a0=_tp.audio;if(a0.paused){var p0=a0.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}

function saveProgress(){try{localStorage.setItem("les-the-shot-i-was-willing-to-miss-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-shot-i-was-willing-to-miss"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-shot-i-was-willing-to-miss",bookTitle:"The Shot I Was Willing to Miss",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

let preferredVoice=null;
