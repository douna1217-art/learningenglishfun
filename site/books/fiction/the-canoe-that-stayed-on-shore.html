<script>

const pages=[{"type": "cover", "title": "The Canoe That Stayed on Shore", "subtitle": "When Wind Keeps the Canoe on Shore, a Girl Discovers That a Good Day Can Look Different From the One She Planned", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-canoe-that-stayed-on-shore-assets/cover.jpg"}, {"text": "1. The Photograph I Had Carried\nFor three weeks I kept a photograph of Uncle Jon's canoe trip beside my bed. In it, the lake lay flat as a window, and a blue mountain appeared twice, once above the water and once inside it. On Saturday I would sit in the front of that same canoe. Eli was coming too. I had practiced holding a paddle with a broom until my mother asked whether I planned to sweep the entire lake.\nAt the launch, Uncle Jon fitted our life jackets while I looked for the mountain's reflection. It kept breaking into pieces. Wind pushed small waves toward the stones. Eli took a photograph, then lowered his camera. Uncle Jon watched the water for a long time. I knew what he was going to say before he said it. I looked at the canoe instead, as though something with two seats and a freshly cleaned hull might have a vote.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-canoe-that-stayed-on-shore-assets/page1.jpg"}, {"text": "2. A Decision without a Splash\nWe weren't launching. The wind was stronger than Uncle Jon expected, and the updated forecast showed it continuing. I asked whether we could stay close to shore. He said no. I asked whether we could wait an hour. He said we could wait, but he would not promise the answer would change. His voice was calm in a way that made my questions sound younger than I intended them to sound.\nEli said we could walk the lakeside path. I said he could walk it by himself. Then I saw Uncle Jon's face and wished I had spoken differently. He had packed lunch, borrowed a roof carrier, and driven us there before breakfast. None of that made the water safer. It did make it impossible to believe that he had cancelled because he hadn't wanted to bother. I loosened my life jacket and waited for someone to improve the morning.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-canoe-that-stayed-on-shore-assets/page2.jpg"}, {"text": "3. The Path I Had Not Chosen\nAfter we carried the equipment back from the launch, Uncle Jon secured the canoe on a grassy patch beside the parking area. We put the life jackets away and set off along the path. I walked behind the others. The lake stayed beside us, repeatedly offering views I hadn't come to see from that particular height. Eli stopped to photograph a tree growing sideways over the bank. I told him the wind would blur the leaves.\nHe said that was part of the picture. I thought this sounded like something people said when they couldn't get the photograph they wanted. Then I remembered the smooth lake beside my bed. I had been trying to walk into somebody else's successful afternoon. This morning had different weather, different people, and a girl in gray boots who was making very little effort to be enjoyable company. I wasn't ready to forgive that girl either.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-canoe-that-stayed-on-shore-assets/page3.jpg"}, {"text": "4. A Question I Should Have Asked\nAt a sheltered bench, Eli asked whether I was angry with him. I said I was angry because he didn't care about the canoe. He put his camera into its case before answering. He had wanted to paddle. He had also wanted a day away from home after a week of his little brothers arguing over the same toy. Walking beside the lake was already giving him part of what he had come for.\nI had assumed that because he could enjoy something else, he hadn't cared about the thing we lost. Eli asked whether I would prefer him to spend the whole day looking miserable. I knew the correct answer. Finding the honest one took longer. We sat without talking while Uncle Jon checked the forecast again. Nothing had improved on the water. Beside me, Eli waited for an answer instead of pretending my first answer had settled anything.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-canoe-that-stayed-on-shore-assets/page4.jpg"}, {"text": "5. Lunch with No Destination\nBy lunchtime, I could tell Eli I wasn't angry with him. I was disappointed and had been looking for somewhere to put it. This did not make me feel immediately cheerful. It did make it possible to ask about his brothers, which produced a story involving a toy truck, a bathroom door, and an argument nobody in his house had managed to explain. I laughed before I remembered that the morning was supposed to be ruined.\nWe ate under the picnic shelter. Uncle Jon told us the photograph I loved had been taken on his fourth attempt to reach that lake. On the first, it had rained. On the second, his car hadn't started. On the third, the canoe had stayed on shore. I asked why he hadn't told me. He said I had asked about the photograph, and he had enjoyed describing the good day. He hadn't thought to describe the others.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-canoe-that-stayed-on-shore-assets/page5.jpg"}, {"text": "6. A Picture of This Morning\nOn our way back, I asked Eli to take a photograph beside the canoe. Not inside it, and not with the lake arranged behind us to look calmer than it was. Uncle Jon stood at one end. I stood at the other, holding the unused paddle. I tried smiling, then stopped trying quite so hard. Eli said the second picture was better. My face looked like someone whose day had changed without asking permission.\nThe forecast still hadn't improved. We loaded the canoe onto the carrier and packed the life jackets beneath it in the car. I was glad nobody suggested trying just one quick paddle before we left. I was also sad to put the equipment away. The two feelings didn't cancel each other. Watching Uncle Jon tighten the straps, I understood that wanting him to change his mind had never meant I wanted him to stop being careful with us.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-canoe-that-stayed-on-shore-assets/page6.jpg"}, {"text": "7. The Photograph beside My Bed\nAt home I put Eli's photograph beside the old one. In the first, the mountain had a perfect reflection. In the second, my hair had come loose around my face and Uncle Jon stood beside the unused paddle. A blue canoe occupied a great deal of dry land. My mother asked whether I had enjoyed the trip. I said I hadn't enjoyed all of it. Then I told her about the sideways tree and the toy truck.\nUncle Jon offered to choose another date. I said yes, and asked whether we could bring walking shoes as well as paddles. I wasn't pretending that a walk was the same as crossing the lake. I still wanted the crossing. But when I looked at our photograph, I could remember a whole afternoon around its edges. The canoe had stayed on shore. We had gone somewhere together anyway, although it had taken me longer than the others to notice where.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-canoe-that-stayed-on-shore-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What had the narrator been looking forward to for three weeks?", "choices": ["Taking photographs of the mountain", "Learning to swim", "Sitting in the front of Uncle Jon’s canoe on a calm lake, like in his photograph"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "She kept a photograph of Uncle Jon’s canoe trip beside her bed and had been waiting to sit in the front of that same canoe."}, {"q": "Why did they not launch the canoe?", "choices": ["The canoe had a hole", "The wind was stronger than expected, and the forecast said it would continue", "Eli did not want to go"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "The wind was stronger than Uncle Jon expected, and the updated forecast showed it continuing."}, {"q": "What did Eli say when she asked whether he was angry that the trip was cancelled?", "choices": ["He had wanted to paddle, but he also wanted a day away from home, and the walk gave him part of it", "He said he did not care about the canoe", "He said he was very angry"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "He had wanted to paddle, and he had also wanted a day away from his little brothers, and the lakeside walk was giving him part of that."}, {"q": "What did Uncle Jon tell them at lunch about the photograph she loved?", "choices": ["It was taken on his fourth try, after rain, a car that would not start, and a day the canoe stayed on shore", "Someone else had taken it", "It was taken on the very first try"], "answer": 0, "evidencePage": 5, "hint": "Look at page 5.", "explain": "On the first attempt it had rained, on the second his car hadn’t started, and on the third the canoe had stayed on shore."}, {"q": "What did she ask Uncle Jon at the end?", "choices": ["To buy a new canoe", "To choose another date, and to bring walking shoes as well as paddles", "To never go back to the lake"], "answer": 1, "evidencePage": 7, "hint": "Look at the last page.", "explain": "She said yes to another date and asked whether they could bring walking shoes as well as paddles."}], "grammar": [{"q": "‘Uncle Jon ___ checked the forecast again.’ Which word adds emphasis?", "choices": ["him", "he’s", "himself"], "answer": 2, "evidencePage": 4, "hint": "Look at page 4.", "explain": "The word “himself” adds emphasis to who did the checking.", "teach": "An <b>intensive pronoun</b> like <b>himself</b> or <b>herself</b> adds emphasis, like <b>Uncle Jon himself checked it</b>.<span class='cn'><b>强调代词</b>比如 <b>himself</b> 或 <b>herself</b> 用来加强语气，比如 <b>Uncle Jon himself checked it</b>（爷爷亲自查了一遍）。</span>"}, {"q": "Which sentence keeps its pronouns consistent?", "choices": ["When people are disappointed, they often look for someone to blame.", "When a person is disappointed, they often looks for someone to blame.", "When people are disappointed, you often look for someone to blame."], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "The first sentence uses “people” and “they” all the way through.", "teach": "Do not shift between pronouns in one sentence, like <b>people</b> and <b>they</b> instead of <b>people</b> and <b>you</b>.<span class='cn'>同一个句子里不要换代词，比如用 <b>people</b> 和 <b>they</b>，而不是 <b>people</b> 和 <b>you</b>。</span>"}, {"q": "Which word gives the most positive feeling about Uncle Jon’s choice to stay on shore?", "choices": ["nervous", "timid", "cautious"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "“Cautious” suggests sensible care, while “timid” and “nervous” suggest fear.", "teach": "Words with almost the same meaning can feel different, like <b>cautious</b> for sensible care and <b>timid</b> for fear. That feeling is called <b>connotation</b>.<span class='cn'>意思相近的词感觉可能不同，比如 <b>cautious</b>（谨慎）带有明智的意味，而 <b>timid</b>（胆怯）带有害怕的意味。这种感觉叫<b>内涵意义</b>。</span>"}], "vocabulary": [{"q": "‘Reflection’ means ___.", "choices": ["an image you see in water or a mirror", "a loud echo", "a kind of shadow on a wall"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "I looked for the mountain’s reflection, and it kept breaking into pieces."}, {"q": "‘Forecast’ means ___.", "choices": ["a list of supplies", "a prediction about what the weather will be", "a map of a lake"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "The updated forecast showed the wind continuing."}, {"q": "‘Disappointed’ means ___.", "choices": ["completely calm", "sad because something did not turn out as hoped", "very proud"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "I was disappointed and had been looking for somewhere to put it."}]};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(reflection|forecast|disappointed)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 6 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}

function saveProgress(){try{localStorage.setItem("les-the-canoe-that-stayed-on-shore-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-canoe-that-stayed-on-shore"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-canoe-that-stayed-on-shore",bookTitle:"The Canoe That Stayed on Shore",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}
