<script>

const pages=[{"type": "cover", "title": "The Photograph We Almost Printed", "subtitle": "A Dramatic Picture Seems to Tell One Story Until Two Reporters Ask Better Questions", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-photograph-we-almost-printed-assets/cover.jpg"}, {"text": "1. A Picture Worth Keeping\nSana found the photograph while choosing pictures for the school newspaper. Most of her shots from the design fair showed someone's elbow or the back of a head. This one was different. Max stood beside Amir's cardboard clocktower, holding its blue clock face. Part of the tower leaned across the table. Amir's mouth was open, and Max looked furious. Sana enlarged the image until the two boys filled the screen.\nOwen rolled his chair closer. He was checking names and captions. Sana typed a heading about a project destroyed during judging. At last, she thought, they had something more interesting than a list of winners. Owen read over her shoulder. His hand stopped above his notebook. “Were you there when it fell?” he asked. Sana looked back at the photograph.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-photograph-we-almost-printed-assets/page1.jpg"}, {"text": "2. What the Camera Saw\nShe remembered turning toward a shout. She had raised the camera, taken one picture, then hurried to photograph the bridge models before the fair closed. She hadn't actually seen the tower fall. “But look at Max,” she said. Owen studied the screen. “He looks angry. That doesn't tell us what happened.” Sana wanted to argue. Max had been competing in the same category as Amir. That made her first explanation seem reasonable.\nOwen asked what else it could mean. Perhaps Max was trying to catch the tower. Perhaps someone outside the picture had bumped the table. Sana didn't like either answer as much as her own. They sounded like guesses. Then she realized that hers was a guess too. She saved the draft without sending it to their teacher.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-photograph-we-almost-printed-assets/page2.jpg"}, {"text": "3. The Boy in Green\nThey found Max in the art room, collecting scraps for another model. When Sana asked about the photograph, he looked at it for a long moment. “I was telling people to move back,” he said. “Someone almost stepped on the roof.” He pointed to a red corner at the bottom of the image. Sana had cropped that out. She wished she could remember the shout more clearly.\n“Were you holding the clock because you pulled it off?” she asked. Max's eyebrows rose. Owen shifted beside her. The question had sounded worse aloud. “It was on the floor,” Max said. “I picked it up. Ask Amir.” He handed back the picture. Sana noticed the cardboard scraps in his other hand. They were blue, like the clock face, but that didn't prove anything either.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-photograph-we-almost-printed-assets/page3.jpg"}, {"text": "4. The Person Beside Him\nAmir was in the library. His clocktower stood beside his chair, repaired with paper strips. He winced when Sana showed him the photograph. “I leaned across the table for my score sheet,” he explained. “My sleeve caught the roof. The whole thing went over.” Max had helped gather the pieces. Amir had been calling for tape when the camera clicked. Neither boy had heard the other clearly over the crowd.\n“Why was Max so upset?” Sana asked. Amir touched a paper repair. “Wouldn't you be? We'd spent a week helping each other with those models.” Sana looked at Owen. She had known the boys were competitors. She hadn't asked whether they were friends. The tower seemed smaller here, beside a library chair, than it had looked on her screen.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-photograph-we-almost-printed-assets/page4.jpg"}, {"text": "5. Beyond the Frame\nBack at the newspaper table, Sana opened the original file. Around the boys were details she had cut away. The red roof lay below Max's foot, but his shoe wasn't touching it. A roll of tape sat just beyond Amir's hand. None of that proved the whole story. It did show how much her close crop had left out. She restored the wider frame.\nOwen opened his notebook. He had written down both boys' explanations. Sana checked a sentence against Max's exact words instead of improving it into something he hadn't said. Then she deleted her heading. Her fingers rested on the keys. Without the argument she had imagined, she wasn't sure there was a story. Owen turned the photograph toward her. “Why did they bother rebuilding after judging?”", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-photograph-we-almost-printed-assets/page5.jpg"}, {"text": "6. A Better Question\nThey went back to ask. Amir said the tower was a gift for his younger brother, who had helped paint the windows. Max wanted a photograph of the finished model before it went home. The prize had mattered to both of them, but it wasn't the only reason they had built anything. Sana had arrived with questions about an argument. Those questions would never have led her to Amir's brother.\nThis time, she asked permission before taking another picture. The boys stood beside the repaired tower. Max straightened the red roof while Amir held the base. Sana waited until their faces relaxed. She took one photograph, then another from farther away. On the way back, she told Owen that his first question had saved them from printing something wrong. “Your next question found the story,” he said.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-photograph-we-almost-printed-assets/page6.jpg"}, {"text": "7. The Caption Beneath It\nTheir teacher checked the article with them before it went to print. It included the collapse, the repairs, and the reason the model was going home. Beneath the new photograph, Sana wrote that Max and Amir were finishing the tower together. She checked their names one last time. The headline was quieter than her first one. She could explain every word of it.\nOn Friday, Max stopped beside their table with a copy of the newspaper. “Amir's brother likes the roof best,” he reported. Sana smiled. After he left, she opened a folder for the next issue. The old photograph was still there. She kept it, but moved it out of the folder marked for printing. Owen asked what they should cover next. Sana picked up her notebook before she picked up the camera.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-photograph-we-almost-printed-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "Why did Sana think the photograph would make a good story?", "choices": ["It showed the bridge models she liked best", "It seemed to show Max angry beside Amir’s fallen tower", "It showed the winners of the design fair"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Max looked furious beside the leaning tower, so she typed a heading about a project destroyed during judging."}, {"q": "What did Sana realize about her own explanation?", "choices": ["It was the only possible answer", "It was already printed", "It was only a guess, just like the others"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "She realized that her explanation was a guess too."}, {"q": "What did Max say he was doing when the photograph was taken?", "choices": ["Telling people to move back because someone almost stepped on the roof", "Pulling the clock off the tower", "Taking his own picture of the tower"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Max said he was telling people to move back, because someone almost stepped on the roof."}, {"q": "What really made the tower fall?", "choices": ["Amir’s sleeve caught the roof when he leaned for his score sheet", "A strong wind from the window", "Max bumped the table"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Amir explained that he leaned across the table for his score sheet and his sleeve caught the roof."}, {"q": "Why had Amir rebuilt the tower after judging?", "choices": ["His teacher asked him to", "He wanted to win the prize next year", "It was a gift for his younger brother, who helped paint the windows"], "answer": 2, "evidencePage": 6, "hint": "Look at page 6.", "explain": "Amir said the tower was a gift for his younger brother, who had helped paint the windows."}], "grammar": [{"q": "‘The crop can ___ how readers understand a picture.’ Which word belongs in the blank?", "choices": ["effects", "affect", "effect"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "The sentence needs a verb meaning to change something, so it needs “affect”.", "teach": "<b>Affect</b> is usually a verb meaning to change something, but <b>effect</b> is usually a noun meaning a result.<span class='cn'><b>Affect</b> 通常是动词，表示“影响”，而 <b>effect</b> 通常是名词，表示“结果”。</span>"}, {"q": "Which sentence uses a comma correctly after the starting phrase?", "choices": ["Back at the newspaper table, Sana opened the original file.", "Back at the newspaper, table Sana opened the original file.", "Back at the newspaper table Sana, opened the original file."], "answer": 0, "evidencePage": 5, "hint": "Look at page 5.", "explain": "A comma goes after an opening phrase such as “Back at the newspaper table”.", "teach": "Put a comma after an introductory phrase, like <b>Back at the table,</b> she began to type.<span class='cn'>句子开头的引入性短语后面要加逗号，比如 <b>Back at the table,</b> she began to type。</span>"}, {"q": "‘The prize had mattered to both of them, ___ it was not the only reason they had built anything.’ Which word belongs in the blank?", "choices": ["so", "but", "or"], "answer": 1, "evidencePage": 6, "hint": "Look at page 6.", "explain": "The second part adds a different idea, so the sentence needs “but”.", "teach": "A conjunction like <b>but</b> joins two ideas that contrast with each other.<span class='cn'><b>but</b> 这样的连词用来连接两个相互对照的想法。</span>"}], "vocabulary": [{"q": "‘Enlarged’ means ___.", "choices": ["made darker", "made brighter", "made bigger"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Sana enlarged the image until the two boys filled the screen."}, {"q": "‘Cropped’ means ___.", "choices": ["colored in a picture", "cut away part of a picture", "hung up a picture"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "He pointed to a red corner at the bottom of the image. Sana had cropped that out."}, {"q": "‘Competitors’ means ___.", "choices": ["people trying to win against each other", "people who judge a contest", "people who share a project"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "She had known the boys were competitors."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(enlarged|cropped|competitors)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 5 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();setListenActive(null);page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}
function selectAnswer(i){selections[activeTab+"-"+qIndex[activeTab]]=i;renderPanel()}
function showHint(){const item=quizzes[activeTab][qIndex[activeTab]];document.getElementById("feedback").innerHTML=`💡 ${item.hint}`}
function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}var TEACH_ICONS='<svg class="ic i-spk" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.5v5h3.6l4.9 4.5V5L7.6 9.5H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.6 9.2a4 4 0 010 5.6M18.2 6.6a7.6 7.6 0 010 10.8"/></svg><svg class="ic i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></svg><svg class="ic i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 5.3v13.4c0 .8.9 1.3 1.6.8l9.6-6.7c.6-.4.6-1.2 0-1.6L9.8 4.5c-.7-.5-1.6 0-1.6.8z"/></svg>';var _tp=null;function _tpSet(b,st){if(!b)return;b.classList.toggle('is-playing',st==='playing');b.classList.toggle('is-paused',st==='paused');b.setAttribute('aria-pressed',st==='playing'?'true':'false');var z=b.dataset.part==='cn',L=st==='playing'?(z?'\u6682\u505C':'Pause'):st==='paused'?(z?'\u7EE7\u7EED\u64AD\u653E':'Resume'):b.dataset.label;b.setAttribute('aria-label',L);b.title=L;}function stopTeachAudio(){var c=_tp;if(!c)return;_tp=null;try{if(c.audio){c.audio.onended=c.audio.onerror=c.audio.ontimeupdate=null;c.audio.pause();}}catch(e){}if(c.mode==='tts'){try{speechSynthesis.cancel();}catch(e){}}_tpSet(c.btn,'idle');}function _tpFallback(btn){try{var u=new SpeechSynthesisUtterance(btn.dataset.text||'');u.lang=btn.dataset.lang||'en-US';var cur={btn:btn,mode:'tts'};_tp=cur;u.onend=u.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');}};_tpSet(btn,'playing');speechSynthesis.speak(u);}catch(e){}}function playTeachAudio(btn){if(_tp&&_tp.btn===btn){if(_tp.mode==='audio'){var a0=_tp.audio;if(a0.paused){var p0=a0.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}
function returnToQuestion(){(function(){var b=document.getElementById("evidenceBanner");if(b&&b.parentNode)b.parentNode.removeChild(b);})();renderPanel();document.querySelector(".panel").scrollIntoView({behavior:"smooth",block:"start"})}
function nextQuestion(){const list=quizzes[activeTab];if(qIndex[activeTab]<list.length-1){qIndex[activeTab]++;renderPanel();return}completed[activeTab]=true;if(activeTab==="comprehension")activeTab="grammar";else if(activeTab==="grammar")activeTab="vocabulary";else{return showCompletion()}setTabs();renderPanel()}
function showCompletion(){completed.vocabulary=true;setTabs();const correct=Object.keys(selections).filter(k=>{const [tab,idx]=k.split('-');return selections[k]===quizzes[tab][+idx].answer}).length,total=Object.values(quizzes).reduce((a,b)=>a+b.length,0);document.getElementById("stagePill").textContent="Journey Complete";document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">Reading journey complete</div><h2>Wonderful work! 🎉</h2><p class="small">You finished Reading, Grammar, and Vocabulary.</p><div class="score-row"><div class="score-box"><b>${total}</b><br><span>Questions</span></div><div class="score-box"><b>${correct}</b><br><span>Correct now</span></div></div><div class="feedback good">You used evidence, practiced sentence skills, and learned new words.</div><button class="submit" onclick="restartPractice()">Practice Again</button></div>`}
function restartPractice(){activeTab="comprehension";qIndex={comprehension:0,grammar:0,vocabulary:0};selections={};attempts={};completed={comprehension:false,grammar:false,vocabulary:false};setTabs();renderPanel()}
function saveProgress(){try{localStorage.setItem("les-the-photograph-we-almost-printed-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-photograph-we-almost-printed"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-photograph-we-almost-printed",bookTitle:"The Photograph We Almost Printed",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}
function clearHighlight(){document.querySelectorAll(".story-word.reading").forEach(x=>x.classList.remove("reading"))}
let preferredVoice=null;
