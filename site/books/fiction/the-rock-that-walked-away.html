<script>/*les-speech-shim*/
(function(){var w=window,ok=false,errs=[];

   Give such browsers a silent stand-in so the rest of the page runs normally. */
try{ok=typeof w.speechSynthesis==="object"&&w.speechSynthesis!==null}catch(e){}

if(!ok){var gen=0,told=false;

getVoices:function(){return[]},cancel:function(){gen++},pause:function(){},resume:function(){},
addEventListener:function(){},removeEventListener:function(){},
speak:function(u){var g=gen;

<script>

const pages=[{"type": "cover", "title": "The Rock That Walked Away", "subtitle": "Some Discoveries Are Better Observed Than Collected", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-rock-that-walked-away-assets/cover.jpg"}, {"text": "1. An Empty Space\nKian's class display already had a piece of a meteorite and a photograph of a distant moon. It did not have anything from Fern. That was the survey team's nickname for the little planet his mother's ship was visiting. Kian had brought a white sample box with a blue clasp. He liked the sound it made when it snapped shut. He liked imagining everyone leaning over whatever he brought home.\nMom checked his helmet before they left the ship. \"You may observe beside me on the marked route,\" she said. \"No collecting unless the survey team approves it.\" Kian nodded. He tucked the empty box into his bag. There would be plenty of time to ask about one small stone.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-rock-that-walked-away-assets/page1.jpg"}, {"text": "2. The Blue One\nOutside, low purple leaves curled above the silver ground. Small route markers led toward the observation shelter. Kian stayed beside Mom, trying to look everywhere at once. Most of the stones were gray. One was blue, with a thin silver line running across its top. It rested beside a flat rock near the path. Nothing in the class display looked like it.\n\"Could that be my sample?\" he asked. Mom crouched several steps away and used her camera. \"We'll record it first.\" Kian opened his drawing pad. He drew the blue oval and the flat rock beside it. By the time he looked up again, the blue oval was farther from the rock. He frowned at his drawing.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-rock-that-walked-away-assets/page2.jpg"}, {"text": "3. A Very Small Journey\nKian blamed the angle. He moved his head to the left, then to the right. The blue shape remained in its new place. Behind it ran two faint lines in the dust. \"Mom,\" he whispered. \"I think my rock moved.\" She lowered the camera. Together, they watched without stepping closer. For a while, nothing happened. Kian's knees began to ache from crouching.\nThen four little feet unfolded beneath the blue shell. They were pale purple, almost the color of the leaves. The creature lifted itself and walked into a patch of shade. Kian forgot about his knees. \"Definitely moved,\" he said. Mom took another picture. He drew four feet beneath his first blue oval, then crossed them out. They hadn't been visible at first. His second drawing would show them.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-rock-that-walked-away-assets/page3.jpg"}, {"text": "4. Not a Collection\nKian touched the blue clasp through the cloth of his bag. \"So I can't bring it back.\" It wasn't really a question. Mom shook her head. \"We don't even know what it needs to live.\" Under the leaf, the creature stopped beside a smaller blue shape. Kian watched that one carefully. After a moment, two tiny eyes appeared near the ground.\nHe wanted to say they were a family. Instead, he wrote that two creatures were resting together. That was what he could actually see. Mom read his note and nodded. The first creature moved farther under the leaf. Along its edge were several pale, curved marks. \"Are those bites?\" Kian asked. Mom raised the camera again. \"Let's see what happens.\"", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-rock-that-walked-away-assets/page4.jpg"}, {"text": "5. What the Pictures Missed\nThe larger creature pressed close to the leaf. When it moved away, a fresh pale mark showed along the edge. Kian drew that beside the older marks. He added an arrow to show which way the creature had moved. One picture could make it look like a rock again. His drawings, in order, showed something different. He began numbering them carefully.\nThey stayed until Mom's timer signaled that it was time to return. Kian had filled three pages. His pencil was blunt now, and he had to press harder to make clear lines. At the shelter, Mom sent their observations to the team. Kian asked whether anyone had seen blue shells before. No one at the shelter had. His empty box felt lighter on the walk back.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-rock-that-walked-away-assets/page5.jpg"}, {"text": "6. The Box on the Table\nBack aboard the ship, Kian set the white box on the worktable. He opened it, closed it, and opened it again. Mom was sorting the photographs. \"You sound busy,\" she said. He told her about the class display. A photograph was good, but there were already photographs. He had wanted something everyone could look at from all sides.\nMom turned the screen toward him. In the first image, the blue shell sat beside the flat rock. In the next, it stood on four feet. \"What could someone learn from these that a shell in a box wouldn't show?\" she asked. Kian spread out his drawings. He moved the resting pair after the walking picture. Then he added the leaf with its fresh mark. \"They'd need to see them in order.\"", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-rock-that-walked-away-assets/page6.jpg"}, {"text": "7. Something to Look For\nWhen Kian returned to school, he placed the empty box beside a row of photographs and drawings. At first, his classmates leaned over the box. Then they leaned over the pictures. One child spotted the tracks before the feet appeared. Another noticed the marks on the leaf. They asked what the creatures ate and whether the smaller one was young. Kian wrote those questions down. He didn't know the answers yet.\nSomeone asked why the box was empty. Kian pointed to the final photograph, where the two blue shells rested in the shade. \"Because they're still there,\" he said. He had imagined bringing back one thing that everyone could examine. Instead, his classmates kept moving between the pictures, looking again. Kian found room at the end of his notes for one more question.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-rock-that-walked-away-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did Kian hope to bring back for his class display?", "choices": ["A piece of a meteorite", "A small sample from the planet Fern", "A photograph of a moon"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Kian had brought an empty sample box and expected to find one small stone."}, {"q": "What did Kian notice about the blue stone?", "choices": ["It was glowing", "It was farther from the flat rock than before", "It was bigger"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "By the time he looked up again, the blue oval was farther from the rock."}, {"q": "What appeared beneath the blue shell?", "choices": ["A silver line", "Four little pale purple feet", "Two bright eyes"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Four little feet unfolded beneath the blue shell, pale purple like the leaves."}, {"q": "Why could Kian not bring the creature back?", "choices": ["They did not know what it needed to live", "It was too heavy to carry", "The box was too small"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Mom said, “We don’t even know what it needs to live.”"}, {"q": "Why was Kian’s box empty at school?", "choices": ["The creatures were still there, so he left them", "His mother kept the sample", "He forgot to fill it"], "answer": 0, "evidencePage": 7, "hint": "Look at the last page.", "explain": "He pointed to the last photograph and said, “Because they’re still there.”"}], "grammar": [{"q": "Which sentence is capitalized correctly?", "choices": ["kian’s mother visited the Planet fern.", "Kian’s Mother visited the planet fern.", "Kian’s mother visited the planet Fern."], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Names of people and places, like Kian and Fern, start with capital letters.", "teach": "Capitalize the names of people and places, like <b>Kian</b> and <b>Fern</b>.<span class='cn'>人名和地名要大写首字母，比如 <b>Kian</b> 和 <b>Fern</b>。</span>"}, {"q": "‘The creatures ___ in the shade.’ Which verb matches the subject?", "choices": ["resting", "rests", "rest"], "answer": 2, "evidencePage": 4, "hint": "Look at page 4.", "explain": "The subject “creatures” is plural, so the verb is “rest”.", "teach": "A verb must match its subject, so use <b>rest</b> with a plural subject like <b>creatures</b>.<span class='cn'>动词要和主语保持一致，复数主语比如 <b>creatures</b> 要用 <b>rest</b>。</span>"}, {"q": "‘Then four little feet unfolded beneath the blue shell.’ What does the word ‘then’ tell?", "choices": ["Where it happened", "What happened next", "Why it happened"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "The word “then” shows the order of events.", "teach": "Words like <b>then</b>, <b>first</b>, and <b>next</b> show the order in which things happen.<span class='cn'><b>then</b>、<b>first</b> 和 <b>next</b> 这样的词表示事情发生的先后顺序。</span>"}], "vocabulary": [{"q": "‘Observe’ means ___.", "choices": ["to watch carefully", "to build quickly", "to take away"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "“You may observe beside me on the marked route,” she said."}, {"q": "‘Survey’ means ___.", "choices": ["a type of tool", "a kind of snack", "a careful study of a place or group"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Fern was the survey team’s nickname for the little planet."}, {"q": "‘Blunt’ means ___.", "choices": ["not sharp", "very bright", "easy to break"], "answer": 0, "evidencePage": 5, "hint": "Look at page 5.", "explain": "His pencil was blunt now, and he had to press harder to make clear lines."}]};

.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[ke
