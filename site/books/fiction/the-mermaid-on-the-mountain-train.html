<script>/*les-speech-shim*/
(function(){var w=window,ok=false,errs=[];
/* Some Android in-app browsers (UC/Quark and other vendor kernels, older WebViews) have no
   speechSynthesis at all. The page script calls it while loading, so it stopped there and the
   story was never drawn (the quiz still worked because its handlers were bound earlier).
   Give such browsers a silent stand-in so the rest of the page runs normally. */
try{ok=typeof w.speechSynthesis==="object"&&w.speechSynthesis!==null}catch(e){}
if(typeof w.SpeechSynthesisUtterance!=="function"&&typeof w.SpeechSynthesisUtterance!=="object"){
w.SpeechSynthesisUtterance=function(t){this.text=t==null?"":String(t);this.lang="";this.rate=1;this.pitch=1;this.volume=1;this.voice=null}}
if(!ok){var gen=0,told=false;
w.speechSynthesis={speaking:false,paused:false,pending:false,
getVoices:function(){return[]},cancel:function(){gen++},pause:function(){},resume:function(){},
addEventListener:function(){},removeEventListener:function(){},
speak:function(u){var g=gen;
if(!told&&typeof w.setStatus==="function"){told=true;try{w.setStatus("This browser can't read aloud, but you can still read and practice. 当前浏览器不支持朗读，仍可阅读和做题。",false)}catch(e){}}
setTimeout(function(){if(g===gen&&u&&u.onstart){try{u.onstart({})}catch(e){}}},0);

<script>

const pages=[{"type": "cover", "title": "The Mermaid on the Mountain Train", "subtitle": "A Helpful Girl at a Train Station Learns to Ask What a Mermaid Traveler Wants Instead of Telling Her Where to Go", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-mermaid-on-the-mountain-train-assets/cover.jpg"}, {"text": "1. The Wrong Platform\nAda spotted the mermaid beside the station clock, studying a schedule through round spectacles. The traveler sat in a copper bath on wheels. A blue tail stirred the water below her shawl, and a folded blanket rested across the bath's high rim. Ada had promised her uncle, the station porter, that she would direct visitors while he helped with the morning baggage. Here, surely, was someone who needed directing.\n“The coast train leaves from platform two,” Ada said. The mermaid lowered her schedule. “How useful to know.” Ada pointed out the broad passage to the seaside platforms and explained that the next train stopped at every harbor. “I'm Mrs. Vale,” the traveler said. “And I'm looking for the mountain train.” Ada glanced at the rain streaming down the windows. Beyond the station, the hills had disappeared into cloud. Perhaps Mrs. Vale had misread the schedule.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-mermaid-on-the-mountain-train-assets/page1.jpg"}, {"text": "2. A Better Suggestion\nAda fetched a large route map from the counter. She showed Mrs. Vale the blue coast line, which followed the water all the way to Bell Harbor. It was beautiful there. Ada had collected shells on its beach last summer. The mermaid listened, then tapped the brown line that climbed toward High Tor. “This one,” she said. Ada began explaining the fog. She had lived under those hills all her life and knew how easily a view could vanish.\n“I used to travel to Bell Harbor every spring,” Mrs. Vale told her. “I know exactly how the beach looks.” She took a ticket from her purse. It was already printed for High Tor. Ada felt the beginnings of irritation. If the traveler had a ticket, why had she been standing beside the clock looking confused? “I know where I want to go,” Mrs. Vale said. “I was trying to find out which platform would take me there.”", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-mermaid-on-the-mountain-train-assets/page2.jpg"}, {"text": "3. The Ramp\nPlatform six had a level boarding door, but its usual approach was closed for repairs. A sign sent passengers through a side passage. Ada had walked past it all week without noticing that the passage ended in steps. Her uncle arrived with a cart just as she was about to suggest carrying the bath. “Please don't,” Mrs. Vale said. “I'm rather fond of staying inside it.” Ada stopped speaking.\nHer uncle checked the station plan. The old parcels ramp still led to platform six, and it was open to travelers who needed it. He offered to guide them. Ada walked ahead to check the route, then came back. “The ramp is clear,” she reported. “Would you like me to push?” Mrs. Vale considered the gentle slope. “Alongside will do. I can manage the wheels.” Ada put her hands in her pockets and matched the traveler's pace.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-mermaid-on-the-mountain-train-assets/page3.jpg"}, {"text": "4. Beyond the Window\nMrs. Vale's ticket included the wide space beside a train window. The platform met the doorway at the same height, and the conductor checked the small boarding plate before she rolled across. Ada had permission to ride as far as the next stop, where her aunt would meet her. Her uncle asked her to bring back a parcel from the bakery there. She sat across from Mrs. Vale as the station roofs slid away.\nFor a while, they watched rain drag crooked lines over the glass. Ada expected the mermaid to mention the sea, but she asked about sheep, stone walls, and the tiny houses tucked into the hillside. Ada answered what she could. When she didn't know why a tower stood alone in a field, she said so. Mrs. Vale looked delighted anyway. “It looks like a place that has misplaced its castle,” she said. Ada had never thought to wonder about that tower.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-mermaid-on-the-mountain-train-assets/page4.jpg"}, {"text": "5. What Was Missing\nAbove the next valley, the clouds thickened until the window showed little but gray. Ada felt the old urge to recommend a different journey. Instead, she asked what had made Mrs. Vale choose High Tor. The traveler took a small photograph from her purse. It showed a dark-haired mermaid in a traveling bath beside a stone marker, with hills rolling away behind her. “My sister,” she said. “She used to send me a picture from every journey.”\n“Did you want to see what she saw?” Ada asked. Mrs. Vale shook her head. “At first. But her photograph is forty years old. The trees will be different. I shall be different. I want a journey I haven't already heard about.” She put the photograph away before Ada could ask another question. Outside, the gray thinned briefly around a ridge. Mrs. Vale leaned toward the window, and Ada turned to look instead of trying to fill the silence.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-mermaid-on-the-mountain-train-assets/page5.jpg"}, {"text": "6. Ada Gets Off\nAt Ashcombe, Ada's aunt was waiting under a striped umbrella. Ada gathered her bag, then hesitated. The train would climb for another hour. High Tor might be hidden completely, and Mrs. Vale would have paid for a journey with no grand view at the end. “I hope it clears,” Ada said. “So do I,” the mermaid replied. “But I bought a train ticket. I don't believe the clouds signed an agreement.”\nAda laughed. She nearly offered one last suggestion about the return trip, then asked whether Mrs. Vale wanted help finding the station tea room at High Tor. “That would be useful.” Ada described the blue door her aunt had mentioned and admitted that she had never visited it herself. Mrs. Vale thanked her. Through the window, Ada watched the copper bath move away with the train. The traveler had a mountain ticket, a purse full of her own reasons, and no need for Ada to approve them.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-mermaid-on-the-mountain-train-assets/page6.jpg"}, {"text": "7. A Postcard from High Tor\nThe postcard arrived at the station a week later. On its front, a painter had filled the hills with purple heather beneath a brilliant sky. On the back, Mrs. Vale reported that she had seen mostly fog. She had also discovered a tea room with excellent ginger cake and met a boy who claimed he could recognize his sheep by their complaints. She planned to return in spring, when the view might be different.\nAda put the postcard beside the station map. That afternoon, a traveler with a fishing rod asked her about trains. She nearly directed him toward Bell Harbor, then stopped. “Where would you like to go?” The man named an inland lake she had never heard of. Ada found it on the map with him. Above the rooftops, the hills were clear for once. She could see High Tor from the doorway, but that was not the same as having been there.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-mermaid-on-the-mountain-train-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did Ada first assume about Mrs. Vale?", "choices": ["That she was the station porter", "That she was a famous painter", "That she was lost and needed directions to the coast train"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Ada told her the coast train leaves from platform two, as if she needed directing."}, {"q": "What did Mrs. Vale say about her ticket?", "choices": ["She already had a ticket for High Tor and was trying to find the right platform", "She had lost her ticket", "She wanted to change to the coast train"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "She took a ticket from her purse that was already printed for High Tor."}, {"q": "What did Mrs. Vale say when Ada offered to push the bath?", "choices": ["That Ada should carry the bath", "That walking alongside would do, because she could manage the wheels", "That she wanted to stay on the platform"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "She said, “Alongside will do. I can manage the wheels.”"}, {"q": "Why had Mrs. Vale chosen High Tor?", "choices": ["It was the nearest stop", "She had never seen the sea", "Her sister’s photograph was forty years old, and she wanted a journey she had not already heard about"], "answer": 2, "evidencePage": 5, "hint": "Look at page 5.", "explain": "She wanted a journey she had not already heard about."}, {"q": "What did the postcard say?", "choices": ["The mountain was perfectly clear", "She saw mostly fog, found a tea room with excellent ginger cake, and planned to return in spring", "She had gone back to the coast"], "answer": 1, "evidencePage": 7, "hint": "Look at page 7.", "explain": "Mrs. Vale reported that she had seen mostly fog and planned to return in spring."}], "grammar": [{"q": "‘Ada saw one sheep, and then ten ___.’ Which word belongs in the blank?", "choices": ["sheeps", "sheepes", "sheep"], "answer": 2, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Sheep stays the same in the singular and the plural.", "teach": "Some nouns, like <b>sheep</b>, stay the same in the singular and the plural.<span class='cn'>有些名词，比如 <b>sheep</b>，单数和复数形式相同。</span>"}, {"q": "The Latin root ‘port’ means ‘carry’. What does a ‘porter’ most likely do?", "choices": ["Carries bags", "Plays music", "Paints pictures"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "A porter carries bags and baggage at a station.", "teach": "The Latin root <b>port</b> means carry, so a <b>porter</b> carries bags.<span class='cn'>拉丁词根 <b>port</b> 表示“搬运”，所以 <b>porter</b>（搬运工）就是搬行李的人。</span>"}, {"q": "‘I don’t believe the clouds signed an agreement.’ What does this joke show about Mrs. Vale?", "choices": ["She accepts that the clouds may stay and enjoys the trip anyway", "She is angry at the clouds", "She is afraid of the mountain"], "answer": 0, "evidencePage": 6, "hint": "Look at page 6.", "explain": "She jokes that clouds cannot promise a clear view, so she is relaxed about it.", "teach": "A character’s <b>joke</b> can show what they are like, as Mrs. Vale’s joke about <b>clouds signing an agreement</b> shows she is relaxed.<span class='cn'>角色的玩笑能展示性格，比如 Vale 夫人开玩笑说云 <b>signed an agreement</b>（签了协议），说明她心态轻松。</span>"}], "vocabulary": [{"q": "‘Irritation’ means ___.", "choices": ["a feeling of being sleepy", "a feeling of being annoyed", "a feeling of great joy"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Ada felt the beginnings of irritation."}, {"q": "‘Delighted’ means ___.", "choices": ["very pleased", "very tired", "very worried"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Mrs. Vale looked delighted anyway."}, {"q": "‘Approve’ means ___.", "choices": ["to hide something", "to think something is good or right", "to forget about something"], "answer": 1, "evidencePage": 6, "hint": "Look at page 6.", "explain": "The traveler had no need for Ada to approve them."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(irritation|delighted|approve)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 6 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}var TEACH_ICONS='<svg class="ic i-spk" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.5v5h3.6l4.9 4.5V5L7.6 9.5H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.6 9.2a4 4 0 010 5.6M18.2 6.6a7.6 7.6 0 010 10.8"/></svg><svg class="ic i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></svg><svg class="ic i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 5.3v13.4c0 .8.9 1.3 1.6.8l9.6-6.7c.6-.4.6-1.2 0-1.6L9.8 4.5c-.7-.5-1.6 0-1.6.8z"/></svg>';var _tp=null;function _tpSet(b,st){if(!b)return;b.classList.toggle('is-playing',st==='playing');b.classList.toggle('is-paused',st==='paused');b.setAttribute('aria-pressed',st==='playing'?'true':'false');var z=b.dataset.part==='cn',L=st==='playing'?(z?'\u6682\u505C':'Pause'):st==='paused'?(z?'\u7EE7\u7EED\u64AD\u653E':'Resume'):b.dataset.label;b.setAttribute('aria-label',L);b.title=L;}function stopTeachAudio(){var c=_tp;if(!c)return;_tp=null;try{if(c.audio){c.audio.onended=c.audio.onerror=c.audio.ontimeupdate=null;c.audio.pause();}}catch(e){}if(c.mode==='tts'){try{speechSynthesis.cancel();}catch(e){}}_tpSet(c.btn,'idle');}function _tpFallback(btn){try{var u=new SpeechSynthesisUtterance(btn.dataset.text||'');u.lang=btn.dataset.lang||'en-US';var cur={btn:btn,mode:'tts'};_tp=cur;u.onend=u.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');}};_tpSet(btn,'playing');speechSynthesis.speak(u);}catch(e){}}function playTeachAudio(btn){if(_tp&&_tp.btn===btn){if(_tp.mode==='audio'){var a0=_tp.audio;if(a0.paused){var p0=a0.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}

function saveProgress(){try{localStorage.setItem("les-the-mermaid-on-the-mountain-train-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-mermaid-on-the-mountain-train"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-mermaid-on-the-mountain-train",bookTitle:"The Mermaid on the Mountain Train",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}
function clearHighlight(){document.querySelectorAll(".story-word.reading").forEach(x=>x.classList.remove("reading"))}
let preferredVoice=null;
