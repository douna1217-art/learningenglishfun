<script>/*les-speech-shim*/
(function(){var w=window,ok=false,errs=[];
/* Some Android in-app browsers (UC/Quark and other vendor kernels, older WebViews) have no
   speechSynthesis at all. The page script calls it while loading, so it stopped there and the
   story was never drawn (the quiz still worked because its handlers were bound earlier).
   Give such browsers a silent stand-in so the rest of the page runs normally. */
try{ok=typeof w.speechSynthesis==="object"&&w.speechSynthesis!==null}catch(e){}
if(typeof w.SpeechSynthesisUtterance!=="function"&&typeof w.SpeechSynthesisUtterance!=="object"){
w.SpeechSynthesisUtterance=function(t){this.text=t==null?"":String(t);this.lang="";this.rate=1;this.pitch=1;this.volume=1;this.voice=null}}
if(!ok){var gen=0,told=false;
w.speechSynthesis={speaking:false,paused:false,pending:false,
getVoices:function(){return[]},cancel:function(){gen++},pause:function(){},resume:function(){},
addEventListener:function(){},removeEventListener:function(){},
speak:function(u){var g=gen;
if(!told&&typeof w.setStatus==="function"){told=true;try{w.setStatus("This browser can't read aloud, but you can still read and practice. 当前浏览器不支持朗读，仍可阅读和做题。",false)}catch(e){}}
setTimeout(function(){if(g===gen&&u&&u.onstart){try{u.onstart({})}catch(e){}}},0);
setTimeout(function(){if(g===gen&&u&&u.onend){try{u.onend({})}catch(e){}}},Math.max(600,String(u&&u.text||"").length*60))}}}
/* If the story still is not drawn after loading, say why on the page itself, so a screenshot
   from a phone we cannot test on shows the cause. */
w.addEventListener("error",function(e){try{if(errs.length<3)errs.push(String(e&&e.message||e))}catch(x){}});
w.addEventListener("load",function(){try{var v=document.getElementById("pageView");
if(v&&!v.firstChild&&errs.length){var d=document.createElement("div"),s=document.createElement("small");
d.style.cssText="padding:24px;color:#b91c1c;font:15px/1.6 sans-serif";
d.appendChild(document.createTextNode("The story could not be shown in this browser. 此浏览器暂时无法显示故事。"));
d.appendChild(document.createElement("br"));s.textContent=errs.join(" | ");d.appendChild(s);v.appendChild(d)}}catch(x){}});
})();

<script>

const pages=[{"type": "cover", "title": "The Baker of Borrowed Dreams", "subtitle": "A Boy Borrows a Perfect Hero Dream and Discovers That a Lopsided Roll Holds a Better Story", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-baker-of-borrowed-dreams-assets/cover.jpg"}, {"text": "1. Bread for the Night\nThe bakery opened when the other shops closed. By then, Mrs. Brindle had filled her window with round buns, each marked by a swirl of blue sugar. People bought them for the dreams tucked inside. A single bite, eaten just before bed, borrowed someone else's adventure for one night. The dream would leave by morning. Nobody lost a memory, and nobody could order a particular ending. Mrs. Brindle made that clear to every customer.\nPip had saved enough for one bun. Lately his own dreams had been mostly about looking for socks, which seemed a poor use of a whole night. He wanted something magnificent. Mrs. Brindle offered a dream about sailing through clouds, but Pip pointed to a jar shimmering gold. Inside it, a tiny castle turned slowly in the mist. “That's a popular one,” she said. “The dreamer gets to be a hero.”", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-baker-of-borrowed-dreams-assets/page1.jpg"}, {"text": "2. A Hero on Schedule\nThat night, Pip ate one bite, set the remaining bread on his bedside plate, and fell asleep. He woke inside the dream wearing a silver cloak over his ordinary clothes. A crowd cheered from a castle courtyard. A messenger announced that a dragon had taken the royal crown, and only Pip could fetch it. Everyone seemed delighted by this news except Pip, who hadn't yet worked out where the dragon lived.\nFortunately, a shining path appeared beneath his feet. It led him through a forest where every branch moved aside before he reached it. When he came to a locked gate, a key landed neatly in his palm. At first he enjoyed how well everything went. Then he noticed that he hadn't made a single decision. Even the speech he gave at the gate seemed to arrive in his mouth already finished.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-baker-of-borrowed-dreams-assets/page2.jpg"}, {"text": "3. The Door Beside the Path\nBeyond the gate, the golden path climbed toward the dragon's mountain. Beside it stood a small blue door with no house attached. Someone was knocking from the other side. Pip stopped. The messenger, who had somehow appeared again, reminded him that the crown was waiting. Pip asked who was behind the door. The messenger blinked, as though nobody had ever asked him anything that wasn't about the crown.\nPip reached for the blue handle. His hand passed through it like light through a curtain. The knocking continued. He could open the locked gate, climb the mountain, and speak in perfect speeches, but he couldn't investigate a door that interested him. “That isn't part of this dream,” the messenger said. Pip followed the golden path, although he kept turning to look back. The cheering suddenly felt much farther away.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-baker-of-borrowed-dreams-assets/page3.jpg"}, {"text": "4. The Prize at the End\nAt the mountain, the dragon was asleep beside a crown on a velvet cushion. Pip stepped forward. The dragon opened one eye, yawned politely, and rolled away from the cushion. There was no chase, no argument, and no need to be particularly brave. Pip carried the crown downhill. The crowd cheered exactly as loudly as before. Someone put a medal around his neck. It was very large and surprisingly light.\nWhen he woke, Pip remembered the medal less clearly than the blue door. He wondered whether a person, an animal, or another door had been knocking. At breakfast he tried to describe his adventure to his father. He got as far as the key before he stopped. “Did you like being the hero?” his father asked. Pip considered this. He had liked being expected. He wasn't sure he had liked being unnecessary.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-baker-of-borrowed-dreams-assets/page4.jpg"}, {"text": "5. An Unfinished Request\nThat evening Pip returned to the bakery with the uneaten part of his bun. He asked whether he could trade the remaining dream for whatever lay behind the blue door. Mrs. Brindle shook her head. She could bake a borrowed dream into bread, but she couldn't add a room to someone else's sleeping imagination. The door might have meant something to its original dreamer. To Pip it would remain a door.\n“Perhaps you have something less arranged,” he said. Mrs. Brindle opened a cupboard of ordinary flour. This wasn't an ingredient for dream bread. It was what she used for her own supper rolls. She set a lump of plain dough on a board and invited him to shape one. Pip made a spiral, pressed it flat, and tried again. When she asked what it would be, he said he didn't know yet.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-baker-of-borrowed-dreams-assets/page5.jpg"}, {"text": "6. The Lopsided Boat\nPip pulled up two sides of the dough until it resembled a boat. One end sagged. Mrs. Brindle offered to smooth it, but Pip wanted to see whether it would survive the oven that way. While she baked it, he told her about a boat that could travel under a town without getting wet. He hadn't decided who sailed it. A mouse seemed possible. So did a very small, very annoyed captain.\nMrs. Brindle used thick oven mitts to set the hot tray on a rack. Pip waited until the roll cooled before she wrapped it. Its sagging end had risen into a crooked prow. She charged him for an ordinary supper roll, which cost far less than a borrowed adventure. Pip carried it home in a paper bag. He kept thinking about the captain, especially why such a small person might be so annoyed.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-baker-of-borrowed-dreams-assets/page6.jpg"}, {"text": "7. A Captain of His Own\nThat night Pip ate the ordinary roll with soup. He left the dream bread in its paper wrapping. Before sleep, he imagined the little captain complaining that somebody had parked a mountain in the harbor. Pip hadn't planned a mountain. He wasn't even certain that his boat had a harbor. Nevertheless, he liked the captain's complaint enough to keep thinking about it until the room grew soft around him.\nIn the morning, he remembered a wooden spoon, an enormous cabbage, and the sound of someone laughing below deck. He couldn't put them in order. There had been no cheering crowd and no medal. At the bakery window that evening, Mrs. Brindle asked whether his new dream had a satisfying ending. Pip grinned. “I woke up before I found out.” He bought an ordinary roll and asked her to leave the shape to him.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-baker-of-borrowed-dreams-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What was special about Mrs. Brindle’s buns?", "choices": ["They never went stale", "Each one held someone else’s dream, which you borrowed for one night", "They could fly"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "A single bite just before bed borrowed someone else’s adventure for one night."}, {"q": "What felt strange to Pip about his hero dream?", "choices": ["Everything went perfectly, and he never made a decision", "It was too scary", "It lasted a whole week"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "He noticed that he hadn’t made a single decision, and even his speech arrived already finished."}, {"q": "What did Pip notice beside the golden path?", "choices": ["A hidden treasure chest", "A second dragon", "A small blue door with no house, and someone knocking from the other side"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "A small blue door with no house attached stood beside the path, and someone was knocking."}, {"q": "How did Pip feel about being the hero?", "choices": ["He wanted to be a dragon", "He liked being expected, but wasn’t sure he liked being unnecessary", "He loved every minute"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "He had liked being expected. He wasn’t sure he had liked being unnecessary."}, {"q": "What did Pip make from the plain dough?", "choices": ["A lopsided boat, and he imagined a small annoyed captain", "A castle with a dragon", "A perfect round bun"], "answer": 0, "evidencePage": 6, "hint": "Look at page 6.", "explain": "He pulled up two sides until it resembled a boat, and imagined a very small, very annoyed captain."}], "grammar": [{"q": "The prefix ‘sub-’ means ‘under’. Which word has the same prefix?", "choices": ["submarine", "summer", "supper"], "answer": 0, "evidencePage": 6, "hint": "Look at page 6.", "explain": "A submarine travels under the water.", "teach": "The prefix <b>sub</b> means under, like <b>submarine</b> and <b>subway</b>.<span class='cn'>前缀 <b>sub</b> 表示“在……下面”，比如 <b>submarine</b>（潜水艇）和 <b>subway</b>（地铁）。</span>"}, {"q": "Which phrase shows an adventure that belongs to someone else?", "choices": ["someones else adventure", "someone else’s adventure", "someone’s else adventure"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "When a word like “else” follows someone, the apostrophe and s go on “else”.", "teach": "With words like <b>someone else</b>, add <b>’s</b> to the last word, like <b>someone else’s adventure</b>.<span class='cn'>遇到 <b>someone else</b> 这样的词组，把 <b>’s</b> 加在最后一个词上，比如 <b>someone else’s adventure</b>。</span>"}, {"q": "Which sentence compares two actions correctly?", "choices": ["Pip remembered the door most clearly than the medal.", "Pip remembered the door more clear than the medal.", "Pip remembered the door more clearly than the medal."], "answer": 2, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Use “more clearly than” to compare how two things were remembered.", "teach": "Use <b>more</b> plus an adverb and <b>than</b> to compare actions, like <b>more clearly than</b>.<span class='cn'>比较两个动作时用 <b>more</b> 加副词再加 <b>than</b>，比如 <b>more clearly than</b>。</span>"}], "vocabulary": [{"q": "‘Borrowed’ means ___.", "choices": ["given away for free", "bought and kept forever", "taken for a short time and not kept"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "A single bite borrowed someone else’s adventure for one night."}, {"q": "‘Magnificent’ means ___.", "choices": ["very grand and impressive", "small and plain", "old and broken"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "He wanted something magnificent."}, {"q": "‘Unnecessary’ means ___.", "choices": ["very important", "not needed", "easy to find"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "He wasn’t sure he had liked being unnecessary."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(borrowed|magnificent|unnecessary)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 5 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}var TEACH_ICONS='<svg class="ic i-spk" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.5v5h3.6l4.9 4.5V5L7.6 9.5H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.6 9.2a4 4 0 010 5.6M18.2 6.6a7.6 7.6 0 010 10.8"/></svg><svg class="ic i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></svg><svg class="ic i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 5.3v13.4c0 .8.9 1.3 1.6.8l9.6-6.7c.6-.4.6-1.2 0-1.6L9.8 4.5c-.7-.5-1.6 0-1.6.8z"/></svg>';var _tp=null;function _tpSet(b,st){if(!b)return;b.classList.toggle('is-playing',st==='playing');b.classList.toggle('is-paused',st==='paused');b.setAttribute('aria-pressed',st==='playing'?'true':'false');var z=b.dataset.part==='cn',L=st==='playing'?(z?'\u6682\u505C':'Pause'):st==='paused'?(z?'\u7EE7\u7EED\u64AD\u653E':'Resume'):b.dataset.label;b.setAttribute('aria-label',L);b.title=L;}function stopTeachAudio(){var c=_tp;if(!c)return;_tp=null;try{if(c.audio){c.audio.onended=c.audio.onerror=c.audio.ontimeupdate=null;c.audio.pause();}}catch(e){}if(c.mode==='tts'){try{speechSynthesis.cancel();}catch(e){}}_tpSet(c.btn,'idle');}function _tpFallback(btn){try{var u=new SpeechSynthesisUtterance(btn.dataset.text||'');u.lang=btn.dataset.lang||'en-US';var cur={btn:btn,mode:'tts'};_tp=cur;u.onend=u.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');}};_tpSet(btn,'playing');speechSynthesis.speak(u);}catch(e){}}function playTeachAudio(btn){if(_tp&&_tp.btn===btn){if(_tp.mode==='audio'){var a0=_tp.audio;if(a0.paused){var p0=a0.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}
function returnToQuestion(){(function(){var b=document.getElementById("evidenceBanner");if(b&&b.parentNode)b.parentNode.removeChild(b);})();renderPanel();document.querySelector(".panel").scrollIntoView({behavior:"smooth",block:"start"})}
function nextQuestion(){const list=quizzes[activeTab];if(qIndex[activeTab]<list.length-1){qIndex[activeTab]++;renderPanel();return}completed[activeTab]=true;if(activeTab==="comprehension")activeTab="grammar";else if(activeTab==="grammar")activeTab="vocabulary";else{return showCompletion()}setTabs();renderPanel()}
function showCompletion(){completed.vocabulary=true;setTabs();const correct=Object.keys(selections).filter(k=>{const [tab,idx]=k.split('-');return selections[k]===quizzes[tab][+idx].answer}).length,total=Object.values(quizzes).reduce((a,b)=>a+b.length,0);document.getElementById("stagePill").textContent="Journey Complete";document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">Reading journey complete</div><h2>Wonderful work! 🎉</h2><p class="small">You finished Reading, Grammar, and Vocabulary.</p><div class="score-row"><div class="score-box"><b>${total}</b><br><span>Questions</span></div><div class="score-box"><b>${correct}</b><br><span>Correct now</span></div></div><div class="feedback good">You used evidence, practiced sentence skills, and learned new words.</div><button class="submit" onclick="restartPractice()">Practice Again</button></div>`}

function saveProgress(){try{localStorage.setItem("les-the-baker-of-borrowed-dreams-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-baker-of-borrowed-dreams"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-baker-of-borrowed-dreams",bookTitle:"The Baker of Borrowed Dreams",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}
function clearHighlight(){document.querySelectorAll(".story-word.reading").forEach(x=>x.classList.remove("reading"))}
let preferredVoice=null;
