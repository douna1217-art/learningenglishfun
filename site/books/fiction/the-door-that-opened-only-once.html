<script>/*les-speech-shim*/
(function(){var w=window,ok=false,errs=[];
/* Some Android in-app browsers (UC/Quark and other vendor kernels, older WebViews) have no
   speechSynthesis at all. The page script calls it while loading, so it stopped there and the
   story was never drawn (the quiz still worked because its handlers were bound earlier).
   Give such browsers a silent stand-in so the rest of the page runs normally. */
try{ok=typeof w.speechSynthesis==="object"&&w.speechSynthesis!==null}catch(e){}
if(typeof w.SpeechSynthesisUtterance!=="function"&&typeof w.SpeechSynthesisUtterance!=="object"){
w.SpeechSynthesisUtterance=function(t){this.text=t==null?"":String(t);this.lang="";this.rate=1;this.pitch=1;this.volume=1;this.voice=null}}
if(!ok){var gen=0,told=false;
w.speechSynthesis={speaking:false,paused:false,pending:false,
getVoices:function(){return[]},cancel:function(){gen++},pause:function(){},resume:function(){},
addEventListener:function(){},removeEventListener:function(){},
speak:function(u){var g=gen;
if(!told&&typeof w.setStatus==="function"){told=true;try{w.setStatus("This browser can't read aloud, but you can still read and practice. 当前浏览器不支持朗读，仍可阅读和做题。",false)}catch(e){}}
setTimeout(function(){if(g===gen&&u&&u.onstart){try{u.onstart({})}catch(e){}}},0);
setTimeout(function(){if(g===gen&&u&&u.onend){try{u.onend({})}catch(e){}}},Math.max(600,String(u&&u.text||"").length*60))}}}
/* If the story still is not drawn after loading, say why on the page itself, so a screenshot
   from a phone we cannot test on shows the cause. */

<script>

const pages=[{"type": "cover", "title": "The Door That Opened Only Once", "subtitle": "A Girl Who Has Waited Years for One Journey Through a Magic Door Must Decide Whether to Give It to a Friend Far From Home", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-door-that-opened-only-once-assets/cover.jpg"}, {"text": "1. The Journey on the Wall\nMara had spent three years deciding where to go. Above her bed, she kept a drawing of the Silver City, with its narrow streets and roofs shaped like folded leaves. Travelers said two moons hung above it, and music rose through the sidewalk when it rained. Her family's blue door could take one person there and bring one person back. It would remain open for ten minutes. Afterward, it would become an ordinary door forever.\nOn her thirteenth birthday, Mara was finally old enough to choose the destination. Her mother had explained the rules so often that Mara could recite them while tying her boots. One person out. One person back. No second opening. She had packed an apple, a pencil, and a piece of paper for a sketch. Reed, who lived with the baker's family, came over to see her leave. “You really chose the Silver City,” he said. His voice sounded different from the one he used at school.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-door-that-opened-only-once-assets/page1.jpg"}, {"text": "2. The Story Mara Had Stopped Hearing\nReed had arrived in their village five years earlier, through a traveling door in his own world. He had lost his way while exploring, and the door had closed before he could find it again. The baker had taken him in. At first, Reed spoke constantly about his home. Later, he spoke less. Mara had known him for so long that she sometimes forgot there had been a time before he belonged beside her desk at school.\nHe touched the drawing on her wall. “That's the covered market,” he said. “Those roofs aren't silver all the time. Mostly they're gray.” Mara looked at his finger resting beneath the curved roof. She remembered a story about a city with two moons, told while they were building a snow fort. She had thought he was adding things to make it better. “Your home?” she asked. Reed nodded. Then he stepped away from the drawing. “Tell me if the fountain still has a crooked fish.”", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-door-that-opened-only-once-assets/page2.jpg"}, {"text": "3. The Question at the Threshold\nDownstairs, Mara's mother checked the small brass bell beside the blue door. It would ring when the ten minutes were over. Mara asked whether someone else could use her journey. Her mother set down the polishing cloth. “Yes,” she said. “But there's only one outward crossing. You can't follow, even if he returns. The door will still close when the bell rings.” Reed had stopped beside the window. He wasn't looking at either of them.\nMara wished he had asked her. Then she could have been generous or refused and known what kind of conversation they were having. Instead, the choice sat between them, with no one willing to name it. She imagined returning with a drawing of the crooked fish and handing it to him at school. She imagined how politely he would thank her. The pencil in her bag suddenly felt like a very small thing to carry across such a large distance.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-door-that-opened-only-once-assets/page3.jpg"}, {"text": "4. The City Beyond the Wood\nMara named the destination and turned the handle. The blue door opened onto a cobbled lane beneath a violet evening sky. Two moons shone above the roofs. For several seconds, she forgot every question. The air smelled of warm bread and something sharp she couldn't name. A fountain stood at the end of the lane, with a stone fish that leaned sideways. Reed made a sound so quiet she almost missed it. “That's the one,” he said.\nMara remained on the home side of the threshold. She could still take her ten minutes. Reed could watch from the doorway while she walked to the fountain. She wanted that walk with an intensity that surprised her. Then Reed said the baker had packed a message for anyone who knew his family. He touched the small satchel he always carried. Mara had thought it held school things. It seemed possible that he had been ready for much longer than she had noticed.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-door-that-opened-only-once-assets/page4.jpg"}, {"text": "5. One Person Out\n“You should go,” Mara said. Reed looked at her, then at the lane. “To the fountain?” She shook her head. “Home.” He asked whether she was certain. She wasn't certain in the comfortable way people sounded when they said yes in stories. She still wanted the streets and the music beneath them. She would want those things tomorrow too. “I'm choosing it,” she said. Her mother moved beside Reed and asked him to repeat the name of the street where his aunt had lived.\nHe answered immediately. The covered market was only around the corner. His aunt's house had a green balcony. Mara's mother gave him the baker's folded address to add to the message in his satchel. He promised to look for his family, and to return before the bell if he couldn't find anyone. Mara stood back. Reed crossed alone. The air trembled around him, then settled. He was on the cobbles. She was on the stone floor, holding the bag she had packed for herself.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-door-that-opened-only-once-assets/page5.jpg"}, {"text": "6. The Green Balcony\nReed ran around the corner. Mara watched the empty lane. Her mother did not tell her she had done the right thing, which Mara appreciated. It would have been difficult to hear while she was wondering whether she would regret giving away her only journey. A cart rattled past the fountain. Somewhere beyond the door, a woman called a name. Mara couldn't tell whether it was Reed's.\nThen he appeared at the corner with an older woman wearing a green shawl. The woman held his hand so tightly that he had to walk sideways. They stopped before the threshold. “My aunt,” Reed said. His face was wet. The woman bowed her head toward Mara's mother, then toward Mara. There wasn't time for a proper conversation. The brass bell began to move. Reed raised his free hand. Mara lifted hers. She kept it raised while the blue door swung shut between them.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-door-that-opened-only-once-assets/page6.jpg"}, {"text": "7. An Ordinary Door\nMara tried the handle once. Behind the door stood the little storage room it had always appeared to lead to. There were boots, a broom, and a jar of bent nails. She put her travel bag on a shelf and took out the apple. Upstairs, she removed the city drawing from the wall. She meant to fold it away. Instead, she sat on the floor and looked at the crooked fish, which she had drawn much too straight.\nAt school the next morning, Reed's empty desk hurt more than she had expected. The baker came to hear every detail and stayed a long time. Mara told him about the aunt's green shawl and the way Reed had lifted his hand. She could not promise a letter would find a road between their worlds. Later, she corrected the fish in her drawing and pinned it back above her bed. She still wanted to see the Silver City. Now she knew someone who lived there.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-door-that-opened-only-once-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What were the rules of the blue door?", "choices": ["It opened every night for anyone in the village", "It could take one person out and bring one person back, stayed open for ten minutes, then became an ordinary door forever", "It could be used as many times as the family liked"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "The door could take one person there and bring one person back, and it would stay open for ten minutes."}, {"q": "What did Mara realize when Reed touched her drawing?", "choices": ["The drawing was a mistake", "Reed had never seen the city", "The Silver City was Reed’s home, and his stories about two moons had been true"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Reed said the roofs were mostly gray and that the covered market was there, and Mara remembered his story about a city with two moons."}, {"q": "Why could Mara not follow Reed through the door?", "choices": ["There was only one outward crossing, and the door would close when the bell rang", "Her mother would not let her", "She had lost her boots"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Her mother said there was only one outward crossing and the door would close when the bell rang."}, {"q": "What did Mara decide at the open door?", "choices": ["She walked to the fountain herself", "She closed the door at once", "She told Reed to go home, and he crossed alone"], "answer": 2, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Mara said, “You should go,” and chose to give Reed her journey."}, {"q": "How did Mara feel about the Silver City at the end?", "choices": ["She decided it was not real", "She never wanted to think about it again", "She still wanted to see it, and now she knew someone who lived there"], "answer": 2, "evidencePage": 7, "hint": "Look at page 7.", "explain": "She corrected the crooked fish in her drawing and still wanted to see the Silver City."}], "grammar": [{"q": "Which sentence keeps the verb tense consistent?", "choices": ["Mara opens the door and stepped through.", "Mara opened the door and stepped through.", "Mara opened the door and steps through."], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Both actions happened in the past, so both verbs need the past tense.", "teach": "Keep verbs in the same tense when the actions happen at the same time, like <b>opened</b> and <b>stepped</b>.<span class='cn'>同时发生的动作，动词时态要一致，比如 <b>opened</b> 和 <b>stepped</b>。</span>"}, {"q": "‘Mara remained on the home side of the threshold.’ What is a threshold?", "choices": ["The bottom of a doorway, where you step from one place to another", "A kind of boot", "A long road"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "The clue is that the door was open and Mara stayed on the home side of it.", "teach": "You can use clues around a word, like a door and the <b>home side</b>, to work out that a <b>threshold</b> is the bottom of a doorway.<span class='cn'>可以用周围的线索，比如门和 <b>home side</b>（家这一边），推断出 <b>threshold</b> 是门口的门槛。</span>"}, {"q": "‘The choice sat between them, with no one willing to name it.’ What is the writer doing?", "choices": ["Treating the choice like a person sitting in the room to show the awkward silence", "Telling a joke", "Describing a real chair"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "The choice is described as if it could sit down, which makes the unspoken tension feel real.", "teach": "<b>Personification</b> gives human actions to an idea, like a choice that <b>sat between them</b>.<span class='cn'><b>拟人</b>是让抽象的想法做人的动作，比如选择 <b>sat between them</b>（坐在他们之间）。</span>"}], "vocabulary": [{"q": "‘Generous’ means ___.", "choices": ["willing to give to others", "afraid of being late", "very tired"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Then she could have been generous or refused."}, {"q": "‘Threshold’ means ___.", "choices": ["a type of drawing", "the bottom of a doorway", "a loud bell"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Mara remained on the home side of the threshold."}, {"q": "‘Destination’ means ___.", "choices": ["a place no one remembers", "the place someone is going to", "a map of a town"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Mara named the destination and turned the handle."}]};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(generous|threshold|destination)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 6 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}var TEACH_ICONS='<svg class="ic i-spk" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.5v5h3.6l4.9 4.5V5L7.6 9.5H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.6 9.2a4 4 0 010 5.6M18.2 6.6a7.6 7.6 0 010 10.8"/></svg><svg class="ic i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></svg><svg class="ic i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 5.3v13.4c0 .8.9 1.3 1.6.8l9.6-6.7c.6-.4.6-1.2 0-1.6L9.8 4.5c-.7-.5-1.6 0-1.6.8z"/></svg>';var _tp=null;function _tpSet(b,st){if(!b)return;b.classList.toggle('is-playing',st==='playing');b.classList.toggle('is-paused',st==='paused');b.setAttribute('aria-pressed',st==='playing'?'true':'false');var z=b.dataset.part==='cn',L=st==='playing'?(z?'\u6682\u505C':'Pause'):st==='paused'?(z?'\u7EE7\u7EED\u64AD\u653E':'Resume'):b.dataset.label;b.setAttribute('aria-label',L);b.title=L;}function stopTeachAudio(){var c=_tp;if(!c)return;_tp=null;try{if(c.audio){c.audio.onended=c.audio.onerror=c.audio.ontimeupdate=null;c.audio.pause();}}catch(e){}if(c.mode==='tts'){try{speechSynthesis.cancel();}catch(e){}}_tpSet(c.btn,'idle');}function _tpFallback(btn){try{var u=new SpeechSynthesisUtterance(btn.dataset.text||'');u.lang=btn.dataset.lang||'en-US';var cur={btn:btn,mode:'tts'};_tp=cur;u.onend=u.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');}};_tpSet(btn,'playing');speechSynthesis.speak(u);}catch(e){}}function playTeachAudio(btn){if(_tp&&_tp.btn===btn){if(_tp.mode==='audio'){var a0=_tp.audio;if(a0.paused){var p0=a0.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
