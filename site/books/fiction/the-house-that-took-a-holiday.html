<script>

const pages=[{"type": "cover", "title": "The House That Took a Vacation", "subtitle": "A Tired House Walks Out of the Cabbage Patch for a Vacation and Learns What It Misses Along the Way", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-house-that-took-a-holiday-assets/cover.jpg"}, {"text": "1. The Announcement at Breakfast\nThe house announced its vacation while Rae was spreading jam. It spoke through its blue front door, which gave every sentence a slightly annoyed creak. For seventy-three years, it said, its front windows had looked at the same cabbage patch. It had nothing against cabbages. Several had been unusually handsome. But it wanted to see something else before it became the sort of house that complained about everything.\nGran put down her cup. She asked how a house proposed to travel. Four wooden knees unfolded beneath the floor, lifting the table just enough to make Rae catch the jam jar. Gran asked it to stop until everyone was outside. The house lowered itself at once. Rae had planned to finish a model ship that morning. Instead, she carried breakfast into the garden and waited to hear where her home intended to go.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-house-that-took-a-holiday-assets/page1.jpg"}, {"text": "2. A View Worth Walking Toward\nThe house wanted the sea. Rae explained that the sea was beyond two towns, a narrow bridge, and a road crowded with delivery carts. The house said it could walk around the towns. Gran asked whether it could walk around the bridge as well. No answer came for several seconds. Rae spread a map on the garden table. Beyond the village common lay a broad meadow and a low hill.\nFrom the hill, she thought, the house could see fields it had never seen before. The whole route crossed open grass. No bridge, busy road, or narrow gate stood in the way. Gran walked it first while Rae stayed with the house. When she returned, she said the ground was dry and the route clear. The house agreed to the hill, though it described this as a small beginning to a large vacation.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-house-that-took-a-holiday-assets/page2.jpg"}, {"text": "3. The Cabbages Move Away\nWhen all the dishes were packed into a basket, Gran closed the front door. The house waited until they had moved well clear. Then it raised itself on its four stout legs. A cupboard rattled inside. Rae asked whether it had secured the plates. The house replied that it had been keeping plates safe much longer than she had. A moment later, it admitted that the sugar bowl had needed another look.\nThey crossed the common slowly. Gran and Rae walked well to one side, away from the wooden feet. The cabbage patch grew smaller behind them. At first the house commented on everything, from the smell of grass, the size of the sky, the number of things that were not cabbages. Then it became quiet. Rae thought it was enjoying the journey. Only when they stopped did she notice that the blue door was trembling.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-house-that-took-a-holiday-assets/page3.jpg"}, {"text": "4. The Trouble With Being Away\nThe house said the hill looked farther away than it had from the garden. Rae pointed out that they had already crossed half the meadow. That did not seem to help. The house wondered whether anyone would know where to find it. Gran said they had left a note at the old garden gate. The house wondered whether the cabbages would manage without its shade. Rae said cabbages were used to the sun.\nShe was about to remind it that the vacation had been its own idea when Gran sat on the grass. Rae sat beside her. They were well clear of the house, which lowered its wooden knees and stood still. Gran asked what it missed. The blue door creaked. The house missed knowing where everything was, it said. Rae looked toward the unfinished model ship she could not see. She understood that answer better than she expected.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-house-that-took-a-holiday-assets/page4.jpg"}, {"text": "5. The Shape of the Journey\nRae had pictured a brave house marching straight to a splendid view. She had not imagined stopping in the middle of a perfectly ordinary meadow to discuss cabbages. She asked whether the house wanted to go home. It said perhaps. Then it asked whether the hill would still be there tomorrow. Gran said it probably would, but that they would have to make another journey to see it. The house considered this without moving.\nThey ate the bread left from breakfast. Rae began describing what she could see from where they sat, a hawk circling, grass bending in different directions, a line of dark trees beyond the hill. She was not trying to persuade the house. The view interested her now that she had stopped hurrying toward a better one. After a while, the house unfolded its knees. It asked whether they could walk the rest of the way slowly.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-house-that-took-a-holiday-assets/page5.jpg"}, {"text": "6. Windows Toward the Distance\nBy afternoon, they reached the broad, level crown of the hill. The house stopped and turned a little, placing its windows toward the fields. Rae waited for a speech about the wonderful view. Instead, the door creaked once and fell silent again. Gran spread their picnic cloth a safe distance away. Nothing dramatic happened. The fields remained fields. A cloud shadow crossed them, followed by another, and the house watched both.\nRae took out the little sketchbook she had put in the basket. She drew the cottage with its four wooden feet planted in grass. The drawing was crooked because she had never drawn a traveling house before. Gran asked whether she still wished she were working on the ship. Rae said she would like to finish it, but not just then. Behind them, the house asked if they could stay until the shadows reached the far hedge.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-house-that-took-a-holiday-assets/page6.jpg"}, {"text": "7. Home With Something to Tell\nThey returned across the meadow before evening. This time the house knew the way. It did not hurry, but it no longer stopped to ask whether familiar things would remember it. Gran and Rae kept to the side until it had settled in its old place and folded its wooden legs beneath the floor. Only then did Gran open the door. Inside, the sugar bowl sat exactly where it belonged. The house sounded rather proud of that.\nRae finished one small part of her model ship after supper. The house asked what she was making. She told it about the mast, the deck, and the blue paper sea beneath the hull. Its door creaked thoughtfully. A low hill had been enough for one day, it said, but there might be other clear routes to other views. Rae set down her brush and asked it to wait until the ship was finished before making announcements at breakfast.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/fiction/the-house-that-took-a-holiday-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "Why did the house want to take a vacation?", "choices": ["Its roof was leaking", "It had looked at the same cabbage patch for seventy-three years and wanted to see something else", "Rae had asked it to move"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "For seventy-three years its front windows had looked at the same cabbage patch, and it wanted to see something else."}, {"q": "Where did the house want to go, and where did it agree to go?", "choices": ["It wanted the town, but agreed to the river", "It wanted the sea, but agreed to a hill across an open meadow", "It wanted the hill, but agreed to the sea"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "The sea was beyond two towns and a bridge, so it agreed to the hill across open grass."}, {"q": "What did Gran and Rae do when the house began to walk?", "choices": ["They ran ahead to the hill", "They rode inside it", "They kept well clear to one side, away from its wooden feet"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Gran and Rae walked well to one side, away from the wooden feet."}, {"q": "Why did the house’s door tremble in the meadow?", "choices": ["It was hungry", "It missed knowing where everything was, and the hill seemed far away", "A storm was coming"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "The house said it missed knowing where everything was, and the hill looked farther than it had from the garden."}, {"q": "What did the house do when they reached the hill?", "choices": ["It turned its windows toward the fields and watched the cloud shadows", "It ran back to the garden", "It fell asleep at once"], "answer": 0, "evidencePage": 6, "hint": "Look at page 6.", "explain": "It turned a little, placing its windows toward the fields, and watched cloud shadows cross them."}], "grammar": [{"q": "Which sentence shows a plan that depends on something?", "choices": ["If the ground is dry, the house would walks.", "If the ground will be dry, the house walks.", "If the ground is dry, the house will walk."], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Use the present tense after “if” and “will” in the result.", "teach": "In an <b>if</b> sentence about a plan, use the present tense after <b>if</b> and <b>will</b> for the result, like <b>If it is dry, we will go</b>.<span class='cn'>表示计划的 <b>if</b> 句子，<b>if</b> 后面用一般现在时，结果部分用 <b>will</b>，比如 <b>If it is dry, we will go</b>。</span>"}, {"q": "‘Rae ___ the cottage with its four wooden feet planted in grass.’ Which verb belongs in the blank?", "choices": ["drawn", "drew", "drawed"], "answer": 1, "evidencePage": 6, "hint": "Look at page 6.", "explain": "The past tense of “draw” is “drew”.", "teach": "Some verbs change their spelling in the past tense, like <b>draw</b> and <b>drew</b>.<span class='cn'>有些动词的过去式拼写会整个变化，比如 <b>draw</b> 变成 <b>drew</b>（画）。</span>"}, {"q": "‘The house agreed to the hill, though it described this as a small beginning to a large vacation.’ What does the house’s comment show?", "choices": ["It treated a short trip as a big adventure, which is a funny exaggeration", "It wanted to go to the sea instead", "It was afraid of the hill"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Calling a short walk a large vacation is a playful exaggeration.", "teach": "An <b>exaggeration</b> makes something sound bigger than it is, like <b>a large vacation</b> for a short walk.<span class='cn'><b>夸张</b>把事情说得比实际更大，比如把一小段路说成 <b>a large vacation</b>（一次盛大的假期）。</span>"}], "vocabulary": [{"q": "‘Announced’ means ___.", "choices": ["told people something publicly", "forgot something", "kept something secret"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "The house announced its vacation while Rae was spreading jam."}, {"q": "‘Route’ means ___.", "choices": ["a kind of map", "a very old road sign", "the way you travel from one place to another"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "The whole route crossed open grass."}, {"q": "‘Secured’ means ___.", "choices": ["fastened or made safe", "dropped on the ground", "painted a bright color"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Rae asked whether it had secured the plates."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(announced|route|secured)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 5 Fiction</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}var TEACH_ICONS='<svg class="ic i-spk" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.5v5h3.6l4.9 4.5V5L7.6 9.5H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.6 9.2a4 4 0 010 5.6M18.2 6.6a7.6 7.6 0 010 10.8"/></svg><svg class="ic i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></svg><svg class="ic i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 5.3v13.4c0 .8.9 1.3 1.6.8l9.6-6.7c.6-.4.6-1.2 0-1.6L9.8 4.5c-.7-.5-1.6 0-1.6.8z"/></svg>';var _tp=null;function _tpSet(b,st){if(!b)return;b.classList.toggle('is-playing',st==='playing');b.classList.toggle('is-paused',st==='paused');b.setAttribute('aria-pressed',st==='playing'?'true':'false');var z=b.dataset.part==='cn',L=st==='playing'?(z?'\u6682\u505C':'Pause'):st==='paused'?(z?'\u7EE7\u7EED\u64AD\u653E':'Resume'):b.dataset.label;b.setAttribute('aria-label',L);b.title=L;}function stopTeachAudio(){var c=_tp;if(!c)return;_tp=null;try{if(c.audio){c.audio.onended=c.audio.onerror=c.audio.ontimeupdate=null;c.audio.pause();}}catch(e){}if(c.mode==='tts'){try{speechSynthesis.cancel();}catch(e){}}_tpSet(c.btn,'idle');}function _tpFallback(btn){try{var u=new SpeechSynthesisUtterance(btn.dataset.text||'');u.lang=btn.dataset.lang||'en-US';var cur={btn:btn,mode:'tts'};_tp=cur;u.onend=u.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');}};_tpSet(btn,'playing');speechSynthesis.speak(u);}catch(e){}}function playTeachAudio(btn){if(_tp&&_tp.btn===btn){if(_tp.mode==='audio'){var a0=_tp.audio;if(a0.paused){var p0=a0.play();if(p0&&p0.catch)p0.catch(function(er){if(er&&er.name==='AbortError')return;stopTeachAudio();});_tpSet(btn,'playing');}else{a0.pause();_tpSet(btn,'paused');}}else{stopTeachAudio();}return;}stopTeachAudio();window.__readToken=(window.__readToken||0)+1;try{speechSynthesis.cancel();}catch(e){}try{endNarration();}catch(e){}var url=null;try{var st=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[btn.dataset.key];if(st&&st[btn.dataset.part])url=st[btn.dataset.part];}catch(e){}if(!url){_tpFallback(btn);return;}var a=new Audio(url),cur={btn:btn,audio:a,mode:'audio'};_tp=cur;a.onended=function(){if(_tp===cur)_tp=null;_tpSet(btn,'idle');};a.ontimeupdate=function(){if(!btn.isConnected&&_tp===cur)stopTeachAudio();};a.onerror=function(){if(_tp===cur){_tp=null;_tpSet(btn,'idle');_tpFallback(btn);}};_tpSet(btn,'playing');var pr=a.play();if(pr&&pr.catch)pr.catch(function(er){if(er&&er.name==='AbortError')return;if(_tp===cur){_tp=null;_tpSet(btn,'idle');}});}function teachBtn(key,part,text,lang,label){return '<button type="button" class="spk" data-key="'+key+'" data-part="'+part+'" data-text="'+text+'" data-lang="'+lang+'" data-label="'+label+'" onclick="playTeachAudio(this)" aria-label="'+label+'" title="'+label+'" aria-pressed="false">'+TEACH_ICONS+'</button>';}function renderTeach(teachHtml,key){stopTeachAudio();var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+=teachBtn(key,"en",escAttr(enText),"en-US","Listen in English")+" "+enHtml;if(cnHtml){out+='<span class="cn">'+teachBtn(key,"cn",escAttr(cnText),"zh-CN","\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3")+" "+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}

function saveProgress(){try{localStorage.setItem("les-the-house-that-took-a-holiday-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-house-that-took-a-holiday"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-house-that-took-a-holiday",bookTitle:"The House That Took a Vacation",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

let preferredVoice=null;
