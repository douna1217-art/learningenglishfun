<script>

const pages=[{"type": "cover", "title": "Beyond the Mission Ledger", "subtitle": "One Record Counted Supplies; Other Sources Revealed the People and Power Behind the Numbers", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/beyond-the-mission-ledger-assets/cover.jpg"}, {"text": "1. What a Ledger Can Count\nThe mission ledger listed wheat, cattle, roof tiles, baptisms, marriages, births, and deaths. Sofia first called it a complete record because its columns were so orderly. Dr. Ruiz asked what the page could not count: fear, forced choices, family separation, resistance, memory, or the meaning of land.\nA primary source comes from the time being studied, but it still reflects a creator's purpose and viewpoint. Mission officials made ledgers to manage institutions and report results. The students would use the ledger as evidence—not as the only voice. They added archaeology, maps, Native community histories, letters, and later scholarship to their inquiry.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/beyond-the-mission-ledger-assets/page1.jpg"}, {"text": "2. Why Spain Built Missions\nIn the late 1700s, Spain sought to claim Alta California, extend its empire, and spread Catholicism. Expeditions traveled by land and sea. Soldiers established presidios, missionaries directed missions, and settlers formed pueblos. These institutions supported Spanish control of territory already inhabited by Native nations.\nMission locations were not random. Planners looked for water, farmland, building materials, nearby Native populations, and routes connecting ports and settlements. A chain of missions developed along the coast. Geography helped the system function, but a map of sites can hide the unequal power used to claim land and direct people's lives.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/beyond-the-mission-ledger-assets/page2.jpg"}, {"text": "3. Different Roles, Unequal Power\nMissionaries organized worship, instruction, labor, and production. Soldiers enforced colonial authority and guarded presidios and missions. Craftspeople, laborers, settlers, and families lived in or moved among missions, pueblos, ranchos, and presidios. Native people supplied much of the labor and knowledge that sustained these places.\nThe relationships were unequal. Many Native people were baptized and then restricted from leaving missions. Work schedules, punishment, religious rules, and military force limited freedom. Some people entered because disease, violence, or loss of local resources had narrowed other choices. Others fled, resisted, negotiated, or maintained community practices despite control.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/beyond-the-mission-ledger-assets/page3.jpg"}, {"text": "4. Daily Life Was Not One Story\nA mission complex could include a church, workshops, kitchens, storerooms, fields, corrals, and crowded living quarters. People farmed, cooked, made tools and cloth, cared for animals, repaired buildings, and raised children. Food, language, status, and freedom differed greatly among people in the same place.\nDisease spread rapidly and caused devastating deaths in Native communities. Mission routines also disrupted family networks, land relationships, languages, and cultural practices. At the same time, Native people shared knowledge, adapted skills, protected relationships, and sometimes used mission spaces in ways officials did not record. “Daily life” must include both ordinary work and the conditions of colonial control.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/beyond-the-mission-ledger-assets/page4.jpg"}, {"text": "5. Reading for What Is Missing\nMateo compared the ledger with soil evidence from former food areas. The ledger counted crops grown for the mission, while plant remains showed that Native foods continued to be gathered or prepared. Sofia listened to a descendant community historian explain place-names and family memories absent from official records.\nNo single source answered every question. Archaeology may reveal objects but not a person's exact thoughts. Oral histories carry community knowledge but may describe experiences differently from official documents. Historians compare sources, identify agreement and disagreement, and ask who had the power to create, preserve, or destroy records.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/beyond-the-mission-ledger-assets/page5.jpg"}, {"text": "6. From Mission Rule to Mexican Ranchos\nAfter Mexico won independence from Spain, California came under Mexican rule. In the 1830s, the government secularized the missions, ending their control by the church and promising changes in land use. Much mission land became large private ranchos through grants.\nSecularization did not return most mission lands to Native communities. Many Native people continued to face displacement and worked on ranchos or in towns under difficult conditions. The change from Spanish mission to Mexican rancho altered institutions and ownership, but it did not erase the effects of colonization. A timeline must show both political change and continuing consequences.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/beyond-the-mission-ledger-assets/page6.jpg"}, {"text": "7. A Fuller Historical Account\nSofia's exhibit label began: “Spanish missions were religious, economic, and political institutions used to colonize Alta California.” Mateo added how water, farmland, and routes shaped their locations. Together they explained Native labor, confinement, disease, resistance, survival, and the transition to Mexican ranchos.\nThey placed the ledger at the center but surrounded it with questions. Who created this source? What did its creator need to record? Whose experiences are missing? Which other sources can help? The goal was not to replace one simple story with another. It was to build an account accurate enough to show people, geography, institutions, and power together.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/beyond-the-mission-ledger-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did the mission ledger list?", "choices": ["Only baptisms", "Only cattle", "Wheat, cattle, roof tiles, baptisms, marriages, births, and deaths"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "The mission ledger listed wheat, cattle, roof tiles, baptisms, marriages, births, and deaths."}, {"q": "What could the ledger's page not count, according to Dr. Ruiz?", "choices": ["Fear, forced choices, family separation, resistance, and memory", "The number of cattle", "The number of roof tiles"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "The ledger could not count fear, forced choices, family separation, resistance, or memory."}, {"q": "Why did Spain build missions in Alta California?", "choices": ["To trade with Native nations as equals", "To claim territory, extend its empire, and spread Catholicism", "To build vacation resorts"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Spain sought to claim Alta California, extend its empire, and spread Catholicism."}, {"q": "What limited the freedom of many Native people at the missions?", "choices": ["Nothing, they were completely free", "Only the weather", "Work schedules, punishment, religious rules, and military force"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Work schedules, punishment, religious rules, and military force limited freedom."}, {"q": "What is the big idea of this story?", "choices": ["A fuller historical account uses many sources to reveal the people and power a single ledger cannot show", "The ledger alone tells the complete history", "Missions had no effect on Native communities"], "answer": 0, "evidencePage": 7, "hint": "Look at the last page.", "explain": "The goal was to build an account accurate enough to show people, geography, institutions, and power together."}], "grammar": [{"q": "Which sentence correctly uses a comma after an introductory phrase?", "choices": ["In the late 1700s Spain sought to claim Alta California.", "In the late 1700s, Spain, sought to claim Alta California.", "In the late 1700s, Spain sought to claim Alta California."], "answer": 2, "evidencePage": 2, "hint": "Use a comma after a phrase that introduces the sentence.", "explain": "'In the late 1700s,' is an introductory phrase that needs a comma after it.", "teach": "Use a <b>comma</b> after a phrase that introduces the sentence: In the late 1700s, Spain sought...<span class='cn'>句首的引导短语后要加<b>逗号</b>：In the late 1700s,(在18世纪晚期，)。</span>"}, {"q": "Which sentence correctly uses a comma after an introductory phrase?", "choices": ["After Mexico won independence from Spain, California came under Mexican rule.", "After Mexico won independence from Spain California came under Mexican rule.", "After, Mexico won independence from Spain, California came under Mexican rule."], "answer": 0, "evidencePage": 6, "hint": "Use a comma after a phrase that introduces the sentence.", "explain": "'After Mexico won independence from Spain,' is an introductory phrase that needs a comma after it.", "teach": "Use a <b>comma</b> after a phrase that introduces the sentence.<span class='cn'>句首的引导短语后要加<b>逗号</b>。</span>"}, {"q": "Which sentence correctly uses a comma after an introductory phrase?", "choices": ["In the 1830s the government secularized the missions.", "In the 1830s, the government secularized the missions.", "In the 1830s, the government, secularized the missions."], "answer": 1, "evidencePage": 6, "hint": "Use a comma after a phrase that introduces the sentence.", "explain": "'In the 1830s,' is an introductory phrase that needs a comma after it.", "teach": "Use a <b>comma</b> after a phrase that introduces the sentence.<span class='cn'>句首的引导短语后要加<b>逗号</b>。</span>"}], "vocabulary": [{"q": "'Primary source' means ___.", "choices": ["a made-up story", "a summary written today", "a record or document from the time being studied"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "A primary source comes from the time being studied."}, {"q": "'Secularize' means ___.", "choices": ["to end control by a religious institution", "to build a new church", "to increase religious control"], "answer": 0, "evidencePage": 6, "hint": "Look at page 6.", "explain": "The government secularized the missions, ending their control by the church."}, {"q": "'Colonize' means ___.", "choices": ["to visit a place briefly", "to take control of a place and its people, often already inhabited by others", "to trade fairly with another nation"], "answer": 1, "evidencePage": 7, "hint": "Look at the last page.", "explain": "Spanish missions were institutions used to colonize Alta California."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(colonize|secularize)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 4 Social Studies</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function saveProgress(){try{localStorage.setItem("les-beyond-the-mission-ledger-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="beyond-the-mission-ledger"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"beyond-the-mission-ledger",bookTitle:"Beyond the Mission Ledger",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

function pickVoice(){const voices=speechSynthesis.getVoices();if(!voices.length)return;const en=voices.filter(v=>/^en(-|_|$)/i.test(v.lang));const pool=en.length?en:voices;const score=v=>{let s=0;const n=(v.name||"").toLowerCase();if(/natural/.test(n))s+=8;if(/neural/.test(n))s+=6;if(/online/.test(n))s+=4;if(/google/.test(n))s+=5;if(/(aria|jenny|guy|libby|sonia|michelle|ava|andrew|emma|clara|natasha)/.test(n))s+=5;if(/(samantha|allison|karen|serena|siri|nicky|aaron)/.test(n))s+=4;if(v.localService===false)s+=3;if(/en-us|en-gb/i.test(v.lang))s+=1;if(/(zira|david|mark|hazel|compact|espeak|eloquence)/.test(n))s-=5;return s};pool.sort((a,b)=>score(b)-score(a));preferredVoice=pool[0]||null}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.i);},at));});};}let advanced=false;const advance=()=>{if(advanced)return;advanced=true;if(watchdog)clearTimeout(watchdog);ci++;speakChunk();};u.onend=advance;u.onerror=advance;const estDur=Math.max(1200,chunk.text.length*110);const watchdog=setTimeout(advance,estDur+4000);speechSynthesis.speak(u);}setTimeout(speakChunk,70);}

function setStatus(m,ok){var el=document.getElementById("recStatus");if(el){el.textContent=m;el.style.color=ok?"#1f8f4d":"#b23b34";}}async function toggleRecording(){const btn=document.getElementById("recordPageBtn");if(recorder&&recorder.state==="recording"){recorder.stop();btn.textContent="🎙 Record";btn.classList.remove("recording");return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setStatus("Recording works only on the published website — the microphone is turned off in this preview.",false);return}if(typeof MediaRecorder==="undefined"){setStatus("This browser can't record audio. Try Chrome/Edge, or Safari 14+.",false);return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});let opts={};if(MediaRecorder.isTypeSupported){if(MediaRecorder.isTypeSupported("audio/webm"))opts={mimeType:"audio/webm"};else if(MediaRecorder.isTypeSupported("audio/mp4"))opts={mimeType:"audio/mp4"};}chunks=[];recorder=new MediaRecorder(stream,opts);recorder.ondataavailable=e=>{if(e.data&&e.data.size>0)chunks.push(e.data)};recorder.onstop=()=>{if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(new Blob(chunks,{type:(recorder.mimeType||"audio/webm")}));document.getElementById("playRecordingBtn").disabled=false;document.getElementById("deleteRecordingBtn").disabled=false;setStatus("Saved! Tap ▶ Play to hear your reading.",true);stream.getTracks().forEach(t=>t.stop())};recorder.start();btn.textContent="■ Stop";btn.classList.add("recording");setStatus("Recording… tap ■ Stop when you finish.",true)}catch(e){var n=(e&&e.name)?e.name:String(e);if(n==="NotAllowedError"||n==="SecurityError"){setStatus("Microphone blocked. In the chat preview the mic is always off — use the live website, then tap Allow (or click 🔒 in the address bar → allow Microphone → reload).",false);}else if(n==="NotFoundError"){setStatus("No microphone found on this device.",false);}else{setStatus("Could not record ("+n+"). Use the live website in Chrome/Edge/Safa
