<script>

const pages=[{"type": "cover", "title": "Trails West, Many Homelands", "subtitle": "Overland journeys crossed difficult terrain—and lands where communities already lived.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/trails-west-many-homelands-assets/cover.jpg"}, {"text": "1. Many Reasons to Go West\nDuring the 1840s and 1850s, thousands of people traveled overland toward Oregon, California, Utah, and other western destinations. Some sought farmland, gold, trade, religious community, or a new start. Promoters often exaggerated opportunity and minimized cost.\nTravelers were not one group. Families, single workers, craftspeople, merchants, missionaries, and members of the Church of Jesus Christ of Latter-day Saints moved for different reasons. Free and enslaved Black people also traveled west under very different conditions. Isabel began with purpose because a route only makes sense when we know why someone took it.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/trails-west-many-homelands-assets/page1.jpg"}, {"text": "2. A Trail Was a Moving Community\nMost emigrants walked beside wagons pulled by oxen rather than riding inside. Wagon companies made rules, divided work, chose campsites, repaired equipment, cared for animals, and decided when to cross rivers. Cooperation helped, but disagreements over pace, leadership, and resources were common.\nChildren collected fuel, watched animals, carried water, and helped with meals. Women’s labor was essential even when records credited male leaders. Rowan replaced the image of a lone heroic wagon with a moving community whose survival depended on planning, skill, and shared work.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/trails-west-many-homelands-assets/page2.jpg"}, {"text": "3. Geography Set the Schedule\nDeparture time mattered. Travelers needed spring grass for animals and enough months to cross plains, rivers, deserts, and mountains before winter. Heavy rain turned roads to mud; drought reduced water and forage; snow could close mountain passes. River depth and current changed from week to week.\nIllness caused more deaths than conflict, and accidents could happen during crossings or repairs. Trail diaries describe exhaustion, grief, boredom, beauty, and mutual help. Isabel used terrain and season—not bravery—as the best predictors of many decisions.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/trails-west-many-homelands-assets/page3.jpg"}, {"text": "4. Destinations Were Already Places\nAt trail’s end, newcomers entered places with established communities. Oregon Country included Native nations, fur-trade posts, farms, and missions. California contained Native homelands, pueblos, ranchos, ports, and missions shaped by Spanish and Mexican rule. Utah had long been home to Ute, Shoshone, Paiute, Goshute, and other peoples.\nMigrants built farms, towns, businesses, and governments, but they did not create society from nothing. Their arrival changed land use, law, trade, and political power. Rowan added existing community markers before placing any newcomer settlement.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/trails-west-many-homelands-assets/page4.jpg"}, {"text": "5. Mexican Communities Continue\nMexican settlement in the West and Southwest continued during the early 1800s. Families lived in towns, ranchos, farming villages, mining areas, and trading centers across present-day California, New Mexico, Arizona, Colorado, and Texas. Irrigation, livestock, crafts, and long-distance trade supported communities.\nResidents included Indigenous, mestizo, African-descended, and European-descended people with varied legal and social positions. Mexican rule changed after wars and new borders, but communities, languages, land knowledge, and family networks continued. Isabel treated migration as movement in several directions, not one westward arrow from the United States.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/trails-west-many-homelands-assets/page5.jpg"}, {"text": "6. Trails Changed Native Homelands\nNative nations often guided travelers, traded food and animals, operated ferries, rescued stranded people, or negotiated passage. Encounters varied by place and year. Popular stories that describe only constant warfare erase extensive cooperation and Native economic choices.\nAt the same time, migration brought disease, resource depletion, livestock grazing, damaged grasslands, settlement pressure, and violence. Treaties and land rights were frequently ignored. Isabel and Rowan held both truths together: Native assistance was important, and the growing migration system threatened Native sovereignty and survival.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/trails-west-many-homelands-assets/page6.jpg"}, {"text": "7. Compare Journeys and Consequences\nIsabel and Rowan planned a route using departure date, rivers, grass, water, mountain passes, supplies, group labor, and destination. Then they changed perspectives. The same crossing could appear as a challenge to a traveler, paid work to a ferry operator, disruption to a nearby community, or pressure on a homeland.\nTheir final claim rejected the phrase empty West. Overland migrants showed endurance and cooperation, but their movement occurred within Native homelands and alongside Mexican communities. Geography shaped the journey; laws, power, and prior settlement shaped its consequences.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/trails-west-many-homelands-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "According to page 1, why did people travel overland to the West in the 1840s and 1850s?", "choices": ["everyone was searching for gold", "the U.S. government forced them to move", "for many different reasons: farmland, gold, trade, religious community, or a new start"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Travelers were not one group; they sought farmland, gold, trade, religious community, or a fresh start, and promoters often exaggerated the opportunity."}, {"q": "Why does the book say \"a trail was a moving community\"?", "choices": ["wagon companies made rules, divided work, repaired equipment, and depended on shared labor", "one heroic person led each wagon alone", "the trail was actually a small town that traveled on wheels"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Survival depended on planning, skill, and shared work; children and women did essential labor even when records credited male leaders."}, {"q": "What did Isabel decide were the best predictors of many decisions on the trail?", "choices": ["the travelers' bravery", "terrain and season", "the number of wagons in the group"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Spring grass, months of good weather, river depth, mud, drought, and snow — terrain and season, not bravery — shaped most choices."}, {"q": "What does the book mean by \"destinations were already places\"?", "choices": ["the West was empty until migrants arrived", "the trails had no real end point", "Oregon, California, and Utah already had established Native nations and other communities"], "answer": 2, "evidencePage": 4, "hint": "Look at pages 4 and 5.", "explain": "Newcomers entered lands with Native nations, missions, ranchos, pueblos, and long-settled Mexican communities; they changed society but did not create it from nothing."}, {"q": "How did Isabel and Rowan describe encounters between travelers and Native nations?", "choices": ["as both extensive cooperation AND a migration system that threatened Native sovereignty and survival", "as constant warfare only", "as always peaceful and helpful"], "answer": 0, "evidencePage": 6, "hint": "Look at page 6.", "explain": "Native people often guided, traded, and rescued travelers; at the same time migration brought disease, resource loss, and violence, and treaties were often ignored."}], "grammar": [{"q": "\"Illness caused more deaths ___ conflict did.\" Which word correctly completes the comparison?", "choices": ["then", "than", "that"], "answer": 1, "evidencePage": 3, "hint": "You are comparing two amounts.", "explain": "\"Than\" is used for comparisons; \"then\" refers to time.", "teach": "Use <b>than</b> for a <b>comparison</b>: illness caused more deaths <b>than</b> conflict. Use <b>then</b> for <b>time</b>: first this, <b>then</b> that.<span class='cn'>比较时用 <b>than</b>：more deaths than conflict；表示时间用 <b>then</b>。</span>"}, {"q": "Which sentence correctly uses a comma after an introductory phrase?", "choices": ["At trail's end newcomers entered established communities.", "At trail's end newcomers, entered established communities.", "At trail's end, newcomers entered established communities."], "answer": 2, "evidencePage": 4, "hint": "A phrase that sets the scene before the main clause is followed by a comma.", "explain": "Put a comma after an introductory word or phrase, before the main part of the sentence.", "teach": "Put a <b>comma</b> after an <b>introductory phrase</b>: <b>At trail's end,</b> newcomers entered established communities.<span class='cn'>句首的引导短语后加<b>逗号</b>：At trail's end, newcomers entered...</span>"}, {"q": "\"Children collected fuel, watched animals, ___ carried water.\" How should this list be punctuated?", "choices": ["fuel, watched animals, and carried water", "fuel, watched animals and carried water", "fuel watched animals and carried water"], "answer": 0, "evidencePage": 2, "hint": "Use commas between all items in a series.", "explain": "In a list of three or more actions, separate each item with a comma.", "teach": "Separate <b>every item</b> in a series with a <b>comma</b>: collected fuel<b>,</b> watched animals<b>,</b> and carried water.<span class='cn'>列举三项以上，每项之间都加<b>逗号</b>。</span>"}], "vocabulary": [{"q": "\"Terrain\" means ___.", "choices": ["the weather on a single day", "the physical features of an area of land", "a group of travelers"], "answer": 1, "evidencePage": 3, "hint": "Plains, rivers, deserts, and mountain passes are examples.", "explain": "Terrain is the physical shape and features of the land — its hills, rivers, deserts, and mountains."}, {"q": "An \"emigrant\" is a person who ___.", "choices": ["guides wagons for pay", "writes trail diaries", "leaves one place to settle in another"], "answer": 2, "evidencePage": 2, "hint": "Page 2 calls the travelers 'emigrants.'", "explain": "An emigrant is someone who leaves their home region to live somewhere else."}, {"q": "A \"rancho\" was ___.", "choices": ["a large ranch or landholding in Mexican California", "a kind of wagon", "a mountain pass"], "answer": 0, "evidencePage": 4, "hint": "Page 4 lists it among California's established places.", "explain": "A rancho was a large ranch or land grant, a common feature of Spanish and Mexican California."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Social Studies",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(trail|homelands|terrain)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 5 Social Studies</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function saveProgress(){try{localStorage.setItem("les-trails-west-many-homelands-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="trails-west-many-homelands"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"trails-west-many-homelands",bookTitle:"Trails West, Many Homelands",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.
