const pages=[{"type": "cover", "title": "Water Crosses California", "subtitle": "Dams, reservoirs, and aqueducts connect regions—and create difficult choices.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/water-crosses-california-assets/cover.jpg"}, {"text": "1. Water Starts in a Watershed\nNia placed a blue ribbon on a California relief model. Snow and rain fell in mountains, then water moved through creeks and rivers into valleys, lakes, wetlands, groundwater, and the ocean. The land area that drains to a shared outlet is called a watershed.\nCalifornia's precipitation is uneven. The north and many mountain areas usually receive more water than the dry south, while wet and dry years can differ greatly. People also need water at different times and places. Geography created the problem that engineers and governments tried to solve: how could water be stored and moved?", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/water-crosses-california-assets/page1.jpg"}, {"text": "2. Local Systems Come First\nCalifornia communities long developed local ways to use water. Native peoples managed springs, streams, wetlands, and plants according to the needs and knowledge of particular homelands. Spanish and Mexican settlements built small ditches, while later towns, farms, and mines expanded wells, canals, and reservoirs.\nLocal systems could not always meet the demands of fast-growing cities and large farms. Groundwater pumping also lowered water levels in some places. Theo learned that a water network is not one invention. It is a layered system built over time, often by changing or enlarging earlier waterways and practices.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/water-crosses-california-assets/page2.jpg"}, {"text": "3. Aqueducts Move Water Farther\nThe Los Angeles Aqueduct began carrying water from the Owens Valley in 1913. The Hetch Hetchy system later delivered Sierra Nevada water to the San Francisco Bay Area. Gravity moved much of the water downhill, while tunnels, pipes, and channels crossed difficult terrain.\nThese systems helped cities grow and improved reliable supply for many users. They also transformed source regions and ecosystems. Owens Valley residents and Paiute communities challenged water loss, while the Hetch Hetchy project flooded a valley inside Yosemite National Park. A pipe's destination is only half its history; its source matters too.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/water-crosses-california-assets/page3.jpg"}, {"text": "4. Federal Projects Reshape Valleys\nDuring the twentieth century, the federal Central Valley Project built dams, reservoirs, canals, and pumping facilities. It reduced some flood risks, generated electricity, supported farms, and delivered water to cities and wildlife refuges. Large reservoirs stored water from wetter seasons for later use.\nDams also blocked fish movement, changed river temperature and sediment, flooded places, and altered Native homelands. Irrigation supported food production but could contribute to drainage and soil problems. Nia recorded both engineering purposes and consequences because a complete explanation cannot stop at the dam's concrete wall.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/water-crosses-california-assets/page4.jpg"}, {"text": "5. The State Water Project Connects Regions\nCalifornia's State Water Project added reservoirs, canals, pipelines, and powerful pumps. Water from northern watersheds moves through the Sacramento-San Joaquin Delta, then some is lifted over mountains toward farms and cities farther south. The California Aqueduct is one visible part of this larger system.\nMoving water requires energy and careful scheduling. Managers balance contracts, reservoir levels, flood protection, water quality, fish and wildlife needs, and drought conditions. No single valve controls the whole state. Federal, state, local, tribal, agricultural, and urban interests may cooperate, negotiate, or disagree.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/water-crosses-california-assets/page5.jpg"}, {"text": "6. Every Delivery Has Benefits and Costs\nStored and transported water supports drinking supplies, sanitation, farms, businesses, firefighting, recreation, and some electricity generation. It can help communities prepare for seasonal dryness. These benefits are important, but they are not free or evenly distributed.\nConstruction, pumping, and repairs cost money and energy. River and Delta ecosystems can be harmed, and smaller or disadvantaged communities may still lack safe, reliable water. Tribal nations continue to defend water rights and cultural connections. A fair evaluation asks who receives water, who bears costs, and who participates in decisions.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/water-crosses-california-assets/page6.jpg"}, {"text": "7. Trace the Whole Route\nTheo followed the blue ribbon from mountain snowpack to a reservoir, through a canal and pumping plant, across a valley, and into a city treatment system. Nia added branches for farms, rivers, wetlands, and groundwater. The route was a network, not a straight line.\nTheir final claim explained why California built large water systems: supply and demand were separated by place and season. The systems supported growth and agriculture while creating environmental and community costs. Understanding the network means tracing both water and responsibility—from source, through infrastructure, to every user and affected place.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/water-crosses-california-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What is a watershed?", "choices": ["A type of dam", "The land area that drains to a shared outlet", "A drought that lasts several years"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "A watershed is the land area that drains to a shared outlet."}, {"q": "When did the Los Angeles Aqueduct begin carrying water from the Owens Valley?", "choices": ["1849", "2000", "1913"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "The Los Angeles Aqueduct began carrying water from the Owens Valley in 1913."}, {"q": "What did the federal Central Valley Project build?", "choices": ["Dams, reservoirs, canals, and pumping facilities", "Only small local wells", "Ocean desalination plants"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "The federal Central Valley Project built dams, reservoirs, canals, and pumping facilities."}, {"q": "What does the California Aqueduct do?", "choices": ["Stops all water from moving south", "Moves water from northern watersheds toward farms and cities farther south", "Only supplies drinking water to one city"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "The California Aqueduct moves water from northern watersheds toward farms and cities farther south."}, {"q": "What is the big idea of this story?", "choices": ["Water in California moves freely with no cost to anyone", "California has never needed to move water between regions", "Dams, reservoirs, and aqueducts connect regions across California, but moving water creates real benefits and real costs that are not shared equally"], "answer": 2, "evidencePage": 7, "hint": "Look at the last page.", "explain": "Dams, reservoirs, and aqueducts connect regions and create difficult choices about benefits and costs."}], "grammar": [{"q": "Which sentence correctly uses 'while' to show two things happening at the same time?", "choices": ["The north and many mountain areas usually receive more water than the dry south while, wet and dry years can differ greatly.", "The north and many mountain areas usually receive more water than the dry south, while wet and dry years can differ greatly.", "The north and many mountain areas, usually receive more water than the dry south while wet and dry years can differ greatly."], "answer": 1, "evidencePage": 1, "hint": "The comma goes right before 'while'.", "explain": "A comma goes right before 'while' when showing two things happening at the same time.", "teach": "Put a <b>comma</b> right before <b>while</b> when showing two things happening at the <b>same time</b>.<span class='cn'>用<b>while</b>表示两件事<b>同时</b>发生时，逗号放在while前面。</span>"}, {"q": "Which sentence correctly uses 'while' to show two things happening at the same time?", "choices": ["Gravity moved much of the water downhill while, tunnels, pipes, and channels crossed difficult terrain.", "Gravity, moved much of the water downhill while tunnels, pipes, and channels crossed difficult terrain.", "Gravity moved much of the water downhill, while tunnels, pipes, and channels crossed difficult terrain."], "answer": 2, "evidencePage": 3, "hint": "The comma goes right before 'while'.", "explain": "A comma goes right before 'while' when showing two things happening at the same time.", "teach": "Put a <b>comma</b> right before <b>while</b> when showing two things happening at the <b>same time</b>.<span class='cn'>用<b>while</b>表示两件事<b>同时</b>发生时，逗号放在while前面。</span>"}, {"q": "Which sentence correctly uses 'while' to show two things happening at the same time?", "choices": ["Owens Valley residents and Paiute communities challenged water loss, while the Hetch Hetchy project flooded a valley inside Yosemite National Park.", "Owens Valley residents and Paiute communities, challenged water loss while the Hetch Hetchy project flooded a valley inside Yosemite National Park.", "Owens Valley residents and Paiute communities challenged water loss while, the Hetch Hetchy project flooded a valley inside Yosemite National Park."], "answer": 0, "evidencePage": 3, "hint": "The comma goes right before 'while'.", "explain": "A comma goes right before 'while' when showing two things happening at the same time.", "teach": "Put a <b>comma</b> right before <b>while</b> when showing two things happening at the <b>same time</b>.<span class='cn'>用<b>while</b>表示两件事<b>同时</b>发生时，逗号放在while前面。</span>"}], "vocabulary": [{"q": "'Watershed' means ___.", "choices": ["a type of pump", "the land area that drains to a shared outlet, like a river or lake", "a drought that never ends"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "A watershed is the land area that drains to a shared outlet."}, {"q": "'Aqueduct' means ___.", "choices": ["a natural lake with no human involvement", "a type of drought", "a structure built to carry water over long distances"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "An aqueduct is a structure built to carry water over long distances."}, {"q": "'Reservoir' means ___.", "choices": ["a large natural or artificial lake used to store water", "a type of small ditch", "a drought warning system"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "A reservoir is a large natural or artificial lake used to store water."}]};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(watershed|aqueduct|reservoir)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 4 Social Studies</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

function saveProgress(){try{localStorage.setItem("les-water-crosses-california-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="water-crosses-california"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"water-crosses-california",bookTitle:"Water Crosses California",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.
