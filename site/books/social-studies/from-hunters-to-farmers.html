 16px;display:flex;align-items:center;gap:14px;box-shadow:0 14px 38px rgba(111,74,182,.24);border:1px solid rgba(255,255,255,.32)}.evidence-banner strong{text-shadow:0 1px 6px rgba(60,35,110,.35)}.evidence-banner span{font-size:.84rem;color:#fff}.evidence-banner button{border:0;border-radius:10px;padding:9px 12px;background:rgba(255,255,255,.92);color:var(--purple);font-weight:950;cursor:pointer}.footer{text-align:center;color:var(--muted);font-size:.8rem;padding:13px}

<script>

const pages=[{"type": "cover", "title": "From Hunters to Farmers", "subtitle": "Evidence reveals the long human journey from mobile communities to early villages.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/from-hunters-to-farmers-assets/cover.jpg"}, {"text": "1. Evidence From Deep Time\nWritten records cover only a small part of the human past. To study earlier eras, archaeologists examine stone tools, hearths, bones, footprints, plant remains, shelters, and art. They record where each object was found because location can be as important as the object itself.\nNew discoveries can change an interpretation. A broken stone may be a tool, waste from toolmaking, or a naturally shaped rock. Researchers compare many kinds of evidence before proposing an explanation.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/from-hunters-to-farmers-assets/page1.jpg"}, {"text": "2. Life in Hunter Gatherer Communities\nFor most of human history, people lived by hunting, fishing, gathering plants, and collecting other foods. Communities moved according to seasons, water, animal migrations, and the ripening of plants. Mobility required detailed knowledge, planning, and cooperation.\nPeople made tools from stone, bone, wood, and fiber. Controlled fire provided warmth, light, protection, and a way to cook food. Skills and knowledge were taught across generations.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/from-hunters-to-farmers-assets/page2.jpg"}, {"text": "3. Humans Adapt Across the World\nHuman communities gradually populated major regions of the world. They adapted to grasslands, forests, coasts, mountains, deserts, and cold climates. Clothing, shelter, tools, and food strategies changed with local conditions.\nAdaptation did not mean people simply reacted to nature. They reshaped materials, shared knowledge, and made choices. Coastal groups built watercraft; cold-climate communities designed insulated clothing; desert travelers learned where water could be found.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/from-hunters-to-farmers-assets/page3.jpg"}, {"text": "4. Climate and Changing Landscapes\nAfter the last Ice Age, temperatures rose and rainfall patterns shifted in many regions. Some grasslands expanded while other areas became drier or wetter. Plants and animals also changed their ranges.\nPeople responded in different ways. Some continued mobile lifeways, some gathered wild grains more intensively, and some stayed longer near dependable water. There was no single moment when every community changed.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/from-hunters-to-farmers-assets/page4.jpg"}, {"text": "5. Domesticating Plants and Animals\nOver many generations, people selected seeds from useful plants and managed animals with desired traits. This process, called domestication, happened independently in several parts of the world and involved experimentation rather than one sudden invention.\nWheat, barley, rice, maize, potatoes, and other crops developed in different regions. Dogs, sheep, goats, cattle, and other animals entered human communities in different places and times.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/from-hunters-to-farmers-assets/page5.jpg"}, {"text": "6. Villages Surplus and New Work\nFarming allowed some communities to build permanent or seasonal villages. When harvests produced more food than people immediately needed, the surplus could be stored, exchanged, or used to support specialists such as potters and builders.\nSettled life also created new problems. Crop failure, disease, conflict over land and water, and unequal control of stored food could affect communities. Agriculture changed possibilities, but it did not make life automatically easier.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/from-hunters-to-farmers-assets/page6.jpg"}, {"text": "7. Change Without a Simple Ladder\nHunter-gatherer and farming lifeways overlapped for thousands of years, and mobile communities continued after cities appeared. Historians avoid describing one way of life as less intelligent or less advanced.\nThe agricultural revolution mattered because it changed population, settlement, labor, and relationships with land. Its effects varied by place. Evidence supports a complex history of many communities making different choices under changing conditions.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/from-hunters-to-farmers-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "Why do archaeologists record exactly where an object was found?", "choices": ["Because the government requires it for every dig site", "Because location can be as important as the object itself", "Because objects found closer to rivers are always older"], "answer": 1, "evidencePage": 1, "hint": "Look at section 1.", "explain": "Archaeologists record location because it can be as important as the object itself."}, {"q": "What did mobility require for hunter-gatherer communities?", "choices": ["Detailed knowledge, planning, and cooperation", "A written calendar system", "Permanent stone buildings"], "answer": 0, "evidencePage": 2, "hint": "Look at section 2.", "explain": "Mobility required detailed knowledge, planning, and cooperation among community members."}, {"q": "According to the book, did adaptation just mean reacting to nature?", "choices": ["Yes, communities had no control over their environment", "Yes, all communities adapted in exactly the same way", "No, people reshaped materials, shared knowledge, and made choices"], "answer": 2, "evidencePage": 3, "hint": "Look at section 3.", "explain": "Adaptation did not mean simply reacting to nature; people reshaped materials and made choices."}, {"q": "What is domestication, as described in the book?", "choices": ["Selecting seeds and managing animals with desired traits over many generations", "Writing down farming instructions for the first time", "Building the first permanent stone cities"], "answer": 0, "evidencePage": 5, "hint": "Look at section 5.", "explain": "Domestication happened independently in several parts of the world and involved experimentation over many generations."}, {"q": "What could a food surplus support, according to the book?", "choices": ["Only the ruler's personal household", "Specialists such as potters and builders", "Nothing, since all surplus was traded away"], "answer": 1, "evidencePage": 6, "hint": "Look at section 6.", "explain": "When harvests produced more food than needed, the surplus could support specialists such as potters and builders."}], "grammar": [{"q": "Which sentence uses a relative pronoun correctly, like the book does?", "choices": ["Researchers compare many kinds of evidence before proposing an explanation, what can change with new discoveries.", "Researchers compare many kinds of evidence before proposing an explanation, it can change with new discoveries.", "Researchers compare many kinds of evidence before proposing an explanation, which can change with new discoveries."], "answer": 2, "evidencePage": 1, "hint": "Look for the word that introduces extra information about the explanation.", "explain": "\"Which\" is a relative pronoun that introduces extra information about something already named.", "teach": "A <b>relative pronoun</b> like <b>which</b> introduces extra information about a noun already mentioned, without starting a brand-new sentence.<span class='cn'>像 <b>which</b> 这样的关系代词，用来给前面提到的名词补充说明，而不需要另起一个新句子。</span>"}, {"q": "Which sentence keeps parallel structure, like the book's list of what archaeologists study?", "choices": ["Archaeologists examine stone tools, hearths, bones, and how footprints look.", "Archaeologists examine stone tools, hearths, bones, and footprints.", "Archaeologists examine stone tools, hearths, having bones, and footprints."], "answer": 1, "evidencePage": 1, "hint": "Every item in the list should have the same grammatical form.", "explain": "Parallel structure means every item in a list matches the same grammatical form, here all simple nouns.", "teach": "<b>Parallel structure</b> means every item in a list uses the same grammatical form, like the book's list of stone tools, hearths, bones, and footprints.<span class='cn'><b>平行结构</b>指的是列举的每一项都用相同的语法形式，就像书中列举的石器、灶坑、骨头和脚印一样。</span>"}, {"q": "Which sentence uses a semicolon correctly, like the book does?", "choices": ["Some continued mobile lifeways; others stayed longer near dependable water.", "Some continued mobile lifeways, others stayed longer near dependable water.", "Some continued mobile lifeways; and others stayed longer near dependable water."], "answer": 0, "evidencePage": 4, "hint": "A semicolon joins two complete sentences without a joining word.", "explain": "A semicolon can join two closely related complete sentences without a word like \"and.\"", "teach": "A <b>semicolon</b> joins two complete, closely related sentences without a word like \"and,\" similar to how the book compares different community responses.<span class='cn'><b>分号</b>可以连接两个意思相关、语法完整的句子，不需要\"and\"这样的连接词，就像书里比较不同社群做法的句子一样。</span>"}], "vocabulary": [{"q": "In this book, what does \"domestication\" mean?", "choices": ["Writing down laws for the first time", "Building the first cities along a river", "Selecting and managing plants or animals with desired traits over generations"], "answer": 2, "evidencePage": 5, "hint": "Look at section 5.", "explain": "Domestication is the process of selecting seeds and managing animals with desired traits over many generations."}, {"q": "In this book, what is a \"surplus\"?", "choices": ["A tool made from stone or bone", "More food than a community immediately needs", "A type of seasonal migration"], "answer": 1, "evidencePage": 6, "hint": "Look at section 6.", "explain": "When harvests produced more food than people immediately needed, that surplus could be stored or exchanged."}, {"q": "In this book, what do \"archaeologists\" study?", "choices": ["Physical evidence like tools, bones, and shelters from the human past", "Only modern population statistics", "Only written government records"], "answer": 0, "evidencePage": 1, "hint": "Look at section 1.", "explain": "Archaeologists examine stone tools, hearths, bones, footprints, plant remains, shelters, and art."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Social Studies",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(archaeologists|domestication|surplus)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 6 Social Studies</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function saveProgress(){try{localStorage.setItem("les-from-hunters-to-farmers-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="from-hunters-to-farmers"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"from-hunters-to-farmers",bookTitle:"From Hunters to Farmers",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

function pickVoice(){const voices=speechSynthesis.getVoices();if(!voices.length)return;const en=voices.filter(v=>/^en(-|_|$)/i.test(v.lang));const pool=en.length?en:voices;const score=v=>{let s=0;const n=(v.name||"").toLowerCase();if(/natural/.test(n))s+=8;if(/neural/.test(n))s+=6;if(/online/.test(n))s+=4;if(/google/.test(n))s+=5;if(/(aria|jenny|guy|libby|sonia|michelle|ava|andrew|emma|clara|natasha)/.test(n))s+=5;if(/(samantha|allison|karen|serena|siri|nicky|aaron)/.test(n))s+=4;if(v.localService===false)s+=3;if(/en-us|en-gb/i.test(v.lang))s+=1;if(/(zira|david|mark|hazel|compact|espeak|eloquence)/.test(n))s-=5;return s};pool.sort((a,b)=>score(b)-score(a));preferredVoice=pool[0]||null}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w. function setStatus(m,ok){var el=document.getElementById("recStatus");if(el){el.textContent=m;el.style.color=ok?"#1f8f4d":"#b23b34";}}async function toggleRecording(){const btn=document.getElementById("recordPageBtn");if(recorder&&recorder.state==="recording"){recorder.stop();btn.textContent="🎙 Record";btn.classList.remove("recording");return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setStatus("Recording works only on the published website — the microphone is turned off in this preview.",false);return}if(typeof MediaRecorder==="undefined"){setStatus("This browser can't record audio. Try Chrome/Edge, or Safari 14+.",false);return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});let opts={};if(MediaRecorder.isTypeSupported){if(MediaRecorder.isTypeSupported("audio/webm"))opts={mimeType:"audio/webm"};else if(MediaRecorder.isTypeSupported("audio/mp4"))opts={mimeType:"audio/mp4"};}chunks=[];recorder=new MediaRecorder(stream,opts);recorder.ondataavailable=e=>{if(e.data&&e.data.size>0)chunks.push(e.data)};recorder.onstop=()=>{if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(new Blob(chunks,{type:(recorder.mimeType||"audio/webm")}));document.getElementById("playRecordingBtn").disabled=false;document.getElementById("deleteRecordingBtn").disabled=false;setStatus("Saved! Tap ▶ Play to hear your reading.",true);stream.getTracks().forEach(t=>t.stop())};recorder.start();btn.textContent="■ Stop";btn.classList.add("recording");setStatus("Recording… tap ■ Stop when you finish.",true)}catch(e){var n=(e&&e.name)?e.name:String(e);if(n==="NotAllowedError"||n==="SecurityError"){setStatus("Microphone blocked. In the chat preview the mic is always off — use the live website, then tap Allow (or click 🔒 in the address bar → allow Microphone → reload).",false);}else if(n==="NotFoundError"){setStatus("No microphone found on this device.",false);}else{setStatus("Could not record ("+n+"). Use the live website in Chrome/Edge/Safa
