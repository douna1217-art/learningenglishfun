<script>

const pages=[{"type": "cover", "title": "City of Many Arrivals", "subtitle": "Los Angeles grew through migration, investment, work, and unequal choices.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/city-of-many-arrivals-assets/cover.jpg"}, {"text": "1. A City Begins Before the City\nMaya and Julian studied a map of the Los Angeles basin. Long before a city used that name, Tongva communities lived across the basin and islands. Villages, trade routes, languages, and careful use of plants and water connected people to a homeland that remains important to Tongva people today.\nSpanish colonists founded El Pueblo de la Reina de los Angeles in 1781. The pueblo depended on Indigenous knowledge and labor, nearby river water, farming, ranching, and roads to missions and presidios. Later Mexican rule changed government and landholding. The students began with a key idea: a growing city did not begin on empty land.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/city-of-many-arrivals-assets/page1.jpg"}, {"text": "2. Railroads Change Distance\nIn the late 1800s, railroads connected Los Angeles more closely to other California cities and the nation. Trains carried citrus, manufactured goods, building materials, mail, visitors, and migrants. Competing rail companies sometimes lowered fares, making travel west less expensive for a time.\nBusiness leaders advertised sunshine, jobs, and land. New residents bought lots and built neighborhoods, while workers laid track, picked fruit, constructed buildings, and handled freight. Growth came from many decisions and many kinds of labor. It also raised land prices and increased pressure on water, transportation, and public services.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/city-of-many-arrivals-assets/page2.jpg"}, {"text": "3. People Move for Different Reasons\nPeople arrived from other states and many parts of the world. Mexican and Mexican American families had deep roots in the region. Chinese, Japanese, Black, European, and later Filipino migrants built businesses, farms, institutions, and neighborhoods. Some came for work or family; others sought safety, land, or opportunity.\nMigration stories were not identical. Laws restricted Chinese immigration. Racial covenants and discrimination limited where many families could buy or rent. Some Mexican and Mexican American residents lost land or faced removal campaigns. A city could welcome investment while denying equal belonging to the people whose work helped it grow.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/city-of-many-arrivals-assets/page3.jpg"}, {"text": "4. Water Makes Expansion Possible\nLocal rainfall and the Los Angeles River could not supply every plan for rapid growth. City leaders supported an aqueduct that began delivering water from the Owens Valley in 1913. More reliable water supported homes, farms, businesses, and a much larger population.\nThe project also redirected water away from another region. Owens Valley farmers and Paiute communities experienced loss and environmental change, and many challenged the decisions. Julian placed two notes on the same map: water created opportunity in Los Angeles, and the transfer imposed costs elsewhere. Both belonged in the explanation.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/city-of-many-arrivals-assets/page4.jpg"}, {"text": "5. Streets, Cars, and Neighborhoods Spread\nStreetcars once linked downtown Los Angeles with many surrounding communities. Later, automobiles, roads, and freeways encouraged development across a wider area. Housing tracts, stores, schools, studios, and factories spread outward. Travel patterns shaped where people lived and where businesses invested.\nTransportation choices did not affect everyone equally. Some freeway projects divided established Black, Mexican American, and other neighborhoods. Families lost homes and local businesses. Residents organized, documented harm, and demanded a voice. Infrastructure could connect a region while damaging particular communities along its route.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/city-of-many-arrivals-assets/page5.jpg"}, {"text": "6. Communities Build More Than Buildings\nResidents created churches, temples, mutual-aid groups, newspapers, unions, cultural centers, schools, and small businesses. These institutions helped newcomers find work, preserve languages and traditions, solve problems, and challenge discrimination. Community networks were part of city growth, even when official maps ignored them.\nPeople also organized for fair housing, school access, safer working conditions, and political representation. Their efforts changed laws and public decisions over time. Maya realized that population totals and skyscraper heights could not fully measure a city. Belonging, rights, and the strength of community institutions mattered too.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/city-of-many-arrivals-assets/page6.jpg"}, {"text": "7. Growth Is a Chain of Choices\nMaya and Julian built a cause-and-effect chain: rail connections encouraged migration and trade; jobs and advertising drew residents; water systems and transportation supported expansion; land rules and public projects shaped who benefited. Community action challenged some barriers and created new institutions.\nLos Angeles did not grow because of one person or one event. Geography offered possibilities, but people made choices about investment, labor, water, land, and rights. A responsible city history asks not only how fast a place grew, but also who built it, whose homeland changed, who gained access, and who organized for fairer outcomes.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/city-of-many-arrivals-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "Who lived across the Los Angeles basin before the city was founded?", "choices": ["Spanish colonists", "French traders", "Tongva communities"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Tongva communities lived across the Los Angeles basin and islands before the city was founded."}, {"q": "What did Spanish colonists found in 1781?", "choices": ["El Pueblo de la Reina de los Angeles", "The Los Angeles Aqueduct", "A railroad company"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Spanish colonists founded El Pueblo de la Reina de los Angeles in 1781."}, {"q": "What did railroads carry to Los Angeles in the late 1800s?", "choices": ["Only mail", "Citrus, manufactured goods, building materials, mail, visitors, and migrants", "Nothing, the railroads were empty"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Railroads carried citrus, manufactured goods, building materials, mail, visitors, and migrants."}, {"q": "When did the Los Angeles Aqueduct begin delivering water from the Owens Valley?", "choices": ["1781", "1850", "1913"], "answer": 2, "evidencePage": 4, "hint": "Look at page 4.", "explain": "The Los Angeles Aqueduct began delivering water from the Owens Valley in 1913."}, {"q": "What is the big idea of this story?", "choices": ["Los Angeles grew through migration, investment, work, and unequal choices, and understanding its growth means asking who benefited and who bore the costs", "Los Angeles grew because of a single event", "Every group in Los Angeles benefited equally from the city's growth"], "answer": 0, "evidencePage": 7, "hint": "Look at the last page.", "explain": "Los Angeles grew through migration, investment, work, and unequal choices."}], "grammar": [{"q": "Which sentence correctly uses 'while' to show two things happening at the same time?", "choices": ["New residents bought lots and built neighborhoods while, workers laid track, picked fruit, constructed buildings, and handled freight.", "New residents bought lots and built neighborhoods while workers, laid track, picked fruit, constructed buildings, and handled freight.", "New residents bought lots and built neighborhoods, while workers laid track, picked fruit, constructed buildings, and handled freight."], "answer": 2, "evidencePage": 2, "hint": "The comma goes right before 'while'.", "explain": "A comma goes right before 'while' when showing two things happening at the same time.", "teach": "Put a <b>comma</b> right before <b>while</b> when showing two things happening at the <b>same time</b>.<span class='cn'>用<b>while</b>表示两件事<b>同时</b>发生时，逗号放在while前面。</span>"}, {"q": "Which sentence correctly uses 'but' to show a contrast?", "choices": ["Geography offered possibilities, but people made choices about investment, labor, water, land, and rights.", "Geography offered possibilities but, people made choices about investment, labor, water, land, and rights.", "Geography, offered possibilities but people made choices about investment, labor, water, land, and rights."], "answer": 0, "evidencePage": 7, "hint": "The comma goes right before 'but'.", "explain": "A comma goes right before 'but' when it joins two contrasting ideas.", "teach": "Put a <b>comma</b> right before <b>but</b> when joining two <b>contrasting</b> ideas.<span class='cn'>用<b>but</b>连接两个<b>对比</b>的观点时，逗号放在but前面。</span>"}, {"q": "Which sentence correctly uses 'but' to show a contrast?", "choices": ["A responsible city history asks not only how fast a place grew but, also who built it.", "A responsible city history asks not only how fast a place grew, but also who built it.", "A responsible city history, asks not only how fast a place grew but also who built it."], "answer": 1, "evidencePage": 7, "hint": "The comma goes right before 'but'.", "explain": "A comma goes right before 'but' when it joins two contrasting ideas.", "teach": "Put a <b>comma</b> right before <b>but</b> when joining two <b>contrasting</b> ideas.<span class='cn'>用<b>but</b>连接两个<b>对比</b>的观点时，逗号放在but前面。</span>"}], "vocabulary": [{"q": "'Migrate' means ___.", "choices": ["to stay in one place forever", "to build a railroad", "to move from one place to live in another"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "To migrate means to move from one place to live in another."}, {"q": "'Discrimination' means ___.", "choices": ["unfair treatment of a person or group based on identity", "a type of railroad ticket", "a friendly welcome to newcomers"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Discrimination is unfair treatment of a person or group based on identity."}, {"q": "'Infrastructure' means ___.", "choices": ["a type of migration", "the basic physical systems a community needs, like roads, water, and power", "a kind of neighborhood festival"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Infrastructure is the basic physical systems a community needs, like roads, water, and power."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Social Studies",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(migrate|discrimination|infrastructure)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 4 Social Studies</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function saveProgress(){try{localStorage.setItem("les-city-of-many-arrivals-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="city-of-many-arrivals"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"city-of-many-arrivals",bookTitle:"City of Many Arrivals",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.
