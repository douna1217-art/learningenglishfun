<script>

const pages=[{"type": "cover", "title": "After Victory, What Changed?", "subtitle": "Independence brought new governments, unpaid costs, contested land, and unfinished liberty.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/after-victory-what-changed-assets/cover.jpg"}, {"text": "1. Victory Did Not Erase the Bills\nThe Revolutionary War ended with independence, but the new nation inherited large debts. Congress and state governments had borrowed money and issued paper currency. As prices rose, families found that wages and savings bought less. Soldiers sometimes waited months or years for promised pay.\nLaila opened a ledger with two columns: victory and cost. Independence belonged in the first column. Debt, damaged farms, disrupted trade, and uncertain payment belonged in the second. Theo saw that a political outcome could be celebrated while its economic consequences remained difficult.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/after-victory-what-changed-assets/page1.jpg"}, {"text": "2. Families Carry Wartime Hardship\nWar reached beyond battlefields. Families lost workers, crops, homes, tools, and access to markets. Shortages and inflation made food, cloth, salt, and other necessities expensive. State laws tried to limit hoarding and profiteering, but enforcement was uneven and people argued over what counted as a fair price.\nWomen managed farms, shops, and households while relatives served or fled. Free and enslaved workers faced different risks and choices. Loyalist families could lose property or leave their communities. Theo concluded that the cost of war depended on a person’s location, legal status, wealth, race, and political allegiance.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/after-victory-what-changed-assets/page2.jpg"}, {"text": "3. States Write New Constitutions\nAfter 1776, states wrote constitutions that replaced royal authority with republican government. Many created elected legislatures, separated powers, listed rights, and limited officeholders. The details varied because people disagreed about how much power governors, lawmakers, courts, and voters should have.\nThese documents put Revolutionary ideals into practice and offered examples for the later U.S. Constitution. Yet voting usually remained limited to men who met state rules, and rights were not equal in practice. Laila placed a transparent sheet over each plan to ask both questions: what power was changed, and who still lacked a voice?", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/after-victory-what-changed-assets/page3.jpg"}, {"text": "4. Congress Plans Western Lands\nThe national government hoped western land sales would raise money and organize settlement. The Land Ordinance of 1785 divided surveyed land into townships. The Northwest Ordinance of 1787 created a process for territories to become states, encouraged education, and prohibited slavery in the Northwest Territory.\nOn government maps, straight survey lines made land look orderly. On the ground, the region was already home to Native nations with governments, towns, farms, hunting grounds, and diplomatic relationships. Theo moved his balance toward the map: a policy could organize one government’s claims while violating another people’s land rights.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/after-victory-what-changed-assets/page4.jpg"}, {"text": "5. Land Was Not Empty\nU.S. officials negotiated, pressured, or imposed treaties to obtain land, but Native nations did not simply accept expansion. The Shawnee, Miami, Delaware, and other peoples formed alliances, defended homelands, traded, negotiated, and debated strategy. Their decisions reflected distinct interests rather than one shared response.\nSettlement and military conflict increased as U.S. land claims moved west. Some treaties were made under unequal conditions or later broken. Laila replaced the phrase available land with contested homeland. Accurate maps must show Native presence and sovereignty, not only the boundaries drawn by expanding states.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/after-victory-what-changed-assets/page5.jpg"}, {"text": "6. Revolutionary Ideals Challenge Slavery\nThe Declaration’s language about equality gave enslaved and free Black people another tool for challenging slavery. Individuals petitioned legislatures, pursued freedom suits, escaped, organized communities, and argued that slavery contradicted natural rights. Several northern states began gradual emancipation, and some enslavers freed individuals.\nChange was limited and uneven. Gradual laws could postpone freedom for years, and slavery remained powerful in the South while expanding westward. Enslaved people drove the struggle through their own actions; freedom was not simply granted by leaders. Theo wrote that an ideal matters partly because people can use it to expose injustice.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/after-victory-what-changed-assets/page6.jpg"}, {"text": "7. Measure Change and Continuity\nLaila and Theo completed four ledger sections. Families carried debt and hardship. State constitutions tested republican ideas. Federal land policies created paths to statehood while accelerating pressure on Native homelands. Revolutionary language encouraged antislavery action, but did not end slavery.\nTheir final claim avoided a simple before-and-after story. Independence changed sovereignty, laws, and political expectations. It did not distribute power, land, safety, or freedom equally. Historical thinking means measuring both transformation and continuity—and identifying the people whose choices pushed unfinished ideals forward.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/after-victory-what-changed-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did the new nation \"inherit\" along with independence?", "choices": ["a large treasury of gold", "a finished national constitution", "large debts from borrowed money and paper currency"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Congress and the states had borrowed money and issued paper currency; as prices rose, savings bought less, and soldiers often waited months or years for pay."}, {"q": "Whose labor kept farms, shops, and households running during the war, even when records credited others?", "choices": ["women, along with free and enslaved workers", "only government officials", "only soldiers on leave"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Women managed farms, shops, and households while relatives served or fled; the cost of war depended on a person's location, legal status, wealth, race, and allegiance."}, {"q": "After 1776, what did the new state constitutions generally do?", "choices": ["kept royal governors in charge", "replaced royal authority with republican government — elected legislatures, separated powers, and listed rights", "gave every adult an equal vote"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "States created elected legislatures, separated powers, and listed rights, though voting usually stayed limited to men who met state rules."}, {"q": "What did the Northwest Ordinance of 1787 do?", "choices": ["divided all western land into private ranches", "gave the western land back to Britain", "created a process for territories to become states, encouraged education, and prohibited slavery in the Northwest Territory"], "answer": 2, "evidencePage": 4, "hint": "Look at page 4.", "explain": "The Land Ordinance of 1785 surveyed land into townships; the Northwest Ordinance of 1787 set up a path to statehood, encouraged education, and banned slavery in that territory — on land already home to Native nations."}, {"q": "According to page 6, how did Revolutionary ideals about equality affect slavery?", "choices": ["enslaved and free Black people used that language to challenge slavery through petitions, freedom suits, and organizing — though change was limited and uneven", "they immediately ended slavery everywhere", "they had no effect on slavery at all"], "answer": 0, "evidencePage": 6, "hint": "Look at page 6.", "explain": "The Declaration's language became a tool; several northern states began gradual emancipation, but gradual laws could postpone freedom for years while slavery expanded westward."}], "grammar": [{"q": "\"Independence changed sovereignty; ___, it did not distribute power equally.\" Which transition fits the contrast?", "choices": ["therefore", "however", "meanwhile"], "answer": 1, "evidencePage": 7, "hint": "The second part pushes against the first.", "explain": "'However' signals that the next idea contrasts with the one before it.", "teach": "<b>However</b> signals a <b>contrast</b> with the sentence before: Independence changed the law<b>; however,</b> it did not share power equally.<span class='cn'><b>however</b> 表示与前句<b>相反</b>：...; however, it did not share power equally。</span>"}, {"q": "Which sentence correctly uses a dash to set off an added idea?", "choices": ["The war reached beyond battlefields families lost workers, crops, and homes.", "The war reached beyond battlefields, families lost workers crops and homes.", "The war reached beyond battlefields — families lost workers, crops, and homes."], "answer": 2, "evidencePage": 2, "hint": "A dash can introduce an explanation or a sharp addition.", "explain": "A dash can set off an added or explaining idea, giving it emphasis.", "teach": "A <b>dash (—)</b> can introduce an <b>explanation or emphasis</b>: The war reached beyond battlefields <b>—</b> families lost workers, crops, and homes.<span class='cn'><b>破折号 —</b> 可引出<b>解释或强调</b>：battlefields — families lost workers...</span>"}, {"q": "\"Enslaved people drove the struggle through ___ own actions.\" Which word shows the actions belong to them?", "choices": ["their", "there", "they're"], "answer": 0, "evidencePage": 6, "hint": "It shows possession — the actions belonging to a group.", "explain": "'Their' shows possession. 'There' is a place; 'they're' means 'they are.'", "teach": "<b>Their</b> = belonging to them (<b>their</b> own actions). <b>There</b> = a place. <b>They're</b> = they are.<span class='cn'><b>their</b> 表示“他们的”；<b>there</b> 表地点；<b>they're</b> = they are。</span>"}], "vocabulary": [{"q": "\"Debt\" is ___.", "choices": ["money a government prints", "money that is owed and must be paid back", "a tax on land"], "answer": 1, "evidencePage": 1, "hint": "The new nation inherited a large amount of it.", "explain": "A debt is an amount of money that is owed to someone and must be repaid."}, {"q": "\"Inflation\" is when ___.", "choices": ["a government wins a war", "the population of a city grows", "prices rise so money buys less than before"], "answer": 2, "evidencePage": 1, "hint": "Page 1 says families found wages and savings bought less.", "explain": "Inflation is a general rise in prices, which means each unit of money buys fewer goods."}, {"q": "A \"constitution\" is ___.", "choices": ["a plan of government that sets up how power is organized and lists rights", "a single elected leader", "a treaty between two countries"], "answer": 0, "evidencePage": 3, "hint": "The states each wrote one after 1776.", "explain": "A constitution is a written plan that establishes a government's structure, powers, and the rights of its people."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Social Studies",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(independence|debt|constitutions)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 5 Social Studies</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function saveProgress(){try{localStorage.setItem("les-after-victory-what-changed-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="after-victory-what-changed"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"after-victory-what-changed",bookTitle:"After Victory, What Changed?",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

function pickVoice(){const voices=speechSynthesis.getVoices();if(!voices.length)return;const en=voices.filter(v=>/^en(-|_|$)/i.test(v.lang));const pool=en.length?en:voices;const score=v=>{let s=0;const n=(v.name||"").toLowerCase();if(/natural/.test(n))s+=8;if(/neural/.test(n))s+=6;if(/online/.test(n))s+=4;if(/google/.test(n))s+=5;if(/(aria|jenny|guy|libby|sonia|michelle|ava|andrew|emma|clara|natasha)/.test(n))s+=5;if(/(samantha|allison|karen|serena|siri|nicky|aaron)/.test(n))s+=4;if(v.localService===false)s+=3;if(/en-us|en-gb/i.test(v.lang))s+=1;if(/(zira|david|mark|hazel|compact|espeak|eloquence)/.test(n))s-=5;return s};pool.sort((a,b)=>score(b)-score(a));preferredVoice=pool[0]||null}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w. function setStatus(m,ok){var el=document.getElementById("recStatus");if(el){el.textContent=m;el.style.color=ok?"#1f8f4d":"#b23b34";}}async function toggleRecording(){const btn=document.getElementById("recordPageBtn");if(recorder&&recorder.state==="recording"){recorder.stop();btn.textContent="🎙 Record";btn.classList.remove("recording");return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setStatus("Recording works only on the published website — the microphone is turned off in this preview.",false);return}if(typeof MediaRecorder==="undefined"){setStatus("This browser can't record audio. Try Chrome/Edge, or Safari 14+.",false);return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});let opts={};if(MediaRecorder.isTypeSupported){if(MediaRecorder.isTypeSupported("audio/webm"))opts={mimeType:"audio/webm"};else if(MediaRecorder.isTypeSupported("audio/mp4"))opts={mimeType:"audio/mp4"};}chunks=[];recorder=new MediaRecorder(stream,opts);recorder.ondataavailable=e=>{if(e.data&&e.data.size>0)chunks.push(e.data)};recorder.onstop=()=>{if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(new Blob(chunks,{type:(recorder.mimeType||"audio/webm")}));document.getElementById("playRecordingBtn").disabled=false;document.getElementById("deleteRecordingBtn").disabled=false;setStatus("Saved! Tap ▶ Play to hear your reading.",true);stream.getTracks().forEach(t=>t.stop())};recorder.start();btn.textContent="■ Stop";btn.classList.add("recording");setStatus("Recording… tap ■ Stop when you finish.",true)}catch(e){var n=(e&&e.name)?e.name:String(e);if(n==="NotAllowedError"||n==="SecurityError"){setStatus("Microphone blocked. In the chat preview the mic is always off — use the live website, then tap Allow (or click 🔒 in the address bar → allow Microphone → reload).",false);}else if(n==="NotFoundError"){setStatus("No microphone found on this device.",false);}else{setStatus("Could not record ("+n+"). Use the live website in Chrome/Edge/Safa
