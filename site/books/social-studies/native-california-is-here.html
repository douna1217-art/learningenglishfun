<script>

const pages=[{"type": "cover", "title": "Native California Is Here", "subtitle": "Many Nations, Many Homelands, and Living Communities—Not One Story from the Past", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/native-california-is-here-assets/cover.jpg"}, {"text": "1. More Than One Native California\nKai expected one chapter about “the California Indians.” Ms. Flores asked him to replace the singular idea with a living map. California is home to many distinct Native nations and communities, with different homelands, languages, governments, histories, and cultural practices. Their own names and descriptions should guide what students learn.\nA map can show approximate homelands, but it cannot contain everything. Boundaries shifted, people traveled and traded, and some communities were displaced. Today California has more federally recognized tribes than any other state, as well as Native communities without federal recognition. Native California belongs in present-tense sentences as well as historical ones.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/native-california-is-here-assets/page1.jpg"}, {"text": "2. Place Shapes Possibilities\nBefore European colonization, Native nations had already developed detailed knowledge of California's rivers, coasts, forests, valleys, mountains, and deserts. People harvested, cultivated, exchanged, and managed resources in ways suited to particular homelands. Fire, pruning, irrigation, fishing practices, seasonal movement, and selective gathering could shape ecosystems over generations.\nEnvironment did not create one automatic way of life. Nearby nations could speak different languages or organize communities differently, and distant nations could exchange useful ideas. Leila made two columns: what a place offered and what people knew how to do. The second column reminded her that adaptation requires observation, skill, responsibility, and decision-making.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/native-california-is-here-assets/page2.jpg"}, {"text": "3. Yurok River and Redwood Homelands\nYurok homelands include the lower Klamath River and nearby Pacific coast in northwestern California. River, ocean, and redwood environments supported fishing, travel, houses, tools, and trade. Knowledge of salmon runs and river conditions linked food systems with responsibilities to care for water and habitat.\nYurok people did not disappear when newcomers entered California. Colonization, violence, land loss, dams, and other policies caused deep harm, yet families maintained identity, knowledge, and community. The Yurok Tribe is a sovereign government today. Tribal departments work on issues such as river restoration, fisheries, language, culture, public safety, and services for citizens.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/native-california-is-here-assets/page3.jpg"}, {"text": "4. Chumash Coastal Knowledge\nChumash peoples' homelands extend along parts of the south-central California coast and Channel Islands. Ocean currents, island channels, coastal plants, and marine animals influenced travel, food systems, trade, and community life. Skilled builders made plank canoes, often called tomols, for journeys and exchange across ocean waters.\nA tomol shows how environment and technology connect: builders needed knowledge of wood, fiber, asphaltum, tools, waves, and navigation. It also shows why students should not reduce a nation to one object. Chumash communities include varied groups and histories, and Chumash people continue cultural, language, environmental, educational, and governmental work today.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/native-california-is-here-assets/page4.jpg"}, {"text": "5. Cahuilla Desert and Mountain Homelands\nCahuilla homelands include desert, canyon, and mountain environments in Southern California. Families used careful knowledge of springs, seasonal plants, agave, mesquite, oak groves, wildlife, and travel routes. Different elevations offered different resources, so movement and trade connected communities across environments that outsiders sometimes described as empty.\nThe desert required expertise, not merely endurance. Knowing where water could be found, when plants were ready, and how materials should be prepared made life possible. Cahuilla tribes and communities remain present today, exercising government authority, sustaining language and culture, managing lands and resources, and operating programs for their citizens.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/native-california-is-here-assets/page5.jpg"}, {"text": "6. Colonization Brought Disruption—and Survival\nSpanish missions, Mexican and United States rule, the Gold Rush, forced removals, violence, disease, boarding schools, and loss of land disrupted Native communities across California. The experiences were not identical, but the harms were widespread. Government records often described what officials wanted; Native oral histories and community knowledge reveal experiences those records ignored.\nSurvival does not mean the damage was small. It means people protected children, rebuilt communities, continued languages and practices, challenged unfair policies, and created new forms of organization. Kai crossed out the phrase “vanished culture.” In its place he wrote “continuity through change,” because a truthful history must hold both injustice and Native agency.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/native-california-is-here-assets/page6.jpg"}, {"text": "7. Learn with Nations, Not About a Single Past\nFor their final display, the students used three rules. Name the nation when possible. Use tribal sources and contemporary voices. Explain that knowledge, culture, and government continue. They also wrote that four examples could never represent every California Native community.\nMs. Flores pointed to the state's governance map. Cities, counties, school districts, the state, the federal government, and tribal governments may share borders or work together, but they do not have the same authority. Tribal sovereignty is part of California today. The living map was not finished—and that was its lesson. Responsible learning continues by listening to the people whose homelands the map describes.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/native-california-is-here-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did Ms. Flores ask Kai to replace the singular idea of 'the California Indians' with?", "choices": ["A living map showing many distinct Native nations", "A single timeline", "A blank page"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Ms. Flores asked him to replace the singular idea with a living map."}, {"q": "What do Yurok homelands include?", "choices": ["Only the desert", "The lower Klamath River and nearby Pacific coast in northwestern California", "Only Southern California mountains"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Yurok homelands include the lower Klamath River and nearby Pacific coast."}, {"q": "What did Chumash builders make for journeys and exchange across ocean waters?", "choices": ["Wooden bridges", "Stone canals", "Plank canoes, often called tomols"], "answer": 2, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Skilled builders made plank canoes, often called tomols."}, {"q": "What does 'continuity through change' mean, according to Kai?", "choices": ["Native communities protected children, rebuilt communities, and continued languages and practices despite injustice", "Native cultures completely vanished", "Nothing about Native communities changed"], "answer": 0, "evidencePage": 6, "hint": "Look at page 6.", "explain": "Kai wrote 'continuity through change' because a truthful history must hold both injustice and Native agency."}, {"q": "What is the big idea of this story?", "choices": ["California has only one Native nation", "Native California includes many distinct nations with living communities today, not just a story from the past", "Native nations no longer exist in California"], "answer": 1, "evidencePage": 7, "hint": "Look at the last page.", "explain": "Native California belongs in present-tense sentences as well as historical ones."}], "grammar": [{"q": "Which sentence correctly joins two complete ideas with a comma and 'but'?", "choices": ["A map can show homelands, but it cannot contain everything.", "A map can show homelands but, it cannot contain everything.", "A map can show homelands, but, it cannot contain everything."], "answer": 0, "evidencePage": 1, "hint": "Put the comma right before the joining word.", "explain": "A comma goes right before 'but' when joining two complete ideas.", "teach": "Put a <b>comma</b> right before a joining word like <b>but</b> when connecting two complete ideas.<span class='cn'>用逗号连接两个完整句子时，逗号放在连接词<b>but</b>前面。</span>"}, {"q": "Which sentence correctly joins two complete ideas with a comma and 'yet'?", "choices": ["Survival does not mean the damage was small yet.", "Survival does not mean the damage was small, yet it means people protected children.", "Survival, does not mean the damage was small yet it means people protected children."], "answer": 1, "evidencePage": 6, "hint": "Put the comma right before the joining word.", "explain": "A comma goes right before 'yet' when joining two complete ideas.", "teach": "Put a <b>comma</b> right before a joining word like <b>yet</b> when connecting two complete ideas.<span class='cn'>用逗号连接两个完整句子时，逗号放在连接词<b>yet</b>前面。</span>"}, {"q": "Which sentence correctly joins two complete ideas with a comma and 'so'?", "choices": ["Boundaries shifted so, people traveled and traded.", "Boundaries shifted, so people, traveled and traded.", "Boundaries shifted, so people traveled and traded."], "answer": 2, "evidencePage": 1, "hint": "Put the comma right before the joining word.", "explain": "A comma goes right before 'so' when joining two complete ideas.", "teach": "Put a <b>comma</b> right before a joining word like <b>so</b> when connecting two complete ideas.<span class='cn'>用逗号连接两个完整句子时，逗号放在连接词<b>so</b>前面。</span>"}], "vocabulary": [{"q": "'Sovereign' means ___.", "choices": ["having self-governing authority and independence", "controlled completely by another government", "having no government at all"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "The Yurok Tribe is a sovereign government today."}, {"q": "'Homeland' means ___.", "choices": ["a temporary campsite", "the land where a people or community originates and belongs", "a foreign country"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Native nations have different homelands, languages, governments, and histories."}, {"q": "'Displaced' means ___.", "choices": ["welcomed warmly into a new home", "given extra land", "forced to leave one's home or land"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Some communities were displaced as boundaries shifted."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(sovereign|homeland|displaced)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 4 Social Studies</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function saveProgress(){try{localStorage.setItem("les-native-california-is-here-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="native-california-is-here"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"native-california-is-here",bookTitle:"Native California Is Here",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

function pickVoice(){const voices=speechSynthesis.getVoices();if(!voices.length)return;const en=voices.filter(v=>/^en(-|_|$)/i.test(v.lang));const pool=en.length?en:voices;const score=v=>{let s=0;const n=(v.name||"").toLowerCase();if(/natural/.test(n))s+=8;if(/neural/.test(n))s+=6;if(/online/.test(n))s+=4;if(/google/.test(n))s+=5;if(/(aria|jenny|guy|libby|sonia|michelle|ava|andrew|emma|clara|natasha)/.test(n))s+=5;if(/(samantha|allison|karen|serena|siri|nicky|aaron)/.test(n))s+=4;if(v.localService===false)s+=3;if(/en-us|en-gb/i.test(v.lang))s+=1;if(/(zira|david|mark|hazel|compact|espeak|eloquence)/.test(n))s-=5;return s};pool.sort((a,b)=>score(b)-score(a));preferredVoice=pool[0]||null}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.
