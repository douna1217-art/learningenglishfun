const pages=[{"type": "cover", "title": "Gold Changed the River", "subtitle": "The Gold Rush Created Fortunes, Towns, Laws, Conflicts—and Costs That Flowed Far Downstream", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/gold-changed-the-river-assets/cover.jpg"}, {"text": "1. A Discovery Becomes a Rush\nIn January 1848, gold was discovered at Sutter's Mill in the Sierra Nevada foothills. News spread slowly at first, then raced across oceans and continents. By 1849, tens of thousands of people were traveling to California by ship, across Panama, around Cape Horn, and over difficult land routes.\nThe land was not empty. Native nations had lived in California for thousands of years. Mexican Californians, settlers, workers, and traders already occupied towns, ranchos, forts, and ports. The rush added newcomers from the United States, Latin America, Europe, China, Australia, and elsewhere. Each route involved different costs, dangers, and reasons for migration.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/gold-changed-the-river-assets/page1.jpg"}, {"text": "2. Mining Camps Become Towns\nMining camps appeared near rivers and diggings. Some vanished when gold became scarce; others grew into towns with stores, hotels, kitchens, laundries, stables, newspapers, and transportation services. Sacramento and San Francisco expanded rapidly as people and goods moved through them.\nMany people made steadier incomes by supplying miners rather than finding gold. Farmers, merchants, carpenters, cooks, teamsters, and ship workers became part of a new economy. Prices could be extremely high because demand rose faster than supplies. The rush connected distant farms, ports, manufacturers, and California markets.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/gold-changed-the-river-assets/page2.jpg"}, {"text": "3. Opportunity Was Unequal\nPeople from many backgrounds worked in mining regions, but laws and violence did not treat them equally. Foreign miners' taxes targeted miners from other countries, including many Mexican and Chinese workers. Discrimination, claim-jumping, and exclusion made success harder and less safe for groups without political power.\nWomen built businesses, managed property, practiced medicine, ran boardinghouses, taught, and organized communities. Biddy Mason arrived in California while enslaved, won her freedom in court in 1856, and became a successful Los Angeles midwife, property owner, and philanthropist. Her life shows that early California was built through struggles beyond the mining camps.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/gold-changed-the-river-assets/page3.jpg"}, {"text": "4. The River Becomes a Machine\nEarly miners used pans and rockers along streams. Larger operations later diverted water and blasted hillsides with powerful hydraulic hoses. Miners also used mercury to help separate gold. These methods increased production but sent mud, gravel, and toxic material downstream.\nRiver channels filled with sediment, fish habitat was damaged, and farmland and towns faced flooding. Mining altered forests and slopes as well as waterways. The Gold Rush demonstrates that an economic activity can create wealth for some people while shifting environmental costs to others who live far away or later in time.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/gold-changed-the-river-assets/page4.jpg"}, {"text": "5. Native Communities Bear the Greatest Costs\nThe Gold Rush brought invasion into Native homelands. Mining damaged food sources and waterways. New settlements took land, while disease, forced labor, removal, state-supported violence, and unfair laws devastated Native communities. California's Native population declined catastrophically during this period.\nNative people resisted, survived, protected families, maintained knowledge, and rebuilt communities, but survival does not lessen the injustice. A complete account cannot describe population growth and economic expansion without naming who lost land, safety, political power, and life. The same event can create opportunity for newcomers and disaster for people already there.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/gold-changed-the-river-assets/page5.jpg"}, {"text": "6. Statehood and New Government\nIn 1848, California passed from Mexican to United States control after the Mexican-American War. Rapid population growth pushed California toward statehood. In 1850, it entered the United States as the thirty-first state, with a constitution and a new state government.\nStatehood created courts, elected offices, and lawmaking institutions, but it did not guarantee equal rights or fair treatment. Laws reflected conflicts over land, race, labor, taxes, and citizenship. Diego added a note to his timeline: political change can happen quickly, while building justice may take far longer.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/gold-changed-the-river-assets/page6.jpg"}, {"text": "7. Measuring Change Honestly\nAmara's evidence wheel had four sections: people, economy, government, and environment. Every section connected to the others. More migrants increased demand for goods and government. Mining growth expanded towns. New laws shaped whose work and claims were protected. Environmental damage changed farms, fisheries, and communities.\nThe students refused to label the Gold Rush simply good or bad. Instead, they wrote: “It produced rapid growth and innovation, unequal opportunities, discriminatory policies, severe Native dispossession, and lasting environmental change.” Historical thinking required them to name the scale, ask who experienced each effect, and follow consequences downstream.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/social-studies/gold-changed-the-river-assets/page7.jpg"}];

oks worked in town.", "Farmers merchants, and, cooks worked in town."], "answer": 1, "evidencePage": 2, "hint": "Use a comma after each item in a list, before 'and'.", "explain": "Commas separate each item in the list, including before 'and'.", "teach": "Use a <b>comma</b> after each item in a list, including before <b>and</b>: farmers, merchants, and cooks.<span class='cn'>列举事物时，每一项后都用<b>逗号</b>，包括and前面：farmers, merchants, and cooks(农民、商人和厨师)。</span>"}, {"q": "Which sentence correctly uses commas in a list?", "choices": ["The rush added newcomers from the United States Latin America and Europe.", "The rush added newcomers from the United States Latin America, and Europe.", "The rush added newcomers from the United States, Latin America, and Europe."], "answer": 2, "evidencePage": 1, "hint": "Use a comma after each item in a list, before 'and'.", "explain": "Commas separate each place in the list.", "teach": "Use a <b>comma</b> after each item in a list, including before <b>and</b>.<span class='cn'>列举事物时，每一项后都用<b>逗号</b>，包括and前面。</span>"}, {"q": "Which sentence correctly uses commas in a list?", "choices": ["Mining altered forests, slopes, and waterways.", "Mining altered forests slopes and waterways.", "Mining altered, forests slopes and waterways."], "answer": 0, "evidencePage": 4, "hint": "Use a comma after each item in a list, before 'and'.", "explain": "Commas separate 'forests,' 'slopes,' and 'waterways.'", "teach": "Use a <b>comma</b> after each item in a list, including before <b>and</b>.<span class='cn'>列举事物时，每一项后都用<b>逗号</b>，包括and前面。</span>"}], "vocabulary": [{"q": "'Discrimination' means ___.", "choices": ["treating everyone exactly the same", "unfair treatment of a person or group based on who they are", "a type of gold mining tool"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Discrimination made success harder and less safe for groups without political power."}, {"q": "'Migration' means ___.", "choices": ["a type of river", "staying in one place forever", "the movement of people from one place to another"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Each route involved different costs, dangers, and reasons for migration."}, {"q": "'Devastate' means ___.", "choices": ["to cause severe harm or destruction", "to celebrate a success", "to build something new"], "answer": 0, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Disease, forced labor, and unfair laws devastated Native communities."}]};

function saveProgress(){try{localStorage.setItem("les-gold-changed-the-river-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="gold-changed-the-river"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"gold-changed-the-river",bookTitle:"Gold Changed the River",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

function pickVoice(){const voices=speechSynthesis.getVoices();if(!voices.length)return;const en=voices.filter(v=>/^en(-|_|$)/i.test(v.lang));const pool=en.length?en:voices;const score=v=>{let s=0;const n=(v.name||"").toLowerCase();if(/natural/.test(n))s+=8;if(/neural/.test(n))s+=6;if(/online/.test(n))s+=4;if(/google/.test(n))s+=5;if(/(aria|jenny|guy|libby|sonia|michelle|ava|andrew|emma|clara|natasha)/.test(n))s+=5;if(/(samantha|allison|karen|serena|siri|nicky|aaron)/.test(n))s+=4;if(v.localService===false)s+=3;if(/en-us|en-gb/i.test(v.lang))s+=1;if(/(zira|david|mark|hazel|compact|espeak|eloquence)/.test(n))s-=5;return s};pool.sort((a,b)=>score(b)-score(a));preferredVoice=pool[0]||null}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.
