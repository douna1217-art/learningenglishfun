function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(credit|idea|fair|kind)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 1 Computer Science</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

function selectAnswer(i){selections[activeTab+"-"+qIndex[activeTab]]=i;renderPanel()}

function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}

function showCompletion(){completed.vocabulary=true;setTabs();const correct=Object.keys(selections).filter(k=>{const [tab,idx]=k.split('-');return selections[k]===quizzes[tab][+idx].answer}).length,total=Object.values(quizzes).reduce((a,b)=>a+b.length,0);document.getElementById("stagePill").textContent="Journey Complete";document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">Reading journey complete</div><h2>Wonderful work! 🎉</h2><p class="small">You finished Reading, Grammar, and Vocabulary.</p><div class="score-row"><div class="score-box"><b>${total}</b><br><span>Questions</span></div><div class="score-box"><b>${correct}</b><br><span>Correct now</span></div></div><div class="feedback good">You used evidence, practiced sentence skills, and learned new words.</div><button class="submit" onclick="restartPractice()">Practice Again</button></div>`}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var frac=a.currentTime/dur,idx=0,j;for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.ad
