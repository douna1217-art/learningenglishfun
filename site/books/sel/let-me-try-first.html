n{font-size:.84rem;color:#ddd4e8}.evidence-banner button{border:0;border-radius:10px;padding:9px 12px;background:#fff;color:var(--purple);font-weight:950;cursor:pointer}.footer{text-align:center;color:var(--muted);font-size:.8rem;padding:13px}

<script>

const pages=[{"type": "cover", "title": "Let Me Try First", "subtitle": "A Story About Helping That Begins by Asking", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/let-me-try-first-assets/cover.jpg"}, {"text": "Maya's class was making a giant ocean collage. Maya planned a silver school of fish. She arranged paper on her lap and reached toward the art tools beside the blue sea.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/let-me-try-first-assets/page1.jpg"}, {"text": "Leo lifted a large blue piece and hurried to help. ‘I can put this on for you,’ he said. He held it over Maya's design before she could answer. Maya's shoulders tightened.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/let-me-try-first-assets/page2.jpg"}, {"text": "‘Please wait,’ Maya said. ‘I want to try my plan first.’ Leo stopped. He had meant to be helpful, but he had made the choice for her. He set the piece down and listened.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/let-me-try-first-assets/page3.jpg"}, {"text": "Maya explained where she wanted each fish to swim. ‘You can ask if I want help,’ she said. ‘Then listen to my answer.’ Leo nodded. Helping should not mean taking over.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/let-me-try-first-assets/page4.jpg"}, {"text": "Maya tested a long-handled tool to move the wide wave. She pulled, turned, and lined up the paper. Leo waited nearby. At last, the wave fit exactly where Maya had imagined it.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/let-me-try-first-assets/page5.jpg"}, {"text": "One finished panel needed to go on the display shelf. Maya tried, then asked, ‘Leo, will you carry it while I show you where?’ Leo followed her directions and changed nothing else.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/let-me-try-first-assets/page6.jpg"}, {"text": "At sharing time, Maya described their sparkling sea. Leo had learned that helping did not mean taking over. Ask first. Listen to the answer. Then help in the way the person chooses.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/let-me-try-first-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did Leo do when he saw Maya reaching for the art tools?", "choices": ["he lifted a piece and put it on her design before she could answer", "he asked Maya if she wanted help first", "he waited quietly until she asked for help"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Leo lifted a large blue piece and held it over Maya's design before she could answer."}, {"q": "What did Maya ask Leo to do?", "choices": ["wait, because she wanted to try her plan first", "leave the classroom", "finish the whole collage for her"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Maya said, “Please wait. I want to try my plan first.”"}, {"q": "What did Maya explain that Leo should do instead?", "choices": ["ask if she wants help, then listen to her answer", "always do the task without asking", "never offer to help at all"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Maya said, “You can ask if I want help. Then listen to my answer.”"}, {"q": "How did Leo help later, when Maya actually needed it?", "choices": ["she asked him to carry the panel while she showed him where, and he followed her directions", "he grabbed the panel and moved it his own way", "he refused to help at all"], "answer": 0, "evidencePage": 6, "hint": "Look at page 6.", "explain": "Maya asked, “Leo, will you carry it while I show you where?” and Leo followed her directions and changed nothing else."}, {"q": "What is the big idea of this story?", "choices": ["Helping begins by asking first, listening to the answer, then helping the way the person chooses", "The fastest way to help is to just take over the task", "Asking before helping wastes time"], "answer": 0, "evidencePage": 7, "hint": "Look at the last page.", "explain": "Ask first. Listen to the answer. Then help in the way the person chooses."}], "grammar": [{"q": "“Leo ___ a large blue piece.” Which is the past tense of ‘lift’?", "choices": ["lifted", "lift", "lifting"], "answer": 0, "evidencePage": 2, "hint": "Add -ed to show something already happened.", "explain": "“Lifted” (-ed) shows Leo already picked up the piece.", "teach": "Add <b>-ed</b> to show an action <b>already happened</b>: Leo <b>lifted</b> the piece. <b>lift</b> is the plain, present form; <b>lifting</b> (-ing) needs a helper word like 'was.'<span class='cn'>加 <b>-ed</b> 表示动作<b>已经发生</b>：lifted(已经举起)。<b>lift</b> 是现在式；<b>lifting</b>(-ing)要配 was 等助词。</span>"}, {"q": "“He had meant to be helpful, ___ he had made the choice for her.” Which word shows contrast?", "choices": ["but", "and", "so"], "answer": 0, "evidencePage": 3, "hint": "This word connects two different, opposite ideas.", "explain": "“But” connects two contrasting ideas — he meant to help, but he took over instead.", "teach": "<b>But</b> joins two ideas that are <b>different or opposite</b>: meant to help, <b>but</b> made the choice for her. <b>and</b> joins similar ideas, and <b>so</b> shows a result.<span class='cn'><b>but</b>(但是)连接两个<b>相反</b>的想法。<b>and</b>(和)连接相似想法，<b>so</b>(所以)表示结果。</span>"}, {"q": "“Ask first. Listen to the answer. ___ help in the way the person chooses.” Which word shows what happens last?", "choices": ["Then", "Never", "Sometimes"], "answer": 0, "evidencePage": 7, "hint": "This word shows the last step in the order.", "explain": "“Then” shows the third and final step: ask, listen, then help.", "teach": "<b>Then</b> shows what comes <b>next</b> in a series of steps: ask, listen, <b>then</b> help. <b>never</b> and <b>sometimes</b> don't show a step-by-step order.<span class='cn'><b>then</b>(然后)表示步骤中的<b>下一步</b>：ask, listen, then help。<b>never</b>(从不)、<b>sometimes</b>(有时)不表示顺序。</span>"}], "vocabulary": [{"q": "A “collage” is ___.", "choices": ["a piece of art made by putting different pieces of paper or material together", "a type of ocean animal", "a musical instrument"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "A collage is a piece of art made by putting different pieces of paper or material together."}, {"q": "If your shoulders “tighten,” it usually means ___.", "choices": ["your body feels tense, often because you're uncomfortable or upset", "you feel completely relaxed", "you are about to fall asleep"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Tightened shoulders usually show tension, often because you're uncomfortable or upset — like Maya felt when Leo took over."}, {"q": "To “take over” a task means to ___.", "choices": ["do it yourself instead of letting the other person do it", "ask before starting", "wait patiently for your turn"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "To take over means to do it yourself instead of letting the other person do it, which is what Leo learned not to do."}]};

let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"SEL",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(collage|tighten|helpful|listen|design|directions|ask)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 2 SEL</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}
function selectAnswer(i){selections[activeTab+"-"+qIndex[activeTab]]=i;renderPanel()}

function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}function playTeachAudio(key,part,fallbackText,fallbackLang){try{var store=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[key];if(store&&store[part]){var a=new Audio(store[part]);a.play();return;}}catch(e){}speakText(fallbackText,fallbackLang);}function renderTeach(teachHtml,key){var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+='<button style="border:0;background:#e2483f;color:#fff;cursor:pointer;font-size:.8em;line-height:1;vertical-align:middle;padding:0;margin-right:6px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;width:1.9em;height:1.9em;box-shadow:0 2px 6px rgba(226,72,63,.35)" data-key="'+key+'" data-part="en" data-text="'+escAttr(enText)+'" data-lang="en-US" onclick="playTeachAudio(this.dataset.key,this.dataset.part,this.dataset.text,this.dataset.lang)" aria-label="Listen in English" title="Listen in English">\uD83D\uDD0A</button> '+enHtml;if(cnHtml){out+='<span class="cn"><button style="border:0;background:#e2483f;color:#fff;cursor:pointer;font-size:.8em;line-height:1;vertical-align:middle;padding:0;margin-right:6px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;width:1.9em;height:1.9em;box-shadow:0 2px 6px rgba(226,72,63,.35)" data-key="'+key+'" data-part="cn" data-text="'+escAttr(cnText)+'" data-lang="zh-CN" onclick="playTeachAudio(this.dataset.key,this.dataset.part,this.dataset.text,this.dataset.lang)" aria-label="\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3" tit function pickVoice(){const voices=speechSynthesis.getVoices();if(!voices.length)return;const en=voices.filter(v=>/^en(-|_|$)/i.test(v.lang));const pool=en.length?en:voices;const score=v=>{let s=0;const n=(v.name||"").toLowerCase();if(/natural/.test(n))s+=8;if(/neural/.test(n))s+=6;if(/online/.test(n))s+=4;if(/google/.test(n))s+=5;if(/(aria|jenny|guy|libby|sonia|michelle|ava|andrew|emma|clara|natasha)/.test(n))s+=5;if(/(samantha|allison|karen|serena|siri|nicky|aaron)/.test(n))s+=4;if(v.localService===false)s+=3;if(/en-us|en-gb/i.test(v.lang))s+=1;if(/(zira|david|mark|hazel|compact|espeak|eloquence)/.test(n))s-=5;return s};pool.sort((a,b)=>score(b)-score(a));preferredVoice=pool[0]||null}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var frac=rvRemapFrac(a.currentTime/dur,marks),idx=0,j;for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.i);},at));});};}let advanced=false;const advance=()=>{if(advanced)return;advanced=true;if(watchdog)clearTimeout(watchdog);ci++;speakChunk();};u.onend=advance;u.onerror=advance;const estDur=Math.max(1200,chunk.text.length*110);const watchdog=setTimeout(advance,estDur+4000);s
