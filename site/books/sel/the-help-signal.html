 16px;display:flex;align-items:center;gap:14px;box-shadow:0 14px 38px rgba(111,74,182,.24);border:1px solid rgba(255,255,255,.32)}.evidence-banner strong{text-shadow:0 1px 6px rgba(60,35,110,.35)}.evidence-banner span{font-size:.84rem;color:#fff}.evidence-banner button{border:0;border-radius:10px;padding:9px 12px;background:rgba(255,255,255,.92);color:var(--purple);font-weight:950;cursor:pointer}.footer{text-align:center;color:var(--muted);font-size:.8rem;padding:13px}

<section class="audio-bar"><div class="audio-copy"><strong>Listen, read, and record</strong><span>Narration highlights each word. Recordings stay only in this browser session.</span></div><div class="audio-actions"><button class="audio-btn primary" id="listenPageBtn">🔊 This Page</button><button class="audio-btn" id="listenStoryBtn">📖 Full Story</button><button class="audio-btn" id="pauseBtn" disabled>⏸ Pause</button><button class="audio-btn record" id="recordPageBtn">🎙 Record</button><button class="audio-btn" id="playRecordingBtn" disabled>▶ Play</button><button class="audio-btn" id="deleteRecordingBtn" disabled>🗑 Delete</button></div><div id="recStatus" class="rec-status" aria-live="polite"></div></section>

<script>

const pages=[{"type": "cover", "title": "The Help Signal", "subtitle": "Asking for Support Can Be One Step Inside a Capable Plan", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-help-signal-assets/cover.jpg"}, {"text": "1. Again and Again\nArjun programmed the rover to follow the orange route mat. At the first turn, its silver body rolled straight off the line. He changed the speed and tried again. The rover left the mat at the same place.\nArjun told Wren he did not need help. He wanted to prove he could solve the problem independently. After six more trials, he was changing numbers without recording them. Effort remained high, but new information had stopped.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-help-signal-assets/page1.jpg"}, {"text": "2. Productive or Stuck?\nMr. Chen had posted three signs of productive struggle: you can name what changed, use the result, and choose a reasoned next step. Arjun checked his work. He could not remember which speeds he had tested.\nHis frustration was also narrowing his attention. He was pressing keys faster and rereading less. Arjun realized that asking for help was not the opposite of persistence. It could be the strategy that made persistence useful again.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-help-signal-assets/page2.jpg"}, {"text": "3. What Kind of Help?\nArjun did not say, 'Fix it for me.' He used a help ladder. Level one was a question, level two was a hint, and level three was a demonstration followed by a new attempt.\nHe asked Wren, 'Can you watch one trial and tell me exactly when the rover stops reading the line?' The request named the task, the evidence he needed, and the amount of support he wanted.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-help-signal-assets/page3.jpg"}, {"text": "4. A Second Set of Eyes\nWren crouched beside the mat. She noticed the blue sensor passed beyond the line before the wheels turned. She did not give a solution. She said, 'The sensor loses the line about two inches before your turn command begins.'\nArjun thanked her and recorded the observation. He moved the turn command earlier, but the rover wobbled across the line. That result was progress: the problem had changed, and he knew why.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-help-signal-assets/page4.jpg"}, {"text": "5. Choosing More Support\nArjun asked Mr. Chen for a level-two hint. Mr. Chen pointed to the data table and asked which variable Arjun had changed together with timing. Arjun noticed he had also raised the wheel speed.\nHe returned the speed to its original value and changed only the turn timing. Mr. Chen stepped back. The hint organized Arjun's attention; it did not take over the thinking.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-help-signal-assets/page5.jpg"}, {"text": "6. Help Goes Both Ways\nThe rover followed the turn. Later, Wren's rover spun in a circle. She asked Arjun for an observation, and he watched the red wheels. One moved while the other stayed still.\nArjun resisted the urge to grab the rover. He described what he saw and asked which connection powered the quiet wheel. Support was not a debt or proof that one person was smarter. It was a tool classmates could exchange.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-help-signal-assets/page6.jpg"}, {"text": "7. Still His Solution\nDuring the final run, Arjun's rover completed the orange route. His notes showed his trials, Wren's observation, Mr. Chen's hint, and his own revisions.\nArjun placed a small help-signal card in the robotics bin. He had not solved every part alone, but the solution was still his learning. He had decided when to persist, what support to request, and how to use it without giving away the work.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-help-signal-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What happened at the first turn when Arjun programmed the rover?", "choices": ["The rover rolled straight off the line", "The rover stopped completely", "The rover worked perfectly"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "At the first turn, its silver body rolled straight off the line."}, {"q": "What had Arjun stopped doing after six more trials?", "choices": ["Trying to solve the problem at all", "Recording which speeds he had tested", "Talking to his classmates"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "He was changing numbers without recording them. New information had stopped."}, {"q": "What did Arjun ask Wren to do, using his 'help ladder'?", "choices": ["Fix the whole rover for him", "Take over the entire project", "Watch one trial and tell him exactly when the rover stops reading the line"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "\"Can you watch one trial and tell me exactly when the rover stops reading the line?\""}, {"q": "What did Wren notice about the sensor?", "choices": ["It passed beyond the line before the wheels turned", "It was completely broken", "It needed new batteries"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "She noticed the blue sensor passed beyond the line before the wheels turned."}, {"q": "What is the big idea of this story?", "choices": ["Asking for help means you have failed", "Asking for support can be one step inside a capable plan", "Only working alone proves real learning"], "answer": 1, "evidencePage": 7, "hint": "Look at the last page.", "explain": "Asking for support can be one step inside a capable plan."}], "grammar": [{"q": "'Asking for help was not the opposite of persistence. ___, it could be the strategy that made persistence useful again.' Which word signals what actually is true?", "choices": ["Instead", "Because", "So"], "answer": 0, "evidencePage": 2, "hint": "This word introduces what asking for help really is, replacing the wrong idea.", "explain": "'Instead' introduces what asking for help actually is—a strategy, not the opposite of persistence.", "teach": "<b>Instead</b> introduces what <b>actually happened</b>, replacing another idea.<span class='cn'><b>instead</b>(取而代之)引出<b>实际发生</b>的事，代替另一种想法。</span>"}, {"q": "'Arjun thanked her and recorded the observation. ___ he moved the turn command earlier.' Which word signals what happened next?", "choices": ["Before", "Then", "Never"], "answer": 1, "evidencePage": 4, "hint": "This word signals the next step Arjun took.", "explain": "'Then' signals the next step: first he recorded the observation, then he moved the turn command.", "teach": "<b>Then</b> signals the <b>next step</b> in a sequence of events.<span class='cn'><b>then</b>(然后)标志一系列事件中的<b>下一步</b>。</span>"}, {"q": "'Mr. Chen pointed to the data table ___ asked which variable Arjun had changed.' Which word joins these two actions?", "choices": ["but", "so", "and"], "answer": 2, "evidencePage": 5, "hint": "This word joins the two things Mr. Chen did.", "explain": "'And' joins pointing to the data table with asking about the variable.", "teach": "<b>And</b> joins <b>two actions</b> done by the same person.<span class='cn'><b>and</b>(和)连接同一个人做的<b>两个动作</b>。</span>"}], "vocabulary": [{"q": "'Persistence' means ___.", "choices": ["continuing to try despite difficulty", "giving up immediately", "working without any plan"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Asking for help could be the strategy that made persistence useful again."}, {"q": "'Observation' means ___.", "choices": ["a type of rover part", "something noticed carefully through watching", "an argument between classmates"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Arjun thanked her and recorded the observation."}, {"q": "'Variable' means ___.", "choices": ["a fixed rule that never changes", "a type of hint", "a factor that can be changed or that changes"], "answer": 2, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Mr. Chen asked which variable Arjun had changed together with timing."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(persistence|observation|variable)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 4 SEL</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function saveProgress(){try{localStorage.setItem("les-the-help-signal-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-help-signal"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-help-signal",bookTitle:"The Help Signal",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

function pickVoice(){const voices=speechSynthesis.getVoices();if(!voices.length)return;const en=voices.filter(v=>/^en(-|_|$)/i.test(v.lang));const pool=en.length?en:voices;const score=v=>{let s=0;const n=(v.name||"").toLowerCase();if(/natural/.test(n))s+=8;if(/neural/.test(n))s+=6;if(/online/.test(n))s+=4;if(/google/.test(n))s+=5;if(/(aria|jenny|guy|libby|sonia|michelle|ava|andrew|emma|clara|natasha)/.test(n))s+=5;if(/(samantha|allison|karen|serena|siri|nicky|aaron)/.test(n))s+=4;if(v.localService===false)s+=3;if(/en-us|en-gb/i.test(v.lang))s+=1;if(/(zira|david|mark|hazel|compact|espeak|eloquence)/.test(n))s-=5;return s};pool.sort((a,b)=>score(b)-score(a));preferredVoice=pool[0]||null}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.i);},at));});};}let advanced=false;const advance=()=>{if(advanced)return;advanced=true;if(watchdog)clearTimeout(watchdog);ci++;speakChunk();};u.onend=advance;u.onerror=advance;const estDur=Math.max(1200,chunk.text.length*110);const watchdog=setTimeout(advance,estDur+4000);speechSynthesis.speak(u);}setTimeout(speakChunk,70);}
