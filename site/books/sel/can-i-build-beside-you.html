 16px;display:flex;align-items:center;gap:14px;box-shadow:0 14px 38px rgba(111,74,182,.24);border:1px solid rgba(255,255,255,.32)}.evidence-banner strong{text-shadow:0 1px 6px rgba(60,35,110,.35)}.evidence-banner span{font-size:.84rem;color:#fff}.evidence-banner button{border:0;border-radius:10px;padding:9px 12px;background:rgba(255,255,255,.92);color:var(--purple);font-weight:950;cursor:pointer}.footer{text-align:center;color:var(--muted);font-size:.8rem;padding:13px}

<script>

const pages=[{"type": "cover", "title": "Can I Build Beside You?", "subtitle": "A Story About a No That Leaves Room for Another Idea", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/can-i-build-beside-you-assets/cover.jpg"}, {"text": "Omar saw June and Eli building a tall block castle. It had two towers and a bridge. Omar carried over a red block. ‘Can I help?’ he asked.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/can-i-build-beside-you-assets/page1.jpg"}, {"text": "‘Not on the bridge right now,’ June said. ‘It keeps falling, and we need space to finish it.’ Omar's face grew hot. The no felt like a closed door.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/can-i-build-beside-you-assets/page2.jpg"}, {"text": "Omar wanted to knock his block against the floor. Instead, he set it down and took one breath. He could feel disappointed and still choose what to do next.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/can-i-build-beside-you-assets/page3.jpg"}, {"text": "‘Can I build beside you?’ Omar asked. Eli pointed to an open rug square. ‘Yes. The castle needs a garden.’ Omar checked, ‘May our buildings connect later?’ They agreed to ask again.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/can-i-build-beside-you-assets/page4.jpg"}, {"text": "Omar built flowers, a pond, and a tiny curved path. June and Eli finished the bridge. Each builder had space, and no one had to give up an idea.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/can-i-build-beside-you-assets/page5.jpg"}, {"text": "‘Ready to connect?’ June asked. Omar nodded. They added one gate between the garden and castle. The gate belonged to all three builders.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/can-i-build-beside-you-assets/page6.jpg"}, {"text": "Omar learned that ‘not here right now’ was not the same as ‘you do not belong.’ He could listen to a boundary, care for his feeling, and look for another respectful way to join.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/can-i-build-beside-you-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did Omar ask June and Eli?", "choices": ["‘Can I help?’", "‘Can I go home?’", "‘Can I have a snack?’"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Omar carried over a red block and asked, “Can I help?”"}, {"q": "Why did June say no to Omar building on the bridge?", "choices": ["it kept falling, and they needed space to finish it", "she did not like Omar", "the bridge was already finished"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "June said, “It keeps falling, and we need space to finish it.”"}, {"q": "What did Omar do instead of knocking his block on the floor?", "choices": ["he set it down and took one breath", "he threw the block across the room", "he asked a teacher for help"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Instead, he set it down and took one breath."}, {"q": "What did Omar build instead of joining the castle right away?", "choices": ["flowers, a pond, and a tiny curved path", "a second castle", "nothing at all"], "answer": 0, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Omar built flowers, a pond, and a tiny curved path — a garden beside the castle."}, {"q": "What is the big idea of this story?", "choices": ["‘Not here right now’ is not the same as ‘you do not belong’", "A no always means you should give up", "It is never okay to feel disappointed"], "answer": 0, "evidencePage": 7, "hint": "Look at the last page.", "explain": "Omar learned that “not here right now” was not the same as “you do not belong.”"}], "grammar": [{"q": "“Omar ___ over a red block.” Which is the past tense of ‘carry’?", "choices": ["carried", "carrys", "carrying"], "answer": 0, "evidencePage": 1, "hint": "Change the y to i and add -ed.", "explain": "“Carried” is the correct past tense — change the y to i, then add -ed.", "teach": "When a verb ends in a consonant + <b>y</b>, change the y to <b>i</b> and add <b>-ed</b>: carry → <b>carried</b>. <b>carrys</b> is not correct spelling, and <b>carrying</b> (-ing) needs a helper word like 'was.'<span class='cn'>动词以辅音字母加y结尾时，过去式要把 y 改成 i 再加 <b>-ed</b>：carry→<b>carried</b>(搬运)。<b>carrys</b> 拼写不对，<b>carrying</b>(-ing)要配 was 等助词。</span>"}, {"q": "“Omar ___, ‘May our buildings connect later?’” Which is the past tense of ‘check’?", "choices": ["checked", "check", "checking"], "answer": 0, "evidencePage": 4, "hint": "Add -ed to show something already happened.", "explain": "“Checked” (-ed) shows Omar already asked this question.", "teach": "Add <b>-ed</b> to show an action <b>already happened</b>: Omar <b>checked</b>. <b>check</b> is the plain, present form; <b>checking</b> (-ing) needs a helper word like 'was.'<span class='cn'>加 <b>-ed</b> 表示动作<b>已经发生</b>：checked(已经确认)。<b>check</b> 是现在式；<b>checking</b>(-ing)要配 was 等助词。</span>"}, {"q": "“Omar wanted to knock his block against the floor. ___, he set it down.” Which word shows he did something different?", "choices": ["Instead", "Also", "Then"], "answer": 0, "evidencePage": 3, "hint": "This word shows a different choice than what he wanted to do.", "explain": "“Instead” shows Omar made a different choice than what he first wanted to do.", "teach": "<b>Instead</b> shows someone made a <b>different choice</b>: wanted to knock it, but <b>instead</b> set it down. <b>also</b> adds something extra, and <b>then</b> shows what happens next — neither shows a different choice.<span class='cn'><b>instead</b>(而是/相反)表示做了<b>不同的选择</b>。<b>also</b>(也)表示additional，<b>then</b>(然后)表示接下来发生的事。</span>"}], "vocabulary": [{"q": "“Disappointed” means ___.", "choices": ["feeling sad because something didn't happen the way you wanted", "feeling very excited and happy", "feeling extremely tired"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Disappointed means feeling sad because something didn't happen the way you wanted."}, {"q": "To “connect” means to ___.", "choices": ["join or link two things together", "take two things apart", "hide something"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "To connect means to join or link two things together, like the garden and the castle."}, {"q": "“Respectful” means ___.", "choices": ["treating someone or something with care", "being very loud and fast", "ignoring other people's feelings"], "answer": 0, "evidencePage": 7, "hint": "Look at the last page.", "explain": "Respectful means treating someone or something with care."}]};

let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(disappointed|connect|respectful|boundary|breath|castle|garden)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 1 SEL</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}function playTeachAudio(key,part,fallbackText,fallbackLang){try{var store=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[key];if(store&&store[part]){var a=new Audio(store[part]);a.play();return;}}catch(e){}speakText(fallbackText,fallbackLang);}function renderTeach(teachHtml,key){var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+='<button style="border:0;background:#e2483f;color:#fff;cursor:pointer;font-size:.8em;line-height:1;vertical-align:middle;padding:0;margin-right:6px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;width:1.9em;height:1.9em;box-shadow:0 2px 6px rgba(226,72,63,.35)" data-key="'+key+'" data-part="en" data-text="'+escAttr(enText)+'" data-lang="en-US" onclick="playTeachAudio(this.dataset.key,this.dataset.part,this.dataset.text,this.dataset.lang)" aria-label="Listen in English" title="Listen in English">\uD83D\uDD0A</button> '+enHtml;if(cnHtml){out+='<span class="cn"><button style="border:0;background:#e2483f;color:#fff;cursor:pointer;font-size:.8em;line-height:1;vertical-align:middle;padding:0;margin-right:6px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;width:1.9em;height:1.9em;box-shadow:0 2px 6px rgba(226,72,63,.35)" data-key="'+key+'" data-part="cn" data-text="'+escAttr(cnText)+'" data-lang="zh-CN" onclick="playTeachAudio(this.dataset.key,this.dataset.part,this.dataset.text,this.dataset.lang)" aria-label="\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3" tit
