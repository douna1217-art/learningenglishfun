<script>

const pages=[{"type": "cover", "title": "The Pause Before Send", "subtitle": "A Strong Feeling Can Be Real Without Becoming the Next Message", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-pause-before-send-assets/cover.jpg"}, {"text": "1. The Missing Slide\nAmina opened the class presentation and found her water-conservation slide missing. She had spent two afternoons checking every fact and drawing a careful diagram. In the project chat, Luis had written, 'I cleaned up the deck. It was too long.'\nHeat climbed into Amina's cheeks. Her jaw tightened, and her thumb moved toward the reply box. She typed, 'You always ruin things when you take over.' The sentence matched her anger, but it did not explain the missing work or what she needed next.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-pause-before-send-assets/page1.jpg"}, {"text": "2. Three Signals\nBefore sending, Amina noticed three signals: hot cheeks, a tight jaw, and thoughts using words like always and ruin. Ms. Hall had taught the class that body cues were information, not commands.\nAmina placed the tablet face down and chose a strategy that worked for her. She pressed both feet to the floor, counted five slow breaths, and wrote the facts on paper: my slide is gone; Luis shortened the deck; I do not know why.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-pause-before-send-assets/page2.jpg"}, {"text": "3. A Message Audit\nWhen her breathing slowed, Amina reread the unsent message. The word always was inaccurate. Luis had helped her fix a broken link the day before. The word ruin judged him instead of naming his action and its impact.\nShe used a four-question check: Is it true? Is it necessary? Is the tone safe? Does it ask for a next step? Her first draft failed three questions. Deleting it did not erase her anger. It gave her anger a more useful job.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-pause-before-send-assets/page3.jpg"}, {"text": "4. Clear, Not Silent\nAmina typed again: 'Luis, I saw that my water slide was removed. I worked hard on it and want it included. Please tell me why you changed it. Can we review the time limit together before editing again?'\nThe new message was not cheerful, and it did not pretend the change was fine. It named the action, impact, need, and next step. Amina asked Ms. Hall to glance at the tone, then sent it herself.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-pause-before-send-assets/page4.jpg"}, {"text": "5. Information Arrives\nLuis came over with the planning sheet. He had thought the whole presentation had to be four minutes, but the directions allowed six. He had removed two slides without asking because he believed the timer was final.\nAmina still disliked his choice. Luis could have checked first. Yet the new information changed her picture from 'Luis wanted to ruin my work' to 'Luis rushed a decision using the wrong limit.' Intent did not erase impact, but facts helped them solve the real problem.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-pause-before-send-assets/page5.jpg"}, {"text": "6. A Shared Rule\nThey restored Amina's slide and timed the presentation at five minutes, forty seconds. Luis apologized for deleting work without consent, and Amina explained that project messages should name a specific action instead of attacking a person's character.\nTogether they added a team rule: ask before deleting; if a quick decision is necessary, save a copy and explain why. Ms. Hall reminded them that digital messages can travel faster than a relationship can repair them.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-pause-before-send-assets/page6.jpg"}, {"text": "7. The Useful Pause\nAt rehearsal, Amina presented her diagram and Luis advanced the slides. The deck fit the limit because they had solved the right problem together.\nAmina saved the four questions inside the tablet case. The pause had not made her less honest or less strong. It had helped her separate feeling, fact, and choice so that her message protected both her work and the possibility of repair.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-pause-before-send-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did Amina type in the reply box before pausing?", "choices": ["Thank you for cleaning up the deck", "I need help finding my slide", "You always ruin things when you take over"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "She typed, 'You always ruin things when you take over.'"}, {"q": "What three signals did Amina notice before sending her message?", "choices": ["Hot cheeks, a tight jaw, and thoughts using words like always and ruin", "A headache and blurry vision", "Nothing unusual at all"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Amina noticed three signals: hot cheeks, a tight jaw, and thoughts using words like always and ruin."}, {"q": "What did Amina's four-question check ask?", "choices": ["How many words are in the message?", "Is it true? Is it necessary? Is the tone safe? Does it ask for a next step?", "Is the grammar correct?"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "She used a four-question check: Is it true? Is it necessary? Is the tone safe? Does it ask for a next step?"}, {"q": "What did Amina's revised message do, unlike the first draft?", "choices": ["It apologized for being upset", "It ignored the missing slide completely", "It named the action, impact, need, and next step"], "answer": 2, "evidencePage": 4, "hint": "Look at page 4.", "explain": "It named the action, impact, need, and next step."}, {"q": "What is the big idea of this story?", "choices": ["A strong feeling can be real without becoming the next message", "Angry messages always solve problems faster", "Feelings should never be expressed to others"], "answer": 0, "evidencePage": 7, "hint": "Look at the last page.", "explain": "The pause had helped her separate feeling, fact, and choice."}], "grammar": [{"q": "'The sentence matched her anger, ___ it did not explain the missing work or what she needed next.' Which word shows contrast?", "choices": ["so", "because", "but"], "answer": 2, "evidencePage": 1, "hint": "This word contrasts the angry sentence with what it failed to do.", "explain": "'But' contrasts the sentence matching her anger with it failing to explain what she needed.", "teach": "<b>But</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>but</b>(但是)表示两个事实之间的<b>对比</b>。</span>"}, {"q": "'Luis could have checked first, ___ the new information changed her picture.' Which word shows contrast?", "choices": ["yet", "so", "because"], "answer": 0, "evidencePage": 5, "hint": "This word contrasts what Luis could have done with what actually changed Amina's understanding.", "explain": "'Yet' contrasts Luis's mistake with the new information still changing Amina's picture of events.", "teach": "<b>X, yet Y</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>yet</b>(然而)表示两个事实之间的<b>对比</b>。</span>"}, {"q": "'Luis apologized for deleting work without consent, ___ Amina explained that project messages should name a specific action.' Which word joins these two events?", "choices": ["but", "and", "so"], "answer": 1, "evidencePage": 6, "hint": "This word joins Luis's apology with Amina's explanation.", "explain": "'And' joins Luis apologizing with Amina explaining the better approach.", "teach": "<b>And</b> joins <b>two related actions</b>.<span class='cn'><b>and</b>(和)连接<b>两个相关的动作</b>。</span>"}], "vocabulary": [{"q": "'Signals' means ___.", "choices": ["loud alarms or sirens", "written messages sent by text", "clues or indications that something is happening"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Amina noticed three signals: hot cheeks, a tight jaw, and certain thoughts."}, {"q": "'Audit' means ___.", "choices": ["a careful check or review of something", "a type of apology", "a musical performance"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "A Message Audit—Amina carefully reread and checked her unsent message."}, {"q": "'Consent' means ___.", "choices": ["a written contract", "permission or agreement to let something happen", "an argument between friends"], "answer": 1, "evidencePage": 6, "hint": "Look at page 6.", "explain": "Luis apologized for deleting work without consent."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(signals|audit|consent)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 4 SEL</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}

function saveProgress(){try{localStorage.setItem("les-the-pause-before-send-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-pause-before-send"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-pause-before-send",bookTitle:"The Pause Before Send",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

function pickVoice(){const voices=speechSynthesis.getVoices();if(!voices.length)return;const en=voices.filter(v=>/^en(-|_|$)/i.test(v.lang));const pool=en.length?en:voices;const score=v=>{let s=0;const n=(v.name||"").toLowerCase();if(/natural/.test(n))s+=8;if(/neural/.test(n))s+=6;if(/online/.test(n))s+=4;if(/google/.test(n))s+=5;if(/(aria|jenny|guy|libby|sonia|michelle|ava|andrew|emma|clara|natasha)/.test(n))s+=5;if(/(samantha|allison|karen|serena|siri|nicky|aaron)/.test(n))s+=4;if(v.localService===false)s+=3;if(/en-us|en-gb/i.test(v.lang))s+=1;if(/(zira|david|mark|hazel|compact|espeak|eloquence)/.test(n))s-=5;return s};pool.sort((a,b)=>score(b)-score(a));preferredVoice=pool[0]||null}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.i);},at));});};}let advanced=false;const advance=()=>{if(advanced)return;advanced=true;if(watchdog)clearTimeout(watchdog);ci++;speakChunk();};u.onend=advance;u.onerror=advance;const estDur=Math.max(1200,chunk.text.length*110);const watchdog=setTimeout(advance,estDur+4000);speechSynthesis.speak(u);}setTimeout(speakChunk,70);}

function setStatus(m,ok){var el=document.getElementById("recStatus");if(el){el.textContent=m;el.style.color=ok?"#1f8f4d":"#b23b34";}}async function toggleRecording(){const btn=document.getElementById("recordPageBtn");if(recorder&&recorder.state==="recording"){recorder.stop();btn.textContent="🎙 Record";btn.classList.remove("recording");return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setStatus("Recording works only on the published website — the microphone is turned off in this preview.",false);return}if(typeof MediaRecorder==="undefined"){setStatus("This browser can't record audio. Try Chrome/Edge, or Safari 14+.",false);return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});let opts={};if(MediaRecorder.isTypeSupported){if(MediaRecorder.isTypeSupported("audio/webm"))opts={mimeType:"audio/webm"};else if(MediaRecorder.isTypeSupported("audio/mp4"))opts={mimeType:"audio/mp4"};}chunks=[];recorder=new MediaRecorder(stream,opts);recorder.ondataavailable=e=>{if(e.data&&e.data.size>0)chunks.push(e.data)};recorder.onstop=()=>{if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(new Blob(chunks,{type:(recorder.mimeType||"audio/webm")}));document.getElementById("playRecordingBtn").disabled=false;document.getElementById("deleteRecordingBtn").disabled=false;setStatus("Saved! Tap ▶ Play to hear your reading.",true);stream.getTracks().forEach(t=>t.stop())};recorder.start();btn.textContent="■ Stop";btn.classList.add("recording");setStatus("Recording… tap ■ Stop when you finish.",true)}catch(e){var n=(e&&e.name)?e.name:String(e);if(n==="NotAllowedError"||n==="SecurityError"){setStatus("Microphone blocked. In the chat preview the mic is always off — use the live website, then tap Allow (or click 🔒 in the address bar → allow Microphone → reload).",false);}else if(n==="NotFoundError"){setStatus("No microphone found on this device.",false);}else{setStatus("Could not record ("+n+"). Use the live website in Chrome/Edge/Safa
