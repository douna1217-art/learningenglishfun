<script>

const pages=[{"type": "cover", "title": "The Compliment Scoreboard", "subtitle": "Appreciation can celebrate someone without ranking everyone else", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-compliment-scoreboard-assets/cover.jpg"}, {"text": "1. Most Creative\nAfter the clay showcase, classmates placed compliment cards beneath each sculpture. Sofia's bright winged creature received a tall stack. June's quiet gray animal received three careful notes.\nSomeone told Sofia, 'Yours is the most creative in the whole class.' Sofia felt proud—and then saw June slide her sculpture behind a supply box.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-compliment-scoreboard-assets/page1.jpg"}, {"text": "2. Pride and Uneasiness\nSofia wondered whether feeling proud made her a bad friend. She named two truths instead: she valued the work she had done, and the ranking in the compliment had changed how the room felt.\nJune said, 'I liked my sculpture until the cards started looking like points.' She was not asking Sofia to reject every compliment. She wanted appreciation that did not turn classmates into winners and losers.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-compliment-scoreboard-assets/page2.jpg"}, {"text": "3. What the Cards Missed\nThey read the notes more closely. Many cards beneath Sofia's creature repeated words like best and favorite. June's three notes named precise details: the textured paws, the balanced pose, and the patient way she had rebuilt a cracked ear.\nA large number of comparisons had revealed less about the art than a few specific observations. Sofia began to see that praise could be loud without being useful.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-compliment-scoreboard-assets/page3.jpg"}, {"text": "4. Change the Invitation\nThey asked Ms. Alvarez if the class could revise the display. The new prompt invited students to notice a choice, a skill, or a feeling in each artwork. Nobody had to select a favorite.\nSofia modeled the change: 'June's tiny paw marks make the creature look as if it traveled a long way.' June wrote that Sofia's layered wings created a strong sense of motion.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-compliment-scoreboard-assets/page4.jpg"}, {"text": "5. More Ways to Be Seen\nStudents returned to the tables and looked longer. New notes recognized humor, careful engineering, bold color, smooth blending, surprising stories, and brave revisions after mistakes.\nThe wall no longer formed an obvious tallest stack. More students found language for what they genuinely noticed, including qualities that a single word like best could never hold.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-compliment-scoreboard-assets/page5.jpg"}, {"text": "6. Receiving Without Ranking\nA classmate told Sofia that her wing shapes were inventive. Sofia answered, 'Thank you,' without checking whether anyone else's shapes were less inventive.\nShe complimented a different artist's sturdy clay bridge. Celebrating that strength did not reduce her own. Appreciation could expand attention instead of rationing it.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-compliment-scoreboard-assets/page6.jpg"}, {"text": "7. No Score to Protect\nJune brought her gray creature back to the center of the table. Sofia placed hers beside it. The sculptures did not need to compete to be worth seeing.\nSofia still felt proud. Now the pride was connected to her choices and effort, not to a scoreboard she had to defend. She could enjoy being noticed and help widen the circle of notice.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-compliment-scoreboard-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What happened after the clay showcase?", "choices": ["Both sculptures received exactly the same number of cards", "Sofia's sculpture received a tall stack of cards while June's received only three", "No compliment cards were used at all"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Sofia's bright creature received a tall stack of compliment cards, while June's quiet gray animal received only three careful notes."}, {"q": "What did June say about the compliment cards?", "choices": ["She liked her sculpture until the cards started looking like points", "She wanted even more cards than Sofia received", "She thought the cards should be removed completely"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "June said the cards started feeling like a ranking system, turning classmates into winners and losers instead of celebrating art."}, {"q": "What did they notice when they read the cards more closely?", "choices": ["June's cards were actually longer than Sofia's", "Sofia's cards repeated vague words like best, while June's named precise details", "Both sets of cards said exactly the same things"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Sofia's cards repeated words like best and favorite, while June's three notes named precise, specific details about her work."}, {"q": "What did the class change about the compliment display?", "choices": ["They required everyone to pick exactly one favorite", "They removed the compliment cards entirely", "The new prompt invited noticing a choice, skill, or feeling, with no favorite required"], "answer": 2, "evidencePage": 4, "hint": "Look at page 4.", "explain": "The new prompt asked students to notice something specific in each artwork instead of choosing an overall favorite."}, {"q": "What happened when students returned to look at the art again?", "choices": ["New notes recognized many different qualities, and there was no obvious tallest stack", "The students stopped writing any compliment cards", "Everyone still voted for the exact same sculpture as before"], "answer": 0, "evidencePage": 5, "hint": "Look at page 5.", "explain": "New notes recognized humor, engineering, color, and more — the wall no longer formed one obvious tallest, most-praised stack."}], "grammar": [{"q": "Which sentence correctly punctuates June's spoken words?", "choices": ["June said, I liked my sculpture until the cards started looking like points.", "June said, \"I liked my sculpture until the cards started looking like points.\"", "June said I liked my sculpture until the cards started looking like points."], "answer": 1, "evidencePage": 2, "hint": "A direct quotation needs quotation marks around the exact words someone said.", "explain": "Quotation marks surround June's exact spoken words, with a comma introducing the quotation after 'said.'", "teach": "<b>Quotation marks</b> surround a person's <b>exact spoken words</b>.<span class='cn'><b>引号</b>用来标出一个人<b>原话的确切内容</b>。</span>"}, {"q": "'Sofia still felt proud, ___ now the pride was connected to her own choices.' Which word shows contrast?", "choices": ["so", "because", "but"], "answer": 2, "evidencePage": 7, "hint": "This word shows the second idea adds a difference from the first.", "explain": "'But' shows contrast: Sofia's pride stayed, but its source changed from ranking to her own effort.", "teach": "<b>But</b> shows <b>contrast</b> between two ideas.<span class='cn'><b>but</b>表示两个想法间的<b>转折</b>。</span>"}, {"q": "Which sentence correctly uses a comma after an introductory phrase?", "choices": ["After the clay showcase, classmates placed compliment cards beneath each sculpture.", "After, the clay showcase classmates placed compliment cards beneath each sculpture.", "After the clay showcase classmates, placed compliment cards beneath each sculpture."], "answer": 0, "evidencePage": 1, "hint": "A comma follows an introductory phrase before the main sentence begins.", "explain": "The comma correctly separates the introductory phrase 'After the clay showcase' from the main sentence.", "teach": "<b>A comma</b> follows an <b>introductory phrase</b> before the main sentence begins.<span class='cn'><b>逗号</b>用在<b>引导性短语</b>之后，主句开始之前。</span>"}], "vocabulary": [{"q": "'Specific' means ___.", "choices": ["precise and detailed, not vague or general", "loud and repeated many times", "completely unrelated to the topic"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "June's specific notes named precise details like the textured paws and balanced pose, unlike vague words such as best."}, {"q": "'Ranking' means ___.", "choices": ["celebrating two things equally", "putting things in order from best to worst", "describing something in careful detail"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "June didn't want appreciation that turned into a ranking — an ordering from best to worst — of classmates' art."}, {"q": "'Genuinely' means ___.", "choices": ["truly and sincerely, not just for show", "loudly and dramatically", "only when other people are watching"], "answer": 0, "evidencePage": 5, "hint": "Look at page 5.", "explain": "More students found language for what they genuinely noticed — truly observed — instead of repeating a generic compliment."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(specific|ranking|genuinely)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 5 SEL</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

'pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.
