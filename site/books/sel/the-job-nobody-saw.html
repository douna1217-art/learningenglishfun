supply checks, cleanup, conflict check-ins, and transporting the model. Each card had an owner and a backup.\nNaming the work did not make every task equally difficult, but it gave the group better information about who was carrying what.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-job-nobody-saw-assets/page4.jpg"}, {"text": "5. Redistribute before Resentment\nLeo took the supply check and packing jobs. Two classmates alternated reminders and cleanup. Keisha kept the park revision and chose one meeting to facilitate, not every meeting.\nAt first she felt nervous leaving a reminder unsent. Then Leo sent it on time. Sharing responsibility meant letting other people practice being responsible too.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-job-nobody-saw-assets/page5.jpg"}, {"text": "6. Credit the Whole Process\nThe group revised its showcase card with a visual key for design, building, coordination, testing, and care of materials. Visitors could see how many kinds of work supported the city.\nLeo thanked Keisha specifically for building the systems that had kept the project moving. The group also agreed that appreciation should not replace redistribution; kind words alone could not lighten a workload.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-job-nobody-saw-assets/page6.jpg"}, {"text": "7. A Fairer Next Project\nWhen the class began a new project, the group listed all expected work before choosing roles. They planned to revisit the board halfway through, because hidden tasks often appeared later.\nKeisha still enjoyed organizing. Now it was a chosen, shared contribution rather than an endless job nobody saw. Fair teamwork began by noticing the full process, then adjusting the load.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-job-nobody-saw-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "Why did Keisha feel strangely tired at the showcase?", "choices": ["She had stayed up all night building the bridge", "She had done many organizing jobs that never appeared on the display", "She had not slept before the showcase"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Keisha had scheduled meetings, found materials, and solved arguments, but none of those jobs appeared on the display, leaving her tired and unseen."}, {"q": "What did Leo realize when they listed every action required to finish the city?", "choices": ["Building the bridge was the only real work involved", "Keisha had not actually done any extra work", "The work included much more than building: planning, communicating, and cleaning too"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "The list grew beyond building to include planning, checking supplies, communicating, cleaning, and helping the group recover from failed plans."}, {"q": "Why had Keisha's organizing work become invisible?", "choices": ["Because she never actually did any of the organizing", "Because the teacher told her to hide her work", "Because she handled it quietly and the group stopped noticing it was work at all"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Some jobs made it possible for others to work, and because Keisha handled them quietly, the group stopped noticing they were tasks."}, {"q": "What did the group do to make all the work visible?", "choices": ["They rebuilt the task board with cards for every kind of job, each with an owner", "They canceled the project and started a new one", "They asked Keisha to do even more tasks alone"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "The group added cards for reminders, supply checks, cleanup, and more, each with an owner and a backup."}, {"q": "What happened when Keisha shared responsibility instead of doing everything herself?", "choices": ["The whole project fell apart immediately", "Other classmates successfully handled tasks, like Leo sending a reminder on time", "Every task Keisha gave away was forgotten completely"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Keisha felt nervous at first, but Leo sent the reminder on time, showing that others could practice being responsible too."}], "grammar": [{"q": "Which sentence correctly uses a colon to introduce a list?", "choices": ["The card listed: five kinds of work design, building, coordination, testing, and care of materials.", "The card listed five kinds of work: design, building, coordination, testing, and care of materials.", "The card listed five kinds of work, design: building, coordination, testing, and care of materials."], "answer": 1, "evidencePage": 6, "hint": "A colon introduces a list after a complete sentence.", "explain": "The colon correctly follows a complete introductory sentence before the list of five kinds of work begins.", "teach": "A <b>colon</b> introduces a <b>list</b> after a complete sentence.<span class='cn'><b>冒号</b>用在一个完整句子之后引出一个<b>列表</b>。</span>"}, {"q": "Which sentence correctly uses a semicolon to join two closely related complete thoughts?", "choices": ["Kind words; alone could not lighten a workload the tasks still needed to be shared.", "Kind words alone could not lighten a workload; the tasks still needed to be shared.", "Kind words alone could not lighten a workload, the tasks still needed to be shared;"], "answer": 1, "evidencePage": 6, "hint": "A semicolon joins two complete sentences that are closely related.", "explain": "The semicolon correctly joins two related complete thoughts about appreciation and actual task-sharing.", "teach": "<b>A semicolon</b> joins two <b>closely related complete sentences</b>.<span class='cn'><b>分号</b>连接两个意思相关的<b>完整句子</b>。</span>"}, {"q": "Which sentence correctly uses commas to separate items in a series?", "choices": ["The list included planning, communicating, cleaning and, transporting.", "The list included planning, communicating, cleaning, and transporting.", "The list included planning communicating, cleaning, and transporting."], "answer": 1, "evidencePage": 2, "hint": "Commas separate three or more items listed together.", "explain": "Commas correctly separate each item in the list of jobs the group named.", "teach": "<b>Commas</b> separate <b>three or more items</b> in a series.<span class='cn'><b>逗号</b>用来分隔一系列中的<b>三个或更多项目</b>。</span>"}], "vocabulary": [{"q": "'Reliability' means ___.", "choices": ["being someone others can consistently depend on", "being unpredictable and inconsistent", "being the fastest worker in a group"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Keisha's reliability — being dependable — had become a reason the group kept giving her more invisible work."}, {"q": "To 'redistribute' work means to ___.", "choices": ["give all of it to one person", "stop doing the work completely", "share it out differently among the group"], "answer": 2, "evidencePage": 5, "hint": "Look at page 5.", "explain": "The group worked to redistribute the workload before resentment grew, sharing tasks more fairly."}, {"q": "'Coordination' means ___.", "choices": ["organizing different parts so they work together smoothly", "a mistake that stops a project", "a single person working completely alone"], "answer": 0, "evidencePage": 6, "hint": "Look at page 6.", "explain": "The visual key recognized coordination — organizing the different parts of the project — as one of the kinds of work that supported the city."}]};
