 16px;display:flex;align-items:center;gap:14px;box-shadow:0 14px 38px rgba(111,74,182,.24);border:1px solid rgba(255,255,255,.32)}.evidence-banner strong{text-shadow:0 1px 6px rgba(60,35,110,.35)}.evidence-banner span{font-size:.84rem;color:#fff}.evidence-banner button{border:0;border-radius:10px;padding:9px 12px;background:rgba(255,255,255,.92);color:var(--purple);font-weight:950;cursor:pointer}.footer{text-align:center;color:var(--muted);font-size:.8rem;padding:13px}

<header class="topbar"><div class="brand"><div class="logo">R</div><div><h1>The Attention Experiment</h1><p>learningenglishfun · Interactive Grade 5 SEL</p></div></div><div class="stage-pill" id="stagePill">Reading Mode</div></header>
<section class="audio-bar"><div class="audio-copy"><strong>Listen, read, and record</strong><span>Narration highlights each word. Recordings stay only in this browser session.</span></div><div class="audio-actions"><button class="audio-btn primary" id="listenPageBtn">🔊 This Page</button><button class="audio-btn" id="listenStoryBtn">📖 Full Story</button><button class="audio-btn" id="pauseBtn" disabled>⏸ Pause</button><button class="audio-btn record" id="recordPageBtn">🎙 Record</button><button class="audio-btn" id="playRecordingBtn" disabled>▶ Play</button><button class="audio-btn" id="deleteRecordingBtn" disabled>🗑 Delete</button></div><div id="recStatus" class="rec-status" aria-live="polite"></div></section>
<main class="shell"><section class="reader"><div id="pageView"></div><div class="controls"><div class="progress" id="progress"></div><div class="nav"><button class="prev" id="prevBtn">← Back</button><button class="next" id="nextBtn">Next →</button></div></div></section><aside class="panel"><div class="journey"><button class="tab active" data-tab="comprehension">1 Story</button><button class="tab" data-tab="grammar">2 Grammar</button><button class="tab" data-tab="vocabulary">3 Vocabulary</button></div><div id="panelContent"></div></aside></main><div class="footer">No API key required · narration, recording, feedback, retry, and progress work in the browser.</div></div>
<script>

const pages=[{"type": "cover", "title": "The Attention Experiment", "subtitle": "A strategy is useful when it fits the person and the task", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-attention-experiment-assets/cover.jpg"}, {"text": "1. The Vanishing Instructions\nNia liked science investigations, but multi-step directions seemed to vanish while she worked. She would begin measuring, notice another group talking, search for a pencil, and return unsure which step came next.\nWhen her data table stayed half empty, Nia whispered, 'I am terrible at focusing.' The sentence sounded like a permanent fact instead of a problem she could study.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-attention-experiment-assets/page1.jpg"}, {"text": "2. Turn It into a Question\nMr. Chen asked, 'When does focusing work better for you?' Nia remembered building models after school. She focused longest when materials were arranged in order and she could see one step at a time.\nThey changed her statement into a question: What conditions help Nia keep track of a multi-step task? A question made room for evidence—and for more than one possible strategy.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-attention-experiment-assets/page2.jpg"}, {"text": "3. Three Small Tests\nOn Monday, Nia tried a silent timer. Its countdown made her rush. On Tuesday, she wore soft ear defenders. They reduced chatter, but she missed her partner's useful questions.\nOn Wednesday, she covered all but one instruction with a blank card and placed materials in the order she would use them. She finished more steps and still talked with her partner.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-attention-experiment-assets/page3.jpg"}, {"text": "4. Data Not Judgment\nNia made a simple record of what happened. The timer was useful for cleanup, not careful measuring. Ear defenders helped during independent reading, not partner science. The step card helped when directions were long.\nNo tool was good or bad by itself. Each tool interacted with the task, the room, and Nia's needs. Her difficulty was information, not evidence that she was lazy.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-attention-experiment-assets/page4.jpg"}, {"text": "5. A Plan She Could Explain\nBefore the next investigation, Nia told her partner, 'I am going to reveal one step at a time. Please tap the table if you need my attention.' Her partner agreed and added labeled trays for shared materials.\nNia was not hiding a weakness. She was communicating a plan that helped both partners know how to work together.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-attention-experiment-assets/page5.jpg"}, {"text": "6. Adjusting Midway\nHalfway through, a fire-drill announcement interrupted the class. When they returned, Nia could not remember where they had stopped. She marked the finished step with a clip and found the next instruction.\nThe strategy did not make distraction disappear. It gave her a reliable way to reenter the task after attention moved away.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-attention-experiment-assets/page6.jpg"}, {"text": "7. The Scientist of Herself\nNia completed the investigation and shared her findings with Mr. Chen. More important, she could describe why the plan worked and when she would change it.\nShe replaced 'I am terrible at focusing' with a more accurate thought: 'My attention changes with the conditions. I can notice patterns, test supports, and ask for what helps.'", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-attention-experiment-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What happened to Nia during multi-step science investigations?", "choices": ["She always finished every investigation early", "The instructions seemed to vanish while she worked and she lost track of the steps", "She refused to participate in group work"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Multi-step directions seemed to vanish while Nia worked, and she would return unsure which step came next, leaving her data table half empty."}, {"q": "What question did Mr. Chen help Nia create?", "choices": ["What conditions help Nia keep track of a multi-step task?", "Why is Nia bad at every science experiment?", "Should Nia stop doing science investigations?"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "They turned Nia's negative statement into a testable question about what conditions helped her focus, making room for evidence."}, {"q": "What did Nia learn from her three small tests?", "choices": ["Every tool she tried worked equally well for every task", "Nothing she tried made any difference at all", "Different tools helped with different tasks — no single tool worked for everything"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "The timer helped with cleanup, ear defenders helped during reading, and the step card helped with long directions — each tool fit a different situation."}, {"q": "What did Nia record about her findings?", "choices": ["A ranking of which classmate focused the best", "Data about what worked for which task, as information rather than judgment", "A rule that no tools should ever be used"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Nia made a simple record showing her difficulty was information, not evidence that she was lazy."}, {"q": "What did Nia communicate to her partner before the next investigation?", "choices": ["That her partner should do all the work instead", "A specific plan: revealing one step at a time and a signal for getting her attention", "That she did not want a partner for this investigation"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Nia told her partner her plan and they added labeled trays, showing she was communicating a strategy, not hiding a weakness."}], "grammar": [{"q": "Which sentence correctly uses a comparative form to compare two strategies?", "choices": ["The step card worked better than the silent timer for long directions.", "The step card worked bestly than the silent timer for long directions.", "The step card worked more better than the silent timer for long directions."], "answer": 0, "evidencePage": 3, "hint": "Comparing exactly two things uses one comparative word, not two.", "explain": "'Better' alone correctly compares two strategies; adding 'more' or using 'bestly' is incorrect.", "teach": "Use <b>one comparative word</b>, such as 'better,' to compare <b>two things</b>.<span class='cn'>比较<b>两个事物</b>只用<b>一个比较级</b>词，例如better。</span>"}, {"q": "Which sentence correctly uses a semicolon to join two closely related complete thoughts?", "choices": ["No tool was good or bad by itself; each one interacted with the task and the room.", "No tool was good or bad by itself, each one interacted with the task and the room;", "No tool; was good or bad by itself each one interacted with the task and the room."], "answer": 0, "evidencePage": 4, "hint": "A semicolon joins two complete sentences that are closely related.", "explain": "The semicolon correctly joins two related complete thoughts about how each tool worked differently.", "teach": "<b>A semicolon</b> joins two <b>closely related complete sentences</b>.<span class='cn'><b>分号</b>连接两个意思相关的<b>完整句子</b>。</span>"}, {"q": "Which sentence correctly uses an apostrophe to show possession?", "choices": ["Nia's partner agreed and added labeled trays.", "Nias' partner agreed and added labeled trays.", "Nia's' partner agreed and added labeled trays."], "answer": 0, "evidencePage": 5, "hint": "An apostrophe plus s shows something belongs to a singular person.", "explain": "'Nia's' correctly shows the partner belonged to Nia, using apostrophe + s for a singular name.", "teach": "<b>Apostrophe + s</b> shows something belongs to a <b>singular</b> person.<span class='cn'><b>撇号+s</b>表示某物属于一个<b>单数</b>的人。</span>"}], "vocabulary": [{"q": "'Investigation' means ___.", "choices": ["a careful scientific study to find out information", "a quick guess with no testing", "a finished report with no more steps"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Nia liked science investigations — careful studies — even though multi-step directions were hard for her to track."}, {"q": "To 'reenter' a task means to ___.", "choices": ["finish it and never think about it again", "return to it and continue after being interrupted", "start over with a completely new task"], "answer": 1, "evidencePage": 6, "hint": "Look at page 6.", "explain": "The strategy gave Nia a reliable way to reenter the task — return and continue — after the fire drill interrupted her attention."}, {"q": "'Patterns' means ___.", "choices": ["random events with no connection", "a single unrepeated mistake", "things that repeat in a noticeable, predictable way"], "answer": 2, "evidencePage": 7, "hint": "Look at page 7.", "explain": "Nia could notice patterns — repeating, predictable things — about her attention and test supports that helped."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(investigation|reenter|patterns)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 5 SEL</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}
