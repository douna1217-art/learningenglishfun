<script>

const pages=[{"type": "cover", "title": "Both Things Are True", "subtitle": "One Moment Can Hold Pride, Worry, Joy, and Care", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/both-things-are-true-assets/cover.jpg"}, {"text": "1. The List on the Door\nPriya found her name beside the spring concert solo. Her stomach lifted like an elevator, and she hugged her turquoise music folder. Then she noticed Jo's name was not on the list, even though they had practiced the song together every lunch.\nJo stared at the paper and pressed the red folder against their chest. Priya's excitement tightened into worry. She wondered whether smiling would seem unkind, yet pretending she did not care would make her own hard work disappear.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/both-things-are-true-assets/page1.jpg"}, {"text": "2. A Tangled Answer\nWhen Ms. Alvarez asked how she felt, Priya answered, \"Fine.\" The word was too small. Her cheeks wanted to smile, her shoulders felt heavy, and her thoughts kept jumping between I earned this and Jo is hurt.\nMs. Alvarez said feelings do not cancel one another. Priya wrote four words inside her folder: proud, excited, worried, and sad-for-Jo. Naming the tangle did not solve the situation, but it made the feelings easier to examine.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/both-things-are-true-assets/page2.jpg"}, {"text": "3. Guessing for Jo\nPriya almost offered Jo the solo before asking what they wanted. She imagined that giving it away would prove she was a good friend. Then she realized she was planning a solution to a feeling she had only guessed.\nAt lunch, Priya said, \"I am excited, and I care that this hurts. Do you want company, space, or help talking to Ms. Alvarez?\" Jo chose company first. They sat quietly beneath the jacaranda tree.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/both-things-are-true-assets/page3.jpg"}, {"text": "4. Jo's Whole Story\nJo admitted feeling disappointed, embarrassed, and also proud of Priya. \"Those feelings are all bumping into each other,\" they said. Priya had assumed Jo's sadness left no room for happiness about her success.\nJo did not want Priya to surrender the solo. They wanted honest information about the audition and another way to contribute. Priya listened without correcting the feelings or rushing toward a cheerful ending.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/both-things-are-true-assets/page4.jpg"}, {"text": "5. Questions, Not Favors\nTogether they asked Ms. Alvarez what skills the solo required. She explained that Priya's steady entrance had matched this song. She also showed Jo where their expressive rhythm made the ensemble stronger and offered feedback for the next audition.\nThe conversation was not a consolation prize. Jo received specific information and a meaningful percussion lead. Priya kept the solo without hiding her joy. Both students left with a next step they had helped choose.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/both-things-are-true-assets/page5.jpg"}, {"text": "6. Rehearsal with Room\nAt rehearsal, Priya's voice shook on the first note. Jo tapped the opening rhythm and gave the agreed signal: one calm nod. Priya breathed, found the pitch, and continued. Supporting her did not require Jo to pretend the audition had not hurt.\nLater, Priya stayed while Jo practiced the percussion break. She praised one precise change instead of saying everything was perfect. Their friendship made room for celebration, disappointment, effort, and honest feedback.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/both-things-are-true-assets/page6.jpg"}, {"text": "7. More Than One Note\nConcert night, Priya finished the solo and heard Jo's rhythm carry the ensemble forward. They bowed with the whole group. Backstage, Jo said, \"I am still a little disappointed—and really proud of you.\"\nPriya answered, \"I am proud—and glad you told me the whole truth.\" Their feelings had not become simple. They had become understandable, and understanding gave both friends room to act with care.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/both-things-are-true-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did Priya notice after seeing her name on the list?", "choices": ["Jo's name was not on the list, even though they had practiced together", "The list had been taken down", "Jo was not at school that day"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "She noticed Jo's name was not on the list, even though they had practiced the song together every lunch."}, {"q": "What did Priya write inside her folder to name her tangled feelings?", "choices": ["happy and nothing else", "proud, excited, worried, and sad-for-Jo", "angry and confused"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Priya wrote four words inside her folder: proud, excited, worried, and sad-for-Jo."}, {"q": "What did Priya ask Jo at lunch, instead of guessing what they needed?", "choices": ["Do you want my solo instead?", "Are you mad at me?", "Do you want company, space, or help talking to Ms. Alvarez?"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "\"Do you want company, space, or help talking to Ms. Alvarez?\""}, {"q": "What did Jo actually want, instead of Priya giving up the solo?", "choices": ["Honest information about the audition and another way to contribute", "For Priya to feel guilty forever", "For the concert to be canceled"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Jo wanted honest information about the audition and another way to contribute."}, {"q": "What is the big idea of this story?", "choices": ["Only one feeling can be true at a time", "Naming a tangle of feelings makes them easier to understand and act on with care", "Friends should never feel disappointed around each other"], "answer": 1, "evidencePage": 7, "hint": "Look at the last page.", "explain": "Their feelings had not become simple. They had become understandable, and understanding gave both friends room to act with care."}], "grammar": [{"q": "'Ms. Alvarez said feelings do not cancel one another, ___ Priya wrote four words inside her folder.' Which word shows a result?", "choices": ["so", "before", "yet"], "answer": 0, "evidencePage": 2, "hint": "This word connects the idea to what Priya did because of it.", "explain": "'So' introduces the result: because feelings don't cancel each other, so Priya wrote the four words.", "teach": "<b>So</b> introduces a <b>result</b> that follows a reason.<span class='cn'><b>so</b>(所以)引出跟随原因而来的<b>结果</b>。</span>"}, {"q": "'Priya breathed, found the pitch, ___ continued.' Which word joins these actions?", "choices": ["but", "and", "so"], "answer": 1, "evidencePage": 6, "hint": "This word joins the last action in the list.", "explain": "'And' joins the final action—continued—to the list of what Priya did.", "teach": "<b>And</b> joins the <b>last item</b> in a list of actions.<span class='cn'><b>and</b>(和)连接一系列动作中的<b>最后一项</b>。</span>"}, {"q": "'Their feelings had not become simple; ___, they had become understandable.' Which word signals what actually happened?", "choices": ["because", "so", "instead"], "answer": 2, "evidencePage": 7, "hint": "This word introduces what really happened, replacing the other idea.", "explain": "'Instead' introduces what actually happened, replacing the idea that feelings became simple.", "teach": "<b>Instead</b> introduces what <b>actually happened</b>, replacing another idea.<span class='cn'><b>instead</b>(取而代之)引出<b>实际发生</b>的事，代替另一种想法。</span>"}], "vocabulary": [{"q": "'Tangled' means ___.", "choices": ["mixed together in a confusing way", "perfectly clear and simple", "completely calm and quiet"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Priya's feelings were tangled—proud, excited, worried, and sad-for-Jo all at once."}, {"q": "'Assumed' means ___.", "choices": ["asked a direct question", "believed something without checking first", "wrote something down carefully"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Priya had assumed Jo's sadness left no room for happiness about her success."}, {"q": "'Consolation' means ___.", "choices": ["a type of musical solo", "an argument between friends", "something given to make someone feel better after a disappointment"], "answer": 2, "evidencePage": 5, "hint": "Look at page 5.", "explain": "The conversation was not a consolation prize."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(tangled|assumed|consolation)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 4 SEL</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function saveProgress(){try{localStorage.setItem("les-both-things-are-true-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="both-things-are-true"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"both-things-are-true",bookTitle:"Both Things Are True",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

function pickVoice(){const voices=speechSynthesis.getVoices();if(!voices.length)return;const en=voices.filter(v=>/^en(-|_|$)/i.test(v.lang));const pool=en.length?en:voices;const score=v=>{let s=0;const n=(v.name||"").toLowerCase();if(/natural/.test(n))s+=8;if(/neural/.test(n))s+=6;if(/online/.test(n))s+=4;if(/google/.test(n))s+=5;if(/(aria|jenny|guy|libby|sonia|michelle|ava|andrew|emma|clara|natasha)/.test(n))s+=5;if(/(samantha|allison|karen|serena|siri|nicky|aaron)/.test(n))s+=4;if(v.localService===false)s+=3;if(/en-us|en-gb/i.test(v.lang))s+=1;if(/(zira|david|mark|hazel|compact|espeak|eloquence)/.test(n))s-=5;return s};pool.sort((a,b)=>score(b)-score(a));preferredVoice=pool[0]||null}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.i);},at));});};}let advanced=false;const advance=()=>{if(advanced)return;advanced=true;if(watchdog)clearTimeout(watchdog);ci++;speakChunk();};u.onend=advance;u.onerror=advance;const estDur=Math.max(1200,chunk.text.length*110);const watchdog=setTimeout(advance,estDur+4000);speechSynthesis.speak(u);}setTimeout(speakChunk,70);}

function setStatus(m,ok){var el=document.getElementById("recStatus");if(el){el.textContent=m;el.style.color=ok?"#1f8f4d":"#b23b34";}}async function toggleRecording(){const btn=document.getElementById("recordPageBtn");if(recorder&&recorder.state==="recording"){recorder.stop();btn.textContent="🎙 Record";btn.classList.remove("recording");return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setStatus("Recording works only on the published website — the microphone is turned off in this preview.",false);return}if(typeof MediaRecorder==="undefined"){setStatus("This browser can't record audio. Try Chrome/Edge, or Safari 14+.",false);return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});let opts={};if(MediaRecorder.isTypeSupported){if(MediaRecorder.isTypeSupported("audio/webm"))opts={mimeType:"audio/webm"};else if(MediaRecorder.isTypeSupported("audio/mp4"))opts={mimeType:"audio/mp4"};}chunks=[];recorder=new MediaRecorder(stream,opts);recorder.ondataavailable=e=>{if(e.data&&e.data.size>0)chunks.push(e.data)};recorder.onstop=()=>{if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(new Blob(chunks,{type:(recorder.mimeType||"audio/webm")}));document.getElementById("playRecordingBtn").disabled=false;document.getElementById("deleteRecordingBtn").disabled=false;setStatus("Saved! Tap ▶ Play to hear your reading.",true);stream.getTracks().forEach(t=>t.stop())};recorder.start();btn.textContent="■ Stop";btn.classList.add("recording");setStatus("Recording… tap ■ Stop when you finish.",true)}catch(e){var n=(e&&e.name)?e.name:String(e);if(n==="NotAllowedError"||n==="SecurityError"){setStatus("Microphone blocked. In the chat preview the mic is always off — use the live website, then tap Allow (or click 🔒 in the address bar → allow Microphone → reload).",false);}else if(n==="NotFoundError"){setStatus("No microphone found on this device.",false);}else{setStatus("Could not record ("+n+"). Use the live website in Chrome/Edge/Safa
