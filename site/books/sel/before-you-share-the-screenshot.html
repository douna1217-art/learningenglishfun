 16px;display:flex;align-items:center;gap:14px;box-shadow:0 14px 38px rgba(111,74,182,.24);border:1px solid rgba(255,255,255,.32)}.evidence-banner strong{text-shadow:0 1px 6px rgba(60,35,110,.35)}.evidence-banner span{font-size:.84rem;color:#fff}.evidence-banner button{border:0;border-radius:10px;padding:9px 12px;background:rgba(255,255,255,.92);color:var(--purple);font-weight:950;cursor:pointer}.footer{text-align:center;color:var(--muted);font-size:.8rem;padding:13px}

</style><style>/* Stacked pages: full-width art above the reading text. */.book-page,.cover-page{display:flex!important;flex-direction:column!important;min-height:0!important;overflow:hidden!important}.book-page .art,.cover-page .art{order:1!important;display:block!important;width:100%!important;height:auto!important;min-height:0!important;aspect-ratio:16/9!important;overflow:hidden!important;margin:0!important}.book-page .art img,.cover-page .art img{display:block!important;width:100%!important;height:100%!important;object-fit:cover!important;object-position:center!important}.book-page .story,.cover-page .story{order:2!important;display:flex!important;width:100%!important;min-height:0!important;margin:0!important;padding:32px 38px!important}.cover-page .story{padding:34px 42px!important}@media(max-width:820px){.reader.reader-long{overflow:visible!important}.book-page.long-text{overflow:visible!important}.book-page.long-text .art{position:sticky!important;top:0!important;z-index:2!important}.book-page.long-text .story p{font-size:1.05rem!important;line-height:1.5!important}.evidence-banner{padding:9px 12px!important;gap:8px!important;bottom:10px!important;border-radius:13px!important}.evidence-banner div{min-width:0!important}.evidence-banner strong{font-size:.82rem!important;line-height:1.25!important;display:block!important}.evidence-banner span{display:none!important}.evidence-banner button{padding:7px 10px!important;font-size:.8rem!important;flex-shrink:0!important}}</style></head><body><div class="app">
<header class="topbar"><div class="brand"><div class="logo">R</div><div><h1>Before You Share the Screenshot</h1><p>learningenglishfun · Interactive Grade 5 SEL</p></div></div><div class="stage-pill" id="stagePill">Reading Mode</div></header>
<section class="audio-bar"><div class="audio-copy"><strong>Listen, read, and record</strong><span>Narration highlights each word. Recordings stay only in this browser session.</span></div><div class="audio-actions"><button class="audio-btn primary" id="listenPageBtn">🔊 This Page</button><button class="audio-btn" id="listenStoryBtn">📖 Full Story</button><button class="audio-btn" id="pauseBtn" disabled>⏸ Pause</button><button class="audio-btn record" id="recordPageBtn">🎙 Record</button><button class="audio-btn" id="playRecordingBtn" disabled>▶ Play</button><button class="audio-btn" id="deleteRecordingBtn" disabled>🗑 Delete</button></div><div id="recStatus" class="rec-status" aria-live="polite"></div></section>
<main class="shell"><section class="reader"><div id="pageView"></div><div class="controls"><div class="progress" id="progress"></div><div class="nav"><button class="prev" id="prevBtn">← Back</button><button class="next" id="nextBtn">Next →</button></div></div></section><aside class="panel"><div class="journey"><button class="tab active" data-tab="comprehension">1 Story</button><button class="tab" data-tab="grammar">2 Grammar</button><button class="tab" data-tab="vocabulary">3 Vocabulary</button></div><div id="panelContent"></div></aside></main><div class="footer">No API key required · narration, recording, feedback, retry, and progress work in the browser.</div></div>
<script>

const pages=[{"type": "cover", "title": "Before You Share the Screenshot", "subtitle": "Digital trust includes asking before another persons words travel", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/before-you-share-the-screenshot-assets/cover.jpg"}, {"text": "1. The Funny Message\nDuring homework chat, Aisha sent Noah a dramatic complaint about the class play costume. Noah laughed so hard that he took a screenshot. He knew his friends would find it funny too.\nHis finger hovered over the group-chat share button. The message had arrived on his screen, but the words still belonged to a conversation Aisha thought was private.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/before-you-share-the-screenshot-assets/page1.jpg"}, {"text": "2. Possible Audiences\nNoah imagined the first friend laughing, then forwarding the image to someone else. A screenshot could travel beyond the audience he chose and preserve a feeling Aisha might not want repeated.\nHe also noticed the message named another student and showed Aisha's profile image. Sharing it would expose more than one person's information.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/before-you-share-the-screenshot-assets/page2.jpg"}, {"text": "3. Ask without Pressure\nThe next day Noah told Aisha the message had made him laugh and asked whether she was comfortable with him sharing it. He made clear that no was a complete answer.\nAisha said no. She had been frustrated for five minutes, and the costume problem was already solved. She did not want that moment becoming the version of her that classmates remembered.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/before-you-share-the-screenshot-assets/page3.jpg"}, {"text": "4. A Different Way to Connect\nNoah deleted the screenshot. At lunch he told his friends only that Aisha had made him laugh, without repeating the private words or showing the image.\nThey moved on to their own costume stories. Noah could share the feeling of connection without distributing the content that created it.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/before-you-share-the-screenshot-assets/page4.jpg"}, {"text": "5. When Sharing Is Necessary\nA week later, a different message in a game chat threatened a student. Noah did not treat that screenshot like a joke or keep it secret. He showed it to a trusted adult.\nPrivacy mattered, but safety changed the decision. He limited the audience to someone who could help and explained why he had saved the evidence.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/before-you-share-the-screenshot-assets/page5.jpg"}, {"text": "6. Repairing a Slip\nAnother classmate admitted she had already forwarded Aisha's earlier message to one person. She apologized, asked that person to delete it, and told Aisha exactly what had happened.\nAisha appreciated the repair but needed time before trusting the classmate with private messages again. An apology could begin repair; it could not demand immediate forgiveness.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/before-you-share-the-screenshot-assets/page6.jpg"}, {"text": "7. The Pause before Share\nThe friends made a digital rule for themselves: before sharing someone else's words or image, check permission, audience, possible impact, and safety. If any answer was unclear, pause.\nNoah kept the rule beside his tablet as four simple symbols. A screenshot took one second to make, but trust depended on thinking beyond the screen.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/before-you-share-the-screenshot-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "Why did Noah hesitate before sharing the screenshot?", "choices": ["The words still belonged to a conversation Aisha thought was private", "He had already deleted the message by accident", "He was not sure the message was actually funny"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Even though the message was on his screen, Noah realized the words still belonged to a conversation Aisha thought was private."}, {"q": "What did Noah notice about the possible audience for the screenshot?", "choices": ["It would definitely stay within the group chat", "It could travel beyond the audience he chose and named another student too", "Only his closest friend would ever see it"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Noah noticed the screenshot could travel beyond his chosen audience and that it named another student and showed Aisha's profile image."}, {"q": "What did Noah do before sharing the message?", "choices": ["He asked his friends whether they wanted to see it", "He asked Aisha whether she was comfortable with him sharing it", "He shared it first and apologized afterward"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Noah told Aisha the message had made him laugh and asked permission, making clear that no was a complete answer."}, {"q": "What did Noah do after Aisha said no?", "choices": ["He argued with Aisha about her decision", "He deleted the screenshot and only told friends the feeling, not the private words", "He shared it anyway with a smaller group"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Noah deleted the screenshot and described only the feeling of connection, without repeating the private words or image."}, {"q": "Why did Noah show a different screenshot to a trusted adult?", "choices": ["Because he had permission from everyone in the chat", "Because it threatened a student, and safety changed the decision", "Because he wanted to get someone else in trouble for fun"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "When a message threatened a student, Noah showed it to a trusted adult because safety, not privacy, guided that decision."}], "grammar": [{"q": "'Noah checked ___ he shared anything about someone else's words.' Which word correctly completes the sentence to show sequence?", "choices": ["unless", "although", "before"], "answer": 2, "evidencePage": 7, "hint": "This word shows one action happening ahead of another in time.", "explain": "'Before' shows the checking happened ahead of any sharing — matching the group's rule of pausing before sharing.", "teach": "<b>Before</b> shows one action happening <b>ahead of another</b> in time.<span class='cn'><b>before</b>表示一个动作发生在另一个动作<b>之前</b>。</span>"}, {"q": "Which word correctly connects these ideas: 'Privacy usually guided Noah's choice; ___, safety mattered more when a student was threatened.'", "choices": ["and", "however", "because"], "answer": 1, "evidencePage": 5, "hint": "This word shows the second idea contrasts with the first, following a semicolon.", "explain": "'However' is a conjunctive adverb showing the contrast between the usual privacy rule and the safety exception.", "teach": "<b>However</b> is a <b>conjunctive adverb</b> that shows contrast between two sentences.<span class='cn'><b>however</b>是<b>连接性副词</b>，用来表示两个句子之间的<b>转折</b>。</span>"}, {"q": "Which sentence correctly uses a comma after an introductory phrase?", "choices": ["A week later, a different message threatened a student.", "A week later a different message, threatened a student.", "A week, later a different message threatened a student."], "answer": 0, "evidencePage": 5, "hint": "A comma follows an introductory phrase before the main sentence begins.", "explain": "The comma correctly separates the introductory phrase 'A week later' from the main sentence.", "teach": "<b>A comma</b> follows an <b>introductory phrase</b> before the main sentence begins.<span class='cn'><b>逗号</b>用在<b>引导性短语</b>之后，主句开始之前。</span>"}], "vocabulary": [{"q": "'Audience' means ___.", "choices": ["a single private message", "a rule about sharing screenshots", "the group of people who see or hear something"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "A screenshot could travel beyond the audience Noah chose — the group of people he originally intended to see it."}, {"q": "'Permission' means ___.", "choices": ["a punishment for a mistake", "a private conversation", "approval to do something"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Noah asked for Aisha's permission — her approval — before considering whether to share the message."}, {"q": "'Distributing' means ___.", "choices": ["keeping something completely secret", "spreading or sharing something with many people", "deleting something permanently"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Noah could share the feeling of connection without distributing — spreading — the actual private content."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(audience|permission|distributing)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 5 SEL</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}
