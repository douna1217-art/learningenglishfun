<script>

const pages=[{"type": "cover", "title": "The Job Nobody Chose", "subtitle": "Leadership Can Sound Like a Question, a Checklist, or a Well-Timed Handoff", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-job-nobody-chose-assets/cover.jpg"}, {"text": "1. Three Popular Jobs\nThe earthquake-tower challenge offered four jobs: designer, builder, tester, and supply manager. Imani chose designer. Mateo reached for builder. Quinn wanted to run the shake-table test.\nNobody touched the purple supply clipboard. Counting straws, tracking tape, and returning tools sounded less exciting than making the tower. Ms. Vega waited. A group could not begin with one necessary job treated as nobody's work.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-job-nobody-chose-assets/page1.jpg"}, {"text": "2. The Role by Default\nBecause Quinn stood closest to the clipboard, Mateo handed it to them. Quinn frowned. Being quiet at that moment did not mean agreeing, and being organized did not mean they should always manage materials.\nQuinn said, 'I can do supplies for the first round, but I also want a turn testing.' Imani noticed they had treated preferences as permanent traits: Mateo builds, Imani plans, Quinn keeps everything neat.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-job-nobody-chose-assets/page2.jpg"}, {"text": "3. What the Job Actually Leads\nDuring round one, Quinn counted only twelve straws and noticed the design required fourteen. Instead of simply saying no, they asked which two braces mattered most. Imani revised the plan before any material was wasted.\nQuinn also created a return tray so Mateo could find the scissors quickly. The supply role was not an errand. It involved information, questions, and decisions that affected the whole design.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-job-nobody-chose-assets/page3.jpg"}, {"text": "4. Rotating Authority\nAfter the first test, the tower leaned but stayed upright. The team rotated roles. Mateo became supply manager, Quinn became tester, and Imani became builder. The designer role remained open.\nMateo suggested that whoever held the needed evidence should lead that moment. Quinn had test results, so they led the redesign discussion. Imani knew how the braces fit, so she led the careful rebuild. Leadership moved instead of belonging to one title.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-job-nobody-chose-assets/page4.jpg"}, {"text": "5. A Process Problem\nMateo discovered the tape was running low because the first team had taken more than its share. He could have guarded the roll, but that would not solve the class problem.\nHe asked Ms. Vega for a two-minute materials meeting. Teams compared needs and agreed to measure tape in equal starting lengths, with extra pieces available after a reasoned request. Mateo had led beyond his own tower.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-job-nobody-chose-assets/page5.jpg"}, {"text": "6. The Final Test\nFor the last round, the team assigned roles by the next task, not by habit. Imani recorded observations because her careful drawings captured small movements. Quinn rebuilt one red brace. Mateo operated the shake table.\nThe tower shook, tipped, and returned upright. Their success did not belong only to the person whose hands touched the cardboard. It came from design, supplies, testing, questions, listening, and timely handoffs.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-job-nobody-chose-assets/page6.jpg"}, {"text": "7. A Better Job Board\nThe class changed its role board. Under each title, students added the decisions and skills the job required. Supply manager now included anticipate, communicate, track, and solve.\nQuinn chose the role again the next week - this time freely, because they wanted to improve the system. A job nobody had chosen became a place where leadership was visible. The difference was consent, shared understanding, and a real chance to rotate.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-job-nobody-chose-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What job did nobody touch at first?", "choices": ["The designer role", "The purple supply clipboard", "The shake-table tester role"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Nobody touched the purple supply clipboard."}, {"q": "What did Quinn say when handed the clipboard?", "choices": ["I refuse to do this job", "This job is perfect for me forever", "I can do supplies for the first round, but I also want a turn testing"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Quinn said, 'I can do supplies for the first round, but I also want a turn testing.'"}, {"q": "What did Quinn do instead of simply saying no when short on straws?", "choices": ["They asked which two braces mattered most", "They quit the project entirely", "They blamed Imani for the shortage"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Instead of simply saying no, they asked which two braces mattered most."}, {"q": "What happened when the team rotated roles?", "choices": ["Nobody changed their original job", "Mateo became supply manager, Quinn became tester, and Imani became builder", "The team disbanded completely"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Mateo became supply manager, Quinn became tester, and Imani became builder."}, {"q": "What is the big idea of this story?", "choices": ["Only one job title deserves respect", "Leadership belongs to just one person", "The difference was consent, shared understanding, and a real chance to rotate"], "answer": 2, "evidencePage": 7, "hint": "Look at the last page.", "explain": "The difference was consent, shared understanding, and a real chance to rotate."}], "grammar": [{"q": "'Quinn had test results, ___ they led the redesign discussion.' Which word shows a result?", "choices": ["but", "so", "before"], "answer": 1, "evidencePage": 4, "hint": "This word connects having test results to leading the discussion.", "explain": "'So' introduces the result: because Quinn had test results, so they led the redesign discussion.", "teach": "<b>So</b> introduces a <b>result</b> that follows a reason.<span class='cn'><b>so</b>(所以)引出跟随原因而来的<b>结果</b>。</span>"}, {"q": "'He could have guarded the roll, ___ that would not solve the class problem.' Which word shows contrast?", "choices": ["so", "because", "but"], "answer": 2, "evidencePage": 5, "hint": "This word contrasts what Mateo could have done with the real problem it wouldn't fix.", "explain": "'But' contrasts guarding the tape roll with that action failing to solve the larger problem.", "teach": "<b>But</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>but</b>(但是)表示两个事实之间的<b>对比</b>。</span>"}, {"q": "'Quinn chose the role again the next week - this time freely, ___ they wanted to improve the system.' Which word shows a reason?", "choices": ["because", "but", "so"], "answer": 0, "evidencePage": 7, "hint": "This word explains why Quinn freely chose the role again.", "explain": "'Because' gives the reason: because Quinn wanted to improve the system, they chose the role freely.", "teach": "<b>Because</b> introduces a <b>cause</b>—the reason something happened.<span class='cn'><b>because</b>(因为)引出<b>原因</b>——事情发生的理由。</span>"}], "vocabulary": [{"q": "'Default' means ___.", "choices": ["a carefully planned decision", "happening automatically without a deliberate choice", "a type of clipboard"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "The Role by Default—Quinn got the job just by standing closest."}, {"q": "'Rotated' means ___.", "choices": ["stayed in the exact same position", "argued about who was right", "took turns in a repeating cycle"], "answer": 2, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Rotating Authority—the team rotated roles after the first test."}, {"q": "'Consent' means ___.", "choices": ["willing agreement or permission", "a strict punishment", "a type of leadership title"], "answer": 0, "evidencePage": 7, "hint": "Look at page 7.", "explain": "The difference was consent, shared understanding, and a real chance to rotate."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(default|rotated|consent)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 4 SEL</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function saveProgress(){try{localStorage.setItem("les-the-job-nobody-chose-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-job-nobody-chose"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-job-nobody-chose",bookTitle:"The Job Nobody Chose",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

function pickVoice(){const voices=speechSynthesis.getVoices();if(!voices.length)return;const en=voices.filter(v=>/^en(-|_|$)/i.test(v.lang));const pool=en.length?en:voices;const score=v=>{let s=0;const n=(v.name||"").toLowerCase();if(/natural/.test(n))s+=8;if(/neural/.test(n))s+=6;if(/online/.test(n))s+=4;if(/google/.test(n))s+=5;if(/(aria|jenny|guy|libby|sonia|michelle|ava|andrew|emma|clara|natasha)/.test(n))s+=5;if(/(samantha|allison|karen|serena|siri|nicky|aaron)/.test(n))s+=4;if(v.localService===false)s+=3;if(/en-us|en-gb/i.test(v.lang))s+=1;if(/(zira|david|mark|hazel|compact|espeak|eloquence)/.test(n))s-=5;return s};pool.sort((a,b)=>score(b)-score(a));preferredVoice=pool[0]||null}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w. function setStatus(m,ok){var el=document.getElementById("recStatus");if(el){el.textContent=m;el.style.color=ok?"#1f8f4d":"#b23b34";}}async function toggleRecording(){const btn=document.getElementById("recordPageBtn");if(recorder&&recorder.state==="recording"){recorder.stop();btn.textContent="🎙 Record";btn.classList.remove("recording");return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setStatus("Recording works only on the published website — the microphone is turned off in this preview.",false);return}if(typeof MediaRecorder==="undefined"){setStatus("This browser can't record audio. Try Chrome/Edge, or Safari 14+.",false);return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});let opts={};if(MediaRecorder.isTypeSupported){if(MediaRecorder.isTypeSupported("audio/webm"))opts={mimeType:"audio/webm"};else if(MediaRecorder.isTypeSupported("audio/mp4"))opts={mimeType:"audio/mp4"};}chunks=[];recorder=new MediaRecorder(stream,opts);recorder.ondataavailable=e=>{if(e.data&&e.data.size>0)chunks.push(e.data)};recorder.onstop=()=>{if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(new Blob(chunks,{type:(recorder.mimeType||"audio/webm")}));document.getElementById("playRecordingBtn").disabled=false;document.getElementById("deleteRecordingBtn").disabled=false;setStatus("Saved! Tap ▶ Play to hear your reading.",true);stream.getTracks().forEach(t=>t.stop())};recorder.start();btn.textContent="■ Stop";btn.classList.add("recording");setStatus("Recording… tap ■ Stop when you finish.",true)}catch(e){var n=(e&&e.name)?e.name:String(e);if(n==="NotAllowedError"||n==="SecurityError"){setStatus("Microphone blocked. In the chat preview the mic is always off — use the live website, then tap Allow (or click 🔒 in the address bar → allow Microphone → reload).",false);}else if(n==="NotFoundError"){setStatus("No microphone found on this device.",false);}else{setStatus("Could not record ("+n+"). Use the live website in Chrome/Edge/Safa
