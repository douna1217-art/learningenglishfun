 16px;display:flex;align-items:center;gap:14px;box-shadow:0 14px 38px rgba(111,74,182,.24);border:1px solid rgba(255,255,255,.32)}.evidence-banner strong{text-shadow:0 1px 6px rgba(60,35,110,.35)}.evidence-banner span{font-size:.84rem;color:#fff}.evidence-banner button{border:0;border-radius:10px;padding:9px 12px;background:rgba(255,255,255,.92);color:var(--purple);font-weight:950;cursor:pointer}.footer{text-align:center;color:var(--muted);font-size:.8rem;padding:13px}

<script>

const pages=[{"type": "cover", "title": "The Goal on Two Lists", "subtitle": "A useful goal can honor support and still belong to the learner", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-goal-on-two-lists-assets/cover.jpg"}, {"text": "1. Two Versions of Success\nAt the fall goal conference, Sienna opened her spiral notebook to a page titled in her own handwriting. She wanted to design a bridge model that could hold twice its weight and explain what each failed test taught her.\nHer father placed a second goal sheet beside it. He hoped she would earn the highest engineering score in the grade. Sienna knew the wish came from pride and care, yet her shoulders tightened when the score became the whole story.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-goal-on-two-lists-assets/page1.jpg"}, {"text": "2. The Thought Under the Pressure\nSienna first told herself, If I am not first, I will disappoint him. The thought made every weak joint in the bridge feel like proof that she did not belong in engineering.\nMs. Alvarez asked what evidence supported that conclusion. Paolo had celebrated Sienna's questions, helped her find scrap wood, and never said that one ranking determined her future. The pressure was real, but Sienna's prediction was not the only possible interpretation.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-goal-on-two-lists-assets/page2.jpg"}, {"text": "3. Values Behind Both Lists\nPaolo explained that high scores had opened opportunities for him when his family had few choices. He wanted Sienna's work to be recognized. Sienna valued opportunity too, but she also valued curiosity, patience, and being able to explain her own decisions.\nNeither list was meaningless. One emphasized visible achievement. The other emphasized learning she could control. Naming the values helped them discuss the conflict without treating either person as selfish or ungrateful.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-goal-on-two-lists-assets/page3.jpg"}, {"text": "4. A Goal She Could Use\nSienna rewrote her goal: test three bridge designs, record the load each one held, and explain one revision using evidence. A high score could still be a welcome result, but it would not be the daily instruction.\nShe added a check-in question for herself: Am I trying to understand the structure, or only trying not to look wrong? That question turned mistakes into information instead of a verdict about her ability.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-goal-on-two-lists-assets/page4.jpg"}, {"text": "5. Negotiating Support\nSienna asked her father to help in two specific ways: protect one quiet hour on Saturday and ask what she learned before asking about the score. Paolo agreed. He asked Sienna to show him the test record so he could understand her progress.\nThey also named what would not help. Paolo would not compare her with classmates, and Sienna would not hide a difficult result to avoid a conversation. Support became an agreement they could both describe.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-goal-on-two-lists-assets/page5.jpg"}, {"text": "6. The First Weak Test\nThe first bridge bent at the center with less weight than Sienna expected. Embarrassment rose quickly. She stepped away for water, named the feeling, and returned when she could examine the joints instead of attacking herself.\nPaolo asked, 'What did the test reveal?' Sienna showed him how two supports pulled apart. They changed one variable and left the others alone so the next result would mean something.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-goal-on-two-lists-assets/page6.jpg"}, {"text": "7. Evidence of Growth\nThree designs later, Sienna's bridge held more than twice its weight. Another student earned the highest score, while Sienna received strong marks for her testing explanation.\nShe was disappointed for a moment and proud of the work. Paolo asked about the revision before the grade. Sienna realized that ownership did not mean working without anyone's hopes. It meant understanding which values guided her effort and choosing a goal she could actually use.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-goal-on-two-lists-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What were the two different goals at the conference?", "choices": ["A goal about bridges and a goal about a different project", "Sienna's own goal about testing and learning, and her father's goal about earning the highest score", "Two identical goals written by the teacher"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Sienna wanted to test her bridge and explain what failures taught her; her father hoped she would earn the highest score in the grade."}, {"q": "What did Ms. Alvarez ask Sienna to examine?", "choices": ["Whether engineering was the right subject for her", "The evidence behind her thought that not being first would disappoint her father", "Whether her father actually loved her"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Ms. Alvarez asked what evidence supported Sienna's conclusion, since Paolo had never said one ranking determined her future."}, {"q": "What did naming the values behind both goal lists help Sienna and her father do?", "choices": ["Discuss the conflict without treating either person as selfish or ungrateful", "Prove that one of them was completely wrong", "Avoid talking about the disagreement forever"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Naming the values — visible achievement versus learning she could control — helped them discuss the conflict respectfully."}, {"q": "What check-in question did Sienna add for herself?", "choices": ["Is this the fastest way to finish the project?", "Will my father be proud of this specific score?", "Am I trying to understand the structure, or only trying not to look wrong?"], "answer": 2, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Sienna's question turned mistakes into information instead of a verdict about her ability."}, {"q": "What did Sienna ask her father to do to support her?", "choices": ["Build the bridge for her so it would be perfect", "Protect one quiet work hour and ask about her learning before asking about the score", "Stop attending any of her school events"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Sienna asked her father to protect a quiet hour and ask what she learned before asking about the score, and he agreed."}], "grammar": [{"q": "Which sentence correctly uses a colon to introduce an explanation?", "choices": ["Sienna added: one question for herself Am I trying to understand, or only trying not to look wrong?", "Sienna added one question, for herself: Am I trying to understand or only trying not to look wrong.", "Sienna added one question for herself: Am I trying to understand, or only trying not to look wrong?"], "answer": 2, "evidencePage": 4, "hint": "A colon can introduce an explanation after a complete sentence.", "explain": "The colon correctly follows a complete sentence and introduces the exact question that explains it.", "teach": "A <b>colon</b> can introduce an <b>explanation</b> after a complete sentence.<span class='cn'><b>冒号</b>可以用在一个完整句子之后引出<b>解释说明</b>。</span>"}, {"q": "Which sentence correctly uses an apostrophe to show possession?", "choices": ["Siennas' bridge held more than twice its weight.", "Sienna's' bridge held more than twice its weight.", "Sienna's bridge held more than twice its weight."], "answer": 2, "evidencePage": 7, "hint": "An apostrophe plus s shows something belongs to a singular person.", "explain": "'Sienna's' correctly shows the bridge belonged to Sienna, using apostrophe + s for a singular name.", "teach": "<b>Apostrophe + s</b> shows something belongs to a <b>singular</b> person or thing.<span class='cn'><b>撇号+s</b>表示某物属于一个<b>单数</b>的人或物。</span>"}, {"q": "Which sentence correctly uses a comparative form to compare two bridge tests?", "choices": ["The second bridge held most weight than the first one.", "The second bridge held more weight than the first one.", "The second bridge held more weight then the first one."], "answer": 1, "evidencePage": 7, "hint": "Comparing exactly two things uses 'more,' not 'most'; watch for 'than' versus 'then.'", "explain": "'More...than' correctly compares two bridge tests; 'most' is for three or more, and 'then' refers to time, not comparison.", "teach": "Use <b>more ... than</b> to compare <b>two</b> things. <b>Than</b> shows comparison, while <b>then</b> shows time.<span class='cn'>比较<b>两个</b>事物用<b>more ... than</b>。<b>than</b>表示比较，<b>then</b>表示时间。</span>"}], "vocabulary": [{"q": "'Prediction' means ___.", "choices": ["a fact that has already been proven true", "a guess about what will happen, based on limited evidence", "a rule written by a teacher"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Sienna's prediction — that not being first would disappoint her father — was not proven by any evidence Ms. Alvarez could find."}, {"q": "'Negotiating' means ___.", "choices": ["discussing to reach an agreement that works for both people", "demanding that one person get everything they want", "refusing to talk about a disagreement"], "answer": 0, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Sienna and her father negotiated support — discussing until they reached an agreement they could both describe."}, {"q": "'Ownership' (of a goal or project) means ___.", "choices": ["owning a physical object like a bridge model", "having control over your own decisions and effort", "getting the highest possible score"], "answer": 1, "evidencePage": 7, "hint": "Look at page 7.", "explain": "Sienna realized ownership did not mean working without anyone's hopes — it meant choosing a goal she could actually use herself."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(prediction|negotiating|ownership)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 6 SEL</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}
