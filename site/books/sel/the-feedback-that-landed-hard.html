 16px;display:flex;align-items:center;gap:14px;box-shadow:0 14px 38px rgba(111,74,182,.24);border:1px solid rgba(255,255,255,.32)}.evidence-banner strong{text-shadow:0 1px 6px rgba(60,35,110,.35)}.evidence-banner span{font-size:.84rem;color:#fff}.evidence-banner button{border:0;border-radius:10px;padding:9px 12px;background:rgba(255,255,255,.92);color:var(--purple);font-weight:950;cursor:pointer}.footer{text-align:center;color:var(--muted);font-size:.8rem;padding:13px}

<script>

const pages=[{"type": "cover", "title": "The Feedback That Landed Hard", "subtitle": "A pause helped one student separate a draft from a judgment about himself", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-feedback-that-landed-hard-assets/cover.jpg"}, {"text": "1. One Sentence Felt Huge\nJonah's group tested the cardboard bridge he had designed. It bent before holding the target weight. Cam said, 'The center support is too weak.'\nJonah heard more than the sentence. His face warmed, and his mind translated feedback about one support into a judgment that he was bad at engineering. He pushed the sketchbook away before anyone could continue.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-feedback-that-landed-hard-assets/page1.jpg"}, {"text": "2. The Feeling Carried Information\nMs. Flores did not require Jonah to answer immediately. She turned the sand timer and offered a short break at the side table. Jonah noticed embarrassment, disappointment, and fear that his teammates had lost confidence in him.\nThe feelings did not prove what the others believed. They showed that the project and his identity as a capable builder mattered to him.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-feedback-that-landed-hard-assets/page2.jpg"}, {"text": "3. A Request for Specific Feedback\nWhen Jonah returned, he said, 'I want feedback on the model, but I need it to be specific and one person at a time.' Priya repeated Cam's observation as a question: Which part of the center support bent first?\nThe group examined the bridge. They pointed to joints, measurements, and materials instead of labeling the whole design or the person who made it.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-feedback-that-landed-hard-assets/page3.jpg"}, {"text": "4. Feedback Has Limits Too\nCam admitted that his first sentence had named a problem but offered little evidence. He showed where the support had folded and asked whether Jonah wanted an idea or only an observation.\nJonah chose an idea. He did not have to accept every suggestion. Useful feedback stayed connected to the goal, evidence, and choices the designer could evaluate.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-feedback-that-landed-hard-assets/page4.jpg"}, {"text": "5. Revising Without Erasing Ownership\nThe group generated two repair options. Priya suggested a wider base. Cam suggested crossing two narrow braces. Jonah compared both ideas with his original constraints and chose to test the crossed braces.\nAccepting help did not transfer ownership of the project. Jonah made a reasoned choice and explained why the revision fit the bridge's weight limit.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-feedback-that-landed-hard-assets/page5.jpg"}, {"text": "6. The Group Changes Its Feedback\nThe revised bridge held the weight. The team then reviewed its communication. They agreed to describe evidence before evaluation, ask what kind of response would help, and avoid comments about talent or personality.\nJonah added his own responsibility: if a comment landed hard, he could request time or clarification instead of leaving the group without explanation.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-feedback-that-landed-hard-assets/page6.jpg"}, {"text": "7. The Next Draft\nOn the next project, Priya noticed a flaw in Jonah's measurement. His stomach tightened again, but the feeling no longer became an instant verdict.\nJonah took one breath and asked her to show the evidence. He corrected the measurement, thanked her, and kept one suggestion for later. Feedback still mattered deeply. Now he had a way to protect both learning and self-respect.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-feedback-that-landed-hard-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did Jonah's mind do with Cam's comment about the bridge?", "choices": ["It translated feedback about one support into a judgment that he was bad at engineering", "It ignored the comment completely", "It agreed calmly that the fix would be simple"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Jonah's mind translated feedback about one weak support into a judgment about his whole ability, so he pushed the sketchbook away."}, {"q": "What did Ms. Flores do instead of requiring Jonah to answer immediately?", "choices": ["She told the group to stop giving Jonah feedback", "She asked Cam to apologize immediately", "She turned the sand timer and offered him a short break"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Ms. Flores turned the sand timer and offered Jonah a short break at the side table instead of demanding an immediate answer."}, {"q": "What did Jonah ask for when he returned to the group?", "choices": ["For the whole group to agree with his design", "Specific feedback, one person at a time", "No more feedback on the project at all"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Jonah said he wanted feedback on the model, but needed it to be specific and one person at a time."}, {"q": "What did Cam admit about his first comment?", "choices": ["That he had made up the problem entirely", "That it had named a problem but offered little evidence", "That he actually agreed with Jonah's original design"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Cam admitted his first sentence named a problem but offered little evidence, then showed exactly where the support had folded."}, {"q": "What did Jonah do with the two repair ideas the group generated?", "choices": ["He let the group decide for him without any input", "He rejected both ideas without any explanation", "He compared both with his original constraints and chose one to test"], "answer": 2, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Jonah compared both ideas with his original constraints and made a reasoned choice to test the crossed braces."}], "grammar": [{"q": "'Cam gave feedback to Jonah and ___.' Which pronoun correctly completes the sentence as an object?", "choices": ["himself", "him", "he"], "answer": 1, "evidencePage": 3, "hint": "This pronoun follows 'to' and receives the action, so it needs the object form.", "explain": "'Him' is the correct object pronoun after 'to'; 'he' is a subject pronoun and would be incorrect here.", "teach": "Use the <b>object pronoun</b>, such as 'him,' after a preposition such as 'to.'<span class='cn'>介词，例如to，后面要用<b>宾格代词</b>，例如him。</span>"}, {"q": "Which sentence correctly uses a semicolon to join two closely related complete thoughts?", "choices": ["The revised bridge; held the weight the team then reviewed its communication.", "The revised bridge held the weight, the team then reviewed its communication;", "The revised bridge held the weight; the team then reviewed its communication."], "answer": 2, "evidencePage": 6, "hint": "A semicolon joins two complete sentences that are closely related.", "explain": "The semicolon correctly joins two related complete thoughts: the bridge held, and the team reviewed its process.", "teach": "<b>A semicolon</b> joins two <b>closely related complete sentences</b>.<span class='cn'><b>分号</b>连接两个意思相关的<b>完整句子</b>。</span>"}, {"q": "'The team reviewed ___ communication after the test.' Which word correctly completes the sentence?", "choices": ["it's", "their", "its"], "answer": 2, "evidencePage": 6, "hint": "This word shows something belonging to the team (a single group), not a contraction of 'it is.'", "explain": "'Its' shows possession for the singular team; 'it's' means 'it is,' and 'their' would treat 'team' as plural.", "teach": "<b>Its</b> shows <b>possession</b> for a singular noun and has no apostrophe.<span class='cn'><b>its</b>表示单数名词的<b>所属</b>，不带撇号。</span>"}], "vocabulary": [{"q": "'Translated' (as in his mind translated the feedback) means ___.", "choices": ["spoken in a foreign language", "written down exactly, word for word", "changed from one meaning into a different one"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Jonah's mind translated feedback about one support into a much bigger judgment about his whole ability."}, {"q": "'Evaluate' means ___.", "choices": ["carefully judge the value or quality of something", "ignore something completely", "copy something without thinking"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Useful feedback stayed connected to evidence and choices the designer could evaluate — carefully judge — for himself."}, {"q": "'Constraints' means ___.", "choices": ["a list of compliments about the design", "limits or restrictions that shape what is possible", "extra decorations added for fun"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Jonah compared both repair ideas with his original constraints, like the bridge's weight limit, before choosing one."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(translated|evaluate|constraints)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 6 SEL</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}
