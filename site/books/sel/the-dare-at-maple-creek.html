<script>

const pages=[{"type": "cover", "title": "The Dare at Maple Creek", "subtitle": "Belonging Should Not Require Ignoring Your Own Warning Signs", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-dare-at-maple-creek-assets/cover.jpg"}, {"text": "1. The Closed Bridge\nZoe, Nia, and Omar hiked Maple Creek with their families' nature club. A ranger had closed the narrow footbridge after rain loosened one railing. Orange markers showed a safe detour that added fifteen minutes.\nOmar pointed to a low line of stepping stones and said they could cross faster. Nia called it a dare: first person across would choose the snack stop. Zoe's stomach tightened as water rushed between the stones.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-dare-at-maple-creek-assets/page1.jpg"}, {"text": "2. Pressure in Disguise\nZoe said the stones looked slippery. Nia answered, \"We all know how to balance.\" Omar added, \"The water is not even deep.\" Their words made caution sound like a lack of skill.\nZoe noticed three warning signs: the ranger's closure, fast brown water, and her own tight breathing. She also noticed a social warning: the choice was becoming a test of who belonged in the group.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-dare-at-maple-creek-assets/page2.jpg"}, {"text": "3. The First No\n\"No. I am taking the marked detour,\" Zoe said. She kept her voice calm and did not debate whether she was brave. Nia laughed nervously and asked if Zoe was afraid.\n\"Yes, I feel worried—and I am still saying no,\" Zoe replied. Naming fear did not hand control to it or to her friends. It made her reason clear without attacking anyone.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-dare-at-maple-creek-assets/page3.jpg"}, {"text": "4. Two Exit Strategies\nOmar stepped toward the creek bank. Zoe used a second strategy: \"Come with me. We can reach the overlook before the next group.\" She offered connection without joining the unsafe plan.\nWhen Omar hesitated, Zoe used a third strategy. She called Ranger Patel, who was checking signs nearby, and reported the group was considering the stones. Seeking adult support protected everyone; it was not a punishment or a secret weapon.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-dare-at-maple-creek-assets/page4.jpg"}, {"text": "5. New Information\nRanger Patel showed them a branch trapped beneath the surface. The water was deeper and faster around it than it appeared. She thanked Zoe for speaking up and asked the group what made the dare persuasive.\nNia admitted she wanted to seem adventurous. Omar wanted to avoid slowing the group. Neither had intended harm, but intention did not remove risk. They chose the detour together.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-dare-at-maple-creek-assets/page5.jpg"}, {"text": "6. A Different Challenge\nAlong the detour, Ranger Patel invited them to identify five animal tracks before the overlook. The challenge required attention and teamwork rather than risk. Omar found raccoon prints; Nia spotted heron tracks; Zoe recorded both.\nAt the overlook, Nia apologized for turning fear into an insult. Zoe accepted the apology and asked that future dares include an easy way to decline. Omar suggested the phrase, \"Choose in, choose out—still part of the group.\"", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-dare-at-maple-creek-assets/page6.jpg"}, {"text": "7. Still Part of the Group\nAt the snack stop, they practiced their new agreement. Omar proposed racing to identify tree shapes. Nia chose in. Zoe chose to sketch instead, and nobody questioned whether she belonged.\nThe creek continued below the overlook, powerful and bright. Zoe had not proven courage by crossing it. She had shown courage by trusting evidence, resisting pressure, and keeping a path open for everyone to choose safely.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-dare-at-maple-creek-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "Why had the ranger closed the narrow footbridge?", "choices": ["Rain had loosened one railing", "The bridge was being repainted", "Too many hikers were using it"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "A ranger had closed the narrow footbridge after rain loosened one railing."}, {"q": "What warning signs did Zoe notice?", "choices": ["A sign saying the trail was completely safe", "The ranger's closure, fast brown water, and her own tight breathing", "Nothing unusual at all"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Zoe noticed three warning signs: the ranger's closure, fast brown water, and her own tight breathing."}, {"q": "What did Zoe do after Nia asked if she was afraid?", "choices": ["She pretended she wasn't afraid at all", "She agreed to cross the stones", "She said yes, she felt worried, and still said no to the dare"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "\"Yes, I feel worried—and I am still saying no,\" Zoe replied."}, {"q": "What did Ranger Patel find beneath the water's surface?", "choices": ["A branch trapped beneath the surface, making the water deeper and faster than it appeared", "A group of fish", "Nothing unusual at all"], "answer": 0, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Ranger Patel showed them a branch trapped beneath the surface. The water was deeper and faster around it than it appeared."}, {"q": "What is the big idea of this story?", "choices": ["Only the bravest person can cross a dangerous creek", "Belonging should not require ignoring your own warning signs", "Friends should never say no to each other"], "answer": 1, "evidencePage": 7, "hint": "Look at the last page.", "explain": "She had shown courage by trusting evidence, resisting pressure, and keeping a path open for everyone to choose safely."}], "grammar": [{"q": "'Zoe kept her voice calm ___ did not debate whether she was brave.' Which word joins these two actions?", "choices": ["and", "but", "so"], "answer": 0, "evidencePage": 3, "hint": "This word joins the two things Zoe did.", "explain": "'And' joins keeping her voice calm with not debating her own bravery.", "teach": "<b>And</b> joins <b>two actions</b> done by the same person.<span class='cn'><b>and</b>(和)连接同一个人做的<b>两个动作</b>。</span>"}, {"q": "'Omar hesitated, ___ Zoe used a third strategy.' Which word shows a result?", "choices": ["but", "so", "before"], "answer": 1, "evidencePage": 4, "hint": "This word connects Omar's hesitation to what Zoe did next.", "explain": "'So' introduces the result: because Omar hesitated, so Zoe used a third strategy.", "teach": "<b>So</b> introduces a <b>result</b> that follows a reason.<span class='cn'><b>so</b>(所以)引出跟随原因而来的<b>结果</b>。</span>"}, {"q": "'Nia apologized for turning fear into an insult, ___ Zoe accepted the apology.' Which word joins these two actions?", "choices": ["but", "so", "and"], "answer": 2, "evidencePage": 6, "hint": "This word joins Nia's apology with Zoe's response.", "explain": "'And' joins Nia apologizing with Zoe accepting the apology.", "teach": "<b>And</b> joins <b>two related actions</b>.<span class='cn'><b>and</b>(和)连接<b>两个相关的动作</b>。</span>"}], "vocabulary": [{"q": "'Persuasive' means ___.", "choices": ["able to convince someone to do or believe something", "loud and unpleasant", "extremely dangerous"], "answer": 0, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Ranger Patel asked the group what made the dare persuasive."}, {"q": "'Detour' means ___.", "choices": ["the fastest way possible", "an alternate route around an obstacle", "a type of rope bridge"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Orange markers showed a safe detour that added fifteen minutes."}, {"q": "'Strategy' means ___.", "choices": ["an accident that happens by chance", "a type of warning sign", "a planned approach for achieving a goal"], "answer": 2, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Zoe used a second strategy: offering connection without joining the unsafe plan."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(persuasive|detour|strategy)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 4 SEL</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function saveProgress(){try{localStorage.setItem("les-the-dare-at-maple-creek-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-dare-at-maple-creek"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-dare-at-maple-creek",bookTitle:"The Dare at Maple Creek",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

function pickVoice(){const voices=speechSynthesis.getVoices();if(!voices.length)return;const en=voices.filter(v=>/^en(-|_|$)/i.test(v.lang));const pool=en.length?en:voices;const score=v=>{let s=0;const n=(v.name||"").toLowerCase();if(/natural/.test(n))s+=8;if(/neural/.test(n))s+=6;if(/online/.test(n))s+=4;if(/google/.test(n))s+=5;if(/(aria|jenny|guy|libby|sonia|michelle|ava|andrew|emma|clara|natasha)/.test(n))s+=5;if(/(samantha|allison|karen|serena|siri|nicky|aaron)/.test(n))s+=4;if(v.localService===false)s+=3;if(/en-us|en-gb/i.test(v.lang))s+=1;if(/(zira|david|mark|hazel|compact|espeak|eloquence)/.test(n))s-=5;return s};pool.sort((a,b)=>score(b)-score(a));preferredVoice=pool[0]||null}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.
