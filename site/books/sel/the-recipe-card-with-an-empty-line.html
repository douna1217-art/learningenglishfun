<script>

const pages=[{"type": "cover", "title": "The Recipe Card with an Empty Line", "subtitle": "Traditions Can Keep Their Meaning While People Make Room for One Another", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-recipe-card-with-an-empty-line-assets/cover.jpg"}, {"text": "1. The Family Card\nFor the class cookbook, Meilin copied her family's scallion-pancake recipe onto a cream card. Beside the ingredients, she wrote her grandmother's reminder: fold the dough in layers so each bite can open like a page.\nThe recipe mattered because three generations made it together on rainy weekends. Meilin believed the class should preserve every word. Changing an ingredient felt, at first, like changing the memory.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-recipe-card-with-an-empty-line-assets/page1.jpg"}, {"text": "2. A Need Enters the Plan\nOmar checked the ingredient list for the class tasting. One student could not eat wheat, and another family avoided certain cooking oils. The tasting needed clear labels and an option that everyone could examine safely.\nMeilin first heard the request as 'Your recipe is wrong.' Omar clarified that nobody had said that. The facts were about ingredients and access, not the worth of her family or its food.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-recipe-card-with-an-empty-line-assets/page2.jpg"}, {"text": "3. What Must Stay\nMs. Brooks asked Meilin to name what she most wanted to protect. Meilin listed the layered folding, the shared cooking, the savory scallion flavor, and the story about rainy weekends.\nOnly one item on her list required the original flour. The other meanings came from technique, people, taste, and memory. Naming the values made the problem more precise without demanding that Meilin give up the original recipe.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-recipe-card-with-an-empty-line-assets/page3.jpg"}, {"text": "4. Testing Without Pretending\nThe class did not claim that a substitute would taste exactly the same. Meilin and Omar prepared a small teacher-supervised test using a school-approved alternative flour and clearly separated utensils.\nThe first batch cracked when folded. Instead of calling it a failure, they recorded the result. A second version used smaller rounds and gentler folds. It held together, though its texture was different.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-recipe-card-with-an-empty-line-assets/page4.jpg"}, {"text": "5. The Empty Line\nMeilin kept the original recipe exactly as her family used it. Below it, she added a line titled 'Tested adaptation,' describing what changed and what remained different.\nThen she left one line blank. Ms. Brooks explained that families might have other needs, ingredients, or knowledge. The blank space invited responsible additions without pretending one version could represent everyone.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-recipe-card-with-an-empty-line-assets/page5.jpg"}, {"text": "6. Two Plates, Clear Information\nAt the cookbook celebration, the original and adapted pancakes sat on separate plates with ingredient lists. Students could taste either, both, or neither. Nobody had to explain a food choice.\nMeilin's grandmother tried the adapted version and noticed the softer edge. She did not call it the same recipe. She called it a thoughtful cousin: connected by purpose, changed by circumstance.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-recipe-card-with-an-empty-line-assets/page6.jpg"}, {"text": "7. Meaning with Room\nMeilin read the card aloud: original recipe, tested adaptation, and space for future learning. Her family's version had not disappeared. Its story was more visible because she had explained what mattered.\nThe class cookbook became a record of both continuity and change. Traditions could carry memory without becoming locked doors. Careful facts, permission, and honest labels helped more people approach them respectfully.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-recipe-card-with-an-empty-line-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "Why did the recipe matter so much to Meilin?", "choices": ["Three generations made it together on rainy weekends", "It won a cooking contest once", "It was the only recipe she knew"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "The recipe mattered because three generations made it together on rainy weekends."}, {"q": "What did the class tasting actually need?", "choices": ["A completely different recipe", "Clear labels and an option that everyone could examine safely", "No changes at all"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "The tasting needed clear labels and an option that everyone could examine safely."}, {"q": "What did Meilin discover when she named what she wanted to protect?", "choices": ["Everything required the exact original recipe", "Nothing about the recipe actually mattered", "Only one item on her list required the original flour; the rest came from technique, people, taste, and memory"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Only one item on her list required the original flour. The other meanings came from technique, people, taste, and memory."}, {"q": "What happened with the first test batch using alternative flour?", "choices": ["It cracked when folded", "It turned out perfectly on the first try", "It was never tested at all"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "The first batch cracked when folded."}, {"q": "What is the big idea of this story?", "choices": ["Recipes should never be changed for any reason", "Traditions can carry memory without becoming locked doors", "Only the original version of anything has value"], "answer": 1, "evidencePage": 7, "hint": "Look at the last page.", "explain": "Traditions could carry memory without becoming locked doors."}], "grammar": [{"q": "'Meilin first heard the request as an insult, ___ Omar clarified that nobody had said that.' Which word shows contrast?", "choices": ["but", "so", "because"], "answer": 0, "evidencePage": 2, "hint": "This word contrasts what Meilin first thought with what Omar actually meant.", "explain": "'But' contrasts Meilin's first reaction with Omar's actual clarification.", "teach": "<b>But</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>but</b>(但是)表示两个事实之间的<b>对比</b>。</span>"}, {"q": "'The first batch cracked when folded, ___ they recorded the result instead of calling it a failure.' Which word shows a result?", "choices": ["before", "so", "because"], "answer": 1, "evidencePage": 4, "hint": "This word connects the cracked batch to what the class chose to do next.", "explain": "'So' introduces the result: because the batch cracked, so they recorded the result as information.", "teach": "<b>So</b> introduces a <b>result</b> that follows a reason.<span class='cn'><b>so</b>(所以)引出跟随原因而来的<b>结果</b>。</span>"}, {"q": "'Her family's version had not disappeared, ___ its story was more visible because she had explained what mattered.' Which word joins these two facts?", "choices": ["but", "so", "and"], "answer": 2, "evidencePage": 7, "hint": "This word joins the two related facts about Meilin's recipe.", "explain": "'And' joins the recipe not disappearing with its story becoming more visible.", "teach": "<b>And</b> joins <b>two related ideas</b>.<span class='cn'><b>and</b>(和)连接<b>两个相关的想法</b>。</span>"}], "vocabulary": [{"q": "'Preserve' means ___.", "choices": ["to keep something the same and protect it from change", "to destroy or remove something", "to sell something for money"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Meilin believed the class should preserve every word."}, {"q": "'Adaptation' means ___.", "choices": ["the exact original version", "a version changed to fit new needs or conditions", "a type of cooking tool"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "She added a line titled 'Tested adaptation,' describing what changed."}, {"q": "'Continuity' means ___.", "choices": ["a sudden, complete change", "a single meal or dish", "the quality of continuing without interruption over time"], "answer": 2, "evidencePage": 7, "hint": "Look at page 7.", "explain": "The class cookbook became a record of both continuity and change."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(preserve|adaptation|continuity)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 4 SEL</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function saveProgress(){try{localStorage.setItem("les-the-recipe-card-with-an-empty-line-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-recipe-card-with-an-empty-line"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-recipe-card-with-an-empty-line",bookTitle:"The Recipe Card with an Empty Line",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.
