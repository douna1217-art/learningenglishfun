<script>

const pages=[{"type": "cover", "title": "Two Names on the Roster", "subtitle": "A Name Can Carry More Than One Part of a Person", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/two-names-on-the-roster-assets/cover.jpg"}, {"text": "1. The Short Name\nAt soccer practice, the roster listed Daniela, but most teammates called her Dani. She had chosen the shorter name during the first week because it was quick to shout across the field.\nBefore Saturday's family game, Coach Ellis printed new name cards. Daniela watched the marker hover. Her grandmother would be attending, and Daniela suddenly wanted her full name announced. She worried that changing it would seem difficult.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/two-names-on-the-roster-assets/page1.jpg"}, {"text": "2. A Question, Not a Guess\nPriya noticed Daniela erasing and rewriting the card. Instead of deciding what the change meant, she asked, 'Which name would you like us to use today?'\nDaniela said Dani still felt like her soccer name, but hearing Daniela at the family game mattered too. Both names were hers. One did not prove she was friendlier, more serious, or more connected to her family than the other.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/two-names-on-the-roster-assets/page2.jpg"}, {"text": "3. The Old Roster Rule\nThe team had an unwritten rule: once a nickname went on the roster, it stayed all season. Coach Ellis admitted the rule had been convenient, not necessary.\nThey examined its effect. A fixed card saved a few seconds, but it made a past choice harder to update. The team already changed jersey positions and practice partners. A name preference could change too.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/two-names-on-the-roster-assets/page3.jpg"}, {"text": "4. More Than One Right Answer\nOne teammate used a full name everywhere. Another used a family nickname only at home. Priya liked her name spoken exactly the same in every setting.\nDaniela realized that respecting identity did not mean everyone had to make the same choice. It meant believing people about their own names and leaving room for a choice to stay, shift, or return.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/two-names-on-the-roster-assets/page4.jpg"}, {"text": "5. A Roster with Options\nThe team replaced permanent labels with erasable cards. Before games, Coach Ellis privately checked each card: 'What should I announce, and what should teammates use?'\nDaniela chose Daniela for the announcement and Dani during play. The two-answer system worked for her, but it was not a form everyone had to complete in the same way.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/two-names-on-the-roster-assets/page5.jpg"}, {"text": "6. Calling the Pass\nDuring the game, Priya called, 'Dani, left side!' Daniela trapped the ball and passed. From the sideline, her grandmother cheered for Daniela.\nNeither name competed with the other. Each worked in the place Daniela had chosen. When an announcer accidentally said Dani, Daniela corrected him calmly, and he repeated the full name without making the correction into a joke.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/two-names-on-the-roster-assets/page6.jpg"}, {"text": "7. The Choice That Could Change\nAfter the game, Daniela kept both cards in the roster pocket. She might choose differently next week, or she might not. No explanation was required beyond the information people needed to address her respectfully.\nThe new routine took less than a minute. It gave every player something larger: the knowledge that a group could remember who they had been while still making room for who they were becoming.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/two-names-on-the-roster-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "Why did Daniela want her full name announced at the family game?", "choices": ["She didn't like her nickname anymore", "Her grandmother would be attending", "The coach required it"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Her grandmother would be attending, and Daniela suddenly wanted her full name announced."}, {"q": "What did Priya ask instead of guessing what the change meant?", "choices": ["Why are you erasing your card?", "Are you upset with the team?", "Which name would you like us to use today?"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "She asked, 'Which name would you like us to use today?'"}, {"q": "What did Coach Ellis admit about the old roster rule?", "choices": ["The rule had been convenient, not necessary", "The rule was required by league officials", "The rule had never caused any problems"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Coach Ellis admitted the rule had been convenient, not necessary."}, {"q": "What did Daniela realize about respecting identity?", "choices": ["Everyone must use the exact same name in every setting", "It did not mean everyone had to make the same choice", "Only one name could ever be correct"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Respecting identity did not mean everyone had to make the same choice."}, {"q": "What is the big idea of this story?", "choices": ["Nicknames should never be allowed on a team", "Only one name could ever be correct", "A group could remember who people had been while making room for who they were becoming"], "answer": 2, "evidencePage": 7, "hint": "Look at the last page.", "explain": "A group could remember who they had been while still making room for who they were becoming."}], "grammar": [{"q": "'A fixed card saved a few seconds, ___ it made a past choice harder to update.' Which word shows contrast?", "choices": ["so", "but", "because"], "answer": 1, "evidencePage": 3, "hint": "This word contrasts the small benefit with the bigger drawback.", "explain": "'But' contrasts saving a few seconds with making a past choice harder to update.", "teach": "<b>But</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>but</b>(但是)表示两个事实之间的<b>对比</b>。</span>"}, {"q": "'Daniela corrected him calmly, ___ he repeated the full name without making the correction into a joke.' Which word joins these two actions?", "choices": ["but", "so", "and"], "answer": 2, "evidencePage": 6, "hint": "This word joins Daniela's correction with the announcer's response.", "explain": "'And' joins Daniela correcting him with him repeating the name respectfully.", "teach": "<b>And</b> joins <b>two related actions</b>.<span class='cn'><b>and</b>(和)连接<b>两个相关的动作</b>。</span>"}, {"q": "'She might choose differently next week, ___ she might not.' Which word shows an alternative?", "choices": ["or", "and", "but"], "answer": 0, "evidencePage": 7, "hint": "This word presents two possible options.", "explain": "'Or' presents the two possible outcomes: choosing differently, or not.", "teach": "<b>Or</b> presents an <b>alternative</b> possibility.<span class='cn'><b>or</b>(或者)表示一种<b>替代</b>的可能性。</span>"}], "vocabulary": [{"q": "'Identity' means ___.", "choices": ["a type of school roster", "the qualities and characteristics that make a person who they are", "a punishment for breaking a rule"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Respecting identity meant believing people about their own names."}, {"q": "'Permanent' means ___.", "choices": ["temporary and quick to change", "loud and easy to hear", "lasting forever or not meant to be changed"], "answer": 2, "evidencePage": 5, "hint": "Look at page 5.", "explain": "The team replaced permanent labels with erasable cards."}, {"q": "'Respectfully' means ___.", "choices": ["in a way that shows care and consideration for someone", "in a way that ignores someone's feelings", "in a way that is confusing or unclear"], "answer": 0, "evidencePage": 7, "hint": "Look at page 7.", "explain": "No explanation was required beyond the information people needed to address her respectfully."}]};

function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function saveProgress(){try{localStorage.setItem("les-two-names-on-the-roster-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="two-names-on-the-roster"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"two-names-on-the-roster",bookTitle:"Two Names on the Roster",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

function pickVoice(){const voices=speechSynthesis.getVoices();if(!voices.length)return;const en=voices.filter(v=>/^en(-|_|$)/i.test(v.lang));const pool=en.length?en:voices;const score=v=>{let s=0;const n=(v.name||"").toLowerCase();if(/natural/.test(n))s+=8;if(/neural/.test(n))s+=6;if(/online/.test(n))s+=4;if(/google/.test(n))s+=5;if(/(aria|jenny|guy|libby|sonia|michelle|ava|andrew|emma|clara|natasha)/.test(n))s+=5;if(/(samantha|allison|karen|serena|siri|nicky|aaron)/.test(n))s+=4;if(v.localService===false)s+=3;if(/en-us|en-gb/i.test(v.lang))s+=1;if(/(zira|david|mark|hazel|compact|espeak|eloquence)/.test(n))s-=5;return s};pool.sort((a,b)=>score(b)-score(a));preferredVoice=pool[0]||null}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.i);},at));});};}let advanced=false;const advance=()=>{if(advanced)return;advanced=true;if(watchdog)clearTimeout(watchdog);ci++;speakChunk();};u.onend=advance;u.onerror=advance;const estDur=Math.max(1200,chunk.text.length*110);const watchdog=setTimeout(advance,estDur+4000);speechSynthesis.speak(u);}setTimeout(speakChunk,70);}

function setStatus(m,ok){var el=document.getElementById("recStatus");if(el){el.textContent=m;el.style.color=ok?"#1f8f4d":"#b23b34";}}async function toggleRecording(){const btn=document.getElementById("recordPageBtn");if(recorder&&recorder.state==="recording"){recorder.stop();btn.textContent="🎙 Record";btn.classList.remove("recording");return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setStatus("Recording works only on the published website — the microphone is turned off in this preview.",false);return}if(typeof MediaRecorder==="undefined"){setStatus("This browser can't record audio. Try Chrome/Edge, or Safari 14+.",false);return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});let opts={};if(MediaRecorder.isTypeSupported){if(MediaRecorder.isTypeSupported("audio/webm"))opts={mimeType:"audio/webm"};else if(MediaRecorder.isTypeSupported("audio/mp4"))opts={mimeType:"audio/mp4"};}chunks=[];recorder=new MediaRecorder(stream,opts);recorder.ondataavailable=e=>{if(e.data&&e.data.size>0)chunks.push(e.data)};recorder.onstop=()=>{if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(new Blob(chunks,{type:(recorder.mimeType||"audio/webm")}));document.getElementById("playRecordingBtn").disabled=false;document.getElementById("deleteRecordingBtn").disabled=false;setStatus("Saved! Tap ▶ Play to hear your reading.",true);stream.getTracks().forEach(t=>t.stop())};recorder.start();btn.textContent="■ Stop";btn.classList.add("recording");setStatus("Recording… tap ■ Stop when you finish.",true)}catch(e){var n=(e&&e.name)?e.name:String(e);if(n==="NotAllowedError"||n==="SecurityError"){setStatus("Microphone blocked. In the chat preview the mic is always off — use the live website, then tap Allow (or click 🔒 in the address bar → allow Microphone → reload).",false);}else if(n==="NotFoundError"){setStatus("No microphone found on this device.",false);}else{setStatus("Could not record ("+n+"). Use the live website in Chrome/Edge/Safa function cancelFallback(){window.__fbt&&window.__fbt.forEach(clearTimeout);window.__fbt=[];}function setListenActive(id){["listenPageBtn","listenStoryBtn"].forEach(x=>{var el=document.getElementById(x);if(el)el.classList.toggle("active",x===id);});}function readStory(){var token=(window.__readToken=(window.__readToken||0)+1);speechSynthesis.cancel();cancelFallback();clearHighlight();setListenActive("listenStoryBtn");var seq=[{p:0,t:(pages[0].title+`. `+pages[0].subtitle+`.`),hl:false}];for(var i=1;i<pages.length;i++)seq.push({p:i,t:pages[i].text,hl:true});var k=0;function step(){if(token!==window.__readToken)return;if(k>=seq.length){endNarration();return;}var it=seq[k++];page=it.p;renderPage();speak(it.t,it.hl,function(){if(token===window.__readToken)step();});}step();}function endNarration(){stopRvAudio();clearHighlight();cancelFallback();var pb=document.getElementById("pauseBtn");if(pb){pb.textContent="⏸ Pause";pb.disabled=true;pb.classList.remove("active");}setListenActive(null);}
