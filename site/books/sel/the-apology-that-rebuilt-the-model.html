<script>

const pages=[{"type": "cover", "title": "The Apology That Rebuilt the Model", "subtitle": "Repair Began After the Word Sorry", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-apology-that-rebuilt-the-model-assets/cover.jpg"}, {"text": "1. The Shortcut\nEli and Mira had spent a week building a California ecology model. Mira arranged native plant labels while Eli shaped the blue paper stream. During cleanup, Eli tried to carry the whole model alone so they could leave early.\nThe base bent. Brown hills cracked, labels scattered, and the stream tore down the middle. Mira stood silent beside the table. Eli quickly said, \"Sorry,\" then added, \"The cardboard was weak anyway.\"", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-apology-that-rebuilt-the-model-assets/page1.jpg"}, {"text": "2. Sorry Plus an Excuse\nEli expected Mira to say it was fine. Instead, she replied, \"The cardboard did not decide to carry itself.\" Her voice was steady, but she moved her research-card box away from him.\nEli felt embarrassed and defensive. He wanted the uncomfortable moment to end. Ms. Chen reminded him that an apology was not a button that made another person's reaction disappear. Repair required understanding what happened next.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-apology-that-rebuilt-the-model-assets/page2.jpg"}, {"text": "3. Naming His Action\nEli tried again: \"I chose to lift the model alone after we agreed to carry it together. I rushed because I wanted to leave. That bent the base and damaged work you made.\" He stopped before explaining the cardboard.\nMira said the broken labels could be remade. What hurt more was that Eli had ignored their agreement and then blamed the materials. Eli listened without correcting which impact should matter most.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-apology-that-rebuilt-the-model-assets/page3.jpg"}, {"text": "4. No Instant Forgiveness\n\"I am sorry for damaging the model and dismissing your work,\" Eli said. \"You do not have to tell me it is okay. What would help repair this?\" Mira asked for time before deciding.\nAt lunch, Eli did not chase her for an answer or ask friends to prove he was usually careful. He wrote what he could do differently: ask, wait, share the load, and speak honestly when a mistake happened.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-apology-that-rebuilt-the-model-assets/page4.jpg"}, {"text": "5. A Repair Chosen Together\nMira proposed rebuilding the base after school with Ms. Chen present. Eli would remake the hills he had cracked. Mira would redo the labels because she wanted control of her research, and Eli would cut materials only when she requested help.\nThe plan did not divide work equally by minutes. It responded to the actual harm and respected Mira's choices. Eli agreed, even though rebuilding the hills would take longer than his original shortcut had saved.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-apology-that-rebuilt-the-model-assets/page5.jpg"}, {"text": "6. Showing the Change\nDuring repair, Eli reached for the label box, then stopped and asked. Mira handed him only the blank cards. Later, when the new base needed moving, Eli waited until Mira held the other side and Ms. Chen cleared the path.\nThose actions did not erase the damage. They showed that Eli understood the agreement he had broken. Trust returned through repeated evidence, not through one perfect sentence.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-apology-that-rebuilt-the-model-assets/page6.jpg"}, {"text": "7. Stronger at the Seams\nThe finished model had visible reinforcement strips beneath the hills. At the showcase, Mira explained how native plants protected stream banks. Eli described how the team's repair changed both the structure and their process.\nMira had not forgotten the shortcut, but she trusted Eli enough to carry the model with her. The apology mattered because it named harm, made room for impact, and led to change. Repair began after sorry.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-apology-that-rebuilt-the-model-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What happened when Eli tried to carry the whole model alone?", "choices": ["Nothing happened, the model was fine", "The base bent, brown hills cracked, labels scattered, and the stream tore", "Mira caught it just in time"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "The base bent. Brown hills cracked, labels scattered, and the stream tore down the middle."}, {"q": "What did Eli say right after his first \"sorry\"?", "choices": ["He asked Mira to forgive him completely", "He offered to rebuild it immediately", "The cardboard was weak anyway"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Eli quickly said, \"Sorry,\" then added, \"The cardboard was weak anyway.\""}, {"q": "What did Mira say when Eli blamed the cardboard?", "choices": ["The cardboard did not decide to carry itself", "It's okay, don't worry about it", "You should have been more careful with the paint"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "\"The cardboard did not decide to carry itself.\""}, {"q": "What hurt Mira more than the broken model itself?", "choices": ["That the labels were the wrong color", "That Eli had ignored their agreement and then blamed the materials", "That the project would be late"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "What hurt more was that Eli had ignored their agreement and then blamed the materials."}, {"q": "What is the big idea of this story?", "choices": ["Saying sorry immediately fixes everything", "Mistakes should never be discussed afterward", "Repair began after sorry—an apology named harm, made room for impact, and led to change"], "answer": 2, "evidencePage": 7, "hint": "Look at the last page.", "explain": "The apology mattered because it named harm, made room for impact, and led to change. Repair began after sorry."}], "grammar": [{"q": "'Eli expected Mira to say it was fine, ___ she replied that the cardboard did not decide to carry itself.' Which word shows contrast?", "choices": ["so", "but", "because"], "answer": 1, "evidencePage": 2, "hint": "This word contrasts what Eli expected with what Mira actually said.", "explain": "'But' contrasts Eli's expectation with Mira's actual steady reply.", "teach": "<b>But</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>but</b>(但是)表示两个事实之间的<b>对比</b>。</span>"}, {"q": "'Mira asked for time before deciding. ___ Eli did not chase her for an answer.' Which word signals what actually happened?", "choices": ["Because", "Never", "Instead"], "answer": 2, "evidencePage": 4, "hint": "This word introduces what Eli did, rather than pushing for a quick answer.", "explain": "'Instead' introduces what Eli actually did—giving Mira space rather than pushing her.", "teach": "<b>Instead</b> introduces what <b>actually happened</b>, replacing another idea.<span class='cn'><b>instead</b>(取而代之)引出<b>实际发生</b>的事，代替另一种想法。</span>"}, {"q": "'The apology mattered because it named harm, made room for impact, ___ led to change.' Which word joins the last item in this list?", "choices": ["and", "but", "so"], "answer": 0, "evidencePage": 7, "hint": "This word joins the final item to the list.", "explain": "'And' joins the last item—led to change—to the list of what the apology did.", "teach": "<b>And</b> joins the <b>last item</b> in a list.<span class='cn'><b>and</b>(和)连接一系列事物中的<b>最后一项</b>。</span>"}], "vocabulary": [{"q": "'Dismissing' means ___.", "choices": ["celebrating something with praise", "treating something as unimportant or not worth considering", "measuring something precisely"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "\"I am sorry for damaging the model and dismissing your work,\" Eli said."}, {"q": "'Reinforcement' means ___.", "choices": ["a type of paint color", "a written apology", "something added to make a structure stronger"], "answer": 2, "evidencePage": 7, "hint": "Look at page 7.", "explain": "The finished model had visible reinforcement strips beneath the hills."}, {"q": "'Repair' means ___.", "choices": ["the process of fixing or restoring something that was damaged", "the act of breaking something further", "a type of ecology model"], "answer": 0, "evidencePage": 7, "hint": "Look at page 7.", "explain": "Repair began after sorry."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(dismissing|reinforcement|repair)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 4 SEL</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function saveProgress(){try{localStorage.setItem("les-the-apology-that-rebuilt-the-model-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-apology-that-rebuilt-the-model"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-apology-that-rebuilt-the-model",bookTitle:"The Apology That Rebuilt the Model",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.
