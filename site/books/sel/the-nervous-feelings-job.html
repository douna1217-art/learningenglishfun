const pages=[{"type": "cover", "title": "The Nervous Feeling's Job", "subtitle": "A Feeling Can Bring Information Without Making the Decision", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-nervous-feelings-job-assets/cover.jpg"}, {"text": "1. Three Body Clues\nTen minutes before the science share, Niko's stomach fluttered, his palms felt damp, and his words seemed crowded behind his teeth. He decided the feeling meant he should cancel.\nZuri asked whether anything unsafe was happening. The room was familiar, Mr. Kim was present, and Niko had practiced. The body clues were real, but his first interpretation was only one possible explanation.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-nervous-feelings-job-assets/page1.jpg"}, {"text": "2. Information, Not Instructions\nMr. Kim said emotions can carry information without issuing commands. Nervousness might signal danger, importance, uncertainty, excitement, or a need for preparation.\nNiko examined the context. He cared about explaining how visitors should protect tide pools. He was unsure about the opening sentence, and the noisy room made concentration harder. His feeling had delivered several clues.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-nervous-feelings-job-assets/page2.jpg"}, {"text": "3. Match the Strategy\nA single strategy would not solve every clue. For the noise, Niko moved to a quiet side table. For the uncertain opening, he wrote one sentence on the first cue card.\nFor his fast breathing, he used the steady count his family practiced before music performances: breathe in for three, out for four. He chose it because it felt familiar and helped his voice slow.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-nervous-feelings-job-assets/page3.jpg"}, {"text": "4. A Smaller Rehearsal\nNiko did not need to leap from silent practice to a full audience. He rehearsed first for Zuri, then for Zuri and Mr. Kim.\nHis hands still trembled slightly. The goal was not to erase every sensation. It was to learn whether he could speak clearly while the feeling remained. Both listeners understood his main point.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-nervous-feelings-job-assets/page4.jpg"}, {"text": "5. New Evidence\nWhen families entered, the room grew louder again. Niko's stomach flutter returned, but now he had new evidence: the smaller rehearsals had worked.\nHe asked to present near the quieter wall and kept his first cue card visible. These adjustments supported participation; they did not make the presentation less independent or less challenging.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-nervous-feelings-job-assets/page5.jpg"}, {"text": "6. Speaking with the Feeling\nNiko began, 'A tide pool looks sturdy, but many living things there are easy to harm.' His voice shook on sturdy, then settled as he pointed to the first photograph.\nA visitor asked why people should step only on bare rock. Niko answered from his research. The nervous feeling stayed nearby, but curiosity and preparation now had louder voices.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-nervous-feelings-job-assets/page6.jpg"}, {"text": "7. The Message He Kept\nAfterward, Niko wrote what the feeling had told him: this matters; the opening needs work; the room is distracting. Beside each clue, he recorded the strategy that matched it.\nNext time, nervousness might carry a different message, so Niko would check the situation instead of obeying the first thought. A feeling could be respected without being placed in charge.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-nervous-feelings-job-assets/page7.jpg"}];

e interpretation.", "explain": "'But' contrasts the body clues being real with the interpretation being only one possibility.", "teach": "<b>But</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>but</b>(但是)表示两个事实之间的<b>对比</b>。</span>"}, {"q": "'His voice shook on sturdy, ___ settled as he pointed to the first photograph.' Which word signals what happened next?", "choices": ["before", "then", "because"], "answer": 1, "evidencePage": 6, "hint": "This word signals the next thing that happened to his voice.", "explain": "'Then' signals the next step: first his voice shook, then it settled.", "teach": "<b>Then</b> signals the <b>next step</b> in a sequence of events.<span class='cn'><b>then</b>(然后)标志一系列事件中的<b>下一步</b>。</span>"}, {"q": "'Next time, nervousness might carry a different message, ___ Niko would check the situation instead of obeying the first thought.' Which word shows a result?", "choices": ["before", "but", "so"], "answer": 2, "evidencePage": 7, "hint": "This word connects the different message to what Niko decided to do.", "explain": "'So' introduces the result: because the message might differ, so Niko would check the situation.", "teach": "<b>So</b> introduces a <b>result</b> that follows a reason.<span class='cn'><b>so</b>(所以)引出跟随原因而来的<b>结果</b>。</span>"}], "vocabulary": [{"q": "'Interpretation' means ___.", "choices": ["one possible explanation or understanding of something", "a proven scientific fact", "a type of body clue"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "His first interpretation was only one possible explanation."}, {"q": "'Context' means ___.", "choices": ["a type of nervous feeling", "the situation or circumstances surrounding something", "a musical performance"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Niko examined the context."}, {"q": "'Independent' means ___.", "choices": ["always needing help from others", "extremely nervous and shaky", "able to do something function saveProgress(){try{localStorage.setItem("les-the-nervous-feelings-job-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-nervous-feelings-job"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-nervous-feelings-job",bookTitle:"The Nervous Feeling's Job",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

function pickVoice(){const voices=speechSynthesis.getVoices();if(!voices.length)return;const en=voices.filter(v=>/^en(-|_|$)/i.test(v.lang));const pool=en.length?en:voices;const score=v=>{let s=0;const n=(v.name||"").toLowerCase();if(/natural/.test(n))s+=8;if(/neural/.test(n))s+=6;if(/online/.test(n))s+=4;if(/google/.test(n))s+=5;if(/(aria|jenny|guy|libby|sonia|michelle|ava|andrew|emma|clara|natasha)/.test(n))s+=5;if(/(samantha|allison|karen|serena|siri|nicky|aaron)/.test(n))s+=4;if(v.localService===false)s+=3;if(/en-us|en-gb/i.test(v.lang))s+=1;if(/(zira|david|mark|hazel|compact|espeak|eloquence)/.test(n))s-=5;return s};pool.sort((a,b)=>score(b)-score(a));preferredVoice=pool[0]||null}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.
