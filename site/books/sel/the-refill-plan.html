 16px;display:flex;align-items:center;gap:14px;box-shadow:0 14px 38px rgba(111,74,182,.24);border:1px solid rgba(255,255,255,.32)}.evidence-banner strong{text-shadow:0 1px 6px rgba(60,35,110,.35)}.evidence-banner span{font-size:.84rem;color:#fff}.evidence-banner button{border:0;border-radius:10px;padding:9px 12px;background:rgba(255,255,255,.92);color:var(--purple);font-weight:950;cursor:pointer}.footer{text-align:center;color:var(--muted);font-size:.8rem;padding:13px}

<script>

const pages=[{"type": "cover", "title": "The Refill Plan", "subtitle": "A responsible solution considered waste access and safety together", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-refill-plan-assets/cover.jpg"}, {"text": "1. The Mountain of Bottles\nAfter the fall track meet, Asha saw two recycling bins overflowing with single-use bottles. Some still contained water. She proposed banning disposable bottles at the next meet.\nBen agreed immediately. Diego asked what would happen to runners who forgot a bottle, families who could not buy one, or students who needed a sealed container for health or safety reasons. A simple ban no longer seemed complete.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-refill-plan-assets/page1.jpg"}, {"text": "2. The Goal Gets More Specific\nThe group rewrote its goal: reduce wasted plastic while keeping water easy and safe to reach. They counted unopened bottles, partly used bottles, and empty bottles from the last meet.\nThey also asked athletes and volunteers how they got water. The answers showed several needs. Some refilled all day. Some arrived without containers. One runner needed help gripping a stiff dispenser handle.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-refill-plan-assets/page2.jpg"}, {"text": "3. Testing the First Refill Station\nAt practice, the team tested a large refill jug on a tall folding table. It reduced bottles, but the station created new problems. The spout was hard to reach from a seated position, and the line blocked a walkway.\nAsha realized that an environmentally useful idea could still exclude people. The team measured a lower table and moved the line away from the path.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-refill-plan-assets/page3.jpg"}, {"text": "4. Keeping an Emergency Supply\nBen still wanted to eliminate every sealed bottle. Coach Williams explained that hot weather, broken equipment, and unexpected attendance could make backup water necessary.\nThe team kept a small emergency case under the supply cart. They marked it for use when refill stations failed or a person needed a sealed option. Reducing waste did not require pretending every situation was predictable.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-refill-plan-assets/page4.jpg"}, {"text": "5. A Plan With Shared Responsibility\nThe final plan offered loaner bottles, two accessible refill stations, clear cleaning procedures, and a limited emergency supply. Teams assigned volunteers to monitor water levels and keep paths open.\nThe group also asked vendors to avoid handing out bottles automatically. Each choice connected personal convenience with the meet's effects on other people and the environment.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-refill-plan-assets/page5.jpg"}, {"text": "6. Evidence From the Meet\nAt the next meet, the stations stayed busy without blocking the track. Volunteers distributed several loaner bottles and opened the emergency case once when a refill spout jammed.\nAfter cleanup, the recycling bins held far fewer bottles. The team recorded what worked and what needed improvement, including a longer cleaning line than they had expected.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-refill-plan-assets/page6.jpg"}, {"text": "7. Better Than a Perfect Rule\nAsha's first idea had focused on one visible problem. The revised plan considered waste, access, safety, cost, and uncertainty. It did not produce a perfect zero, but it produced a large improvement without denying water to anyone.\nThe team kept collecting evidence for the spring meet. Responsible environmental choices, they learned, required attention to both the planet and the people sharing its resources.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-refill-plan-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What problem did Asha notice after the track meet?", "choices": ["Runners had forgotten their uniforms", "Recycling bins were overflowing with single-use bottles", "The team had run out of drinking water completely"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Asha saw two recycling bins overflowing with single-use bottles, some still containing water."}, {"q": "How did the group rewrite its goal?", "choices": ["To spend as little money as possible on water", "To ban every bottle without any exceptions", "To reduce wasted plastic while keeping water easy and safe to reach"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "They rewrote the goal to reduce wasted plastic while keeping water easy and safe to reach for everyone."}, {"q": "What problem did the first refill station create?", "choices": ["It cost too much money to install", "It ran out of water within five minutes", "The spout was hard to reach from a seated position and the line blocked a walkway"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "The tall table made the spout hard to reach from a seated position, and the line blocked a walkway."}, {"q": "Why did the team keep a small emergency supply of sealed bottles?", "choices": ["Because hot weather or broken equipment could make backup water necessary", "Because the refill stations were only for decoration", "Because Ben insisted on keeping all disposable bottles"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Coach Williams explained that hot weather, broken equipment, or unexpected attendance could make an emergency supply necessary."}, {"q": "What happened at the next meet after the new plan was used?", "choices": ["The plan failed completely and bottles overflowed again", "No one used the refill stations at all", "The stations stayed busy without blocking the track, and far fewer bottles ended up in recycling"], "answer": 2, "evidencePage": 6, "hint": "Look at page 6.", "explain": "The stations stayed busy without blocking the track, and after cleanup the recycling bins held far fewer bottles."}], "grammar": [{"q": "Which sentence correctly uses the irregular comparative form to compare two plans?", "choices": ["The revised plan worked better than the first idea.", "The revised plan worked goodest than the first idea.", "The revised plan worked more better than the first idea."], "answer": 0, "evidencePage": 7, "hint": "'Good' has an irregular comparative form for comparing two things.", "explain": "'Better' is the correct irregular comparative of 'good' for comparing two things; 'more better' and 'goodest' are not standard.", "teach": "<b>Good</b> has an <b>irregular comparative</b>: use <b>better</b> for two things and <b>best</b> for three or more.<span class='cn'><b>good</b>有<b>不规则比较级</b>：两者之间用<b>better</b>，三者或更多用<b>best</b>。</span>"}, {"q": "Which sentence correctly uses an apostrophe to show possession?", "choices": ["The team emergency's case stayed under the supply cart.", "The team's emergency case stayed under the supply cart.", "The teams' emergency case stayed under the supply cart."], "answer": 1, "evidencePage": 4, "hint": "An apostrophe plus s shows something belongs to a singular noun.", "explain": "'Team's' correctly shows the case belonged to the one team, using apostrophe + s.", "teach": "<b>Apostrophe + s</b> shows something belongs to a <b>singular noun</b>.<span class='cn'><b>撇号+s</b>表示某物属于一个<b>单数名词</b>。</span>"}, {"q": "'The plan did not produce a perfect zero, ___ it produced a large improvement.' Which word shows contrast?", "choices": ["because", "but", "so"], "answer": 1, "evidencePage": 7, "hint": "This word shows the second idea contrasts with the first.", "explain": "'But' shows contrast: the plan wasn't perfect, yet it still produced a large improvement.", "teach": "<b>But</b> shows <b>contrast</b> between two ideas.<span class='cn'><b>but</b>表示两个想法间的<b>转折</b>。</span>"}], "vocabulary": [{"q": "'Disposable' means ___.", "choices": ["impossible to ever throw away", "built to be reused many times", "meant to be thrown away after one use"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Disposable bottles are meant to be thrown away after one use, which is why the bins filled up so quickly."}, {"q": "'Eliminate' means ___.", "choices": ["keep exactly the same", "add more of something", "remove or get rid of completely"], "answer": 2, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Ben wanted to eliminate every sealed bottle completely, but the team decided a small emergency supply was still needed."}, {"q": "'Convenience' means ___.", "choices": ["a rule that must always be followed", "a type of recycling bin", "something that makes a task easier or more comfortable"], "answer": 2, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Each choice connected personal convenience — what made things easier for one person — with the meet's effects on others."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(disposable|eliminate|convenience)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 6 SEL</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}
