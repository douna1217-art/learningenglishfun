 16px;display:flex;align-items:center;gap:14px;box-shadow:0 14px 38px rgba(111,74,182,.24);border:1px solid rgba(255,255,255,.32)}.evidence-banner strong{text-shadow:0 1px 6px rgba(60,35,110,.35)}.evidence-banner span{font-size:.84rem;color:#fff}.evidence-banner button{border:0;border-radius:10px;padding:9px 12px;background:rgba(255,255,255,.92);color:var(--purple);font-weight:950;cursor:pointer}.footer{text-align:center;color:var(--muted);font-size:.8rem;padding:13px}

<header class="topbar"><div class="brand"><div class="logo">R</div><div><h1>Feedback in the Margin</h1><p>learningenglishfun · Interactive Grade 4 SEL</p></div></div><div class="stage-pill" id="stagePill">Reading Mode</div></header>
<section class="audio-bar"><div class="audio-copy"><strong>Listen, read, and record</strong><span>Narration highlights each word. Recordings stay only in this browser session.</span></div><div class="audio-actions"><button class="audio-btn primary" id="listenPageBtn">🔊 This Page</button><button class="audio-btn" id="listenStoryBtn">📖 Full Story</button><button class="audio-btn" id="pauseBtn" disabled>⏸ Pause</button><button class="audio-btn record" id="recordPageBtn">🎙 Record</button><button class="audio-btn" id="playRecordingBtn" disabled>▶ Play</button><button class="audio-btn" id="deleteRecordingBtn" disabled>🗑 Delete</button></div><div id="recStatus" class="rec-status" aria-live="polite"></div></section>

<script>

const pages=[{"type": "cover", "title": "Feedback in the Margin", "subtitle": "Useful Feedback Points Toward the Work, Not Away From the Learner", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/feedback-in-the-margin-assets/cover.jpg"}, {"text": "1. The First Comment\nCamila unfolded her neighborhood-garden map for peer review. Green paths connected raised beds, a blue symbol marked the water barrel, and small labels showed where wheelchairs could turn.\nTheo glanced at it and wrote on a pale-yellow note, 'This is confusing.' Camila's shoulders dropped. The comment sounded final, as if confusion were a quality of the map - or of her - rather than a problem that could be located and changed.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/feedback-in-the-margin-assets/page1.jpg"}, {"text": "2. Feedback Needs a Target\nMr. Okafor asked Theo to point to the exact moment he became lost. Theo traced the path from the entrance and stopped where two green lines crossed without labels.\nHe replaced his first note: 'At this crossing, I cannot tell which path reaches the water barrel. Could you add an arrow or label?' Camila could now see the reader's experience and a possible next step. Specific feedback gave her information instead of a verdict.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/feedback-in-the-margin-assets/page2.jpg"}, {"text": "3. Ownership Stays Here\nTheo suggested moving the water barrel to the center. Camila asked, 'Is the location inaccurate, or is the route unclear?' Theo admitted the location made sense; he simply preferred symmetry.\nCamila thanked him and kept the barrel where rain from the roof could reach it. Receiving feedback did not mean obeying every suggestion. She sorted the notes into three groups: revise, investigate, and keep with a reason.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/feedback-in-the-margin-assets/page3.jpg"}, {"text": "4. A Question Before Advice\nWhen it was Camila's turn to review Theo's plant-key page, she noticed tiny letters. She almost wrote, 'Make it bigger.' Instead she asked whom he expected to use the key and from what distance.\nTheo said visitors would read it while standing beside the sign. Camila wrote, 'The plant names may be hard to read from three feet away. Could we test two letter sizes?' Her question connected the feedback to the purpose.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/feedback-in-the-margin-assets/page4.jpg"}, {"text": "5. Testing, Not Guessing\nThey taped both pages to the wall and stepped back three feet. Three classmates tried to follow the map. All three found the new arrow helpful, and two still missed the wheelchair turning symbol.\nCamila added a short legend with a larger access symbol. Theo enlarged the plant names. Their revisions came from reader evidence, not from trying to make every page match one person's taste.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/feedback-in-the-margin-assets/page5.jpg"}, {"text": "6. Feedback for the Giver\nTheo told Camila, 'Your question helped me think instead of just changing things.' Camila replied that his second note had helped because it named a place, an effect, and an option.\nMr. Okafor asked them to give feedback on the feedback process. They created a class reminder: be specific, connect to the goal, invite thinking, and let the creator decide after checking evidence.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/feedback-in-the-margin-assets/page6.jpg"}, {"text": "7. Marks That Opened a Door\nAt the garden meeting, visitors followed Camila's map from the entrance to the water barrel without asking for directions. Theo's plant key could be read from beside the sign.\nCamila kept the first vague note in her folder, not as an insult but as a comparison. Useful feedback did not close the margin around her work. It opened a door through which the work could grow while remaining hers.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/feedback-in-the-margin-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did Theo write on his first note about Camila's map?", "choices": ["This is confusing", "This is exactly right", "This needs more color"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Theo wrote on a pale-yellow note, 'This is confusing.'"}, {"q": "What did Mr. Okafor ask Theo to do?", "choices": ["Redo the whole map himself", "Point to the exact moment he became lost", "Give up on giving feedback"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Mr. Okafor asked Theo to point to the exact moment he became lost."}, {"q": "What did Camila do instead of automatically moving the water barrel?", "choices": ["She moved it immediately without asking", "She ignored Theo's suggestion completely", "She asked whether the location was inaccurate or the route was unclear"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Camila asked, 'Is the location inaccurate, or is the route unclear?'"}, {"q": "What did Camila ask before giving advice about the tiny letters?", "choices": ["Whom Theo expected to use the key and from what distance", "Whether Theo liked the color scheme", "How long the project would take"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Instead she asked whom he expected to use the key and from what distance."}, {"q": "What is the big idea of this story?", "choices": ["Feedback should always be kept brief and vague", "Useful feedback points toward the work, not away from the learner", "Only the reviewer's opinion matters"], "answer": 1, "evidencePage": 7, "hint": "Look at the last page.", "explain": "Useful feedback did not close the margin around her work. It opened a door."}], "grammar": [{"q": "'He replaced his first note, ___ Camila could now see the reader's experience.' Which word shows a result?", "choices": ["so", "but", "before"], "answer": 0, "evidencePage": 2, "hint": "This word connects the new note to what Camila could now understand.", "explain": "'So' introduces the result: because Theo replaced his note, so Camila could see his experience.", "teach": "<b>So</b> introduces a <b>result</b> that follows a reason.<span class='cn'><b>so</b>(所以)引出跟随原因而来的<b>结果</b>。</span>"}, {"q": "'Theo admitted the location made sense, ___ he simply preferred symmetry.' Which word shows contrast?", "choices": ["so", "but", "and"], "answer": 1, "evidencePage": 3, "hint": "This word contrasts the location making sense with Theo's personal preference.", "explain": "'But' contrasts the location making sense with Theo's preference for symmetry.", "teach": "<b>But</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>but</b>(但是)表示两个事实之间的<b>对比</b>。</span>"}, {"q": "'All three found the new arrow helpful, ___ two still missed the wheelchair turning symbol.' Which word shows contrast?", "choices": ["so", "because", "yet"], "answer": 2, "evidencePage": 5, "hint": "This word contrasts the arrow being helpful with a symbol still being missed.", "explain": "'Yet' contrasts the arrow's success with the turning symbol still being overlooked.", "teach": "<b>X, yet Y</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>yet</b>(然而)表示两个事实之间的<b>对比</b>。</span>"}], "vocabulary": [{"q": "'Confusing' means ___.", "choices": ["difficult to understand or follow clearly", "extremely well organized", "colorful and decorative"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Theo wrote, 'This is confusing.'"}, {"q": "'Symmetry' means ___.", "choices": ["a type of garden plant", "a balanced, matching arrangement on either side", "a written comment"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Theo simply preferred symmetry in the map's design."}, {"q": "'Legend' means ___.", "choices": ["a famous old story", "a type of measurement tool", "a key that explains the symbols used on a map"], "answer": 2, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Camila added a short legend with a larger access symbol."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(confusing|symmetry|legend)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 4 SEL</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}
