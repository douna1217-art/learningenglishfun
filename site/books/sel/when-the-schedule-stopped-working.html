<script>

const pages=[{"type": "cover", "title": "When the Schedule Stopped Working", "subtitle": "A useful plan can change when the facts of a week change", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/when-the-schedule-stopped-working-assets/cover.jpg"}, {"text": "1. The Original Plan\nDiego planned to finish his bridge model in five afternoon sessions. He divided the work evenly: measure, cut, assemble, test, and revise. The schedule looked realistic on Monday.\nOn Tuesday, his grandmother's work shift changed. Diego needed to meet his younger cousin after school. By Wednesday, two project sessions had disappeared, but the deadline had not.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/when-the-schedule-stopped-working-assets/page1.jpg"}, {"text": "2. Working Faster Did Not Work\nDiego tried to complete two steps at once. He measured while gluing, misplaced a support, and stayed up later than usual. The next morning, he was tired and the bridge leaned.\nHe told himself that better self-discipline meant forcing the old schedule to work. Hana disagreed. Discipline could also mean noticing evidence and changing a plan before the problem grew.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/when-the-schedule-stopped-working-assets/page2.jpg"}, {"text": "3. What Could Change\nMr. Reed helped Diego sort the barriers. The family schedule was not under Diego's control. The project deadline could be discussed. The size of the bridge, the order of the steps, and the location of the work could change.\nDiego asked for a short planning conference instead of hiding the delay. Mr. Reed kept the learning goal but approved a smaller bridge and one extra school work period.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/when-the-schedule-stopped-working-assets/page3.jpg"}, {"text": "4. A Plan Built Around Real Time\nThe revised schedule used shorter blocks. Diego measured during the school work period, packed one safe paper task for the library, and saved cutting and gluing for the makerspace.\nHe added a five-minute setup note before each session. Gathering tools had been using time he never counted. The new plan included the work around the work.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/when-the-schedule-stopped-working-assets/page4.jpg"}, {"text": "5. Protecting Focus\nAt the library, Diego noticed that phone alerts broke his concentration. He silenced the device, chose a seat facing away from the entrance, and used a timer for one short work block.\nHana preferred quiet music while she worked. Diego preferred silence. A focus strategy did not have to look the same for everyone; it had to help the person complete the intended task.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/when-the-schedule-stopped-working-assets/page5.jpg"}, {"text": "6. Testing the Revised Plan\nOn Friday, the smaller bridge held the first test weight but twisted under the second. Diego had thirty minutes left. The original plan would have sent him back to redesign every part.\nInstead, he checked the evidence and strengthened the two weak joints. The bridge passed the next test. Adjusting the scope had preserved time for the most important learning: testing and revision.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/when-the-schedule-stopped-working-assets/page6.jpg"}, {"text": "7. Progress Without Pretending\nDiego's final reflection showed both schedules. He explained why the first had been reasonable, what changed, and which strategies helped. He did not describe the family responsibility as an excuse or a failure.\nThe bridge was smaller than he first imagined, but the planning skill had grown. Diego learned that commitment meant staying connected to the goal, even when the route and the timetable needed honest revision.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/when-the-schedule-stopped-working-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "Why did Diego's original five-session schedule stop working?", "choices": ["The teacher canceled the whole assignment", "His grandmother's work shift changed, removing two project sessions", "He decided the bridge project was not important"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "His grandmother's work shift changed and two project sessions disappeared, but the deadline stayed the same."}, {"q": "What happened when Diego tried to complete two steps of the project at once?", "choices": ["Hana finished the steps for him", "He misplaced a support and the bridge leaned the next morning", "He finished early with a stronger bridge"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Diego measured while gluing, misplaced a support, and the bridge leaned the next morning after he stayed up too late."}, {"q": "What did Mr. Reed approve after Diego asked for a planning conference?", "choices": ["No changes to the original plan", "A smaller bridge and one extra school work period", "A completely new project topic"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Mr. Reed kept the learning goal but approved a smaller bridge and one extra school work period."}, {"q": "What did Diego add to his revised schedule that he had not counted before?", "choices": ["A second bridge to build as backup", "An extra day off from school", "A five-minute setup note before each session"], "answer": 2, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Diego added a five-minute setup note, since gathering tools had been using time he had never counted before."}, {"q": "How did Diego protect his focus at the library?", "choices": ["He worked only late at night when it was quiet", "He asked everyone to leave the library", "He silenced his phone and sat facing away from the entrance"], "answer": 2, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Diego silenced his device, chose a seat facing away from the entrance, and used a timer for one short work block."}], "grammar": [{"q": "Which sentence correctly uses a comparative form to compare two schedules?", "choices": ["The revised schedule worked better than the original one.", "The revised schedule worked more better than the original one.", "The revised schedule worked bestly than the original one."], "answer": 0, "evidencePage": 4, "hint": "Comparing two things uses one comparative word, not two.", "explain": "'Better' alone correctly compares two schedules; adding 'more' or using 'bestly' is incorrect.", "teach": "Use <b>one comparative word</b> (like 'better') to compare <b>two things</b>.<span class='cn'>比较<b>两个事物</b>只用<b>一个比较级</b>词（如better）。</span>"}, {"q": "Which sentence correctly uses apostrophes to show possession?", "choices": ["Diego's grandmother's work shift changed on Tuesday.", "Diegos' grandmothers' work shift changed on Tuesday.", "Diego's grandmothers work shift changed on Tuesday."], "answer": 0, "evidencePage": 1, "hint": "Each singular owner needs its own apostrophe + s.", "explain": "Both 'Diego's' and 'grandmother's' correctly use apostrophe + s to show the shift belonged to the grandmother, part of Diego's family.", "teach": "Each <b>singular owner</b> gets its own <b>apostrophe + s</b>.<span class='cn'>每个<b>单数所有者</b>都要单独加<b>撇号+s</b>。</span>"}, {"q": "Which sentence correctly uses the correlative conjunction pair 'not only...but also'?", "choices": ["Diego learned not only to plan carefully but also to revise when facts changed.", "Diego learned not to plan carefully but also to revise when facts changed.", "Diego learned not only to plan carefully but to revise when facts changed."], "answer": 0, "evidencePage": 7, "hint": "This pair of words works together and both parts must appear correctly.", "explain": "'Not only...but also' is a matched pair; both parts are needed for the sentence to be correct.", "teach": "<b>Not only</b> and <b>but also</b> form a <b>matched pair</b> of conjunctions.<span class='cn'><b>not only</b>和<b>but also</b>构成一对<b>成对连词</b>。</span>"}], "vocabulary": [{"q": "'Realistic' means ___.", "choices": ["reasonable and likely to actually happen", "impossible to ever achieve", "based only on imagination"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "The schedule looked realistic on Monday, meaning it seemed reasonable and achievable before the family's plans changed."}, {"q": "'Concentration' means ___.", "choices": ["a short break between tasks", "focused attention on one task", "a loud noise that distracts someone"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Phone alerts broke Diego's concentration, meaning they interrupted his focused attention on the task."}, {"q": "'Reflection' means ___.", "choices": ["a rule about how to build a bridge", "a photograph taken of a finished project", "careful thinking back over what happened"], "answer": 2, "evidencePage": 7, "hint": "Look at page 7.", "explain": "Diego's final reflection showed both schedules and explained what changed, meaning he thought carefully back over the process."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(realistic|concentration|reflection)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 5 SEL</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function saveProgress(){try{localStorage.setItem("les-when-the-schedule-stopped-working-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="when-the-schedule-stopped-working"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"when-the-schedule-stopped-working",bookTitle:"When the Schedule Stopped Working",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

function pickVoice(){const voices=speechSynthesis.getVoices();if(!voices.length)return;const en=voices.filter(v=>/^en(-|_|$)/i.test(v.lang));const pool=en.length?en:voices;const score=v=>{let s=0;const n=(v.name||"").toLowerCase();if(/natural/.test(n))s+=8;if(/neural/.test(n))s+=6;if(/online/.test(n))s+=4;if(/google/.test(n))s+=5;if(/(aria|jenny|guy|libby|sonia|michelle|ava|andrew|emma|clara|natasha)/.test(n))s+=5;if(/(samantha|allison|karen|serena|siri|nicky|aaron)/.test(n))s+=4;if(v.localService===false)s+=3;if(/en-us|en-gb/i.test(v.lang))s+=1;if(/(zira|david|mark|hazel|compact|espeak|eloquence)/.test(n))s-=5;return s};pool.sort((a,b)=>score(b)-score(a));preferredVoice=pool[0]||null}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w. function setStatus(m,ok){var el=document.getElementById("recStatus");if(el){el.textContent=m;el.style.color=ok?"#1f8f4d":"#b23b34";}}async function toggleRecording(){const btn=document.getElementById("recordPageBtn");if(recorder&&recorder.state==="recording"){recorder.stop();btn.textContent="🎙 Record";btn.classList.remove("recording");return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setStatus("Recording works only on the published website — the microphone is turned off in this preview.",false);return}if(typeof MediaRecorder==="undefined"){setStatus("This browser can't record audio. Try Chrome/Edge, or Safari 14+.",false);return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});let opts={};if(MediaRecorder.isTypeSupported){if(MediaRecorder.isTypeSupported("audio/webm"))opts={mimeType:"audio/webm"};else if(MediaRecorder.isTypeSupported("audio/mp4"))opts={mimeType:"audio/mp4"};}chunks=[];recorder=new MediaRecorder(stream,opts);recorder.ondataavailable=e=>{if(e.data&&e.data.size>0)chunks.push(e.data)};recorder.onstop=()=>{if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(new Blob(chunks,{type:(recorder.mimeType||"audio/webm")}));document.getElementById("playRecordingBtn").disabled=false;document.getElementById("deleteRecordingBtn").disabled=false;setStatus("Saved! Tap ▶ Play to hear your reading.",true);stream.getTracks().forEach(t=>t.stop())};recorder.start();btn.textContent="■ Stop";btn.classList.add("recording");setStatus("Recording… tap ■ Stop when you finish.",true)}catch(e){var n=(e&&e.name)?e.name:String(e);if(n==="NotAllowedError"||n==="SecurityError"){setStatus("Microphone blocked. In the chat preview the mic is always off — use the live website, then tap Allow (or click 🔒 in the address bar → allow Microphone → reload).",false);}else if(n==="NotFoundError"){setStatus("No microphone found on this device.",false);}else{setStatus("Could not record ("+n+"). Use the live website in Chrome/Edge/Safa
