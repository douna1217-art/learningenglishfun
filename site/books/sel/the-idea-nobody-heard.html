 16px;display:flex;align-items:center;gap:14px;box-shadow:0 14px 38px rgba(111,74,182,.24);border:1px solid rgba(255,255,255,.32)}.evidence-banner strong{text-shadow:0 1px 6px rgba(60,35,110,.35)}.evidence-banner span{font-size:.84rem;color:#fff}.evidence-banner button{border:0;border-radius:10px;padding:9px 12px;background:rgba(255,255,255,.92);color:var(--purple);font-weight:950;cursor:pointer}.footer{text-align:center;color:var(--muted);font-size:.8rem;padding:13px}

<script>

const pages=[{"type": "cover", "title": "The Idea Nobody Heard", "subtitle": "A Group Cannot Use a Voice It Never Makes Room to Receive", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-idea-nobody-heard-assets/cover.jpg"}, {"text": "1. Fast Ideas\nNoura, Caleb, and Mei had twenty minutes to design a quieter chair-scraping solution. Caleb called ideas as soon as they entered his mind. Mei responded quickly and kept the marker moving across the planning sheet.\nNoura waited for a pause and opened her yellow sketchbook. Twice she began, \"What if—\" and twice the conversation rushed ahead. The group was busy, but not every member had a real way into the work.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-idea-nobody-heard-assets/page1.jpg"}, {"text": "2. Mistaking Silence\nCaleb assumed Noura had no idea yet. Mei assumed she agreed with their plan to tape foam squares under every chair. Neither assumption was unkind, but both replaced curiosity with a story about her silence.\nWhen Ms. Park asked each student to explain the design, Noura showed a drawing of removable felt sleeves that could be washed and reused. Caleb stared at it. \"Why didn't you say that?\" he asked.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-idea-nobody-heard-assets/page2.jpg"}, {"text": "3. The Barrier, Not the Person\nNoura replied that she had tried, but the pace offered no opening. She preferred thinking through a drawing before speaking. The problem was not that Caleb and Mei talked; it was that their process rewarded only the fastest kind of response.\nMs. Park asked the group to redesign how they shared ideas before redesigning the chair. They made three cards: SPEAK, DRAW, and WRITE, using clear symbols as well as words.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-idea-nobody-heard-assets/page3.jpg"}, {"text": "4. One Quiet Minute\nFor the next round, everyone received one quiet minute to prepare in any mode. Caleb sketched a snap closure. Mei wrote a question about cost. Noura added a washable fabric label to her drawing.\nThen each person shared without interruption, and a partner summarized the idea before responding. Slowing the process did not reduce energy. It turned three separate thoughts into information the group could combine.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-idea-nobody-heard-assets/page4.jpg"}, {"text": "5. Testing Every Voice\nThey built three prototypes: taped foam, a tied felt sleeve, and a snap-on sleeve. The tape peeled, the tie dragged, and the snap held but took too long to sew. Each result answered a different student's question.\nNoura suggested a wide elastic band inside the felt. Mei calculated the material needed, and Caleb tested how quickly it slipped onto a chair leg. Their improved design belonged to the group because each contribution remained visible.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-idea-nobody-heard-assets/page5.jpg"}, {"text": "6. More Than Taking Turns\nDuring their presentation, Caleb explained that equal turn-taking had not been enough at first. A turn was useful only if the process allowed each person to prepare, communicate, and be understood.\nMei demonstrated the three participation cards. Noura showed the final sketch and chose Caleb to explain the snap test. Making room for Noura's voice did not mean only Noura could speak; it meant the group stopped treating one style as the default.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-idea-nobody-heard-assets/page6.jpg"}, {"text": "7. A Room That Could Listen\nThe class adopted quiet planning minutes for future design meetings. Students could begin with speech, drawing, writing, or another agreed method. The goal was not silence or perfect equality of words; it was meaningful access to the conversation.\nAs felt sleeves softened the scrape of chairs, Noura heard a different kind of quiet too—the pause before classmates responded. It was the sound of a room making space to listen.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-idea-nobody-heard-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did Noura do while Caleb and Mei rushed ahead with ideas?", "choices": ["She left the group entirely", "She copied Mei's plan exactly", "She waited for a pause and opened her yellow sketchbook"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Noura waited for a pause and opened her yellow sketchbook."}, {"q": "What did Caleb and Mei assume about Noura's silence?", "choices": ["Caleb assumed she had no idea yet, and Mei assumed she agreed with their plan", "They assumed she wanted to lead the group", "They assumed she had finished the whole project alone"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Caleb assumed Noura had no idea yet. Mei assumed she agreed with their plan."}, {"q": "What was the real problem, according to Noura?", "choices": ["Noura simply did not care about the project", "The process rewarded only the fastest kind of response, not that Caleb and Mei talked", "The teacher was not paying attention"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "It was not that Caleb and Mei talked; it was that their process rewarded only the fastest kind of response."}, {"q": "What happened when everyone got one quiet minute to prepare?", "choices": ["Nobody had anything new to add", "The group ran out of time completely", "It turned three separate thoughts into information the group could combine"], "answer": 2, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Slowing the process turned three separate thoughts into information the group could combine."}, {"q": "What is the big idea of this story?", "choices": ["A group cannot use a voice it never makes room to receive", "Only the fastest thinkers deserve to be heard", "Quiet students should always speak last"], "answer": 0, "evidencePage": 7, "hint": "Look at the last page.", "explain": "A group cannot use a voice it never makes room to receive."}], "grammar": [{"q": "'Neither assumption was unkind, ___ both replaced curiosity with a story about her silence.' Which word shows contrast?", "choices": ["so", "because", "but"], "answer": 2, "evidencePage": 2, "hint": "This word contrasts the assumptions not being unkind with them still causing a problem.", "explain": "'But' contrasts the assumptions not being unkind with them still replacing curiosity.", "teach": "<b>But</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>but</b>(但是)表示两个事实之间的<b>对比</b>。</span>"}, {"q": "'Then each person shared without interruption, ___ a partner summarized the idea before responding.' Which word joins these two actions?", "choices": ["and", "but", "so"], "answer": 0, "evidencePage": 4, "hint": "This word joins the two steps of the new process.", "explain": "'And' joins sharing without interruption with a partner summarizing the idea.", "teach": "<b>And</b> joins <b>two related actions</b>.<span class='cn'><b>and</b>(和)连接<b>两个相关的动作</b>。</span>"}, {"q": "'Caleb sketched a snap closure. Mei wrote a question about cost. ___ Noura added a washable fabric label to her drawing.' Which word signals what happened next?", "choices": ["Before", "Then", "Never"], "answer": 1, "evidencePage": 4, "hint": "This word signals the next thing that happened, in order.", "explain": "'Then' signals the next step, after Caleb and Mei had already worked.", "teach": "<b>Then</b> signals the <b>next step</b> in a sequence of events.<span class='cn'><b>then</b>(然后)标志一系列事件中的<b>下一步</b>。</span>"}], "vocabulary": [{"q": "'Prototype' means ___.", "choices": ["a finished product ready for sale", "a written instruction manual", "an early sample version built to test an idea"], "answer": 2, "evidencePage": 5, "hint": "Look at page 5.", "explain": "They built three prototypes: taped foam, a tied felt sleeve, and a snap-on sleeve."}, {"q": "'Curiosity' means ___.", "choices": ["a strong desire to learn or find out more about something", "a feeling of anger or frustration", "a type of design challenge"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Both assumptions replaced curiosity with a story about her silence."}, {"q": "'Demonstrated' means ___.", "choices": ["hid something on purpose", "showed clearly how something works through example", "argued loudly about something"], "answer": 1, "evidencePage": 6, "hint": "Look at page 6.", "explain": "Mei demonstrated the three participation cards."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(prototype|curiosity|demonstrated)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 4 SEL</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function saveProgress(){try{localStorage.setItem("les-the-idea-nobody-heard-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-idea-nobody-heard"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-idea-nobody-heard",bookTitle:"The Idea Nobody Heard",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

function pickVoice(){const voices=speechSynthesis.getVoices();if(!voices.length)return;const en=voices.filter(v=>/^en(-|_|$)/i.test(v.lang));const pool=en.length?en:voices;const score=v=>{let s=0;const n=(v.name||"").toLowerCase();if(/natural/.test(n))s+=8;if(/neural/.test(n))s+=6;if(/online/.test(n))s+=4;if(/google/.test(n))s+=5;if(/(aria|jenny|guy|libby|sonia|michelle|ava|andrew|emma|clara|natasha)/.test(n))s+=5;if(/(samantha|allison|karen|serena|siri|nicky|aaron)/.test(n))s+=4;if(v.localService===false)s+=3;if(/en-us|en-gb/i.test(v.lang))s+=1;if(/(zira|david|mark|hazel|compact|espeak|eloquence)/.test(n))s-=5;return s};pool.sort((a,b)=>score(b)-score(a));preferredVoice=pool[0]||null}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.i);},at));});};}let advanced=false;const advance=()=>{if(advanced)return;advanced=true;if(watchdog)clearTimeout(watchdog);ci++;speakChunk();};u.onend=advance;u.onerror=advance;const estDur=Math.max(1200,chunk.text.length*110);const watchdog=setTimeout(advance,estDur+4000);speechSynthesis.speak(u);}setTimeout(speakChunk,70);}

function setStatus(m,ok){var el=document.getElementById("recStatus");if(el){el.textContent=m;el.style.color=ok?"#1f8f4d":"#b23b34";}}async function toggleRecording(){const btn=document.getElementById("recordPageBtn");if(recorder&&recorder.state==="recording"){recorder.stop();btn.textContent="🎙 Record";btn.classList.remove("recording");return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setStatus("Recording works only on the published website — the microphone is turned off in this preview.",false);return}if(typeof MediaRecorder==="undefined"){setStatus("This browser can't record audio. Try Chrome/Edge, or Safari 14+.",false);return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});let opts={};if(MediaRecorder.isTypeSupported){if(MediaRecorder.isTypeSupported("audio/webm"))opts={mimeType:"audio/webm"};else if(MediaRecorder.isTypeSupported("audio/mp4"))opts={mimeType:"audio/mp4"};}chunks=[];recorder=new MediaRecorder(stream,opts);recorder.ondataavailable=e=>{if(e.data&&e.data.size>0)chunks.push(e.data)};recorder.onstop=()=>{if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(new Blob(chunks,{type:(recorder.mimeType||"audio/webm")}));document.getElementById("playRecordingBtn").disabled=false;document.getElementById("deleteRecordingBtn").disabled=false;setStatus("Saved! Tap ▶ Play to hear your reading.",true);stream.getTracks().forEach(t=>t.stop())};recorder.start();btn.textContent="■ Stop";btn.classList.add("recording");setStatus("Recording… tap ■ Stop when you finish.",true)}catch(e){var n=(e&&e.name)?e.name:String(e);if(n==="NotAllowedError"||n==="SecurityError"){setStatus("Microphone blocked. In the chat preview the mic is always off — use the live website, then tap Allow (or click 🔒 in the address bar → allow Microphone → reload).",false);}else if(n==="NotFoundError"){setStatus("No microphone found on this device.",false);}else{setStatus("Could not record ("+n+"). Use the live website in Chrome/Edge/Safa
