 16px;display:flex;align-items:center;gap:14px;box-shadow:0 14px 38px rgba(111,74,182,.24);border:1px solid rgba(255,255,255,.32)}.evidence-banner strong{text-shadow:0 1px 6px rgba(60,35,110,.35)}.evidence-banner span{font-size:.84rem;color:#fff}.evidence-banner button{border:0;border-radius:10px;padding:9px 12px;background:rgba(255,255,255,.92);color:var(--purple);font-weight:950;cursor:pointer}.footer{text-align:center;color:var(--muted);font-size:.8rem;padding:13px}

<script>

const pages=[{"type": "cover", "title": "The Decision After the Decision", "subtitle": "A fair process stayed open to new evidence after the vote was finished", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-decision-after-the-decision-assets/cover.jpg"}, {"text": "1. The Vote Was Clear\nStudent council voted to hold Community Night on Friday at six. The time won by a large margin, and Mei, the council chair, announced that the decision was final.\nThe next day, Mr. Ramos shared responses from families who worked evening shifts, relied on limited bus service, or needed more notice to arrange interpretation. None of them had been included in the original poll.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-decision-after-the-decision-assets/page1.jpg"}, {"text": "2. Defending the Process\nMei felt embarrassed. She reminded the council that everyone at school had been invited to vote and worried that reopening the choice would make the council look disorganized.\nLaila asked whether an invitation was enough when the survey was only in one language and open for one school day. A process could be followed correctly and still leave out information the decision needed.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-decision-after-the-decision-assets/page2.jpg"}, {"text": "3. What Was Fixed and What Was Still Open\nThe council separated the event's purpose from the details. They still wanted a welcoming night where families could see student work. The date, time, transportation plan, and interpretation support were choices that could change.\nRevisiting the decision did not mean every part was uncertain. It meant protecting the purpose by adjusting the conditions that kept people from participating.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-decision-after-the-decision-assets/page3.jpg"}, {"text": "4. Hearing From People Affected\nMr. Ramos arranged a short listening session with families, staff, and students. Council members asked what would make attendance possible instead of asking people to defend why the first plan did not work.\nThey heard that no single time fit everyone. However, a Saturday afternoon, a shuttle from two apartment areas, and interpretation requested in advance would remove several barriers.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-decision-after-the-decision-assets/page4.jpg"}, {"text": "5. Making the Revision Visible\nThe council changed Community Night to Saturday afternoon and added the shuttle and interpretation plan. They published both the new decision and the reasons for changing it.\nMei worried some students would accuse the council of ignoring the vote. Devon explained that the council was using new evidence, not hiding it. Transparency made the revision more trustworthy.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-decision-after-the-decision-assets/page5.jpg"}, {"text": "6. A Better Rule for Future Decisions\nFor future events, the council would identify who was affected before choosing a survey method. They would offer more than one way and language to respond, allow enough time, and state which parts of a decision could be revisited.\nA vote remained useful. It was no longer treated as proof that everyone had equal access to shape the options.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-decision-after-the-decision-assets/page6.jpg"}, {"text": "7. Leadership That Could Learn\nCommunity Night drew families who had never attended before. Some still could not come, and the council collected suggestions for the next event.\nMei no longer thought leadership meant making a decision look permanent. It meant explaining the purpose, noticing who was missing, and changing course when better evidence showed a fairer way forward.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-decision-after-the-decision-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did student council originally vote for?", "choices": ["To hold Community Night on a Saturday afternoon", "To hold Community Night on Friday at six", "To cancel Community Night completely"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Student council voted to hold Community Night on Friday at six, and the time won by a large margin."}, {"q": "Why did Laila question whether the process had truly included everyone?", "choices": ["Nobody had been allowed to vote at all", "The vote had never actually happened", "The survey was only in one language and open for just one school day"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Laila pointed out that the survey was only in one language and open for one school day, which could leave out important information."}, {"q": "What did the council decide could still change about Community Night?", "choices": ["Nothing — every detail was already fixed", "The date, time, transportation plan, and interpretation support", "The entire purpose of holding the event at all"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "The council separated the event's purpose, which stayed the same, from details like date and transportation, which could still change."}, {"q": "What did the listening session reveal families needed?", "choices": ["A Saturday time, a shuttle from two apartment areas, and interpretation requested in advance", "Nothing needed to change about the original plan", "A completely different type of event altogether"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "The listening session revealed that a Saturday afternoon, a shuttle, and advance interpretation would remove several barriers to attending."}, {"q": "What rule did the council create for future decisions?", "choices": ["Never ask the community for input again", "Identify who is affected before choosing a survey method, and state which parts could be revisited", "Always keep the very first plan no matter what"], "answer": 1, "evidencePage": 6, "hint": "Look at page 6.", "explain": "For future events, the council agreed to identify who was affected first and to be clear about which parts of a decision could still change."}], "grammar": [{"q": "'A vote remained useful, ___ it was no longer treated as proof that everyone had equal access.' Which word shows contrast?", "choices": ["so", "yet", "and"], "answer": 1, "evidencePage": 6, "hint": "This word shows a surprising contrast, similar to 'but.'", "explain": "'Yet' shows contrast: the vote stayed useful, but it was no longer treated as complete proof of fairness.", "teach": "<b>Yet</b> shows a <b>surprising contrast</b>, similar to <b>but</b>.<span class='cn'><b>yet</b>表示令人意外的<b>转折</b>，和 <b>but</b> 类似。</span>"}, {"q": "Which sentence fixes a vague pronoun reference?", "choices": ["Mei told Laila that her plan needed to change.", "Mei told Laila that Mei's own plan needed to change.", "Mei told Laila her plan needed to change, so she changed it."], "answer": 1, "evidencePage": 2, "hint": "A pronoun like 'her' can be unclear if it could refer to more than one person.", "explain": "Repeating the name instead of using 'her' removes the confusion about whose plan needed to change.", "teach": "A <b>pronoun</b> should clearly point to <b>one specific person</b>, or the sentence becomes confusing.<span class='cn'><b>代词</b>应该清楚地指向<b>一个具体的人</b>，否则句子会让人困惑。</span>"}, {"q": "Which sentence correctly punctuates an introductory phrase?", "choices": ["For future events, the council would identify who was affected first.", "For, future events the council would identify who was affected first.", "For future events the council, would identify who was affected first."], "answer": 0, "evidencePage": 6, "hint": "A comma follows an introductory phrase before the main sentence begins.", "explain": "The comma correctly separates the introductory phrase 'For future events' from the main sentence.", "teach": "<b>A comma</b> follows an <b>introductory phrase</b> before the main sentence begins.<span class='cn'><b>逗号</b>用在<b>引导性短语</b>之后，主句开始之前。</span>"}], "vocabulary": [{"q": "'Transparency' means ___.", "choices": ["changing a decision without telling anyone", "keeping information completely secret", "being open and honest about information"], "answer": 2, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Transparency — being open about the change and its reasons — made the council's revision more trustworthy."}, {"q": "'Barriers' means ___.", "choices": ["rewards given for good attendance", "plans that are already finished", "things that make it hard to do something"], "answer": 2, "evidencePage": 4, "hint": "Look at page 4.", "explain": "A Saturday time and a shuttle would remove several barriers — obstacles — that had kept families from attending."}, {"q": "'Interpretation' means ___.", "choices": ["a vote taken by a group", "help translating spoken language for someone", "a written summary of an event"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Some families needed more notice to arrange interpretation — language translation help — to fully take part."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(transparency|barriers|interpretation)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 6 SEL</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}
function selectAnswer(i){selections[activeTab+"-"+qIndex[activeTab]]=i;renderPanel()}
function showHint(){const item=quizzes[activeTab][qIndex[activeTab]];document.getElementById("feedback").innerHTML=`💡 ${item.hint}`}
function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}function playTeachAudio(key,part,fallbackText,fallbackLang){try{var store=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[key];if(store&&store[part]){var a=new Audio(store[part]);a.play();return;}}catch(e){}speakText(fallbackText,fallbackLang);}function renderTeach(teachHtml,key){var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+='<button style="border:0;background:#e2483f;color:#fff;cursor:pointer;font-size:.8em;line-height:1;vertical-align:middle;padding:0;margin-right:6px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;width:1.9em;height:1.9em;box-shadow:0 2px 6px rgba(226,72,63,.35)" data-key="'+key+'" data-part="en" data-text="'+escAttr(enText)+'" data-lang="en-US" onclick="playTeachAudio(this.dataset.key,this.dataset.part,this.dataset.text,this.dataset.lang)" aria-label="Listen in English" title="Listen in English">\uD83D\uDD0A</button> '+enHtml;if(cnHtml){out+='<span class="cn"><button style="border:0;background:#e2483f;color:#fff;cursor:pointer;font-size:.8em;line-height:1;vertical-align:middle;padding:0;margin-right:6px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;width:1.9em;height:1.9em;box-shadow:0 2px 6px rgba(226,72,63,.35)" data-key="'+key+'" data-part="cn" data-text="'+escAttr(cnText)+'" data-lang="zh-CN" onclick="playTeachAudio(this.dataset.key,this.dataset.part,this.dataset.text,this.dataset.lang)" aria-label="\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3" title="\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3">\uD83D\uDD0A</button> '+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}
function returnToQuestion(){document.getElementById("evidenceBanner")?.remove();renderPanel();document.querySelector(".panel").scrollIntoView({behavior:"smooth",block:"start"})}
function nextQuestion(){const list=quizzes[activeTab];if(qIndex[activeTab]<list.length-1){qIndex[activeTab]++;renderPanel();return}completed[activeTab]=true;if(activeTab==="comprehension")activeTab="grammar";else if(activeTab==="grammar")activeTab="vocabulary";else{return showCompletion()}setTabs();renderPanel()}
function showCompletion(){completed.vocabulary=true;setTabs();const correct=Object.keys(selections).filter(k=>{const [tab,idx]=k.split('-');return selections[k]===quizzes[tab][+idx].answer}).length,total=Object.values(quizzes).reduce((a,b)=>a+b.length,0);document.getElementById("stagePill").textContent="Journey Complete";document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">Reading journey complete</div><h2>Wonderful work! 🎉</h2><p class="small">You finished Reading, Grammar, and Vocabulary.</p><div class="score-row"><div class="score-box"><b>${total}</b><br><span>Questions</span></div><div class="score-box"><b>${correct}</b><br><span>Correct now</span></div></div><div class="feedback good">You used evidence, practiced sentence skills, and learned new words.</div><button class="submit" onclick="restartPractice()">Practice Again</button></div>`}
function restartPractice(){activeTab="comprehension";qIndex={comprehension:0,grammar:0,vocabulary:0};selections={};attempts={};completed={comprehension:false,grammar:false,vocabulary:false};setTabs();renderPanel()}
function saveProgress(){try{localStorage.setItem("les-the-decision-after-the-decision-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-decision-after-the-decision"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-decision-after-the-decision",bookTitle:"The Decision After the Decision",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}
function clearHighlight(){document.querySelectorAll(".story-word.reading").forEach(x=>x.classList.remove("reading"))}
let preferredVoice=null;
function pickVoice(){const voices=speechSynthesis.getVoices();if(!voices.length)return;const en=voices.filter(v=>/^en(-|_|$)/i.test(v.lang));const pool=en.length?en:voices;const score=v=>{let s=0;const n=(v.name||"").toLowerCase();if(/natural/.test(n))s+=8;if(/neural/.test(n))s+=6;if(/online/.test(n))s+=4;if(/google/.test(n))s+=5;if(/(aria|jenny|guy|libby|sonia|michelle|ava|andrew|emma|clara|natasha)/.test(n))s+=5;if(/(samantha|allison|karen|serena|siri|nicky|aaron)/.test(n))s+=4;if(v.localService===false)s+=3;if(/en-us|en-gb/i.test(v.lang))s+=1;if(/(zira|david|mark|hazel|compact|espeak|eloquence)/.test(n))s-=5;return s};pool.sort((a,b)=>score(b)-score(a));preferredVoice=pool[0]||null}
pickVoice();if(typeof speechSynthesis!=="undefined")speechSynthesis.addEventListener("voiceschanged",pickVoice);
var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.i);},at));});};}let advanced=false;const advance=()=>{if(advanced)return;advanced=true;if(watchdog)clearTimeout(watchdog);ci++;speakChunk();};u.onend=advance;u.onerror=advance;const estDur=Math.max(1200,chunk.text.length*110);const watchdog=setTimeout(advance,estDur+4000);speechSynthesis.speak(u);}setTimeout(speakChunk,70);}
document.getElementById("listenPageBtn").onclick=()=>{window.__readToken=(window.__readToken||0)+1;setListenActive("listenPageBtn");speak(page===0?(pages[0].title+`. `+pages[0].subtitle+`.`):pages[page].text,page!==0);};document.getElementById("listenStoryBtn").onclick=()=>{readStory();};
function setStatus(m,ok){var el=document.getElementById("recStatus");if(el){el.textContent=m;el.style.color=ok?"#1f8f4d":"#b23b34";}}async function toggleRecording(){const btn=document.getElementById("recordPageBtn");if(recorder&&recorder.state==="recording"){recorder.stop();btn.textContent="🎙 Record";btn.classList.remove("recording");return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setStatus("Recording works only on the published website — the microphone is turned off in this preview.",false);return}if(typeof MediaRecorder==="undefined"){setStatus("This browser can't record audio. Try Chrome/Edge, or Safari 14+.",false);return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});let opts={};if(MediaRecorder.isTypeSupported){if(MediaRecorder.isTypeSupported("audio/webm"))opts={mimeType:"audio/webm"};else if(MediaRecorder.isTypeSupported("audio/mp4"))opts={mimeType:"audio/mp4"};}chunks=[];recorder=new MediaRecorder(stream,opts);recorder.ondataavailable=e=>{if(e.data&&e.data.size>0)chunks.push(e.data)};recorder.onstop=()=>{if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(new Blob(chunks,{type:(recorder.mimeType||"audio/webm")}));document.getElementById("playRecordingBtn").disabled=false;document.getElementById("deleteRecordingBtn").disabled=false;setStatus("Saved! Tap ▶ Play to hear your reading.",true);stream.getTracks().forEach(t=>t.stop())};recorder.start();btn.textContent="■ Stop";btn.classList.add("recording");setStatus("Recording… tap ■ Stop when you finish.",true)}catch(e){var n=(e&&e.name)?e.name:String(e);if(n==="NotAllowedError"||n==="SecurityError"){setStatus("Microphone blocked. In the chat preview the mic is always off — use the live website, then tap Allow (or click 🔒 in the address bar → allow Microphone → reload).",false);}else if(n==="NotFoundError"){setStatus("No microphone found on this device.",false);}else{setStatus("Could not record ("+n+"). Use the live website in Chrome/Edge/Safari 14+.",false);}}}
document.getElementById("recordPageBtn").onclick=toggleRecording;document.getElementById("playRecordingBtn").onclick=()=>{if(!audioURL)return;if(currentAudio)currentAudio.pause();currentAudio=new Audio(audioURL);var pb=document.getElementById("playRecordingBtn");pb.classList.add("active");currentAudio.onended=()=>pb.classList.remove("active");currentAudio.onpause=()=>pb.classList.remove("active");currentAudio.play().catch(err=>{pb.classList.remove("active");setStatus("Could not play ("+((err&&err.name)?err.name:err)+").",false);})};document.getElementById("deleteRecordingBtn").onclick=()=>{var db=document.getElementById("deleteRecordingBtn");db.classList.add("active");setTimeout(()=>db.classList.remove("active"),220);if(currentAudio)currentAudio.pause();if(audioURL)URL.revokeObjectURL(audioURL);audioURL=null;chunks=[];var pl=document.getElementById("playRecordingBtn");pl.disabled=true;pl.classList.remove("active");document.getElementById("deleteRecordingBtn").disabled=true};
renderPage();setTabs();renderPanel();

function cancelFallback(){window.__fbt&&window.__fbt.forEach(clearTimeout);window.__fbt=[];}function setListenActive(id){["listenPageBtn","listenStoryBtn"].forEach(x=>{var el=document.getElementById(x);if(el)el.classList.toggle("active",x===id);});}function readStory(){var token=(window.__readToken=(window.__readToken||0)+1);speechSynthesis.cancel();cancelFallback();clearHighlight();setListenActive("listenStoryBtn");var seq=[{p:0,t:(pages[0].title+`. `+pages[0].subtitle+`.`),hl:false}];for(var i=1;i<pages.length;i++)seq.push({p:i,t:pages[i].text,hl:true});var k=0;function step(){if(token!==window.__readToken)return;if(k>=seq.length){endNarration();return;}var it=seq[k++];page=it.p;renderPage();speak(it.t,it.hl,function(){if(token===window.__readToken)step();});}step();}function endNarration(){stopRvAudio();clearHighlight();cancelFallback();var pb=document.getElementById("pauseBtn");if(pb){pb.textContent="⏸ Pause";pb.disabled=true;pb.classList.remove("active");}setListenActive(null);}
(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.onclick=function(){if(__rvAudio){if(__rvAudio.paused){var _p=__rvAudio.play();if(_p&&_p.catch)_p.catch(function(){});pb.textContent='⏸ Pause';pb.classList.remove('active');}else{__rvAudio.pause();pb.textContent='▶ Resume';pb.classList.add('active');}return;}if(speechSynthesis.paused){speechSynthesis.resume();pb.textContent="⏸ Pause";pb.classList.remove("active");}else if(speechSynthesis.speaking){speechSynthesis.pause();pb.textContent="▶ Resume";pb.classList.add("active");}};}})();
