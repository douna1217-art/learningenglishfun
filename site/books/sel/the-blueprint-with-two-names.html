<script>

const pages=[{"type": "cover", "title": "The Blueprint with Two Names", "subtitle": "Strong Teamwork Makes Space for Truth, Repair, and Shared Plans", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-blueprint-with-two-names-assets/cover.jpg"}, {"text": "Jia and Omar were building a bridge from craft sticks. Jia planned a wide base, while Omar imagined tall arches. They agreed to sketch before gluing. But while Jia gathered supplies, Omar began attaching pieces from his own design.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-blueprint-with-two-names-assets/page1.jpg"}, {"text": "Jia returned and stared at the half-built arch. “You never listen!” she snapped. Omar crossed his arms. “You always want your plan,” he replied. Their words attacked each other instead of describing the problem.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-blueprint-with-two-names-assets/page2.jpg"}, {"text": "They stepped away from the glue until their voices were calm. Jia tried again: “I felt ignored when building started before we chose a shared design.” Omar answered, “You wanted our agreement to matter.” Jia nodded; he had understood.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-blueprint-with-two-names-assets/page3.jpg"}, {"text": "Omar explained that he worried they would run out of work time. Jia summarized, “You rushed because finishing felt important, not because my ideas were worthless.” The conflict now had two viewpoints instead of two villains.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-blueprint-with-two-names-assets/page4.jpg"}, {"text": "Omar apologized for breaking their agreement, and Jia apologized for saying “never.” Together they tested both sketches with small weights. Jia’s wide base held steady; Omar’s arches carried extra weight.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-blueprint-with-two-names-assets/page5.jpg"}, {"text": "They drew a new blueprint with a wide base and two arches. Jia measured while Omar glued, and they checked each change before continuing. Both names went at the top because both minds shaped the plan.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-blueprint-with-two-names-assets/page6.jpg"}, {"text": "Their bridge did not win the height prize, but it carried every test weight. More importantly, Jia and Omar could explain how they repaired their teamwork. A strong partnership, like a strong bridge, depends on connections that can be rebuilt.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-blueprint-with-two-names-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did Omar do while Jia gathered supplies?", "choices": ["He began attaching pieces from his own design", "He waited patiently for Jia to return", "He left to get more craft sticks"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "While Jia gathered supplies, Omar began attaching pieces from his own design."}, {"q": "What happened when Jia and Omar first argued?", "choices": ["They calmly discussed their feelings right away", "Their words attacked each other instead of describing the problem", "They agreed immediately on a solution"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Their words attacked each other instead of describing the problem."}, {"q": "What did Jia say when she tried again, calmly?", "choices": ["“You never listen!”", "“I quit this project.”", "“I felt ignored when building started before we chose a shared design.”"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Jia tried again: “I felt ignored when building started before we chose a shared design.”"}, {"q": "What did they discover when they tested both sketches?", "choices": ["Jia’s wide base held steady, and Omar’s arches carried extra weight", "Neither design worked at all", "Only Omar’s design worked"], "answer": 0, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Jia’s wide base held steady; Omar’s arches carried extra weight."}, {"q": "What is the big idea of this story?", "choices": ["Once a friendship breaks, it can never be repaired", "A strong partnership, like a strong bridge, depends on connections that can be rebuilt", "Only one person's plan should ever be used"], "answer": 1, "evidencePage": 7, "hint": "Look at the last page.", "explain": "A strong partnership, like a strong bridge, depends on connections that can be rebuilt."}], "grammar": [{"q": "“I felt ignored ___ building started before we chose a shared design.” Which word introduces when this feeling happened?", "choices": ["because", "but", "when"], "answer": 2, "evidencePage": 3, "hint": "This word introduces the specific moment or situation causing a feeling.", "explain": "“When” introduces the situation that caused Jia’s feeling of being ignored.", "teach": "<b>I felt X when Y</b> describes a <b>feeling</b> and the <b>situation</b> that caused it — a calm way to explain emotions during conflict.<span class='cn'><b>I felt X when Y</b>(当Y发生时我感到X)描述一种<b>感受</b>和引起它的<b>情况</b>——这是冲突中表达情绪的冷静方式。</span>"}, {"q": "“You rushed because finishing felt important, ___ because my ideas were worthless.” Which word completes this contrast?", "choices": ["not", "so", "and"], "answer": 0, "evidencePage": 4, "hint": "This word rules out a false reason before stating the true one.", "explain": "“Not because X, but because Y” rules out a false reason and states the true one.", "teach": "<b>Not because X, but because Y</b> rules out a <b>false reason</b> (X) and gives the <b>true reason</b> (Y).<span class='cn'><b>not because X, but because Y</b>(不是因为X，而是因为Y)排除一个<b>错误的原因</b>(X)，给出<b>真正的原因</b>(Y)。</span>"}, {"q": "“Omar apologized for breaking their agreement, ___ Jia apologized for saying ‘never.’” Which word joins these two parallel actions?", "choices": ["but", "and", "or"], "answer": 1, "evidencePage": 5, "hint": "This word joins two similar actions happening together.", "explain": "“And” joins two parallel apologies happening together.", "teach": "<b>And</b> joins two <b>parallel, similar actions</b> happening together.<span class='cn'><b>and</b>(和)连接两个<b>相似且同时发生</b>的动作。</span>"}], "vocabulary": [{"q": "‘Repair’ (a repaired relationship) means ___.", "choices": ["to break something further", "to ignore a problem completely", "to fix or restore something that was broken or damaged"], "answer": 2, "evidencePage": 7, "hint": "Look at the last page.", "explain": "Jia and Omar could explain how they repaired their teamwork."}, {"q": "‘Summarized’ means ___.", "choices": ["stated the main point in fewer words", "shouted angrily", "drew a new picture"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Jia summarized, “You rushed because finishing felt important, not because my ideas were worthless.”"}, {"q": "‘Blueprint’ means ___.", "choices": ["a finished bridge", "a detailed plan or design for building something", "an apology"], "answer": 1, "evidencePage": 6, "hint": "Look at page 6.", "explain": "They drew a new blueprint with a wide base and two arches."}]};

function renderPage(){const p=pages[page],view=document.getElementById("pageView");if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 3 SEL</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}

function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}function playTeachAudio(key,part,fallbackText,fallbackLang){try{var store=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[key];if(store&&store[part]){var a=new Audio(store[part]);a.play();return;}}catch(e){}speakText(fallbackText,fallbackLang);}function renderTeach(teachHtml,key){var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+='<button style="border:0;background:#e2483f;color:#fff;cursor:pointer;font-size:.8em;line-height:1;vertical-align:middle;padding:0;margin-right:6px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;width:1.9em;height:1.9em;box-shadow:0 2px 6px rgba(226,72,63,.35)" data-key="'+key+'" data-part="en" data-text="'+escAttr(enText)+'" data-lang="en-US" onclick="playTeachAudio(this.dataset.key,this.dataset.part,this.dataset.text,this.dataset.lang)" aria-label="Listen in English" title="Listen in English">\uD83D\uDD0A</button> '+enHtml;if(cnHtml){out+='<span class="cn"><button style="border:0;background:#e2483f;color:#fff;cursor:pointer;font-size:.8em;line-height:1;vertical-align:middle;padding:0;margin-right:6px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;width:1.9em;height:1.9em;box-shadow:0 2px 6px rgba(226,72,63,.35)" data-key="'+key+'" data-part="cn" data-text="'+escAttr(cnText)+'" data-lang="zh-CN" onclick="playTeachAudio(this.dataset.key,this.dataset.part,this.dataset.text,this.dataset.lang)" aria-label="\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3" title="\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3">\uD83D\uDD0A</button> '+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}

function saveProgress(){try{localStorage.setItem("les-the-blueprint-with-two-names-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-blueprint-with-two-names"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-blueprint-with-two-names",bookTitle:"The Blueprint with Two Names",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.
