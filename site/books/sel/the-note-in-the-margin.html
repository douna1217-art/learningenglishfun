 16px;display:flex;align-items:center;gap:14px;box-shadow:0 14px 38px rgba(111,74,182,.24);border:1px solid rgba(255,255,255,.32)}.evidence-banner strong{text-shadow:0 1px 6px rgba(60,35,110,.35)}.evidence-banner span{font-size:.84rem;color:#fff}.evidence-banner button{border:0;border-radius:10px;padding:9px 12px;background:rgba(255,255,255,.92);color:var(--purple);font-weight:950;cursor:pointer}.footer{text-align:center;color:var(--muted);font-size:.8rem;padding:13px}

<script>

const pages=[{"type": "cover", "title": "The Note in the Margin", "subtitle": "Feedback can describe the work without defining the person", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-note-in-the-margin-assets/cover.jpg"}, {"text": "1. The Circle in Red\nMaya had spent three evenings on her local-history report. She drew a map, checked dates, and chose every sentence carefully. When Ms. Rivera returned it, one paragraph was circled in red.\nThe note beside it said the evidence did not yet support Maya's conclusion. Maya's stomach dropped. She heard a different message in her head: You are not good at history.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-note-in-the-margin-assets/page1.jpg"}, {"text": "2. Work Is Not Identity\nMaya folded the paper so nobody could see it. Ms. Rivera sat beside her and asked what the note seemed to mean. Maya admitted that it felt like a judgment about her ability.\n'The note describes one part of this draft,' Ms. Rivera said. 'It does not describe you.' Maya unfolded the page and separated two ideas: the paragraph needed stronger evidence; Maya was still a capable learner.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-note-in-the-margin-assets/page2.jpg"}, {"text": "3. Find the Usable Part\nMaya read the note again and underlined its specific request: connect the conclusion to a source. That was something she could act on, unlike the vague thought that she was bad at history.\nShe also had a question. Did she need a new conclusion, or had she simply left out the source that supported it? Asking for clarity was part of using feedback, not proof that she had failed.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-note-in-the-margin-assets/page3.jpg"}, {"text": "4. A Clarifying Question\nMaya showed Ms. Rivera the photograph she had used. It supported part of her claim, but not the sentence about why the town changed. Ms. Rivera asked what other evidence might answer that question.\nMaya realized the red circle had marked a gap between two ideas. It was not a command to erase everything. She needed one more source and a more precise conclusion.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-note-in-the-margin-assets/page4.jpg"}, {"text": "5. Revision as a Choice\nIn the library, Maya found an old planning document that explained the change. She revised two sentences and cited the new source. Then she kept the original draft beside the new one.\nThe revision was stronger because Maya made decisions, not because she obeyed every mark automatically. Feedback gave her information; she still had to evaluate it and choose what fit the purpose.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-note-in-the-margin-assets/page5.jpg"}, {"text": "6. Giving Feedback Carefully\nDuring peer review, Maya read Jonah's report. She almost wrote confusing across the whole page. Instead, she pointed to one place and asked which source connected the two ideas.\nJonah did not have to guess whether Maya disliked his work. Her comment named what she noticed and gave him a useful next step, just as she had needed.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-note-in-the-margin-assets/page6.jpg"}, {"text": "7. The Margin Became a Door\nMaya submitted her revision with the earlier draft attached. The red circle was still visible, but it no longer looked like a verdict. It showed where her thinking had changed.\nShe learned to pause before turning feedback into a story about her worth. She could ask what was specific, what needed clarification, and what choice would make the work clearer.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-note-in-the-margin-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did the note beside the circled paragraph say?", "choices": ["The evidence did not yet support Maya's conclusion", "The report was turned in one day late", "Maya's handwriting was too messy to read"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "The note said the evidence did not yet support Maya's conclusion, which Maya first heard as a judgment about her ability."}, {"q": "What did Ms. Rivera help Maya separate?", "choices": ["The report from the map she had drawn", "The paragraph needing stronger evidence from Maya's ability as a learner", "Her grade from her classmates' grades"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Ms. Rivera said the note described one part of the draft, not Maya herself, helping her separate the two ideas."}, {"q": "What specific request did Maya find in the note?", "choices": ["Connect the conclusion to a source", "Rewrite the whole report from scratch", "Choose a completely different topic"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Maya underlined the specific, usable request: connect the conclusion to a source, something she could act on."}, {"q": "What did Maya realize the red circle actually marked?", "choices": ["A gap between two ideas, not a command to erase everything", "A rule that she had broken on purpose", "A spelling mistake in her sentence"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Maya realized the circle marked a gap between two ideas — she needed one more source and a clearer conclusion, not a total rewrite."}, {"q": "What did Maya do differently when giving Jonah feedback?", "choices": ["She wrote 'confusing' across the whole page", "She pointed to one specific place and asked a clarifying question", "She refused to comment on his report at all"], "answer": 1, "evidencePage": 6, "hint": "Look at page 6.", "explain": "Instead of writing a vague comment, Maya pointed to one place and asked which source connected the two ideas."}], "grammar": [{"q": "'Maya's stomach dropped ___ she heard a different message in her head.' Which word shows the reason?", "choices": ["because", "unless", "although"], "answer": 0, "evidencePage": 1, "hint": "This word introduces the reason for what Maya felt.", "explain": "'Because' introduces the reason: Maya's stomach dropped because she heard the harsh message in her head.", "teach": "<b>Because</b> introduces a <b>reason</b> for what happens.<span class='cn'><b>because</b>引出一件事发生的<b>原因</b>。</span>"}, {"q": "Which sentence correctly uses a comma after an introductory phrase?", "choices": ["During, peer review Maya read Jonah's report.", "During peer review, Maya read Jonah's report.", "During peer review Maya, read Jonah's report."], "answer": 1, "evidencePage": 6, "hint": "A comma follows an introductory phrase before the main sentence begins.", "explain": "The comma correctly separates the introductory phrase 'During peer review' from the main sentence.", "teach": "<b>A comma</b> follows an <b>introductory phrase</b> before the main sentence begins.<span class='cn'><b>逗号</b>用在<b>引导性短语</b>之后，主句开始之前。</span>"}, {"q": "Which sentence correctly punctuates Ms. Rivera's spoken words?", "choices": ["Ms. Rivera said, The note describes one part of this draft.", "Ms. Rivera said, \"The note describes one part of this draft.\"", "Ms. Rivera said The note describes one part of this draft."], "answer": 1, "evidencePage": 2, "hint": "A direct quotation needs quotation marks around the exact words someone said.", "explain": "Quotation marks surround Ms. Rivera's exact spoken words, with a comma introducing the quotation after 'said.'", "teach": "<b>Quotation marks</b> surround a person's <b>exact spoken words</b>.<span class='cn'><b>引号</b>用来标出一个人<b>原话的确切内容</b>。</span>"}], "vocabulary": [{"q": "'Evidence' means ___.", "choices": ["a grade given by a teacher", "a guess made without any support", "facts or details that support an idea or claim"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "The note said the evidence — supporting facts and details — did not yet support Maya's conclusion."}, {"q": "'Clarifying' means ___.", "choices": ["making something clearer or easier to understand", "making something more confusing", "completely ignoring a question"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Maya asked a clarifying question to make the note's meaning clearer, which was part of using feedback well."}, {"q": "'Revision' means ___.", "choices": ["the very first version of a report", "a mistake that can never be fixed", "a change made to improve a piece of work"], "answer": 2, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Maya's revision — her improved version — was stronger because she made thoughtful decisions, not because she obeyed every mark automatically."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(evidence|clarifying|revision)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 5 SEL</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}
