 16px;display:flex;align-items:center;gap:14px;box-shadow:0 14px 38px rgba(111,74,182,.24);border:1px solid rgba(255,255,255,.32)}.evidence-banner strong{text-shadow:0 1px 6px rgba(60,35,110,.35)}.evidence-banner span{font-size:.84rem;color:#fff}.evidence-banner button{border:0;border-radius:10px;padding:9px 12px;background:rgba(255,255,255,.92);color:var(--purple);font-weight:950;cursor:pointer}.footer{text-align:center;color:var(--muted);font-size:.8rem;padding:13px}

<script>

const pages=[{"type": "cover", "title": "The Joke Between Languages", "subtitle": "Cultural humility begins with curiosity about what meaning crossed the room", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-joke-between-languages-assets/cover.jpg"}, {"text": "1. A Line That Landed Wrong\nThe trio was writing a short radio comedy about three explorers who misread a map. Camila suggested a playful line she had heard in Spanish at family gatherings and translated it directly into English.\nTheo laughed at the wording, then repeated it in an exaggerated voice. Camila went quiet. Noor saw her close the script folder, but the bell rang before anyone asked what had changed.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-joke-between-languages-assets/page1.jpg"}, {"text": "2. Intent and Impact\nTheo said he had been laughing at the literal translation, not at Camila or Spanish. Noor answered that his intent mattered when deciding what he meant, but Camila's reaction also mattered when understanding what happened.\nThey avoided guessing that every Spanish-speaking family used the expression in the same way. The only person who could explain this moment from Camila's experience was Camila, and she did not owe them an immediate lesson.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-joke-between-languages-assets/page2.jpg"}, {"text": "3. Questions Without a Demand\nThe next day, Theo asked, 'Would you be willing to tell me what felt wrong, or would you rather I stop using the line and give you space?' Camila chose to explain.\nAt home, the phrase sounded affectionate because tone and shared history carried part of the meaning. Theo's imitation removed that context and made her language sound foolish. She wanted the group to stop the voice, not stop every attempt at humor across languages.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-joke-between-languages-assets/page3.jpg"}, {"text": "4. Cultural Humility in Practice\nNoor suggested that each person bring one example of humor that depended on context. She shared how a teasing phrase could sound rude outside a trusted relationship. Theo described an inside joke from his soccer team that confused new players.\nThe examples did not make the three experiences identical. They showed why a person can stay curious, admit limited understanding, and ask before copying a voice or expression.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-joke-between-languages-assets/page4.jpg"}, {"text": "5. Repairing the Script and the Process\nTheo apologized for exaggerating Camila's voice and named what he would do differently. Camila accepted the apology but asked to decide whether the original line stayed.\nThey revised the scene so the explorers misunderstood an invented symbol instead of a language. They also made a rehearsal agreement: anyone could pause a performance when an imitation, accent, or joke felt disrespectful, and the group would examine impact before continuing.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-joke-between-languages-assets/page5.jpg"}, {"text": "6. The New Rehearsal\nDuring rehearsal, Camila delivered the opening line in her own energetic style. Noor used a dry pause. Theo played the explorer who confidently followed the wrong symbol and ended up facing a cardboard supply closet.\nThe class laughed at the character's certainty, not at a real language or community. Afterward, the trio checked in. Each could explain why the revised scene was funny and what boundary kept it respectful.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-joke-between-languages-assets/page6.jpg"}, {"text": "7. Meaning That Stayed Connected\nTheir final recording included a short reflection about context. Camila chose her own words and did not speak for every bilingual student. Theo explained what he had learned about impact, and Noor described the questions that helped the group repair the work.\nCultural humility did not require perfect knowledge of every expression. It required them to notice when understanding was limited, respect the person affected, and remain willing to change both the joke and the way they worked together.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-joke-between-languages-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What happened after Camila translated the playful line into English?", "choices": ["Theo refused to use the line at all", "Theo repeated it in an exaggerated voice and Camila went quiet", "Camila immediately explained the joke to the class"], "answer": 1, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Theo laughed at the wording and repeated it in an exaggerated voice; Camila closed her script folder and went quiet."}, {"q": "What did Noor point out about intent and impact?", "choices": ["Theo's intent mattered for what he meant, but Camila's reaction also mattered for what happened", "Only Camila's reaction mattered, since intent never matters", "Only Theo's intent mattered, since he meant no harm"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Noor said intent mattered when deciding what Theo meant, but Camila's reaction also mattered when understanding what happened."}, {"q": "What did Theo ask Camila the next day?", "choices": ["Whether she was overreacting to a simple joke", "Whether she would explain what felt wrong or would rather he stop using the line", "Whether her whole family used the same expression"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Theo asked, 'Would you be willing to tell me what felt wrong, or would you rather I stop using the line and give you space?'"}, {"q": "What did Noor suggest to build cultural humility in the group?", "choices": ["That the group stop making jokes for the rest of the year", "That each person bring an example of humor that depended on context", "That only Camila should explain every cultural reference"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Noor suggested each person bring one example of humor that depended on context, showing why staying curious mattered."}, {"q": "What rehearsal agreement did the group make?", "choices": ["No jokes about language could ever be included in the script", "Anyone could pause a performance when an imitation or joke felt disrespectful", "Only Camila was allowed to stop a rehearsal"], "answer": 1, "evidencePage": 5, "hint": "Look at page 5.", "explain": "They agreed anyone could pause a performance when an imitation, accent, or joke felt disrespectful, and the group would examine impact."}], "grammar": [{"q": "'Camila went quiet ___ Theo's imitation removed the tone that carried part of the meaning.' Which word shows the reason?", "choices": ["although", "because", "unless"], "answer": 1, "evidencePage": 3, "hint": "This word introduces the reason for what happened.", "explain": "'Because' introduces the reason: Camila went quiet because the imitation removed the context that carried meaning.", "teach": "<b>Because</b> introduces a <b>reason</b> for what happens.<span class='cn'><b>because</b>引出一件事发生的<b>原因</b>。</span>"}, {"q": "Which sentence correctly sets off a nonrestrictive appositive with commas?", "choices": ["Noor, the group's newest member, suggested a plan to build cultural humility.", "Noor the group's newest member, suggested a plan to build cultural humility.", "Noor, the group's newest member suggested a plan to build cultural humility."], "answer": 0, "evidencePage": 4, "hint": "An appositive that adds extra information needs a comma on both sides.", "explain": "Commas on both sides of 'the group's newest member' correctly set off the added, nonessential description of Noor.", "teach": "A <b>nonrestrictive appositive</b> adds extra information and needs <b>commas on both sides</b>.<span class='cn'><b>非限定性同位语</b>补充额外信息，前后都要加<b>逗号</b>。</span>"}, {"q": "Which sentence correctly punctuates Theo's spoken words?", "choices": ["Theo asked, \"Would you be willing to tell me what felt wrong?\"", "Theo asked, Would you be willing to tell me what felt wrong?", "Theo asked Would you be willing to tell me what felt wrong?"], "answer": 0, "evidencePage": 3, "hint": "A direct question someone asks aloud needs quotation marks around the exact words.", "explain": "Quotation marks surround Theo's exact spoken question, with a comma introducing the quotation after 'asked.'", "teach": "<b>Quotation marks</b> surround a person's <b>exact spoken words</b>.<span class='cn'><b>引号</b>用来标出一个人<b>原话的确切内容</b>。</span>"}], "vocabulary": [{"q": "'Exaggerated' means ___.", "choices": ["kept exactly accurate and realistic", "spoken so quietly that no one could hear it", "made to seem larger or more extreme than it really is"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Theo repeated Camila's line in an exaggerated voice, making it sound more extreme than how she actually said it."}, {"q": "'Context' means ___.", "choices": ["a rule that never changes across situations", "the surrounding situation that helps explain what something means", "a translation from one language to another"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "At home, tone and shared history carried part of the meaning — that surrounding context is what Theo's imitation removed."}, {"q": "'Reflection' means ___.", "choices": ["careful thought about what happened and what it meant", "a recording made without any editing", "a rule written by the teacher"], "answer": 0, "evidencePage": 7, "hint": "Look at page 7.", "explain": "Their final recording included a short reflection — careful thought — about context and what each person had learned."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(exaggerated|context|reflection)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 6 SEL</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}
