 16px;display:flex;align-items:center;gap:14px;box-shadow:0 14px 38px rgba(111,74,182,.24);border:1px solid rgba(255,255,255,.32)}.evidence-banner strong{text-shadow:0 1px 6px rgba(60,35,110,.35)}.evidence-banner span{font-size:.84rem;color:#fff}.evidence-banner button{border:0;border-radius:10px;padding:9px 12px;background:rgba(255,255,255,.92);color:var(--purple);font-weight:950;cursor:pointer}.footer{text-align:center;color:var(--muted);font-size:.8rem;padding:13px}

<header class="topbar"><div class="brand"><div class="logo">R</div><div><h1>The Question Behind the Argument</h1><p>learningenglishfun · Interactive Grade 4 SEL</p></div></div><div class="stage-pill" id="stagePill">Reading Mode</div></header>
<section class="audio-bar"><div class="audio-copy"><strong>Listen, read, and record</strong><span>Narration highlights each word. Recordings stay only in this browser session.</span></div><div class="audio-actions"><button class="audio-btn primary" id="listenPageBtn">🔊 This Page</button><button class="audio-btn" id="listenStoryBtn">📖 Full Story</button><button class="audio-btn" id="pauseBtn" disabled>⏸ Pause</button><button class="audio-btn record" id="recordPageBtn">🎙 Record</button><button class="audio-btn" id="playRecordingBtn" disabled>▶ Play</button><button class="audio-btn" id="deleteRecordingBtn" disabled>🗑 Delete</button></div><div id="recStatus" class="rec-status" aria-live="polite"></div></section>
<main class="shell"><section class="reader"><div id="pageView"></div><div class="controls"><div class="progress" id="progress"></div><div class="nav"><button class="prev" id="prevBtn">← Back</button><button class="next" id="nextBtn">Next →</button></div></div></section><aside class="panel"><div class="journey"><button class="tab active" data-tab="comprehension">1 Story</button><button class="tab" data-tab="grammar">2 Grammar</button><button class="tab" data-tab="vocabulary">3 Vocabulary</button></div><div id="panelContent"></div></aside></main><div class="footer">No API key required · narration, recording, feedback, retry, and progress work in the browser.</div></div>
<script>

const pages=[{"type": "cover", "title": "The Question Behind the Argument", "subtitle": "Two Positions Can Hide Needs That Fit Together", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-question-behind-the-argument-assets/cover.jpg"}, {"text": "1. One Wall, Two Plans\nHana wanted the library mural on the quiet courtyard wall. Students could sit nearby and study details in the blue river and native plants. DeShawn wanted the front hallway where every family would see the orange neighborhood buildings.\nThey repeated their positions louder: courtyard, hallway, courtyard, hallway. Each answer pushed the other farther away. Ms. Flores asked them to stop solving for a moment and identify the question underneath the argument.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-question-behind-the-argument-assets/page1.jpg"}, {"text": "2. Listening for a Concern\nHana asked DeShawn, 'What would be lost if the mural went in the courtyard?' Then she listened without preparing her reply.\nDeShawn said his grandmother used a cane and rarely crossed the uneven courtyard stones. He wanted families to recognize their own block and stories without facing an access barrier. Hana summarized: 'You need the mural to welcome families where they can easily reach it.' DeShawn nodded.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-question-behind-the-argument-assets/page2.jpg"}, {"text": "3. The Other Question\nDeShawn asked Hana what would be lost in the hallway. She explained that students hurried there between classes. The mural included small labels in English, Japanese, and Spanish, and she wanted people to have time and space to read them.\nDeShawn summarized: 'You need a place where people can slow down and notice every story.' Hana corrected one word: not quiet for its own sake, but enough time and room to pay attention.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-question-behind-the-argument-assets/page3.jpg"}, {"text": "4. Needs, Not Winners\nThey wrote the needs on sticky notes: accessible to families, visible, room to pause, and protection from hallway traffic. The original positions were only two possible answers.\nMs. Flores asked for at least three solutions before judging any. Hana suggested smoothing a courtyard route. DeShawn suggested a hallway bench. Together they considered dividing the mural, but worried that separation would weaken its connected story.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-question-behind-the-argument-assets/page4.jpg"}, {"text": "5. A Place They Had Missed\nThe librarian mentioned the wide entrance alcove between the front doors and reading room. It had a level path, a bench, and slower foot traffic. Families passed it, yet it was not crowded during class changes.\nHana and DeShawn measured the wall. It was shorter than either first choice, so they revised the design into a gentle curve. The river could lead from neighborhood buildings toward native plants without losing any labels.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-question-behind-the-argument-assets/page5.jpg"}, {"text": "6. Testing the Solution\nThey invited three students and DeShawn's grandmother to test a paper mock-up. She reached the alcove easily and read the largest labels from the bench. A student using the hallway still had enough space to pass.\nHana noticed one small label sat too low, and DeShawn noticed an orange building blended into the background. They revised both. A mutually workable solution still needed evidence and improvement.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-question-behind-the-argument-assets/page6.jpg"}, {"text": "7. The Better Question\nAt the mural opening, families paused in the alcove while students traced the river across many neighborhood stories. Hana and DeShawn stood at opposite ends, then met near the center.\nNeither had won the original argument. Both had protected what mattered. Above their planning notes, they saved the question that changed the work: 'What need are you trying to protect?' It was a question wide enough for more than one answer.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-question-behind-the-argument-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What did Ms. Flores ask Hana and DeShawn to do instead of repeating positions?", "choices": ["Vote on the winner immediately", "Draw the mural without more discussion", "Identify the question underneath the argument"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Ms. Flores asked them to stop solving for a moment and identify the question underneath the argument."}, {"q": "Why did DeShawn want the mural in the front hallway?", "choices": ["His grandmother rarely crossed the uneven courtyard stones, and he wanted families to reach it easily", "He didn't like the courtyard's colors", "He wanted to avoid Hana entirely"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "His grandmother used a cane and rarely crossed the uneven courtyard stones."}, {"q": "Why did Hana want the mural in the courtyard?", "choices": ["She disliked the front hallway's lighting", "She wanted people to have time and space to read the labels in multiple languages", "She wanted to avoid DeShawn entirely"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "She wanted people to have time and space to read the labels."}, {"q": "What did the librarian suggest as a possible location?", "choices": ["The gym storage room", "The rooftop garden", "The wide entrance alcove between the front doors and reading room"], "answer": 2, "evidencePage": 5, "hint": "Look at page 5.", "explain": "The librarian mentioned the wide entrance alcove between the front doors and reading room."}, {"q": "What is the big idea of this story?", "choices": ["Two positions can hide needs that fit together", "Only one plan can ever be correct", "Compromise always means giving up completely"], "answer": 0, "evidencePage": 7, "hint": "Look at the last page.", "explain": "Two positions can hide needs that fit together."}], "grammar": [{"q": "'Each answer pushed the other farther away, ___ Ms. Flores asked them to stop and identify the real question.' Which word shows a result?", "choices": ["before", "because", "so"], "answer": 2, "evidencePage": 1, "hint": "This word connects the pushing-away effect to what Ms. Flores did.", "explain": "'So' introduces the result: because the positions kept pushing them apart, so Ms. Flores stepped in.", "teach": "<b>So</b> introduces a <b>result</b> that follows a reason.<span class='cn'><b>so</b>(所以)引出跟随原因而来的<b>结果</b>。</span>"}, {"q": "'She reached the alcove easily ___ read the largest labels from the bench.' Which word joins these two actions?", "choices": ["and", "but", "so"], "answer": 0, "evidencePage": 6, "hint": "This word joins the two things DeShawn's grandmother did.", "explain": "'And' joins reaching the alcove easily with reading the labels from the bench.", "teach": "<b>And</b> joins <b>two actions</b> done by the same person.<span class='cn'><b>and</b>(和)连接同一个人做的<b>两个动作</b>。</span>"}, {"q": "'It was shorter than either first choice, ___ they revised the design into a gentle curve.' Which word shows a result?", "choices": ["but", "so", "before"], "answer": 1, "evidencePage": 5, "hint": "This word connects the wall's shorter length to what they did next.", "explain": "'So' introduces the result: because the wall was shorter, so they revised the design.", "teach": "<b>So</b> introduces a <b>result</b> that follows a reason.<span class='cn'><b>so</b>(所以)引出跟随原因而来的<b>结果</b>。</span>"}], "vocabulary": [{"q": "'Alcove' means ___.", "choices": ["a tall tower", "a type of paint color", "a small recessed space set back from a larger room or hallway"], "answer": 2, "evidencePage": 5, "hint": "Look at page 5.", "explain": "The librarian mentioned the wide entrance alcove between the front doors and reading room."}, {"q": "'Mutually' means ___.", "choices": ["in a way that is shared and applies equally to both sides", "in a way that favors only one side", "in a way that is temporary and rushed"], "answer": 0, "evidencePage": 6, "hint": "Look at page 6.", "explain": "A mutually workable solution still needed evidence and improvement."}, {"q": "'Protected' means ___.", "choices": ["argued loudly about something", "kept something safe from harm or loss", "ignored a problem completely"], "answer": 1, "evidencePage": 7, "hint": "Look at page 7.", "explain": "Neither had won the original argument. Both had protected what mattered."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(alcove|mutually|protected)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 4 SEL</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

function saveProgress(){try{localStorage.setItem("les-the-question-behind-the-argument-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="the-question-behind-the-argument"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"the-question-behind-the-argument",bookTitle:"The Question Behind the Argument",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}

function pickVoice(){const voices=speechSynthesis.getVoices();if(!voices.length)return;const en=voices.filter(v=>/^en(-|_|$)/i.test(v.lang));const pool=en.length?en:voices;const score=v=>{let s=0;const n=(v.name||"").toLowerCase();if(/natural/.test(n))s+=8;if(/neural/.test(n))s+=6;if(/online/.test(n))s+=4;if(/google/.test(n))s+=5;if(/(aria|jenny|guy|libby|sonia|michelle|ava|andrew|emma|clara|natasha)/.test(n))s+=5;if(/(samantha|allison|karen|serena|siri|nicky|aaron)/.test(n))s+=4;if(v.localService===false)s+=3;if(/en-us|en-gb/i.test(v.lang))s+=1;if(/(zira|david|mark|hazel|compact|espeak|eloquence)/.test(n))s-=5;return s};pool.sort((a,b)=>score(b)-score(a));preferredVoice=pool[0]||null}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w. function setStatus(m,ok){var el=document.getElementById("recStatus");if(el){el.textContent=m;el.style.color=ok?"#1f8f4d":"#b23b34";}}async function toggleRecording(){const btn=document.getElementById("recordPageBtn");if(recorder&&recorder.state==="recording"){recorder.stop();btn.textContent="🎙 Record";btn.classList.remove("recording");return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setStatus("Recording works only on the published website — the microphone is turned off in this preview.",false);return}if(typeof MediaRecorder==="undefined"){setStatus("This browser can't record audio. Try Chrome/Edge, or Safari 14+.",false);return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});let opts={};if(MediaRecorder.isTypeSupported){if(MediaRecorder.isTypeSupported("audio/webm"))opts={mimeType:"audio/webm"};else if(MediaRecorder.isTypeSupported("audio/mp4"))opts={mimeType:"audio/mp4"};}chunks=[];recorder=new MediaRecorder(stream,opts);recorder.ondataavailable=e=>{if(e.data&&e.data.size>0)chunks.push(e.data)};recorder.onstop=()=>{if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(new Blob(chunks,{type:(recorder.mimeType||"audio/webm")}));document.getElementById("playRecordingBtn").disabled=false;document.getElementById("deleteRecordingBtn").disabled=false;setStatus("Saved! Tap ▶ Play to hear your reading.",true);stream.getTracks().forEach(t=>t.stop())};recorder.start();btn.textContent="■ Stop";btn.classList.add("recording");setStatus("Recording… tap ■ Stop when you finish.",true)}catch(e){var n=(e&&e.name)?e.name:String(e);if(n==="NotAllowedError"||n==="SecurityError"){setStatus("Microphone blocked. In the chat preview the mic is always off — use the live website, then tap Allow (or click 🔒 in the address bar → allow Microphone → reload).",false);}else if(n==="NotFoundError"){setStatus("No microphone found on this device.",false);}else{setStatus("Could not record ("+n+"). Use the live website in Chrome/Edge/Safa
