<script>

const pages=[{"type": "cover", "title": "One Ramp, Many Finish Lines", "subtitle": "A Shared Goal Works When Everyone Can Contribute to Reaching It", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/one-ramp-many-finish-lines-assets/cover.jpg"}, {"text": "1. One Hundred Laps\nThe class set a recess goal: complete one hundred obstacle-course laps by Friday. Samira drew a route over a low ramp, through cones, and around two hoops.\nAvery studied the plan. The narrow cone turn would catch a wheelchair footrest, and carrying a beanbag while pushing required a different setup. The goal sounded shared, but the route assumed one kind of movement.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/one-ramp-many-finish-lines-assets/page1.jpg"}, {"text": "2. Barrier or Person\nNobody said Avery could not participate. Still, the design created that result. Mr. Torres asked the class to name the barrier instead of describing Avery as the problem.\nThey listed tight turns, an object that required two hands, and a single definition of a lap. Changing the person was impossible and unnecessary. Changing the course was the group's responsibility.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/one-ramp-many-finish-lines-assets/page2.jpg"}, {"text": "3. The Goal Under the Goal\nSamira asked what they truly hoped to achieve. Students answered: move together, practice coordination, encourage one another, and improve the playground for field day.\nOne hundred identical laps had been a measurement, not the deeper purpose. The class kept the collective goal but opened the route: travel a marked path, complete one coordination task, and contribute one point.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/one-ramp-many-finish-lines-assets/page3.jpg"}, {"text": "4. More Than One Route\nTeams built three equivalent choices. One path used the ramp and wide turns. Another used flat blue tape. A third stayed at a station where partners aimed beanbags into hoops.\nStudents could switch routes or roles without explaining why. Avery tested the ramp edges, Samira measured turning space, and classmates tried the stations using their usual ways of moving.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/one-ramp-many-finish-lines-assets/page4.jpg"}, {"text": "5. Milestones Everyone Could See\nThe class divided the week into milestones: test by Tuesday, revise by Wednesday, earn sixty points by Thursday, and reach one hundred by Friday.\nA progress chart recorded team points, not student rankings. It also had a column for barriers discovered and fixed. Success meant more than moving faster; it included making the next attempt more usable.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/one-ramp-many-finish-lines-assets/page5.jpg"}, {"text": "6. Evidence Changes the Plan\nOn Wednesday, Avery's front caster slipped near the ramp edge. The ramp was sturdy, but the teal marking was hard to see in shade. Avery stopped and reported the problem.\nThe team widened the edge contrast and added a spotter zone that any participant could request. After retesting, Avery chose the ramp again. Inclusion required ongoing evidence, not a single good intention.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/one-ramp-many-finish-lines-assets/page6.jpg"}, {"text": "7. One Hundred Together\nBy Friday, the class reached one hundred points through many routes and roles. Avery completed ramp rounds and later tracked equipment. Samira ran flat-path laps and served as a spotter when requested.\nThe finish line was not one strip everyone crossed in the same way. It was a goal built from access, choice, useful roles, and revision. Because more people could contribute, the class achievement belonged to more people.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/one-ramp-many-finish-lines-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "What problem did Avery notice with Samira's route plan?", "choices": ["The route was too short overall", "There were not enough hoops", "The narrow cone turn would catch a wheelchair footrest, and carrying a beanbag required a different setup"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "The narrow cone turn would catch a wheelchair footrest, and carrying a beanbag while pushing required a different setup."}, {"q": "What did Mr. Torres ask the class to name?", "choices": ["The barrier, instead of describing Avery as the problem", "A new recess schedule", "The fastest runner in class"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Mr. Torres asked the class to name the barrier instead of describing Avery as the problem."}, {"q": "What did students say they truly hoped to achieve with the goal?", "choices": ["Win a trophy for the school", "Move together, practice coordination, encourage one another, and improve the playground", "Finish before any other class"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "Students answered: move together, practice coordination, encourage one another, and improve the playground."}, {"q": "What three route choices did teams build?", "choices": ["Only one identical path for everyone", "A single very difficult obstacle course", "The ramp with wide turns, flat blue tape, and a station for aiming beanbags into hoops"], "answer": 2, "evidencePage": 4, "hint": "Look at page 4.", "explain": "One path used the ramp and wide turns. Another used flat blue tape. A third stayed at a beanbag station."}, {"q": "What is the big idea of this story?", "choices": ["A shared goal works when everyone can contribute to reaching it", "Everyone must complete the exact same task", "Only the fastest students should count toward the goal"], "answer": 0, "evidencePage": 7, "hint": "Look at the last page.", "explain": "A shared goal works when everyone can contribute to reaching it."}], "grammar": [{"q": "'Nobody said Avery could not participate, ___ the design created that result anyway.' Which word shows contrast?", "choices": ["so", "because", "yet"], "answer": 2, "evidencePage": 2, "hint": "This word contrasts what nobody said with what actually happened.", "explain": "'Yet' contrasts nobody saying Avery couldn't participate with the design still excluding her.", "teach": "<b>X, yet Y</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>yet</b>(然而)表示两个事实之间的<b>对比</b>。</span>"}, {"q": "'The ramp was sturdy, ___ the teal marking was hard to see in shade.' Which word shows contrast?", "choices": ["but", "so", "because"], "answer": 0, "evidencePage": 6, "hint": "This word contrasts the ramp's sturdiness with a different problem.", "explain": "'But' contrasts the ramp being sturdy with the marking still being hard to see.", "teach": "<b>But</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>but</b>(但是)表示两个事实之间的<b>对比</b>。</span>"}, {"q": "'Avery completed ramp rounds ___ later tracked equipment.' Which word joins these two actions?", "choices": ["but", "and", "so"], "answer": 1, "evidencePage": 7, "hint": "This word joins the two things Avery did.", "explain": "'And' joins completing ramp rounds with later tracking equipment.", "teach": "<b>And</b> joins <b>two actions</b> done by the same person.<span class='cn'><b>and</b>(和)连接同一个人做的<b>两个动作</b>。</span>"}], "vocabulary": [{"q": "'Barrier' means ___.", "choices": ["a reward for finishing first", "a type of obstacle course prize", "something that blocks or makes it hard to participate"], "answer": 2, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Mr. Torres asked the class to name the barrier instead of describing Avery as the problem."}, {"q": "'Milestone' means ___.", "choices": ["a marker showing important progress toward a goal", "a type of ramp material", "a punishment for being slow"], "answer": 0, "evidencePage": 5, "hint": "Look at page 5.", "explain": "Milestones Everyone Could See—the class divided the week into progress markers."}, {"q": "'Inclusion' means ___.", "choices": ["a type of race timer", "making sure everyone can participate and belong", "excluding certain people on purpose"], "answer": 1, "evidencePage": 6, "hint": "Look at page 6.", "explain": "Inclusion required ongoing evidence, not a single good intention."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};

function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(barrier|milestone|inclusion)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 4 SEL</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}
