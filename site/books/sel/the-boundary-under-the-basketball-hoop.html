<script>

const pages=[{"type": "cover", "title": "The Boundary Under the Basketball Hoop", "subtitle": "A Clear Limit Can Protect Both Practice and Friendship", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-boundary-under-the-basketball-hoop-assets/cover.jpg"}, {"text": "1. One More Game\nDarius stayed after school to practice free throws before Saturday's game. He counted each orange-ball shot and wrote the total on a small clipboard. Kenji arrived with his blue basketball and asked for a one-on-one game.\nDarius said he needed twenty quiet minutes first. Kenji bounced closer and called, \"Come on—just one game.\" The request was friendly, but hearing it again made Darius lose his count and tighten his grip.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-boundary-under-the-basketball-hoop-assets/page1.jpg"}, {"text": "2. A Hint Was Not Enough\nDarius turned away and shot faster, hoping Kenji would notice. Kenji interpreted the silence as maybe later and began rebounding Darius's misses. Darius's shoulders rose each time the blue ball crossed his practice lane.\nA boundary left only as a hint could be hard to understand. Darius paused, faced Kenji, and prepared to say what he needed without insulting Kenji or pretending the need did not matter.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-boundary-under-the-basketball-hoop-assets/page2.jpg"}, {"text": "3. Clear and Respectful\n\"I want to play with you after I finish,\" Darius said. \"For the next twenty minutes, I need this half of the court quiet and the orange ball left alone. Please use the other hoop or wait by the bench.\"\nHe named the time, space, and action instead of calling Kenji annoying. The boundary was firm, but it also showed when playing together could become possible.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-boundary-under-the-basketball-hoop-assets/page3.jpg"}, {"text": "4. The First Reaction\nKenji's face fell. He had imagined surprising Darius with extra practice before the game. For a moment, he wanted to argue that friends should always include each other.\nThen he repeated what he heard: \"You need this half alone until the timer ends. You are not saying you never want to play.\" Darius nodded. Respecting a boundary did not require Kenji to enjoy hearing it.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-boundary-under-the-basketball-hoop-assets/page4.jpg"}, {"text": "5. A Different Plan\nThe second hoop was being repaired, so Kenji chose the bench. He practiced quiet ball-handling patterns beside it, far from Darius's lane. Darius reset his count and completed twenty focused minutes.\nWhen the timer chimed, Darius checked in instead of assuming. Kenji still wanted a game, but requested five minutes to finish his own pattern. Darius agreed and waited. A boundary could belong to either friend.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-boundary-under-the-basketball-hoop-assets/page5.jpg"}, {"text": "6. Playing with Agreements\nBefore their game, they made two agreements: ask before joining a practice drill, and stop play when either person called \"reset.\" The word could mean a loose shoelace, rising frustration, or a need to clarify a rule.\nTheir game was energetic, not silent. Once Darius called reset after a hard collision of basketballs. Kenji stopped immediately. They separated the balls, checked their space, and returned to play.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-boundary-under-the-basketball-hoop-assets/page6.jpg"}, {"text": "7. Space for Friendship\nSaturday, Darius made two important free throws. Kenji cheered from the sideline with the blue ball tucked under his arm. After the game, Darius invited him to practice—and Kenji asked which kind of practice he wanted.\nThe line under the hoop had never been a wall between friends. It was information about what helped each person participate well. Clear limits gave their friendship more room, not less.", "image": "https://learningenglishfun-media-1463631719.cos.ap-hongkong.myqcloud.com/books/sel/the-boundary-under-the-basketball-hoop-assets/page7.jpg"}];
const quizzes={"comprehension": [{"q": "Why did Darius lose his count while practicing free throws?", "choices": ["The ball went flat", "He forgot how to shoot", "Kenji kept asking for a game, which made him lose his count"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Hearing Kenji's request again made Darius lose his count and tighten his grip."}, {"q": "What did Kenji do when Darius turned away and shot faster?", "choices": ["He interpreted the silence as maybe later and began rebounding Darius's misses", "He left immediately without a word", "He asked Darius to stop practicing completely"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Kenji interpreted the silence as maybe later and began rebounding Darius's misses."}, {"q": "What did Darius say clearly to Kenji?", "choices": ["He never wanted to play with Kenji again", "He needed the court quiet for twenty minutes and asked Kenji to use the other hoop or wait", "He wanted Kenji to leave the school"], "answer": 1, "evidencePage": 3, "hint": "Look at page 3.", "explain": "He said he needed the half of the court quiet for twenty minutes and asked Kenji to use the other hoop or wait by the bench."}, {"q": "What did Kenji do to show he understood the boundary?", "choices": ["He argued that friends should always include each other", "He ignored what Darius said completely", "He repeated back what he heard: Darius needed the half alone until the timer ended"], "answer": 2, "evidencePage": 4, "hint": "Look at page 4.", "explain": "He repeated what he heard: \"You need this half alone until the timer ends.\""}, {"q": "What is the big idea of this story?", "choices": ["A clear limit can protect both practice and friendship", "Friends should never set limits with each other", "Practicing alone means you don't want friends"], "answer": 0, "evidencePage": 7, "hint": "Look at the last page.", "explain": "Clear limits gave their friendship more room, not less."}], "grammar": [{"q": "'The request was friendly, ___ hearing it again made Darius lose his count.' Which word shows contrast?", "choices": ["so", "because", "but"], "answer": 2, "evidencePage": 1, "hint": "This word contrasts the friendly request with its actual effect on Darius.", "explain": "'But' contrasts the friendly request with it still disrupting Darius's count.", "teach": "<b>But</b> shows a <b>contrast</b> between two facts.<span class='cn'><b>but</b>(但是)表示两个事实之间的<b>对比</b>。</span>"}, {"q": "'Kenji's face fell, ___ for a moment he wanted to argue that friends should always include each other.' Which word joins these ideas?", "choices": ["and", "but", "so"], "answer": 0, "evidencePage": 4, "hint": "This word joins Kenji's reaction with his passing thought.", "explain": "'And' joins Kenji's face falling with his passing wish to argue.", "teach": "<b>And</b> joins <b>two related ideas</b>.<span class='cn'><b>and</b>(和)连接<b>两个相关的想法</b>。</span>"}, {"q": "'Kenji stopped immediately. ___ they separated the balls, checked their space, and returned to play.' Which word signals what happened next?", "choices": ["Before", "Then", "Never"], "answer": 1, "evidencePage": 6, "hint": "This word signals the next step, after Kenji stopped.", "explain": "'Then' signals the next step: first Kenji stopped, then they separated the balls and checked their space.", "teach": "<b>Then</b> signals the <b>next step</b> in a sequence of events.<span class='cn'><b>then</b>(然后)标志一系列事件中的<b>下一步</b>。</span>"}], "vocabulary": [{"q": "'Boundary' means ___.", "choices": ["a type of basketball game", "a punishment for bad behavior", "a limit that shows where one thing ends and protects a need"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "The boundary was firm, but it also showed when playing together could become possible."}, {"q": "'Interpreted' means ___.", "choices": ["understood or explained the meaning of something", "shouted something loudly", "measured something exactly"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "Kenji interpreted the silence as maybe later."}, {"q": "'Respecting' means ___.", "choices": ["ignoring someone's wishes completely", "treating someone's feelings, wishes, or rights with consideration", "competing against someone directly"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Respecting a boundary did not require Kenji to enjoy hearing it."}]};
let page=0,activeTab="comprehension",qIndex={comprehension:0,grammar:0,vocabulary:0},selections={},attempts={},completed={comprehension:false,grammar:false,vocabulary:false};
let recorder=null,chunks=[],audioURL=null,currentAudio=null,speaking=false;
const labels={comprehension:"Story",grammar:"Grammar",vocabulary:"Vocabulary"};
function storyMarkup(text){let n=0;return text.split(/(\s+)/).map(part=>{if(/^\s+$/.test(part))return part.replace(/\n/g,"<br>");const clean=part.replace(/[^\w’'-]/g,"");if(!clean)return part;const focus=/^(boundary|interpreted|respecting)$/i.test(clean)?" focus":"";return `<span class="story-word${focus}" data-i="${n++}">${part}</span>`}).join("")}
function renderPage(){const p=pages[page],view=document.getElementById("pageView");const __long=p.type!=="cover"&&(p.text||"").split(/\s+/).filter(Boolean).length>55;if(view.parentElement)view.parentElement.classList.toggle("reader-long",__long);if(p.type==="cover")view.innerHTML=`<div class="book-page cover-page"><div class="story"><div class="kicker">learningenglishfun · Grade 4 SEL</div><h2>${p.title}</h2><h3>${p.subtitle}</h3><div class="tags"><span class="tag">🎧 Listen</span><span class="tag">📖 Read</span><span class="tag">🎙 Record</span><span class="tag">✓ Practice</span></div></div><div class="art"><img src="${p.image}" alt="Story cover"><span class="page-no">Cover</span></div></div>`;else view.innerHTML=`<div class="book-page${__long?" long-text":""}"><div class="story"><div class="kicker">Read the story</div><p>${storyMarkup(p.text)}</p></div><div class="art"><img src="${p.image}" alt="Story illustration"><span class="page-no">${page} / ${pages.length-1}</span></div></div>`;document.getElementById("progress").innerHTML=pages.map((_,i)=>`<button class="dot ${i===page?'active':''}" onclick="goPage(${i})">${i===0?'★':i}</button>`).join("");document.getElementById("prevBtn").disabled=page===0;document.getElementById("nextBtn").textContent=page===pages.length-1?"Start Practice →":"Next →"}
function goPage(i){window.__readToken=(window.__readToken||0)+1;speechSynthesis.cancel();cancelFallback();clearHighlight();page=Math.max(0,Math.min(pages.length-1,i));renderPage()}
document.getElementById("prevBtn").onclick=()=>goPage(page-1);document.getElementById("nextBtn").onclick=()=>page<pages.length-1?goPage(page+1):(activeTab="comprehension",setTabs(),renderPanel());
function setTabs(){document.querySelectorAll(".tab").forEach(b=>{b.classList.toggle("active",b.dataset.tab===activeTab);b.classList.toggle("done",completed[b.dataset.tab])});document.getElementById("stagePill").textContent=labels[activeTab]+" Practice"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;setTabs();renderPanel()});
function renderPanel(){const list=quizzes[activeTab],qi=qIndex[activeTab],item=list[qi],key=activeTab+"-"+qi,selected=selections[key];document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">${labels[activeTab]} · ${qi+1} of ${list.length}</div><h2>${item.q}</h2><p class="small">${activeTab==='comprehension'?'Use the story and pictures as evidence.':activeTab==='grammar'?'Look carefully at the sentence.':'Use the story context to find the meaning.'}</p><div>${item.choices.map((c,i)=>`<button class="option ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join("")}</div><button class="hint-btn" onclick="showHint()">💡 Need a hint?</button><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="submit" onclick="checkAnswer()">Check Answer</button></div>`}

var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var wordTimes=window.RV_WORD_TIMES&&window.RV_WORD_TIMES[page];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var idx=0,j;if(wordTimes&&wordTimes.length){var t=a.currentTime;for(j=0;j<wordTimes.length;j++){if(t>=wordTimes[j])idx=j;else break;}}else{var frac=rvRemapFrac(a.currentTime/dur,marks);for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById(
