const quizzes={"comprehension": [{"q": "Why did Leo's family use simple machines to build the treehouse?", "choices": ["lifting the heavy boards straight up was too hard by hand", "to make the treehouse look nicer", "the machines were on sale"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Simple machines made the hard job of lifting heavy boards easier. (NGSS 3-PS2, engineering)"}, {"q": "What does a simple machine do?", "choices": ["it runs on batteries", "it changes a force to make a job easier", "it makes objects heavier"], "answer": 1, "evidencePage": 2, "hint": "Look at page 2.", "explain": "A simple machine changes a force so a task takes less effort. (NGSS 3-PS2)"}, {"q": "How does a ramp (inclined plane) make lifting easier?", "choices": ["it makes the load lighter", "it freezes the load in place", "you push the load up a slope instead of lifting its full weight straight up"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "A ramp lets you move a load upward over a longer, gentler path, needing less force at once. (NGSS 3-PS2)"}, {"q": "How does a lever help Leo move the rock?", "choices": ["he pushes down on one end and the other end lifts the rock", "it rolls the rock away", "it cuts the rock in half"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "A lever turns on a point; pushing down on one end lifts the load on the other end. (NGSS 3-PS2)"}, {"q": "Which simple machine is used to lift a bucket straight up with a rope?", "choices": ["a wedge", "a pulley", "a screw"], "answer": 1, "evidencePage": 6, "hint": "Look at page 6.", "explain": "A pulley is a wheel with a rope; pulling the rope down raises the load up. (NGSS 3-PS2)"}], "grammar": [{"q": "\"Leo pushed the box up the ramp ___ lifting it straight up.\" Which words fit?", "choices": ["because of", "in front of", "instead of"], "answer": 2, "evidencePage": 3, "hint": "The ramp is used in place of lifting.", "explain": "'Instea
