, "answer": 1, "evidencePage": 6, "hint": "'Can' + verb shows something is able to happen.", "explain": "A modal verb like 'can', 'may', or 'must' comes before the main verb and changes its meaning.", "teach": "<b>Modal verbs</b> (can, may, must, should) come <b>before</b> the main verb: a frog <b>can watch</b>, blood <b>must move</b>.<span class='cn'><b>情态动词</b>（can, may, must）放在主动词<b>前</b>：a frog can watch。</span>"}, {"q": "Which sentence puts the adjectives in the natural order?", "choices": ["a hawk gripped its perch with pointed, curved toes", "a hawk gripped its perch with toes curved pointed", "a hawk gripped its perch with curved, pointed toes"], "answer": 2, "evidencePage": 4, "hint": "Shape usually comes before a describing word about the point.", "explain": "English tends to order adjectives in a set way; 'curved, pointed toes' sounds natural.", "teach": "English orders adjectives in a usual way (size → shape → …): <b>curved, pointed</b> toes; a <b>small round</b> eye.<span class='cn'>英语形容词有习惯顺序（大小→形状…）：curved, pointed toes。</span>"}, {"q": "\"Every structure ___ a function.\" Which verb agrees with the singular subject 'every structure'?", "choices": ["has", "have", "having"], "answer": 0, "evidencePage": 7, "hint": "'Every structure' is treated as singular.", "explain": "'Every' + a noun is singular, so it takes 'has'.", "teach": "<b>Every + noun</b> is <b>singular</b>: every structure <b>has</b> a job; every animal <b>needs</b> oxygen.<span class='cn'><b>every + 名词</b> 是<b>单数</b>：every structure has。</span>"}], "vocabulary": [{"q": "An \"internal\" structure is one that is ___.", "choices": ["on the outside of the body", "inside the body", "shared by two animals"], "answer": 1, "evidencePage": 1, "hint": "The skeleton and heart are examples.", "explain": "Internal means inside. The skeleton, heart, and lungs are internal structures."}, {"q": "The \"function\" of a body part is ___.", "choices": ["its color", "where it is found", "the job it does"], "answer": 2, "evidencePage": 7, "hint": "Leo's chart matched each part to this.", "explain": "A function is the job or purpose that a part carries out."}, {"q": "\"Gills\" are structures that let an animal ___.", "choices": ["take in oxygen from water", "run very fast", "see in the dark"], "answer": 0, "evidencePage": 3, "hint": "Fish open and close them on the sides of the head.", "explain": "Gills take dissolved oxygen out of water so a fish can breathe."}]};
