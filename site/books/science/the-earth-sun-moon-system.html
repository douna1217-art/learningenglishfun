const quizzes={"comprehension": [{"q": "Why does the moon appear to change shape through the month?", "choices": ["the moon really changes size", "clouds cover different parts of it", "we see different amounts of its sunlit half as it orbits Earth"], "answer": 2, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Phases are the changing view of the moon's lit half from Earth as the moon orbits. (NGSS MS-ESS1-1)"}, {"q": "What causes a SOLAR eclipse?", "choices": ["the moon passes directly between the sun and Earth, casting its shadow on us", "Earth passes between the sun and moon", "the sun burns out briefly"], "answer": 0, "evidencePage": 3, "hint": "Look at page 3.", "explain": "In a solar eclipse the moon blocks the sun and its shadow falls on part of Earth. (NGSS MS-ESS1-1)"}, {"q": "What causes a LUNAR eclipse?", "choices": ["the moon runs out of sunlight", "Earth passes between the sun and moon, so Earth's shadow covers the moon", "the moon moves behind a planet"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "In a lunar eclipse Earth is between the sun and moon, and Earth's shadow falls on the moon. (NGSS MS-ESS1-1)"}, {"q": "Why don't eclipses happen every month?", "choices": ["the moon disappears for part of each month", "eclipses need a full moon and a new moon at once", "the moon's orbit is slightly tilted, so the three bodies line up exactly only a few times a year"], "answer": 2, "evidencePage": 5, "hint": "Look at page 5.", "explain": "The moon's tilted orbit means perfect alignment (and an eclipse) is uncommon. (NGSS MS-ESS1-1)"}, {"q": "What actually causes the seasons?", "choices": ["Earth's tilted axis, which makes each hemisphere lean toward the sun for part of the year", "Earth's changing distance from the sun", "the moon blocking sunlight in winter"], "answer": 0, "evidencePage": 6, "hint": "Look at page 6.", "explain": "Seasons come from the ~23° axial tilt, not from distance — Earth is actually farthest from the sun in July. (NGSS MS-ESS1-1)"}], "grammar": [{"q": "\"Summer is hot ___ Earth is actually farthest from the sun in July.\" Which word signals the surprising contrast?", "choices": ["so", "even though", "because"], "answer": 1, "evidencePage": 6, "hint": "The fact seems to go against the expectation.", "explain": "'Even though' introduces a fact that contrasts with what you might expect.", "teach": "<b>Even though</b> introduces a <b>surprising or contrasting</b> fact: it's hot <b>even though</b> Earth is far from the sun.<span class='cn'><b>even though</b> 引出与预期<b>相反</b>的事实。</span>"}, {"q": "\"The moon's orbit is slightly tilted, ___ eclipses are rare.\" Which word shows the result?", "choices": ["so", "but", "or"], "answer": 0, "evidencePage": 5, "hint": "The tilt is the cause; rare eclipses are the effect.", "explain": "'So' joins a cause to its result.", "teach": "Use <b>so</b> to join a <b>cause</b> to its <b>result</b>: the orbit is tilted, <b>so</b> eclipses are rare.<span class='cn'>用 <b>so</b> 连接<b>原因</b>和<b>结果</b>。</span>"}, {"q": "Which is the correct possessive in 'the shadow belonging to Earth'?", "choices": ["Earths shadow", "Earths' shadow", "Earth's shadow"], "answer": 2, "evidencePage": 4, "hint": "One planet, Earth, owns the shadow.", "explain": "To show a single owner, add apostrophe + s: Earth's shadow.", "teach": "Single owner → add <b>'s</b>: <b>Earth's</b> shadow, the <b>moon's</b> orbit, the <b>sun's</b> light.<span class='cn'>单个所有者，加 <b>'s</b>：Earth's shadow。</span>"}], "vocabulary": [{"q": "A \"phase\" of the moon is ___.", "choices": ["a crack on the moon's surface", "the portion of the moon's lit half that we can see from Earth", "a month on the moon"], "answer": 1, "evidencePage": 1, "hint": "Ana photographed a full cycle.", "explain": "A moon phase is the shape of the sunlit part of the moon as seen from Earth."}, {"q": "An \"eclipse\" happens when ___.", "choices": ["the sun changes color", "the moon speeds up", "one body moves into the shadow of another"], "answer": 2, "evidencePage": 3, "hint": "Solar and lunar are the two kinds.", "explain": "An eclipse occurs when one celestial body passes into the shadow cast by another."}, {"q": "Earth's axial \"tilt\" is ___.", "choices": ["the angle between Earth's spin axis and its orbit, about 23 degrees", "how fast Earth spins", "the wobble of the moon"], "answer": 0, "evidencePage": 6, "hint": "It is the real reason for seasons.", "explain": "The axial tilt is the roughly 23° lean of Earth's rotation axis, which drives the seasons."}]};
