st compares the desert to every other place studied.", "teach": "<b>The hottest</b> compares <b>more than two things</b>: the desert can be <b>the hottest</b> place of all three.<span class='cn'><b>the hottest</b>(最热的)用于比较<b>三者或更多</b>：沙漠可能是三个地方中<b>最热</b>的。</span>"}, {"q": "'The polar region is ___ climate on Earth.' Which phrase means the most cold?", "choices": ["the coldest", "the colder", "very cold of"], "answer": 0, "evidencePage": 4, "hint": "This phrase means more cold than every other place, not just one other place.", "explain": "The coldest means more cold than every other place on Earth.", "teach": "<b>The coldest</b> means <b>colder than everywhere else</b>: the polar region is <b>the coldest</b> climate on Earth.<span class='cn'><b>the coldest</b>(最冷的)表示<b>比其他所有地方都冷</b>：极地是地球上<b>最冷</b>的气候。</span>"}, {"q": "Which word form do we use to compare three or more places, like 'hot, hotter, ___'?", "choices": ["hotly", "hottest", "hotter"], "answer": 1, "evidencePage": 3, "hint": "Think about the ending added to compare more than two things.", "explain": "Hottest is the superlative form used to compare three or more things.", "teach": "Add <b>-est</b> to compare <b>three or more things</b>: hot → hotter → <b>hottest</b>.<span class='cn'>比较<b>三者或更多</b>时用 <b>-est</b>：hot → hotter → <b>hottest</b>。</span>"}], "vocabulary": [{"q": "'Climate' means ___.", "choices": ["the weather on one single day", "a type of thermometer", "the typical weather pattern of a place over many years"], "answer": 2, "evidencePage": 7, "hint": "Look at page 7.", "explain": "A climate describes the typical weather pattern of a place across many years, not just one day."}, {"q": "A 'rainforest' is ___.", "choices": ["a warm, wet region with frequent rain", "a cold, icy region", "a hot, dry region with no rain"], "answer": 0, "evidencePage": 6, "hint": "Look at page 6.", "explain": "The rainforest has a warm, wet climate, with rain falling almost every single day of the year."}, {"q": "'Adap function speakText(text,lang){try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}catch(e){}}function escAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}function playTeachAudio(key,part,fallbackText,fallbackLang){try{var store=window.RV_TEACH_AUDIO&&window.RV_TEACH_AUDIO[key];if(store&&store[part]){var a=new Audio(store[part]);a.play();return;}}catch(e){}speakText(fallbackText,fallbackLang);}function renderTeach(teachHtml,key){var m=teachHtml.match(/<span class=['"]cn['"]>([\s\S]*?)<\/span>/);var cnHtml=m?m[1]:"";var enHtml=m?teachHtml.slice(0,m.index):teachHtml;var strip=function(s){return s.replace(/<[^>]+>/g,"");};var enText=strip(enHtml),cnText=strip(cnHtml);var out='<div class="teach">\uD83D\uDCA1 <b>Let\u2019s learn:</b><br>';out+='<button style="border:0;background:#e2483f;color:#fff;cursor:pointer;font-size:.8em;line-height:1;vertical-align:middle;padding:0;margin-right:6px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;width:1.9em;height:1.9em;box-shadow:0 2px 6px rgba(226,72,63,.35)" data-key="'+key+'" data-part="en" data-text="'+escAttr(enText)+'" data-lang="en-US" onclick="playTeachAudio(this.dataset.key,this.dataset.part,this.dataset.text,this.dataset.lang)" aria-label="Listen in English" title="Listen in English">\uD83D\uDD0A</button> '+enHtml;if(cnHtml){out+='<span class="cn"><button style="border:0;background:#e2483f;color:#fff;cursor:pointer;font-size:.8em;line-height:1;vertical-align:middle;padding:0;margin-right:6px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;width:1.9em;height:1.9em;box-shadow:0 2px 6px rgba(226,72,63,.35)" data-key="'+key+'" data-part="cn" data-text="'+escAttr(cnText)+'" data-lang="zh-CN" onclick="playTeachAudio(this.dataset.key,this.dataset.part,this.dataset.text,this.dataset.lang)" aria-label="\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3" title="\u64AD\u653E\u4E2D\u6587\u8BB2\u89E3">\uD83D\uDD0A</button> '+cnHtml+'</span>';}out+="</div>";return out;}function checkAnswer(){const qi=qIndex[activeTab],item=quizzes[activeTab][qi],key=activeTab+"-"+qi,selected=selections[key],fb=document.getElementById("feedback");if(selected===undefined){fb.textContent="Please choose an answer first.";return}attempts[key]=(attempts[key]||0)+1;document.querySelectorAll(".option").forEach((o,i)=>{o.classList.remove("correct","wrong");if(i===selected)o.classList.add(i===item.answer?"correct":"wrong")});if(selected===item.answer){fb.className="feedback good";fb.innerHTML=`✓ Correct! ${item.explain}<br><button class="audio-btn primary" style="margin-top:9px" onclick="nextQuestion()">Continue →</button>`;saveProgress()}else{recordReviewMistake(item,activeTab,qi);fb.className="feedback bad";fb.innerHTML=`Not yet. ${attempts[key]>1?item.hint:'Let’s find the evidence in the story.'}`+(item.teach?renderTeach(item.teach,activeTab+"-"+qi):"");setTimeout(()=>showEvidence(item.evidencePage),650)}}
function showEvidence(p){page=p;renderPage();const old=document.getElementById("evidenceBanner");if(old)old.remove();const b=document.createElement("div");b.id="evidenceBanner";b.className="evidence-banner";b.innerHTML=`<div><strong>Find the clue on page ${p}</strong><br><span>Read the page, then return to the same question.</span></div><button onclick="returnToQuestion()">Return</button>`;document.body.appendChild(b)}
function returnToQuestion(){document.getElementById("evidenceBanner")?.remove();renderPanel();document.querySelector(".panel").scrollIntoView({behavior:"smooth",block:"start"})}
function nextQuestion(){const list=quizzes[activeTab];if(qIndex[activeTab]<list.length-1){qIndex[activeTab]++;renderPanel();return}completed[activeTab]=true;if(activeTab==="comprehension")activeTab="grammar";else if(activeTab==="grammar")activeTab="vocabulary";else{return showCompletion()}setTabs();renderPanel()}
function showCompletion(){completed.vocabulary=true;setTabs();const correct=Object.keys(selections).filter(k=>{const [tab,idx]=k.split('-');return selections[k]===quizzes[tab][+idx].answer}).length,total=Object.values(quizzes).reduce((a,b)=>a+b.length,0);document.getElementById("stagePill").textContent="Journey Complete";document.getElementById("panelContent").innerHTML=`<div class="card"><div class="question-count">Reading journey complete</div><h2>Wonderful work! 🎉</h2><p class="small">You finished Reading, Grammar, and Vocabulary.</p><div class="score-row"><div class="score-box"><b>${total}</b><br><span>Questions</span></div><div class="score-box"><b>${correct}</b><br><span>Correct now</span></div></div><div class="feedback good">You used evidence, practiced sentence skills, and learned new words.</div><button class="submit" onclick="restartPractice()">Practice Again</button></div>`}
function restartPractice(){activeTab="comprehension";qIndex={comprehension:0,grammar:0,vocabulary:0};selections={};attempts={};completed={comprehension:false,grammar:false,vocabulary:false};setTabs();renderPanel()}
function saveProgress(){try{localStorage.setItem("les-a-promise-for-five-lakes-v1",JSON.stringify({qIndex,completed,attempts}))}catch(e){}}function _lesToday(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}function recordReviewMistake(item,tab,idx){try{var K="les_review_v1";var db=JSON.parse(localStorage.getItem(K)||"{}");db.items=db.items||{};var id="a-promise-for-five-lakes"+"::"+tab+"-"+idx;var ex=db.items[id];db.items[id]={book:"a-promise-for-five-lakes",bookTitle:"A Promise for Five Lakes",tab:tab,idx:idx,q:item.q,choices:item.choices,answer:item.answer,explain:item.explain||"",teach:item.teach||"",hint:item.hint||"",box:1,due:_lesToday(),lastResult:"wrong",addedMissed:(ex&&ex.addedMissed?ex.addedMissed:0)+1};localStorage.setItem(K,JSON.stringify(db));}catch(e){}}
function clearHighlight(){document.querySelectorAll(".story-word.reading").forEach(x=>x.classList.remove("reading"))}
let preferredVoice=null;
function pickVoice(){const voices=speechSynthesis.getVoices();if(!voices.length)return;const en=voices.filter(v=>/^en(-|_|$)/i.test(v.lang));const pool=en.length?en:voices;const score=v=>{let s=0;const n=(v.name||"").toLowerCase();if(/natural/.test(n))s+=8;if(/neural/.test(n))s+=6;if(/online/.test(n))s+=4;if(/google/.test(n))s+=5;if(/(aria|jenny|guy|libby|sonia|michelle|ava|andrew|emma|clara|natasha)/.test(n))s+=5;if(/(samantha|allison|karen|serena|siri|nicky|aaron)/.test(n))s+=4;if(v.localService===false)s+=3;if(/en-us|en-gb/i.test(v.lang))s+=1;if(/(zira|david|mark|hazel|compact|espeak|eloquence)/.test(n))s-=5;return s};pool.sort((a,b)=>score(b)-score(a));preferredVoice=pool[0]||null}
pickVoice();if(typeof speechSynthesis!=="undefined")speechSynthesis.addEventListener("voiceschanged",pickVoice);
var __rvAudio=null,__rvHL=null;function stopRvAudio(){if(__rvHL){clearInterval(__rvHL);__rvHL=null;}if(__rvAudio){try{__rvAudio.pause();}catch(e){}__rvAudio=null;}}(function(){var oc=speechSynthesis.cancel.bind(speechSynthesis);speechSynthesis.cancel=function(){try{stopRvAudio();}catch(e){}return oc();};})();function speak(text,highlight,onEnd){if(window.RV_AUDIO&&window.RV_AUDIO[page]!=null){return speakAudio(text,highlight,onEnd);}return ttsSpeak(text,highlight,onEnd);}function rvRemapFrac(rawFrac,marks){if(!marks||!marks.length)return rawFrac;var pf=0,ps=0,i,m,segF,segS,t;for(i=0;i<marks.length;i++){m=marks[i];if(rawFrac<=m.cf||i===marks.length-1){segF=m.cf-pf;segS=m.cs-ps;if(segF<=0)return m.cs;t=(rawFrac-pf)/segF;return ps+t*segS;}pf=m.cf;ps=m.cs;}return rawFrac;}function speakAudio(text,highlight,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();stopRvAudio();var spans=highlight?[].slice.call(document.querySelectorAll('.story-word')):[];var mm=text.match(/\S+/g)||[],starts=[],tot=0,i,acc=0;for(i=0;i<mm.length;i++)tot+=mm[i].length+1;if(tot<1)tot=1;for(i=0;i<mm.length;i++){starts.push(acc/tot);acc+=mm[i].length+1;}var marks=window.RV_AUDIO_MARKS&&window.RV_AUDIO_MARKS[page];var a=new Audio(window.RV_AUDIO[page]);__rvAudio=a;if(spans.length&&spans[0]){clearHighlight();spans[0].classList.add('reading');}__rvHL=setInterval(function(){if(!__rvAudio)return;var dur=a.duration||0;if(dur>0&&spans.length){var frac=rvRemapFrac(a.currentTime/dur,marks),idx=0,j;for(j=0;j<starts.length;j++){if(frac>=starts[j])idx=j;else break;}clearHighlight();if(spans[idx])spans[idx].classList.add('reading');}},80);a.onended=function(){stopRvAudio();clearHighlight();if(onEnd)onEnd();};a.onerror=function(){stopRvAudio();ttsSpeak(text,highlight,onEnd);};var pb=document.getElementById('pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.i);},at));});};}let advanced=false;const advance=()=>{if(advanced)return;advanced=true;if(watchdog)clearTimeout(watchdog);ci++;speakChunk();};u.onend=advance;u.onerror=advance;const estDur=Math.max(1200,chunk.text.length*110);const watchdog=setTimeout(advance,estDur+4000);speechSynthesis.speak(u);}setTimeout(speakChunk,70);}

function setStatus(m,ok){var el=document.getElementById("recStatus");if(el){el.textContent=m;el.style.color=ok?"#1f8f4d":"#b23b34";}}async function toggleRecording(){const btn=document.getElementById("recordPageBtn");if(recorder&&recorder.state==="recording"){recorder.stop();btn.textContent="🎙 Record";btn.classList.remove("recording");return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setStatus("Recording works only on the published website — the microphone is turned off in this preview.",false);return}if(typeof MediaRecorder==="undefined"){setStatus("This browser can't record audio. Try Chrome/Edge, or Safari 14+.",false);return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});let opts={};if(MediaRecorder.isTypeSupported){if(MediaRecorder.isTypeSupported("audio/webm"))opts={mimeType:"audio/webm"};else if(MediaRecorder.isTypeSupported("audio/mp4"))opts={mimeType:"audio/mp4"};}chunks=[];recorder=new MediaRecorder(stream,opts);recorder.ondataavailable=e=>{if(e.data&&e.data.size>0)chunks.push(e.data)};recorder.onstop=()=>{if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(new Blob(chunks,{type:(recorder.mimeType||"audio/webm")}));document.getElementById("playRecordingBtn").disabled=false;document.getElementById("deleteRecordingBtn").disabled=false;setStatus("Saved! Tap ▶ Play to hear your reading.",true);stream.getTracks().forEach(t=>t.stop())};recorder.start();btn.textContent="■ Stop";btn.classList.add("recording");setStatus("Recording… tap ■ Stop when you finish.",true)}catch(e){var n=(e&&e.name)?e.name:String(e);if(n==="NotAllowedError"||n==="SecurityError"){setStatus("Microphone blocked. In the chat preview the mic is always off — use the live website, then tap Allow (or click 🔒 in the address bar → allow Microphone → reload).",false);}else if(n==="NotFoundError"){setStatus("No microphone found on this device.",false);}else{setStatus("Could not record ("+n+"). Use the live website in Chrome/Edge/Safari 14+.",false);}}}
document.getElementById("recordPageBtn").onclick=toggleRecording;document.getElementById("playRecordingBtn").onclick=()=>{if(!audioURL)return;if(currentAudio)currentAudio.pause();currentAudio=new Audio(audioURL);var pb=document.getElementById("playRecordingBtn");pb.classList.add("active");currentAudio.onended=()=>pb.classList.remove("active");currentAudio.onpause=()=>pb.classList.remove("active");currentAudio.play().catch(err=>{pb.classList.remove("active");setStatus("Could not play ("+((err&&err.name)?err.name:err)+").",false);})};document.getElementById("deleteRecordingBtn").onclick=()=>{var db=document.getElementById("deleteRecordingBtn");db.classList.add("active");setTimeout(()=>db.classList.remove("active"),220);if(currentAudio)currentAudio.pause();if(audioURL)URL.revokeObjectURL(audioURL);audioURL=null;chunks=[];var pl=document.getElementById("playRecordingBtn");pl.disabled=true;pl.classList.remove("active");document.getElementById("deleteRecordingBtn").disabled=true};

function cancelFallback(){window.__fbt&&window.__fbt.forEach(clearTimeout);window.__fbt=[];}function setListenActive(id){["listenPageBtn","listenStoryBtn"].forEach(x=>{var el=document.getElementById(x);if(el)el.classList.toggle("active",x===id);});}function readStory(){var token=(window.__readToken=(window.__readToken||0)+1);speechSynthesis.cancel();cancelFallback();clearHighlight();setListenActive("listenStoryBtn");var seq=[{p:0,t:(pages[0].title+`. `+pages[0].subtitle+`.`),hl:false}];for(var i=1;i<pages.length;i++)seq.push({p:i,t:pages[i].text,hl:true});var k=0;function step(){if(token!==window.__readToken)return;if(k>=seq.length){endNarration();return;}var it=seq[k++];page=it.p;renderPage();speak(it.t,it.hl,function(){if(token===window.__readToken)step();});}step();}function endNarration(){stopRvAudio();clearHighlight();cancelFallback();var pb=document.getElementById("pauseBtn");if(pb){pb.textContent="⏸ Pause";pb.disabled=true;pb.classList.remove("active");}setListenActive(null);}
(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.onclick=function(){if(__rvAudio){if(__rvAudio.paused){var _p=__rvAudio.play();if(_p&&_p.catch)_p.catch(function(){});pb.textContent='⏸ Pause';pb.classList.remove('active');}else{__rvAudio.pause();pb.textContent='▶ Resume';pb.classList.add('active');}return;}if(speechSynthesis.paused){speechSynthesis.resume();pb.textContent="⏸ Pause";pb.classList.remove("active");}else if(speechSynthesis.speaking){speechSynthesis.pause();pb.textContent="▶ Resume";pb.classList.add("active");}};}})();
