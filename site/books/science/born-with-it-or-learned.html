const quizzes={"comprehension": [{"q": "How did Priya's puppy know how to bark and dig?", "choices": ["Priya taught it over many weeks", "It was born knowing how — those are instincts", "It watched videos"], "answer": 1, "evidencePage": 1, "hint": "Look at pages 1 and 2.", "explain": "Barking and digging are instincts — inherited behaviors the puppy was born able to do. (NGSS 3-LS3-1)"}, {"q": "What is an instinct?", "choices": ["a behavior an animal is born able to do", "a trick an animal is taught", "a kind of food"], "answer": 0, "evidencePage": 2, "hint": "Look at page 2.", "explain": "An instinct is an inherited behavior; the animal does not have to learn it. (NGSS 3-LS3-1)"}, {"q": "Why are spinning a web and building a nest called instincts?", "choices": ["The animals go to school for them", "Only zoo animals can do them", "The animals do them correctly the first time, without being taught"], "answer": 2, "evidencePage": 3, "hint": "Look at page 3.", "explain": "A spider and a bird perform these behaviors correctly the first time, so they are inherited. (NGSS 3-LS3-1)"}, {"q": "Where do LEARNED behaviors come from?", "choices": ["from being born with them", "from practice and from watching others", "from eating the right food"], "answer": 1, "evidencePage": 4, "hint": "Look at page 4.", "explain": "Learned behaviors come from practice and from watching others. (NGSS 3-LS3-2)"}, {"q": "How does a young wolf show that animals use BOTH instinct and learning?", "choices": ["It is born wanting to hunt, but it must learn how from its pack", "It is taught everything by people", "It never hunts at all"], "answer": 0, "evidencePage": 7, "hint": "Look at page 7.", "explain": "The urge to hunt is instinct; the skill of hunting is learned from the pack. (NGSS 3-LS3-1, 3-LS3-2)"}], "grammar": [{"q": "Which sentence uses the past tense of 'spin' correctly?", "choices": ["The spider spinned a web.", "The spider spined a web.", "The spider spun a web."], "answer": 2, "eviden 'pauseBtn');if(pb){pb.disabled=false;pb.textContent='⏸ Pause';pb.classList.remove('active');}var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}function ttsSpeak(text,highlight=false,onEnd){speechSynthesis.cancel();clearHighlight();cancelFallback();if(!preferredVoice)pickVoice();const spans=highlight?[...document.querySelectorAll(".story-word")]:[];const wordStarts=[];for(const m of text.matchAll(/\S+/g))wordStarts.push(m.index);const idxAt=abs=>{for(let i=0;i<wordStarts.length;i++){if(abs>=wordStarts[i]&&(i===wordStarts.length-1||abs<wordStarts[i+1]))return i;}return -1;};const light=i=>{clearHighlight();if(i>=0&&spans[i])spans[i].classList.add("reading");};const chunks=[];const re=/[^.!?\n]+[.!?]*[\n]*\s*/g;let m;while((m=re.exec(text))!==null){if(m[0].trim())chunks.push({text:m[0],offset:m.index})}if(!chunks.length)chunks.push({text,offset:0});(function(){var pb=document.getElementById("pauseBtn");if(pb){pb.disabled=false;pb.textContent="⏸ Pause";pb.classList.remove("active");}})();const token=(window.__ttsToken=(window.__ttsToken||0)+1);let ci=0;function speakChunk(){if(token!==window.__ttsToken)return;if(ci>=chunks.length){clearHighlight();if(onEnd)onEnd();else endNarration();return;}const chunk=chunks[ci];const u=new SpeechSynthesisUtterance(chunk.text.replace(/[\u201c\u201d\u201e\u201f\u00ab\u00bb\"]/g,' '));if(preferredVoice){u.voice=preferredVoice;u.lang=preferredVoice.lang}u.rate=.9;u.pitch=1;if(highlight){let boundaryFired=false;const cw=[];for(const mm of chunk.text.matchAll(/\S+/g)){cw.push({i:idxAt(chunk.offset+mm.index),len:mm[0].length});}u.onboundary=e=>{if(e.name!=="word")return;boundaryFired=true;cancelFallback();light(idxAt(chunk.offset+e.charIndex));};u.onstart=()=>{const dur=Math.max(500,chunk.text.length*(60/(u.rate||1)));const totalW=cw.reduce((a,w)=>a+w.len+1,0)||1;let acc=0;cw.forEach(w=>{const slice=dur*((w.len+1)/totalW);const at=acc;acc+=slice;window.__fbt=window.__fbt||[];window.__fbt.push(setTimeout(()=>{if(!boundaryFired)light(w.
