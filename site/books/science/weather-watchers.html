ge": 5, "hint": "Use the base form after “to.”", "explain": "After “to,” we use the base form of the verb: “to predict.”", "teach": "After <b>to</b>, use the <b>base form</b> of a verb: to <b>predict</b>, to <b>watch</b>.<span class='cn'><b>to</b> 后面用动词<b>原形</b>:to predict(预测)。</span>"}, {"q": "“Weather can be sunny, rainy, ___ windy.” Which word fits?", "choices": ["or", "so", "but"], "answer": 0, "evidencePage": 1, "hint": "This lists different possible kinds of weather.", "explain": "“Or” connects different possible kinds of weather in a list.", "teach": "Use <b>or</b> to list <b>different possibilities</b>: sunny, rainy, <b>or</b> windy.<span class='cn'>用 <b>or</b>(或者)列举<b>不同的可能性</b>。</span>"}], "vocabulary": [{"q": "“Weather” means ___.", "choices": ["what it's like outside", "a kind of animal", "a type of plant"], "answer": 0, "evidencePage": 1, "hint": "Look at page 1.", "explain": "Weather means what it's like outside."}, {"q": "A “pattern” is ___.", "choices": ["something that happens again and again in a certain way", "a single event that happens once", "a kind of cloud only"], "answer": 0, "evidencePage": 4, "hint": "Look at page 4.", "explain": "A pattern is something that happens again and again in a certain way."}, {"q": "To “predict” means to ___.", "choices": ["guess what will happen, using clues", "already know for certain", "ignore the weather"], "answer": 0, "evidencePage": 5, "hint": "Look at page 5.", "explain": "To predict means to guess what will happen, using clues."}]};
