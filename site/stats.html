<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>learningenglishfun · Stats</title>
<style>
:root{--ink:#26372e;--muted:#718077;--line:#dfe8e1;--green:#315f47;--shadow:0 18px 42px rgba(46,66,55,.12)}
*{box-sizing:border-box}body{margin:0;background:#f5f7f4;color:var(--ink);font-family:ui-rounded,"Trebuchet MS",Arial,sans-serif;padding:24px}
.wrap{max-width:960px;margin:0 auto}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:26px}
.card{background:#fff;border-radius:18px;padding:18px 20px;box-shadow:var(--shadow)}
.card .n{font-size:2rem;font-weight:800}
.card .l{color:var(--muted);font-size:.85rem;margin-top:4px}
.section{background:#fff;border-radius:18px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
.section h2{font-size:1.05rem;margin:0 0 12px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.err{background:#fff0ee;color:#b23b34;border-radius:12px;padding:14px;margin-bottom:16px}
button{border:0;background:var(--green);color:#fff;border-radius:10px;padding:9px 16px;font-weight:800;cursor:pointer}
.chart-row{display:flex;gap:4px}
.chart-row.values,.chart-row.labels{margin:0}
.chart-row.values span,.chart-row.labels span{flex:1;min-width:0;text-align:center;font-size:.72rem;color:var(--muted);line-height:1.3}
.chart-row.values span{height:16px;font-weight:700}
.chart-row.values span.has{color:var(--ink)}
.chart-row.bars{align-items:flex-end;height:90px;margin:2px 0}
.chart-row.bars .bar{flex:1;min-width:0;background:var(--line);border-radius:3px 3px 0 0;min-height:2px}
.chart-row.bars .bar.has{background:var(--green)}
@media(max-width:480px){
  .chart-row.labels span{visibility:hidden}
  .chart-row.labels span:nth-child(3n+1),
  .chart-row.labels span:last-child{visibility:visible}
}
.fb-card{background:#fff;border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:12px}
.fb-card .msg{font-size:.98rem;line-height:1.5;white-space:pre-wrap;margin:0 0 8px}
.fb-card .meta{display:flex;flex-wrap:wrap;gap:8px;font-size:.76rem;color:var(--muted)}
.fb-card .meta span{background:#f1f4f1;border-radius:999px;padding:3px 9px}
.fb-login{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fb-login input[type=email]{border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:.9rem;width:210px}
</style></head>
<body><div class="wrap">
<h1>📊 Site stats</h1>
<p class="sub">Aggregated usage numbers only — no individual visitor data. <button id="reload">Refresh</button></p>
<div id="content">Loading…</div>
<div id="accountContent"></div>
<div id="swContent"></div>
<div id="errContent"></div>
<div id="regionContent"></div>
<div class="section"><h2>💬 Feedback</h2><div id="fbContent">Loading…</div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(async function(){
  var el = document.getElementById("content");
  var cfg = window.SUPABASE_CONFIG;
  var configured = window.supabase && cfg && cfg.url && cfg.anonKey &&
    cfg.url.indexOf("YOUR-PROJECT")===-1 && cfg.anonKey.indexOf("YOUR-ANON-KEY")===-1;
  if(!configured){
    el.innerHTML = '<div class="err">Supabase 还没配置（supabase-config.js 还是占位符），没有数据可看。</div>';
    return;
  }
  var sb = window.supabase.createClient(cfg.url, cfg.anonKey);

  async function load(){
    el.innerHTML = "Loading…";
    var res = await sb.rpc("get_public_stats");
    if(res.error){
      el.innerHTML = '<div class="err">加载失败：'+res.error.message+'</div>';
      return;
    }
    var d = res.data || {};
    var books = d.top_books || [];
    var cats = d.top_categories || [];
    var totalReview = (d.review_correct||0) + (d.review_wrong||0);
    var accuracy = totalReview ? Math.round((d.review_correct||0)/totalReview*100) : null;

    var signedInPct = d.unique_visitors ? Math.round((d.signed_in_visitors||0)/d.unique_visitors*100) : null;
    var sources = d.top_sources || [];
    var daily = d.daily_visits || [];

    el.innerHTML =
      '<div class="grid">'+
        card(d.total_visits, "Page views") +
        card(d.unique_visitors, "Unique visitors") +
        card(d.total_book_opens, "Books opened") +
        card(d.unique_readers, "Unique readers") +
        card(totalReview, "Review answers") +
        card(accuracy===null?"—":accuracy+"%", "Review accuracy") +
        card(d.signed_in_visitors||0, "Signed-in (sync) visitors") +
        card(signedInPct===null?"—":signedInPct+"%", "Sync adoption rate") +
      '</div>'+
      '<div class="section"><h2>📈 Visits, last 14 days</h2>'+ bars(daily) +'</div>'+
      '<div class="section"><h2>🔗 Traffic sources</h2>'+ table(sources, function(r){return [r.source, r.visits];}, ["Source","Visits"]) +'</div>'+
      '<div class="section"><h2>📚 Most-read books</h2>'+ table(books, function(r){return [r.book_title||r.book_id, r.opens];}, ["Book","Opens"]) +'</div>'+
      '<div class="section"><h2>🗂️ Most-read topics</h2>'+ table(cats, function(r){return [r.category, r.opens];}, ["Topic","Opens"]) +'</div>'+
      '<p class="muted">Last updated: '+(d.last_updated||"")+'</p>';
    loadRegions();
    loadAccounts();
    loadSightWords();
    loadErrors();
  }

  // Real accounts (email sign-ins), from its own database function
  // get_account_stats(): counts only, never an email address. Until the SQL in
  // supabase/account_stats.sql has been run this just shows a hint.
  var accEl = document.getElementById("accountContent");
  async function loadAccounts(){
    var res = await sb.rpc("get_account_stats");
    if(res.error){
      accEl.innerHTML = '<div class="section"><h2>👤 Accounts</h2><p class="muted">账号统计还没启用：请先在 Supabase 的 SQL Editor 里运行 supabase/account_stats.sql。<br><span style="font-size:.8rem">'+esc(res.error.message)+'</span></p></div>';
      return;
    }
    var a = res.data || {};
    var daily = (a.daily_new||[]).map(function(r){return {date:r.date, visits:r.accounts};});
    accEl.innerHTML =
      '<div class="section"><h2>👤 Accounts (email sign-ins)</h2>'+
        '<div class="grid" style="margin-bottom:14px">'+
          card(a.total_accounts, "Accounts (email confirmed)")+
          card(a.new_7d, "New in the last 7 days")+
          card(a.active_7d, "Active in the last 7 days")+
          card(a.synced_pets, "Pets saved to the cloud")+
          card(a.pending, "Typed an email, never clicked the link")+
        '</div>'+
        '<h2 style="font-size:.95rem">New accounts, last 14 days</h2>'+ bars(daily) +
        '<p class="muted" style="font-size:.8rem;margin:10px 0 0">Active = signed in and the site backed up new data in the last 7 days. 活跃 = 已登录且最近 7 天有新数据同步。</p>'+
      '</div>';
  }

  // Where visitors come from, estimated from each browser's time zone (no IP
  // is stored). Comes from its own database function, get_region_stats(),
  // so the existing get_public_stats() is left untouched. Until the SQL in
  // SUPABASE_SETUP.md has been run, this just shows a hint.
  var regEl = document.getElementById("regionContent");
  async function loadRegions(){
    var res = await sb.rpc("get_region_stats");
    if(res.error){
      regEl.innerHTML = '<div class="section"><h2>🌏 Regions</h2><p class="muted">地区统计还没启用：请先在 Supabase 的 SQL Editor 里运行 SUPABASE_SETUP.md 中“访客地区”那一段 SQL。<br><span style="font-size:.8rem">'+esc(res.error.message)+'</span></p></div>';
      return;
    }
    var r = res.data || {};
    var since = r.tracked_since ? new Date(r.tracked_since).toLocaleDateString() : null;
    var note = since
      ? 'Estimated from each browser\'s time zone (no IP address is stored). Region tracking started '+esc(since)+'; earlier visits show as 未知.'
      : 'No visit with a time zone has been recorded yet — region tracking starts once the new site version is live.';
    regEl.innerHTML =
      '<div class="section"><h2>🌏 Where visitors come from</h2>'+
        table(r.regions||[], function(x){return [x.region, x.visitors, x.visits, x.readers, x.book_opens];}, ["Region","Visitors","Visits","Readers","Books opened"])+
        '<p class="muted" style="font-size:.8rem;margin:10px 0 0">'+note+'</p></div>'+
      '<div class="section"><h2>📱 Devices</h2>'+
        table(r.devices||[], function(x){return [x.device, x.visitors, x.visits];}, ["Device","Visitors","Visits"])+'</div>';
  }

  // The sight words ("Aa"): how many children open them, how far they get, where they stop. From its own database function,
  // get_sw_stats() (supabase/sightwords_stats.sql); counts only. Until that SQL has been run this just shows a hint.
  var swEl = document.getElementById("swContent");
  async function loadSightWords(){
    var res = await sb.rpc("get_sw_stats");
    if(res.error){
      swEl.innerHTML = '<div class="section"><h2>🔤 Sight words</h2><p class="muted">高频词统计还没启用：请先在 Supabase 的 SQL Editor 里运行 supabase/sightwords_stats.sql。<br><span style="font-size:.8rem">'+esc(res.error.message)+'</span></p></div>';
      return;
    }
    var w = res.data || {};
    var finishPct = w.lesson_starts ? Math.round((w.lesson_done||0)/w.lesson_starts*100) : null;
    var daily = (w.daily||[]).map(function(r){return {date:r.date, visits:r.visits};});
    swEl.innerHTML =
      '<div class="section"><h2>🔤 Sight words</h2>'+
        '<div class="grid" style="margin-bottom:14px">'+
          card(w.visitors, "Children who opened it")+
          card(w.visitors_7d, "Opened it in the last 7 days")+
          card(w.learners, "Started a lesson")+
          card(w.finishers, "Finished a lesson")+
          card(w.lesson_starts, "Lessons started")+
          card(w.lesson_done, "Lessons finished")+
          card(finishPct===null?"—":finishPct+"%", "Finish rate")+
          card(w.chests, "Chests opened")+
        '</div>'+
        '<h2 style="font-size:.95rem">Children opening it, last 14 days</h2>'+ bars(daily) +
        '<h2 style="font-size:.95rem;margin-top:16px">Lesson by lesson</h2>'+
        table(w.by_lesson||[], function(r){return [r.lesson, r.kids, r.starts, r.done, r.quits];}, ["Lesson","Children","Started","Finished","Left halfway"])+
        '<h2 style="font-size:.95rem;margin-top:16px">Where children leave a lesson</h2>'+
        table(w.quit_steps||[], function(r){return [r.lesson, r.step, r.quits];}, ["Lesson","Step (of 20)","Times"])+
        '<h2 style="font-size:.95rem;margin-top:16px">Games</h2>'+
        table(w.games||[], function(r){return [r.game+(r.kind==="challenge"?" (unit challenge)":""), r.starts, r.done];}, ["Game","Started","Finished"])+
        '<h2 style="font-size:.95rem;margin-top:16px">Screens opened</h2>'+
        table(w.views||[], function(r){return [r.screen, r.n];}, ["Screen","Times"])+
        '<p class="muted" style="font-size:.8rem;margin:10px 0 0">Anonymous: a browser, not a person. "Children" means different browsers. 这里数的是浏览器，不是具体的孩子。</p>'+
      '</div>';
  }

  // Page errors and words that could not be played (site/error-report.js), from get_error_stats() (supabase/error_stats.sql); counts only.
  var errEl = document.getElementById("errContent");
  async function loadErrors(){
    var res = await sb.rpc("get_error_stats");
    if(res.error){
      errEl.innerHTML = '<div class="section"><h2>🐞 Errors</h2><p class="muted">错误统计还没启用：请先在 Supabase 的 SQL Editor 里运行 supabase/error_stats.sql。<br><span style="font-size:.8rem">'+esc(res.error.message)+'</span></p></div>';
      return;
    }
    var w = res.data || {};
    errEl.innerHTML =
      '<div class="section"><h2>🐞 Errors</h2>'+
        '<div class="grid" style="margin-bottom:14px">'+
          card(w.errors_7d, "Errors, last 7 days")+
          card(w.browsers_7d, "Browsers that hit one (7 days)")+
          card(w.errors_30d, "Errors, last 30 days")+
        '</div>'+
        '<h2 style="font-size:.95rem">Errors per day, last 14 days</h2>'+ bars((w.daily||[]).map(function(r){return {date:r.date, visits:r.visits};})) +
        '<h2 style="font-size:.95rem;margin-top:16px">What went wrong (7 days)</h2>'+
        table(w.by_message||[], function(r){return [r.kind, r.msg, r.spot, r.n, r.browsers];}, ["Kind","Message","Where · browser","Times","Browsers"])+
        '<h2 style="font-size:.95rem;margin-top:16px">By browser (7 days)</h2>'+
        table(w.by_browser||[], function(r){return [r.browser, r.n];}, ["Browser","Errors"])+
        '<p class="muted" style="font-size:.8rem;margin:10px 0 0">Anonymous: no user-agent string, no IP, nothing about the child. "audio" = a word that could not be played. 匿名记录：出错信息、文件、大致浏览器；"audio" 是单词发不出声。</p>'+
      '</div>';
  }

  function shortDate(iso){
    // "2026-08-05" -> "8/5" (no leading zeros, single line, narrow)
    var parts = iso.split("-");
    return (+parts[1]) + "/" + (+parts[2]);
  }
  function bars(rows){
    if(!rows || !rows.length) return '<p class="muted">No data yet.</p>';
    var max = Math.max.apply(null, rows.map(function(r){return r.visits||0;}).concat([1]));
    var values = rows.map(function(r){
      return '<span class="'+(r.visits?'has':'')+'">'+(r.visits||"")+'</span>';
    }).join("");
    var barsHtml = rows.map(function(r){
      var h = Math.round((r.visits||0)/max*88)+2;
      return '<div class="bar'+(r.visits?' has':'')+'" style="height:'+h+'px" title="'+r.date+': '+r.visits+'"></div>';
    }).join("");
    var labels = rows.map(function(r){return '<span>'+shortDate(r.date)+'</span>';}).join("");
    return '<div class="chart-row values">'+values+'</div>'+
      '<div class="chart-row bars">'+barsHtml+'</div>'+
      '<div class="chart-row labels">'+labels+'</div>';
  }

  function card(n, label){
    return '<div class="card"><div class="n">'+(n===undefined||n===null?"—":n)+'</div><div class="l">'+label+'</div></div>';
  }
  // Table cells can hold visitor-supplied text (traffic source from ?src=,
  // time zone, ...) so every value is HTML-escaped before it is rendered.
  function esc(v){
    return String(v===undefined||v===null?"":v).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function table(rows, mapper, headers){
    if(!rows || !rows.length) return '<p class="muted">No data yet.</p>';
    return '<table><tr>'+headers.map(function(h){return '<th>'+h+'</th>';}).join("")+'</tr>'+
      rows.map(function(r){var c=mapper(r);return '<tr>'+c.map(function(v){return '<td>'+esc(v)+'</td>';}).join("")+'</tr>';}).join("")+
      '</table>';
  }

  document.getElementById("reload").addEventListener("click", load);
  load();

  // --- Feedback section: owner-only, gated by Supabase magic-link sign-in.
  // Uses the same "sb" client as the public stats above, but the aggregate
  // stats stay visible to anyone with this URL — only get_all_feedback()
  // requires a matching signed-in email (checked server-side), so an
  // unauthenticated visitor here just sees a sign-in box, never any content.
  var fbEl = document.getElementById("fbContent");

  function escapeHtml(s){
    return (s||"").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function renderFbLogin(){
    fbEl.innerHTML =
      '<form id="fbLoginForm" class="fb-login">' +
      '<input id="fbLoginEmail" type="email" placeholder="your email" required>' +
      '<button type="submit">Sign in</button>' +
      '<span id="fbLoginMsg" class="muted" style="width:100%;font-size:.82rem"></span>' +
      '</form>';
    document.getElementById("fbLoginForm").addEventListener("submit", async function(e){
      e.preventDefault();
      var email = document.getElementById("fbLoginEmail").value.trim();
      var msg = document.getElementById("fbLoginMsg");
      msg.textContent = "Sending link…";
      var res = await sb.auth.signInWithOtp({ email: email, options: { emailRedirectTo: window.location.href } });
      msg.textContent = res.error ? "Error: " + res.error.message : "Check your email for a sign-in link ✉️";
    });
  }

  async function renderFbList(session){
    fbEl.innerHTML = 'Loading… <button id="fbSignOut" style="float:right">Sign out</button>';
    document.getElementById("fbSignOut").onclick = function(){ sb.auth.signOut(); };
    var res = await sb.rpc("get_all_feedback");
    if(res.error){
      fbEl.innerHTML = '<div class="err">加载失败：' + escapeHtml(res.error.message) + '</div>';
      return;
    }
    var rows = res.data || [];
    var head = '<div style="text-align:right;margin-bottom:12px"><span class="muted" style="margin-right:10px">' +
      escapeHtml(session.user.email) + '</span><button id="fbSignOut2">Sign out</button></div>';
    if(!rows.length){
      fbEl.innerHTML = head + '<p class="muted">No feedback yet.</p>';
    } else {
      fbEl.innerHTML = head + rows.map(function(r){
        var when = r.created_at ? new Date(r.created_at).toLocaleString() : "";
        return '<div class="fb-card"><p class="msg">' + escapeHtml(r.message) + '</p>' +
          '<div class="meta">' +
          '<span>🕓 ' + when + '</span>' +
          (r.email ? '<span>✉️ ' + escapeHtml(r.email) + '</span>' : '') +
          (r.page_title ? '<span>📄 ' + escapeHtml(r.page_title) + '</span>' : '') +
          '</div></div>';
      }).join("");
    }
    document.getElementById("fbSignOut2") && (document.getElementById("fbSignOut2").onclick = function(){ sb.auth.signOut(); });
  }

  sb.auth.onAuthStateChange(function(event, session){
    if(session) renderFbList(session); else renderFbLogin();
  });
  var fbSession = (await sb.auth.getSession()).data.session;
  if(fbSession) renderFbList(fbSession); else renderFbLogin();
})();
</script>
</body></html>
