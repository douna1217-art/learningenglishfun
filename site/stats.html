<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>learningenglishfun · Stats</title>
<style>
:root{--ink:#26372e;--muted:#718077;--line:#dfe8e1;--green:#315f47;--shadow:0 18px 42px rgba(46,66,55,.12)}
*{box-sizing:border-box}body{margin:0;background:#f5f7f4;color:var(--ink);font-family:ui-rounded,"Trebuchet MS",Arial,sans-serif;padding:24px}
.wrap{max-width:960px;margin:0 auto}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:26px}
.card{background:#fff;border-radius:18px;padding:18px 20px;box-shadow:var(--shadow)}
.card .n{font-size:2rem;font-weight:800}
.card .l{color:var(--muted);font-size:.85rem;margin-top:4px}
.section{background:#fff;border-radius:18px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
.section h2{font-size:1.05rem;margin:0 0 12px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.err{background:#fff0ee;color:#b23b34;border-radius:12px;padding:14px;margin-bottom:16px}
button{border:0;background:var(--green);color:#fff;border-radius:10px;padding:9px 16px;font-weight:800;cursor:pointer}
.chart-row{display:flex;gap:4px}
.chart-row.values,.chart-row.labels{margin:0}
.chart-row.values span,.chart-row.labels span{flex:1;min-width:0;text-align:center;font-size:.72rem;color:var(--muted);line-height:1.3}
.chart-row.values span{height:16px;font-weight:700}
.chart-row.values span.has{color:var(--ink)}
.chart-row.bars{align-items:flex-end;height:90px;margin:2px 0}
.chart-row.bars .bar{flex:1;min-width:0;background:var(--line);border-radius:3px 3px 0 0;min-height:2px}
.chart-row.bars .bar.has{background:var(--green)}
@media(max-width:480px){
  .chart-row.labels span{visibility:hidden}
  .chart-row.labels span:nth-child(3n+1),
  .chart-row.labels span:last-child{visibility:visible}
}
.fb-card{background:#fff;border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:12px}
.fb-card .msg{font-size:.98rem;line-height:1.5;white-space:pre-wrap;margin:0 0 8px}
.fb-card .meta{display:flex;flex-wrap:wrap;gap:8px;font-size:.76rem;color:var(--muted)}
.fb-card .meta span{background:#f1f4f1;border-radius:999px;padding:3px 9px}
.fb-login{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fb-login input[type=email]{border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:.9rem;width:210px}
</style></head>
<body><div class="wrap">
<h1>📊 Site stats</h1>
<p class="sub">Aggregated usage numbers only — no individual visitor data. <button id="reload">Refresh</button></p>
<div id="content">Loading…</div>
<div class="section"><h2>💬 Feedback</h2><div id="fbContent">Loading…</div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(async function(){
  var el = document.getElementById("content");
  var cfg = window.SUPABASE_CONFIG;
  var configured = window.supabase && cfg && cfg.url && cfg.anonKey &&
    cfg.url.indexOf("YOUR-PROJECT")===-1 && cfg.anonKey.indexOf("YOUR-ANON-KEY")===-1;
  if(!configured){
    el.innerHTML = '<div class="err">Supabase 还没配置（supabase-config.js 还是占位符），没有数据可看。</div>';
    return;
  }
  var sb = window.supabase.createClient(cfg.url, cfg.anonKey);

  async function load(){
    el.innerHTML = "Loading…";
    var res = await sb.rpc("get_public_stats");
    if(res.error){
      el.innerHTML = '<div class="err">加载失败：'+res.error.message+'</div>';
      return;
    }
    var d = res.data || {};
    var books = d.top_books || [];
    var cats = d.top_categories || [];
    var totalReview = (d.review_correct||0) + (d.review_wrong||0);
    var accuracy = totalReview ? Math.round((d.review_correct||0)/totalReview*100) : null;

    var signedInPct = d.unique_visitors ? Math.round((d.signed_in_visitors||0)/d.unique_visitors*100) : null;
    var sources = d.top_sources || [];
    var daily = d.daily_visits || [];

    el.innerHTML =
      '<div class="grid">'+
        card(d.total_visits, "Page views") +
        card(d.unique_visitors, "Unique visitors") +
        card(d.total_book_opens, "Books opened") +
        card(d.unique_readers, "Unique readers") +
        card(totalReview, "Review answers") +
        card(accuracy===null?"—":accuracy+"%", "Review accuracy") +
        card(d.signed_in_visitors||0, "Signed-in (sync) visitors") +
        card(signedInPct===null?"—":signedInPct+"%", "Sync adoption rate") +
      '</div>'+
      '<div class="section"><h2>📈 Visits, last 14 days</h2>'+ bars(daily) +'</div>'+
      '<div class="section"><h2>🔗 Traffic sources</h2>'+ table(sources, function(r){return [r.source, r.visits];}, ["Source","Visits"]) +'</div>'+
      '<div class="section"><h2>📚 Most-read books</h2>'+ table(books, function(r){return [r.book_title||r.book_id, r.opens];}, ["Book","Opens"]) +'</div>'+
      '<div class="section"><h2>🗂️ Most-read topics</h2>'+ table(cats, function(r){return [r.category, r.opens];}, ["Topic","Opens"]) +'</div>'+
      '<p class="muted">Last updated: '+(d.last_updated||"")+'</p>';
  }

  function shortDate(iso){
    // "2026-08-05" -> "8/5" (no leading zeros, single line, narrow)
    var parts = iso.split("-");
    return (+parts[1]) + "/" + (+parts[2]);
  }
  function bars(rows){
    if(!rows || !rows.length) return '<p class="muted">No data yet.</p>';
    var max = Math.max.apply(null, rows.map(function(r){return r.visits||0;}).concat([1]));
    var values = rows.map(function(r){
      return '<span class="'+(r.visits?'has':'')+'">'+(r.visits||"")+'</span>';
    }).join("");
    var barsHtml = rows.map(function(r){
      var h = Math.round((r.visits||0)/max*88)+2;
      return '<div class="bar'+(r.visits?' has':'')+'" style="height:'+h+'px" title="'+r.date+': '+r.visits+'"></div>';
    }).join("");
    var labels = rows.map(function(r){return '<span>'+shortDate(r.date)+'</span>';}).join("");
    return '<div class="chart-row values">'+values+'</div>'+
      '<div class="chart-row bars">'+barsHtml+'</div>'+
      '<div class="chart-row labels">'+labels+'</div>';
  }

  function card(n, label){
    return '<div class="card"><div class="n">'+(n===undefined||n===null?"—":n)+'</div><div class="l">'+label+'</div></div>';
  }
  function table(rows, mapper, headers){
    if(!rows || !rows.length) return '<p class="muted">No data yet.</p>';
    return '<table><tr>'+headers.map(function(h){return '<th>'+h+'</th>';}).join("")+'</tr>'+
      rows.map(function(r){var c=mapper(r);return '<tr>'+c.map(function(v){return '<td>'+v+'</td>';}).join("")+'</tr>';}).join("")+
      '</table>';
  }

  document.getElementById("reload").addEventListener("click", load);
  load();

  // --- Feedback section: owner-only, gated by Supabase magic-link sign-in.
  // Uses the same "sb" client as the public stats above, but the aggregate
  // stats stay visible to anyone with this URL — only get_all_feedback()
  // requires a matching signed-in email (checked server-side), so an
  // unauthenticated visitor here just sees a sign-in box, never any content.
  var fbEl = document.getElementById("fbContent");

  function escapeHtml(s){
    return (s||"").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function renderFbLogin(){
    fbEl.innerHTML =
      '<form id="fbLoginForm" class="fb-login">' +
      '<input id="fbLoginEmail" type="email" placeholder="your email" required>' +
      '<button type="submit">Sign in</button>' +
      '<span id="fbLoginMsg" class="muted" style="width:100%;font-size:.82rem"></span>' +
      '</form>';
    document.getElementById("fbLoginForm").addEventListener("submit", async function(e){
      e.preventDefault();
      var email = document.getElementById("fbLoginEmail").value.trim();
      var msg = document.getElementById("fbLoginMsg");
      msg.textContent = "Sending link…";
      var res = await sb.auth.signInWithOtp({ email: email, options: { emailRedirectTo: window.location.href } });
      msg.textContent = res.error ? "Error: " + res.error.message : "Check your email for a sign-in link ✉️";
    });
  }

  async function renderFbList(session){
    fbEl.innerHTML = 'Loading… <button id="fbSignOut" style="float:right">Sign out</button>';
    document.getElementById("fbSignOut").onclick = function(){ sb.auth.signOut(); };
    var res = await sb.rpc("get_all_feedback");
    if(res.error){
      fbEl.innerHTML = '<div class="err">加载失败：' + escapeHtml(res.error.message) + '</div>';
      return;
    }
    var rows = res.data || [];
    var head = '<div style="text-align:right;margin-bottom:12px"><span class="muted" style="margin-right:10px">' +
      escapeHtml(session.user.email) + '</span><button id="fbSignOut2">Sign out</button></div>';
    if(!rows.length){
      fbEl.innerHTML = head + '<p class="muted">No feedback yet.</p>';
    } else {
      fbEl.innerHTML = head + rows.map(function(r){
        var when = r.created_at ? new Date(r.created_at).toLocaleString() : "";
        return '<div class="fb-card"><p class="msg">' + escapeHtml(r.message) + '</p>' +
          '<div class="meta">' +
          '<span>🕓 ' + when + '</span>' +
          (r.email ? '<span>✉️ ' + escapeHtml(r.email) + '</span>' : '') +
          (r.page_title ? '<span>📄 ' + escapeHtml(r.page_title) + '</span>' : '') +
          '</div></div>';
      }).join("");
    }
    document.getElementById("fbSignOut2") && (document.getElementById("fbSignOut2").onclick = function(){ sb.auth.signOut(); });
  }

  sb.auth.onAuthStateChange(function(event, session){
    if(session) renderFbList(session); else renderFbLogin();
  });
  var fbSession = (await sb.auth.getSession()).data.session;
  if(fbSession) renderFbList(fbSession); else renderFbLogin();
})();
</script>
</body></html>
