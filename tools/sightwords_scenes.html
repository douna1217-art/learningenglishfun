<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sight-word pictures, overview</title>
<style>
body{margin:0;background:#F4FAFF;font-family:'Nunito',ui-rounded,system-ui,sans-serif;color:#1E2A4A}
h1{font-size:22px;margin:14px 16px 4px}p.n{margin:0 16px 10px;color:#4A5878;font-weight:700;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding:10px 16px 40px}
.c{background:#fff;border-radius:16px;padding:8px;box-shadow:0 3px 0 #C9D7E8}
.c svg{width:100%;height:auto;display:block;border-radius:12px}
.c b{display:block;margin:6px 4px 0;font-size:15px}.c span{display:block;margin:0 4px 2px;font-size:13px;color:#4A5878;font-weight:700}
</style></head><body>
<h1>Sight-word pictures: Stage 1 (92), Stage 2 (87), Stage 3 (136), Stage 4 (140), Stage 5 (140) and Stage 6 (140)</h1><p class="n" id="n"></p>
<div class="grid" id="g"></div>
<script src="pet-art.js"></script><script src="sightwords-data.js"></script><script src="sightwords-data2.js"></script><script src="sightwords-data3.js"></script><script src="sightwords-data4.js"></script><script src="sightwords-data5.js"></script><script src="sightwords-data6.js"></script><script src="sightwords-art.js"></script><script src="sightwords-art3.js"></script><script src="sightwords-art4.js"></script><script src="sightwords-art5.js"></script><script src="sightwords-art6.js"></script>
<script>
var g=document.getElementById('g'),h='',miss=[],total=0;
var only=(location.search.match(/stage=(\d)/)||[])[1], pick=(location.search.match(/w=([a-z,]+)/)||[])[1];
pick=pick?pick.split(','):null;
[[SW_DATA,'1'],[SW_DATA2,'2'],[SW_DATA3,'3'],[SW_DATA4,'4'],[SW_DATA5,'5'],[SW_DATA6,'6']].forEach(function(p){var D=p[0];if(only&&only!==p[1])return;
 h+='<h2 style="grid-column:1/-1;margin:10px 0 0;font-size:18px">Stage '+p[1]+'</h2>';
 D.lessons.forEach(function(l){l.words.forEach(function(w){if(pick&&pick.indexOf(w.toLowerCase().replace(/[^a-z]/g,''))<0)return;total++;var k=SWArt.has(w);if(!k){miss.push(w);return;}
 h+='<div class="c" id="w-'+w.toLowerCase().replace(/[^a-z]/g,'')+'">'+SWArt.scene(w)+'<b>'+l.id+'. '+w+'</b><span>'+D.words[w].s+'</span></div>';});});});
g.innerHTML=h;document.getElementById('n').textContent=(total-miss.length)+' of '+total+' pictures'+(miss.length?'; missing: '+miss.join(', '):'');
</script></body></html>
