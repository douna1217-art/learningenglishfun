# The health check of the whole book library (tools/site_audit.py), including the pictures and the audio on the media server.
# It runs by itself on the 1st of every month and whenever you press "Run workflow" on the Actions page.
# The report is attached to the run (Artifacts > library-audit) and its top is shown on the run's page.
# The run turns red when it finds an error, so GitHub sends you an e-mail.
name: library audit

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check every book, picture and audio file
        id: audit
        run: python3 tools/site_audit.py --online --fail-on error
        continue-on-error: true
      - name: What the audit found (in the log)
        if: always()
        run: |
          python3 - <<'PY'
          import json, re, collections
          d = json.load(open("tools/audit/report.json"))
          F = d["findings"]
          c = collections.Counter((x["check"], x["sev"]) for x in F)
          for k, v in sorted(c.items()):
              print(k, v)
          print()
          kinds = collections.Counter()
          for x in F:
              if x["sev"] != "info":
                  kinds[(x["check"], x["sev"], re.sub(r"\d+(\.\d+)?", "N", x["msg"])[:90])] += 1
          for k, v in kinds.most_common(40):
              print(v, k)
          print()
          seen = collections.Counter()
          for x in F:
              if x["check"] == "media" and x["sev"] == "error":
                  k = re.sub(r"page \S+", "page N", x["msg"])
                  seen[k] += 1
                  if seen[k] <= 3:
                      print("example:", x["topic"] + "/" + x["slug"], x["msg"])
          PY
      - name: Keep the report
        uses: actions/upload-artifact@v4
        with:
          name: library-audit
          path: tools/audit/
      - name: Show the top of the report
        run: head -n 60 tools/audit/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Fail when there were errors
        if: steps.audit.outcome == 'failure'
        run: |
          echo "The audit found errors: read tools/audit/report.md in the artifact."
          exit 1
